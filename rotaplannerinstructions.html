<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota Planner — How to Use | Worship & AV Hub</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: #3d6263; font-family: 'Segoe UI', Arial, sans-serif; }

  .site-header {
    height: 90px; background: #ffffff; padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #d1dfdf;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .tut-outer { background: #3d6263; padding: 28px 20px 48px; min-height: calc(100vh - 90px); }
  .tut-inner {
    background: #ffffff; border-radius: 14px; padding: 28px;
    max-width: 760px; margin: 0 auto;
  }

  .chapter-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
  .chapter-pill {
    font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px;
    cursor: pointer; border: 1.5px solid #d1dfdf; color: #7a9a9a; background: #f4f8f8;
    transition: all 0.15s;
  }
  .chapter-pill:hover { border-color: #3d6263; color: #3d6263; }
  .chapter-pill.active { background: #3d6263; color: #fff; border-color: #3d6263; }

  .tut-heading { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: #3d6263; letter-spacing: 0.06em; text-transform: uppercase; }
  .tut-subheading { margin: 0 0 18px; font-size: 13px; color: #7a9a9a; }

  .progress-bar-bg { height: 5px; background: #d1dfdf; border-radius: 3px; margin-bottom: 1.5rem; }
  .progress-bar-fill { height: 5px; background: #3d6263; border-radius: 3px; transition: width 0.35s ease; }

  .step-badge { display: inline-block; font-size: 12px; color: #3d6263; background: #e6f0f0; border-radius: 20px; padding: 3px 11px; margin-bottom: 10px; }
  .step-title { font-size: 19px; font-weight: 700; color: #1a2e2e; margin: 0 0 8px; }
  .step-desc { font-size: 15px; color: #4a6060; line-height: 1.75; margin: 0 0 1.25rem; }

  .sim-area { border: 1px solid #d1dfdf; border-radius: 10px; overflow: hidden; margin-bottom: 1.25rem; background: #fff; }
  .sim-topbar { background: #f4f8f8; border-bottom: 1px solid #d1dfdf; padding: 10px 16px; font-size: 14px; font-weight: 700; color: #3d6263; }
  .sim-body { padding: 16px; }

  .highlight { outline: 2.5px solid #3d6263; border-radius: 6px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{ outline-color:#3d6263; } 50%{ outline-color:#7aa8a9; } }

  .tip-box { background: #e6f0f0; border: 1px solid #a0c0c0; border-radius: 8px; padding: 11px 15px; font-size: 13px; color: #2e5050; margin-bottom: 1.25rem; line-height: 1.6; }
  .tip-box::before { content: "💡 "; }
  .warn-box { background: #fff8e6; border: 1px solid #e0c060; border-radius: 8px; padding: 11px 15px; font-size: 13px; color: #7a5500; margin-bottom: 1.25rem; line-height: 1.6; }
  .warn-box::before { content: "⚠️ "; }
  .admin-box { background: #f8f0ff; border: 1px solid #c8a0e0; border-radius: 8px; padding: 11px 15px; font-size: 13px; color: #5a2e80; margin-bottom: 1.25rem; line-height: 1.6; }
  .admin-box::before { content: "🔧 "; }

  .nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .nav-btn { background: #fff; border: 1px solid #b0c8c8; border-radius: 8px; padding: 9px 22px; font-size: 14px; cursor: pointer; color: #3d6263; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; }
  .nav-btn:hover { background: #f4f8f8; }
  .nav-btn.primary { background: #3d6263; border-color: #3d6263; color: #fff; }
  .nav-btn.primary:hover { background: #2e4e4f; }
  .step-counter { font-size: 13px; color: #7a9a9a; text-align: center; }

  /* Sim UI shared */
  .sim-btn { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; cursor: default; }
  .sim-btn-teal { background: #3d6263; color: #fff; }
  .sim-btn-light { background: #f0f6f6; color: #3d6263; border: 1.5px solid #d1dfdf; }
  .sim-btn-dark { background: #1a2e2e; color: #fff; }
  .sim-pill { display: inline-block; background: #f4f8f8; border: 1px solid #d1dfdf; border-radius: 50px; padding: 4px 12px; font-size: 11px; font-weight: 700; color: #3d6263; margin: 2px; }
  .sim-tag { display: inline-block; background: #f0f6f6; border: 1px solid #d1dfdf; border-radius: 8px; padding: 3px 10px; font-size: 11px; font-weight: 700; color: #3d6263; margin: 2px; }
  .sim-input { display: inline-block; background: #fff; border: 1px solid #d1dfdf; border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: #3d6263; }

  /* Role card */
  .role-card { display: inline-block; border: 2px dashed #d1dfdf; border-radius: 14px; padding: 10px 14px; min-width: 120px; margin: 4px; vertical-align: top; }
  .role-card.assigned { border-style: solid; border-color: #3d6263; }
  .role-card.av { border-color: #e8a000; }
  .role-label { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: #3d6263; opacity: 0.5; margin-bottom: 4px; }
  .role-name { font-size: 12px; font-weight: 700; color: #3d6263; }
  .role-name.unassigned { color: #d1dfdf; font-style: italic; }

  /* Avail bucket */
  .bucket { border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  .bucket-label { font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
  .avail-chip { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; margin: 2px; cursor: grab; }

  /* Event row */
  .event-row { border: 1px solid #d1dfdf; border-radius: 14px; padding: 12px 16px; margin-bottom: 8px; background: #fff; }

  /* Send UI mockup */
  .send-card { background: #fff; border: 1px solid #d1dfdf; border-radius: 14px; padding: 16px; margin-bottom: 10px; }
  .send-log { background: #1e2a2a; color: #a8d5b5; border-radius: 10px; padding: 12px 14px; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.7; }
  .log-ok { color: #7ee8a2; }
  .log-inf { color: #8ecae6; }
  .log-err { color: #ff8a8a; }

  .finish-box { text-align: center; padding: 2rem 0; }
  .finish-box h2 { font-size: 24px; font-weight: 700; color: #3d6263; margin: 0 0 10px; }
  .finish-box p { color: #4a6060; font-size: 15px; line-height: 1.7; margin: 0 0 1.25rem; }

  .step-num { display: inline-block; background: #3d6263; color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; font-weight: 800; text-align: center; line-height: 22px; margin-right: 6px; flex-shrink: 0; }
  .step-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; font-size: 13px; color: #4a6060; line-height: 1.6; }
</style>
</head>
<body>

<div class="site-header">
  <img src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media&token=ea8cd929-6f35-4a23-9ffa-e78ac46fa300"
       style="height:75px;width:auto;margin-top:8px;" alt="Church logo">
  <div style="text-align:right;margin-top:8px;">
    <div style="font-size:10px;color:#a0b0b0;text-transform:uppercase;letter-spacing:0.05em;">Secure Portal</div>
    <div style="font-size:12px;color:#3d6263;font-weight:700;">Worship & AV Hub</div>
  </div>
</div>

<div class="tut-outer">
  <div class="tut-inner">

    <p class="tut-heading">Master Rota Planner — How to use</p>
    <p class="tut-subheading">Click any chapter to jump ahead, or use Next to work through from the beginning.</p>

    <div class="chapter-nav" id="chapterNav"></div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog"></div></div>
    <div id="step-content"></div>

    <div class="nav-row">
      <button class="nav-btn" id="btn-prev" onclick="changeStep(-1)">← Back</button>
      <span class="step-counter" id="step-ctr"></span>
      <button class="nav-btn primary" id="btn-next" onclick="changeStep(1)">Next →</button>
    </div>

  </div>
</div>

<script>
const chapters = [
  { label: "Overview" },
  { label: "Building the Rota" },
  { label: "Availability" },
  { label: "Assigning People" },
  { label: "Exports & PDFs" },
  { label: "Sending Rotas" },
];

const steps = [

  // ── CHAPTER 1: OVERVIEW ──
  {
    chapter: 0,
    badge: "Chapter 1 — Overview",
    title: "What is the Master Rota Planner?",
    desc: "The Master Rota Planner is the central tool for organising who serves at each service across the whole term. It handles everything from creating services and gathering availability, right through to automatically assigning people to roles and distributing personalised rotas to the whole team by email.",
    tip: "This is an admin-only tool — changes made here affect the live rota for everyone. Take your time and use the Auto-Populate feature as a starting point, then adjust manually.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Master Rota Planner — at a glance</div>
        <div class="sim-body" style="text-align:center;padding:24px 16px">
          <p style="font-size:28px;margin:0 0 10px">📋</p>
          <p style="font-size:14px;color:#4a6060;margin:0 0 20px">Everything you need to manage the team rota in one place</p>
          <div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap">
            <div style="text-align:center;font-size:12px;color:#4a6060"><div style="font-size:20px">🗓️</div>Build the term</div>
            <div style="text-align:center;font-size:12px;color:#4a6060"><div style="font-size:20px">✅</div>Gather availability</div>
            <div style="text-align:center;font-size:12px;color:#4a6060"><div style="font-size:20px">🤖</div>Auto-assign roles</div>
            <div style="text-align:center;font-size:12px;color:#4a6060"><div style="font-size:20px">📧</div>Send personalised rotas</div>
          </div>
        </div>
      </div>`
  },
  {
    chapter: 0,
    badge: "Chapter 1 — Overview",
    title: "The two toolbar panels",
    desc: "At the top of the page are two groups of buttons. The <strong>left panel</strong> contains all the tools for building and managing the rota — creating services, auto-populating, and sending rotas. The <strong>right panel</strong> contains the export tools — generating PDFs and Excel files.<br><br>You'll use the left panel most of the time during planning.",
    tip: "Don't worry about memorising all the buttons — this walkthrough covers each one in turn.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Top toolbar — two panels</div>
        <div class="sim-body">
          <div style="display:flex;gap:6px;flex-wrap:wrap;background:#f4f8f8;padding:12px;border-radius:12px;margin-bottom:10px">
            <span style="font-size:9px;font-weight:800;text-transform:uppercase;color:#3d6263;opacity:0.5;width:100%;margin-bottom:4px">Left panel — planning tools</span>
            <span class="sim-btn sim-btn-light">Term ▾</span>
            <span class="sim-btn sim-btn-light">Populate</span>
            <span class="sim-btn sim-btn-teal">Auto-Populate</span>
            <span class="sim-btn sim-btn-teal">Add Practices</span>
            <span class="sim-btn sim-btn-teal">+ Service</span>
            <span class="sim-btn sim-btn-light">Gather Avail</span>
            <span class="sim-btn sim-btn-light">Hide Assigned</span>
            <span class="sim-btn sim-btn-dark highlight">🚀 Send All Rotas</span>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;background:#f4f8f8;padding:12px;border-radius:12px">
            <span style="font-size:9px;font-weight:800;text-transform:uppercase;color:#3d6263;opacity:0.5;width:100%;margin-bottom:4px">Right panel — exports</span>
            <span class="sim-btn sim-btn-light">Full PDF</span>
            <span class="sim-btn sim-btn-light">Excel</span>
            <span class="sim-btn sim-btn-light" style="min-width:140px">Select Member ▾</span>
            <span class="sim-btn sim-btn-teal">Indiv</span>
            <span class="sim-btn sim-btn-teal">Home</span>
            <span class="sim-btn sim-btn-teal">Wall</span>
          </div>
        </div>
      </div>`
  },

  // ── CHAPTER 2: BUILDING THE ROTA ──
  {
    chapter: 1,
    badge: "Chapter 2 — Building the Rota",
    title: "Generating a full term of services",
    desc: "To quickly create all the Sunday services for a term, use the <strong>Term</strong> dropdown and <strong>Populate</strong> button:<br><br>1. Click the <strong>Term</strong> dropdown and choose Spring, Summer, or Autumn.<br>2. Click <strong>Populate</strong>.<br><br>The planner will automatically create a Sunday Morning Worship service for every Sunday in that term, with the default roles and times already filled in.",
    tip: "Populate creates the Sundays — you then use Add Practices to add the Thursday rehearsals separately.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Generating a term</div>
        <div class="sim-body">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <select class="sim-input highlight" style="min-width:120px">
              <option>Autumn</option>
              <option>Spring</option>
              <option>Summer</option>
            </select>
            <span class="sim-btn sim-btn-light highlight">Populate</span>
            <span style="font-size:11px;color:#7a9a9a;font-style:italic">← then click this</span>
          </div>
          <div style="margin-top:14px;padding:10px 14px;background:#e6f0f0;border-radius:8px;font-size:12px;color:#3d6263;font-weight:700">
            ✓ 13 Sunday Morning Worship services created for Autumn 2025
          </div>
        </div>
      </div>`
  },
  {
    chapter: 1,
    badge: "Chapter 2 — Building the Rota",
    title: "Adding Thursday practices",
    desc: "Once you've generated the Sundays, click <strong>Add Practices</strong> (with the same term still selected) to automatically add a Thursday evening rehearsal for every week in the term.<br><br>Each Thursday practice is set up with the worship roles (Worship Leader, Keyboard, Guitar, Drums, Bass) and the default rehearsal times of 7:30–9:30pm.",
    tip: "Practices are linked to the following Sunday — the Sync button on each practice will copy across the same people who are assigned to that Sunday, so you don't have to assign them twice.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Adding Thursday practices</div>
        <div class="sim-body">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
            <span class="sim-btn sim-btn-teal highlight">Add Practices</span>
            <span style="font-size:11px;color:#7a9a9a;font-style:italic">← adds Thursdays for the selected term</span>
          </div>
          <div class="event-row" style="border-style:dashed;border-color:#d1dfdf;background:#f8fbfb">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span style="background:#d1dfdf;color:#3d6263;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700">Thu 2 Oct</span>
              <span style="font-size:11px;color:#3d6263;font-weight:700">19:30–21:30</span>
              <span style="font-size:11px;color:#3d6263;font-weight:700">Sunday Team Practice</span>
              <span style="font-size:10px;color:#7a9a9a">Thursday Rehearsal</span>
              <span class="sim-btn sim-btn-light" style="font-size:9px;padding:3px 10px;margin-left:auto">⟳ Sync</span>
            </div>
          </div>
          <div class="event-row">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span style="background:#3d6263;color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700">Sun 5 Oct</span>
              <span style="font-size:11px;color:#3d6263;font-weight:700">08:00–11:30</span>
              <span style="font-size:11px;color:#3d6263;font-weight:700">Sunday Morning Worship</span>
            </div>
          </div>
        </div>
      </div>`
  },
  {
    chapter: 1,
    badge: "Chapter 2 — Building the Rota",
    title: "Adding a single service or event",
    desc: "To add a one-off service or special event — like a Carol Service, LOUD Worship, or a team meeting — click <strong>+ Service</strong>. A new row appears at the bottom of the current term with today's date and the type set to Sunday Morning Worship.<br><br>You can then:<br>• Change the <strong>date</strong> by clicking the date field<br>• Change the <strong>type</strong> using the dropdown (Carol Service, LOUD Worship, Team Meeting, etc.)<br>• Change the <strong>start and end times</strong> using the time dropdowns<br>• Add a <strong>note</strong> in the description box",
    tip: "Use the team checkboxes (Core Team, Worship Team, AV Team, Choir, Youth) to control which team members appear in the availability bucket for that event.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Adding and editing a single service</div>
        <div class="sim-body">
          <div style="margin-bottom:12px;display:flex;gap:8px">
            <span class="sim-btn sim-btn-teal highlight">+ Service</span>
          </div>
          <div class="event-row">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <input type="date" class="sim-input" value="2025-12-14" style="padding:4px 8px;">
              <select class="sim-input" style="min-width:180px">
                <option selected>Evening Carol Service</option>
                <option>Sunday Morning Worship</option>
                <option>LOUD Worship</option>
              </select>
              <select class="sim-input" style="width:70px"><option>18:00</option></select>
              <span style="font-size:11px;color:#3d6263;opacity:0.4">–</span>
              <select class="sim-input" style="width:70px"><option>20:00</option></select>
              <input class="sim-input" placeholder="Notes..." style="flex:1;min-width:100px;font-weight:400">
            </div>
            <div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap">
              <label style="font-size:10px;font-weight:700;color:#3d6263;display:flex;align-items:center;gap:4px"><input type="checkbox" checked> Core Team</label>
              <label style="font-size:10px;font-weight:700;color:#3d6263;display:flex;align-items:center;gap:4px"><input type="checkbox" checked> Worship Team</label>
              <label style="font-size:10px;font-weight:700;color:#3d6263;display:flex;align-items:center;gap:4px"><input type="checkbox"> AV Team</label>
              <label style="font-size:10px;font-weight:700;color:#3d6263;display:flex;align-items:center;gap:4px"><input type="checkbox"> Choir</label>
            </div>
          </div>
        </div>
      </div>`
  },
  {
    chapter: 1,
    badge: "Chapter 2 — Building the Rota",
    title: "Collapsing and archiving terms",
    desc: "Each term has a teal header bar. Click the <strong>term name</strong> in the header to collapse or expand all the services in that term — useful for focusing on the current term without the others getting in the way.<br><br>Once a term is finished, click the <strong>Archive</strong> button in the header to hide all its services from the main view. Archived services are still stored — they just don't clutter the planner.",
    tip: "Archive old terms at the start of each new term to keep the planner clean and fast.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Term header — collapse and archive</div>
        <div class="sim-body" style="padding:0">
          <div style="background:#3d6263;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:8px 8px 0 0">
            <button style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:#fff;background:none;border:none;cursor:pointer" class="highlight">▼ &nbsp;Autumn 2025</button>
            <span class="sim-btn" style="background:rgba(255,255,255,0.2);color:#fff;font-size:10px;padding:4px 14px">Archive</span>

  // ── CHAPTER 3: AVAILABILITY ──
  {
    chapter: 2,
    badge: "Chapter 3 — Availability",
    title: "Gathering availability from the team",
    desc: "Before you can assign people, you need to know who is available. Click <strong>Gather Avail</strong> to send an availability request email to the whole team for a specific term.<br><br>A prompt asks which term you want to gather for. After you confirm, your email client opens with a pre-addressed email to all the relevant team members, containing a link to the availability form they fill in online.",
    tip: "Only team members who are marked as being in the relevant teams (Worship Team, AV Team, etc.) for that term's events will be emailed — so you won't send it to people who aren't involved.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Gathering availability</div>
        <div class="sim-body">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px">
            <span class="sim-btn sim-btn-light highlight">Gather Avail</span>
            <span style="font-size:11px;color:#7a9a9a;font-style:italic">← opens your email with the form link</span>

            <div style="background:#f4f8f8;padding:8px 14px;font-weight:700;color:#3d6263;font-size:11px">Email preview</div>
            <div style="padding:12px 14px">
              <div style="margin-bottom:4px"><span style="color:#7a9a9a;font-weight:700">To:</span> av@esherchurch.org</div>
              <div style="margin-bottom:4px"><span style="color:#7a9a9a;font-weight:700">BCC:</span> sarah@example.com; james@example.com; ruth@example.com ...</div>
              <div style="margin-bottom:4px"><span style="color:#7a9a9a;font-weight:700">Subject:</span> Availability Request</div>
              <div style="color:#4a6060">Please click here: [availability form link]</div>
            </div>
          </div>
        </div>
      </div>`
  },
  {
    chapter: 2,
    badge: "Chapter 3 — Availability",
    title: "The availability bucket",
    desc: "Each service has a <strong>bucket icon</strong> (📥) on the right side of its row. Click it to open the availability panel for that service, which shows three sections:<br><br><strong style='color:#16a34a'>Available</strong> — people who said they can serve<br><strong style='color:#dc2626'>Declined</strong> — people who said they can't<br><strong style='color:#9ca3af'>Pending</strong> — people who haven't responded yet<br><br>You can drag people between the three sections to manually adjust their status.",
    tip: "Orange names in the role cards mean that person hasn't responded to availability yet — they may have been assigned before responses came in. Worth checking before finalising.",
    render: () => `
      <div class="sim-area">

let current = 0;

function buildChapterNav() {
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = '';
  chapters.forEach((ch, i) => {
    const pill = document.createElement('button');
    pill.className = 'chapter-pill' + (i === steps[current].chapter ? ' active' : '');
    pill.textContent = ch.label;
    pill.onclick = () => jumpToChapter(i);
    nav.appendChild(pill);
  });
}

function jumpToChapter(chIdx) {
  const idx = steps.findIndex(s => s.chapter === chIdx);
  if (idx !== -1) { current = idx; render(); }
}

function render() {
  const s = steps[current];
  const pct = Math.round(((current + 1) / steps.length) * 100);
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('step-ctr').textContent = `Step ${current + 1} of ${steps.length}`;
  document.getElementById('btn-prev').style.visibility = current === 0 ? 'hidden' : 'visible';
  document.getElementById('btn-next').style.display = '';
  document.getElementById('btn-prev').style.display = '';
  document.getElementById('btn-next').textContent = current === steps.length - 1 ? 'Finish ✓' : 'Next →';
  buildChapterNav();

  document.getElementById('step-content').innerHTML = `
    <span class="step-badge">${s.badge}</span>
    <p class="step-title">${s.title}</p>
    <p class="step-desc">${s.desc}</p>
    ${s.render()}
    <div class="tip-box">${s.tip}</div>
  `;
}

function changeStep(dir) {
  if (current + dir < 0) return;
  if (current + dir >= steps.length) {
    document.getElementById('step-content').innerHTML = `
      <div class="finish-box">
        <h2>All done! 🎉</h2>
        <p>You now know how to use the Master Rota Planner from start to finish — building the term, gathering availability, assigning people, and sending personalised rotas to the whole team.<br><br>Use the chapter buttons above to jump back to any section at any time.</p>
        <button class="nav-btn primary" onclick="current=0;render()">Start again from the beginning</button>
      </div>
      <div class="tip-box" style="margin-top:1.5rem">Remember: if you need the EGBC Rota Sender shortcut installed on your desktop, contact admin.</div>
    `;
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('btn-prev').style.display = 'none';
    document.getElementById('step-ctr').textContent = 'Complete ✓';
    document.getElementById('prog').style.width = '100%';
    buildChapterNav();
    return;
  }
  current += dir;
  render();
}

render();
