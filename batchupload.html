<!DOCTYPE html>
<html>
<head>
<title>Batch Music Importer (Final Working + YouTube Helper)</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body { font-family: Arial; padding: 20px; }

.dropzone {
border: 3px dashed #ccc;
padding: 30px;
text-align: center;
border-radius: 15px;
cursor: pointer;
margin-bottom: 15px;
}

table { border-collapse: collapse; width: 100%; font-size: 12px; }
td, th { border: 1px solid #ddd; padding: 6px; }

.status-new { background:#d4edda; }
.status-exists { background:#f8d7da; }
.status-review { background:#fff3cd; }
.status-skipped { background:#e0e0e0; }

input, select { width: 100%; }
button { margin: 2px; }
</style>
</head>

<body>

<h2>Batch Music Importer</h2>

<div class="dropzone" id="dropzone">
Drag folder OR click to select
</div>

<input type="file" id="fileInput" multiple webkitdirectory style="display:none">

<div id="status"></div>

<button onclick="processAll()">Upload</button>

<table>
<thead>
<tr>
<th>File</th>
<th>Title</th>
<th>Key</th>
<th>Type</th>
<th>Match</th>
<th>YouTube</th>
<th>CCLI</th>
<th>Assist</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>

// FIREBASE
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "egbc-worship-planner.firebaseapp.com",
projectId: "egbc-worship-planner",
storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let songs = [];
let rows = [];

const KEYS = ["C","C#","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const TYPES = ["Lead Sheet","Chord Sheet","Lyrics","Bass Tabs"];

// LOAD SONGS
async function loadSongs(){
const snap = await db.collection("songs").get();
songs = snap.docs.map(d => ({id:d.id,...d.data()}));
}

// KEY DETECTION
function detectKey(name){
name = name.toLowerCase();

let m = name.match(/\bin ([a-g](#|b)?m?)\b/);
if(m) return m[1].toUpperCase();

m = name.match(/\bkey ([a-g](#|b)?m?)\b/);
if(m) return m[1].toUpperCase();

m = name.match(/\(([a-g](#|b)?m?)\)/);
if(m) return m[1].toUpperCase();

m = name.match(/ ([a-g](#|b)?m?)\.pdf$/);
if(m) return m[1].toUpperCase();

return "";
}

// TYPE DETECTION
function detectType(name){
name = name.toLowerCase();

if(name.includes("chord")) return "Chord Sheet";
if(name.includes("lead")) return "Lead Sheet";
if(name.includes("lyric")) return "Lyrics";
if(name.includes("bass")) return "Bass Tabs";

return "";
}

// CLEAN TITLE
function cleanTitle(name){
return name.toLowerCase()
.replace(".pdf","")
.replace(/\(.*?\)/g,"")
.replace(/\bin [a-g](#|b)?m?\b/g,"")
.replace(/\bkey [a-g](#|b)?m?\b/g,"")
.replace(/\b(chord|lead|lyrics|bass|tab|sheet)\b/g,"")
.replace(/\b[a-g](#|b)?m?\b/g,"")
.replace(/[^a-z0-9 ]/g,"")
.replace(/\s+/g," ")
.trim();
}

// MATCH
function getMatches(title){
const words = title.split(" ");

return songs.map(s => {
const sWords = s.title.toLowerCase().split(" ");
let overlap = words.filter(w => sWords.includes(w));
let score = overlap.length / sWords.length;
return {song:s, score};
})
.sort((a,b)=>b.score-a.score)
.slice(0,5);
}

// YOUTUBE SEARCH
function openYouTubeSearch(title){
window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(title)}`, '_blank');
}

// FILE HANDLING
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

dropzone.onclick = () => fileInput.click();

fileInput.onchange = e => handleFiles(Array.from(e.target.files));

dropzone.addEventListener("dragover", e=>e.preventDefault());

dropzone.addEventListener("drop", async e=>{
e.preventDefault();

let files = [];

for(let item of e.dataTransfer.items){
let entry = item.webkitGetAsEntry();
await traverse(entry, files);
}

handleFiles(files);
});

// TRAVERSE
async function traverse(entry, files){
if(entry.isFile){
await new Promise(res=>{
entry.file(f=>{
if(f.name.endsWith(".pdf")) files.push(f);
res();
});
});
}

if(entry.isDirectory){
let reader = entry.createReader();

let read = async () => {
let entries = await new Promise(res=>reader.readEntries(res));
if(entries.length){
for(let e of entries){
await traverse(e, files);
}
await read();
}
};

await read();
}
}

// MAIN
async function handleFiles(files){

await loadSongs();

rows = files.map(file=>{

let key = detectKey(file.name);
let type = detectType(file.name);
let title = cleanTitle(file.name);
let matches = getMatches(title);

return {
file,
title,
key,
type,
matches,
match:matches[0]?.song || null,
youtube:matches[0]?.song?.youtube || "",
ccli:matches[0]?.song?.ccli || "",
skip:false,
force:false
};
});

render();
}

// STATUS
function getStatus(r){

if(r.skip) return "SKIPPED";

if(!r.key || !r.type) return "REVIEW";

if(!r.match) return "NEW";

let dup = (r.match.files||[]).find(f =>
f.key===r.key && f.type===r.type
);

if(dup && !r.force) return "EXISTS";

return "NEW";
}

// RENDER
function render(){

const tbody = document.getElementById("table");
tbody.innerHTML = "";

rows.forEach((r,i)=>{

let status = getStatus(r);

let tr = document.createElement("tr");
tr.className = "status-"+status.toLowerCase();

tr.innerHTML = `
<td>${r.file.name}</td>

<td><input value="${r.title}"></td>

<td>
<select>
<option value="">Key</option>
${KEYS.map(k=>`<option ${r.key===k?"selected":""}>${k}</option>`).join("")}
</select>
</td>

<td>
<select>
<option value="">Type</option>
${TYPES.map(t=>`<option ${r.type===t?"selected":""}>${t}</option>`).join("")}
</select>
</td>

<td>
<select>
<option value="">— New Song —</option>
${r.matches.map(m=>`
<option value="${m.song.id}" ${r.match?.id===m.song.id?"selected":""}>
${m.song.title}
</option>`).join("")}
</select>
</td>

<td><input value="${r.youtube}"></td>
<td><input value="${r.ccli}"></td>

<td>
<button onclick="openYouTubeSearch('${r.title}')">Find YouTube</button>
<button onclick="window.open('https://songselect.ccli.com/search/results?query=${encodeURIComponent(r.title)}')">Search CCLI</button>
</td>

<td>${status}</td>

<td>
<button onclick="rows[${i}].skip=true; render()">Skip</button>
<button onclick="rows[${i}].force=true; render()">Force</button>
</td>
`;

tbody.appendChild(tr);

const inputs = tr.querySelectorAll("input, select");

inputs[0].onchange = e => { r.title=e.target.value; render(); };
inputs[1].onchange = e => { r.key=e.target.value; render(); };
inputs[2].onchange = e => { r.type=e.target.value; render(); };

inputs[3].onchange = e => {
if(!e.target.value){
r.match = null;
} else {
let m = r.matches.find(x=>x.song.id===e.target.value);
r.match = m.song;
r.youtube = m.song.youtube || "";
r.ccli = m.song.ccli || "";
}
render();
};

inputs[4].onchange = e => { r.youtube=e.target.value; };
inputs[5].onchange = e => { r.ccli=e.target.value; };

});

}

// PROCESS
async function processAll(){

if(!confirm("Upload?")) return;

for(const r of rows){

let status = getStatus(r);

if(status==="SKIPPED" || status==="EXISTS") continue;

if(status==="REVIEW"){
alert("Fix: "+r.file.name);
return;
}

let id = r.match ? r.match.id : r.title.replace(/\s+/g,"-");

const ref = storage.ref(`songs/${id}/${r.file.name}`);
await ref.put(r.file);
const url = await ref.getDownloadURL();

const docRef = db.collection("songs").doc(id);
const snap = await docRef.get();

let data = snap.exists ? snap.data() : {};
let files = data.files || [];

files.push({
name:r.file.name,
url,
type:r.type,
key:r.key
});

await docRef.set({
title:r.title,
normalized:r.title,
youtube:r.youtube,
ccli:r.ccli,
files
},{merge:true});
}

alert("Upload complete");
}

</script>

</body>
</html>
