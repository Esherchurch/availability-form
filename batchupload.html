<!DOCTYPE html>
<html>
<head>
<title>Batch Music Importer (Add: Group + Confidence)</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body { font-family: Arial; padding: 20px; }

.dropzone {
border: 3px dashed #ccc;
padding: 30px;
text-align: center;
border-radius: 15px;
cursor: pointer;
margin-bottom: 15px;
}

table { border-collapse: collapse; width: 100%; font-size: 12px; }
td, th { border: 1px solid #ddd; padding: 6px; }

.status-new { background:#d4edda; }
.status-exists { background:#f8d7da; }
.status-review { background:#fff3cd; }
.status-skipped { background:#e0e0e0; }

.conf-high { color: green; font-weight: bold; }
.conf-medium { color: orange; font-weight: bold; }
.conf-low { color: red; font-weight: bold; }

.group-row { background:#f5f5f5; font-weight:bold; }

input, select { width: 100%; }
button { margin: 2px; }
</style>
</head>

<body>

<h2>Batch Music Importer</h2>

<div class="dropzone" id="dropzone">
Drag folder OR click to select
</div>

<input type="file" id="fileInput" multiple webkitdirectory style="display:none">

<button onclick="processAll()">Upload</button>

<table>
<thead>
<tr>
<th>File</th>
<th>Title</th>
<th>Key</th>
<th>Type</th>
<th>Match</th>
<th>Confidence</th>
<th>YouTube</th>
<th>CCLI</th>
<th>Assist</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>

// FIREBASE
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "egbc-worship-planner.firebaseapp.com",
projectId: "egbc-worship-planner",
storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let songs = [];
let rows = [];

const KEYS = ["C","C#","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const TYPES = ["Lead Sheet","Chord Sheet","Lyrics","Bass Tabs"];

// LOAD SONGS
async function loadSongs(){
const snap = await db.collection("songs").get();
songs = snap.docs.map(d => ({id:d.id,...d.data()}));
}

// CLEAN TITLE
function cleanTitle(name){
return name.toLowerCase()
.replace(".pdf","")
.replace(/\(.*?\)/g,"")
.replace(/\b(chord|lead|lyrics|bass|tab|sheet)\b/g,"")
.replace(/\bin [a-g](#|b)?m?\b/g,"")
.replace(/[^a-z0-9 ]/g,"")
.replace(/\s+/g," ")
.trim();
}

// MATCH WITH CONFIDENCE
function getMatches(title){

const words = title.split(" ");

let results = songs.map(s => {

const sWords = s.title.toLowerCase().split(" ");
let overlap = words.filter(w => sWords.includes(w));
let score = overlap.length / sWords.length;

return {song:s, score};

}).sort((a,b)=>b.score-a.score);

let top = results[0];

let confidence = "low";
if(top.score >= 0.7) confidence = "high";
else if(top.score >= 0.4) confidence = "medium";

return {
confidence,
top,
options: results.slice(0,5)
};
}

// DETECT KEY
function detectKey(name){
let m = name.toLowerCase().match(/\bin ([a-g](#|b)?m?)\b/);
return m ? m[1].toUpperCase() : "";
}

// DETECT TYPE
function detectType(name){
let n = name.toLowerCase();
if(n.includes("chord")) return "Chord Sheet";
if(n.includes("lead")) return "Lead Sheet";
if(n.includes("lyric")) return "Lyrics";
if(n.includes("bass")) return "Bass Tabs";
return "";
}

// DUPLICATE CHECK
function isDuplicate(r){

if(!r.match) return false;
if(!r.key || !r.type) return false;

return (r.match.files || []).some(f =>
f.key === r.key && f.type === r.type
);
}

// GROUP HELPER
function getGroup(file){
return file.webkitRelativePath.split("/")[0];
}

// HANDLE FILES
async function handleFiles(files){

await loadSongs();

rows = files.map(file=>{

let group = getGroup(file);
let rawTitle = cleanTitle(group);
let matchData = getMatches(rawTitle);

return {
file,
group,
title: file.name.replace(".pdf",""),
key: detectKey(file.name),
type: detectType(file.name),
matches: matchData.options,
match: matchData.confidence === "low" ? null : matchData.top.song,
confidence: matchData.confidence,
youtube: matchData.top.song?.youtube || "",
ccli: matchData.top.song?.ccli || "",
skip:false,
force:false
};
});

render();
}

// APPLY TO GROUP
function applyToGroup(index, field){

let g = rows[index].group;
let value = rows[index][field];

rows.forEach(r=>{
if(r.group === g){
r[field] = value;
}
});

render();
}

// STATUS
function getStatus(r){

if(r.skip) return "SKIPPED";

if(!r.key || !r.type) return "REVIEW";

if(isDuplicate(r) && !r.force) return "EXISTS";

return "NEW";
}

// YOUTUBE ASSIST
function youtubeAssist(i){
window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(rows[i].title)}`);
setTimeout(()=>{
let url = prompt("Paste YouTube link:");
if(url){
rows[i].youtube = url;
render();
}
},500);
}

// RENDER
function render(){

const tbody = document.getElementById("table");
tbody.innerHTML = "";

let lastGroup = null;

rows.forEach((r,i)=>{

if(r.group !== lastGroup){
tbody.innerHTML += `
<tr class="group-row">
<td colspan="11">
${r.group}
<button onclick="applyToGroup(${i}, 'title')">Apply Title</button>
<button onclick="applyToGroup(${i}, 'match')">Apply Match</button>
<button onclick="applyToGroup(${i}, 'youtube')">Apply YouTube</button>
<button onclick="applyToGroup(${i}, 'ccli')">Apply CCLI</button>
</td>
</tr>
`;
lastGroup = r.group;
}

let status = getStatus(r);

tbody.innerHTML += `
<tr class="status-${status.toLowerCase()}">

<td>${r.file.name}</td>

<td><input value="${r.title}" onchange="rows[${i}].title=this.value"></td>

<td>
<select onchange="rows[${i}].key=this.value">
<option value="">Key</option>
${KEYS.map(k=>`<option ${r.key===k?"selected":""}>${k}</option>`).join("")}
</select>
</td>

<td>
<select onchange="rows[${i}].type=this.value">
<option value="">Type</option>
${TYPES.map(t=>`<option ${r.type===t?"selected":""}>${t}</option>`).join("")}
</select>
</td>

<td>
<select onchange="changeMatch(${i}, this.value)">
<option value="">— New Song —</option>
${r.matches.map(m=>`
<option value="${m.song.id}" ${r.match?.id===m.song.id?"selected":""}>
${m.song.title}
</option>`).join("")}
</select>
</td>

<td class="conf-${r.confidence}">${r.confidence}</td>

<td><input value="${r.youtube}" onchange="rows[${i}].youtube=this.value"></td>
<td><input value="${r.ccli}" onchange="rows[${i}].ccli=this.value"></td>

<td>
<button onclick="youtubeAssist(${i})">Find YouTube</button>
<button onclick="window.open('https://songselect.ccli.com/search/results?query=${encodeURIComponent(r.title)}')">Search CCLI</button>
</td>

<td>${status}</td>

<td>
<button onclick="rows[${i}].skip=true; render()">Skip</button>
<button onclick="rows[${i}].force=true; render()">Force</button>
</td>

</tr>
`;
});

}

// CHANGE MATCH
function changeMatch(i,id){

if(!id){
rows[i].match = null;
return;
}

let m = rows[i].matches.find(x=>x.song.id===id);
rows[i].match = m.song;
rows[i].youtube = m.song.youtube || "";
rows[i].ccli = m.song.ccli || "";

render();
}

// PROCESS (UNCHANGED)
async function processAll(){

if(!confirm("Upload?")) return;

for(const r of rows){

let status = getStatus(r);

if(status==="SKIPPED" || status==="EXISTS") continue;

if(status==="REVIEW"){
alert("Fix: "+r.file.name);
return;
}

let finalTitle = r.match ? r.match.title : r.title;
let id = finalTitle.toLowerCase().replace(/\s+/g,"-");

const ref = storage.ref(`songs/${id}/${r.file.name}`);
await ref.put(r.file);
const url = await ref.getDownloadURL();

const docRef = db.collection("songs").doc(id);
const snap = await docRef.get();

let data = snap.exists ? snap.data() : {};
let files = data.files || [];

files.push({
name:r.file.name,
url,
type:r.type,
key:r.key
});

await docRef.set({
title: finalTitle,
normalized: finalTitle.toLowerCase(),
youtube: r.youtube,
ccli: r.ccli,
files
},{merge:true});
}

alert("Upload complete");
}

// EVENTS
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

dropzone.onclick = () => fileInput.click();
fileInput.onchange = e => handleFiles(Array.from(e.target.files));

dropzone.addEventListener("dragover", e=>e.preventDefault());
dropzone.addEventListener("drop", e=>{
e.preventDefault();
handleFiles(Array.from(e.dataTransfer.files));
});

</script>

</body>
</html>
