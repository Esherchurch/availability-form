<!DOCTYPE html>
<html>
<head>
<title>Batch Music Importer (With Suggestions)</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body { font-family: Arial; padding: 20px; }

.dropzone {
border: 3px dashed #ccc;
padding: 30px;
text-align: center;
border-radius: 15px;
cursor: pointer;
margin-bottom: 15px;
}

.dropzone.dragover { background: #e8f4ff; }

table { border-collapse: collapse; width: 100%; font-size: 12px; }

td, th { border: 1px solid #ddd; padding: 6px; }

.status-new { background:#d4edda; }
.status-exists { background:#f8d7da; }
.status-review { background:#fff3cd; }
.status-skipped { background:#e0e0e0; }

input, select { width: 100%; }

button { margin: 2px; font-size: 11px; }

.youtube-option {
cursor:pointer;
color:blue;
text-decoration:underline;
display:block;
}
</style>
</head>

<body>

<h2>Batch Music Importer</h2>

<div class="dropzone" id="dropzone">
Drag folder OR click to select
</div>

<input type="file" id="fileInput" multiple webkitdirectory style="display:none">

<div id="status"></div>

<button onclick="processAll()">Upload</button>

<table>
<thead>
<tr>
<th>File</th>
<th>Title</th>
<th>Key</th>
<th>Type</th>
<th>Match</th>
<th>YouTube</th>
<th>CCLI</th>
<th>Assist</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>

// FIREBASE
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "egbc-worship-planner.firebaseapp.com",
projectId: "egbc-worship-planner",
storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let songs = [];
let rows = [];

const KEYS = ["C","C#","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const TYPES = ["Lead Sheet","Chord Sheet","Lyrics","Bass Tabs"];

// LOAD SONGS
async function loadSongs(){
const snap = await db.collection("songs").get();
songs = snap.docs.map(d => ({id:d.id,...d.data()}));
}

// CLEAN TITLE
function cleanTitle(name){

let t = name.toLowerCase();

t = t.replace(".pdf","");
t = t.replace(/\(.*?\)/g,"");
t = t.replace(/\b(chord|lead|lyrics|bass|tab|sheet)\b/g,"");
t = t.replace(/\bin [a-g](#|b)?\b/g,"");
t = t.replace(/\b[a-g](#|b)?\b/g,"");
t = t.replace(/[^a-z0-9 ]/g,"");
t = t.replace(/\s+/g," ").trim();

return t;
}

// MATCH
function getMatches(title){

const words = title.split(" ");

return songs.map(s => {

const sWords = s.title.toLowerCase().split(" ");

let overlap = words.filter(w => sWords.includes(w));
let score = overlap.length / sWords.length;

return {song:s, score};

})
.sort((a,b)=>b.score-a.score)
.slice(0,5);
}

// FILE HANDLING
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

dropzone.onclick = () => fileInput.click();

fileInput.onchange = e => handleFiles(Array.from(e.target.files));

dropzone.addEventListener("dragover", e=>{
e.preventDefault();
});

dropzone.addEventListener("drop", async e=>{
e.preventDefault();

let files = [];

for(let item of e.dataTransfer.items){
let entry = item.webkitGetAsEntry();
await traverse(entry, files);
}

handleFiles(files);
});

// TRAVERSE
async function traverse(entry, files){

if(entry.isFile){
await new Promise(res=>{
entry.file(f=>{
if(f.name.toLowerCase().endsWith(".pdf")){
files.push(f);
}
res();
});
});
}

if(entry.isDirectory){
let reader = entry.createReader();

let read = async () => {
let entries = await new Promise(res=>reader.readEntries(res));
if(entries.length){
for(let e of entries){
await traverse(e, files);
}
await read();
}
};

await read();
}
}

// MAIN
async function handleFiles(files){

document.getElementById("status").innerText =
files.length + " PDF files loaded";

await loadSongs();

rows = files.map(file=>{

let cleaned = cleanTitle(file.name);
let matches = getMatches(cleaned);

return {
file,
title:cleaned,
key:"",
type:"",
matches,
match:matches[0]?.song || null,
youtube:matches[0]?.song?.youtube || "",
ccli:matches[0]?.song?.ccli || "",
youtubeOptions:[],
skip:false,
force:false
};
});

render();
}

// STATUS
function getStatus(r){

if(r.skip) return "SKIPPED";

if(!r.match) return "NEW";

if(!r.key || !r.type) return "REVIEW";

let dup = (r.match.files||[]).find(f =>
f.key===r.key && f.type===r.type
);

if(dup && !r.force) return "EXISTS";

return "NEW";
}

// YOUTUBE SEARCH
function searchYouTube(i){

let query = encodeURIComponent(rows[i].title);

fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&maxResults=3&type=video&key=YOUR_YOUTUBE_API_KEY`)
.then(res=>res.json())
.then(data=>{
rows[i].youtubeOptions = data.items.map(v=>({
title:v.snippet.title,
url:`https://www.youtube.com/watch?v=${v.id.videoId}`
}));
render();
});
}

// RENDER
function render(){

const tbody = document.getElementById("table");
tbody.innerHTML = "";

rows.forEach((r,i)=>{

let status = getStatus(r);

let tr = document.createElement("tr");
tr.className = "status-"+status.toLowerCase();

tr.innerHTML = `
<td>${r.file.name}</td>

<td><input value="${r.title}"></td>

<td>
<select>
<option value="">Key</option>
${KEYS.map(k=>`<option ${r.key===k?"selected":""}>${k}</option>`).join("")}
</select>
</td>

<td>
<select>
<option value="">Type</option>
${TYPES.map(t=>`<option ${r.type===t?"selected":""}>${t}</option>`).join("")}
</select>
</td>

<td>
<select>
<option value="">New Song</option>
${r.matches.map(m=>`
<option value="${m.song.id}" ${r.match?.id===m.song.id?"selected":""}>
${m.song.title}
</option>`).join("")}
</select>
</td>

<td>
<input value="${r.youtube}">
<div>
${r.youtubeOptions.map(v=>`
<span class="youtube-option" onclick="selectYouTube(${i},'${v.url}')">${v.title}</span>
`).join("")}
</div>
</td>

<td><input value="${r.ccli}"></td>

<td>
${!r.match ? `
<button onclick="searchYouTube(${i})">Find YouTube</button>
<button onclick="window.open('https://songselect.ccli.com/search/results?query=${encodeURIComponent(r.title)}')">Search CCLI</button>
` : ""}
</td>

<td>${status}</td>

<td>
<button onclick="rows[${i}].skip=true; render()">Skip</button>
<button onclick="rows[${i}].force=true; render()">Force</button>
</td>
`;

tbody.appendChild(tr);

const inputs = tr.querySelectorAll("input, select");

inputs[0].onchange = e => { r.title=e.target.value; render(); };
inputs[1].onchange = e => { r.key=e.target.value; render(); };
inputs[2].onchange = e => { r.type=e.target.value; render(); };

inputs[3].onchange = e => {
let m = r.matches.find(x=>x.song.id===e.target.value);
r.match = m ? m.song : null;
if(r.match){
r.youtube = r.match.youtube || "";
r.ccli = r.match.ccli || "";
}
render();
};

inputs[4].onchange = e => { r.youtube=e.target.value; };
inputs[5].onchange = e => { r.ccli=e.target.value; };

});

}

// SELECT YOUTUBE
function selectYouTube(i,url){
rows[i].youtube = url;
rows[i].youtubeOptions = [];
render();
}

// PROCESS
async function processAll(){

if(!confirm("Upload?")) return;

for(const r of rows){

let status = getStatus(r);

if(status==="SKIPPED" || status==="EXISTS") continue;

if(status==="REVIEW"){
alert("Fix: "+r.file.name);
return;
}

let id = r.match ? r.match.id : r.title.replace(/\s+/g,"-");

const ref = storage.ref(`songs/${id}/${r.file.name}`);
await ref.put(r.file);
const url = await ref.getDownloadURL();

const docRef = db.collection("songs").doc(id);
const snap = await docRef.get();

let data = snap.exists ? snap.data() : {};
let files = data.files || [];

files.push({
name:r.file.name,
url,
type:r.type,
key:r.key
});

await docRef.set({
title:r.title,
normalized:r.title.toLowerCase(),
youtube:r.youtube,
ccli:r.ccli,
files
},{merge:true});
}

alert("Upload complete");
}

</script>

</body>
</html>
