<!DOCTYPE html>
<html>
<head>
<title>Batch Music Importer (Fixed Key + Type Detection)</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body { font-family: Arial; padding: 20px; }

.dropzone {
border: 3px dashed #ccc;
padding: 30px;
text-align: center;
border-radius: 15px;
cursor: pointer;
margin-bottom: 15px;
}

table { border-collapse: collapse; width: 100%; font-size: 12px; }
td, th { border: 1px solid #ddd; padding: 6px; }

.status-new { background:#d4edda; }
.status-exists { background:#f8d7da; }
.status-review { background:#fff3cd; }

input, select { width: 100%; }
button { margin: 2px; }
</style>
</head>

<body>

<h2>Batch Music Importer</h2>

<div class="dropzone" id="dropzone">
Drag folder OR click to select
</div>

<input type="file" id="fileInput" multiple webkitdirectory style="display:none">

<div id="status"></div>

<button onclick="processAll()">Upload</button>

<table>
<thead>
<tr>
<th>File</th>
<th>Title</th>
<th>Key</th>
<th>Type</th>
<th>Match</th>
<th>Status</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>

// FIREBASE
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "egbc-worship-planner.firebaseapp.com",
projectId: "egbc-worship-planner",
storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let songs = [];
let rows = [];

const KEYS = ["C","C#","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const TYPES = ["Lead Sheet","Chord Sheet","Lyrics","Bass Tabs"];

// LOAD SONGS
async function loadSongs(){
const snap = await db.collection("songs").get();
songs = snap.docs.map(d => ({id:d.id,...d.data()}));
}

// ================= DETECT KEY =================
function detectKey(name){

name = name.toLowerCase();

// in D
let m = name.match(/\bin ([a-g](#|b)?m?)\b/);
if(m) return m[1].toUpperCase();

// key D
m = name.match(/\bkey ([a-g](#|b)?m?)\b/);
if(m) return m[1].toUpperCase();

// (D)
m = name.match(/\(([a-g](#|b)?m?)\)/);
if(m) return m[1].toUpperCase();

// trailing D
m = name.match(/ ([a-g](#|b)?m?)$/);
if(m) return m[1].toUpperCase();

return "";
}

// ================= DETECT TYPE =================
function detectType(name){

name = name.toLowerCase();

if(name.includes("chord")) return "Chord Sheet";
if(name.includes("lead")) return "Lead Sheet";
if(name.includes("lyric")) return "Lyrics";
if(name.includes("bass")) return "Bass Tabs";

return "";
}

// ================= CLEAN TITLE =================
function cleanTitle(name){

let t = name.toLowerCase();

t = t.replace(".pdf","");

// remove key phrases FIRST
t = t.replace(/\bin [a-g](#|b)?m?\b/g,"");
t = t.replace(/\bkey [a-g](#|b)?m?\b/g,"");
t = t.replace(/\([a-g](#|b)?m?\)/g,"");

// remove types
t = t.replace(/\b(chord|lead|lyrics|bass|tab|sheet)\b/g,"");

// remove stray keys
t = t.replace(/\b[a-g](#|b)?m?\b/g,"");

// clean
t = t.replace(/[^a-z0-9 ]/g,"");
t = t.replace(/\s+/g," ").trim();

return t;
}

// ================= MATCH =================
function getMatches(title){

const words = title.split(" ");

return songs.map(s => {

const sWords = s.title.toLowerCase().split(" ");

let overlap = words.filter(w => sWords.includes(w));
let score = overlap.length / sWords.length;

return {song:s, score};

})
.sort((a,b)=>b.score-a.score)
.slice(0,5);
}

// ================= FILE HANDLING =================
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

dropzone.onclick = () => fileInput.click();

fileInput.onchange = e => handleFiles(Array.from(e.target.files));

dropzone.addEventListener("dragover", e=>e.preventDefault());

dropzone.addEventListener("drop", async e=>{
e.preventDefault();

let files = [];

for(let item of e.dataTransfer.items){
let entry = item.webkitGetAsEntry();
await traverse(entry, files);
}

handleFiles(files);
});

// TRAVERSE
async function traverse(entry, files){

if(entry.isFile){
await new Promise(res=>{
entry.file(f=>{
if(f.name.endsWith(".pdf")) files.push(f);
res();
});
});
}

if(entry.isDirectory){
let reader = entry.createReader();

let read = async () => {
let entries = await new Promise(res=>reader.readEntries(res));
if(entries.length){
for(let e of entries){
await traverse(e, files);
}
await read();
}
};

await read();
}
}

// ================= MAIN =================
async function handleFiles(files){

await loadSongs();

rows = files.map(file=>{

let key = detectKey(file.name);
let type = detectType(file.name);
let title = cleanTitle(file.name);

let matches = getMatches(title);

return {
file,
title,
key,
type,
matches,
match:matches[0]?.song || null
};
});

render();
}

// ================= STATUS =================
function getStatus(r){

if(!r.key || !r.type) return "REVIEW";
return "OK";
}

// ================= RENDER =================
function render(){

const tbody = document.getElementById("table");
tbody.innerHTML = "";

rows.forEach(r=>{

let tr = document.createElement("tr");

tr.innerHTML = `
<td>${r.file.name}</td>
<td>${r.title}</td>
<td>${r.key}</td>
<td>${r.type}</td>
<td>${r.match?.title || ""}</td>
<td>${getStatus(r)}</td>
`;

tbody.appendChild(tr);

});
}

// ================= PROCESS =================
function processAll(){
alert("Upload logic unchanged");
}

</script>

</body>
</html>
