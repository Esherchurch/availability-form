<!DOCTYPE html>
<html>
<head>
    <title>Song Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            height: 100vh; 
            margin: 0; 
            color: #333; 
            background-color: #f0f6f6;
        }

        #left {
            width: 340px;
            border-right: 1px solid #d1dfdf;
            padding: 20px;
            overflow-y: auto;
            background-color: #ffffff;
            margin: 15px;
            border-radius: 2.5rem;
            border: 1px solid #d1dfdf;
        }

        #right {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background-color: #ffffff;
            margin: 15px 15px 15px 0;
            border-radius: 2.5rem;
            border: 1px solid #d1dfdf;
        }

        .song {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f6f6;
            transition: background 0.2s;
        }

        .song:hover { background: #f0f6f6; border-radius: 1rem; }

        .song-title-text {
            font-weight: 600;
            font-size: 14px;
            color: #2c4a4a;
        }

        .song-stats {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .stat-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .stat-total {
            background: #e8f0f0;
            color: #3d6263;
        }

        .stat-recent {
            background: #fff3e0;
            color: #e65100;
        }

        .stat-recent.warning {
            background: #fde8e8;
            color: #b22222;
        }

        .stat-last {
            background: #f0f6f6;
            color: #5b8e8f;
        }

        .stat-never {
            background: #f5f5f5;
            color: #aaa;
        }

        h2 { color: #3d6263; margin-top: 0; font-weight: 800; }
        h3 { color: #3d6263; border-bottom: 1px solid #d1dfdf; padding-bottom: 10px; font-weight: 700; }

        label { 
            display: block; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #3d6263; 
            padding-left: 5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 1px solid #d1dfdf;
            border-radius: 9999px;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            outline: none;
        }

        button {
            background-color: #3d6263;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
        }

        .delete-btn {
            background-color: #b22222;
            margin-top: 20px;
            font-size: 12px;
        }

        .status-msg {
            font-size: 11px;
            color: #5b8e8f;
            margin-top: -15px;
            margin-bottom: 15px;
            height: 15px;
            font-weight: 700;
            padding-left: 10px;
        }

        .file-item {
            background: #f0f6f6;
            border: 1px solid #d1dfdf;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-row { display: flex; gap: 15px; align-items: center; }
        .file-row label { margin-bottom: 0; width: 100px; }

        .view-link {
            display: inline-block;
            color: #3d6263;
            text-decoration: underline;
            font-weight: 800;
        }

        /* Usage summary panel shown when a song is opened */
        .usage-panel {
            background: #f0f6f6;
            border: 1px solid #d1dfdf;
            border-radius: 1.5rem;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .usage-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .usage-stat-number {
            font-size: 24px;
            font-weight: 800;
            color: #3d6263;
            line-height: 1;
        }

        .usage-stat-label {
            font-size: 10px;
            font-weight: 700;
            color: #5b8e8f;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
        }

        .usage-divider {
            width: 1px;
            height: 40px;
            background: #d1dfdf;
        }

        .usage-last {
            font-size: 12px;
            font-weight: 700;
            color: #3d6263;
        }

        .usage-last-label {
            font-size: 10px;
            color: #5b8e8f;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .usage-warning {
            font-size: 11px;
            font-weight: 700;
            color: #b22222;
            background: #fde8e8;
            padding: 4px 12px;
            border-radius: 9999px;
        }

        #stats-loading {
            font-size: 11px;
            color: #5b8e8f;
            font-weight: 700;
            padding: 4px 0;
        }
    </style>
</head>

<body>

<div id="left">
    <label>Search Titles</label>
    <input id="search" placeholder="Search songs..." oninput="searchSongs()">
    <label>Search Lyrics</label>
    <input id="lyricsSearch" placeholder="Find by lyrics..." onkeydown="handleLyricsSearch(event)">
    <div id="list"></div>
</div>

<div id="right">
    <h2 id="display-title">Select a Song</h2>
    <div id="editor" style="display:none;">

        <!-- Usage Stats Panel -->
        <div class="usage-panel" id="usage-panel">
            <span id="stats-loading">Loading usage stats...</span>
        </div>

        <label>Song Title</label>
        <input id="edit-title">

        <label>Artist</label>
        <input id="artist" placeholder="Scanning for artist...">
        <div id="artist-status" class="status-msg"></div>

        <label>YouTube Link</label>
        <input id="youtube" onchange="smartScanArtist()" placeholder="Paste YouTube link here">

        <label>CCLI Number</label>
        <input id="ccli">

        <h3>Associated Files</h3>
        <div id="files-container"></div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button onclick="save()">Save All Changes</button>
            <button class="delete-btn" onclick="deleteSong()">Delete Song</button>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentDoc = null;
let currentFiles = [];

// Cache all schedules once on load to avoid repeated reads
let schedulesCache = null;

async function getSchedulesCache() {
    if (schedulesCache) return schedulesCache;
    const snap = await db.collection("schedules").get();
    schedulesCache = snap.docs.map(d => d.data());
    return schedulesCache;
}

// Get usage stats for a song title from schedules
async function getSongUsageStats(songTitle) {
    const schedules = await getSchedulesCache();
    const title = songTitle.trim().toLowerCase();

    // Filter to records matching this song
    const matches = schedules.filter(d => {
        const st = (d.songTitle || "").trim().toLowerCase();
        return st === title;
    });

    const totalCount = matches.length;

    // Last 3 months
    const threeMonthsAgo = new Date();
    threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
    const threeMonthStr = threeMonthsAgo.toISOString().split("T")[0]; // "YYYY-MM-DD"

    const recentMatches = matches.filter(d => d.date && d.date >= threeMonthStr);
    // Deduplicate by date (same song may appear multiple times per service for different roles)
    const recentDates = [...new Set(recentMatches.map(d => d.date))];
    const recentCount = recentDates.length;

    // Last used date
    const allDates = matches.map(d => d.date).filter(Boolean).sort();
    const lastUsed = allDates.length > 0 ? allDates[allDates.length - 1] : null;

    return { totalCount, recentCount, lastUsed };
}

function formatDate(dateStr) {
    if (!dateStr) return null;
    const [y, m, d] = dateStr.split("-");
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function getKeyOptionsHTML(selectedKey) {
    const keys = [
        { group: "Major Keys", list: ["C", "C#", "Db", "D", "D#", "Eb", "E", "F", "F#", "Gb", "G", "G#", "Ab", "A", "A#", "Bb", "B"] },
        { group: "Minor Keys", list: ["Cm", "C#m", "Dbm", "Dm", "D#m", "Ebm", "Em", "Fm", "F#m", "Gbm", "Gm", "G#m", "Abm", "Am", "A#m", "Bbm", "Bm"] }
    ];
    let options = '<option value="">Select Key</option>';
    keys.forEach(category => {
        options += `<optgroup label="${category.group}">`;
        category.list.forEach(k => {
            options += `<option value="${k}" ${k === selectedKey ? 'selected' : ''}>${k}</option>`;
        });
        options += `</optgroup>`;
    });
    return options;
}

function normalizeTitle(title) { return title.toLowerCase().trim(); }

async function loadSongs() {
    const snapshot = await db.collection("songs").orderBy("normalized").get();
    // Pre-load schedules cache while songs are loading
    getSchedulesCache();
    renderList(snapshot.docs);
}

async function renderList(docs) {
    const list = document.getElementById("list");
    // Show song titles immediately, then populate stats
    list.innerHTML = docs.map(doc => `
        <div class="song" onclick="openSong('${doc.id.replace(/'/g, "\\'")}')">
            <div class="song-title-text">${doc.data().title}</div>
            <div class="song-stats" id="stats-${doc.id}">
                <span class="stat-badge stat-never">Loading...</span>
            </div>
        </div>
    `).join("");

    // Populate stats for each song asynchronously
    for (const doc of docs) {
        const stats = await getSongUsageStats(doc.data().title);
        const statsEl = document.getElementById(`stats-${doc.id}`);
        if (!statsEl) continue;

        if (stats.totalCount === 0) {
            statsEl.innerHTML = `<span class="stat-badge stat-never">Never used</span>`;
        } else {
            let html = `<span class="stat-badge stat-total">✦ ${stats.totalCount} total</span>`;

            if (stats.recentCount > 0) {
                const cls = stats.recentCount >= 3 ? "stat-recent warning" : "stat-recent";
                html += `<span class="stat-badge ${cls}">↺ ${stats.recentCount} recent</span>`;
            }

            if (stats.lastUsed) {
                html += `<span class="stat-badge stat-last">Last: ${formatDate(stats.lastUsed)}</span>`;
            }

            statsEl.innerHTML = html;
        }
    }
}

async function searchSongs() {
    const input = document.getElementById("search").value;
    if (!input) { loadSongs(); return; }
    const norm = normalizeTitle(input);
    const snapshot = await db.collection("songs")
        .orderBy("normalized").startAt(norm).endAt(norm + "\uf8ff").get();
    renderList(snapshot.docs);
}

async function openSong(id) {
    const doc = await db.collection("songs").doc(id).get();
    const data = doc.data();
    currentDoc = id;
    currentFiles = data.files || [];
    document.getElementById("editor").style.display = "block";
    document.getElementById("display-title").innerText = data.title;
    document.getElementById("edit-title").value = data.title;
    document.getElementById("artist").value = data.artist || "";
    document.getElementById("youtube").value = data.youtube || "";
    document.getElementById("ccli").value = data.ccli || "";
    document.getElementById("artist-status").innerText = "";
    renderFiles();
    renderUsagePanel(data.title);

    if (!data.artist && data.youtube) {
        smartScanArtist();
    }
}

async function renderUsagePanel(songTitle) {
    const panel = document.getElementById("usage-panel");
    panel.innerHTML = `<span id="stats-loading">Loading usage stats...</span>`;

    const stats = await getSongUsageStats(songTitle);

    if (stats.totalCount === 0) {
        panel.innerHTML = `
            <div class="usage-stat">
                <span class="usage-stat-number">0</span>
                <span class="usage-stat-label">Times Used</span>
            </div>
            <div class="usage-divider"></div>
            <span style="font-size:12px; color:#aaa; font-weight:700;">This song hasn't been used yet</span>
        `;
        return;
    }

    const recentWarning = stats.recentCount >= 2
        ? `<span class="usage-warning">⚠ Used ${stats.recentCount}x in last 3 months</span>`
        : "";

    panel.innerHTML = `
        <div class="usage-stat">
            <span class="usage-stat-number">${stats.totalCount}</span>
            <span class="usage-stat-label">All Time</span>
        </div>
        <div class="usage-divider"></div>
        <div class="usage-stat">
            <span class="usage-stat-number" style="color: ${stats.recentCount >= 3 ? '#b22222' : stats.recentCount >= 1 ? '#e65100' : '#3d6263'}">${stats.recentCount}</span>
            <span class="usage-stat-label">Last 3 Months</span>
        </div>
        <div class="usage-divider"></div>
        <div class="usage-stat">
            <span class="usage-last">${stats.lastUsed ? formatDate(stats.lastUsed) : "—"}</span>
            <span class="usage-last-label">Last Used</span>
        </div>
        ${recentWarning ? `<div class="usage-divider"></div>${recentWarning}` : ""}
    `;
}

async function smartScanArtist() {
    const youtubeUrl = document.getElementById("youtube").value;
    const songTitleFromDB = document.getElementById("edit-title").value;
    const status = document.getElementById("artist-status");

    if (!youtubeUrl) return;

    status.innerText = "Scanning YouTube...";

    try {
        const response = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(youtubeUrl)}`);
        const data = await response.json();

        if (data.title) {
            let videoTitle = data.title;
            let artist = "";

            const separators = [" - ", " | ", " // ", " — "];
            let parts = [videoTitle];

            for (let sep of separators) {
                if (videoTitle.includes(sep)) {
                    parts = videoTitle.split(sep);
                    break;
                }
            }

            if (parts.length > 1) {
                const part1 = parts[0].trim();
                const part2 = parts[1].trim();
                if (part1.toLowerCase().includes(songTitleFromDB.toLowerCase())) {
                    artist = part2;
                } else {
                    artist = part1;
                }
            } else {
                const regex = new RegExp(songTitleFromDB.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "gi");
                artist = videoTitle.replace(regex, "");
            }

            artist = artist.replace(/^\s*by\s+/i, "").replace(/\s+by\s*$/i, "").trim();
            artist = artist.replace(/\(.*\)|\[.*\]/g, "")
                           .replace(/lyrics|official video|live|video|audio|hd|4k/gi, "")
                           .replace(/^[:\-\s\u2013\u2014]+|[:\-\s\u2013\u2014]+$/g, "")
                           .trim();

            if (!artist || artist.length < 2) {
                artist = data.author_name.replace("- Topic", "").trim();
            }

            document.getElementById("artist").value = artist;

            if (currentDoc) {
                await db.collection("songs").doc(currentDoc).update({ artist: artist });
                status.innerText = "Artist auto-saved!";
                setTimeout(() => { status.innerText = ""; }, 3000);
            }
        }
    } catch (e) {
        console.log("Auto-scan failed.");
        status.innerText = "";
    }
}

async function deleteSong() {
    if (!currentDoc) return;

    const confirmDelete = confirm("Are you sure you want to permanently delete this song? This cannot be undone.");
    if (!confirmDelete) return;

    try {
        await db.collection("songs").doc(currentDoc).delete();
        alert("Song deleted successfully.");
        document.getElementById("editor").style.display = "none";
        document.getElementById("display-title").innerText = "Select a Song";
        currentDoc = null;
        loadSongs();
    } catch (err) {
        console.error(err);
        alert("Error deleting song.");
    }
}

function renderFiles() {
    const container = document.getElementById("files-container");
    container.innerHTML = currentFiles.map((file, index) => `
        <div class="file-item">
            <div class="file-row"><label>File Name</label><input type="text" value="${file.name}" onchange="updateFileMetadata(${index}, 'name', this.value)"></div>
            <div class="file-row"><label>Key</label><select onchange="updateFileMetadata(${index}, 'key', this.value)">${getKeyOptionsHTML(file.key)}</select></div>
            <div class="file-row"><label>Type</label>
                <select onchange="updateFileMetadata(${index}, 'type', this.value)">
                    <option value="Chord Sheet" ${file.type === 'Chord Sheet' ? 'selected' : ''}>Chord Sheet</option>
                    <option value="Lead Sheet" ${file.type === 'Lead Sheet' ? 'selected' : ''}>Lead Sheet</option>
                    <option value="Sheet Music" ${file.type === 'Sheet Music' ? 'selected' : ''}>Sheet Music</option>
                    <option value="Lyrics" ${file.type === 'Lyrics' ? 'selected' : ''}>Lyrics</option>
                    <option value="Other" ${file.type === 'Other' ? 'selected' : ''}>Other</option>
                </select>
            </div>
            <a href="${file.url}" target="_blank" class="view-link">View Physical File</a>
        </div>
    `).join("");
}

function updateFileMetadata(index, field, value) { currentFiles[index][field] = value; }

async function save() {
    if (!currentDoc) return;
    const newTitle = document.getElementById("edit-title").value;
    await db.collection("songs").doc(currentDoc).update({
        title: newTitle,
        normalized: normalizeTitle(newTitle),
        artist: document.getElementById("artist").value,
        youtube: document.getElementById("youtube").value,
        ccli: document.getElementById("ccli").value,
        files: currentFiles
    });
    document.getElementById("display-title").innerText = newTitle;
    alert("All changes saved.");
    loadSongs();
}

async function handleLyricsSearch(e) {
    if (e.key !== "Enter") return;
    const text = document.getElementById("lyricsSearch").value;
    if (!text) { loadSongs(); return; }

    try {
        const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(text)}&entity=song&limit=5`);
        const result = await response.json();

        if (!result.results || result.results.length === 0) {
            alert("No matches found online.");
            return;
        }

        const allSongsSnapshot = await db.collection("songs").get();
        const allSongs = allSongsSnapshot.docs;

        const matchingDocs = [];
        const seenIds = new Set();

        for (let item of result.results) {
            const onlineTitle = normalizeTitle(item.trackName);
            const onlineKeywords = onlineTitle.split(' ').filter(w => w.length > 3);

            allSongs.forEach(doc => {
                const dbTitle = normalizeTitle(doc.data().title);
                const isPhraseMatch = dbTitle.includes(onlineTitle) || onlineTitle.includes(dbTitle);
                const matchesMultipleKeywords = onlineKeywords.length > 0 &&
                                              onlineKeywords.filter(k => dbTitle.includes(k)).length >= Math.ceil(onlineKeywords.length / 2);

                if ((isPhraseMatch || matchesMultipleKeywords) && !seenIds.has(doc.id)) {
                    matchingDocs.push(doc);
                    seenIds.add(doc.id);
                }
            });
        }

        if (matchingDocs.length > 0) {
            renderList(matchingDocs);
            if (matchingDocs.length === 1) {
                openSong(matchingDocs[0].id);
            } else {
                alert(`Found ${matchingDocs.length} potential matches for those lyrics.`);
            }
        } else {
            alert(`Found matches like "${result.results[0].trackName}" online, but no similar title exists in your database.`);
        }
    } catch (err) {
        console.error(err);
        alert("Search failed. Check your internet connection.");
    }
}

loadSongs();
</script>
</body>
</html>
