<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Team Charter</title>
    <style>
        :root {
            --pale-teal: #f0f6f6;
            --border-teal: #d1dfdf;
            --accent-teal: #3d6263;
            --white: #ffffff;
            --brand-green: #9bc34a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--pale-teal); min-height: 100vh; }

        /* ── ADMIN BAR ── */
        #admin-bar {
            background: var(--accent-teal);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 500;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .admin-bar-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.6);
            margin-right: 4px;
        }
        .admin-bar-btn {
            padding: 5px 14px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.15);
            color: #fff;
            transition: background 0.15s;
        }
        .admin-bar-btn:hover { background: rgba(255,255,255,0.28); }
        .admin-bar-btn.green { background: var(--brand-green); border-color: var(--brand-green); }
        .admin-bar-btn.red   { background: #f44336; border-color: #f44336; }
        .admin-bar-btn.login { background: rgba(255,255,255,0.1); }
        #admin-mode-badge {
            display: none;
            font-size: 10px;
            font-weight: 700;
            color: var(--brand-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: auto;
        }

        /* ── PAGE BODY ── */
        .page-wrap { max-width: 1100px; margin: 0 auto; padding: 30px 24px 60px; }

        /* ── PHOTO GALLERY ── */
        #photo-gallery-section {
            background: var(--white);
            border: 1px solid var(--border-teal);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .section-heading {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-teal);
            margin-bottom: 16px;
            opacity: 0.6;
        }
        #photo-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
            align-items: flex-end;
            min-height: 20px;
        }
        #photo-gallery:empty + .gallery-empty-hint { display: block; }
        .gallery-empty-hint {
            display: none;
            font-size: 12px;
            color: #a0b0b0;
            font-style: italic;
        }

        /* Tilted photo frames */
        .photo-frame-wrap {
            position: relative;
            display: inline-block;
            margin: 8px 6px;
            transition: transform 0.2s ease, z-index 0s;
        }
        .photo-frame-wrap:nth-child(4n+1) { transform: rotate(-3deg);   margin-top: 16px; }
        .photo-frame-wrap:nth-child(4n+2) { transform: rotate(2.5deg);  margin-top: 4px; }
        .photo-frame-wrap:nth-child(4n+3) { transform: rotate(-1.5deg); margin-top: 20px; }
        .photo-frame-wrap:nth-child(4n+4) { transform: rotate(3deg);    margin-top: 8px; }
        .photo-frame-wrap:hover { transform: rotate(0deg) scale(1.06); z-index: 20; }

        .photo-frame {
            background: var(--white);
            padding: 8px 8px 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.16), 0 1px 4px rgba(0,0,0,0.08);
            border-radius: 2px;
            border: 1px solid #e8e8e8;
        }
        .photo-frame img {
            display: block;
            width: 150px;
            height: 150px;
            object-fit: cover;
        }

        /* Admin delete overlay */
        .photo-delete-btn {
            display: none;
            position: absolute;
            top: -7px; right: -7px;
            width: 22px; height: 22px;
            background: #f44336;
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            line-height: 1;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        body.admin-mode .photo-delete-btn { display: flex; }

        /* Add photo tile */
        #photo-add-tile {
            display: none;
            width: 150px;
            height: 186px;
            border: 2px dashed var(--border-teal);
            border-radius: 8px;
            background: var(--pale-teal);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            margin: 8px 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #a0b0b0;
            transition: border-color 0.15s, background 0.15s;
        }
        #photo-add-tile:hover { border-color: var(--accent-teal); background: var(--white); color: var(--accent-teal); }
        #photo-add-tile span { font-size: 22px; }
        body.admin-mode #photo-add-tile { display: flex; }

        /* ── CONTENT PANEL ── */
        #content-panel {
            background: var(--white);
            border: 1px solid var(--border-teal);
            border-radius: 12px;
            overflow: hidden;
        }
        #content-panel-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-teal);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #content-panel-header h3 {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-teal);
        }
        #content-display {
            padding: 28px 32px;
            min-height: 120px;
            font-size: 14px;
            color: #444;
            line-height: 1.7;
        }
        /* Styles for content inside the display area */
        #content-display h2 { font-size: 20px; font-weight: 400; color: var(--accent-teal); margin: 0 0 10px; }
        #content-display h3 { font-size: 16px; font-weight: 600; color: var(--accent-teal); margin: 18px 0 8px; }
        #content-display h4 { font-size: 14px; font-weight: 600; color: var(--accent-teal); margin: 14px 0 6px; }
        #content-display p  { margin-bottom: 12px; }
        #content-display ul, #content-display ol { padding-left: 22px; margin-bottom: 12px; }
        #content-display li { margin-bottom: 5px; }
        #content-display strong { color: var(--accent-teal); }
        #content-display a { color: var(--accent-teal); }
        #content-display hr { border: none; border-top: 1px solid var(--border-teal); margin: 20px 0; }
        #content-display blockquote { border-left: 3px solid var(--brand-green); padding-left: 14px; margin: 12px 0; color: #7a8c8c; font-style: italic; }
        #content-display img { max-width: 100%; border-radius: 6px; margin: 8px 0; }
        #content-display table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        #content-display th { background: var(--accent-teal); color: #fff; padding: 9px 12px; font-size: 11px; text-align: left; font-weight: 700; }
        #content-display td { padding: 9px 12px; border-bottom: 1px solid var(--border-teal); font-size: 13px; }
        #content-display tr:nth-child(even) td { background: var(--pale-teal); }

        .content-empty { padding: 40px 20px; text-align: center; color: #a0b0b0; font-size: 13px; }

        /* HTML editor */
        #html-editor-wrap {
            display: none;
            padding: 20px;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid var(--border-teal);
        }
        #html-textarea {
            width: 100%;
            min-height: 260px;
            padding: 14px;
            border: 2px solid var(--border-teal);
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            background: var(--pale-teal);
            outline: none;
            resize: vertical;
            line-height: 1.5;
        }
        #html-textarea:focus { border-color: var(--accent-teal); }
        .editor-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .editor-btn {
            padding: 8px 18px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
        }
        .editor-btn.primary { background: var(--accent-teal); color: #fff; }
        .editor-btn.cancel  { background: #e0e8e8; color: var(--accent-teal); }
        .editor-btn.danger  { background: #f44336; color: #fff; }

        /* ── PASSWORD MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(61,98,99,0.45);
            z-index: 900;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--white);
            border-radius: 16px;
            padding: 28px;
            width: 380px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.15);
        }
        .modal-box h3 { font-size: 17px; font-weight: 600; color: var(--accent-teal); margin-bottom: 6px; }
        .modal-box p  { font-size: 13px; color: #7a8c8c; margin-bottom: 18px; }
        .modal-box label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--accent-teal); margin: 12px 0 5px; }
        .modal-box input { width: 100%; padding: 10px; border: 2px solid var(--border-teal); border-radius: 8px; outline: none; font-family: inherit; font-size: 13px; }
        .modal-box input:focus { border-color: var(--accent-teal); }
        .modal-error { font-size: 11px; color: #f44336; min-height: 16px; margin: 6px 0 10px; }
        .modal-btn-row { display: flex; gap: 10px; margin-top: 16px; }
        .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .modal-btn.primary { background: var(--accent-teal); color: #fff; }
        .modal-btn.cancel  { background: #e0e8e8; color: var(--accent-teal); }

        /* ── TOAST ── */
        #toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: var(--accent-teal); color: #fff;
            padding: 9px 20px; border-radius: 9999px;
            font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            z-index: 800; display: none; white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<!-- Admin bar -->
<div id="admin-bar">
    <span class="admin-bar-label">Charter</span>
    <div id="admin-locked-controls">
        <button class="admin-bar-btn login" onclick="openPwModal()">&#128273; Admin Edit</button>
    </div>
    <div id="admin-unlocked-controls" style="display:none; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="admin-bar-btn" onclick="toggleTitleEdit()">&#10002; Edit Title</button>
        <button class="admin-bar-btn" onclick="openHtmlEditor()">&#128196; Edit Content</button>
        <button class="admin-bar-btn green" onclick="document.getElementById('photo-file-input').click()">&#128444; Add Photos</button>
        <button class="admin-bar-btn red" onclick="logoutAdmin()">Log Out</button>
    </div>
    <span id="admin-mode-badge">&#128273; Admin Mode</span>
</div>

<input type="file" id="photo-file-input" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(event)">

<!-- Page body -->
<div class="page-wrap">
    <div style="padding:0 0 20px;">
        <div id="page-title-display" style="font-size:22px;font-weight:300;color:var(--accent-teal);letter-spacing:0.3px;"></div>
        <input type="text" id="page-title-input" placeholder="Page title&hellip;" style="display:none;font-size:20px;font-weight:300;color:var(--accent-teal);border:2px solid var(--border-teal);border-radius:8px;padding:6px 14px;font-family:'Montserrat',sans-serif;outline:none;min-width:280px;">
    </div>

    <!-- Photos -->
    <div id="photo-gallery-section">
        <div class="section-heading">Photos</div>
        <div id="photo-gallery"></div>
        <div class="gallery-empty-hint" id="gallery-hint">No photos yet. Log in as admin to add photos.</div>
        <div id="photo-add-tile" onclick="document.getElementById('photo-file-input').click()">
            <span>&#128444;</span>
            Add Photos
        </div>
    </div>

    <!-- Content -->
    <div id="content-panel">
        <div id="content-panel-header">
            <h3>Charter Content</h3>
        </div>
        <div id="content-display">
            <div class="content-empty">No content yet. Log in as admin and click "Edit Content" to add HTML.</div>
        </div>
        <div id="html-editor-wrap">
            <textarea id="html-textarea" placeholder="Paste your HTML content here&hellip;"></textarea>
            <div class="editor-btn-row">
                <button class="editor-btn primary" onclick="applyHtml()">&#10003; Apply &amp; Save</button>
                <button class="editor-btn cancel" onclick="closeHtmlEditor()">Cancel</button>
                <button class="editor-btn danger" onclick="clearContent()">Clear Content</button>
            </div>
        </div>
    </div>

</div>

<!-- Password modal -->
<div class="modal-overlay" id="pw-modal">
    <div class="modal-box">
        <h3>Admin Access</h3>
        <p>Enter the admin password to edit this page.</p>
        <label>Password</label>
        <input type="password" id="pw-input" placeholder="Password&hellip;" onkeydown="if(event.key==='Enter')checkPassword()">
        <div class="modal-error" id="pw-error"></div>
        <div class="modal-btn-row">
            <button class="modal-btn cancel" onclick="closePwModal()">Cancel</button>
            <button class="modal-btn primary" onclick="checkPassword()">Unlock</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const PAGE_ID  = 'core-team-charter';
const ADMIN_PW = 'Surreykt10';

let isAdmin = false;
let isEditingTitle = false;
let photos  = [];

// ── INIT ──
window.addEventListener('load', loadSaved);

function loadSaved() {
    const saved = JSON.parse(localStorage.getItem(PAGE_ID) || '{}');
    const title = saved.title || 'Core Team Charter';
    document.getElementById('page-title-display').textContent = title;
    document.getElementById('page-title-input').value = title;
    document.title = title;
    const defaultHtml = `<h2>Core Team Charter</h2>
<blockquote>We lead not by talent or title, but by character, humility, and a servant heart.</blockquote>

<h3>Our Identity &amp; Posture</h3>
<p>The Core Team exists to set the culture of the Worship &amp; AV Ministry. We model what we want the whole team to become: worshippers first, musicians second, servants always.</p>

<h3>When We Disagree</h3>
<p>We recognise that we may not always share the same theological views or ministry preferences. When differences arise, we commit to speaking with love, humility, and respect, keeping Jesus at the centre of every conversation. Our unity is not built on sameness, but on Christ-like love (John 13:35).</p>

<h3>Visible Lives of Discipleship</h3>
<p>Because we serve in a visible ministry, our lives should reflect the character and way of Jesus — not perfectly, but sincerely. We commit to living in a way that honours Christ in our relationships, choices, and conduct.</p>
<p>We recognise that certain lifestyle choices that reflect a hedonistic or self-centred way of living are not compatible with the calling of leading others in worship. This applies to behaviours we choose, not to aspects of identity or circumstances people cannot control.</p>
<p>We choose integrity, accountability, and holiness, seeking to grow in Christ.</p>

<h3>How We Lead</h3>
<ul>
<li><strong>Servant leadership</strong> — we lead by example, not position</li>
<li><strong>Visible support on Sundays</strong> — present, engaged, and encouraging</li>
<li><strong>Teachable spirits</strong> — always willing to learn and grow</li>
<li><strong>Culture carriers</strong> — we set the tone for the whole team</li>
<li><strong>Spiritual sensitivity</strong> — attuned to God and to one another</li>
</ul>

<h3>Our Commitment</h3>
<ul>
<li>We lead by example</li>
<li>We protect unity</li>
<li>We champion others</li>
<li>We communicate clearly</li>
<li>We honour AV as equal partners</li>
<li>We steward Sundays with prayer</li>
</ul>`;
    const htmlContent = saved.html || defaultHtml;
    document.getElementById('content-display').innerHTML = htmlContent;
    document.getElementById('html-textarea').value = htmlContent;
    if (saved.photos) {
        photos = saved.photos;
        renderPhotos();
    }
}

function saveAll() {
    localStorage.setItem(PAGE_ID, JSON.stringify({
        title:  document.getElementById('page-title-display').textContent,
        html:   document.getElementById('content-display').innerHTML,
        photos: photos
    }));
}

// ── ADMIN ──
function openPwModal() {
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-error').textContent = '';
    document.getElementById('pw-modal').classList.add('open');
    setTimeout(() => document.getElementById('pw-input').focus(), 150);
}
function closePwModal() {
    document.getElementById('pw-modal').classList.remove('open');
}
document.getElementById('pw-modal').addEventListener('click', function(e) {
    if (e.target === this) closePwModal();
});

function checkPassword() {
    if (document.getElementById('pw-input').value === ADMIN_PW) {
        isAdmin = true;
        closePwModal();
        document.getElementById('admin-locked-controls').style.display   = 'none';
        document.getElementById('admin-unlocked-controls').style.display = 'flex';
        document.getElementById('admin-mode-badge').style.display        = 'block';
        document.getElementById('gallery-hint').style.display = photos.length ? 'none' : 'block';
        document.body.classList.add('admin-mode');
        renderPhotos();
        toast('Admin mode unlocked');
    } else {
        document.getElementById('pw-error').textContent = 'Incorrect password.';
        document.getElementById('pw-input').value = '';
        document.getElementById('pw-input').focus();
    }
}

function logoutAdmin() {
    isAdmin = false;
    document.getElementById('admin-locked-controls').style.display   = 'block';
    document.getElementById('admin-unlocked-controls').style.display = 'none';
    document.getElementById('admin-mode-badge').style.display        = 'none';
    document.body.classList.remove('admin-mode');
    if (isEditingTitle) cancelTitleEdit();
    closeHtmlEditor();
    renderPhotos();
    toast('Logged out');
}

// ── TITLE ──
function toggleTitleEdit() {
    if (!isAdmin) return;
    isEditingTitle ? saveTitleEdit() : startTitleEdit();
}
function startTitleEdit() {
    isEditingTitle = true;
    document.getElementById('page-title-display').style.display = 'none';
    document.getElementById('page-title-input').style.display   = 'block';
    document.getElementById('page-title-input').focus();
    document.getElementById('page-title-input').select();
}
function saveTitleEdit() {
    const val = document.getElementById('page-title-input').value.trim() || 'Untitled';
    document.getElementById('page-title-display').textContent = val;
    document.getElementById('page-title-display').style.display = '';
    document.getElementById('page-title-input').style.display   = 'none';
    document.title = val;
    isEditingTitle = false;
    saveAll();
    toast('Title saved');
}
function cancelTitleEdit() {
    document.getElementById('page-title-display').style.display = '';
    document.getElementById('page-title-input').style.display   = 'none';
    isEditingTitle = false;
}
document.getElementById('page-title-input').addEventListener('keydown', e => {
    if (e.key === 'Enter')  saveTitleEdit();
    if (e.key === 'Escape') cancelTitleEdit();
});

// ── HTML EDITOR ──
function openHtmlEditor() {
    if (!isAdmin) return;
    const current = document.getElementById('content-display').innerHTML;
    const isEmpty = current.includes('content-empty') || current.trim() === '';
    document.getElementById('html-textarea').value = isEmpty ? '' : current;
    document.getElementById('html-editor-wrap').style.display = 'flex';
    document.getElementById('html-textarea').focus();
}
function closeHtmlEditor() {
    document.getElementById('html-editor-wrap').style.display = 'none';
}
function applyHtml() {
    const html = document.getElementById('html-textarea').value.trim();
    document.getElementById('content-display').innerHTML = html ||
        '<div class="content-empty">No content yet. Log in as admin and click &ldquo;Edit Content&rdquo; to add HTML.</div>';
    closeHtmlEditor();
    saveAll();
    toast('Content saved &#10003;');
}
function clearContent() {
    if (!confirm('Clear all content?')) return;
    document.getElementById('html-textarea').value = '';
    document.getElementById('content-display').innerHTML =
        '<div class="content-empty">No content yet. Log in as admin and click &ldquo;Edit Content&rdquo; to add HTML.</div>';
    closeHtmlEditor();
    saveAll();
    toast('Content cleared');
}

// ── PHOTOS ──
function handlePhotoUpload(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;
    let loaded = 0;
    files.forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
            photos.push({ dataUrl: e.target.result, name: file.name });
            loaded++;
            if (loaded === files.length) {
                renderPhotos();
                saveAll();
                toast(`${files.length} photo${files.length > 1 ? 's' : ''} added`);
                document.getElementById('gallery-hint').style.display = 'none';
            }
        };
        reader.readAsDataURL(file);
    });
    event.target.value = '';
}

function renderPhotos() {
    const gallery = document.getElementById('photo-gallery');
    gallery.innerHTML = '';
    photos.forEach((photo, index) => {
        const wrap  = document.createElement('div');
        wrap.className = 'photo-frame-wrap';
        const frame = document.createElement('div');
        frame.className = 'photo-frame';
        const img   = document.createElement('img');
        img.src = photo.dataUrl;
        img.alt = photo.name || 'Photo';
        frame.appendChild(img);
        if (isAdmin) {
            const del = document.createElement('button');
            del.className = 'photo-delete-btn';
            del.innerHTML = '&times;';
            del.title = 'Remove photo';
            del.addEventListener('click', e => { e.stopPropagation(); removePhoto(index); });
            wrap.appendChild(del);
        }
        wrap.appendChild(frame);
        gallery.appendChild(wrap);
    });
    if (!photos.length && !isAdmin) {
        document.getElementById('gallery-hint').style.display = 'block';
    } else {
        document.getElementById('gallery-hint').style.display = 'none';
    }
}

function removePhoto(index) {
    if (!confirm('Remove this photo?')) return;
    photos.splice(index, 1);
    renderPhotos();
    saveAll();
    toast('Photo removed');
}

// ── TOAST ──
function toast(msg) {
    const t = document.getElementById('toast');
    t.innerHTML = msg; t.style.display = 'block';
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2500);
}
</script>
</body>
</html>
