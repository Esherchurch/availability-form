<!DOCTYPE html>
<html>
<head>
    <title>Worship & AV Hub | Email Compiler</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.4.5/gifshot.min.js"></script>

    <style>
        :root { --brand-blue: #3d6263; --border-light: #d1dfdf; }
        body { margin: 0; padding: 0; background: var(--brand-blue); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Toolbar Styling */
        #toolbar { background: #ffffff; padding: 10px 40px; display: flex; gap: 8px; align-items: center; border-bottom: 2px solid var(--border-light); z-index: 10; flex-wrap: wrap; }
        .btn { background: var(--brand-blue); color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn:hover { background: #2c4849; }
        select { padding: 6px; border-radius: 4px; border: 1px solid var(--border-light); font-size: 12px; }
        
        /* Workspace */
        #compiler-window { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; justify-content: center; }
        #email-canvas { background: #ffffff; width: 600px; min-height: 850px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        /* Editable Area */
        #editable-body { padding: 40px; outline: none; min-height: 700px; color: #333333; line-height: 1.6; font-size: 16px; }
        #editable-body img { cursor: nwse-resize; border: 2px solid transparent; vertical-align: middle; }
        #editable-body img:hover { border: 2px dashed var(--brand-blue); }
        
        /* Loading Overlay */
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(61, 98, 99, 0.9); color: white; z-index: 1000; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #fff; border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <h2 id="load-text">Processing...</h2>
    <p>Please wait while we handle the media files.</p>
</div>

<div id="toolbar">
    <button class="btn" onclick="document.execCommand('bold')">B</button>
    <button class="btn" onclick="document.execCommand('italic')">I</button>
    
    <select onchange="document.execCommand('fontSize', false, this.value); this.value=''">
        <option value="">Text Size</option>
        <option value="1">Small</option>
        <option value="3">Normal</option>
        <option value="5">Large</option>
        <option value="7">Huge</option>
    </select>

    <button class="btn" onclick="createGif()">Add GIF</button>
    <button class="btn" onclick="uploadImage()">Add Photo</button>
    
    <div style="width: 1px; height: 20px; background: #ccc; margin: 0 5px;"></div>
    
    <button class="btn" onclick="document.execCommand('justifyLeft')">Left</button>
    <button class="btn" onclick="document.execCommand('justifyCenter')">Center</button>
    <button class="btn" onclick="document.execCommand('justifyRight')">Right</button>
    
    <div style="flex-grow: 1;"></div>
    <button class="btn" onclick="compileAndLaunch()" style="background: #e67e22;">Launch Outlook & Copy Email</button>
</div>

<div id="compiler-window">
    <div id="email-canvas">
        <div id="editable-body" contenteditable="true">
            <p>Start your message here...</p>
        </div>
    </div>
</div>

<script>
// FIREBASE CONFIGURATION
const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner",
    storageBucket: "egbc-worship-planner.firebasestorage.app"
};
firebase.initializeApp(firebaseConfig);
const storage = firebase.storage();

// CLICK IMAGE TO RESIZE
document.getElementById('editable-body').addEventListener('click', function(e) {
    if (e.target.tagName === 'IMG') {
        const currentWidth = e.target.style.width || e.target.width || "250px";
        const newWidth = prompt("Enter width (e.g., 300 for pixels or 100% for full width):", currentWidth);
        if (newWidth) {
            e.target.style.width = newWidth.includes('%') ? newWidth : newWidth + "px";
            e.target.style.height = "auto"; 
        }
    }
});

// IMAGE UPLOAD
function uploadImage() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = e => {
        const file = e.target.files[0];
        if (file) processAndUpload(file, file.name.split('.').pop());
    };
    input.click();
}

// GIF GENERATOR (Optimized for Speed)
function createGif() {
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.accept = 'image/*';
    input.onchange = async (e) => {
        const files = Array.from(e.target.files);
        if (files.length < 2) return alert("Please select at least 2 images for a GIF.");
        
        toggleLoader(true, "Stitching GIF... (This takes a few moments)");
        
        const imageUrls = files.map(f => URL.createObjectURL(f));
        
        gifshot.createGIF({
            images: imageUrls,
            interval: 0.5,
            gifWidth: 600,
            numWorkers: 4,      // Faster processing
            sampleInterval: 10  // Balances quality and speed
        }, (obj) => {
            if (!obj.error) {
                processAndUpload(obj.image, "gif", true);
            } else {
                alert("Error creating GIF: " + obj.error);
                toggleLoader(false);
            }
        });
    };
    input.click();
}

// MEDIA UPLOAD TO FIREBASE
async function processAndUpload(data, ext, isBase64 = false) {
    toggleLoader(true, "Uploading to Secure Hub...");
    const ref = storage.ref(`email_assets/${Date.now()}.${ext}`);
    try {
        let blob = data;
        if(isBase64) {
            const res = await fetch(data);
            blob = await res.blob();
        }
        await ref.put(blob);
        const url = await ref.getDownloadURL();
        
        // Injects image as inline-block so alignment buttons work
        const imgHtml = `<img src="${url}" style="width:250px; height:auto; display:inline-block; margin:10px; vertical-align:middle;">`;
        document.execCommand('insertHTML', false, imgHtml);
    } catch (err) {
        console.error(err);
        alert("Upload failed. Check connection.");
    }
    toggleLoader(false);
}

// COMPILER AND OUTLOOK LAUNCHER
async function compileAndLaunch() {
    const bodyContent = document.getElementById('editable-body').innerHTML;
    
    // Header specifically formatted for the final Outlook Email
    const outlookHeader = `
        <table width="100%" border="0" cellpadding="0" cellspacing="0" style="background:#ffffff; border-bottom:1px solid #d1dfdf;">
            <tr>
                <td style="padding:15px 30px;">
                    <img src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media&token=ea8cd929-6f35-4a23-9ffa-e78ac46fa300" width="100" style="display:block;">
                </td>
                <td align="right" style="padding:15px 30px; font-family:'Segoe UI', Tahoma, sans-serif;">
                    <div style="font-size:10px; color:#a0b0b0; text-transform:uppercase;">Secure Portal</div>
                    <div style="font-size:12px; color:#3d6263; font-weight:700;">Worship & AV Hub</div>
                </td>
            </tr>
        </table>`;

    const finalHtml = `
        <!DOCTYPE html>
        <html>
        <head>
            </head>
        <body style="margin:0; padding:0; background-color:#ffffff;">
            <table width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#ffffff">
                <tr>
                    <td align="center">
                        <table width="600" border="0" cellspacing="0" cellpadding="0" style="width:600px;">
                            <tr><td>${outlookHeader}</td></tr>
                            <tr>
                                <td style="padding:30px; font-family:'Segoe UI', Arial, sans-serif; font-size:16px; color:#333333;">
                                    ${bodyContent}
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </body>
        </html>`;

    try {
        const type = "text/html";
        const blob = new Blob([finalHtml], { type });
        const data = [new ClipboardItem({ [type]: blob })];
        await navigator.clipboard.write(data);
        
        alert("Email Compiled! Click OK to launch Outlook, then Paste (Ctrl+V).");
        window.location.href = "mailto:?subject=Worship & AV Update";
    } catch (err) {
        console.error(err);
        alert("Failed to copy HTML. Please try again.");
    }
}

function toggleLoader(show, text) {
    document.getElementById('loader').style.display = show ? 'flex' : 'none';
    document.getElementById('load-text').innerText = text;
}
</script>

</body>
</html>
