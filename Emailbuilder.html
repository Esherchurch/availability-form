<!DOCTYPE html>
<html>
<head>
    <title>Worship & AV Team | Email Compiler</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        :root { --brand-blue: #3d6263; --brand-light: #a0b0b0; --border-light: #d1dfdf; }
        body { margin: 0; padding: 0; background: var(--brand-blue); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #toolbar { background: #ffffff; padding: 10px 40px; display: flex; gap: 8px; align-items: center; border-bottom: 2px solid var(--border-light); z-index: 10; flex-wrap: wrap; }
        .btn { background: var(--brand-blue); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; text-transform: uppercase; }
        .btn:hover { background: #2c4849; }
        
        #compiler-window { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; justify-content: center; }
        #email-canvas { background: #ffffff; width: 700px; min-height: 850px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        #editable-body { padding: 40px; outline: none; min-height: 700px; color: #333333; line-height: 1.6; font-size: 16px; border: 1px solid transparent; }
        #editable-body img { cursor: pointer; max-width: 100%; height: auto; display: inline-block; border: 3px solid transparent; transition: border 0.2s; }
        #editable-body img.selected-img { border: 3px solid #e67e22 !important; }
        
        .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid #eee; display: inline-block; margin-right: 5px; }
        
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(61, 98, 99, 0.98); color: white; z-index: 1000; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #fff; border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <h2 id="load-text">Syncing...</h2>
</div>

<div id="toolbar">
    <button class="btn" onmousedown="event.preventDefault(); document.execCommand('bold');">B</button>
    <button class="btn" onmousedown="event.preventDefault(); document.execCommand('italic');">I</button>
    
    <select onchange="document.execCommand('fontSize', false, this.value); this.value=''">
        <option value="">Font Size</option>
        <option value="1">Small</option>
        <option value="3">Normal</option>
        <option value="5">Large</option>
        <option value="7">Extra Large</option>
    </select>

    <div style="display:flex; align-items:center; border-left:1px solid #ddd; padding-left:10px;">
        <div class="color-dot" style="background:#3d6263;" onmousedown="event.preventDefault(); document.execCommand('foreColor', false, '#3d6263');"></div>
        <div class="color-dot" style="background:#a0b0b0;" onmousedown="event.preventDefault(); document.execCommand('foreColor', false, '#a0b0b0');"></div>
        <div class="color-dot" style="background:#000000;" onmousedown="event.preventDefault(); document.execCommand('foreColor', false, '#000000');"></div>
    </div>

    <button class="btn" onclick="uploadImage()">Add Image / GIF</button>
    <button class="btn" onclick="triggerResize()" style="background:#8b4513;">Resize Selection</button>
    <button class="btn" onclick="insertSideLayout()">2-Col Layout</button>
    
    <div style="width: 1px; height: 20px; background: #ccc; margin: 0 5px;"></div>
    
    <button class="btn" onmousedown="event.preventDefault(); document.execCommand('justifyLeft');">L</button>
    <button class="btn" onmousedown="event.preventDefault(); document.execCommand('justifyCenter');">C</button>
    <button class="btn" onmousedown="event.preventDefault(); document.execCommand('justifyRight');">R</button>
    
    <div style="flex-grow: 1;"></div>
    <button class="btn" onclick="compileAndLaunch()" style="background: #e67e22;">Copy for Outlook</button>
</div>

<div id="compiler-window">
    <div id="email-canvas">
        <div id="editable-body" contenteditable="true">
            <p>Start your message here...</p>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner",
    storageBucket: "egbc-worship-planner.firebasestorage.app"
};
firebase.initializeApp(firebaseConfig);
const storage = firebase.storage();

let lastClickedImg = null;

// Track the clicked image to ensure resizing works
document.getElementById('editable-body').addEventListener('click', function(e) {
    if (e.target.tagName === 'IMG') {
        // Remove highlight from previous
        if (lastClickedImg) lastClickedImg.classList.remove('selected-img');
        
        lastClickedImg = e.target;
        lastClickedImg.classList.add('selected-img');
    } else {
        if (lastClickedImg) lastClickedImg.classList.remove('selected-img');
        lastClickedImg = null;
    }
});

function triggerResize() {
    if (lastClickedImg) {
        const val = prompt("Enter width (e.g. 300 or 100%):", lastClickedImg.getAttribute('width') || "300");
        if (val) {
            const cleanVal = val.replace('px', '');
            lastClickedImg.setAttribute('width', cleanVal);
            lastClickedImg.style.width = cleanVal.includes('%') ? cleanVal : cleanVal + "px";
        }
    } else {
        alert("Please click an image first to highlight it (it will show an orange border), then click Resize.");
    }
}

function insertSideLayout() {
    const html = `<table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin:20px 0;">
                    <tr>
                        <td width="50%" valign="top" style="padding:10px;">[Left Content]</td>
                        <td width="50%" valign="top" style="padding:10px;">[Right Content]</td>
                    </tr>
                  </table><p></p>`;
    document.execCommand('insertHTML', false, html);
}

function uploadImage() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*,image/gif';
    input.onchange = e => processAndUpload(e.target.files[0], e.target.files[0].name.split('.').pop());
    input.click();
}

async function processAndUpload(data, ext) {
    toggleLoader(true, "Uploading to Hub...");
    const ref = storage.ref(`email_assets/${Date.now()}.${ext}`);
    try {
        await ref.put(data);
        const url = await ref.getDownloadURL();
        // Insert with tabindex so it can receive focus
        const imgHtml = `<img src="${url}" width="300" style="width:300px; height:auto; display:inline-block; margin:10px 0;">`;
        document.execCommand('insertHTML', false, imgHtml);
    } catch (err) { alert("Upload error: " + err.message); }
    toggleLoader(false);
}

async function compileAndLaunch() {
    // Remove the orange border from images before exporting
    const clone = document.getElementById('editable-body').cloneNode(true);
    clone.querySelectorAll('img').forEach(img => img.classList.remove('selected-img'));
    const bodyContent = clone.innerHTML;

    const outlookHeader = `<table width="100%" border="0" cellpadding="0" cellspacing="0" style="background:#ffffff; border-bottom:1px solid #d1dfdf;">
        <tr>
            <td style="padding:20px 30px;">
                <img src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media&token=ea8cd929-6f35-4a23-9ffa-e78ac46fa300" width="120" style="display:block;">
            </td>
            <td align="right" style="padding:20px 30px; font-family:'Segoe UI', Tahoma, sans-serif;">
                <div style="font-size: 14px; color: #3d6263; font-weight: 700;">Worship & AV Team</div>
            </td>
        </tr>
    </table>`;

    const finalHtml = `<!DOCTYPE html><html><head></head><body style="margin:0;padding:0;background-color:#ffffff;"><table width="100%" border="0" cellspacing="0" cellpadding="0"><tr><td align="center"><table width="700" border="0" cellspacing="0" cellpadding="0" style="width:700px;"><tr><td>${outlookHeader}</td></tr><tr><td style="padding:40px; font-family:'Segoe UI', Arial, sans-serif; font-size:16px; color:#333333; line-height:1.5;">${bodyContent}</td></tr></table></td></tr></table></body></html>`;

    const type = "text/html";
    const blob = new Blob([finalHtml], { type });
    const data = [new ClipboardItem({ [type]: blob })];
    await navigator.clipboard.write(data);
    alert("Email Copied! Opening Outlook...");
    window.location.href = "mailto:?subject=Update from the Worship & AV Team";
}

function toggleLoader(s, t) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; document.getElementById('load-text').innerText = t; }
</script>
</body>
</html>
