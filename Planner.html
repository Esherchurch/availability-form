        async function loadData() {
            onSnapshot(collection(db, "events"), (snap) => {
                cachedEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderPlanner();
            });

            onSnapshot(collection(db, "members"), (snap) => {
                addressBook = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const select = document.getElementById('memberPdfSelect');
                if (select) {
                    select.innerHTML = '<option value="">Select Member</option>';
                    addressBook.sort((a,b) => a.name.localeCompare(b.name)).forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        opt.textContent = m.name;
                        select.appendChild(opt);
                    });
                }
            });

            onSnapshot(collection(db, "availability"), (snap) => {
                availability = {};
                snap.forEach(doc => {
                    const data = doc.data();
                    if (!availability[data.eventId]) availability[data.eventId] = {};
                    availability[data.eventId][data.memberId] = data.status;
                });
                renderPlanner();
            });
        }

            const d = new Date(dateStr);

            if (m >= 5 && m <= 8) return `Summer ${y}`;
            return `Autumn ${y}`;
        };

        const getLogoBase64 = () => {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg'));
                };
                img.onerror = () => resolve(null);
                img.src = 'https://i.ibb.co/pW3Ym9f/egbc-logo.jpg';

window.autoFillPractice = async (practiceId) => {
            const practice = cachedEvents.find(e => e.id === practiceId);
            if (!practice) return;
            const practiceDate = new Date(practice.date);
            const sundayService = cachedEvents.find(e => {
                const eDate = new Date(e.date);
                const diff = (eDate - practiceDate) / (1000 * 60 * 60 * 24);
                return e.type === "Sunday Morning Worship" && diff > 0 && diff <= 3;
            });
            if (!sundayService) return alert("No matching Sunday Worship found within 3 days.");
            
            const updates = {};
            practice.roles.forEach(role => {
                const sundayPerson = sundayService.assignments?.[role];
                if (sundayPerson && availability[practiceId]?.[sundayPerson.id] === 'avail') {
                    updates[`assignments.${role}`] = { id: sundayPerson.id, name: sundayPerson.name };
                }
            });
            if (Object.keys(updates).length > 0) await updateDoc(doc(db, "events", practiceId), updates);
        };

        window.autoFillAllEvents = async () => {
            if (!confirm("Automatically fill services based on availability and frequency?")) return;
            const activeEvents = cachedEvents.filter(e => !e.archived && e.type === "Sunday Morning Worship")
                                             .sort((a,b) => new Date(a.date) - new Date(b.date));
            const monthlyCounts = {};

            for (const ev of activeEvents) {
                const monthKey = new Date(ev.date).toLocaleString('en-GB', { month: 'long', year: 'numeric' });
                if (!monthlyCounts[monthKey]) monthlyCounts[monthKey] = {};

                const members = addressBook.filter(m => 
                    availability[ev.id]?.[m.id] === 'avail' && 
                    (ev.teams?.some(t => m.markers?.includes(t)) || (ev.teams?.includes("Youth") && m.markers?.includes("Youth Worship")))
                );

                const alreadyAssignedToday = new Set(Object.values(ev.assignments || {}).map(a => a.id));
                const currentRoles = [...(ev.roles || [])];
                const assignments = { ...(ev.assignments || {}) };

                const tryAssign = (roleName, instrumentName, isPrimaryOnly) => {
                    if (assignments[roleName]) return false;
                    let candidates = members.filter(m => {
                        if (alreadyAssignedToday.has(m.id)) return false;
                        if ((monthlyCounts[monthKey][m.id] || 0) >= (parseInt(m.maxFrequency) || 2)) return false;
                        return isPrimaryOnly ? m.primaryInstruments?.includes(instrumentName) : 
                                              (m.primaryInstruments?.includes(instrumentName) || m.secondaryInstruments?.includes(instrumentName));
                    });

                    candidates.sort((a,b) => {
                        const aYouth = a.markers?.includes("Youth Worship") ? 1 : 0;
                        const bYouth = b.markers?.includes("Youth Worship") ? 1 : 0;
                        if (aYouth !== bYouth) return aYouth - bYouth;
                        return (a.primaryInstruments?.length || 0) - (b.primaryInstruments?.length || 0);
                    });

                    if (candidates.length > 0) {
                        const chosen = candidates[0];
                        assignments[roleName] = { id: chosen.id, name: chosen.name };
                        alreadyAssignedToday.add(chosen.id);
                        monthlyCounts[monthKey][chosen.id] = (monthlyCounts[monthKey][chosen.id] || 0) + 1;
                        return true;
                    }
                    return false;
                };

                MANDATORY_SUNDAY_ROLES.forEach(r => tryAssign(r, r, true));
                currentRoles.filter(r => r.startsWith("Singer")).forEach(r => tryAssign(r, "Sing", true));
                MANDATORY_SUNDAY_ROLES.forEach(r => tryAssign(r, r, false));
                
                await updateDoc(doc(db, "events", ev.id), { assignments, roles: currentRoles });
            }
            alert("Auto-fill complete!");
        };

        const getPdfBlob = async (type, memberId, specificEvents = null) => {
            const { jsPDF } = window.jspdf;
            const logo = await getLogoBase64();
            let termEvents = (specificEvents || cachedEvents.filter(e => !e.archived)).sort((a,b) => new Date(a.date) - new Date(b.date));
            if (termEvents.length === 0) return null;

            if (type === "wall") {
                const wallDoc = new jsPDF({ orientation: "landscape", unit: "pt", format: "A4" });
                const member = addressBook.find(m => m.id === memberId);
                const headId = member?.householdId || memberId;
                const hIds = addressBook.filter(m => m.id === headId || m.householdId === headId).map(m => m.id);
                
                const eventsByMonth = {};
                termEvents.forEach(ev => {
                    const d = new Date(ev.date);
                    const key = d.toLocaleString("en-GB", { month: "long", year: "numeric" });
                    if (!eventsByMonth[key]) eventsByMonth[key] = [];
                    eventsByMonth[key].push(ev);
                });

                Object.keys(eventsByMonth).sort((a, b) => new Date(eventsByMonth[a][0].date) - new Date(eventsByMonth[b][0].date)).forEach((month, idx) => {
                    if (idx > 0) wallDoc.addPage();
                    if (logo) wallDoc.addImage(logo, "JPEG", 40, 20, 100, 60);
                    wallDoc.setFont("helvetica", "bold").setFontSize(22).setTextColor(61, 98, 99);
                    wallDoc.text("Family Wall Planner", 150, 50);
                    wallDoc.setFontSize(14).setTextColor(100, 100, 100).text(month, 150, 70);

                    const yr = new Date(eventsByMonth[month][0].date).getFullYear(), mth = new Date(eventsByMonth[month][0].date).getMonth();
                    const startDay = new Date(yr, mth, 1).getDay(), daysInM = new Date(yr, mth + 1, 0).getDate();
                    const offset = startDay === 0 ? 6 : startDay - 1;
                    const rows = []; let week = Array(7).fill(null);
                    for (let i = 0; i < offset; i++) week[i] = { empty: true };
                    for (let d = 1; d <= daysInM; d++) {
                        const dateStr = `${yr}-${String(mth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        const dayIdx = (d + offset - 1) % 7;
                        week[dayIdx] = { day: d, events: eventsByMonth[month].filter(e => e.date === dateStr) };
                        if (dayIdx === 6 || d === daysInM) { rows.push(week); week = Array(7).fill(null); }
                    }

                    wallDoc.autoTable({
                        startY: 90, head: [["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]],
                        body: rows.map(w => w.map(c => {
                            if (!c || c.empty) return "";
                            let cellData = `DAY:${c.day}`;
                            c.events.forEach(ev => {
                                const matches = Object.entries(ev.assignments || {}).filter(([r, p]) => hIds.includes(p.id))
                                                      .map(([r, p]) => `${p.name.split(' ')[0]}: ${r}`);
                                if (matches.length > 0) cellData += `|S:${ev.type}|R:${matches.join(', ')}`;
                            });
                            return cellData;
                        })),
                        theme: 'grid', styles: { fontSize: 0.1, cellPadding: 4, minCellHeight: 65, valign: 'top', textColor: [255, 255, 255] },
                        headStyles: { fillColor: [61, 98, 99], textColor: 255, halign: 'center', fontSize: 10 },
                        didDrawCell: (data) => {
                            if (data.section === 'body' && data.cell.raw !== "") {
                                const segs = data.cell.raw.split('|'); let yPos = data.cell.y + 12;
                                segs.forEach(seg => {
                                    if (seg.startsWith("DAY:")) { 
                                        wallDoc.setFont("helvetica", "bold").setFontSize(10).setTextColor(180, 180, 180).text(seg.replace("DAY:", ""), data.cell.x + 5, yPos); 
                                        yPos += 12; 
                                    } else if (seg.startsWith("S:")) { 
                                        wallDoc.setFont("helvetica", "bold").setFontSize(7).setTextColor(61, 98, 99).text(wallDoc.splitTextToSize(seg.replace("S:", ""), 100), data.cell.x + 5, yPos); 
                                        yPos += 18; 
                                    } else if (seg.startsWith("R:")) { 
                                        wallDoc.setFont("helvetica", "normal").setFontSize(7).setTextColor(0, 0, 0).text(wallDoc.splitTextToSize(seg.replace("R:", ""), 100), data.cell.x + 5, yPos);
                                    }
                                });
                            }
                        }
                    });
                });
                return wallDoc;
            }

            const docRef = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4', compress: true });
            let reportTitle = "FULL ROTA";
            if (type === 'individual' || type === 'household') {
                const member = addressBook.find(m => m.id === memberId);
                const headId = member?.householdId || memberId;
                const hIds = addressBook.filter(m => m.id === headId || m.householdId === headId).map(m => m.id);
                reportTitle = type === 'individual' ? `${member.name.toUpperCase()} ROTA` : `HOUSEHOLD ROTA`;
                termEvents = termEvents.filter(e => Object.values(e.assignments || {}).some(a => type === 'individual' ? a.id === memberId : hIds.includes(a.id)));
            }

            if (logo) docRef.addImage(logo, 'JPEG', 255, 10, 30, 20);
            docRef.setFillColor(240, 246, 246).roundedRect(12, 12, 230, 10, 4, 4, 'F');
            docRef.setTextColor(61, 98, 99).setFont("helvetica", "bold").setFontSize(18).text(reportTitle, 16, 19);
            const allRolesRaw = [...new Set(termEvents.flatMap(e => e.roles || []))];
            const allRoles = [...allRolesRaw.filter(r => !AV_ROLES.includes(r)), ...allRolesRaw.filter(r => AV_ROLES.includes(r))];
            
            docRef.autoTable({
                startY: 35,
                head: [['DATE', 'TIME', 'SERVICE', ...allRoles.map(r => r.toUpperCase())]],
                body: termEvents.map(e => [
                    new Date(e.date).toLocaleDateString('en-GB'),
                    `${e.startTime || '08:00'}-${e.endTime || '11:30'}`,
                    e.type,
                    ...allRoles.map(r => e.assignments?.[r]?.name || "---")
                ]),
                headStyles: { fillColor: [61, 98, 99] },
                styles: { fontSize: 7 }
            });
            return docRef;
        };

        window.generatePDF = async (type, memberId) => {
            const doc = await getPdfBlob(type, memberId);
            if (!doc) return alert("No relevant data found for this selection.");
            doc.save(`${type}_rota.pdf`);
        };

        window.exportToExcel = () => {
            const activeEvents = cachedEvents.filter(e => !e.archived).sort((a,b) => new Date(a.date) - new Date(b.date));
            const wb = XLSX.utils.book_new();
            const data = activeEvents.map(e => ({
                Date: e.date,
                Time: `${e.startTime || '08:00'}-${e.endTime || '11:30'}`,
                Type: e.type,
                ...Object.fromEntries(Object.entries(e.assignments || {}).map(([r, p]) => [r, p.name]))
            }));
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Rota");
            XLSX.writeFile(wb, "EGBC_Rota.xlsx");
        };

        window.prepareDistributionPackage = async () => {
            const zip = new JSZip();
            const activeEvents = cachedEvents.filter(e => !e.archived);
            const csvRows = ["Name,Email"];
            const fullDoc = await getPdfBlob('full', null, activeEvents);
            const assignedIds = new Set();
            activeEvents.forEach(e => Object.values(e.assignments || {}).forEach(a => assignedIds.add(a.id)));
            
            for (const mId of assignedIds) {
                const member = addressBook.find(m => m.id === mId);
                if (!member) continue;
                const folderName = member.name.replace(/\s+/g, '_');
                csvRows.push(`"${member.name}","${member.email}"`);

                const indDoc = await getPdfBlob('individual', mId, activeEvents);
                if (indDoc) zip.file(`${folderName}/${member.name.replace(/\s+/g, '_')}_Rota.pdf`, indDoc.output('blob'));
                
                const hDoc = await getPdfBlob('household', mId, activeEvents);
                if (hDoc) zip.file(`${folderName}/${member.name.replace(/\s+/g, '_')}_Household_Rota.pdf`, hDoc.output('blob'));
                
                const wDoc = await getPdfBlob('wall', mId, activeEvents);
                if (wDoc) zip.file(`${folderName}/${member.name.replace(/\s+/g, '_')}_Wall_Planner.pdf`, wDoc.output('blob'));

                if (fullDoc) zip.file(`${folderName}/00_FULL_CHURCH_ROTA.pdf`, fullDoc.output('blob'));
            }

            zip.file("Distribution_List.csv", csvRows.join("\n"));
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, `EGBC_Rota_Package_${new Date().toISOString().split('T')[0]}.zip`);
        };
window.gatherTermAvailability = async () => {
            const terms = [...new Set(cachedEvents.filter(e => !e.archived).map(e => e.termLabel || getTermLabel(e.date)))];
            const selectedTerm = prompt(`Gather availability for which term?\n\nOptions:\n${terms.join('\n')}`, terms[0]);
            if (!selectedTerm) return;
            const emails = new Set();
            cachedEvents.filter(e => !e.archived && (e.termLabel === selectedTerm || getTermLabel(e.date) === selectedTerm)).forEach(ev => {
                addressBook.forEach(m => { 
                    if (m.markers?.some(r => ev.teams?.includes(r)) || (ev.teams?.includes("Youth") && m.markers?.includes("Youth Worship"))) {
                        emails.add(m.email); 
                    }
                });
            });
            window.location.href = `mailto:av@esherchurch.org?bcc=${[...emails].join(';')}&subject=Availability Request&body=Please click here: ${FORM_LINK}`;
        };

        function renderPlanner() {
            const container = document.getElementById('eventList');
            if (!container) return;
            container.innerHTML = '';
            
            // If data is actually empty, show this
            if (!cachedEvents || cachedEvents.length === 0) {
                container.innerHTML = '<div class="text-center p-20 opacity-40 font-black uppercase tracking-widest">No Events Found in Database.</div>';
                return;
            }

            const grouped = {};
            cachedEvents.forEach(ev => {
                if (ev.archived) return; 
                // FALLBACK: If termLabel is missing in DB, calculate it now
                const termKey = ev.termLabel || getTermLabel(ev.date);
                if (!grouped[termKey]) grouped[termKey] = [];
                grouped[termKey].push(ev);
            });

            const sortedTerms = Object.keys(grouped).sort((a, b) => {
                const yearA = a.split(' ')[1];
                const yearB = b.split(' ')[1];
                return yearA !== yearB ? yearA - yearB : a.localeCompare(b);
            });

            sortedTerms.forEach(term => {
                const isCollapsed = collapsedTerms.has(term);
                let html = `<div class="mb-12"><div class="flex justify-between items-center bg-[#3d6263] text-white px-8 py-5 rounded-t-[2rem] shadow-lg">
                    <button onclick="toggleTermCollapse('${term}')" class="uppercase font-bold tracking-widest font-montserrat flex items-center gap-2">
                        ${isCollapsed ? '▶' : '▼'} ${term}
                    </button>
                    <button onclick="archiveTerm('${term}')" class="text-[10px] bg-white/20 px-4 py-1 rounded-full uppercase font-bold hover:bg-white/40 transition-all">Archive Term</button>
                    </div><div class="${isCollapsed ? 'hidden' : 'block'} bg-white p-6 border-x border-b border-gray-200 rounded-b-[2rem] shadow-inner">`;
                
                const termEventsSorted = grouped[term].sort((a,b) => new Date(a.date) - new Date(b.date));
                const byMonth = {};
                termEventsSorted.forEach(ev => {
                    const month = new Date(ev.date).toLocaleString('en-GB', { month: 'long', year: 'numeric' });
                    if (!byMonth[month]) byMonth[month] = [];
                    byMonth[month].push(ev);
                });

                Object.keys(byMonth).forEach(month => {
                    html += `<div class="mb-10 pb-8"><h3 class="text-sm font-black uppercase text-[#3d6263] opacity-60 mb-6 tracking-[0.2em] border-l-4 border-[#3d6263] pl-4">${month}</h3>`;
                    
                    const blocks = []; let current = [];
                    byMonth[month].forEach(ev => {
                        current.push(ev);
                        if (ev.type === "Sunday Morning Worship") { blocks.push(current); current = []; }
                    });
                    if (current.length > 0) blocks.push(current);
                    
                    blocks.forEach((block, idx) => {
                        block.forEach(ev => {
                            html += generateEventHtml(ev, idx);
                        });
                    });
                    
                    // Stats calculation
                    const stats = {};
                    byMonth[month].forEach(ev => {
                        if (ev.type === 'Sunday Morning Worship' && ev.assignments) {
                            new Set(Object.values(ev.assignments).map(p => p.name)).forEach(n => { 
                                if (n) stats[n] = (stats[n] || 0) + 1; 
                            });
                        }
                    });
                    if (Object.keys(stats).length > 0) {
                        html += `<div class="mt-8 bg-[#f0f6f6] rounded-[2rem] p-8 border border-[#d1dfdf] shadow-sm">
                            <div class="text-xs font-black uppercase text-[#3d6263] mb-6 tracking-widest text-center border-b border-[#d1dfdf] pb-4">Monthly Unique Serving Totals</div>
                            <div class="flex flex-wrap justify-center gap-4">` + 
                            Object.entries(stats).sort((a,b) => a[0].localeCompare(b[0])).map(([n, c]) => 
                                `<div class="text-[12px] font-bold text-[#3d6263] bg-white px-5 py-2.5 rounded-full border border-[#d1dfdf] shadow-sm flex items-center gap-2"><span>${n}:</span><span class="font-black text-sm">${c}</span></div>`
                            ).join('') + `</div></div>`;
                    }
                    html += '</div>';
                });
                container.innerHTML += html + '</div></div>';
            });
        }

        function generateEventHtml(ev, blockIdx) {
            const assignedIds = Object.values(ev.assignments || {}).map(a => a.id);
            const members = addressBook.filter(m => (ev.teams?.some(t => m.markers?.includes(t)) || (ev.teams?.includes("Youth") && m.markers?.includes("Youth Worship"))));
            const respondersAvail = members.filter(m => availability[ev.id]?.[m.id] === 'avail' && (!hideAssigned || !assignedIds.includes(m.id)));
            const declined = members.filter(m => (availability[ev.id]?.[m.id] === 'unavailable' || availability[ev.id]?.[m.id] === 'not-avail') && (!hideAssigned || !assignedIds.includes(m.id)));
            const pending = members.filter(m => !availability[ev.id]?.[m.id] && (!hideAssigned || !assignedIds.includes(m.id)));
            
            const isSunday = ev.type === "Sunday Morning Worship";
            const rowClass = !isSunday ? 'bg-slate-50 border-dashed border-[#d1dfdf]' : (blockIdx % 2 === 0 ? 'bg-white border-[#d1dfdf]' : 'bg-[#f0f6f6]/30 border-[#d1dfdf]');
            const dateBg = !isSunday ? 'bg-[#d1dfdf]' : 'bg-[#3d6263]';
            const sortedRoles = [...(ev.roles || []).filter(r => !AV_ROLES.includes(r)), ...(ev.roles || []).filter(r => AV_ROLES.includes(r))];
            const iconStyles = 'width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"';

            let evHtml = `<div class="${rowClass} border rounded-[1.5rem] p-4 mb-3 shadow-sm relative transition-all">
                <div class="flex flex-wrap items-center gap-4">
                <button onclick="toggleEventExpand('${ev.id}')" class="w-8 h-8 flex items-center justify-center rounded-full bg-white text-[#3d6263] shadow-sm border border-[#d1dfdf]">
                ${expandedEvents.has(ev.id) || isSunday ? `<svg ${iconStyles} viewBox="0 0 24 24"><path d="M19.5 12h-15" /></svg>` : `<svg ${iconStyles} viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15" /></svg>`}
                </button>
                <input type="date" value="${ev.date}" onchange="updateField('${ev.id}', 'date', this.value)" class="${dateBg} ${!isSunday ? 'text-[#3d6263]' : 'text-white'} px-4 py-2 rounded-full font-bold text-[11px] shadow-sm">
                <input type="time" value="${ev.startTime || '08:00'}" onchange="updateField('${ev.id}', 'startTime', this.value)" class="bg-white px-3 py-2 rounded-full font-bold text-[11px] border border-[#d1dfdf] text-[#3d6263]">
                <span class="text-[#3d6263] opacity-40 font-black text-[10px]">TO</span>
                <input type="time" value="${ev.endTime || '11:30'}" onchange="updateField('${ev.id}', 'endTime', this.value)" class="bg-white px-3 py-2 rounded-full font-bold text-[11px] border border-[#d1dfdf] text-[#3d6263]">
                <select onchange="updateField('${ev.id}', 'type', this.value)" class="bg-white px-4 py-2 rounded-full font-bold text-[#3d6263] text-[11px] border border-[#d1dfdf] outline-none">
                ${EVENT_TYPES.map(t => `<option value="${t}" ${ev.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
                <textarea rows="1" onblur="updateField('${ev.id}', 'description', this.value)" placeholder="Notes..." class="flex-grow bg-white px-5 py-2 rounded-xl text-[12px] font-bold border border-[#d1dfdf] outline-none text-[#3d6263]">${ev.description || ''}</textarea>
                <div class="flex gap-3 bg-white px-4 py-2 rounded-full border border-[#d1dfdf] shadow-sm">
                ${["Core Team", "Worship Team", "AV Team", "Choir", "Youth"].map(t => `<label class="text-[9px] font-black uppercase flex items-center gap-1.5 cursor-pointer text-[#3d6263]"><input type="checkbox" onchange="toggleTeam('${ev.id}', '${t}')" ${ev.teams?.includes(t) ? 'checked' : ''} class="w-3.5 h-3.5 accent-[#3d6263]"><span>${t}</span></label>`).join('')}
                </div>`;
            
            if (!isSunday) evHtml += `<button onclick="autoFillPractice('${ev.id}')" class="bg-[#d1dfdf] text-[#3d6263] px-5 py-2 rounded-full font-black text-[10px] uppercase shadow-sm flex items-center gap-1 hover:bg-[#3d6263] hover:text-white transition-all"><svg ${iconStyles} viewBox="0 0 24 24" class="w-3 h-3"><path d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>Sync</button>`;
            
            evHtml += `<div class="flex items-center gap-4">
                <button onclick="toggleBucket('${ev.id}')" class="w-11 h-11 rounded-full bg-white text-[#3d6263] flex items-center justify-center border border-[#d1dfdf] shadow-sm hover:scale-110 transition-all"><svg ${iconStyles} viewBox="0 0 24 24"><path d="M20.25 14.15v4.25c0 .414-.336.75-.75.75H4.5a.75.75 0 0 1-.75-.75v-4.25m16.5 0a3 3 0 0 0-3-3H7.012a3 3 0 0 0-3 3m16.5 0-2.25-6.108a4.835 4.835 0 0 0-3.6-3.392 48.359 48.359 0 0 0-5.325 0 4.835 4.835 0 0 0-3.6 3.392L3.75 14.15m6.5 2.15a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm6 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" /></svg></button>
                <button onclick="deleteEvent('${ev.id}')" class="text-red-300 hover:text-red-600 transition-colors"><svg ${iconStyles} viewBox="0 0 24 24" class="w-6 h-6"><path d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg></button>
                </div></div>
                <div class="${expandedEvents.has(ev.id) || isSunday ? 'flex' : 'hidden'} mt-6 border-t border-[#f0f6f6] pt-6 flex-row gap-6 overflow-visible">
                <div class="flex flex-wrap gap-4 flex-grow">`;
            
            sortedRoles.forEach(r => {
                const assigned = ev.assignments?.[r] || null;
                const isAV = AV_ROLES.includes(r);
                const isPending = assigned && !availability[ev.id]?.[assigned.id];
                const borderColor = isAV ? 'border-amber-400' : (assigned ? 'border-[#3d6263]' : 'border-[#d1dfdf]');
                const nameColor = isPending ? 'text-orange-500' : 'text-[#3d6263]';
                evHtml += `<div ondragover="event.preventDefault()" ondrop="onDropRole(event, '${ev.id}', '${r}')" class="bg-white border-2 ${assigned ? 'border-solid' : 'border-dashed'} ${borderColor} p-4 rounded-2xl min-w-[170px] group/role relative">
                    <div class="text-[10px] font-black uppercase text-[#3d6263] opacity-40 mb-2 flex justify-between"><span>${r}</span><button onclick="removeRole('${ev.id}', '${r}')" class="invisible group-hover/role:visible text-red-400">×</button></div>
                    <div draggable="true" ondragstart="onDragStart(event, '${assigned?.id || ''}', '${assigned?.name.replace(/'/g, "\\'") || ''}', '${ev.id}', '${r}')" class="text-[13px] font-bold ${assigned ? nameColor + ' cursor-grab' : 'text-[#d1dfdf] italic'}">${assigned ? assigned.name : 'Unassigned'}</div>
                    </div>`;
            });
            evHtml += `<select onchange="addRole('${ev.id}', this.value); this.value='';" class="bg-white border-2 border-dashed border-[#d1dfdf] text-[#3d6263] text-[11px] font-bold px-6 py-3 rounded-2xl uppercase hover:bg-[#f0f6f6] self-center"><option value="">+ Role</option>
                ${OPTIONAL_ROLES.map(opt => `<option value="${opt}">${opt}</option>`).join('')}</select></div>`;
            
            if (openBuckets.has(ev.id)) {
                evHtml += `<div ondragover="event.preventDefault()" ondrop="onDropBucket(event, '${ev.id}')" class="bg-[#f0f6f6] p-7 rounded-[2.5rem] border border-[#d1dfdf] shadow-inner min-w-[340px]">
                    <div class="max-h-[400px] overflow-y-auto space-y-6">
                    <div ondragover="event.preventDefault()" ondrop="onDropBucket(event, '${ev.id}', 'avail'); event.stopPropagation();">
                    <div class="text-[10px] font-black text-green-600 uppercase mb-3">Available</div>
                    <div class="flex flex-wrap gap-2 min-h-[30px]">` + 
                    respondersAvail.map(m => `<div draggable="true" ondragstart="onDragStart(event, '${m.id}', '${m.name.replace(/'/g, "\\'")}')" class="px-3 py-2 bg-green-50 text-green-700 rounded-xl text-[12px] font-bold border border-green-200 cursor-grab">${m.name}</div>`).join('') +
                    `</div></div><div ondragover="event.preventDefault()" ondrop="onDropBucket(event, '${ev.id}', 'not-avail'); event.stopPropagation();">
                    <div class="text-[10px] font-black text-red-600 uppercase mb-3">Declined</div>
                    <div class="flex flex-wrap gap-2 min-h-[30px]">` +
                    declined.map(m => `<div draggable="true" ondragstart="onDragStart(event, '${m.id}', '${m.name.replace(/'/g, "\\'")}')" class="px-3 py-1.5 bg-red-50 text-red-700 rounded-xl text-[11px] font-bold border border-red-200 cursor-grab">${m.name}</div>`).join('') +
                    `</div></div><div ondragover="event.preventDefault()" ondrop="onDropBucket(event, '${ev.id}', 'pending'); event.stopPropagation();">
                    <div class="text-[10px] font-black text-gray-400 uppercase mb-3">Pending</div>
                    <div class="flex flex-wrap gap-2 min-h-[30px]">` +
                    pending.map(m => `<div draggable="true" ondragstart="onDragStart(event, '${m.id}', '${m.name.replace(/'/g, "\\'")}')" class="px-3 py-1.5 bg-gray-50 text-gray-500 rounded-xl text-[11px] font-bold border border-gray-200 cursor-grab">${m.name}</div>`).join('') +
                    `</div></div></div></div>`;
            }
            evHtml += '</div></div>';
            return evHtml;
        }
    </script>
    <style>
        .max-h-\[400px\]::-webkit-scrollbar { width: 6px; }
        .max-h-\[400px\]::-webkit-scrollbar-thumb { background: #d1dfdf; border-radius: 10px; }

</head>
<body class="p-8 lg:p-12">
    <div class="max-w-[1900px] mx-auto">
        <header class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-12 gap-10 border-b border-[#d1dfdf] pb-12">
            <div class="flex flex-wrap gap-5 bg-white p-5 rounded-[3rem] shadow-xl border border-[#d1dfdf] items-center">
                <select id="termSelect" class="bg-[#f0f6f6] rounded-full px-8 py-3 text-sm font-bold border border-[#d1dfdf] text-[#3d6263] outline-none">
                    <option value="">Select Term</option><option value="Spring">Spring</option><option value="Summer">Summer</option><option value="Autumn">Autumn</option>
                </select>
                <button onclick="generateTerm()" class="bg-[#f0f6f6] text-[#3d6263] px-8 py-3 rounded-full font-black text-[11px] uppercase border border-[#d1dfdf] hover:bg-[#3d6263] hover:text-white transition-all">Populate Term</button>
                <button onclick="autoFillAllEvents()" class="bg-[#3d6263] text-white px-8 py-3 rounded-full font-black text-[11px] uppercase shadow-lg">Auto-Fill All</button>
                <button onclick="addThursdayPractices()" class="bg-[#3d6263] text-white px-8 py-3 rounded-full font-black text-[11px] uppercase shadow-lg">Add Practices</button>
                <button onclick="addSingleLine()" class="bg-[#3d6263] text-white px-10 py-3 rounded-full font-black text-[11px] uppercase shadow-lg">+ Add Service</button>
                <button onclick="gatherTermAvailability()" class="bg-white text-[#3d6263] border border-[#d1dfdf] px-8 py-3 rounded-full font-black text-[11px] uppercase shadow-sm">Gather Avail</button>
                <button onclick="toggleHideAssigned()" class="bg-white text-[#3d6263] border border-[#d1dfdf] px-8 py-3 rounded-full font-black text-[11px] uppercase shadow-sm">Hide Assigned</button>
                <button onclick="prepareDistributionPackage()" class="bg-[#3d6263] text-white px-8 py-3 rounded-full font-black text-[11px] uppercase shadow-lg hover:bg-black transition-all">🚀 SEND ALL ROTAS</button>
            </div>
            <div class="flex flex-wrap gap-5 bg-white p-5 rounded-[3rem] shadow-xl border border-[#d1dfdf] items-center">
                <button onclick="generatePDF('full')" class="bg-[#f0f6f6] text-[#3d6263] px-6 py-3 rounded-full font-black text-[10px] uppercase border border-[#d1dfdf]">Full PDF</button>
                <button onclick="exportToExcel()" class="bg-[#f0f6f6] text-[#3d6263] px-6 py-3 rounded-full font-black text-[10px] uppercase border border-[#d1dfdf]">Excel</button>
                <select id="memberPdfSelect" class="bg-[#f0f6f6] rounded-full px-6 py-3 text-[11px] font-black uppercase outline-none min-w-[180px] text-[#3d6263] border border-[#d1dfdf]"></select>
                <button onclick="generatePDF('individual', document.getElementById('memberPdfSelect').value)" class="bg-[#3d6263] text-white px-6 py-3 rounded-full font-black text-[10px] uppercase shadow-md">Individual</button>
                <button onclick="generatePDF('household', document.getElementById('memberPdfSelect').value)" class="bg-[#3d6263] text-white px-6 py-3 rounded-full font-black text-[10px] uppercase shadow-md">Household</button>
                <button onclick="generatePDF('wall', document.getElementById('memberPdfSelect').value)" class="bg-[#3d6263] text-white px-6 py-3 rounded-full font-black text-[10px] uppercase shadow-md">Wall Planner</button>
            </div>
        </header>
        <div id="eventList"></div>
    </div>
</body>
