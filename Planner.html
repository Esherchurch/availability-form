<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGBC Master Rota Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc, updateDoc, arrayUnion, arrayRemove, deleteField } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
            authDomain: "egbc-worship-planner.firebaseapp.com",
            projectId: "egbc-worship-planner",
            storageBucket: "egbc-worship-planner.firebasestorage.app",
            messagingSenderId: "199442060489",
            appId: "1:199442060489:web:7eaf85a76334c753db6918"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const OPTIONAL_ROLES = ['Sound', 'Words', 'Cameras', 'Violin', 'Congas', '2nd Guitar', '2nd Keys', 'Electric Guitar', 'Oboe', 'Trumpet', 'Cahon', 'Other', 'Choir'];
        const MANDATORY_SUNDAY_ROLES = ["Worship Leader", "Keyboard", "Guitar", "Drums", "Bass", "Sound", "Words", "Cameras"];
        const EVENT_TYPES = ['Sunday Morning Worship', 'Evening Carol Service', 'Midnight Service', 'Worship and AV Team Meeting', 'All Team Practice', 'Core Team Meeting', 'Worship Team Meeting', 'AV Team Meeting', 'Song Writing Workshop', 'LOUD Worship'];
        
        let collapsedTerms = new Set();
        let cachedEvents = [];
        let addressBook = [];
        let availability = {};
        let logoBase64 = null;
        let hideAssigned = false;

        const FORM_LINK = "https://esherchurch.github.io/availability-form/";

        const getLogoBase64 = () => {
            return new Promise(async (resolve) => {
                if (logoBase64) return resolve(logoBase64);
                try {
                    const url = await getDownloadURL(ref(storage, '1774936285076.png'));
                    const img = new Image();
                    img.setAttribute('crossOrigin', 'anonymous');
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = img.width; canvas.height = img.height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0);
                        logoBase64 = canvas.toDataURL("image/png");
                        resolve(logoBase64);
                    };
                    img.onerror = () => resolve(null);
                    img.src = url + "?c=" + new Date().getTime();
                } catch (e) { resolve(null); }
            });
        };
        getLogoBase64();

        function getTermLabel(dateString) {
            const d = new Date(dateString);
            const month = d.getMonth() + 1; 
            const year = d.getFullYear();
            let term = (month <= 4) ? "Spring" : (month <= 8) ? "Summer" : "Autumn";
            return `${term} ${year}`;
        }

        onSnapshot(collection(db, "addressBook"), (snap) => {
            addressBook = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const select = document.getElementById('memberPdfSelect');
            if (select) {
                const currentVal = select.value;
                select.innerHTML = '<option value="">Select Member...</option>';
                addressBook.sort((a,b) => a.name.localeCompare(b.name)).forEach(m => {
                    select.innerHTML += `<option value="${m.id}">${m.name}</option>`;
                });
                select.value = currentVal;
            }
            renderPlanner();
        });

        onSnapshot(collection(db, "availability"), (snap) => {
            availability = {};
            snap.forEach(d => {
                const data = d.data();
                if (!availability[data.eventId]) availability[data.eventId] = {};
                availability[data.eventId][data.memberId] = data.status;
            });
            renderPlanner();
        });

        onSnapshot(query(collection(db, "events"), orderBy("date")), (snap) => {
            cachedEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderPlanner();
        });

        window.toggleHideAssigned = () => { hideAssigned = !hideAssigned; renderPlanner(); };
        window.toggleTermCollapse = (termId) => { collapsedTerms.has(termId) ? collapsedTerms.delete(termId) : collapsedTerms.add(termId); renderPlanner(); };

        window.updateField = async (id, field, value) => { 
            const updates = { [field]: value };
            if (field === 'date') updates.termLabel = getTermLabel(value);
            await updateDoc(doc(db, "events", id), updates); 
        };

        window.toggleTeam = async (eventId, teamName, currentTeams = []) => {
            const newTeams = currentTeams.includes(teamName) ? currentTeams.filter(t => t !== teamName) : [...currentTeams, teamName];
            await updateDoc(doc(db, "events", eventId), { teams: newTeams });
        };

        window.addRole = async (eventId, roleName) => { 
            if(!roleName) return; 
            await updateDoc(doc(db, "events", eventId), { roles: arrayUnion(roleName) }); 
        };
        
        window.removeRole = async (eventId, roleName) => {
            if(confirm(`Remove role "${roleName}"?`)) {
                const updates = { roles: arrayRemove(roleName) };
                updates[`assignments.${roleName}`] = deleteField();
                await updateDoc(doc(db, "events", eventId), updates);
            }
        };

        window.assignPerson = async (eventId, role, personId, personName) => {
            const updates = {};
            updates[`assignments.${role}`] = { id: personId, name: personName };
            await updateDoc(doc(db, "events", eventId), updates);
        };

        window.unassignPerson = async (eventId, role) => {
            const updates = {};
            updates[`assignments.${role}`] = deleteField();
            await updateDoc(doc(db, "events", eventId), updates);
        };

        window.deleteEvent = async (eventId) => {
            if(confirm("Permanently delete this service?")) await deleteDoc(doc(db, "events", eventId));
        };

        window.archiveTerm = async (termLabel) => {
            if(confirm(`Archive all services in ${termLabel}?`)) {
                const toArchive = cachedEvents.filter(e => e.termLabel === termLabel);
                for (const ev of toArchive) {
                    await updateDoc(doc(db, "events", ev.id), { archived: true });
                }
            }
        };

        window.onDragStart = (e, personId, personName, eventId = null, role = null) => {
            e.dataTransfer.setData("personId", personId);
            e.dataTransfer.setData("personName", personName);
            if(eventId && role) {
                e.dataTransfer.setData("sourceEventId", eventId);
                e.dataTransfer.setData("sourceRole", role);
            }
        };

        window.onDropRole = async (e, eventId, role) => {
            e.preventDefault();
            const personId = e.dataTransfer.getData("personId");
            const personName = e.dataTransfer.getData("personName");
            const sourceEventId = e.dataTransfer.getData("sourceEventId");
            const sourceRole = e.dataTransfer.getData("sourceRole");
            if(sourceEventId === eventId && sourceRole) { await unassignPerson(sourceEventId, sourceRole); }
            await assignPerson(eventId, role, personId, personName);
        };

        window.onDropBucket = async (e) => {
            e.preventDefault();
            const sourceEventId = e.dataTransfer.getData("sourceEventId");
            const sourceRole = e.dataTransfer.getData("sourceRole");
            if(sourceEventId && sourceRole) { await unassignPerson(sourceEventId, sourceRole); }
        };

        window.addSingleLine = async () => {
            const dateStr = new Date().toISOString().split('T')[0];
            await addDoc(collection(db, "events"), {
                date: dateStr, termLabel: getTermLabel(dateStr), type: "Sunday Morning Worship", description: "",
                teams: ["Worship Team", "AV Team"], startTime: "08:00", endTime: "11:30", roles: MANDATORY_SUNDAY_ROLES, archived: false
            });
        };

        window.generateTerm = async () => {
            const term = document.getElementById('termSelect').value;
            const year = new Date().getFullYear();
            if(!term) return alert("Select a Term");
            let curr = new Date(`${year}-${term === 'Spring' ? '01' : term === 'Summer' ? '05' : '09'}-01`);
            let end = new Date(`${year}-${term === 'Spring' ? '04' : term === 'Summer' ? '08' : '12'}-31`);
            while (curr.getDay() !== 0) curr.setDate(curr.getDate() + 1);
            while (curr <= end) {
                const dateStr = curr.toISOString().split('T')[0];
                await addDoc(collection(db, "events"), {
                    date: dateStr, termLabel: getTermLabel(dateStr), type: "Sunday Morning Worship", description: "",
                    teams: ["Worship Team", "AV Team"], startTime: "08:00", endTime: "11:30", roles: MANDATORY_SUNDAY_ROLES, archived: false
                });
                curr.setDate(curr.getDate() + 7);
            }
        };

        const getPdfBlob = async (type, memberId, specificEvents = null) => {
            const { jsPDF } = window.jspdf;
            const docRef = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' }); 
            const activeLogo = await getLogoBase64();
            const today = new Date().toISOString().split('T')[0];
            let termEvents = (specificEvents || cachedEvents).filter(e => !e.archived && e.date >= today);
            
            if(termEvents.length === 0) return null;
            let termTitle = termEvents[0].termLabel;
            let reportTitle = "";
            
            if (type === 'individual') {
                if (!memberId) return null;
                const member = addressBook.find(m => m.id === memberId);
                reportTitle = `${member.name.toUpperCase()} - ${termTitle}`;
                
                // FIXED INDIVIDUAL FILTER: Checks if assigned OR if person is in Choir and Choir role exists
                termEvents = termEvents.filter(e => {
                    const isAssigned = Object.values(e.assignments || {}).some(a => a.id === memberId);
                    const isInChoir = member.markers?.includes('Choir') && e.roles?.includes('Choir');
                    return isAssigned || isInChoir;
                });
            } else if (type === 'household') {
                if (!memberId) return null;
                const member = addressBook.find(m => m.id === memberId);
                const hIds = [memberId, ...(member.relatedTo || [])];
                reportTitle = `HOUSEHOLD ROTA: ${member.name.toUpperCase()} - ${termTitle}`;
                
                termEvents = termEvents.filter(e => {
                    const isAssigned = Object.values(e.assignments || {}).some(a => hIds.includes(a.id));
                    const houseMembers = addressBook.filter(m => hIds.includes(m.id));
                    const choirRequirement = houseMembers.some(m => m.markers?.includes('Choir')) && e.roles?.includes('Choir');
                    return isAssigned || choirRequirement;
                });
            } else { reportTitle = `FULL ROTA: ${termTitle}`; }
            
            if (termEvents.length === 0) return null;

            if (activeLogo) {
                try { 
                    const props = docRef.getImageProperties(activeLogo);
                    const fixedWidth = 25; 
                    const scaledHeight = (props.height * fixedWidth) / props.width;
                    docRef.addImage(activeLogo, 'PNG', 260, 10, fixedWidth, scaledHeight); 
                } catch(e) {}
            }
            docRef.setFillColor(245, 248, 255); docRef.roundedRect(12, 12, 230, 10, 4, 4, 'F');
            docRef.setTextColor(44, 105, 153); docRef.setFont("helvetica", "bold"); docRef.setFontSize(18);
            docRef.text(reportTitle, 16, 19);
            const allRoles = [...new Set(termEvents.flatMap(e => e.roles || []))];
            const headers = [['DATE', 'SERVICE', ...allRoles.map(r => r.toUpperCase()), 'DESCRIPTION']];
            const tableBody = termEvents.map(e => {
                const dateObj = new Date(e.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
                const row = [dateObj, e.type]; 
                allRoles.forEach(role => {
                    let val = e.assignments?.[role]?.name || "---";
                    // If it's a choir member looking at a choir role, show "Choir"
                    if (role === 'Choir' && val === "---" && e.roles?.includes('Choir')) { val = "Choir Member"; }
                    row.push(val);
                });
                row.push(e.description || "");
                return row;
            });
            docRef.autoTable({
                startY: 35, head: headers, body: tableBody, theme: 'plain',
                headStyles: { fillColor: null, textColor: [255, 255, 255], fontSize: 7, halign: 'center', cellPadding: 4 },
                styles: { fontSize: 7.5, cellPadding: 5, halign: 'center' },
                columnStyles: { 0: { halign: 'left', fontStyle: 'bold' }, 1: { halign: 'left' } },
                margin: { horizontal: 10 },
                willDrawCell: function(data) {
                    if (data.section === 'head' && data.row.index === 0 && data.column.index === 0) {
                        docRef.setFillColor(44, 105, 153); docRef.roundedRect(data.settings.margin.left, data.cell.y, 277, data.cell.height + 2, 4, 4, 'F');
                        docRef.rect(data.settings.margin.left, data.cell.y + 2, 277, data.cell.height, 'F');
                    }
                },
                didDrawCell: function(data) { if (data.section === 'body') { docRef.setDrawColor(230, 235, 245); docRef.setLineWidth(0.1); docRef.line(data.cell.x, data.cell.y + data.cell.height, data.cell.x + data.cell.width, data.cell.y + data.cell.height); } },
                didDrawPage: function(data) { docRef.setDrawColor(44, 105, 153); docRef.setLineWidth(0.3); docRef.roundedRect(10, 35, 277, data.cursor.y - 35, 4, 4, 'D'); }
            });
            return docRef;
        };

        window.generatePDF = async (type, memberId) => {
            const doc = await getPdfBlob(type, memberId);
            if (!doc) return alert("No assigned dates found.");
            doc.save(`${type}_rota.pdf`);
        };

        window.prepareDistributionPackage = async () => {
            const zip = new JSZip();
            const activeEvents = cachedEvents.filter(e => !e.archived);
            if (activeEvents.length === 0) return alert("No active events found.");
            
            const fullDoc = await getPdfBlob('full', null, activeEvents);
            if (fullDoc) zip.file("00_FULL_CHURCH_ROTA.pdf", fullDoc.output('blob'));

            // IDENTIFY EVERYONE WHO NEEDS AN EMAIL (Assigned OR Choir Members when Choir is active)
            const recipientIds = new Set();
            activeEvents.forEach(e => {
                // Manually assigned people
                Object.values(e.assignments || {}).forEach(a => { if (a.id) recipientIds.add(a.id); });
                // Choir members for choir events
                if (e.roles?.includes('Choir')) {
                    addressBook.forEach(m => { if (m.markers?.includes('Choir')) recipientIds.add(m.id); });
                }
            });

            for (const mId of recipientIds) {
                const member = addressBook.find(m => m.id === mId);
                if (!member) continue;
                
                const safeName = member.name.replace(/\s+/g, '_');
                const folder = zip.folder(safeName);

                const indDoc = await getPdfBlob('individual', mId, activeEvents);
                if (indDoc) folder.file(`${safeName}_Individual.pdf`, indDoc.output('blob'));

                const houseDoc = await getPdfBlob('household', mId, activeEvents);
                if (houseDoc) folder.file(`${safeName}_Household.pdf`, houseDoc.output('blob'));

                if (fullDoc) folder.file("Full_Church_Reference.pdf", fullDoc.output('blob'));
                
                // CALENDAR ICS DATA
                const myEvents = activeEvents.filter(e => {
                    const isAssigned = Object.values(e.assignments || {}).some(a => a.id === mId);
                    const isChoirDate = member.markers?.includes('Choir') && e.roles?.includes('Choir');
                    return isAssigned || isChoirDate;
                });
                
                let ical = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//EGBC//Rota//EN\n";
                myEvents.forEach(ev => {
                    const roleEntry = Object.entries(ev.assignments).find(([r, a]) => a.id === mId);
                    let role = roleEntry ? roleEntry[0] : (member.markers?.includes('Choir') && ev.roles?.includes('Choir') ? "Choir" : "Serving");
                    const dt = ev.date.replace(/-/g, '');
                    ical += "BEGIN:VEVENT\nDTSTART:" + dt + "T080000\nDTEND:" + dt + "T113000\n";
                    ical += "SUMMARY:Serving: " + role + " (" + ev.type + ")\n";
                    ical += "DESCRIPTION:EGBC Rota. Notes: " + (ev.description || 'None') + "\nEND:VEVENT\n";
                });
                ical += "END:VCALENDAR";
                folder.file("Calendar_Import.ics", ical);
            }
            let csv = "Name,Email\n";
            addressBook.forEach(u => { if(u.email) csv += `"${u.name}","${u.email}"\n`; });
            zip.file("Distribution_List.csv", csv);
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, "EGBC_Rota_Distribution_Package.zip");
        };

        function renderPlanner() {
            const container = document.getElementById('eventList');
            container.innerHTML = '';
            const grouped = {};
            cachedEvents.forEach(ev => {
                if(ev.archived) return; 
                const termKey = ev.termLabel || getTermLabel(ev.date);
                if (!grouped[termKey]) grouped[termKey] = [];
                grouped[termKey].push(ev);
            });
            Object.keys(grouped).sort().forEach(term => {
                const isCollapsed = collapsedTerms.has(term);
                let termHtml = `<div class="mb-12"><div class="flex justify-between items-center bg-[#2c6999] text-white px-8 py-5 rounded-t-[2.5rem] shadow-lg"><button onclick="toggleTermCollapse('${term}')" class="uppercase font-bold tracking-widest font-montserrat">${term}</button><button onclick="archiveTerm('${term}')" class="text-[10px] bg-white/20 px-4 py-1 rounded-full uppercase font-bold hover:bg-white/40 transition-all">Archive Term</button></div><div class="${isCollapsed ? 'hidden' : 'block'} bg-white p-6 border-x border-b border-gray-200 rounded-b-[2.5rem] shadow-inner">`;
                grouped[term].forEach(ev => {
                    const assignedIds = Object.values(ev.assignments || {}).map(a => a.id);
                    const members = addressBook.filter(m => ev.teams?.some(t => m.markers?.includes(t)));
                    const respondersAvail = members.filter(m => availability[ev.id]?.[m.id] === 'avail' && (!hideAssigned || !assignedIds.includes(m.id)));
                    const pending = members.filter(m => !availability[ev.id]?.[m.id] && (!hideAssigned || !assignedIds.includes(m.id)));
                    termHtml += `<div class="bg-[#f8fafc] border border-gray-100 rounded-[3rem] p-6 mb-8 shadow-sm">
                        <div class="flex flex-wrap items-center gap-4 mb-6 border-b border-gray-100 pb-5">
                            <input type="date" value="${ev.date}" onchange="updateField('${ev.id}', 'date', this.value)" class="bg-[#2c6999] text-white px-6 py-2 rounded-full font-bold text-xs shadow-md">
                            <div class="flex items-center gap-2 bg-white px-4 py-1.5 rounded-full border border-gray-100 shadow-sm">
                                <span class="text-[8px] font-black text-gray-300 uppercase">Start</span>
                                <input type="time" value="${ev.startTime || '08:00'}" onchange="updateField('${ev.id}', 'startTime', this.value)" class="text-xs font-bold text-[#2c6999] outline-none">
                                <span class="text-[8px] font-black text-gray-300 uppercase ml-2">End</span>
                                <input type="time" value="${ev.endTime || '11:30'}" onchange="updateField('${ev.id}', 'endTime', this.value)" class="text-xs font-bold text-[#2c6999] outline-none">
                            </div>
                            <select onchange="updateField('${ev.id}', 'type', this.value)" class="bg-white px-6 py-2 rounded-full font-bold text-[#2c6999] text-xs border border-gray-200 shadow-sm outline-none">
                                ${EVENT_TYPES.map(t => `<option value="${t}" ${ev.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                            </select>
                            <input type="text" value="${ev.description || ''}" placeholder="Description..." onchange="updateField('${ev.id}', 'description', this.value)" class="flex-grow bg-white px-6 py-2 rounded-full text-xs font-medium border border-gray-200 shadow-sm outline-none placeholder-gray-300">
                            <div class="flex gap-4 bg-white px-6 py-2 rounded-full border border-gray-100 shadow-sm">
                                ${["Worship Team", "AV Team", "Choir", "Youth Worship"].map(t => `<label class="text-[9px] font-bold uppercase flex items-center gap-1.5 cursor-pointer"><input type="checkbox" onchange="toggleTeam('${ev.id}', '${t}', ${JSON.stringify(ev.teams || [])})" ${ev.teams?.includes(t) ? 'checked' : ''} class="w-4 h-4 accent-[#2c6999]"><span>${t.split(' ')[0]}</span></label>`).join('')}
                            </div>
                            <button onclick="deleteEvent('${ev.id}')" class="group flex items-center gap-1 text-gray-300 hover:text-red-500 transition-colors">
                                <span class="text-[9px] font-black uppercase opacity-0 group-hover:opacity-100 transition-opacity">Delete Service</span>
                                <span class="text-lg font-bold">×</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
                            <div class="xl:col-span-3 flex flex-wrap gap-4">
                                ${(ev.roles || []).map(r => { 
                                    const assigned = ev.assignments?.[r] || null;
                                    let overFreq = false;
                                    if(assigned) {
                                        const memberProfile = addressBook.find(m => m.id === assigned.id);
                                        const limit = memberProfile?.maxFrequency || 99;
                                        const eventDate = new Date(ev.date);
                                        const count = cachedEvents.filter(e => {
                                            const d = new Date(e.date);
                                            return d.getMonth() === eventDate.getMonth() && d.getFullYear() === eventDate.getFullYear() && Object.values(e.assignments || {}).some(a => a.id === assigned.id);
                                        }).length;
                                        if(count > limit) overFreq = true;
                                    }
                                    return `<div ondragover="event.preventDefault()" ondrop="onDropRole(event, '${ev.id}', '${r}')" class="min-w-[160px] bg-white border ${assigned ? (overFreq ? 'border-amber-400 ring-4 ring-amber-50' : 'border-[#2c6999] ring-2 ring-blue-50') : 'border-dashed border-gray-300'} p-4 rounded-[2rem] transition-all shadow-sm">
                                        <div class="text-[9px] font-black uppercase text-gray-400 mb-2 flex justify-between font-montserrat"><span>${r}</span><button onclick="removeRole('${ev.id}', '${r}')" class="text-red-300 hover:text-red-500">×</button></div>
                                        <div draggable="true" ondragstart="onDragStart(event, '${assigned?.id}', '${assigned?.name}', '${ev.id}', '${r}')" class="text-sm font-bold font-montserrat ${assigned ? 'text-[#1e293b] cursor-grab' : 'text-gray-300 italic'}">${assigned ? assigned.name : 'Empty'}</div>
                                        ${overFreq ? `<div class="mt-2 text-[8px] font-extrabold text-amber-600 uppercase tracking-tight bg-amber-50 px-2 py-1 rounded-lg text-center">Serving Limit Reached</div>` : ''}
                                    </div>`;
                                }).join('')}
                                <select onchange="addRole('${ev.id}', this.value); this.value='';" class="bg-white border-2 border-dashed border-gray-200 text-[#2c6999] text-[10px] font-bold px-5 py-3 rounded-[2rem] uppercase shadow-sm cursor-pointer hover:bg-gray-50 transition-colors"><option value="">+ Add Role</option>${OPTIONAL_ROLES.map(opt => `<option value="${opt}">${opt}</option>`).join('')}</select>
                            </div>
                            <div ondragover="event.preventDefault()" ondrop="onDropBucket(event)" class="bg-white p-6 rounded-[3rem] border border-gray-100 shadow-md transition-all hover:bg-blue-50/50">
                                <div class="flex justify-between items-center border-b border-gray-50 pb-3 mb-5"><div class="text-[10px] font-black text-[#2c6999] uppercase tracking-wider">Bucket</div><button onclick="toggleHideAssigned()" class="text-[9px] font-bold uppercase px-3 py-1.5 rounded-full transition-all ${hideAssigned ? 'bg-[#2c6999] text-white' : 'bg-gray-100 text-gray-400 border border-gray-100'}">Hide Assigned</button></div>
                                <div class="space-y-6">
                                    <div><div class="text-[9px] font-black text-green-500 uppercase mb-3 tracking-widest">Available</div><div class="flex flex-wrap gap-2.5">${respondersAvail.map(m => `<div draggable="true" ondragstart="onDragStart(event, '${m.id}', '${m.name}')" title="Primary: ${(m.primaryInstruments || []).join(', ')}\nSecondary: ${(m.secondaryInstruments || []).join(', ')}" class="px-3 py-1.5 bg-green-50 text-green-700 rounded-xl text-[10px] font-bold cursor-grab transition-all hover:scale-105 shadow-sm">${m.name}</div>`).join('')}</div></div>
                                    <div><div class="text-[9px] font-black text-gray-400 uppercase mb-3 tracking-widest border-t border-gray-50 pt-3">Pending</div><div class="flex flex-wrap gap-2.5">${pending.map(m => `<div draggable="true" ondragstart="onDragStart(event, '${m.id}', '${m.name}')" title="Primary: ${(m.primaryInstruments || []).join(', ')}\nSecondary: ${(m.secondaryInstruments || []).join(', ')}" class="px-3 py-1.5 bg-gray-50 text-gray-400 rounded-xl text-[10px] font-bold cursor-grab hover:bg-gray-100 shadow-sm">${m.name}</div>`).join('')}</div></div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
                container.innerHTML += termHtml + `</div></div>`;
            });
        }
    </script>
</head>
<body class="p-8 lg:p-12 bg-[#f4f7fa] font-montserrat">
    <div class="max-w-[1850px] mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-10 border-b border-gray-200 pb-12">
            <div class="flex flex-col gap-4">
                <div class="flex flex-wrap gap-5 bg-white p-4 rounded-[3.5rem] shadow-xl border border-gray-100 items-center">
                    <select id="termSelect" class="bg-gray-50 rounded-full px-8 py-3 text-xs font-bold uppercase outline-none border-none">
                        <option value="">Select Term</option><option value="Spring">Spring</option><option value="Summer">Summer</option><option value="Autumn">Autumn</option>
                    </select>
                    <button onclick="generateTerm()" class="bg-[#2c6999]/10 text-[#2c6999] px-8 py-3 rounded-full font-black text-[10px] uppercase hover:bg-[#2c6999]/20 transition-all">Populate Term</button>
                    <button onclick="addSingleLine()" class="bg-[#2c6999] text-white px-10 py-3 rounded-full font-black text-[10px] uppercase shadow-lg hover:scale-105 transition-all">+ Add Service</button>
                </div>
                <div class="flex gap-4">
                    <button onclick="gatherTermAvailability()" class="bg-[#2c6999] text-white px-8 py-3 rounded-full font-black text-[10px] uppercase shadow-md hover:bg-[#23557d] transition-all">Gather Team Availability (Whole Term)</button>
                    <button onclick="prepareDistributionPackage()" class="bg-amber-500 text-white px-8 py-3 rounded-full font-black text-[10px] uppercase shadow-md hover:bg-amber-600 transition-all">🚀 SEND ALL PERSONAL ROTAS</button>
                </div>
            </div>
            <div class="flex flex-col gap-4">
                <div class="flex flex-wrap gap-5 bg-white p-4 rounded-[3.5rem] shadow-xl border border-gray-100 items-center">
                    <button onclick="generatePDF('full')" class="bg-gray-100 text-gray-600 px-8 py-3 rounded-full font-black text-[9px] uppercase hover:bg-gray-200">Full PDF</button>
                    <select id="memberPdfSelect" class="bg-gray-50 rounded-full px-6 py-3 text-[10px] font-black uppercase outline-none border-none"></select>
                    <button onclick="generatePDF('individual', document.getElementById('memberPdfSelect').value)" class="bg-blue-50 text-blue-600 px-8 py-3 rounded-full font-black text-[9px] uppercase hover:bg-blue-100">Individual PDF</button>
                    <button onclick="generatePDF('household', document.getElementById('memberPdfSelect').value)" class="bg-purple-50 text-purple-600 px-8 py-3 rounded-full font-black text-[9px] uppercase hover:bg-purple-100">Household PDF</button>
                </div>
                <button onclick="gatherIndividualAvailability(document.getElementById('memberPdfSelect').value)" class="bg-gray-100 text-[#2c6999] border border-[#2c6999]/20 px-8 py-3 rounded-full font-black text-[10px] uppercase hover:bg-white transition-all">Gather Individual Availability (Whole Term)</button>
            </div>
        </header>
        <div id="eventList"></div>
    </div>
</body>
</html>
