<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGBC Master Rota Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc, updateDoc, arrayUnion, arrayRemove, deleteField, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
            authDomain: "egbc-worship-planner.firebaseapp.com",
            projectId: "egbc-worship-planner",
            storageBucket: "egbc-worship-planner.firebasestorage.app",
            messagingSenderId: "199442060489",
            appId: "1:199442060489:web:7eaf85a76334c753db6918"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const OPTIONAL_ROLES = ['Sound', 'Words', 'Cameras', 'Violin', 'Congas', '2nd Guitar', '2nd Keys', 'Electric Guitar', 'Oboe', 'Trumpet', 'Cahon', 'Singer 1', 'Singer 2', 'Singer 3', 'Other', 'Other 2', 'Other 3', 'Choir'];
        const MANDATORY_SUNDAY_ROLES = ["Worship Leader", "Keyboard", "Guitar", "Drums", "Bass", "Sound", "Words", "Cameras"];
        const EVENT_TYPES = ['Sunday Morning Worship', 'Sunday Team Practice', 'Evening Carol Service', 'Midnight Service', 'Worship and AV Team Meeting', 'All Team Practice', 'Core Team Meeting', 'Worship Team Meeting', 'AV Team Meeting', 'Song Writing Workshop', 'LOUD Worship'];

        let collapsedTerms = new Set();
        let cachedEvents = [];
        let addressBook = [];
        let availability = {};
        let logoBase64 = null;
        let hideAssigned = false;
        let editingEventId = null;

        const FORM_LINK = "https://esherchurch.github.io/availability-form/";

        const getLogoBase64 = () => {
            return new Promise(async (resolve) => {
                if (logoBase64) return resolve(logoBase64);
                try {
                    const url = await getDownloadURL(ref(storage, '1774936285076.png'));
                    const img = new Image();
                    img.setAttribute('crossOrigin', 'anonymous');
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = img.width; canvas.height = img.height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0);
                        logoBase64 = canvas.toDataURL("image/jpeg", 0.6);
                        resolve(logoBase64);
                    };
                    img.onerror = () => resolve(null);
                    img.src = url + "?c=" + new Date().getTime();
                } catch (e) { resolve(null); }
            });
        };
        getLogoBase64();

        function getTermLabel(dateString) {
            const d = new Date(dateString);
            const month = d.getMonth() + 1; 
            const year = d.getFullYear();
            let term = (month <= 4) ? "Spring" : (month <= 8) ? "Summer" : "Autumn";
            return `${term} ${year}`;
        }

        onSnapshot(collection(db, "addressBook"), (snap) => {
            addressBook = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const select = document.getElementById('memberPdfSelect');
            if (select) {
                const currentVal = select.value;
                select.innerHTML = '<option value="">Select Member...</option>';
                addressBook.sort((a,b) => a.name.localeCompare(b.name)).forEach(m => {
                    select.innerHTML += `<option value="${m.id}">${m.name}</option>`;
                });
                select.value = currentVal;
            }
            renderPlanner();
        });

        onSnapshot(collection(db, "availability"), (snap) => {
            availability = {};
            snap.forEach(d => {
                const data = d.data();
                if (!availability[data.eventId]) availability[data.eventId] = {};
                availability[data.eventId][data.memberId] = data.status;
            });
            renderPlanner();
        });

        onSnapshot(query(collection(db, "events"), orderBy("date")), (snap) => {
            const newEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (editingEventId) {
                cachedEvents = newEvents.map(newEvent => {
                    const currentEvent = cachedEvents.find(ce => ce.id === newEvent.id);
                    return (newEvent.id === editingEventId && currentEvent) ? currentEvent : newEvent;
                });
            } else {
                cachedEvents = newEvents;
            }
            renderPlanner();
        });

        window.toggleHideAssigned = () => { hideAssigned = !hideAssigned; renderPlanner(); };
        window.toggleTermCollapse = (termId) => { collapsedTerms.has(termId) ? collapsedTerms.delete(termId) : collapsedTerms.add(termId); renderPlanner(); };

        window.startEditing = (id) => {
            if (editingEventId === id) return;
            editingEventId = id;
            renderPlanner();
        };

        window.saveEdits = async (id) => {
            const ev = cachedEvents.find(e => e.id === id);
            const descInput = document.querySelector(`input[data-desc-id="${id}"]`);
            const dateInput = document.querySelector(`input[data-date-id="${id}"]`);
            const startInput = document.querySelector(`input[data-start-id="${id}"]`);
            const endInput = document.querySelector(`input[data-end-id="${id}"]`);
            const typeSelect = document.querySelector(`select[data-type-id="${id}"]`);

            if (ev) {
                const updates = {
                    date: dateInput ? dateInput.value : ev.date,
                    startTime: startInput ? startInput.value : (ev.startTime || "08:00"),
                    endTime: endInput ? endInput.value : (ev.endTime || "11:30"),
                    type: typeSelect ? typeSelect.value : ev.type,
                    description: descInput ? descInput.value : (ev.description || ""),
                    termLabel: getTermLabel(dateInput ? dateInput.value : ev.date)
                };
                await updateDoc(doc(db, "events", id), updates);
                editingEventId = null;
                renderPlanner();
            }
        };

        window.submitDraft = async (id) => {
            await updateDoc(doc(db, "events", id), { draft: false });
        };

        window.toggleTeam = async (eventId, teamName) => {
            const eventRef = doc(db, "events", eventId);
            const eventSnap = await getDoc(eventRef);
            if (!eventSnap.exists()) return;
            const currentTeams = eventSnap.data().teams || [];
            const newTeams = currentTeams.includes(teamName) 
                ? currentTeams.filter(t => t !== teamName) 
                : [...currentTeams, teamName];
            await updateDoc(eventRef, { teams: newTeams });
        };

        window.addRole = async (eventId, roleName) => { 
            if(!roleName) return; 
            await updateDoc(doc(db, "events", eventId), { roles: arrayUnion(roleName) }); 
        };

        window.removeRole = async (eventId, roleName) => {
            if(confirm(`Remove role "${roleName}"?`)) {
                const updates = { roles: arrayRemove(roleName) };
                updates[`assignments.${roleName}`] = deleteField();
                await updateDoc(doc(db, "events", eventId), updates);
            }
        };

        window.assignPerson = async (eventId, role, personId, personName) => {
            const updates = {};
            updates[`assignments.${role}`] = { id: personId, name: personName };
            await updateDoc(doc(db, "events", eventId), updates);
        };

        window.unassignPerson = async (eventId, role) => {
            const updates = {};
            updates[`assignments.${role}`] = deleteField();
            await updateDoc(doc(db, "events", eventId), updates);
        };

        window.deleteEvent = async (eventId) => {
            if(confirm("Permanently delete this service?")) await deleteDoc(doc(db, "events", eventId));
        };

        window.archiveTerm = async (termLabel) => {
            if(confirm(`Archive all services in ${termLabel}?`)) {
                const toArchive = cachedEvents.filter(e => e.termLabel === termLabel);
                for (const ev of toArchive) {
                    await updateDoc(doc(db, "events", ev.id), { archived: true });
                }
            }
        };

        window.onDragStart = (e, personId, personName, eventId = null, role = null) => {
            e.dataTransfer.setData("personId", personId);
            e.dataTransfer.setData("personName", personName);
            if(eventId && role) {
                e.dataTransfer.setData("sourceEventId", eventId);
                e.dataTransfer.setData("sourceRole", role);
            }
        };

        window.onDropRole = async (e, eventId, role) => {
            e.preventDefault();
            const personId = e.dataTransfer.getData("personId");
            const personName = e.dataTransfer.getData("personName");
            const sourceEventId = e.dataTransfer.getData("sourceEventId");
            const sourceRole = e.dataTransfer.getData("sourceRole");
            if(sourceEventId === eventId && sourceRole) { await unassignPerson(sourceEventId, sourceRole); }
            await assignPerson(eventId, role, personId, personName);
        };

        window.onDropBucket = async (e) => {
            e.preventDefault();
            const sourceEventId = e.dataTransfer.getData("sourceEventId");
            const sourceRole = e.dataTransfer.getData("sourceRole");
            if(sourceEventId && sourceRole) { await unassignPerson(sourceEventId, sourceRole); }
        };

        window.addSingleLine = async () => {
            const dateStr = new Date().toISOString().split('T')[0];
            await addDoc(collection(db, "events"), {
                date: dateStr, termLabel: getTermLabel(dateStr), type: "Sunday Morning Worship", description: "",
                teams: ["Worship Team", "AV Team"], startTime: "08:00", endTime: "11:30", roles: MANDATORY_SUNDAY_ROLES, archived: false, draft: true
            });
        };

        window.generateTerm = async () => {
            const term = document.getElementById('termSelect').value;
            const year = new Date().getFullYear();
            if(!term) return alert("Select a Term");
            let curr = new Date(`${year}-${term === 'Spring' ? '01' : term === 'Summer' ? '05' : '09'}-01`);
            let end = new Date(`${year}-${term === 'Spring' ? '04' : term === 'Summer' ? '08' : '12'}-31`);
            while (curr.getDay() !== 0) curr.setDate(curr.getDate() + 1);
            while (curr <= end) {
                const dateStr = curr.toISOString().split('T')[0];
                await addDoc(collection(db, "events"), {
                    date: dateStr, termLabel: getTermLabel(dateStr), type: "Sunday Morning Worship", description: "",
                    teams: ["Worship Team", "AV Team"], startTime: "08:00", endTime: "11:30", roles: MANDATORY_SUNDAY_ROLES, archived: false
                });
                curr.setDate(curr.getDate() + 7);
            }
        };

        window.addThursdayPractices = async () => {
            const term = document.getElementById('termSelect').value;
            const year = new Date().getFullYear();
            if(!term) return alert("Select a Term to add practices to.");
            let curr = new Date(`${year}-${term === 'Spring' ? '01' : term === 'Summer' ? '05' : '09'}-01`);
            let end = new Date(`${year}-${term === 'Spring' ? '04' : term === 'Summer' ? '08' : '12'}-31`);
            while (curr.getDay() !== 4) curr.setDate(curr.getDate() + 1);
            if(confirm(`This will add every Thursday practice for ${term} ${year}. Continue?`)) {
                while (curr <= end) {
                    const dateStr = curr.toISOString().split('T')[0];
                    await addDoc(collection(db, "events"), {
                        date: dateStr, termLabel: getTermLabel(dateStr), type: "Sunday Team Practice", description: "Thursday Rehearsal",
                        teams: ["Worship Team"], startTime: "19:30", endTime: "21:30", roles: ["Worship Leader", "Keyboard", "Guitar", "Drums", "Bass"], archived: false
                    });
                    curr.setDate(curr.getDate() + 7);
                }
                alert("Thursday practices added successfully.");
            }
        };

        window.gatherTermAvailability = async () => {
            const terms = [...new Set(cachedEvents.filter(e => !e.archived).map(e => e.termLabel))];
            if(terms.length === 0) return alert("No active terms found.");
            const selectedTerm = prompt(`Gather availability for which term?\n\nOptions:\n${terms.join('\n')}`, terms[0]);
            if(!selectedTerm) return;
            const relevantEmails = new Set();
            const eventsInTerm = cachedEvents.filter(e => !e.archived && e.termLabel === selectedTerm);
            eventsInTerm.forEach(ev => {
                const eventTeams = ev.teams || [];
                addressBook.forEach(m => {
                    if(m.markers?.some(r => eventTeams.includes(r))) { relevantEmails.add(m.email); }
                });
            });
            const bccList = [...relevantEmails].join(';');
            if(!bccList) return alert("No members found for this term.");
            const mainTo = "av@esherchurch.org";
            const subject = encodeURIComponent(`EGBC Availability: ${selectedTerm}`);
            const body = encodeURIComponent(
                "==========================================\n" +
                "  ESHER GREEN BAPTIST CHURCH | WORSHIP & AV\n" +
                "==========================================\n\n" +
                "Hi Team,\n\n" +
                "It's time to gather availability for the upcoming " + selectedTerm + " term.\n\n" +
                "PLEASE CLICK THE LINK BELOW TO PROVIDE YOUR DATES:\n" +
                "👉 " + FORM_LINK + "\n\n" +
                "------------------------------------------\n" +
                "Instructions:\n" +
                "1. Click the link above\n" +
                "2. Select your name from the list\n" +
                "3. Mark 'Available' or 'Not Available' for each Sunday\n" +
                "4. Hit 'Submit Availability' at the bottom\n\n" +
                "Thank you for serving!\n\n" +
                "EGBC Worship & AV Team"
            );
            window.location.href = `mailto:${mainTo}?bcc=${bccList}&subject=${subject}&body=${body}`;
        };

        const getPdfBlob = async (type, memberId, specificEvents = null) => {
            const { jsPDF } = window.jspdf;
            if (type === "wall") {
                const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "A4" });
                const logo = await getLogoBase64();
                const member = addressBook.find(m => m.id === memberId);
                let householdIds = [];
                let displayTitle = "Household";
                if (member) {
                    const headId = member.householdId || member.id;
                    const head = addressBook.find(m => m.id === headId);
                    const rawName = head ? head.name : member.name;
                    const surname = rawName.split(' ').pop();
                    displayTitle = surname + " Family";
                    householdIds = addressBook.filter(m => m.id === headId || m.householdId === headId).map(m => m.id);
                }
                const allTermEvents = (specificEvents || cachedEvents.filter(e => !e.archived)).sort((a, b) => new Date(a.date) - new Date(b.date));
                if (allTermEvents.length === 0) return null;
                const eventsByMonth = {};
                allTermEvents.forEach(ev => {
                    const d = new Date(ev.date);
                    const key = d.toLocaleString("en-GB", { month: "long", year: "numeric" });
                    if (!eventsByMonth[key]) eventsByMonth[key] = [];
                    eventsByMonth[key].push(ev);
                });
                const sortedMonths = Object.keys(eventsByMonth).sort((a, b) => new Date(eventsByMonth[a][0].date) - new Date(eventsByMonth[b][0].date));
                sortedMonths.forEach((month, idx) => {
                    if (idx > 0) doc.addPage();
                    if (logo) {
                        const p = doc.getImageProperties(logo);
                        const w = 50;
                        const h = (p.height * w) / p.width;
                        doc.addImage(logo, "JPEG", 40, 30, w, h);
                    }
                    doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.setTextColor(44, 105, 153);
                    doc.text(`${displayTitle} – Wall Planner`, 100, 50);
                    doc.setFontSize(14); doc.setTextColor(100, 100, 100);
                    doc.text(month, 100, 70);
                    const firstDate = new Date(eventsByMonth[month][0].date);
                    const yr = firstDate.getFullYear();
                    const mth = firstDate.getMonth();
                    const startDay = new Date(yr, mth, 1).getDay();
                    const daysInM = new Date(yr, mth + 1, 0).getDate();
                    const offset = startDay === 0 ? 6 : startDay - 1;
                    const rows = [];
                    let week = Array(7).fill(null);
                    for (let i = 0; i < offset; i++) week[i] = { empty: true };
                    for (let d = 1; d <= daysInM; d++) {
                        const dateStr = `${yr}-${String(mth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        const dayEvents = eventsByMonth[month].filter(e => e.date === dateStr);
                        const dayIdx = (d + offset - 1) % 7;
                        week[dayIdx] = { day: d, events: dayEvents };
                        if (dayIdx === 6 || d === daysInM) { rows.push(week); week = Array(7).fill(null); }
                    }
                    doc.autoTable({
                        startY: 90,
                        head: [["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]],
                        body: rows.map(w => w.map(c => {
                            if (!c || c.empty) return "";
                            let cellData = `DAY:${c.day}`;
                            c.events.forEach(ev => {
                                const matches = [];
                                if (ev.assignments) {
                                    Object.entries(ev.assignments).forEach(([role, person]) => {
                                        if (householdIds.includes(person.id)) matches.push(`${person.name.split(' ')[0]}: ${role}`);
                                    });
                                }
                                if (matches.length > 0) cellData += `|S:${ev.type}|R:${matches.join(', ')}`;
                            });
                            return cellData;
                        })),
                        theme: 'grid',
                        styles: { fontSize: 0.1, cellPadding: 4, minCellHeight: 65, valign: 'top', textColor: [255, 255, 255] },
                        headStyles: { fillColor: [44, 105, 153], textColor: 255, halign: 'center', fontSize: 10 },
                        columnStyles: { 0: { cellWidth: 108 }, 1: { cellWidth: 108 }, 2: { cellWidth: 108 }, 3: { cellWidth: 108 }, 4: { cellWidth: 108 }, 5: { cellWidth: 108 }, 6: { cellWidth: 108 } },
                        didDrawCell: (data) => {
                            if (data.section === 'body' && data.cell.raw !== "") {
                                const segs = data.cell.raw.split('|');
                                let yPos = data.cell.y + 12;
                                segs.forEach(s => {
                                    if (s.startsWith("DAY:")) {
                                        doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(180, 180, 180);
                                        doc.text(s.replace("DAY:", ""), data.cell.x + 5, yPos); yPos += 12;
                                    } else if (s.startsWith("S:")) {
                                        doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(44, 105, 153);
                                        const l = doc.splitTextToSize(s.replace("S:", ""), 100); doc.text(l, data.cell.x + 5, yPos); yPos += (l.length * 8) + 1;
                                    } else if (s.startsWith("R:")) {
                                        doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(0, 0, 0);
                                        const r = doc.splitTextToSize(s.replace("R:", ""), 100); doc.text(r, data.cell.x + 5, yPos); yPos += (r.length * 8) + 4;
                                    }
                                });
                            }
                        }
                    });
                });
                return doc;
            }

            const docRef = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4', compress: true }); 
            const activeLogo = await getLogoBase64();
            let termEvents = (specificEvents || cachedEvents.filter(e => !e.archived && !e.draft)).sort((a,b) => new Date(a.date) - new Date(b.date));
            if(termEvents.length === 0) return null;

            let termTitle = termEvents[0].termLabel;
            let reportTitle = "";

            if (type === 'individual') {
                const member = addressBook.find(m => m.id === memberId);
                reportTitle = `${member.name.toUpperCase()} - ${termTitle}`;
                termEvents = termEvents.filter(e => Object.values(e.assignments || {}).some(a => a.id === memberId));
            } else if (type === 'household') {
                const member = addressBook.find(m => m.id === memberId);
                const headId = member.householdId || member.id;
                const hIds = addressBook.filter(m => m.id === headId || m.householdId === headId).map(m => m.id);
                reportTitle = `HOUSEHOLD ROTA: ${member.name.toUpperCase()} - ${termTitle}`;
                termEvents = termEvents.filter(e => Object.values(e.assignments || {}).some(a => hIds.includes(a.id)));
            } else { reportTitle = `FULL ROTA: ${termTitle}`; }

            if (termEvents.length === 0) return null;

            if (activeLogo) {
                try { 
                    const props = docRef.getImageProperties(activeLogo);
                    const fixedWidth = 25; 
                    const scaledHeight = (props.height * fixedWidth) / props.width;
                    docRef.addImage(activeLogo, 'JPEG', 260, 10, fixedWidth, scaledHeight, undefined, 'FAST'); 
                } catch(e) {}
            }

            docRef.setFillColor(245, 248, 255); docRef.roundedRect(12, 12, 230, 10, 4, 4, 'F');
            docRef.setTextColor(44, 105, 153); docRef.setFont("helvetica", "bold"); docRef.setFontSize(18);
            docRef.text(reportTitle, 16, 19);

            const allRoles = [...new Set(termEvents.flatMap(e => e.roles || []))];
            const headers = [['DATE', 'SERVICE', ...allRoles.map(r => r.toUpperCase()), 'DESCRIPTION']];
            const tableBody = termEvents.map(e => {
                const row = [new Date(e.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }), e.type]; 
                allRoles.forEach(role => row.push(e.assignments?.[role]?.name || "---"));
                row.push(e.description || "");
                return row;
            });

            docRef.autoTable({
                startY: 35, head: headers, body: tableBody, theme: 'plain',
                headStyles: { fillColor: null, textColor: [255, 255, 255], fontSize: 6, halign: 'center', cellPadding: 4 },
                styles: { fontSize: 5.5, cellPadding: 2, halign: 'center', overflow: 'linebreak' }, // FIX: wrapping & small font
                columnStyles: { 0: { halign: 'left', fontStyle: 'bold' }, 1: { halign: 'left' } },
                margin: { horizontal: 10 },
                willDrawCell: function(data) {
                    if (data.section === 'head' && data.row.index === 0 && data.column.index === 0) {
                        docRef.setFillColor(44, 105, 153); docRef.roundedRect(data.settings.margin.left, data.cell.y, 277, data.cell.height + 2, 4, 4, 'F');
                        docRef.rect(data.settings.margin.left, data.cell.y + 2, 277, data.cell.height, 'F');
                    }
                },
                didDrawCell: function(data) { if (data.section === 'body') { docRef.setDrawColor(230, 235, 245); docRef.setLineWidth(0.1); docRef.line(data.cell.x, data.cell.y + data.cell.height, data.cell.x + data.cell.width, data.cell.y + data.cell.height); } },
                didDrawPage: function(data) { docRef.setDrawColor(44, 105, 153); docRef.setLineWidth(0.3); docRef.roundedRect(10, 35, 277, data.cursor.y - 35, 4, 4, 'D'); }
            });
            return docRef;
        };

        window.exportToExcel = () => {
            const activeEvents = cachedEvents.filter(e => !e.archived && !e.draft).sort((a,b) => new Date(a.date) - new Date(b.date));
            if (activeEvents.length === 0) return alert("No active events found.");
            const allRoles = [...new Set(activeEvents.flatMap(e => e.roles || []))];
            const data = activeEvents.map(e => {
                const row = {
                    Date: new Date(e.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
                    Service: e.type
                };
                allRoles.forEach(role => { row[role] = e.assignments?.[role]?.name || ""; });
                row.Description = e.description || "";
                return row;
            });
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Rota");
            XLSX.writeFile(workbook, `EGBC_Rota_${activeEvents[0].termLabel.replace(/\s/g, '_')}.xlsx`);
        };

        const generateICal = (type, memberId, events) => {
            let relevantEvents = [];
            let hIds = [memberId];
            if (type === 'individual') { relevantEvents = events.filter(e => !e.draft && Object.values(e.assignments || {}).some(a => a.id === memberId)); }
            else {
                const member = addressBook.find(m => m.id === memberId);
                const headId = member?.householdId || memberId;
                hIds = addressBook.filter(m => m.id === headId || m.householdId === headId).map(m => m.id);
                relevantEvents = events.filter(e => !e.draft && Object.values(e.assignments || {}).some(a => hIds.includes(a.id)));
            }
            if (relevantEvents.length === 0) return null;
            let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//EGBC//Rota//EN\n";
            relevantEvents.forEach(e => {
                const start = e.date.replace(/-/g, '') + 'T' + (e.startTime || '0800').replace(':', '') + '00';
                const end = e.date.replace(/-/g, '') + 'T' + (e.endTime || '1130').replace(':', '') + '00';
                let summary = "";
                if (type === 'individual') { summary = `EGBC: ${Object.entries(e.assignments || {}).find(([r, p]) => p.id === memberId)?.[0] || "Server"} (${e.type})`; }
                else { summary = `EGBC Family Rota: ${Object.entries(e.assignments || {}).filter(([r, p]) => hIds.includes(p.id)).map(([r, p]) => `${p.name.split(' ')[0]} (${r})`).join(", ")}`; }
                ics += `BEGIN:VEVENT\nDTSTART:${start}\nDTEND:${end}\nSUMMARY:${summary}\nDESCRIPTION:${e.description || ""}\nLOCATION:Esher Green Baptist Church\nEND:VEVENT\n`;
            });
            ics += "END:VCALENDAR";
            return ics;
        };

        window.generatePDF = async (type, memberId) => {
            const doc = await getPdfBlob(type, memberId);
            if (!doc) return alert("No assigned dates found.");
            doc.save(`${type}_rota.pdf`);
        };

        window.prepareDistributionPackage = async () => {
            const zip = new JSZip();
            const activeEvents = cachedEvents.filter(e => !e.archived && !e.draft);
            if (activeEvents.length === 0) return alert("No active events found.");
            const fullDoc = await getPdfBlob('full', null, activeEvents);
            if (fullDoc) zip.file("00_FULL_CHURCH_ROTA.pdf", fullDoc.output('blob'));
            const assignedIds = new Set();
            activeEvents.forEach(e => Object.values(e.assignments || {}).forEach(a => { if (a.id) assignedIds.add(a.id); }));
            let csv = "Name,Email\n";
            for (const mId of assignedIds) {
                const member = addressBook.find(m => m.id === mId);
                if (!member) continue;
                if (member.email) csv += `"${member.name}","${member.email}"\n`;
                const safeName = member.name.replace(/\s+/g, '_');
                const folder = zip.folder(safeName);
                const indDoc = await getPdfBlob('individual', mId, activeEvents);
                if (indDoc) folder.file(`${safeName}_Individual.pdf`, indDoc.output('blob'));
                const houseDoc = await getPdfBlob('household', mId, activeEvents);
                if (houseDoc) folder.file(`${safeName}_Household.pdf`, houseDoc.output('blob'));
                const wallDoc = await getPdfBlob('wall', mId, activeEvents);
                if (wallDoc) folder.file(`${safeName}_Wall_Planner.pdf`, wallDoc.output('blob'));
                const indIcal = generateICal('individual', mId, activeEvents);
                if (indIcal) folder.file(`${safeName}_Individual_Calendar.ics`, indIcal);
                const houseIcal = generateICal('household', mId, activeEvents);
                if (houseIcal) folder.file(`${safeName}_Family_Calendar.ics`, houseIcal);
                if (fullDoc) folder.file("Full_Church_Reference.pdf", fullDoc.output('blob'));
            }
            zip.file("Distribution_List.csv", csv);
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, "EGBC_Rota_Distribution_Package.zip");
        };

        function renderPlanner() {
            const container = document.getElementById('eventList');
            container.innerHTML = '';
            const drafts = cachedEvents.filter(e => e.draft && !e.archived);
            if (drafts.length > 0) {
                let draftHtml = `<div class="mb-12"><div class="flex justify-between items-center bg-amber-500 text-white px-8 py-5 rounded-t-[2.5rem] shadow-lg"><span class="uppercase font-bold tracking-widest font-montserrat">NEW SERVICES (Pending Submission)</span></div><div class="bg-white p-6 border-x border-b border-gray-200 rounded-b-[2.5rem] shadow-inner">`;
                drafts.forEach(ev => draftHtml += generateEventHtml(ev, true));
                container.innerHTML += draftHtml + `</div></div>`;
            }
            const grouped = {};
            cachedEvents.forEach(ev => {
                if(ev.archived || ev.draft) return; 
                const termKey = ev.termLabel || getTermLabel(ev.date);
                if (!grouped[termKey]) grouped[termKey] = [];
                grouped[termKey].push(ev);
            });
            Object.keys(grouped).sort().forEach(term => {
                const isCollapsed = collapsedTerms.has(term);
                let termHtml = `<div class="mb-12"><div class="flex justify-between items-center bg-[#2c6999] text-white px-8 py-5 rounded-t-[2.5rem] shadow-lg"><button onclick="toggleTermCollapse('${term}')" class="uppercase font-bold tracking-widest font-montserrat">${term}</button><button onclick="archiveTerm('${term}')" class="text-[10px] bg-white/20 px-4 py-1 rounded-full uppercase font-bold hover:bg-white/40 transition-all">Archive Term</button></div><div class="${isCollapsed ? 'hidden' : 'block'} bg-white p-6 border-x border-b border-gray-200 rounded-b-[2.5rem] shadow-inner">`;
                grouped[term].forEach(ev => termHtml += generateEventHtml(ev, false));
                container.innerHTML += termHtml + `</div></div>`;
            });
        }

        function generateEventHtml(ev, isDraft) {
            const isEditing = editingEventId === ev.id;
            const assignedIds = Object.values(ev.assignments || {}).map(a => a.id);
            const members = addressBook.filter(m => ev.teams?.some(t => m.markers?.includes(t)));
            const respondersAvail = members.filter(m => availability[ev.id]?.[m.id] === 'avail' && (!hideAssigned || !assignedIds.includes(m.id)));
            const declined = members.filter(m => (availability[ev.id]?.[m.id] === 'unavailable' || availability[ev.id]?.[m.id] === 'not-avail') && (!hideAssigned || !assignedIds.includes(m.id)));
            const pending = members.filter(m => !availability[ev.id]?.[m.id] && (!hideAssigned || !assignedIds.includes(m.id)));

            return `<div class="bg-[#f8fafc] border border-gray-100 rounded-[3rem] p-6 mb-8 shadow-sm">
                <div class="flex flex-wrap items-center gap-4 mb-6 border-b border-gray-100 pb-5">
                    <input type="date" value="${ev.date}" data-date-id="${ev.id}" onfocus="startEditing('${ev.id}')" class="bg-[#2c6999] text-white px-6 py-2 rounded-full font-bold text-xs shadow-md">
                    <div class="flex items-center gap-2 bg-white px-4 py-1.5 rounded-full border border-gray-100 shadow-sm">
                        <span class="text-[8px] font-black text-gray-300 uppercase">Start</span>
                        <input type="time" value="${ev.startTime || '08:00'}" data-start-id="${ev.id}" onfocus="startEditing('${ev.id}')" class="text-xs font-bold text-[#2c6999] outline-none">
                        <span class="text-[8px] font-black text-gray-300 uppercase ml-2">End</span>
                        <input type="time" value="${ev.endTime || '11:30'}" data-end-id="${ev.id}" onfocus="startEditing('${ev.id}')" class="text-xs font-bold text-[#2c6999] outline-none">
                    </div>
                    <select data-type-id="${ev.id}" onfocus="startEditing('${ev.id}')" class="bg-white px-6 py-2 rounded-full font-bold text-[#2c6999] text-xs border border-gray-200 shadow-sm outline-none">
                        ${EVENT_TYPES.map(t => `<option value="${t}" ${ev.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                    </select>
                    <input type="text" value="${ev.description || ''}" data-desc-id="${ev.id}" placeholder="Description..." onfocus="startEditing('${ev.id}')" class="flex-grow bg-white px-6 py-2 rounded-full text-xs font-medium border border-gray-200 shadow-sm outline-none placeholder-gray-300">
                    <div class="flex gap-4 bg-white px-6 py-2 rounded-full border border-gray-100 shadow-sm">
                        ${["Core Team", "Worship Team", "AV Team", "Choir", "Youth Worship"].map(t => `<label class="text-[9px] font-bold uppercase flex items-center gap-1.5 cursor-pointer"><input type="checkbox" onchange="toggleTeam('${ev.id}', '${t}')" ${ev.teams?.includes(t) ? 'checked' : ''} class="w-4 h-4 accent-[#2c6999]"><span>${t.split(' ')[0]}</span></label>`).join('')}
                    </div>
                    ${isDraft ? `<button onclick="submitDraft('${ev.id}')" class="bg-green-500 text-white px-6 py-2 rounded-full font-black text-[10px] uppercase shadow-md hover:bg-green-600 transition-all">Submit</button>` : ''}
                    ${isEditing ? `<button onclick="saveEdits('${ev.id}')" class="bg-blue-500 text-white px-6 py-2 rounded-full font-black text-[10px] uppercase shadow-md hover:bg-blue-600 transition-all">Update</button>` : ''}
                    <button onclick="deleteEvent('${ev.id}')" class="group flex items-center gap-1 text-gray-300 hover:text-red-500 transition-colors">
                        <span class="text-[9px] font-black uppercase opacity-0 group-hover:opacity-100 transition-opacity">Delete Service</span>
                        <span class="text-lg font-bold">×</span>
                    </button>
                </div>
                <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
                    <div class="xl:col-span-3">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            ${(ev.roles || MANDATORY_SUNDAY_ROLES).map(role => {
                                const assignment = ev.assignments?.[role];
                                return `
                                <div ondragover="event.preventDefault()" ondrop="onDropRole(event, '${ev.id}', '${role}')" class="bg-white p-4 rounded-[2rem] border border-gray-100 shadow-sm flex flex-col justify-between min-h-[90px] relative group">
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="text-[8px] font-black text-gray-400 uppercase tracking-widest">${role}</span>
                                        <button onclick="removeRole('${ev.id}', '${role}')" class="text-gray-200 hover:text-red-400 text-xs opacity-0 group-hover:opacity-100 transition-opacity">×</button>
                                    </div>
                                    ${assignment ? `
                                        <div draggable="true" ondragstart="onDragStart(event, '${assignment.id}', '${assignment.name}', '${ev.id}', '${role}')" class="flex items-center justify-between bg-blue-50 px-3 py-2 rounded-xl border border-blue-100 cursor-move">
                                            <span class="text-[11px] font-bold text-blue-700 truncate">${assignment.name}</span>
                                            <button onclick="unassignPerson('${ev.id}', '${role}')" class="text-blue-300 hover:text-blue-600 ml-1">×</button>
                                        </div>
                                    ` : `<div class="text-[10px] text-gray-300 font-bold italic">Empty</div>`}
                                </div>`;
                            }).join('')}
                            <button onclick="addRole('${ev.id}', prompt('Custom Role Name?'))" class="bg-gray-50 border-2 border-dashed border-gray-200 rounded-[2rem] p-4 flex items-center justify-center text-gray-400 hover:bg-white hover:text-[#2c6999] hover:border-[#2c6999] transition-all group">
                                <span class="text-xs font-black uppercase tracking-widest">+ Add Role</span>
                            </button>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-[2.5rem] shadow-inner border border-gray-100">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Availability</span>
                            <button onclick="toggleHideAssigned()" class="text-[8px] bg-gray-100 px-2 py-1 rounded-full text-gray-500 hover:bg-gray-200 font-bold uppercase transition-all">${hideAssigned ? 'Show All' : 'Hide Assigned'}</button>
                        </div>
                        <div class="space-y-4 max-h-[400px] overflow-y-auto pr-2">
                            ${respondersAvail.length > 0 ? `<div><div class="text-[8px] font-black text-green-500 uppercase mb-2">Available</div><div class="flex flex-wrap gap-1.5">${respondersAvail.map(m => `<div draggable="true" ondragstart="onDragStart(event, '${m.id}', '${m.name}')" class="bg-green-50 text-green-600 px-3 py-1 rounded-full text-[10px] font-bold border border-green-100 cursor-move hover:bg-green-100">${m.name}</div>`).join('')}</div></div>` : ''}
                            ${pending.length > 0 ? `<div><div class="text-[8px] font-black text-gray-400 uppercase mb-2">No Response</div><div class="flex flex-wrap gap-1.5">${pending.map(m => `<div draggable="true" ondragstart="onDragStart(event, '${m.id}', '${m.name}')" class="bg-gray-50 text-gray-500 px-3 py-1 rounded-full text-[10px] font-bold border border-gray-100 cursor-move hover:bg-white hover:shadow-sm">${m.name}</div>`).join('')}</div></div>` : ''}
                            ${declined.length > 0 ? `<div><div class="text-[8px] font-black text-red-400 uppercase mb-2">Unavailable</div><div class="flex flex-wrap gap-1.5">${declined.map(m => `<div class="bg-red-50 text-red-400 px-3 py-1 rounded-full text-[10px] font-bold border border-red-100 opacity-60">${m.name}</div>`).join('')}</div></div>` : ''}
                        </div>
                    </div>
                </div>
            </div>`;
        }
    </script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f1f5f9; color: #334155; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-[1600px] mx-auto">
        <div class="bg-white rounded-[3rem] shadow-2xl p-8 mb-12 border-4 border-white overflow-hidden relative">
            <div class="absolute top-0 right-0 w-64 h-64 bg-[#2c6999] opacity-5 rounded-full -mr-32 -mt-32"></div>
            <div class="flex flex-wrap justify-between items-center gap-8 relative z-10">
                <div class="flex items-center gap-6">
                    <img src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media" class="h-16 w-16 object-contain" alt="Logo">
                    <div>
                        <h1 class="text-4xl font-black tracking-tight text-slate-800">EGBC MASTER<br><span class="text-[#2c6999]">ROTA PLANNER</span></h1>
                    </div>
                </div>
                <div class="flex flex-wrap gap-3">
                    <select id="termSelect" class="bg-slate-100 px-6 py-3 rounded-full font-bold text-xs border-none outline-none shadow-inner">
                        <option value="">Select Term...</option>
                        <option value="Spring">Spring</option>
                        <option value="Summer">Summer</option>
                        <option value="Autumn">Autumn</option>
                    </select>
                    <button onclick="generateTerm()" class="bg-[#2c6999] text-white px-8 py-3 rounded-full font-black text-[10px] uppercase tracking-widest shadow-lg hover:scale-105 transition-all">Build Sundays</button>
                    <button onclick="addThursdayPractices()" class="bg-slate-800 text-white px-8 py-3 rounded-full font-black text-[10px] uppercase tracking-widest shadow-lg hover:scale-105 transition-all">Add Thursdays</button>
                    <button onclick="addSingleLine()" class="bg-indigo-500 text-white px-8 py-3 rounded-full font-black text-[10px] uppercase tracking-widest shadow-lg hover:scale-105 transition-all">+ Add Service</button>
                </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-12 border-t border-slate-100 pt-8">
                <div class="bg-slate-50 p-6 rounded-[2.5rem]">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-4">Availability Management</span>
                    <button onclick="gatherTermAvailability()" class="w-full bg-white border-2 border-[#2c6999] text-[#2c6999] px-6 py-4 rounded-3xl font-black text-[10px] uppercase tracking-widest hover:bg-[#2c6999] hover:text-white transition-all shadow-sm mb-3 text-left">📧 Email Entire Term</button>
                </div>
                <div class="bg-slate-50 p-6 rounded-[2.5rem]">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-4">Export Full Rota</span>
                    <div class="flex gap-2">
                        <button onclick="generatePDF('full')" class="flex-grow bg-white border-2 border-[#2c6999] text-[#2c6999] px-4 py-4 rounded-3xl font-black text-[10px] uppercase tracking-widest hover:bg-[#2c6999] hover:text-white transition-all shadow-sm">PDF</button>
                        <button onclick="exportToExcel()" class="flex-grow bg-white border-2 border-emerald-600 text-emerald-600 px-4 py-4 rounded-3xl font-black text-[10px] uppercase tracking-widest hover:bg-emerald-600 hover:text-white transition-all shadow-sm">Excel</button>
                        <button onclick="prepareDistributionPackage()" class="flex-grow bg-slate-800 text-white px-4 py-4 rounded-3xl font-black text-[10px] uppercase tracking-widest hover:scale-105 transition-all shadow-lg">📦 ZIP PKG</button>
                    </div>
                </div>
                <div class="bg-slate-50 p-6 rounded-[2.5rem]">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-4">Member Tools</span>
                    <div class="flex flex-wrap gap-2">
                        <select id="memberPdfSelect" class="flex-grow bg-white px-6 py-4 rounded-3xl text-xs font-bold border-none shadow-sm outline-none">
                            <option value="">Select Member...</option>
                        </select>
                        <button onclick="generatePDF('individual', document.getElementById('memberPdfSelect').value)" class="bg-[#2c6999] text-white w-12 h-12 rounded-2xl font-black text-xs shadow-lg hover:scale-110 transition-all flex items-center justify-center">IND</button>
                        <button onclick="generatePDF('household', document.getElementById('memberPdfSelect').value)" class="bg-[#2c6999] text-white w-12 h-12 rounded-2xl font-black text-xs shadow-lg hover:scale-110 transition-all flex items-center justify-center">FAM</button>
                        <button onclick="generatePDF('wall', document.getElementById('memberPdfSelect').value)" class="bg-amber-500 text-white w-12 h-12 rounded-2xl font-black text-xs shadow-lg hover:scale-110 transition-all flex items-center justify-center">CAL</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="eventList"></div>
        <div ondragover="event.preventDefault()" ondrop="onDropBucket(event)" class="fixed bottom-8 right-8 w-20 h-20 bg-red-500 rounded-full flex items-center justify-center text-white text-3xl shadow-2xl hover:scale-110 transition-all cursor-pointer z-50 group">
            <span>🗑️</span>
            <div class="absolute bottom-full right-0 mb-4 bg-slate-800 text-white text-[8px] font-black uppercase px-3 py-1 rounded-full opacity-0 group-hover:opacity-100 whitespace-nowrap transition-opacity">Drop to Unassign</div>
        </div>
    </div>
</body>
</html>
