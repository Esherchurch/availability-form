<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safeguarding</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610082145" data-title="Safeguarding"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-church.js?v=202610101000"></script>
<script src="egbc-guard.js?v=202610062100"></script>
<script src="egbc-email.js?v=202610081729"></script>
<script src="egbc-ics.js?v=202610091200"></script>
<script src="egbc-events.js?v=202610072300"></script>
<script src="egbc-events-checkin.js?v=202610080900"></script>
<script src="egbc-events-safeguarding.js?v=202610081800"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 12px;padding-bottom:12px;
           border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{width:32px;height:32px;border-radius:8px;background:var(--tint);color:var(--brand);
         display:inline-flex;align-items:center;justify-content:center;flex:none}
  .spacer{flex:1}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select,textarea{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;
       font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  textarea{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
  .inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .field{margin-bottom:12px}
  .two{display:flex;gap:12px;flex-wrap:wrap}
  .two>.field{flex:1;min-width:150px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--body);margin:0 0 10px;font-weight:400}
  .check input{width:16px;height:16px;accent-color:var(--brand);flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
       border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent;
       background:var(--brand);color:#fff;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.sec:hover{background:#f3f4f6}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:#f3f4f6}
  .btn.danger{background:#fff;color:var(--danger);border-color:#e8c3bd}
  .btn.sm{height:32px;padding:0 10px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .row .ib{width:36px;height:36px;border-radius:8px;background:var(--tint);color:var(--brand);
           display:flex;align-items:center;justify-content:center;flex:none}
  .row .who{flex:1;min-width:0}
  .row .n{font-size:14px;font-weight:600;color:var(--ink)}
  .row .m{font-size:13px;color:var(--muted)}
  .flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:6px;padding:1px 7px;margin:2px 4px 0 0;white-space:nowrap}
  .flag.ok{background:var(--ok-bg);color:var(--ok)}
  .flag.warn{background:var(--danger-bg);color:var(--danger)}
  .flag.wait{background:var(--gold-bg);color:var(--gold)}
  .flag.off{background:#f3f4f6;color:var(--muted)}
  .hint{font-size:13px;color:var(--muted)}
  .banner{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:12px}
  .banner.warn{background:var(--danger-bg);color:var(--danger)}
  .banner.ok{background:var(--ok-bg);color:var(--ok)}
  .banner.gold{background:var(--gold-bg);color:var(--gold)}
  .banner.info{background:var(--tint);color:var(--body);border:1px solid #cfe0de}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .tile .v{font-size:22px;font-weight:700;color:var(--ink);line-height:1.2}
  .tile .k{font-size:12px;color:var(--muted)}
  @media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .entry{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .entry .t{font-size:13px;color:var(--muted);margin-bottom:6px}
  .entry .b{white-space:pre-wrap;color:var(--ink)}
  .modal-back{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-start;justify-content:center;
              padding:40px 12px;z-index:80;overflow:auto}
  .modal{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .modal h3{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;
         padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card hint">Loading…</div></div>
<div class="modal-back" id="mBack"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, C = window.EGBCCheckin, SG = window.EGBCSafeguarding, esc = E.esc;
  var EVID = new URLSearchParams(location.search).get('event') || '';
  var ME = {}, ADMIN = false, MASTER = false, LEADSITES = [], SITES = [];
  var EV = null, SITE = '', LEAD = null, LEADER = false, ISLEAD = false;
  var SIGNUPS = null, FORMINFO = { children: {}, responses: [] }, USERS = [], CHECKS = {}, INCIDENTS = [], UNSHARED = [];

  function db() { return EGBCAuth.db; }
  function icons() { if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons(); }
  function ico(n, px) { return '<i data-lucide="' + n + '" style="width:' + (px || 15) + 'px;height:' + (px || 15) + 'px"></i>'; }
  function toast(m) {
    var t = document.getElementById('toast');
    t.textContent = m; t.style.display = 'block';
    clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3400);
  }
  function now() { return new Date().toISOString(); }
  function nowLocal() { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  function when(iso) { return iso ? E.fmtDate(iso) + ', ' + E.fmtTime(iso) : ''; }
  function siteName(id) { var s = SITES.filter(function (x) { return x.id === id; })[0]; return s ? s.name : 'this site'; }
  function modal(html) {
    document.getElementById('modal').innerHTML = html;
    document.getElementById('mBack').style.display = 'flex';
    document.querySelectorAll('[data-close]').forEach(function (b) { b.onclick = closeModal; });
    icons();
  }
  function closeModal() { document.getElementById('mBack').style.display = 'none'; }
  document.getElementById('mBack').onclick = function (e) { if (e.target.id === 'mBack') closeModal(); };
  function fail(what) { return function (e) { toast('Could not ' + what + ': ' + ((e && e.message) || e)); }; }

  /* ================= one event ================= */

  /* The event's own choices, else the church's Safeguarding settings,
     else the built-in defaults (1 to 8, 1 to 4, 3 years, not required). */
  var SGDEF = {};
  function settingsOf() {
    var l = LEAD || {}, d = SGDEF || {};
    return { ratioAll: l.ratioAll || d.ratioAll || 8, ratioUnder8: l.ratioUnder8 || d.ratioUnder8 || 4,
             requireChecks: l.requireChecks !== undefined ? !!l.requireChecks : !!d.requireChecks,
             dbsYears: l.dbsYears || d.dbsYears || 3, trainingYears: l.trainingYears || d.trainingYears || 3 };
  }

  function counts() {
    var kids = 0, under8 = 0, unknown = 0;
    if (SIGNUPS) {
      C.people(EVID, SIGNUPS, [], {}).forEach(function (r) {
        kids++;
        var fi = FORMINFO.children[SG.norm(r.name)];
        var age = fi && fi.dob ? SG.ageOn(fi.dob, EV.startLocal) : null;
        if (age === null) unknown++; else if (age < 8) under8++;
      });
    }
    return { kids: kids, under8: under8, unknown: unknown };
  }

  function drawEvent() {
    var st = settingsOf(), c = counts(), leaders = (LEAD && LEAD.leaders) || [];
    var r = SG.ratio({ children: c.kids, under8: c.under8, leaders: leaders.length, ratioAll: st.ratioAll, ratioUnder8: st.ratioUnder8 });
    var canEdit = ADMIN || ISLEAD, canChecks = MASTER || ISLEAD, canInc = MASTER || ISLEAD || LEADER, canShare = MASTER || ISLEAD;
    var html = '<h1>' + esc(EV.title) + '</h1><p class="sub">' + esc(E.fmtWhen(EV)) + ' · ' + esc(siteName(SITE)) + '</p>' +
      '<div class="bar">' +
        ((ADMIN || LEADER) ? '<a class="btn sec" href="checkin.html?event=' + encodeURIComponent(EVID) + '">' + ico('scan-line') + 'Check-in</a>' : '') +
        '<button class="btn sec" id="concernBtn">' + ico('message-square-warning') + 'Report a concern</button>' +
        '<a class="btn ghost" href="safeguarding.html">' + ico('shield-check') + 'Safeguarding</a>' +
      '</div>';

    /* --- leaders and ratios --- */
    html += '<div class="card"><h2><span class="badge">' + ico('users', 17) + '</span>Leaders<span class="spacer"></span>' +
      (canEdit ? '<button class="btn sec sm" id="addLeader">' + ico('user-plus') + 'Add</button><button class="btn sec sm" id="fromRota">' + ico('calendar-check') + 'From the rota</button>' : '') + '</h2>' +
      (SIGNUPS ? '<div class="tiles">' +
        tile(c.kids, 'Children booked') + tile(c.under8 + (c.unknown ? ' <span class="hint">+' + c.unknown + '?</span>' : ''), 'Under 8') +
        tile(leaders.length, 'Leaders') + tile(r.need, 'Leaders needed') + '</div>' +
        (r.ok ? '<div class="banner ok" id="ratioMsg">' + ico('check') + ' Enough leaders for 1 to ' + st.ratioAll + ' (1 to ' + st.ratioUnder8 + ' for under-8s).</div>'
              : '<div class="banner warn" id="ratioMsg">' + ico('triangle-alert') + ' ' + r.short + ' more leader' + (r.short === 1 ? '' : 's') + ' needed for 1 to ' + st.ratioAll +
                (r.needUnder8 > r.needAll ? ', because of the under-8s (1 to ' + st.ratioUnder8 + ')' : '') + '.</div>') +
        (c.unknown ? '<p class="hint" style="margin-top:-4px">' + c.unknown + ' child' + (c.unknown === 1 ? '\'s' : 'ren\'s') + ' age is not known yet: their consent form has not come in. They are counted, but not as under 8.</p>' : '')
        : '<p class="hint">Numbers booked are shown to admins, the event\'s leaders and the safeguarding lead.</p>') +
      (leaders.length ? leaders.map(function (l, i) {
        var s = SG.checkStatus(CHECKS[l.memberId], st, EV.startLocal);
        var chip = function (what, v) { return '<span class="flag ' + (v === 'ok' ? 'ok' : v === 'applied' ? 'wait' : 'warn') + '">' + what + ': ' + (v === 'ok' ? 'in date' : v) + '</span>'; };
        return '<div class="row"><span class="ib">' + ico('badge-check', 16) + '</span><span class="who"><span class="n">' + esc(l.name) + '</span>' +
          (l.uid ? '' : ' <span class="flag off">has not signed in yet</span>') + '<br>' +
          ((CHECKS[l.memberId] !== undefined || canChecks) ? chip('DBS', s.dbs) + chip('Training', s.training) : '<span class="m">Checks are seen by admins and the safeguarding lead.</span>') + '</span>' +
          (canChecks && l.memberId ? '<button class="btn ghost sm recCheck" data-i="' + i + '">' + ico('clipboard-check') + 'Checks</button>' : '') +
          (canEdit ? '<button class="btn ghost sm dropLeader" data-i="' + i + '" title="Remove">' + ico('x') + '</button>' : '') + '</div>';
      }).join('') : '<p class="hint">No leaders named yet.</p>') +
      (st.requireChecks && leaders.some(function (l) { return !SG.checkStatus(CHECKS[l.memberId], st, EV.startLocal).ok; })
        ? '<div class="banner warn" id="checksMsg" style="margin-top:10px">' + ico('triangle-alert') + ' This event needs every leader to have an in-date DBS check and training, and not all do.</div>' : '') +
      (canEdit ? '<div class="two" style="margin-top:14px">' +
        '<div class="field"><label for="rAll">One leader for every … children</label><input class="inp" id="rAll" type="number" min="1" value="' + st.ratioAll + '"></div>' +
        '<div class="field"><label for="rU8">… and for every … under-8s</label><input class="inp" id="rU8" type="number" min="1" value="' + st.ratioUnder8 + '"></div>' +
        '<div class="field"><label for="yDbs">DBS counts for (years)</label><input class="inp" id="yDbs" type="number" min="1" value="' + st.dbsYears + '"></div>' +
        '<div class="field"><label for="yTr">Training counts for (years)</label><input class="inp" id="yTr" type="number" min="1" value="' + st.trainingYears + '"></div>' +
        '</div><label class="check"><input type="checkbox" id="reqChecks"' + (st.requireChecks ? ' checked' : '') + '>Every leader must have an in-date DBS check and training</label>' +
        '<button class="btn sm" id="saveSettings">' + ico('check') + 'Save</button>' : '') +
      '</div>';

    /* --- medical details for families who said "still correct" --- */
    if (canShare && UNSHARED.length) {
      html += '<div class="card"><h2><span class="badge">' + ico('lock', 17) + '</span>Medical details to share with the leaders</h2>' +
        '<p style="margin-top:0">' + UNSHARED.length + ' famil' + (UNSHARED.length === 1 ? 'y' : 'ies') + ' told us their consent form is still correct. ' +
        'Their medical details were given for an earlier event, so this event\'s leaders cannot see them until you share them.</p>' +
        '<button class="btn" id="shareMed">' + ico('share-2') + 'Share with this event\'s leaders</button></div>';
    }

    /* --- incidents --- */
    if (canInc) {
      html += '<div class="card"><h2><span class="badge">' + ico('notebook-pen', 17) + '</span>Incidents and accidents<span class="spacer"></span>' +
        '<button class="btn sec sm" id="addInc">' + ico('plus') + 'Record one</button>' +
        ((MASTER || ISLEAD) && INCIDENTS.length ? '<button class="btn ghost sm" id="incCsv">' + ico('file-down') + 'Download</button>' : '') + '</h2>' +
        '<p class="hint" style="margin-top:-4px">Seen only by this event\'s leaders and the safeguarding lead.</p>' +
        (INCIDENTS.length ? INCIDENTS.map(function (x) {
          return '<div class="entry"><div class="t">' + esc(when(x.happenedAt)) + ' · ' + esc(x.people || '') + ' · recorded by ' + esc(x.reportedByName || '') + '</div>' +
            '<div class="b">' + esc(x.what) + '</div>' +
            '<div style="margin-top:6px">' +
              '<span class="flag ' + (x.firstAid ? 'wait' : 'off') + '">' + (x.firstAid ? 'First aid by ' + esc(x.firstAidBy || '') : 'No first aid') + '</span>' +
              '<span class="flag ' + (x.parentInformed ? 'ok' : 'warn') + '">' + (x.parentInformed ? 'Parent told by ' + esc(x.informedBy || '') + (x.informedAt ? ', ' + esc(when(x.informedAt)) : '') : 'Parent not told yet') + '</span>' +
            '</div>' +
            (x.followUp ? '<div class="t" style="margin-top:8px">Follow-up: <span class="b">' + esc(x.followUp) + '</span></div>' : '') +
            ((MASTER || ISLEAD) ? '<button class="btn ghost sm followUp" data-id="' + esc(x.id) + '">' + ico('pencil') + 'Follow-up</button>' : '') +
          '</div>';
        }).join('') : '<p class="hint">Nothing recorded.</p>') + '</div>';
    }

    document.getElementById('wrap').innerHTML = html;
    wireEvent();
    icons();
  }

  function tile(v, k) { return '<div class="tile"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }

  function saveLeaders(leaders, extra) {
    var st = settingsOf();
    var d = Object.assign({
      leaders: leaders, leaderUids: leaders.map(function (l) { return l.uid; }).filter(Boolean), siteId: SITE,
      ratioAll: st.ratioAll, ratioUnder8: st.ratioUnder8, requireChecks: st.requireChecks,
      dbsYears: st.dbsYears, trainingYears: st.trainingYears, updatedAt: now(), updatedBy: ME.uid
    }, extra || {});
    return db().collection('eventLeaders').doc(EVID).set(d).then(function () { LEAD = d; return loadChecks(); }).then(drawEvent);
  }

  function wireEvent() {
    var on = function (id, fn) { var b = document.getElementById(id); if (b) b.onclick = fn; };
    on('concernBtn', function () { concernModal(SITE, EVID); });
    on('addLeader', leaderPicker);
    on('fromRota', fromRota);
    on('shareMed', function () {
      this.disabled = true;
      SG.shareWithLeaders(EVID, SITE, UNSHARED).then(function (n) {
        toast('Shared ' + n + ' with this event\'s leaders.');
        UNSHARED = []; drawEvent();
      }).catch(fail('share them'));
    });
    on('saveSettings', function () {
      var leaders = (LEAD && LEAD.leaders) || [];
      saveLeaders(leaders, {
        ratioAll: parseInt(document.getElementById('rAll').value, 10) || 8,
        ratioUnder8: parseInt(document.getElementById('rU8').value, 10) || 4,
        dbsYears: parseInt(document.getElementById('yDbs').value, 10) || 3,
        trainingYears: parseInt(document.getElementById('yTr').value, 10) || 3,
        requireChecks: document.getElementById('reqChecks').checked
      }).then(function () { toast('Saved.'); }).catch(fail('save'));
    });
    document.querySelectorAll('.dropLeader').forEach(function (b) {
      b.onclick = function () {
        var leaders = ((LEAD && LEAD.leaders) || []).slice();
        leaders.splice(+b.getAttribute('data-i'), 1);
        saveLeaders(leaders).catch(fail('save'));
      };
    });
    document.querySelectorAll('.recCheck').forEach(function (b) { b.onclick = function () { checksModal(LEAD.leaders[+b.getAttribute('data-i')]); }; });
    on('addInc', incidentModal);
    on('incCsv', incidentCsv);
    document.querySelectorAll('.followUp').forEach(function (b) {
      b.onclick = function () {
        var x = INCIDENTS.filter(function (i) { return i.id === b.getAttribute('data-id'); })[0];
        modal('<h3>' + ico('pencil', 18) + 'Follow-up</h3><div class="field"><label for="fu">What was done afterwards</label><textarea id="fu" maxlength="4000">' + esc(x.followUp || '') + '</textarea></div>' +
          '<div class="foot"><button class="btn sec" data-close>Cancel</button><button class="btn" id="fuSave">Save</button></div>');
        document.getElementById('fuSave').onclick = function () {
          db().collection('incidents').doc(x.id).update({ followUp: document.getElementById('fu').value.trim() })
            .then(function () { closeModal(); return loadIncidents(); }).then(drawEvent).catch(fail('save'));
        };
      };
    });
  }

  /* --- choosing leaders: from everyone who has signed in, or the rota --- */

  function addLeaders(people) {
    var leaders = ((LEAD && LEAD.leaders) || []).slice();
    people.forEach(function (p) {
      if (!leaders.some(function (l) { return (p.uid && l.uid === p.uid) || (p.memberId && l.memberId === p.memberId); })) leaders.push(p);
    });
    return saveLeaders(leaders);
  }

  function leaderPicker() {
    modal('<h3>' + ico('user-plus', 18) + 'Add a leader</h3><div class="field"><label for="lq">Find by name</label><input class="inp" id="lq" autocomplete="off"></div>' +
      '<div id="lres" style="max-height:320px;overflow:auto"></div><div class="foot"><button class="btn sec" data-close>Close</button></div>');
    var q = document.getElementById('lq');
    var draw = function () {
      var t = q.value.trim().toLowerCase();
      document.getElementById('lres').innerHTML = USERS.filter(function (u) { return !t || (u.name || '').toLowerCase().indexOf(t) >= 0; }).slice(0, 30).map(function (u) {
        return '<div class="row"><span class="who"><span class="n">' + esc(u.name || u.email) + '</span><br><span class="m">' + esc(u.email || '') + '</span></span>' +
          '<button class="btn sm pick" data-uid="' + esc(u.uid) + '">Add</button></div>';
      }).join('') || '<p class="hint">Nobody by that name has signed in yet.</p>';
      document.querySelectorAll('.pick').forEach(function (b) {
        b.onclick = function () {
          var u = USERS.filter(function (x) { return x.uid === b.getAttribute('data-uid'); })[0];
          closeModal();
          addLeaders([{ uid: u.uid, memberId: u.memberId || '', name: u.name || u.email }]).then(function () { toast(u.name + ' added.'); }).catch(fail('add them'));
        };
      });
    };
    q.oninput = draw; draw(); q.focus();
  }

  /* The rota keeps, for each date, every role and who is in it (member id
     and name). The people serving on this event's date are offered; a
     person who has never signed in can be named, but cannot use the
     leader's pages until they do. */
  function fromRota() {
    var day = String(EV.startLocal || '').slice(0, 10);
    db().collection('events').where('date', '==', day).get().then(function (snap) {
      var people = [];
      snap.docs.forEach(function (d) {
        var a = d.data().assignments || {};
        Object.keys(a).forEach(function (role) {
          (Array.isArray(a[role]) ? a[role] : [a[role]]).forEach(function (p) {
            if (p && p.name && !people.some(function (x) { return x.name === p.name; })) people.push({ memberId: p.id || '', name: p.name, role: role });
          });
        });
      });
      modal('<h3>' + ico('calendar-check', 18) + 'On the rota on ' + esc(E.fmtDate(day + 'T12:00')) + '</h3>' +
        (people.length ? people.map(function (p, i) {
          var u = USERS.filter(function (x) { return p.memberId && x.memberId === p.memberId; })[0];
          return '<label class="check"><input type="checkbox" class="rp" data-i="' + i + '">' + esc(p.name) + ' <span class="hint">· ' + esc(p.role) +
            (u ? '' : ' · has not signed in yet') + '</span></label>';
        }).join('') : '<p class="hint">Nobody is on the rota for that date.</p>') +
        '<div class="foot"><button class="btn sec" data-close>Cancel</button>' + (people.length ? '<button class="btn" id="rpAdd">Add the ticked people</button>' : '') + '</div>');
      var b = document.getElementById('rpAdd');
      if (b) b.onclick = function () {
        var picked = [].slice.call(document.querySelectorAll('.rp:checked')).map(function (c) {
          var p = people[+c.getAttribute('data-i')];
          var u = USERS.filter(function (x) { return p.memberId && x.memberId === p.memberId; })[0];
          return { uid: u ? u.uid : '', memberId: p.memberId, name: p.name };
        });
        closeModal();
        addLeaders(picked).then(function () { toast('Added ' + picked.length + '.'); }).catch(fail('add them'));
      };
    }).catch(fail('read the rota'));
  }

  /* --- leader checks: status and dates only --- */

  function checksModal(l) {
    var c = CHECKS[l.memberId] || {};
    modal('<h3>' + ico('clipboard-check', 18) + esc(l.name) + ': checks</h3>' +
      '<p class="hint" style="margin-top:0">Record the status and the dates only. Never the DBS certificate number, and never a copy of it.</p>' +
      '<div class="field"><label for="cDbs">DBS check</label><select id="cDbs">' +
        [['current', 'Seen and current'], ['applied', 'Applied for'], ['none', 'None yet']].map(function (o) {
          return '<option value="' + o[0] + '"' + (c.dbsStatus === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
      '<div class="two"><div class="field"><label for="cSeen">Date the DBS check was seen</label><input class="inp" id="cSeen" type="date" value="' + esc(c.dbsSeen || '') + '"></div>' +
      '<div class="field"><label for="cTr">Date of safeguarding training</label><input class="inp" id="cTr" type="date" value="' + esc(c.trainingDate || '') + '"></div></div>' +
      '<div class="foot"><button class="btn sec" data-close>Cancel</button><button class="btn" id="cSave">Save</button></div>');
    document.getElementById('cSave').onclick = function () {
      db().collection('leaderChecks').doc(l.memberId).set({
        name: l.name, dbsStatus: document.getElementById('cDbs').value, dbsSeen: document.getElementById('cSeen').value,
        trainingDate: document.getElementById('cTr').value, siteId: SITE, updatedAt: now(), updatedBy: ME.uid
      }).then(function () { closeModal(); toast('Saved.'); return loadChecks(); }).then(drawEvent).catch(fail('save the checks'));
    };
  }

  /* --- incidents --- */

  function incidentModal() {
    modal('<h3>' + ico('notebook-pen', 18) + 'Record an incident or accident</h3>' +
      '<div class="field"><label for="iWhen">When</label><input class="inp" id="iWhen" type="datetime-local" value="' + nowLocal() + '"></div>' +
      '<div class="field"><label for="iWho">Who was involved</label><input class="inp" id="iWho" maxlength="300"></div>' +
      '<div class="field"><label for="iWhat">What happened</label><textarea id="iWhat" maxlength="4000"></textarea></div>' +
      '<div class="two"><div class="field"><label for="iFa">First aid given?</label><select id="iFa"><option value="no">No</option><option value="yes">Yes</option></select></div>' +
      '<div class="field"><label for="iFaBy">By whom</label><input class="inp" id="iFaBy" maxlength="120"></div></div>' +
      '<div class="two"><div class="field"><label for="iTold">Parent or carer told?</label><select id="iTold"><option value="no">Not yet</option><option value="yes">Yes</option></select></div>' +
      '<div class="field"><label for="iToldBy">Told by</label><input class="inp" id="iToldBy" maxlength="120"></div>' +
      '<div class="field"><label for="iToldAt">When</label><input class="inp" id="iToldAt" type="datetime-local"></div></div>' +
      '<div class="foot"><button class="btn sec" data-close>Cancel</button><button class="btn" id="iSave">Save</button></div>');
    document.getElementById('iSave').onclick = function () {
      var what = document.getElementById('iWhat').value.trim();
      if (!what) { toast('Say what happened.'); return; }
      db().collection('incidents').doc('inc_' + E.key(20)).set({
        calEventId: EVID, siteId: SITE, happenedAt: document.getElementById('iWhen').value,
        people: document.getElementById('iWho').value.trim(), what: what,
        firstAid: document.getElementById('iFa').value === 'yes', firstAidBy: document.getElementById('iFaBy').value.trim(),
        parentInformed: document.getElementById('iTold').value === 'yes', informedBy: document.getElementById('iToldBy').value.trim(),
        informedAt: document.getElementById('iToldAt').value, followUp: '',
        reportedBy: ME.uid, reportedByName: ME.name, createdAt: now()
      }).then(function () { closeModal(); toast('Recorded.'); return loadIncidents(); }).then(drawEvent).catch(fail('record it'));
    };
  }

  /* Only the lead downloads the log, and the download is logged first. */
  function incidentCsv() {
    var head = ['When', 'Who was involved', 'What happened', 'First aid', 'First aid by', 'Parent told', 'Told by', 'Told when', 'Follow-up', 'Recorded by', 'Recorded at'];
    var rows = INCIDENTS.map(function (x) {
      return [x.happenedAt, x.people, x.what, x.firstAid ? 'Yes' : 'No', x.firstAidBy, x.parentInformed ? 'Yes' : 'No', x.informedBy, x.informedAt, x.followUp, x.reportedByName, x.createdAt];
    });
    C.logDownload({ calEventId: EVID, what: 'incident log', format: 'csv', columns: head, sensitive: true }).then(function () {
      C.saveFile((EV.title || 'event').replace(/[^a-z0-9 \-]/gi, '') + ' incidents.csv', new Blob(['﻿' + C.csvText(head, rows)], { type: 'text/csv;charset=utf-8' }));
    }).catch(function (e) { toast('The download could not be recorded, so it was not made: ' + (e.message || e)); });
  }

  /* ================= report a concern ================= */

  function concernModal(siteId, evId) {
    modal('<h3>' + ico('message-square-warning', 18) + 'Report a concern</h3>' +
      '<p style="margin-top:0">This goes straight to the safeguarding lead and nobody else. Not even you will be able to read it back, so say everything you need to now.</p>' +
      '<div class="banner info">If a child or adult is in danger right now, call 999.</div>' +
      (siteId ? '' : '<div class="field"><label for="cSite">Where</label><select id="cSite">' +
        SITES.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>'; }).join('') + '</select></div>') +
      '<div class="field"><label for="cAbout">Who it is about (if you know)</label><input class="inp" id="cAbout" maxlength="300"></div>' +
      '<div class="field"><label for="cText">What you saw, heard or were told, in the words used, and when</label><textarea id="cText" maxlength="6000" style="min-height:140px"></textarea></div>' +
      '<div class="foot"><button class="btn sec" data-close>Cancel</button><button class="btn" id="cSend">' + ico('send') + 'Send to the safeguarding lead</button></div>');
    document.getElementById('cSend').onclick = function () {
      var sid = siteId || document.getElementById('cSite').value;
      var text = document.getElementById('cText').value.trim();
      if (!text) { toast('Write down what the concern is.'); return; }
      var btn = this; btn.disabled = true;
      db().collection('bookingSettings').doc(sid).get().then(function (s) {
        var lead = s.exists ? s.data().safeguardingLead : '';
        if (!lead) throw new Error('No safeguarding lead is set for ' + siteName(sid) + '. Please speak to the church office or a minister today.');
        return db().collection('concerns').doc('con_' + E.key(24)).set({
          siteId: sid, calEventId: evId || '', about: document.getElementById('cAbout').value.trim(), concern: text,
          reportedBy: ME.uid, reportedByName: ME.name, createdAt: now(), status: 'new'
        }).then(function () { return db().collection('addressBook').doc(lead).get(); }).then(function (m) {
          var email = m.exists ? (m.data().email || '') : '';
          /* The email says only that there is something to read. What was
             reported stays in the one place the rules protect. */
          if (email) return EGBCChurch.send({ to: [email], subject: 'A safeguarding concern has been reported',
            html: EGBCChurch.wrap('A safeguarding concern has been reported',
              '<p>Someone has reported a safeguarding concern for ' + esc(siteName(sid)) + '. For privacy, this email does not say what it is.</p>' +
              '<p><a href="' + location.origin + location.pathname.replace(/[^/]*$/, '') + 'safeguarding.html">Open Safeguarding to read it</a>.</p>') });
        });
      }).then(function () {
        closeModal();
        toast('Sent to the safeguarding lead. Thank you.');
      }).catch(function (e) { btn.disabled = false; toast(e.message || String(e)); });
    };
  }

  /* ================= the page without an event ================= */

  function drawHome(concerns, events) {
    var html = '<h1>Safeguarding</h1><p class="sub">Leaders, ratios, checks, incidents and concerns.</p>' +
      '<div class="bar"><button class="btn" id="concernBtn">' + ico('message-square-warning') + 'Report a concern</button>' +
      (MASTER ? '<a class="btn sec" href="retention.html">' + ico('archive') + 'Due for deletion</a>' : '') +
      ((ADMIN || LEADSITES.length) ? '<a class="btn sec" href="safeguarding-settings.html">' + ico('settings') + 'Safeguarding settings</a>' : '') + '</div>';
    if (LEADSITES.length) {
      html += '<div class="card"><h2><span class="badge">' + ico('inbox', 17) + '</span>Concerns reported to you</h2>' +
        '<p class="hint" style="margin-top:-4px">You are safeguarding lead or deputy for ' + esc(LEADSITES.map(siteName).join(', ')) + '. Nobody else can read these.</p>' +
        (concerns.length ? concerns.map(function (x) {
          return '<div class="entry"><div class="t">' + esc(when(x.createdAt)) + ' · from ' + esc(x.reportedByName || '') + ' · ' + esc(siteName(x.siteId)) +
            ' <span class="flag ' + (x.status === 'new' ? 'warn' : 'ok') + '">' + (x.status === 'new' ? 'New' : 'Seen') + '</span></div>' +
            (x.about ? '<div class="t">About: ' + esc(x.about) + '</div>' : '') + '<div class="b">' + esc(x.concern) + '</div>' +
            (x.leadNotes ? '<div class="t" style="margin-top:8px">Your notes: <span class="b">' + esc(x.leadNotes) + '</span></div>' : '') +
            '<button class="btn ghost sm cNote" data-id="' + esc(x.id) + '">' + ico('pencil') + (x.status === 'new' ? 'Mark seen and add notes' : 'Notes') + '</button></div>';
        }).join('') : '<p class="hint">Nothing reported.</p>') + '</div>';
    }
    html += '<div class="card"><h2><span class="badge">' + ico('calendar-days', 17) + '</span>Coming up</h2>' +
      (events.length ? events.map(function (e) {
        return '<div class="row"><span class="ib">' + ico('calendar', 16) + '</span><span class="who"><span class="n">' + esc(e.title) + '</span><br><span class="m">' +
          esc(E.fmtWhen(e)) + ' · ' + (e._leaders ? e._leaders + ' leader' + (e._leaders === 1 ? '' : 's') : 'no leaders named') + '</span></span>' +
          '<a class="btn sec sm" href="safeguarding.html?event=' + encodeURIComponent(e.id) + '">Open</a></div>';
      }).join('') : '<p class="hint">No events for you here.</p>') + '</div>';
    document.getElementById('wrap').innerHTML = html;
    document.getElementById('concernBtn').onclick = function () { concernModal('', ''); };
    document.querySelectorAll('.cNote').forEach(function (b) {
      b.onclick = function () {
        var x = concerns.filter(function (c) { return c.id === b.getAttribute('data-id'); })[0];
        modal('<h3>' + ico('pencil', 18) + 'Notes</h3><div class="field"><label for="cn">What you have done</label><textarea id="cn" maxlength="4000">' + esc(x.leadNotes || '') + '</textarea></div>' +
          '<div class="foot"><button class="btn sec" data-close>Cancel</button><button class="btn" id="cnSave">Save</button></div>');
        document.getElementById('cnSave').onclick = function () {
          db().collection('concerns').doc(x.id).update({ status: 'seen', seenAt: x.seenAt || now(), leadNotes: document.getElementById('cn').value.trim() })
            .then(function () { closeModal(); toast('Saved.'); home(); }).catch(fail('save'));
        };
      };
    });
    icons();
  }

  function home() {
    var concerns = Promise.all(LEADSITES.map(function (s) {
      return db().collection('concerns').where('siteId', '==', s).get().then(function (snap) {
        return snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      }).catch(function () { return []; });
    })).then(function (l) { return [].concat.apply([], l).sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); }); });
    var events = E.listUpcoming({ limit: 60 }).then(function (list) {
      list = list.filter(function (e) { return e.status !== 'cancelled' && e.startUtc < Date.now() + 31 * 864e5; });
      return Promise.all(list.map(function (e) { return SG.leadersOf(e.id); })).then(function (ls) {
        return list.map(function (e, i) { e._leaders = ls[i] ? (ls[i].leaders || []).length : 0; e._mine = ls[i] && (ls[i].leaderUids || []).indexOf(ME.uid) >= 0; return e; })
          .filter(function (e) { return ADMIN || e._mine || LEADSITES.indexOf((e.location || {}).siteId) >= 0; });
      });
    });
    return Promise.all([concerns, events]).then(function (r) { drawHome(r[0], r[1]); });
  }

  /* ================= loading ================= */

  function loadChecks() {
    var leaders = (LEAD && LEAD.leaders) || [];
    return Promise.all(leaders.map(function (l) {
      if (!l.memberId) return null;
      return db().collection('leaderChecks').doc(l.memberId).get().then(function (s) { CHECKS[l.memberId] = s.exists ? s.data() : null; })
        .catch(function () { delete CHECKS[l.memberId]; });
    }));
  }

  function loadIncidents() {
    var q = (MASTER || ISLEAD) ? db().collection('incidents').where('siteId', '==', SITE) : db().collection('incidents').where('calEventId', '==', EVID);
    return q.get().then(function (s) {
      INCIDENTS = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
        .filter(function (x) { return x.calEventId === EVID; })
        .sort(function (a, b) { return String(b.happenedAt).localeCompare(String(a.happenedAt)); });
    }).catch(function () { INCIDENTS = []; });
  }

  EGBCAuth.require().then(function (profile) {
    ME = SG.me();
    ADMIN = !!EGBCAuth.isAdmin(); MASTER = !!(EGBCAuth.isMaster && EGBCAuth.isMaster());
    return Promise.all([SG.myLeadSites(), db().collection('sites').get(),
      db().collection('safeguardingSettings').doc('defaults').get().catch(function () { return null; })]);
  }).then(function (r) {
    LEADSITES = r[0];
    SGDEF = r[2] && r[2].exists ? r[2].data() : {};
    SITES = r[1].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (s) { return s.active !== false; });
    if (!EVID) return home();
    return E.load(EVID).then(function (x) {
      if (!x) throw new Error('That event could not be found.');
      EV = x.ev; SITE = (EV.location || {}).siteId || '';
      ISLEAD = LEADSITES.indexOf(SITE) >= 0;
      return SG.leadersOf(EVID);
    }).then(function (l) {
      LEAD = l; LEADER = !!(l && (l.leaderUids || []).indexOf(ME.uid) >= 0);
      if (!ADMIN && !ISLEAD && !LEADER) {
        document.getElementById('wrap').innerHTML = '<div class="card"><h1>' + esc(EV.title) + '</h1>' +
          '<p>This page is for the event\'s leaders, admins and the safeguarding lead. You can still report a concern.</p>' +
          '<button class="btn" id="concernBtn">' + ico('message-square-warning') + 'Report a concern</button></div>';
        document.getElementById('concernBtn').onclick = function () { concernModal(SITE, EVID); };
        icons();
        return;
      }
      return Promise.all([
        (ADMIN || LEADER || ISLEAD) ? db().collection('signups').where('calEventId', '==', EVID).get()
          .then(function (s) { SIGNUPS = s.docs.map(function (d) { return Object.assign({ key: d.id }, d.data()); }); }).catch(function () { SIGNUPS = null; }) : null,
        SG.formsForEvent(EVID, [SITE].concat(LEADSITES)).then(function (fi) { FORMINFO = fi; return fi; }).catch(function () { return null; }),
        (ADMIN || ISLEAD) ? db().collection('users').get().then(function (s) {
          USERS = s.docs.map(function (d) { return Object.assign({ uid: d.id }, d.data()); }).filter(function (u) { return u.status === 'active'; })
            .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
        }).catch(function () { USERS = []; }) : null,
        loadChecks(),
        (MASTER || ISLEAD || LEADER) ? loadIncidents() : null
      ]).then(function (r) {
        if ((MASTER || ISLEAD) && r[1]) return SG.unshared(EVID, SITE, FORMINFO.responses).then(function (u) { UNSHARED = u; }).catch(function () { UNSHARED = []; });
      }).then(drawEvent);
    });
  }).catch(function (e) {
    document.getElementById('wrap').innerHTML = '<div class="card"><div class="banner warn">' + esc(e.message || e) + '</div></div>';
  });
})();
</script>
</body>
</html>
