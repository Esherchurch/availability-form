<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safeguarding settings</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610191900202610191600" data-title="Safeguarding settings"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610191600"></script>
<script src="egbc-church.js?v=202610191600"></script>
<script src="egbc-guard.js?v=202610160810"></script>
<script src="egbc-ics.js?v=202610091200"></script>
<script src="egbc-events.js?v=202610161700"></script>
<script src="egbc-events-checkin.js?v=202610152300"></script>
<script src="egbc-events-forms.js?v=202610081500"></script>
<script src="egbc-events-safeguarding.js?v=202610161700"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 12px;padding-bottom:12px;
           border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{width:32px;height:32px;border-radius:8px;background:var(--tint);color:var(--brand);
         display:inline-flex;align-items:center;justify-content:center;flex:none}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;
       font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  .inp:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .field{margin-bottom:12px}
  .two{display:flex;gap:12px;flex-wrap:wrap}
  .two>.field{flex:1;min-width:150px}
  .tpl{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  .tpl:first-of-type{border-top:none;padding-top:0}
  .tpl h3{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 8px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--body);margin:4px 0 12px;font-weight:400}
  .check input{width:16px;height:16px;accent-color:var(--brand);flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
       border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent;
       background:var(--brand);color:#fff;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.sec:hover{background:#f3f4f6}
  .hint{font-size:13px;color:var(--muted)}
  .banner{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:12px}
  .banner.info{background:var(--tint);color:var(--body);border:1px solid #cfe0de}
  .banner.gold{background:var(--gold-bg);color:var(--gold)}
  .banner.warn{background:var(--danger-bg);color:var(--danger)}
  .apply{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
  .apply:first-of-type{border-top:none}
  .apply .t{flex:1;min-width:200px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;
         padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card hint">Loading…</div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, F = window.EGBCForms, SG = window.EGBCSafeguarding, esc = E.esc;
  var ADMIN = false, LEADSITES = [], SAVED = null, DIRTY = false, FORMS_TO = [], EVENTS_TO = [];
  /* WHO LOOKS AFTER SAFEGUARDING (Martin, 14 Oct 2026: he pressed the hub's
     "Set one" and found no way to set a name). Each building's lead and
     deputy are bookingSettings/<site>.safeguardingLead/Deputy - the same
     fields Places shows - and leadSiteId says which building's lead the
     forms reach first. Adults only: anyone marked UNDER 16 in the address
     book is not offered (the address book holds no other age). */
  var SITES = [], BS = {}, PEOPLE = [];
  /* THE FIRE ROLL-CALL (F-214): who may open it, set by a master admin. */
  var FIRE = { people: [] };
  function adultOpts(sel, id) {
    return '<select id="' + id + '"><option value="">Nobody set</option>' + PEOPLE.map(function (p) {
      return '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') +
      (sel && !PEOPLE.some(function (p) { return p.id === sel; }) ? '<option value="' + esc(sel) + '" selected>(someone not offered here)</option>' : '') + '</select>';
  }
  function leadSiteNow() {
    var named = SITES.filter(function (x) { return (BS[x.id] || {}).safeguardingLead; })[0];
    return (SAVED && SAVED.leadSiteId) || (named || SITES[0] || {}).id || '';
  }
  function whoCard() {
    var head = '<div class="card" id="who"><h2><span class="badge">' + ico('shield-check', 17) + '</span>Who looks after safeguarding</h2>';
    if (!SITES.length) return head + '<p class="hint">Add your building in Places first.</p></div>';
    if (!ADMIN) {
      return head + '<p>' + (SAVED && SAVED.leadName ? 'The safeguarding lead is <b>' + esc(SAVED.leadName) + '</b>.' : 'No safeguarding lead is named yet.') +
        '</p><p class="hint">An admin changes who it is.</p></div>';
    }
    var first = leadSiteNow();
    return head + '<p class="hint" style="margin-top:0">Concerns, requests for care and prayer requests go to the lead and the deputy. Until a lead is named, those forms cannot be sent. Only adults are offered.</p>' +
      SITES.map(function (x) {
        var b = BS[x.id] || {};
        return '<div data-site="' + esc(x.id) + '" style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px">' +
          (SITES.length > 1 ? '<label class="check" style="margin:0 0 6px"><input type="radio" name="leadSite" value="' + esc(x.id) + '"' + (x.id === first ? ' checked' : '') + '><b>' + esc(x.name || x.id) + '</b>: the lead the forms reach first</label>' : '<b>' + esc(x.name || x.id) + '</b>') +
          '<div class="two"><div class="field"><label for="lead_' + esc(x.id) + '">Safeguarding lead</label>' + adultOpts(b.safeguardingLead || '', 'lead_' + x.id) + '</div>' +
          '<div class="field"><label for="dep_' + esc(x.id) + '">Deputy</label>' + adultOpts(b.safeguardingDeputy || '', 'dep_' + x.id) + '</div></div></div>';
      }).join('') +
      '<div class="field" style="margin-top:10px"><label for="leadPhone">The lead\'s phone number (optional)</label><input class="inp" id="leadPhone" type="tel" maxlength="30" value="' + esc((SAVED && SAVED.leadPhone) || '') + '">' +
      '<p class="hint" style="margin:4px 0 0">Shown beside "call 999" on the "I\'m worried" form, so people can ring them if it cannot wait.</p></div></div>';
  }
  /* Who leads where, as the page shows it now. */
  /* ---- THE FIRE ROLL-CALL (F-214; Martin, 15 Oct) ----
     Named people (adults) who may open the fire roll-call: who is checked
     in at today's events and how many, names only. Each for every building
     or one. Master admins only change this; it saves on its own. */
  function fireCard() {
    if (!(EGBCAuth.isMaster && EGBCAuth.isMaster())) return '';
    var list = FIRE.people || [], have = list.map(function (p) { return p.memberId; });
    return '<div class="card" id="fireCard"><h2><span class="badge">' + ico('flame', 17) + '</span>Fire roll-call</h2>' +
      '<p class="hint" style="margin-top:-4px">The people who may open the fire roll-call for today\'s events: who is checked in, and how many. Names only: no answers, no medical details, no contact details. For example the fire wardens and the duty steward. Master admins always can.</p>' +
      '<div id="fireList">' + (list.length ? list.map(function (p) {
        return '<div class="apply" data-fire="' + esc(p.memberId) + '"><span class="t"><strong>' + esc(p.name) + '</strong></span>' +
          '<select class="fireRole" aria-label="Fire warden or duty steward: ' + esc(p.name) + '"><option value="warden">Fire warden</option><option value="steward"' + (p.role === 'steward' ? ' selected' : '') + '>Duty steward</option></select>' +
          '<select class="fireSite" aria-label="Which building for ' + esc(p.name) + '"><option value="">All buildings</option>' +
            SITES.map(function (x) { return '<option value="' + esc(x.id) + '"' + (p.siteId === x.id ? ' selected' : '') + '>' + esc(x.name || x.id) + '</option>'; }).join('') + '</select>' +
          '<button class="btn ghost" data-firedrop="' + esc(p.memberId) + '">Remove</button></div>';
      }).join('') : '<p class="hint" id="fireNone">Nobody named yet: only master admins can open it.</p>') + '</div>' +
      '<div class="row"><div class="f"><label for="fireAdd">Add someone</label><select id="fireAdd"><option value="">Choose someone\u2026</option>' +
        PEOPLE.filter(function (p) { return have.indexOf(p.id) < 0; }).map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="bar"><button class="btn" id="fireSave">' + ico('check') + 'Save the fire roll-call list</button><span class="hint" id="fireMsg" role="status"></span></div></div>';
  }
  function redrawFire(msg) {
    var c = document.getElementById('fireCard'); if (!c) return;
    c.outerHTML = fireCard(); wireFire(); icons();
    if (msg) document.getElementById('fireMsg').textContent = msg;
  }
  function wireFire() {
    var c = document.getElementById('fireCard'); if (!c) return;
    var add = document.getElementById('fireAdd');
    add.onchange = function () {
      var p = PEOPLE.filter(function (x) { return x.id === add.value; })[0]; if (!p) return;
      FIRE.people = (FIRE.people || []).concat([{ memberId: p.id, name: p.name, siteId: '' }]);
      redrawFire('Not saved yet.');
    };
    /* A duty steward sees people's evacuation plans only on a day they are
       on the rota; a fire warden on any day they are needed (F-234). */
    c.querySelectorAll('.fireRole').forEach(function (s) {
      s.onchange = function () {
        var id = s.closest('[data-fire]').getAttribute('data-fire');
        FIRE.people.forEach(function (p) { if (p.memberId === id) p.role = s.value; });
        document.getElementById('fireMsg').textContent = 'Not saved yet.';
      };
    });
    c.querySelectorAll('.fireSite').forEach(function (s) {
      s.onchange = function () {
        var id = s.closest('[data-fire]').getAttribute('data-fire');
        FIRE.people.forEach(function (p) { if (p.memberId === id) p.siteId = s.value; });
        document.getElementById('fireMsg').textContent = 'Not saved yet.';
      };
    });
    c.querySelectorAll('[data-firedrop]').forEach(function (b) {
      b.onclick = function () { var id = b.getAttribute('data-firedrop'); FIRE.people = FIRE.people.filter(function (p) { return p.memberId !== id; }); redrawFire('Not saved yet.'); };
    });
    document.getElementById('fireSave').onclick = function () {
      var btn = this, people = (FIRE.people || []).slice(0, 60), bySite = {};
      people.forEach(function (p) { if (p.siteId) (bySite[p.siteId] = bySite[p.siteId] || []).push(p.memberId); });
      btn.disabled = true;
      db().collection('fireRollCall').doc('main').set({
        people: people, memberIds: people.map(function (p) { return p.memberId; }),
        allSites: people.filter(function (p) { return !p.siteId; }).map(function (p) { return p.memberId; }), bySite: bySite,
        stewards: people.filter(function (p) { return p.role === 'steward'; }).map(function (p) { return p.memberId; }),
        updatedBy: EGBCAuth.user().uid, updatedByName: (EGBCAuth.profile() || {}).name || '', updatedAt: new Date().toISOString()
      }).then(function () { btn.disabled = false; redrawFire('Saved.'); }, function (e) { btn.disabled = false; document.getElementById('fireMsg').textContent = 'Not saved: ' + (e.message || e); });
    };
  }

  function readWho() {
    var out = { sites: {}, leadSiteId: leadSiteNow() };
    SITES.forEach(function (x) {
      var l = document.getElementById('lead_' + x.id), d = document.getElementById('dep_' + x.id);
      if (l) out.sites[x.id] = { safeguardingLead: l.value, safeguardingDeputy: d.value };
    });
    var r = document.querySelector('input[name="leadSite"]:checked'); if (r) out.leadSiteId = r.value;
    return out;
  }
  var KEEP = [[3, '3 months'], [6, '6 months'], [12, '1 year'], [24, '2 years'], [36, '3 years'], [72, '6 years']];

  function db() { return EGBCAuth.db; }
  function icons() { if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons(); }
  function ico(n, px) { return '<i data-lucide="' + n + '" style="width:' + (px || 15) + 'px;height:' + (px || 15) + 'px"></i>'; }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3400); }

  /* What applies when nobody has saved anything: the templates' own
     periods (a year, Martin 9 Oct 2026), 1 to 5 (Martin 9 Oct 2026) and 1 to 4
     for under-8s, 3 years (Martin, F-046), not required. */
  function builtIn() {
    var t = {};
    F.TEMPLATES.forEach(function (x) { t[x.id] = F.templateDefaults(x.id); });
    return { templates: t, ratioAll: 5, ratioUnder8: 4, dbsYears: 3, trainingYears: 3, requireChecks: false };
  }
  function current() {
    var b = builtIn(), s = SAVED || {};
    var t = {};
    Object.keys(b.templates).forEach(function (id) { t[id] = (s.templates && s.templates[id]) || b.templates[id]; });
    return { templates: t, ratioAll: s.ratioAll || b.ratioAll, ratioUnder8: s.ratioUnder8 || b.ratioUnder8,
             dbsYears: s.dbsYears || b.dbsYears, trainingYears: s.trainingYears || b.trainingYears,
             requireChecks: s.requireChecks !== undefined ? !!s.requireChecks : b.requireChecks };
  }

  function yearsSelect(id, v) {
    var o = '';
    for (var y = 1; y <= 10; y++) o += '<option value="' + y + '"' + (y === v ? ' selected' : '') + '>' + y + ' year' + (y === 1 ? '' : 's') + '</option>';
    return '<select id="' + id + '">' + o + '</select>';
  }
  function keepSelect(id, v) {
    var list = KEEP.slice();
    if (!list.some(function (k) { return k[0] === v; })) list.push([v, v + ' months']);
    return '<select id="' + id + '">' + list.map(function (k) { return '<option value="' + k[0] + '"' + (k[0] === v ? ' selected' : '') + '>' + k[1] + '</option>'; }).join('') + '</select>';
  }

  function draw() {
    var c = current();
    document.getElementById('wrap').innerHTML =
      '<h1>Safeguarding settings</h1>' +
      '<p class="sub">The periods and rules every new form and event starts with, in one place.</p>' +
      (SAVED && SAVED.updatedAt ? '<p class="hint" style="margin-top:-8px">Last changed ' + esc(E.fmtDate(SAVED.updatedAt)) + (SAVED.updatedByName ? ' by ' + esc(SAVED.updatedByName) : '') + '.</p>' : '') +

      whoCard() + fireCard() +
      '<div class="card"><h2><span class="badge">' + ico('file-text', 17) + '</span>Forms</h2>' +
        '<p class="hint" style="margin-top:-4px">For each kind of form: how long an answer counts, and how long it is kept after that before it is due for deletion.</p>' +
        F.TEMPLATES.map(function (t) {
          var d = c.templates[t.id], mode = (d.validity || {}).mode || 'event';
          return '<div class="tpl"><h3>' + esc(t.title) + '</h3><div class="two">' +
            '<div class="field"><label for="v_' + t.id + '">Answer lasts</label><select id="v_' + t.id + '" class="vmode" data-t="' + t.id + '">' +
              [['event', 'One event'], ['schoolyear', 'End of school year (31 Aug)'], ['days', 'A number of days'], ['months', 'A number of months']].map(function (o) {
                return '<option value="' + o[0] + '"' + (mode === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
            '<div class="field" id="dbox_' + t.id + '" style="max-width:140px;' + (mode === 'days' ? '' : 'display:none') + '"><label for="d_' + t.id + '">Days</label>' +
              '<input class="inp" id="d_' + t.id + '" type="number" min="1" max="3650" value="' + ((d.validity || {}).days || 365) + '"></div>' +
            '<div class="field" id="mbox_' + t.id + '" style="max-width:140px;' + (mode === 'months' ? '' : 'display:none') + '"><label for="m_' + t.id + '">Months</label>' +
              '<input class="inp" id="m_' + t.id + '" type="number" min="1" max="60" value="' + ((d.validity || {}).months || 12) + '"></div>' +
            '<div class="field"><label for="k_' + t.id + '">Kept after that</label>' + keepSelect('k_' + t.id, d.retentionMonths || 12) + '</div>' +
          '</div></div>';
        }).join('') + '</div>' +

      '<div class="card"><h2><span class="badge">' + ico('users', 17) + '</span>Leaders</h2>' +
        '<div class="two">' +
          '<div class="field"><label for="rAll">One leader for every … children</label><input class="inp" id="rAll" type="number" min="1" max="50" value="' + c.ratioAll + '"></div>' +
          '<div class="field"><label for="rU8">… and for every … under-8s</label><input class="inp" id="rU8" type="number" min="1" max="50" value="' + c.ratioUnder8 + '"></div>' +
        '</div><div class="two">' +
          '<div class="field"><label for="yDbs">A DBS check counts for</label>' + yearsSelect('yDbs', c.dbsYears) + '</div>' +
          '<div class="field"><label for="yTr">Safeguarding training counts for</label>' + yearsSelect('yTr', c.trainingYears) + '</div>' +
        '</div>' +
        '<label class="check"><input type="checkbox" id="req"' + (c.requireChecks ? ' checked' : '') + '>Every leader must have an in-date DBS check and training</label>' +
      '</div>' +

      '<div class="card"><button class="btn" id="save">' + ico('check', 16) + 'Save the settings</button>' +
        '<p class="hint" style="margin:10px 0 0">New forms and new events take these from now on.</p></div>' +

      '<div class="card" id="already"></div>';

    document.querySelectorAll('.vmode').forEach(function (s) {
      s.onchange = function () {
        document.getElementById('dbox_' + s.getAttribute('data-t')).style.display = s.value === 'days' ? '' : 'none';
        document.getElementById('mbox_' + s.getAttribute('data-t')).style.display = s.value === 'months' ? '' : 'none';
        markDirty();
      };
    });
    document.querySelectorAll('#wrap input, #wrap select').forEach(function (el) { if (el.closest('#fireCard')) return; el.addEventListener('change', markDirty); el.addEventListener('input', markDirty); });
    wireFire();
    document.getElementById('save').onclick = save;
    icons();
    drawAlready();
  }

  function markDirty() { if (!DIRTY) { DIRTY = true; drawAlready(); } }

  function read() {
    var t = {};
    F.TEMPLATES.forEach(function (x) {
      var mode = document.getElementById('v_' + x.id).value;
      t[x.id] = { validity: mode === 'days' ? { mode: 'days', days: Math.max(1, parseInt(document.getElementById('d_' + x.id).value, 10) || 365) }
                  : mode === 'months' ? { mode: 'months', months: Math.max(1, Math.min(60, parseInt(document.getElementById('m_' + x.id).value, 10) || 12)) } : { mode: mode },
                  retentionMonths: parseInt(document.getElementById('k_' + x.id).value, 10) || 12 };
    });
    return {
      templates: t,
      ratioAll: Math.min(50, Math.max(1, parseInt(document.getElementById('rAll').value, 10) || 5)),
      ratioUnder8: Math.min(50, Math.max(1, parseInt(document.getElementById('rU8').value, 10) || 4)),
      dbsYears: parseInt(document.getElementById('yDbs').value, 10) || 3,
      trainingYears: parseInt(document.getElementById('yTr').value, 10) || 3,
      requireChecks: document.getElementById('req').checked
    };
  }

  function save() {
    var d = read(), u = EGBCAuth.user() || {}, p = EGBCAuth.profile() || {};
    d.updatedAt = new Date().toISOString(); d.updatedBy = u.uid || ''; d.updatedByName = p.name || '';
    /* Who leads is kept, whoever saves: before, saving here dropped it. */
    d.leadSiteId = (SAVED && SAVED.leadSiteId) || ''; d.leadName = (SAVED && SAVED.leadName) || ''; d.leadPhone = (SAVED && SAVED.leadPhone) || '';
    if (!ADMIN) d.leadSiteId = LEADSITES[0];
    var who = ADMIN && SITES.length && document.getElementById('lead_' + SITES[0].id) ? readWho() : null, sites = [];
    if (who) {
      var bad = '';
      Object.keys(who.sites).forEach(function (sid) { var x = who.sites[sid]; if (x.safeguardingLead && x.safeguardingLead === x.safeguardingDeputy) bad = 'The lead and the deputy must be two different people.'; });
      if (bad) { toast(bad); return; }
      sites = Object.keys(who.sites).filter(function (sid) { var b = BS[sid] || {}, x = who.sites[sid]; return (b.safeguardingLead || '') !== x.safeguardingLead || (b.safeguardingDeputy || '') !== x.safeguardingDeputy; });
      var lead = (who.sites[who.leadSiteId] || {}).safeguardingLead || '';
      d.leadSiteId = who.leadSiteId;
      d.leadName = lead ? ((PEOPLE.filter(function (x) { return x.id === lead; })[0] || {}).name || d.leadName) : '';
      d.leadPhone = lead ? document.getElementById('leadPhone').value.trim().slice(0, 30) : '';
    }
    document.getElementById('save').disabled = true;
    Promise.all(sites.map(function (sid) { return db().collection('bookingSettings').doc(sid).set(who.sites[sid], { merge: true }); })).then(function () {
      sites.forEach(function (sid) { BS[sid] = Object.assign({}, BS[sid] || {}, who.sites[sid]); });
      return db().collection('safeguardingSettings').doc('defaults').set(d);
    }).then(function () {
      SAVED = d; DIRTY = false; toast('Saved.'); draw();
    }).catch(function (e) {
      document.getElementById('save').disabled = false;
      toast('Could not save: ' + (e.message || e));
    });
  }

  /* ---- the ones already made ----
     Forms made from a template whose periods differ from the saved ones,
     and events coming up whose leaders' settings differ. Only those this
     person may change are counted. Answers already given keep their dates. */

  function sameValidity(a, b) {
    a = a || {}; b = b || {};
    return (a.mode || 'event') === (b.mode || 'event') && (a.mode !== 'days' || (a.days || 365) === (b.days || 365))
           && (a.mode !== 'months' || (a.months || 12) === (b.months || 12));
  }

  function findAlready() {
    var c = current();
    var forms = (EGBCAuth.isMaster && EGBCAuth.isMaster()) ? db().collection('forms').get().then(function (s) { return s.docs; })
      : Promise.all(LEADSITES.map(function (sid) { return db().collection('forms').where('siteId', '==', sid).get().then(function (s) { return s.docs; }); }))
          .then(function (l) { return [].concat.apply([], l); });
    var events = E.listUpcoming({ limit: 200 }).catch(function () { return []; }).then(function (list) {
      return Promise.all(list.map(function (e) {
        return db().collection('eventLeaders').doc(e.id).get().then(function (s) { return s.exists ? { ev: e, ref: s.ref, d: s.data() } : null; }).catch(function () { return null; });
      }));
    });
    return Promise.all([forms, events]).then(function (r) {
      FORMS_TO = r[0].filter(function (doc) {
        var f = doc.data(), d = f.template && c.templates[f.template];
        return d && (!sameValidity(f.validity, d.validity) || (f.retentionMonths || 12) !== d.retentionMonths);
      });
      EVENTS_TO = r[1].filter(Boolean).filter(function (x) {
        if (!ADMIN && LEADSITES.indexOf(x.d.siteId) < 0) return false;
        return x.d.ratioAll !== c.ratioAll || x.d.ratioUnder8 !== c.ratioUnder8 || x.d.dbsYears !== c.dbsYears ||
               x.d.trainingYears !== c.trainingYears || !!x.d.requireChecks !== c.requireChecks;
      });
    });
  }

  function drawAlready() {
    var el = document.getElementById('already');
    if (!el) return;
    el.innerHTML = '<h2><span class="badge">' + ico('history', 17) + '</span>Forms and events already made</h2>' +
      (DIRTY ? '<div class="banner gold">Save the settings first. Then you can apply them to the ones already made.</div>' : '<p class="hint">Working out what would change…</p>');
    icons();
    if (DIRTY) return;
    findAlready().then(function () {
      if (DIRTY) return;
      el.innerHTML = '<h2><span class="badge">' + ico('history', 17) + '</span>Forms and events already made</h2>' +
        '<div class="banner info">Answers already given keep their dates. Only the settings on the forms and events change.</div>' +
        '<div class="apply"><span class="t"><strong id="nForms">' + FORMS_TO.length + '</strong> form' + (FORMS_TO.length === 1 ? '' : 's') + ' made from a template ' +
          (FORMS_TO.length === 1 ? 'has' : 'have') + ' different periods' + (FORMS_TO.length ? ': ' + esc(FORMS_TO.slice(0, 4).map(function (d) { return d.data().title; }).join(', ')) + (FORMS_TO.length > 4 ? '…' : '') : '') + '.</span>' +
          '<button class="btn sec" id="applyForms"' + (FORMS_TO.length ? '' : ' disabled') + '>' + ico('check') + 'Also apply to ' + FORMS_TO.length + ' form' + (FORMS_TO.length === 1 ? '' : 's') + '</button></div>' +
        '<div class="apply"><span class="t"><strong id="nEvents">' + EVENTS_TO.length + '</strong> event' + (EVENTS_TO.length === 1 ? '' : 's') + ' coming up with leaders already set ' +
          (EVENTS_TO.length === 1 ? 'has' : 'have') + ' different ratios or checks' + (EVENTS_TO.length ? ': ' + esc(EVENTS_TO.slice(0, 4).map(function (x) { return x.ev.title; }).join(', ')) + (EVENTS_TO.length > 4 ? '…' : '') : '') + '.</span>' +
          '<button class="btn sec" id="applyEvents"' + (EVENTS_TO.length ? '' : ' disabled') + '>' + ico('check') + 'Also apply to ' + EVENTS_TO.length + ' event' + (EVENTS_TO.length === 1 ? '' : 's') + '</button></div>' +
        '<p class="hint" style="margin-bottom:0">Events with no leaders set yet take the new settings on their own.</p>';
      document.getElementById('applyForms').onclick = applyForms;
      document.getElementById('applyEvents').onclick = applyEvents;
      icons();
    }).catch(function (e) { el.innerHTML += '<div class="banner warn">' + esc(e.message || e) + '</div>'; });
  }

  function applyForms() {
    var c = current(), u = (EGBCAuth.user() || {}).uid || '';
    if (!confirm('Change the periods on ' + FORMS_TO.length + ' form' + (FORMS_TO.length === 1 ? '' : 's') + '? Answers already given keep their dates.')) return;
    this.disabled = true;
    Promise.all(FORMS_TO.map(function (doc) {
      var d = c.templates[doc.data().template];
      return doc.ref.update({ validity: d.validity, retentionMonths: d.retentionMonths, updatedAt: new Date().toISOString(), updatedBy: u });
    })).then(function () { toast('Applied to ' + FORMS_TO.length + '.'); drawAlready(); })
      .catch(function (e) { toast('Stopped: ' + (e.message || e)); drawAlready(); });
  }

  function applyEvents() {
    var c = current(), u = (EGBCAuth.user() || {}).uid || '';
    if (!confirm('Change the ratios and checks on ' + EVENTS_TO.length + ' event' + (EVENTS_TO.length === 1 ? '' : 's') + '?')) return;
    this.disabled = true;
    Promise.all(EVENTS_TO.map(function (x) {
      return x.ref.update({ ratioAll: c.ratioAll, ratioUnder8: c.ratioUnder8, dbsYears: c.dbsYears, trainingYears: c.trainingYears,
                            requireChecks: c.requireChecks, updatedAt: new Date().toISOString(), updatedBy: u });
    })).then(function () { toast('Applied to ' + EVENTS_TO.length + '.'); drawAlready(); })
      .catch(function (e) { toast('Stopped: ' + (e.message || e)); drawAlready(); });
  }

  EGBCAuth.require().then(function () {
    ADMIN = !!EGBCAuth.isAdmin();
    return Promise.all([SG.myLeadSites(), db().collection('safeguardingSettings').doc('defaults').get().catch(function () { return null; })]);
  }).then(function (r) {
    LEADSITES = r[0];
    if (!ADMIN && !LEADSITES.length) {
      E.refused();
      document.getElementById('wrap').innerHTML = '<div class="card"><h1>Safeguarding settings</h1><p>These are set by admins and the safeguarding lead.</p></div>';
      return;
    }
    SAVED = r[1] && r[1].exists ? r[1].data() : null;
    return Promise.all([
      db().collection('sites').get().catch(function () { return { docs: [] }; }),
      db().collection('bookingSettings').get().catch(function () { return { docs: [] }; }),
      ADMIN ? db().collection('addressBook').get().catch(function () { return { docs: [] }; }) : Promise.resolve({ docs: [] }),
      (EGBCAuth.isMaster && EGBCAuth.isMaster()) ? db().collection('fireRollCall').doc('main').get().catch(function () { return null; }) : Promise.resolve(null)
    ]).then(function (w) {
      if (w[3] && w[3].exists) FIRE = w[3].data();
      SITES = w[0].docs.map(function (x) { return Object.assign({ id: x.id }, x.data()); }).filter(function (x) { return x.active !== false; })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0) || String(a.name || '').localeCompare(String(b.name || '')); });
      w[1].docs.forEach(function (x) { BS[x.id] = x.data(); });
      PEOPLE = w[2].docs.map(function (x) { var v = x.data(); return { id: x.id, name: (v.name || '').trim(), minor: v.isMinor === true, archived: !!v.archived }; })
        .filter(function (p) { return p.name && !p.minor && !p.archived; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      draw();
    });
  }).catch(function (e) {
    document.getElementById('wrap').innerHTML = '<div class="card"><div class="banner warn">' + esc(e.message || e) + '</div></div>';
  });
})();
</script>
</body>
</html>
