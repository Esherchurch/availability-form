<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safeguarding settings</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610081930" data-title="Safeguarding settings"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-church.js?v=202610101000"></script>
<script src="egbc-guard.js?v=202610062100"></script>
<script src="egbc-ics.js?v=202610091200"></script>
<script src="egbc-events.js?v=202610072300"></script>
<script src="egbc-events-checkin.js?v=202610080900"></script>
<script src="egbc-events-forms.js?v=202610081500"></script>
<script src="egbc-events-safeguarding.js?v=202610081500"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 12px;padding-bottom:12px;
           border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{width:32px;height:32px;border-radius:8px;background:var(--tint);color:var(--brand);
         display:inline-flex;align-items:center;justify-content:center;flex:none}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;
       font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  .inp:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .field{margin-bottom:12px}
  .two{display:flex;gap:12px;flex-wrap:wrap}
  .two>.field{flex:1;min-width:150px}
  .tpl{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  .tpl:first-of-type{border-top:none;padding-top:0}
  .tpl h3{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 8px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--body);margin:4px 0 12px;font-weight:400}
  .check input{width:16px;height:16px;accent-color:var(--brand);flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
       border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent;
       background:var(--brand);color:#fff;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.sec:hover{background:#f3f4f6}
  .hint{font-size:13px;color:var(--muted)}
  .banner{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:12px}
  .banner.info{background:var(--tint);color:var(--body);border:1px solid #cfe0de}
  .banner.gold{background:var(--gold-bg);color:var(--gold)}
  .banner.warn{background:var(--danger-bg);color:var(--danger)}
  .apply{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
  .apply:first-of-type{border-top:none}
  .apply .t{flex:1;min-width:200px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;
         padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card hint">Loading…</div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, F = window.EGBCForms, SG = window.EGBCSafeguarding, esc = E.esc;
  var ADMIN = false, LEADSITES = [], SAVED = null, DIRTY = false, FORMS_TO = [], EVENTS_TO = [];
  var KEEP = [[3, '3 months'], [6, '6 months'], [12, '1 year'], [24, '2 years'], [36, '3 years'], [72, '6 years']];

  function db() { return EGBCAuth.db; }
  function icons() { if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons(); }
  function ico(n, px) { return '<i data-lucide="' + n + '" style="width:' + (px || 15) + 'px;height:' + (px || 15) + 'px"></i>'; }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3400); }

  /* What applies when nobody has saved anything: the templates' own
     periods, 1 to 8 and 1 to 4, 3 years (Martin, F-046), not required. */
  function builtIn() {
    var t = {};
    F.TEMPLATES.forEach(function (x) { t[x.id] = F.templateDefaults(x.id); });
    return { templates: t, ratioAll: 8, ratioUnder8: 4, dbsYears: 3, trainingYears: 3, requireChecks: false };
  }
  function current() {
    var b = builtIn(), s = SAVED || {};
    var t = {};
    Object.keys(b.templates).forEach(function (id) { t[id] = (s.templates && s.templates[id]) || b.templates[id]; });
    return { templates: t, ratioAll: s.ratioAll || b.ratioAll, ratioUnder8: s.ratioUnder8 || b.ratioUnder8,
             dbsYears: s.dbsYears || b.dbsYears, trainingYears: s.trainingYears || b.trainingYears,
             requireChecks: s.requireChecks !== undefined ? !!s.requireChecks : b.requireChecks };
  }

  function yearsSelect(id, v) {
    var o = '';
    for (var y = 1; y <= 10; y++) o += '<option value="' + y + '"' + (y === v ? ' selected' : '') + '>' + y + ' year' + (y === 1 ? '' : 's') + '</option>';
    return '<select id="' + id + '">' + o + '</select>';
  }
  function keepSelect(id, v) {
    var list = KEEP.slice();
    if (!list.some(function (k) { return k[0] === v; })) list.push([v, v + ' months']);
    return '<select id="' + id + '">' + list.map(function (k) { return '<option value="' + k[0] + '"' + (k[0] === v ? ' selected' : '') + '>' + k[1] + '</option>'; }).join('') + '</select>';
  }

  function draw() {
    var c = current();
    document.getElementById('wrap').innerHTML =
      '<h1>Safeguarding settings</h1>' +
      '<p class="sub">The periods and rules every new form and event starts with, in one place.</p>' +
      (SAVED && SAVED.updatedAt ? '<p class="hint" style="margin-top:-8px">Last changed ' + esc(E.fmtDate(SAVED.updatedAt)) + (SAVED.updatedByName ? ' by ' + esc(SAVED.updatedByName) : '') + '.</p>' : '') +

      '<div class="card"><h2><span class="badge">' + ico('file-text', 17) + '</span>Forms</h2>' +
        '<p class="hint" style="margin-top:-4px">For each kind of form: how long an answer counts, and how long it is kept after that before it is due for deletion.</p>' +
        F.TEMPLATES.map(function (t) {
          var d = c.templates[t.id], mode = (d.validity || {}).mode || 'event';
          return '<div class="tpl"><h3>' + esc(t.title) + '</h3><div class="two">' +
            '<div class="field"><label for="v_' + t.id + '">Answer lasts</label><select id="v_' + t.id + '" class="vmode" data-t="' + t.id + '">' +
              [['event', 'One event'], ['schoolyear', 'End of school year (31 Aug)'], ['days', 'A number of days']].map(function (o) {
                return '<option value="' + o[0] + '"' + (mode === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
            '<div class="field" id="dbox_' + t.id + '" style="max-width:140px;' + (mode === 'days' ? '' : 'display:none') + '"><label for="d_' + t.id + '">Days</label>' +
              '<input class="inp" id="d_' + t.id + '" type="number" min="1" max="3650" value="' + ((d.validity || {}).days || 365) + '"></div>' +
            '<div class="field"><label for="k_' + t.id + '">Kept after that</label>' + keepSelect('k_' + t.id, d.retentionMonths || 12) + '</div>' +
          '</div></div>';
        }).join('') + '</div>' +

      '<div class="card"><h2><span class="badge">' + ico('users', 17) + '</span>Leaders</h2>' +
        '<div class="two">' +
          '<div class="field"><label for="rAll">One leader for every … children</label><input class="inp" id="rAll" type="number" min="1" max="50" value="' + c.ratioAll + '"></div>' +
          '<div class="field"><label for="rU8">… and for every … under-8s</label><input class="inp" id="rU8" type="number" min="1" max="50" value="' + c.ratioUnder8 + '"></div>' +
        '</div><div class="two">' +
          '<div class="field"><label for="yDbs">A DBS check counts for</label>' + yearsSelect('yDbs', c.dbsYears) + '</div>' +
          '<div class="field"><label for="yTr">Safeguarding training counts for</label>' + yearsSelect('yTr', c.trainingYears) + '</div>' +
        '</div>' +
        '<label class="check"><input type="checkbox" id="req"' + (c.requireChecks ? ' checked' : '') + '>Every leader must have an in-date DBS check and training</label>' +
      '</div>' +

      '<div class="card"><button class="btn" id="save">' + ico('check', 16) + 'Save the settings</button>' +
        '<p class="hint" style="margin:10px 0 0">New forms and new events take these from now on.</p></div>' +

      '<div class="card" id="already"></div>';

    document.querySelectorAll('.vmode').forEach(function (s) {
      s.onchange = function () { document.getElementById('dbox_' + s.getAttribute('data-t')).style.display = s.value === 'days' ? '' : 'none'; markDirty(); };
    });
    document.querySelectorAll('#wrap input, #wrap select').forEach(function (el) { el.addEventListener('change', markDirty); el.addEventListener('input', markDirty); });
    document.getElementById('save').onclick = save;
    icons();
    drawAlready();
  }

  function markDirty() { if (!DIRTY) { DIRTY = true; drawAlready(); } }

  function read() {
    var t = {};
    F.TEMPLATES.forEach(function (x) {
      var mode = document.getElementById('v_' + x.id).value;
      t[x.id] = { validity: mode === 'days' ? { mode: 'days', days: Math.max(1, parseInt(document.getElementById('d_' + x.id).value, 10) || 365) } : { mode: mode },
                  retentionMonths: parseInt(document.getElementById('k_' + x.id).value, 10) || 12 };
    });
    return {
      templates: t,
      ratioAll: Math.min(50, Math.max(1, parseInt(document.getElementById('rAll').value, 10) || 8)),
      ratioUnder8: Math.min(50, Math.max(1, parseInt(document.getElementById('rU8').value, 10) || 4)),
      dbsYears: parseInt(document.getElementById('yDbs').value, 10) || 3,
      trainingYears: parseInt(document.getElementById('yTr').value, 10) || 3,
      requireChecks: document.getElementById('req').checked
    };
  }

  function save() {
    var d = read(), u = EGBCAuth.user() || {}, p = EGBCAuth.profile() || {};
    d.updatedAt = new Date().toISOString(); d.updatedBy = u.uid || ''; d.updatedByName = p.name || '';
    if (!ADMIN) d.leadSiteId = LEADSITES[0];
    document.getElementById('save').disabled = true;
    db().collection('safeguardingSettings').doc('defaults').set(d).then(function () {
      SAVED = d; DIRTY = false; toast('Saved.'); draw();
    }).catch(function (e) {
      document.getElementById('save').disabled = false;
      toast('Could not save: ' + (e.message || e));
    });
  }

  /* ---- the ones already made ----
     Forms made from a template whose periods differ from the saved ones,
     and events coming up whose leaders' settings differ. Only those this
     person may change are counted. Answers already given keep their dates. */

  function sameValidity(a, b) {
    a = a || {}; b = b || {};
    return (a.mode || 'event') === (b.mode || 'event') && (a.mode !== 'days' || (a.days || 365) === (b.days || 365));
  }

  function findAlready() {
    var c = current();
    var forms = ADMIN ? db().collection('forms').get().then(function (s) { return s.docs; })
      : Promise.all(LEADSITES.map(function (sid) { return db().collection('forms').where('siteId', '==', sid).get().then(function (s) { return s.docs; }); }))
          .then(function (l) { return [].concat.apply([], l); });
    var events = E.listUpcoming({ limit: 200 }).catch(function () { return []; }).then(function (list) {
      return Promise.all(list.map(function (e) {
        return db().collection('eventLeaders').doc(e.id).get().then(function (s) { return s.exists ? { ev: e, ref: s.ref, d: s.data() } : null; }).catch(function () { return null; });
      }));
    });
    return Promise.all([forms, events]).then(function (r) {
      FORMS_TO = r[0].filter(function (doc) {
        var f = doc.data(), d = f.template && c.templates[f.template];
        return d && (!sameValidity(f.validity, d.validity) || (f.retentionMonths || 12) !== d.retentionMonths);
      });
      EVENTS_TO = r[1].filter(Boolean).filter(function (x) {
        if (!ADMIN && LEADSITES.indexOf(x.d.siteId) < 0) return false;
        return x.d.ratioAll !== c.ratioAll || x.d.ratioUnder8 !== c.ratioUnder8 || x.d.dbsYears !== c.dbsYears ||
               x.d.trainingYears !== c.trainingYears || !!x.d.requireChecks !== c.requireChecks;
      });
    });
  }

  function drawAlready() {
    var el = document.getElementById('already');
    if (!el) return;
    el.innerHTML = '<h2><span class="badge">' + ico('history', 17) + '</span>Forms and events already made</h2>' +
      (DIRTY ? '<div class="banner gold">Save the settings first. Then you can apply them to the ones already made.</div>' : '<p class="hint">Working out what would change…</p>');
    icons();
    if (DIRTY) return;
    findAlready().then(function () {
      if (DIRTY) return;
      el.innerHTML = '<h2><span class="badge">' + ico('history', 17) + '</span>Forms and events already made</h2>' +
        '<div class="banner info">Answers already given keep their dates. Only the settings on the forms and events change.</div>' +
        '<div class="apply"><span class="t"><strong id="nForms">' + FORMS_TO.length + '</strong> form' + (FORMS_TO.length === 1 ? '' : 's') + ' made from a template ' +
          (FORMS_TO.length === 1 ? 'has' : 'have') + ' different periods' + (FORMS_TO.length ? ': ' + esc(FORMS_TO.slice(0, 4).map(function (d) { return d.data().title; }).join(', ')) + (FORMS_TO.length > 4 ? '…' : '') : '') + '.</span>' +
          '<button class="btn sec" id="applyForms"' + (FORMS_TO.length ? '' : ' disabled') + '>' + ico('check') + 'Also apply to ' + FORMS_TO.length + ' form' + (FORMS_TO.length === 1 ? '' : 's') + '</button></div>' +
        '<div class="apply"><span class="t"><strong id="nEvents">' + EVENTS_TO.length + '</strong> event' + (EVENTS_TO.length === 1 ? '' : 's') + ' coming up with leaders already set ' +
          (EVENTS_TO.length === 1 ? 'has' : 'have') + ' different ratios or checks' + (EVENTS_TO.length ? ': ' + esc(EVENTS_TO.slice(0, 4).map(function (x) { return x.ev.title; }).join(', ')) + (EVENTS_TO.length > 4 ? '…' : '') : '') + '.</span>' +
          '<button class="btn sec" id="applyEvents"' + (EVENTS_TO.length ? '' : ' disabled') + '>' + ico('check') + 'Also apply to ' + EVENTS_TO.length + ' event' + (EVENTS_TO.length === 1 ? '' : 's') + '</button></div>' +
        '<p class="hint" style="margin-bottom:0">Events with no leaders set yet take the new settings on their own.</p>';
      document.getElementById('applyForms').onclick = applyForms;
      document.getElementById('applyEvents').onclick = applyEvents;
      icons();
    }).catch(function (e) { el.innerHTML += '<div class="banner warn">' + esc(e.message || e) + '</div>'; });
  }

  function applyForms() {
    var c = current(), u = (EGBCAuth.user() || {}).uid || '';
    if (!confirm('Change the periods on ' + FORMS_TO.length + ' form' + (FORMS_TO.length === 1 ? '' : 's') + '? Answers already given keep their dates.')) return;
    this.disabled = true;
    Promise.all(FORMS_TO.map(function (doc) {
      var d = c.templates[doc.data().template];
      return doc.ref.update({ validity: d.validity, retentionMonths: d.retentionMonths, updatedAt: new Date().toISOString(), updatedBy: u });
    })).then(function () { toast('Applied to ' + FORMS_TO.length + '.'); drawAlready(); })
      .catch(function (e) { toast('Stopped: ' + (e.message || e)); drawAlready(); });
  }

  function applyEvents() {
    var c = current(), u = (EGBCAuth.user() || {}).uid || '';
    if (!confirm('Change the ratios and checks on ' + EVENTS_TO.length + ' event' + (EVENTS_TO.length === 1 ? '' : 's') + '?')) return;
    this.disabled = true;
    Promise.all(EVENTS_TO.map(function (x) {
      return x.ref.update({ ratioAll: c.ratioAll, ratioUnder8: c.ratioUnder8, dbsYears: c.dbsYears, trainingYears: c.trainingYears,
                            requireChecks: c.requireChecks, updatedAt: new Date().toISOString(), updatedBy: u });
    })).then(function () { toast('Applied to ' + EVENTS_TO.length + '.'); drawAlready(); })
      .catch(function (e) { toast('Stopped: ' + (e.message || e)); drawAlready(); });
  }

  EGBCAuth.require().then(function () {
    ADMIN = !!EGBCAuth.isAdmin();
    return Promise.all([SG.myLeadSites(), db().collection('safeguardingSettings').doc('defaults').get().catch(function () { return null; })]);
  }).then(function (r) {
    LEADSITES = r[0];
    if (!ADMIN && !LEADSITES.length) {
      document.getElementById('wrap').innerHTML = '<div class="card"><h1>Safeguarding settings</h1><p>These are set by admins and the safeguarding lead.</p></div>';
      return;
    }
    SAVED = r[1] && r[1].exists ? r[1].data() : null;
    draw();
  }).catch(function (e) {
    document.getElementById('wrap').innerHTML = '<div class="card"><div class="banner warn">' + esc(e.message || e) + '</div></div>';
  });
})();
</script>
</body>
</html>
