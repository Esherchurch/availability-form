<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Children's register</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610082145" data-title="Children's register"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-church.js?v=202610101000"></script>
<script src="egbc-guard.js?v=202610062100"></script>
<script src="egbc-email.js?v=202610081729"></script>
<script src="egbc-events.js?v=202610072300"></script>
<script src="egbc-events-checkin.js?v=202610082100"></script>
<script src="egbc-events-forms.js?v=202610081500"></script>
<script src="egbc-events-kids.js?v=202610091000"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 8px}
  label.l{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select{height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff;width:100%}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;font:500 13px Inter,sans-serif;
       cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--brand-dark)} .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)} .btn.sec:hover{background:#f3f4f6}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font:500 13px Inter,sans-serif;color:var(--body);cursor:pointer}
  .tab.on{background:var(--tint);border-color:var(--brand);color:var(--ink)}
  .tab .n{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:999px;background:var(--gold);color:#fff;font-size:11px;margin-left:6px;text-align:center}
  .hint{font-size:13px;color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.row .f{min-width:160px;flex:1}
  .kid{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
  .kid:first-child{border-top:none}.kid .t{flex:1;min-width:200px}.kid .t b{color:var(--ink)}
  .pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;margin:2px 4px 2px 0}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.wait{background:var(--gold-bg);color:var(--gold)}.pill.no{background:var(--danger-bg);color:var(--danger)}
  .st{border-radius:8px;padding:10px 12px;font-size:13px;margin:8px 0}
  .st.ok{background:var(--ok-bg);color:var(--ok)}.st.wait{background:var(--gold-bg);color:var(--gold)}.st.no{background:var(--danger-bg);color:var(--danger)}
  dl{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;margin:8px 0;font-size:13px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
  .two{display:flex;gap:10px;flex-wrap:wrap}.two>div{flex:1;min-width:140px}
  .ck{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:14px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap">
  <h1>Children's register</h1>
  <p class="sub">Sunday groups, the children registered for them, and registration: the parent consent form, once a year.</p>
  <div id="main"><div class="card hint">Loading…</div></div>
</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  /* NEED TO KNOW (Martin, F-087), as the rules enforce it:
     the LEADS (master admins, the safeguarding lead and deputy, admins of
     the children's teams) see every child and every tab; a GROUP'S LEADERS
     see their own group's children, with their medical details, and
     nothing else. */
  var K = window.EGBCKids, F = window.EGBCForms, E = window.EGBCEvents;
  var SITES = [], ROOMS = [], GROUPS = [], FAMILIES = [], CHILDREN = [], SETTINGS = {}, RESPONSES = [], REQUESTS = [], SENS = [], PEOPLE = [], TERMS = [];
  var V = { site: '', tab: new URLSearchParams(location.search).get('tab') === 'settings' ? 'settings' : 'children', group: '', q: '', open: '' }, ME = {}, LEAD = false, MYGROUPS = [], CAN_TEAMS = false;
  function db() { return EGBCAuth.db; }
  function uid() { return (EGBCAuth.user() || {}).uid || ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3500); }
  function today() { return new Date().toISOString().slice(0, 10); }
  function group(id) { return GROUPS.filter(function (g) { return g.id === id; })[0] || null; }
  function all(s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }
  function person(mid) { return PEOPLE.filter(function (p) { return p.id === mid; })[0] || null; }
  function notSetUp(noSite, canChoose) {
    document.getElementById('main').innerHTML = K.notSetUpHtml({ admin: !!(EGBCAuth.isAdmin && EGBCAuth.isAdmin()), noSite: noSite, canChooseTeam: canChoose });
  }
  function noAccess() {
    document.getElementById('main').innerHTML = '<div class="card" id="noaccess">This page is for the children\'s team leads and each group\'s leaders. If you lead a children\'s group, ask a lead to add you to it.</div>';
  }

  /* ---- load: the leads read the site; a group leader reads their groups ---- */
  function load() {
    var site = V.site, fid = SETTINGS.formId || '', none = { docs: [] };
    var kids = LEAD ? db().collection('kidsChildren').where('siteId', '==', site).get().then(all)
      : Promise.all(MYGROUPS.filter(function (g) { return g.siteId === site; }).map(function (g) { return db().collection('kidsChildren').where('groupId', '==', g.id).get().then(all); }))
          .then(function (l) { return [].concat.apply([], l); });
    return Promise.all([
      db().collection('kidsGroups').where('siteId', '==', site).get(), kids,
      LEAD ? db().collection('kidsFamilies').where('siteId', '==', site).get() : none,
      LEAD && fid ? db().collection('formResponses').where('siteId', '==', site).where('formId', '==', fid).get().catch(function () { return none; }) : none,
      LEAD && fid ? db().collection('formRequests').where('siteId', '==', site).where('formId', '==', fid).get().catch(function () { return none; }) : none,
      LEAD && fid ? db().collection('sensitiveResponses').where('siteId', '==', site).where('formId', '==', fid).get().catch(function () { return none; }) : none,
      db().collection('kidsTerms').doc(site).get().catch(function () { return null; })
    ]).then(function (r) {
      TERMS = r[6] && r[6].exists ? (r[6].data().terms || []) : [];
      GROUPS = all(r[0]).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      CHILDREN = r[1].sort(function (a, b) { return a.name.localeCompare(b.name); });
      FAMILIES = all(r[2]); RESPONSES = all(r[3]); REQUESTS = r[4].docs.map(function (d) { return Object.assign({ key: d.id }, d.data()); }); SENS = all(r[5]);
      draw();
    });
  }
  function pending() {
    var done = {}; FAMILIES.forEach(function (f) { (f.responseIds || []).forEach(function (id) { done[id] = true; }); });
    return RESPONSES.filter(function (x) { return !done[x.id]; }).sort(function (a, b) { return a.submittedAt < b.submittedAt ? -1 : 1; });
  }

  function draw() {
    var tabs = LEAD ? [['children', 'Children'], ['registration', 'Registration', pending().length], ['groups', 'Groups'], ['settings', 'Settings']]
                    : [['children', 'Your group' + (MYGROUPS.length > 1 ? 's' : '')]];
    if (!LEAD) V.tab = 'children';
    document.getElementById('main').innerHTML =
      (SITES.length > 1 ? '<div class="row"><div class="f"><label class="l" for="k-site">Site</label><select id="k-site">' + SITES.map(function (s) {
        return '<option value="' + esc(s.id) + '"' + (s.id === V.site ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select></div></div>' : '') +
      '<div class="tabs">' + tabs.map(function (t) { return '<button class="tab' + (V.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + (t[2] ? '<span class="n">' + t[2] + '</span>' : '') + '</button>'; }).join('') +
        '<a class="btn sec" id="k-sunday" href="kids-checkin.html" style="margin-left:auto">Sunday check-in</a></div>' +
      '<div id="body"></div>';
    var ks = document.getElementById('k-site'); if (ks) ks.onchange = function () { V.site = this.value; start(); };
    document.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { V.tab = b.dataset.tab; draw(); }; });
    if (CAN_TEAMS && !(SETTINGS.teams || []).length) document.getElementById('body').insertAdjacentHTML('beforebegin', '<div class="st wait" id="notsetup-team">Not set up yet: choose the children\'s team on Settings. Its admins become the leads.</div>');
    var el = document.getElementById('body');
    if (V.tab === 'registration') return drawRegistration(el);
    if (V.tab === 'groups') return drawGroups(el);
    if (V.tab === 'settings') return drawSettings(el);
    drawChildren(el);
  }

  /* ---- children ---- */
  function flags(c) {
    var f = c.flags || null;
    return (f ? (f.allergies ? '<span class="pill no">Allergies</span>' : '') + (f.medical ? '<span class="pill no">Medical</span>' : '') : '<span class="pill wait">Medical not checked</span>') +
      (c.photo === false ? '<span class="pill wait">No photos</span>' : '') +
      (c.status === 'visitor' ? '<span class="pill wait">Visitor</span>' : '') + (c.status === 'left' ? '<span class="pill">Left</span>' : '') +
      (K.consentOk(c, today()) ? '<span class="pill ok">Consent until ' + esc(E.fmtDate(c.consentUntil + 'T12:00')) + '</span>' : '<span class="pill no">Consent ' + (c.consentUntil ? 'ran out' : 'missing') + '</span>');
  }
  function drawChildren(el) {
    var q = K.norm(V.q), visible = LEAD ? GROUPS : GROUPS.filter(function (g) { return MYGROUPS.some(function (m) { return m.id === g.id; }); });
    var list = CHILDREN.filter(function (c) {
      return (!V.group || c.groupId === V.group || (V.group === '__none' && !c.groupId)) && (V.group ? true : c.status !== 'left') &&
        (!q || K.norm(c.name).indexOf(q) >= 0 || K.norm(c.parentName).indexOf(q) >= 0);
    });
    el.innerHTML = '<div class="card"><div class="row"><div class="f"><label class="l" for="c-group">Group</label><select id="c-group"><option value="">' + (LEAD ? 'Every group' : 'All of mine') + '</option>' +
      visible.map(function (g) { return '<option value="' + esc(g.id) + '"' + (V.group === g.id ? ' selected' : '') + '>' + esc(g.name) + '</option>'; }).join('') +
      (LEAD ? '<option value="__none"' + (V.group === '__none' ? ' selected' : '') + '>Not in a group</option>' : '') + '</select></div>' +
      '<div class="f"><label class="l" for="c-q">Find</label><input class="inp" id="c-q" value="' + esc(V.q) + '" placeholder="A child or a parent"></div></div>' +
      '<p class="hint" id="c-count">' + list.length + ' ' + (list.length === 1 ? 'child' : 'children') + '</p>' +
      (list.length ? list.map(function (c) {
        var g = group(c.groupId), age = K.ageOn(c.dob, today());
        return '<div class="kid" data-child="' + esc(c.id) + '"><div class="t"><b>' + esc(c.name) + '</b> <span class="hint">' + esc(c.year || '') + (age != null ? ', ' + age : '') + ' · ' + esc(g ? g.name : 'not in a group') + '</span><br>' +
          flags(c) + '<br><span class="hint">' + esc(c.parentName || '') + (c.phone ? ' · <a href="tel:' + esc(c.phone.replace(/\s/g, '')) + '" style="color:var(--brand)">' + esc(c.phone) + '</a>' : '') + '</span></div>' +
          '<button class="btn sec" data-open="' + esc(c.id) + '">Open</button></div>' + (V.open === c.id ? detail(c) : '');
      }).join('') : '<p class="hint">' + (LEAD ? 'Nobody here yet. Registration adds them.' : 'No children in your group yet.') + '</p>') + '</div>';
    document.getElementById('c-group').onchange = function () { V.group = this.value; drawChildren(el); };
    document.getElementById('c-q').oninput = function () { V.q = this.value; var p = this.selectionStart; drawChildren(el); var i = document.getElementById('c-q'); i.focus(); i.setSelectionRange(p, p); };
    el.querySelectorAll('[data-open]').forEach(function (b) { b.onclick = function () { V.open = V.open === b.dataset.open ? '' : b.dataset.open; drawChildren(el); }; });
    wireDetail(el);
  }
  function detail(c) {
    return '<div class="card" data-detail="' + esc(c.id) + '" style="margin:6px 0 10px">' +
      '<dl><dt>Date of birth</dt><dd>' + esc(c.dob ? E.fmtDate(c.dob + 'T12:00') : '') + '</dd><dt>Parent</dt><dd>' + esc(c.parentName || '') + (LEAD && c.email ? ' · ' + esc(c.email) : '') + '</dd>' +
      '<dt>Phone</dt><dd>' + (c.phone ? '<a href="tel:' + esc(c.phone.replace(/\s/g, '')) + '" style="color:var(--brand)">' + esc(c.phone) + '</a>' : '') + '</dd>' +
      '<dt>Emergency</dt><dd>' + esc(c.emergency || '') + '</dd><dt>May collect</dt><dd>' + (LEAD
        ? '<input class="inp d-coll" value="' + esc((c.collectors || []).join(', ')) + '" aria-label="Who may collect"><span class="hint">Names, with commas. For every child in the family. At the door, nobody else may collect without the code.</span>'
        : esc((c.collectors || []).join(', '))) + '</dd>' +
      '<dt>Family code</dt><dd>' + esc(c.familyCode || '') + '</dd>' +
      '<dt>Photos</dt><dd>' + (c.photo ? 'Yes' : 'No') + '</dd><dt>First aid</dt><dd>' + (c.firstaid ? 'Yes' : 'No') + '</dd>' +
      (c.dietary ? '<dt>Diet</dt><dd>' + esc(c.dietary) + '</dd>' : '') + '</dl>' +
      '<div id="med-' + esc(c.id) + '"></div>' +
      (LEAD ? '<div class="two"><div><label class="l">Group</label><select class="d-group">' + '<option value="">Not in a group</option>' + GROUPS.map(function (g) {
        return '<option value="' + esc(g.id) + '"' + (c.groupId === g.id ? ' selected' : '') + '>' + esc(g.name) + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="l">Status</label><select class="d-status">' + [['registered', 'Registered'], ['visitor', 'Visitor'], ['left', 'Left']].map(function (o) {
        return '<option value="' + o[0] + '"' + ((c.status || 'registered') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div></div>' : '') +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sec d-med">Show medical details</button>' +
      (LEAD ? '<button class="btn d-save">Save</button>' : '') + '</div></div>';
  }
  /* A child's group, and their medical copy with it, in one write (the rules insist). */
  function setGroup(batch, c, groupId, extra) {
    batch.update(db().collection('kidsChildren').doc(c.id), Object.assign({ groupId: groupId, updatedAt: new Date().toISOString(), updatedBy: uid() }, extra || {}));
    batch.set(db().collection('kidsMedical').doc(c.id), { siteId: c.siteId, groupId: groupId, updatedAt: new Date().toISOString(), updatedBy: uid() }, { merge: true });
  }
  function wireDetail(el) {
    el.querySelectorAll('[data-detail]').forEach(function (box) {
      var c = CHILDREN.filter(function (x) { return x.id === box.dataset.detail; })[0];
      box.querySelector('.d-med').onclick = function () {
        db().collection('kidsMedical').doc(c.id).get().then(function (s) {
          var m = s.exists ? s.data() : {};
          document.getElementById('med-' + c.id).innerHTML = '<div class="st wait" data-med="' + esc(c.id) + '"><b>Medical</b>: ' + esc(m.medical || 'none given') + '<br><b>Medication</b>: ' + esc(m.medication || 'none given') +
            '<br><b>Allergies</b>: ' + esc(m.allergies || 'none given') + '<br><b>Additional needs</b>: ' + esc(m.needs || 'none given') + '</div>';
        }).catch(function () { toast('Could not open the medical details'); });
      };
      var sv = box.querySelector('.d-save');
      if (sv) sv.onclick = function () {
        var g = box.querySelector('.d-group').value, st = box.querySelector('.d-status').value, b = db().batch();
        var coll = K.splitNames(box.querySelector('.d-coll').value).slice(0, 20), was = (c.collectors || []).join('|');
        setGroup(b, c, g, { groupFixed: g !== K.groupFor(Object.assign({}, c, { groupFixed: false }), GROUPS), status: st, collectors: coll });
        /* The list is the family's: the brothers and sisters, and the family record, change with it. */
        if (coll.join('|') !== was) {
          b.update(db().collection('kidsFamilies').doc(c.familyId), { collectors: coll, updatedAt: new Date().toISOString(), updatedBy: uid() });
          CHILDREN.filter(function (x) { return x.familyId === c.familyId && x.id !== c.id; }).forEach(function (x) {
            b.update(db().collection('kidsChildren').doc(x.id), { collectors: coll, updatedAt: new Date().toISOString(), updatedBy: uid() });
          });
        }
        b.commit().then(function () { toast('Saved'); return load(); }).catch(function (e) { toast('Could not save: ' + (e.message || e)); });
      };
    });
  }

  /* ---- registration (the leads) ---- */
  function drawRegistration(el) {
    if (!SETTINGS.formId) { el.innerHTML = '<div class="card">The registration form is not set up yet. ' + (EGBCAuth.isAdmin() ? 'Set it up on the Settings tab.' : 'Ask an admin to set it up.') + '</div>'; return; }
    var pend = pending(), sent = REQUESTS.filter(function (q) { return q.status !== 'done'; }).sort(function (a, b) { return a.sentAt < b.sentAt ? 1 : -1; });
    el.innerHTML = '<div class="card"><h2>Send the registration form</h2><p class="hint">To a parent or guardian. They fill it in once a year: their children, medical needs, who may collect.</p>' +
      '<div class="two"><div><label class="l" for="r-name">Their name</label><input class="inp" id="r-name" maxlength="120"></div>' +
      '<div><label class="l" for="r-email">Their email</label><input class="inp" id="r-email" type="email" maxlength="200"></div></div>' +
      '<div style="margin-top:10px"><button class="btn" id="r-send">Send it</button></div></div>' +
      '<div class="card"><h2>Ready to add to the register</h2>' + (pend.length ? pend.map(function (resp) {
        var p = proposal(resp);
        return '<div class="kid" data-resp="' + esc(resp.id) + '"><div class="t"><b>' + esc(p.family.parentName) + '</b> <span class="hint">' + esc(resp.email) + ' · sent ' + esc(E.fmtDateShort(resp.submittedAt)) + '</span><br>' +
          p.children.map(function (c) { var g = group(c.groupId); return esc(c.name) + ' <span class="hint">(' + esc(c.year || '?') + ' → ' + esc(g ? g.name : 'no group yet') + ')</span>'; }).join('<br>') +
          (existing(p.family) ? '<br><span class="pill wait">Already on the register: this updates them</span>' : '') + '</div>' +
          '<button class="btn" data-add="' + esc(resp.id) + '">Add to the register</button></div>';
      }).join('') : '<p class="hint">Nothing waiting.</p>') + '</div>' +
      '<div class="card"><h2>Sent, not back yet</h2>' + (sent.length ? sent.map(function (q) {
        return '<div class="kid"><div class="t"><b>' + esc(q.name) + '</b> <span class="hint">' + esc(q.email) + ' · sent ' + esc(E.fmtDateShort(q.sentAt)) +
          ((q.reminders || []).length ? ' · reminded ' + q.reminders.length + '×' : '') + '</span></div><button class="btn sec" data-remind="' + esc(q.key) + '">Remind</button></div>';
      }).join('') : '<p class="hint">None.</p>') + '</div>';
    document.getElementById('r-send').onclick = sendForm;
    el.querySelectorAll('[data-add]').forEach(function (b) { b.onclick = function () { b.disabled = true; addResponse(b.dataset.add).catch(function (e) { b.disabled = false; toast('Could not add: ' + (e.message || e)); }); }; });
    el.querySelectorAll('[data-remind]').forEach(function (b) {
      b.onclick = function () {
        var q = REQUESTS.filter(function (x) { return x.key === b.dataset.remind; })[0];
        q.reminders = (q.reminders || []).concat([new Date().toISOString()]);
        db().collection('formRequests').doc(q.key).update({ reminders: q.reminders }).then(function () { return EGBCChurch.send(F.requestEmail(q, true)); })
          .then(function () { toast('Reminded'); draw(); }).catch(function (e) { toast('Could not: ' + (e.message || e)); });
      };
    });
  }
  function sensFor(resp) { return SENS.filter(function (s) { return s.responseId === resp.id && !s.sharedFrom; })[0] || null; }
  function proposal(resp) { return K.fromResponse(resp, sensFor(resp), GROUPS, today()); }
  function existing(fam) { return FAMILIES.filter(function (f) { return f.email && f.email === fam.email; })[0] || null; }
  function sendForm() {
    var name = document.getElementById('r-name').value.trim(), email = document.getElementById('r-email').value.trim().toLowerCase();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Give their name and email address'); return; }
    var key = E.key(32);
    var req = { formId: SETTINGS.formId, formTitle: SETTINGS.formTitle || 'Children\'s registration', calEventId: '', eventTitle: '', eventStart: '', signupKey: '',
      personKind: '', personId: '', name: name, email: email, subjects: [], siteId: V.site, status: 'sent', reuseOf: '', sentAt: new Date().toISOString(), reminders: [], createdBy: uid() };
    db().collection('formRequests').doc(key).set(req).then(function () { return EGBCChurch.send(F.requestEmail(Object.assign({ key: key }, req), false)); })
      .then(function () { toast('Sent to ' + name); return load(); }).catch(function (e) { toast('Could not send: ' + (e.message || e)); });
  }
  /* A completed form onto the register. The family record (with the forms)
     is the leads'; each child carries what a group leader needs, and its
     own medical copy, so no leader ever reaches a brother or sister's. */
  function addResponse(rid) {
    var resp = RESPONSES.filter(function (x) { return x.id === rid; })[0], sens = sensFor(resp), p = K.fromResponse(resp, sens, GROUPS, today());
    var fam = existing(p.family), now = new Date().toISOString(), batch = db().batch();
    var famId = fam ? fam.id : 'kf_' + E.key(14), code = (fam && fam.familyCode) || K.familyCode();
    var famDoc = Object.assign({}, p.family, { siteId: V.site, responseIds: ((fam && fam.responseIds) || []).concat([rid]), consentUntil: resp.validUntil, familyCode: code, updatedAt: now, updatedBy: uid() });
    if (!fam) famDoc.createdAt = now;
    batch.set(db().collection('kidsFamilies').doc(famId), famDoc, { merge: true });
    p.children.forEach(function (c) {
      var had = CHILDREN.filter(function (x) { return x.familyId === famId && K.norm(x.name) === K.norm(c.name); })[0], id = had ? had.id : 'kc_' + E.key(14);
      var groupId = had && had.groupFixed ? had.groupId : c.groupId;
      var d = { siteId: V.site, familyId: famId, name: c.name, dob: c.dob, year: c.year, dietary: c.dietary, photo: c.photo, firstaid: c.firstaid, alone: c.alone,
        flags: c.flags, consentUntil: resp.validUntil, responseId: rid, groupId: groupId, groupFixed: !!(had && had.groupFixed),
        status: had && had.status === 'left' ? 'left' : 'registered',
        parentName: p.family.parentName, phone: p.family.phone, email: p.family.email, emergency: p.family.emergency, collectors: p.family.collectors, familyCode: code,
        updatedAt: now, updatedBy: uid() };
      if (!had) d.createdAt = now;
      batch.set(db().collection('kidsChildren').doc(id), d, { merge: true });
      var row = (sens && sens.answers && sens.answers.children && sens.answers.children[c.medicalIndex]) || {};
      batch.set(db().collection('kidsMedical').doc(id), { siteId: V.site, groupId: groupId, allergies: String(row.allergies || ''), medical: String(row.medical || ''),
        medication: String(row.medication || ''), needs: String(row.needs || ''), responseId: rid, updatedAt: now, updatedBy: uid() });
    });
    return batch.commit().then(function () { toast('Added: ' + p.children.length + ' ' + (p.children.length === 1 ? 'child' : 'children')); return load(); });
  }

  /* ---- groups (the leads set them, and who leads each) ---- */
  function drawGroups(el) {
    var rooms = ROOMS.filter(function (r) { return r.siteId === V.site && r.kind !== 'online'; });
    el.innerHTML = '<div class="card"><h2>Groups</h2><p class="hint">By school year. A child goes into the group for their year; you can move one by hand. ' +
      'Each group\'s leaders see that group\'s children, with their medical details, and no one else\'s.</p>' +
      (GROUPS.length ? GROUPS.map(function (g) {
        var n = CHILDREN.filter(function (c) { return c.groupId === g.id && c.status !== 'left'; }).length, rm = rooms.filter(function (r) { return r.id === g.roomId; })[0];
        return '<div class="kid" data-grow="' + esc(g.id) + '"><div class="t"><b>' + esc(g.name) + '</b> <span class="hint">' + esc((g.years || []).join(', ')) + '</span><br><span class="hint">' +
          esc(K.DAYS[g.day || 7]) + ' ' + esc(g.start || '') + '–' + esc(g.end || '') + (rm ? ' · ' + esc(rm.name) : '') + ' · 1 leader to ' + (g.ratio || '?') + ' · ' + n + ' children' + (g.active === false ? ' · not running' : '') + '</span><br>' +
          '<span class="hint">Leaders: ' + ((g.leaderIds || []).length ? (g.leaderIds || []).map(function (m) { return esc((person(m) || {}).name || m); }).join(', ') : 'none yet') + '</span></div>' +
          '<button class="btn sec" data-gedit="' + esc(g.id) + '">Edit</button></div>';
      }).join('') : '<p class="hint">No groups yet.</p>') +
      '<div style="margin-top:10px"><button class="btn" id="g-new">Add a group</button></div></div><div id="g-form"></div>';
    document.getElementById('g-new').onclick = function () { groupForm(null, rooms); };
    el.querySelectorAll('[data-gedit]').forEach(function (b) { b.onclick = function () { groupForm(group(b.dataset.gedit), rooms); }; });
  }
  function groupForm(g, rooms) {
    g = g || { name: '', years: [], day: 7, start: '10:30', end: '12:00', ratio: 5, roomId: '', active: true, leaderIds: [] };
    var leaders = (g.leaderIds || []).slice();
    var box = document.getElementById('g-form');
    function drawLeaders() {
      document.getElementById('g-leaders').innerHTML = leaders.length ? leaders.map(function (m) {
        return '<span class="pill ok" data-leader="' + esc(m) + '">' + esc((person(m) || {}).name || m) + ' <button class="btn sec" style="height:20px;padding:0 6px" data-unlead="' + esc(m) + '">&times;</button></span>'; }).join('') : '<span class="hint">None yet.</span>';
      box.querySelectorAll('[data-unlead]').forEach(function (b) { b.onclick = function () { leaders = leaders.filter(function (x) { return x !== b.dataset.unlead; }); drawLeaders(); }; });
    }
    box.innerHTML = '<div class="card" id="g-card"><h2>' + (g.id ? esc(g.name) : 'A new group') + '</h2>' +
      '<div class="two"><div><label class="l" for="g-name">Name</label><input class="inp" id="g-name" maxlength="80" value="' + esc(g.name) + '"></div>' +
      '<div><label class="l" for="g-room">Room</label><select id="g-room"><option value="">None set</option>' + rooms.map(function (r) { return '<option value="' + esc(r.id) + '"' + (g.roomId === r.id ? ' selected' : '') + '>' + esc(r.name) + '</option>'; }).join('') + '</select></div></div>' +
      '<p class="l" style="margin-top:8px">School years</p><div style="display:flex;flex-wrap:wrap;gap:4px 14px">' + K.YEARS.map(function (y) {
        return '<label class="ck"><input type="checkbox" class="g-year" value="' + esc(y) + '"' + ((g.years || []).indexOf(y) >= 0 ? ' checked' : '') + '> ' + esc(y) + '</label>'; }).join('') + '</div>' +
      '<div class="two" style="margin-top:8px"><div><label class="l" for="g-day">Day</label><select id="g-day">' + [7, 1, 2, 3, 4, 5, 6].map(function (d) { return '<option value="' + d + '"' + ((g.day || 7) === d ? ' selected' : '') + '>' + K.DAYS[d] + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="l" for="g-start">From</label><input class="inp" type="time" id="g-start" value="' + esc(g.start) + '"></div>' +
      '<div><label class="l" for="g-end">Until</label><input class="inp" type="time" id="g-end" value="' + esc(g.end) + '"></div>' +
      '<div><label class="l" for="g-ratio">Children per leader</label><input class="inp" type="number" min="1" max="30" id="g-ratio" value="' + esc(g.ratio || 8) + '"></div></div>' +
      '<p class="l" style="margin-top:8px">Leaders (they see this group\'s children, with medical details)</p><div id="g-leaders"></div>' +
      '<div class="two" style="margin-top:6px"><div><select id="g-addlead"><option value="">Add a leader…</option>' + PEOPLE.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('') + '</select></div></div>' +
      '<label class="ck"><input type="checkbox" id="g-active"' + (g.active !== false ? ' checked' : '') + '> Running</label>' +
      '<div style="margin-top:10px"><button class="btn" id="g-save">Save</button></div></div>';
    drawLeaders();
    document.getElementById('g-addlead').onchange = function () { if (this.value && leaders.indexOf(this.value) < 0) leaders.push(this.value); this.value = ''; drawLeaders(); };
    document.getElementById('g-save').onclick = function () {
      var d = { siteId: V.site, name: document.getElementById('g-name').value.trim().slice(0, 80), roomId: document.getElementById('g-room').value,
        years: [].slice.call(document.querySelectorAll('.g-year:checked')).map(function (x) { return x.value; }), day: +document.getElementById('g-day').value,
        start: document.getElementById('g-start').value, end: document.getElementById('g-end').value,
        ratio: Math.max(1, Math.min(30, parseInt(document.getElementById('g-ratio').value, 10) || 5)), active: document.getElementById('g-active').checked,
        leaderIds: leaders, order: g.order || GROUPS.length + 1, updatedAt: new Date().toISOString(), updatedBy: uid() };
      if (!d.name) { toast('It needs a name'); return; }
      var id = g.id || 'kg_' + E.key(10);
      db().collection('kidsGroups').doc(id).set(d).then(function () {
        /* Children not moved by hand follow their school year into it, and
           their medical copies with them. */
        var b = db().batch(), n = 0, groups = GROUPS.filter(function (x) { return x.id !== id; }).concat([Object.assign({ id: id }, d)]);
        CHILDREN.forEach(function (c) { var to = K.groupFor(c, groups); if (!c.groupFixed && to !== c.groupId) { setGroup(b, c, to); n++; } });
        return n ? b.commit() : null;
      }).then(function () { toast('Saved'); return load(); }).catch(function (e) { toast('Could not save: ' + (e.message || e)); });
    };
  }

  /* ---- settings ---- */
  function drawSettings(el) {
    var teams = SETTINGS.teams || [], STD = ['Kids Church', 'Lazers', 'ReNu', 'Youth Worship'];
    el.innerHTML = '<div class="card"><h2>The children\'s teams</h2><p class="hint">The admins of these rota teams are the leads: they see every child at this site. ' +
      'Master admins and the safeguarding lead always can. Everyone else sees only the group they lead (Groups tab).</p>' +
      STD.concat(teams.filter(function (t) { return STD.indexOf(t) < 0; })).map(function (t) {
        return '<label class="ck"><input type="checkbox" class="s-team" value="' + esc(t) + '"' + (teams.indexOf(t) >= 0 ? ' checked' : '') + (CAN_TEAMS ? '' : ' disabled') + '> ' + esc(t) + '</label>'; }).join('') +
      (CAN_TEAMS ? '<div class="two" style="margin-top:6px"><div><input class="inp" id="s-other" placeholder="Another team, exactly as the rota names it"></div></div><div style="margin-top:10px"><button class="btn" id="s-save">Save</button></div>'
        : '<p class="hint">A master admin or the safeguarding lead changes these.</p>') + '</div>' +
      '<div class="card"><h2>The registration form</h2>' + (SETTINGS.formId ? '<p class="st ok" id="s-form">Set up: "' + esc(SETTINGS.formTitle || 'Children\'s registration') + '". Its wording is changed on the Forms page; its periods on Safeguarding settings.</p>'
        : (EGBCAuth.isAdmin() && CAN_TEAMS ? '<p class="hint">Made from the parent and guardian consent form: each child, their medical needs, who may collect. It lasts a year from when it is given.</p><button class="btn" id="s-form-go">Set up the registration form</button>'
          : '<p class="hint">A master admin sets this up (it makes a form).</p>')) + '</div>';
    var sv = document.getElementById('s-save');
    if (sv) sv.onclick = function () {
      var t = [].slice.call(document.querySelectorAll('.s-team:checked')).map(function (x) { return x.value; });
      var o = document.getElementById('s-other').value.trim(); if (o) t.push(o.slice(0, 60));
      db().collection('kidsSettings').doc(V.site).set({ teams: t, updatedAt: new Date().toISOString(), updatedBy: uid() }, { merge: true })
        .then(function () { toast('Saved'); return begin(); }).catch(function (e) { toast('Could not save: ' + (e.message || e)); });
    };
    /* Term dates (Martin, F-098): three a year, set by a lead; the registers use them. */
    if (LEAD) {
      var y = +new Date().toISOString().slice(0, 4), m = +new Date().toISOString().slice(5, 7), sy = m >= 9 ? y : y - 1;
      var def = TERMS.length === 3 ? TERMS : [{ name: 'Autumn ' + sy, from: sy + '-09-01', to: sy + '-12-31' }, { name: 'Spring ' + (sy + 1), from: (sy + 1) + '-01-01', to: (sy + 1) + '-03-31' },
        { name: 'Summer ' + (sy + 1), from: (sy + 1) + '-04-01', to: (sy + 1) + '-08-31' }];
      el.insertAdjacentHTML('beforeend', '<div class="card" id="t-card"><h2>Term dates</h2><p class="hint">' + (TERMS.length === 3 ? 'The registers count these terms. Change them each year.' : 'Not set yet: the registers are guessing (September to December, January to March, April to August). Set this year\'s dates.') + '</p>' +
        def.map(function (t, i) {
          return '<div class="two" style="margin-bottom:6px"><div><label class="l" for="t-name-' + i + '">Term</label><input class="inp" id="t-name-' + i + '" maxlength="40" value="' + esc(t.name) + '"></div>' +
            '<div><label class="l" for="t-from-' + i + '">Starts</label><input class="inp" type="date" id="t-from-' + i + '" value="' + esc(t.from) + '"></div>' +
            '<div><label class="l" for="t-to-' + i + '">Ends</label><input class="inp" type="date" id="t-to-' + i + '" value="' + esc(t.to) + '"></div></div>';
        }).join('') + '<div id="t-err"></div><button class="btn" id="t-save">Save the term dates</button></div>');
      document.getElementById('t-save').onclick = function () {
        var terms = [0, 1, 2].map(function (i) { return { name: document.getElementById('t-name-' + i).value.trim().slice(0, 40), from: document.getElementById('t-from-' + i).value, to: document.getElementById('t-to-' + i).value }; });
        var bad = terms.some(function (t) { return !t.name || !t.from || !t.to || t.from > t.to; }) || !(terms[0].to < terms[1].from && terms[1].to < terms[2].from);
        if (bad) { document.getElementById('t-err').innerHTML = '<p class="st no">Each term needs a name, and a start before its end, in order, without overlapping.</p>'; return; }
        db().collection('kidsTerms').doc(V.site).set({ terms: terms, updatedAt: new Date().toISOString(), updatedBy: uid() })
          .then(function () { toast('Saved'); return load(); }).catch(function (e) { toast('Could not save: ' + (e.message || e)); });
      };
    }
    var fg = document.getElementById('s-form-go');
    if (fg) fg.onclick = function () {
      db().collection('safeguardingSettings').doc('defaults').get().catch(function () { return null; }).then(function (s) {
        var t = F.fromTemplate('parent', s && s.exists ? s.data() : null), id = 'form_kids_' + V.site;
        var d = { title: 'Children\'s registration', purpose: t.purpose, siteId: V.site, team: (SETTINGS.teams || [])[0] || '', validity: t.validity, retentionMonths: t.retentionMonths, fields: t.fields,
          template: 'parent', kind: t.kind || 'consent', version: 1, updatedAt: new Date().toISOString(), updatedBy: uid() };
        return db().collection('forms').doc(id).set(d).then(function () {
          return db().collection('kidsSettings').doc(V.site).set({ formId: id, formTitle: d.title, teams: SETTINGS.teams || [] }, { merge: true });
        });
      }).then(function () { toast('The registration form is set up'); return begin(); }).catch(function (e) { toast('Could not: ' + (e.message || e)); });
    };
  }

  /* ---- who am I, for this site ---- */
  function start() {
    var s = SITES.filter(function (x) { return x.id === V.site; })[0] || {};
    SETTINGS = s._settings || {};
    LEAD = !!s._lead; CAN_TEAMS = !!(ME.masterAdmin || s._sg);
    return load().catch(function () { noAccess(); });
  }
  function begin() {
    var mid = ME.memberId || '-', adminFor = ME.adminFor || [];
    return Promise.all([db().collection('sites').get(), db().collection('rooms').get(), db().collection('bookingSettings').get().catch(function () { return { docs: [] }; }),
                        db().collection('kidsSettings').get().catch(function () { return { docs: [] }; }),
                        db().collection('kidsGroups').where('leaderIds', 'array-contains', mid).get().catch(function () { return { docs: [] }; }),
                        db().collection('addressBook').get().catch(function () { return { docs: [] }; })]).then(function (r) {
      var bs = {}, ks = {};
      all(r[2]).forEach(function (s) { bs[s.id] = s; }); all(r[3]).forEach(function (s) { ks[s.id] = s; });
      MYGROUPS = all(r[4]);
      PEOPLE = all(r[5]).map(function (p) { return { id: p.id, name: String(p.name || p.fullName || '').trim() }; }).filter(function (p) { return p.name; })
        .sort(function (a, b) { return a.name.localeCompare(b.name); });
      /* Not set up yet: no site in Places, or no children's team chosen. */
      var live = all(r[0]).filter(function (s) { return s.active !== false; });
      var anyTeam = live.some(function (s) { return ((ks[s.id] || {}).teams || []).length > 0; });
      var canChoose = !!ME.masterAdmin || live.some(function (s) { var b = bs[s.id] || {}; return b.safeguardingLead === mid || b.safeguardingDeputy === mid; });
      if (!live.length || (!anyTeam && !canChoose)) return notSetUp(!live.length, canChoose);
      /* No team yet, but this person chooses it: straight to Settings. */
      if (!anyTeam && V.tab === 'children') V.tab = 'settings';
      SITES = all(r[0]).filter(function (s) { return s.active !== false; }).map(function (s) {
        s._settings = ks[s.id] || {};
        s._sg = (bs[s.id] || {}).safeguardingLead === mid || (bs[s.id] || {}).safeguardingDeputy === mid;
        s._lead = !!(ME.masterAdmin || s._sg || (s._settings.teams || []).some(function (t) { return adminFor.indexOf(t) >= 0; }));
        s._leader = MYGROUPS.some(function (g) { return g.siteId === s.id; });
        return s;
      }).filter(function (s) { return s._lead || s._leader; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      ROOMS = all(r[1]);
      if (!SITES.length) return noAccess();
      if (!SITES.some(function (s) { return s.id === V.site; })) V.site = SITES[0].id;
      return start();
    });
  }

  EGBCAuth.require().then(function (profile) {
    ME = profile || {};
    return begin();
  }).catch(function (e) { document.getElementById('main').innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
})();
</script>
</body>
</html>
