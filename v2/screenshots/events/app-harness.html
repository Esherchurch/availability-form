<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App harness (tests only)</title>
<!-- TEST ONLY. The main window's real app shell (egbc-app.js, styles from
     app.html) with the events window's screens mounted on it the way the
     shell will mount them (EGBCAppEvents.mountAll), so the screens are
     tested inside the shell they will live in. Not a live page.
     Built by the events window's harness script; ?space=&tab= opens one. -->
<script src="../../egbc-nosend.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../../egbc-auth.js"></script>
<script src="../../egbc-church.js"></script>
<script src="../../egbc-email.js"></script>
<script src="../../egbc-ics.js"></script>
<script src="../../egbc-events.js"></script>
<script src="../../egbc-events-kids.js"></script>
<script src="../../egbc-events-checkin.js"></script>
<script src="../../egbc-events-bookings.js"></script>
<script src="../../egbc-events-groups.js"></script>
<script src="../../egbc-events-qr.js"></script>
<script src="../../egbc-events-home.js"></script>
<script src="../../egbc-notify-core.js"></script>
<script src="../../egbc-notify.js"></script>
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --card:0 1px 2px rgba(16,24,40,.05);--sp:var(--brand);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

  /* The three rows: chrome, the scrolling middle, the tabs. The middle is the
     only thing that scrolls, so the tab bar never leaves the screen. */
  #egbc-app{display:grid;grid-template-rows:auto 1fr auto;height:100%;max-width:520px;margin:0 auto;background:#fff}

  .top{background:#fff;border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0}
  .top-row{display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
  .logo{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--sp)}
  .top-title{font-size:13px;font-weight:500;color:var(--muted);flex:1}

  /* The spaces, as a scrolling row of pills under the header. Not a menu. */
  .spaces{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
  .spaces::-webkit-scrollbar{display:none}
  .space{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
         border:1px solid var(--line-2);border-radius:8px;background:#fff;color:var(--body);
         font:500 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
  .space[aria-pressed="true"]{border-color:var(--sp);color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--sp)}
  .space .dot{width:8px;height:8px;border-radius:50%;flex:none}

  .content{overflow-y:auto;padding:16px 16px 20px;display:grid;gap:14px;align-content:start}
  .hello{font-size:22px;font-weight:700;color:var(--ink);margin:0}
  .sub{font-size:13px;color:var(--muted);margin:2px 0 0}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card)}
  .card.list{display:grid}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;
       border:0;border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer;
       font:400 14px Inter,sans-serif;color:var(--body);min-height:56px}
  .card.list .row:last-child{border-bottom:0}
  .row:active{background:#f3f4f6}
  .row .ic{width:36px;height:36px;border-radius:8px;background:var(--tint);color:var(--c,var(--sp));
           display:grid;place-items:center;flex:none}
  .row .tx{flex:1;min-width:0;display:grid;gap:1px}
  .row .tx b{font-size:14px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
  .row .tx small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .row .chev{color:var(--faint);flex:none}

  .sec{display:grid;gap:8px}
  .sec-h{display:flex;align-items:baseline;gap:10px}
  .sec-h h3{font-size:15px;font-weight:600;color:var(--ink);margin:0;flex:1}
  .sec-h button{background:none;border:0;color:var(--sp);font:500 13px Inter,sans-serif;cursor:pointer;padding:4px}

  .next{padding:14px}
  .next-top{display:flex;gap:12px;align-items:flex-start}
  .date{width:48px;text-align:center;flex:none}
  .date b{display:block;font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
  .date span{font-size:11px;color:var(--muted)}
  .next h4{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
  .next p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

  /* Pills and small notes, which the screens use and the shell owns
     (F-141.3). The events window ships a :where() fallback so its screens
     are never unstyled; these are plain selectors, so they win over it.
     12px, not the mock-up's 11.5px - DESIGN.md's floor, and the style
     check measures it.

     A pill is a CHIP, not a control: a round-ended <span> saying "Today" or
     "3 waiting". The style check flags a 999px radius only on buttons and
     inputs, which is the distinction DESIGN.md draws too. */
  .pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;
        padding:3px 8px;border-radius:999px;white-space:nowrap;
        background:var(--ok-bg,#ecfdf3);color:var(--ok,#15803d)}
  .pill.warn{background:#fdf8ee;color:#b07d2e}
  .pill.n{background:var(--tint,#eef5f4);color:var(--brand,#3d6263)}
  .example{font-size:12px;color:var(--muted);text-align:center;margin:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;
       padding:0 14px;border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;
       border:1px solid var(--line-2);background:#fff;color:var(--ink)}
  .btn.primary{background:var(--sp);border-color:var(--sp);color:#fff}

  .empty{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);
         font-size:13px;padding:26px 8px;margin:0}
  .empty i{color:var(--faint)}

  /* THE TAB BAR, and the numbers are APP-DESIGN-BRIEF §7's.
       - a 22px icon, a 2px gap and an 11.5px label inside 10px of padding
         comes to about 58px a tab, against the 48px asked for
       - below it, 26px plus whatever the phone says its own navigation
         needs: nothing on Android 3-button, about 24px on gesture
         navigation, about 34px on an iPhone with a home indicator */
  .tabs{display:grid;grid-template-columns:repeat(var(--n,4),1fr);background:#fff;
        border-top:1px solid var(--line);padding:6px 4px calc(26px + env(safe-area-inset-bottom,0px))}
  .tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:10px 0;
       font:500 11.5px Inter,sans-serif;color:var(--muted);cursor:pointer}
  .tab[aria-current="page"]{color:var(--sp)}
  .tab[aria-current="page"] svg{stroke-width:2.25}

  .sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:60}
  .sheet{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;
         padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;
         max-height:85%;overflow-y:auto}
  .sheet h3{margin:0;font-size:17px;font-weight:600;color:var(--ink)}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 2px}

  /* Clear of the tab bar as well as the phone's own navigation. */
  .toast{position:fixed;left:16px;right:16px;max-width:488px;margin:0 auto;
         bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;
         padding:10px 14px;border-radius:8px;font-size:13px;z-index:70;text-align:center}
</style>
</head>
<body>
<div id="egbc-app"></div>
<script src="../../egbc-app.js?v=202610101200"></script>
<script src="../../egbc-app-events.js"></script>
<script src="../../egbc-app-kids.js"></script>
<script src="../../egbc-app-listen.js"></script>
<script src="../../egbc-app-whatson.js"></script>
<script src="../../egbc-app-maint.js"></script>
<script src="../../egbc-app-office.js"></script>
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  EGBCAuth.require().then(function () {
    EGBCAppEvents.mountAll(EGBCApp);
    EGBCApp.start();
    if (Q.get('space')) EGBCApp.go(Q.get('space'), Q.get('tab') || '');
    window.__harnessReady = true;
  });
})();
</script>
</body>
</html>
