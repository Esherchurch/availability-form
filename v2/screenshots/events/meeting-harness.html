<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meeting (test stand-in)</title>
<!-- A STAND-IN FOR meeting.html (the main window's page) in the events
     window's checks: meeting.html's own CSS, a pretend call in #stage (no Daily
     in a test), and the hook exactly as F-247 agrees it, with its scripts:
     Storage before egbc-auth.js (so the hub connects it), and egbc-present.js.
       ?room=Eldership&event=<id>&host=1 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- the hook, script 1 of 2 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../../egbc-auth.js"></script>
<!-- the hook, script 2 of 2 -->
<script src="../../egbc-present.js"></script>
<!-- meeting.html's OWN styles, read from it as it is now (so a clash between
     its classes - .row, .msg, .btn - and Present's shows up here too; 22 Oct:
     the sheet's Close sat faded in meeting.html's white .row) -->
<script>
  (function () {
    var x = new XMLHttpRequest(); x.open('GET', '../../meeting.html', false); x.send();
    var m = /<style>([\s\S]*?)<\/style>/.exec(x.responseText || '');
    if (!m) throw new Error('meeting.html has no <style> block to copy');
    var st = document.createElement('style'); st.id = 'meeting-css'; st.textContent = m[1]; document.head.appendChild(st);
  })();
</script>
<style>
  #bar{height:56px;flex:0 0 56px;display:flex;align-items:center;font-weight:600;color:#111827}
</style>
</head>
<body class="in-call">
<div id="bar">Eldership meeting (invented)</div>
<!-- the hook, line 1: a div beside the call -->
<div id="present"></div>
<div id="stage"><iframe id="call" title="The call" srcdoc="<body style='margin:0;background:#1f2937;color:#fff;font:600 14px sans-serif;display:grid;place-items:center;height:100vh'>The faces (Daily's tiles)</body>"></iframe></div>
<script>
  var Q = new URLSearchParams(location.search);
  EGBCAuth.require().then(function () {
    /* the hook, line 2 - in meeting.html after the call is made */
    window.MEET = EGBCPresent.attachMeeting({ room: Q.get('room') || 'Eldership', eventId: Q.get('event') || '', el: document.getElementById('present'),
      call: document.getElementById('stage'), host: Q.get('host') === '1' });
    window.__ready = true;
  });
</script>
</body>
</html>
