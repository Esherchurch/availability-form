<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meeting (test stand-in)</title>
<!-- A STAND-IN FOR meeting.html (the main window's page) in the events
     window's checks: the same layout CSS, a pretend call in #stage (no Daily
     in a test), and the hook exactly as F-247 agrees it, with its scripts:
     Storage before egbc-auth.js (so the hub connects it), and egbc-present.js.
       ?room=Eldership&event=<id>&host=1 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- the hook, script 1 of 2 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../../egbc-auth.js"></script>
<!-- the hook, script 2 of 2 -->
<script src="../../egbc-present.js"></script>
<style>
  html,body{height:100%}
  body{margin:0;padding:0 12px 12px;background:#f6f7f7;font-family:Inter,system-ui,sans-serif;font-size:14px;color:#374151;display:flex;flex-direction:column;box-sizing:border-box}
  #bar{height:56px;flex:0 0 56px;display:flex;align-items:center;font-weight:600;color:#111827}
  #stage{flex:1;min-height:420px;border-radius:12px;overflow:hidden;isolation:isolate;clip-path:inset(0 round 12px);background:#fff;border:1px solid #e5e7eb;position:relative}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}
  body.in-call #stage{min-height:0}
  @media(max-width:700px){body{padding:0 8px 8px}}
</style>
</head>
<body class="in-call">
<div id="bar">Eldership meeting (invented)</div>
<!-- the hook, line 1: a div beside the call -->
<div id="present"></div>
<div id="stage"><iframe id="call" title="The call" srcdoc="<body style='margin:0;background:#1f2937;color:#fff;font:600 14px sans-serif;display:grid;place-items:center;height:100vh'>The faces (Daily's tiles)</body>"></iframe></div>
<script>
  var Q = new URLSearchParams(location.search);
  EGBCAuth.require().then(function () {
    /* the hook, line 2 - in meeting.html after the call is made */
    window.MEET = EGBCPresent.attachMeeting({ room: Q.get('room') || 'Eldership', eventId: Q.get('event') || '', el: document.getElementById('present'),
      call: document.getElementById('stage'), host: Q.get('host') === '1' });
    window.__ready = true;
  });
</script>
</body>
</html>
