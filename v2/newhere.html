<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I'm new here</title>
<!-- "I'M NEW HERE" (NEXT-BRIEF §24 item 12; F-167), feature name 'newHere'.
     A welcome card for visitors, who are usually not signed in: say hello,
     and ask to be contacted if they would like. NOTHING IS STORED UNLESS
     THEY PRESS SEND - not even a draft on the phone. A hello goes to the
     people the church chooses (welcomeSettings/main) in the hub, and by
     email to the address the church chooses (welcomeSettings/public). -->
<script src="egbc-nosend.js?v=202611011200"></script>
<script src="egbc-appmode.js?v=202611011200"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202611011200"></script>
<script src="egbc-help.js?v=202610281800"></script>
<script src="egbc-launch.js?v=202610141700"></script>
<script src="egbc-email.js?v=202610212000"></script>
<script src="egbc-church.js?v=202611011200"></script>
<script src="egbc-events.js?v=202610281600"></script>
<script src="egbc-speak.js?v=202610141400"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;--muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;--ok:#15803d;--ok-bg:#ecfdf3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 16px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(72px + env(safe-area-inset-bottom))}
  .head{display:flex;align-items:center;gap:10px;margin:0 0 12px}.head img{width:40px;height:40px;object-fit:contain;border-radius:8px}
  .head b{font-size:15px;color:var(--ink)}
  h1{font-size:26px;font-weight:700;color:var(--ink);margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .card h2{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 8px}
  label.l{display:block;font-size:15px;font-weight:500;color:var(--ink);margin:12px 0 5px}
  .inp,textarea{width:100%;min-height:50px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font:400 16px Inter,sans-serif;color:var(--ink);background:#fff}
  textarea{padding:10px 12px;min-height:100px;line-height:1.5}
  .hint{font-size:14px;color:var(--muted)}
  .radio{display:flex;gap:10px;align-items:center;margin:2px 0;min-height:44px}.radio input{width:18px;height:18px;flex:none}
  .speak{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:8px;border-radius:12px;border:2px solid var(--brand);background:var(--tint);color:var(--brand-dark);font:700 18px Inter,sans-serif;cursor:pointer}
  .speak[aria-pressed="true"]{background:#b0392c;border-color:#b0392c;color:#fff}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border-radius:12px;font:600 16px Inter,sans-serif;cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}.btn.small{min-height:40px;font-size:14px;padding:0 12px}
  .btn:disabled{opacity:.55}
  .btn.closed:disabled{opacity:1;background:#e5e7eb;color:#374151;border-color:#d1d5db;cursor:not-allowed;white-space:normal;text-align:center}
  .danger999{font-size:15px;font-weight:600;color:#111827;margin:12px 0 8px}
  .done{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:14px;font-size:16px}
  .err{color:#b0392c;font-size:14px;margin:8px 0 0}
  .okmsg{color:var(--ok);font-size:14px;margin:8px 0 0}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .item{padding:12px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:none}
  .item .m{font-size:13px;color:var(--muted)}.item .w{white-space:pre-wrap;overflow-wrap:break-word;color:var(--ink)}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--tint);color:var(--brand)}.pill.ok{background:var(--ok-bg);color:var(--ok)}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="head" id="head"></div>
  <div id="main"><div class="card">Loading…</div></div>
  <div id="team"></div>
</div>
<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, esc = E.esc;
  var opened = Date.now(), ME = null, MAY = false, MASTER = false, SET = { memberIds: [] }, PUB = { notifyEmail: '' }, HELLOS = [], PEOPLE = {};
  function db() { return EGBCAuth.db; }
  function $(id) { return document.getElementById(id); }
  function val(id) { var e = $(id); return e ? String(e.value || '').trim() : ''; }
  function now() { return firebase.firestore.FieldValue.serverTimestamp(); }
  /* EVERY SAVE SAYS WHETHER IT WORKED (Martin, 14 Oct: "Save the address"
     did nothing on the live hub, and the page said nothing either). The
     words stay after the card is drawn again. */
  var SAID = {};
  function said(id, text, ok) { SAID[id] = { text: text, ok: ok }; var el = $(id); if (el) { el.textContent = text; el.className = ok ? 'okmsg' : 'err'; } }
  function saidHtml(id) { var s = SAID[id]; return '<p id="' + id + '" role="status" class="' + (s ? (s.ok ? 'okmsg' : 'err') : 'okmsg') + '">' + (s ? esc(s.text) : '') + '</p>'; }
  function saved(id, text) { return function () { said(id, text, true); return loadTeam(); }; }
  function refused(id) {
    return function (e) {
      var m = String((e && (e.code || e.message)) || e);
      said(id, /permission/i.test(m) ? 'Not saved: the hub would not accept it. Only a master admin can change this - if you are one, tell whoever looks after the hub.' : 'Not saved: ' + m, false);
    };
  }
  function all(s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }

  /* Before switch-over (Martin, 15 Oct) the whole form shows, so people
     can see what it asks; only Send is shut, with the 999 line above it. */
  function card(L) {
    var closed = L && !L.locked;
    var church = EGBCChurch.name() || 'our church';
    return '<h1>Welcome!</h1><p class="sub">We are glad you are here. Say hello, and if you would like, someone from ' + esc(church) + ' will get in touch.</p>' +
      '<form class="card" id="f" novalidate>' +
      '<label class="l" for="n-name">Your name</label><input class="inp" id="n-name" maxlength="120" autocomplete="name"' + (ME && ME.name ? ' value="' + esc(ME.name) + '"' : '') + '>' +
      '<label class="l">Would you like someone to get in touch?</label>' +
      '<label class="radio"><input type="radio" name="n-contact" value="yes" checked><span>Yes please</span></label>' +
      '<label class="radio"><input type="radio" name="n-contact" value="no"><span>No thanks, just saying hello</span></label>' +
      '<label class="l" for="n-email">Email</label><input class="inp" id="n-email" type="email" maxlength="200" autocomplete="email"' + (ME && ME.email ? ' value="' + esc(ME.email) + '"' : '') + '>' +
      '<label class="l" for="n-phone">Or phone</label><input class="inp" id="n-phone" type="tel" maxlength="40" autocomplete="tel">' +
      '<p class="hint" style="margin:6px 0 0">One of the two is enough, so we can reply.</p>' +
      '<label class="l" for="n-msg">Anything you would like to tell us or ask? (optional)</label>' +
      '<textarea id="n-msg" maxlength="2000"></textarea>' +
      '<button class="speak" id="n-speak" type="button" aria-pressed="false">🎤 Speak</button><p class="hint" id="n-said" role="status"></p>' +
      '<div class="hp" aria-hidden="true"><label>Leave this empty<input id="website" tabindex="-1" autocomplete="off"></label></div>' +
      '<p class="hint">We keep only what you send, to reply to you. Nothing is saved until you press Send.</p>' +
      '<div id="n-err"></div>' +
      (closed ? '<p class="danger999" id="n-999">' + esc((window.EGBCLaunch ? EGBCLaunch.DANGER : 'If someone is in immediate danger, call 999.') + ' Until then, please speak to someone from ' + church + ' in person.') + '</p>' +
        '<button class="btn closed" id="n-go" type="submit" disabled aria-disabled="true">' + esc('Sending opens ' + (L.opensOn ? 'on ' + L.opensOn : 'when the new church hub opens')) + '</button>'
        : '<button class="btn" id="n-go" type="submit">Send</button>') + '</form>';
  }
  /* F-179: until the locked rules are on (churchSettings/launch.rulesLocked),
     a hello saved here could be read by anyone, so none is. Asked when the
     page opens, and again at the moment of sending. Readable signed out. */
  function launch() { return window.EGBCLaunch ? EGBCLaunch.check() : Promise.resolve({ locked: false, opensOn: '' }); }
  function notYetCard(L) {
    var church = EGBCChurch.name() || 'our church';
    return '<h1>Welcome!</h1><p class="sub">We are glad you are here.</p>' +
      '<div class="card"><p id="not-yet" role="status">' + esc(window.EGBCLaunch ? EGBCLaunch.notYet(L.opensOn) : 'This form is not open yet.') + '</p>' +
      '<p class="hint">' + esc('Or say hello to someone from ' + church + ' on a Sunday - we would love to meet you.') + '</p></div>';
  }
  function fail(m) { $('n-err').innerHTML = '<p class="err">' + esc(m) + '</p>'; $('n-go').disabled = false; }

  function send(ev) {
    ev.preventDefault();
    var name = val('n-name'), email = val('n-email').toLowerCase(), phone = val('n-phone'), msg = val('n-msg');
    var contact = ((document.querySelector('input[name="n-contact"]:checked') || {}).value || 'yes') === 'yes';
    if (val('website')) { fail('Sorry, that did not go through.'); return; }
    if (Date.now() - opened < 2500) { fail('Please take a moment to check it, then press Send again.'); return; }
    if (!name) { fail('Please give your name'); return; }
    if (contact && !email && !phone) { fail('Please give an email or a phone number, so we can get in touch'); return; }
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { fail('That email does not look right'); return; }
    $('n-go').disabled = true;
    var user = EGBCAuth.user && EGBCAuth.user();
    var hello = { name: name.slice(0, 120), email: email.slice(0, 200), phone: phone.slice(0, 40), message: msg.slice(0, 2000), contactMe: contact,
      uid: user ? user.uid : '', at: now(), status: 'new' };
    launch().then(function (L) {
      if (!L.locked) { $('main').innerHTML = notYetCard(L); return; }
      return sendHello(hello, name, contact);
    });
  }
  function sendHello(hello, name, contact) {
    /* The copy by email to the address the church chose, so nothing waits on
       somebody opening the hub, is sent by the hub's server once this is saved
       (functions/public-mail.js, F-168, F-170): a page with nobody signed in
       may not send email. */
    db().collection('welcomes').add(hello).then(function () {
      $('main').innerHTML = '<div class="card"><div class="done" id="thanks">Thank you, ' + esc(name) + '. ' + (contact ? 'Someone will be in touch soon.' : 'It is lovely to have you with us.') + '</div></div>';
    }).catch(function (e) { fail('That could not be sent just now. Please try again in a moment.'); });
  }

  /* For the welcomers the church chose, and master admins: the hellos. */
  function teamCard() {
    var people = Object.keys(PEOPLE).map(function (k) { return { id: k, name: PEOPLE[k] }; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    return '<div class="card" id="hellos"><h2>Hellos</h2>' + (HELLOS.length ? HELLOS.map(function (h) {
      var d = h.at && h.at.toDate ? h.at.toDate() : null;
      return '<div class="item" data-hello="' + esc(h.id) + '"><b>' + esc(h.name) + '</b> ' + (h.contactMe ? '<span class="pill">would like contact</span>' : '<span class="pill">just hello</span>') +
        (h.status === 'contacted' ? ' <span class="pill ok">contacted</span>' : '') +
        '<div class="m">' + esc([h.email, h.phone, d ? E.fmtDateShort(d.toISOString()) : ''].filter(Boolean).join(' · ')) + '</div>' +
        (h.message ? '<div class="w">' + esc(h.message) + '</div>' : '') +
        (h.status !== 'contacted' ? '<button class="btn sec small" data-done="' + esc(h.id) + '" style="margin-top:6px">Mark contacted</button>' : '') + '</div>';
    }).join('') : '<p class="hint">None yet.</p>') + saidHtml('h-msg') + '</div>' +
      (MASTER ? '<div class="card" id="w-settings"><h2>Who hellos go to</h2>' +
        '<p class="hint" style="margin:0 0 6px">These people see the hellos here. One email address also gets each one (leave empty for the church\'s enquiry address).</p>' +
        ((SET.memberIds || []).map(function (m) { return '<div class="item"><b>' + esc(PEOPLE[m] || m) + '</b> <button class="btn sec small" data-unwelcomer="' + esc(m) + '">Remove</button></div>'; }).join('') || '<p class="hint">Nobody yet: only master admins.</p>') +
        '<label class="l" for="w-who">Add someone</label><input class="inp" id="w-who" list="w-people" placeholder="Start typing a name"><datalist id="w-people">' +
        people.map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join('') + '</datalist>' +
        '<button class="btn sec small" id="w-add" style="margin-top:6px">Add</button>' +
        '<label class="l" for="w-email">Email them to</label><input class="inp" id="w-email" type="email" maxlength="200" value="' + esc(PUB.notifyEmail || '') + '" placeholder="' + esc(EGBCChurch.email() || 'welcome@…') + '">' +
        '<button class="btn sec small" id="w-email-go" style="margin-top:6px">Save the address</button>' + saidHtml('w-msg') + '</div>' : '');
  }
  function drawTeam() {
    $('team').innerHTML = teamCard();
    document.querySelectorAll('[data-done]').forEach(function (b) { b.onclick = function () {
      db().collection('welcomes').doc(b.dataset.done).update({ status: 'contacted', handledBy: EGBCAuth.user().uid, handledAt: now() }).then(saved('h-msg', 'Marked as contacted.'), refused('h-msg'));
    }; });
    document.querySelectorAll('[data-unwelcomer]').forEach(function (b) { b.onclick = function () { setWelcomers((SET.memberIds || []).filter(function (m) { return m !== b.dataset.unwelcomer; })); }; });
    if ($('w-add')) $('w-add').onclick = function () { var id = Object.keys(PEOPLE).filter(function (k) { return PEOPLE[k] === val('w-who'); })[0]; if (id) setWelcomers((SET.memberIds || []).concat([id])); };
    if ($('w-email-go')) $('w-email-go').onclick = function () {
      var e = val('w-email').toLowerCase();
      if (e && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { said('w-msg', 'That email address does not look right.', false); return; }
      said('w-msg', 'Saving…', true);
      db().collection('welcomeSettings').doc('public').set({ notifyEmail: e, updatedAt: now(), updatedBy: EGBCAuth.user().uid })
        .then(saved('w-msg', e ? 'Saved: hellos are emailed to ' + e + '.' : 'Saved: hellos are emailed to the church\'s enquiry address.'), refused('w-msg'));
    };
  }
  function setWelcomers(ids) {
    /* No hidden limit (H-9): 500, the most one list holds, and it says so. */
    var uniq = ids.filter(function (x, i) { return ids.indexOf(x) === i; });
    if (uniq.length > 500) { var m = document.getElementById('w-msg'); if (m) m.textContent = 'Not saved: at most 500 people can see the hellos. Take some off first.'; return; }
    db().collection('welcomeSettings').doc('main').set({ memberIds: uniq, updatedAt: now(), updatedBy: EGBCAuth.user().uid })
      .then(saved('w-msg', 'Saved: who sees the hellos.'), refused('w-msg'));
  }
  function loadTeam() {
    return Promise.all([
      db().collection('welcomes').get(),
      db().collection('welcomeSettings').doc('main').get().catch(function () { return null; })
    ]).then(function (r) {
      HELLOS = all(r[0]).sort(function (a, b) { return ((b.at && b.at.toMillis && b.at.toMillis()) || 0) - ((a.at && a.at.toMillis && a.at.toMillis()) || 0); });
      SET = r[1] && r[1].exists ? r[1].data() : { memberIds: [] };
      drawTeam();
    }, function () { /* not a welcomer: nothing to show */ });
  }

  function start() {
    if (window.EGBCChurch && EGBCChurch.uses && !EGBCChurch.uses('newHere')) { $('main').innerHTML = '<div class="card">Not available.</div>'; return; }
    $('head').innerHTML = (EGBCChurch.logo() ? '<img src="' + esc(EGBCChurch.logo()) + '" alt="">' : '') + '<b>' + esc(EGBCChurch.name() || '') + '</b>';
    /* The form only once it is known to be open. The welcomers' card below
       is not a form a visitor fills in, so it shows either way. */
    launch().then(function (L) {
      $('main').innerHTML = card(L);
      opened = Date.now();
      EGBCSpeak.attach($('n-speak'), $('n-msg'), { status: $('n-said') });
      $('f').onsubmit = send;
    });
    /* A preview (view as) is nobody's welcomer: the hellos are not asked for. */
    if (ME && !E.viewing()) {
      MASTER = !!(EGBCAuth.isMaster && EGBCAuth.isMaster());
      (MASTER ? db().collection('addressBook').get().then(function (s) { s.docs.forEach(function (d) { var x = d.data(); if (x.name && !x.archived) PEOPLE[d.id] = x.name; }); }).catch(function () {}) : Promise.resolve()).then(loadTeam);
    }
  }
  /* Signed in or not: a visitor never has to sign in. */
  EGBCAuth.optional().then(function (p) { ME = p; return Promise.all([EGBCChurch.load(), db().collection('welcomeSettings').doc('public').get().catch(function () { return null; })]); })
    .then(function (r) { PUB = r[1] && r[1].exists ? r[1].data() : { notifyEmail: '' }; start(); })
    .catch(function () { start(); });
})();
</script>
</body>
</html>
