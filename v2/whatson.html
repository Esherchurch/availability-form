<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's on</title>

<!-- The bar and menu. It copes with nobody being signed in: this page is
     public, and a visitor who has never heard of the hub lands here. -->
<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610062100" data-title="What's on"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-church.js?v=202610091200"></script>
<script src="egbc-ics.js?v=202610091200"></script>
<script src="egbc-email.js?v=202610062100"></script>
<script src="egbc-events.js?v=202610062100"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 64px}
  h1{font-size:24px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card)}
  .ev{display:flex;gap:14px;padding:16px;align-items:flex-start;text-align:left;width:100%;
      background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);
      margin-bottom:10px;cursor:pointer;font:inherit;color:inherit;
      transition:background .12s,border-color .12s}
  .ev:hover{background:#f9fafb;border-color:var(--line-2)}
  .ev:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  /* The card is a <button>, so everything inside it is a span - and a span
     is inline, which ran the date onto one line and the title into the
     time. Each part is a block. */
  .when{flex:none;width:58px;text-align:center;background:var(--tint);border-radius:8px;padding:8px 4px;display:block}
  .when span{display:block}
  .when .d{font-size:18px;font-weight:600;color:var(--ink);line-height:1.15}
  .when .m{font-size:12px;color:var(--brand);line-height:1.2}
  .when .w{font-size:11px;color:var(--muted);line-height:1.2}
  .ev .body{min-width:0;flex:1;display:block}
  .ev .t{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px;display:block}
  .ev .meta{font-size:13px;color:var(--muted);display:block}
  .thumb{flex:none;width:88px;height:62px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}

  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
       border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#f9fafb;margin-right:6px}
  .dot{width:8px;height:8px;border-radius:9999px;flex:none}
  .flag{display:inline-block;font-size:12px;font-weight:500;border-radius:6px;padding:1px 7px;margin-right:6px}
  .flag.full{background:#fdf1ef;color:#b0392c}
  .flag.left{background:var(--ok-bg);color:var(--ok)}
  .flag.held{background:#f3f4f6;color:var(--muted)}
  .flag.off{background:#fdf1ef;color:#b0392c}
  .flag.feat{background:var(--gold-bg);color:var(--gold)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
       border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent;
       background:var(--brand);color:#fff;text-decoration:none}
  .btn:hover{background:var(--brand-dark)}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.sec:hover{background:#f3f4f6}
  .btn.sm{height:32px;padding:0 11px;font-size:13px}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;
        border:1px solid var(--line-2);background:#fff;color:var(--body);font:500 13px Inter,sans-serif;cursor:pointer}
  .chip:hover{background:#f3f4f6}
  .chip.on{background:var(--tint);border-color:var(--brand);color:var(--ink)}
  .search{height:36px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font:400 14px Inter,sans-serif;
          color:var(--ink);background:#fff;min-width:190px;flex:1}
  .search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}

  .sec-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);
         margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px}
  .note{background:var(--tint);border:1px solid #cfe0de;border-radius:8px;padding:10px 12px;
        font-size:13px;color:var(--body);margin-bottom:16px}
  @media (max-width:420px){ .thumb{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <h1>What's on</h1>
  <p class="sub" id="sub">Everything coming up.</p>

  <div id="signedOutNote" class="note" style="display:none">
    You are seeing the public events. <a href="login.html" style="color:var(--brand)">Sign in</a> to see members' and team events too.
  </div>

  <div class="filters">
    <input id="q" class="search" type="search" placeholder="Search events" aria-label="Search events">
    <button class="btn sec sm" id="icsAll"><i data-lucide="calendar-plus" style="width:15px;height:15px"></i>Add to calendar</button>
  </div>
  <div class="filters" id="cats"></div>

  <div id="featured"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>

<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, esc = E.esc;
  var ALL = [], LOOK = { sites: {}, rooms: {}, venues: {} }, CAP = {};
  var filterCat = '', filterText = '';

  function catOf(ev) {
    return E.CATEGORIES.filter(function (c) { return c.id === (ev.category || 'other'); })[0] || E.CATEGORIES[7];
  }

  function placesNote(ev) {
    var c = CAP[ev.id];
    if (!ev.signupOn) return '';
    if (!c) return '';
    var left = E.placesLeft(c);
    if (left === null) return '';
    if (left <= 0) return '<span class="flag full">Full — waiting list</span>';
    if (left <= 5) return '<span class="flag left">' + left + ' place' + (left === 1 ? '' : 's') + ' left</span>';
    return '';
  }

  function row(ev) {
    var d = new Date(ev.startLocal || ev.startUtc);
    var cat = catOf(ev);
    var where = E.locationText(ev, LOOK);
    var img = ev.image ? '<img class="thumb" src="' + esc(ev.image) + '" alt="">' : '';
    return '<button class="ev" onclick="location.href=\'signup.html?event=' + esc(ev.id) + '\'">' +
      '<span class="when"><span class="w">' + E.fmtDateShort(d).split(' ')[0] + '</span>' +
      '<span class="d">' + d.getDate() + '</span>' +
      '<span class="m">' + E.fmtDateShort(d).split(' ')[2] + '</span></span>' +
      img +
      '<span class="body">' +
        '<span class="t">' + esc(ev.title || 'Untitled event') + '</span>' +
        '<span class="meta">' + esc(E.fmtWhen(ev)) + (where ? ' · ' + esc(where) : '') + '</span><br>' +
        '<span style="display:inline-block;margin-top:7px">' +
          (ev.featured ? '<span class="flag feat">Featured</span>' : '') +
          (ev.status === 'cancelled' ? '<span class="flag off">Cancelled</span>' : '') +
          (ev.status === 'pending' ? '<span class="flag held">Not public yet</span>' : '') +
          placesNote(ev) +
          '<span class="tag"><span class="dot" style="background:' + cat.colour + '"></span>' + esc(cat.name) + '</span>' +
          (ev.visibility === 'members' ? '<span class="tag">Members</span>' : '') +
          (ev.visibility === 'team' ? '<span class="tag">' + esc((ev.teams || []).join(', ')) + '</span>' : '') +
          (ev.labels || []).map(function (l) { return '<span class="tag">' + esc(l) + '</span>'; }).join('') +
        '</span>' +
      '</span></button>';
  }

  function matches(ev) {
    if (filterCat && (ev.category || 'other') !== filterCat) return false;
    if (filterText) {
      var hay = ((ev.title || '') + ' ' + (ev.description || '') + ' ' + (ev.labels || []).join(' ')).toLowerCase();
      if (hay.indexOf(filterText) === -1) return false;
    }
    return true;
  }

  function draw() {
    var shown = ALL.filter(matches);
    var feat = shown.filter(function (e) { return e.featured; });
    var rest = shown.filter(function (e) { return !e.featured; });

    document.getElementById('featured').innerHTML = feat.length
      ? '<div class="sec-h"><i data-lucide="star" style="width:15px;height:15px"></i>Featured</div>' + feat.map(row).join('')
      : '';
    document.getElementById('list').innerHTML = rest.length
      ? (feat.length ? '<div class="sec-h"><i data-lucide="calendar-days" style="width:15px;height:15px"></i>Everything else</div>' : '') + rest.map(row).join('')
      : (feat.length ? '' : '<div class="card empty">Nothing coming up here yet.</div>');

    if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
  }

  function drawCats() {
    var used = {};
    ALL.forEach(function (e) { used[e.category || 'other'] = true; });
    var html = '<button class="chip' + (filterCat ? '' : ' on') + '" data-cat="">All</button>';
    E.CATEGORIES.forEach(function (c) {
      if (!used[c.id]) return;
      html += '<button class="chip' + (filterCat === c.id ? ' on' : '') + '" data-cat="' + c.id + '">' +
              '<span class="dot" style="background:' + c.colour + '"></span>' + esc(c.name) + '</button>';
    });
    var el = document.getElementById('cats');
    el.innerHTML = html;
    el.querySelectorAll('.chip').forEach(function (b) {
      b.onclick = function () { filterCat = b.getAttribute('data-cat'); drawCats(); draw(); };
    });
  }

  document.getElementById('q').addEventListener('input', function (e) {
    filterText = (e.target.value || '').toLowerCase().trim(); draw();
  });

  document.getElementById('icsAll').onclick = function () {
    var shown = ALL.filter(matches).filter(function (e) { return e.status !== 'cancelled'; });
    if (!shown.length) return;
    EGBCICS.download('egbc-whats-on', EGBCICS.buildMany(shown.map(function (ev) {
      return {
        /* Left as it was (F-068): a calendar treats a new UID as a new entry. */
        uid: 'egbc-event-' + ev.id + '@esherchurch.org',
        title: ev.title, description: ev.description, location: E.locationText(ev, LOOK),
        start: ev.startLocal || ev.startUtc, end: ev.endLocal || ev.endUtc, allDay: !!ev.allDay
      };
    }), (EGBCChurch.name() ? EGBCChurch.name() + ' — ' : '') + "what's on"));
  };

  /* Wait for the sign-in state before asking for anything: which events
     may be listed depends on who is asking, and asking too early gets
     the public list for a member who should see more. */
  EGBCAuth.optional().then(function (p) {
    document.getElementById('signedOutNote').style.display = p ? 'none' : '';
    return Promise.all([E.listUpcoming({ limit: 300 }), E.lookups()]);
  }).then(function (r) {
    ALL = r[0]; LOOK = r[1];
    /* Places left is read per event; there is no list rule on capacity
       that would let one query cover them, and these are small. */
    return Promise.all(ALL.filter(function (e) { return e.signupOn; }).map(function (e) {
      return EGBCAuth.db.collection('capacity').doc(e.id).get()
        .then(function (s) { if (s.exists) CAP[e.id] = s.data(); })
        .catch(function () {});
    }));
  }).then(function () {
    drawCats(); draw();
  }).catch(function (e) {
    document.getElementById('list').innerHTML =
      '<div class="card empty">What\'s on could not be loaded.<br><span style="font-size:13px">' + esc(e.message || e) + '</span></div>';
  });
})();
</script>
</body>
</html>
