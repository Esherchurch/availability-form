<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments</title>
<!-- Taking money online through the church's OWN accounts (F-181; Martin,
     14 Oct 2026: "We are not taking the payments. We won't use our
     account."). The treasurer pastes the church's own Stripe key and webhook
     secret once; they go to the server and never come back to any page.
     For a master admin and the church's money team. Events window. -->
<script src="egbc-nosend.js?v=202610212000"></script>
<script src="egbc-shell.js?v=202610302000" data-title="Payments"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610302200"></script>
<script src="egbc-church.js?v=202610192330"></script>
<script src="egbc-events.js?v=202610281600"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#3d6263;--tint:#eef5f4;--ink:#111827;--body:#374151;--muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
        --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold-bg:#fdf8ee;--card:0 1px 2px rgba(16,24,40,.05)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:24px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:16px;margin-bottom:14px}
  .card h2{font-size:16px;font-weight:600;color:var(--ink);margin:0 0 10px}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:10px 0 5px}
  .inp{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;font:500 14px Inter,sans-serif;cursor:pointer;
       border:1px solid transparent;background:var(--brand);color:#fff;margin:8px 8px 0 0}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.danger{background:#fff;color:var(--danger);border-color:#f1c9c2}
  .btn:disabled{opacity:.55;cursor:default}
  .hint{color:var(--muted);font-size:13px}
  .ok{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:500}
  .warn{background:var(--gold-bg);color:#8a5f1e;border-radius:10px;padding:10px 12px}
  .err{background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:10px 12px}
  ol.guide{padding-left:22px;margin:8px 0}
  ol.guide li{margin:0 0 12px}
  .shot{border:2px dashed var(--line-2);border-radius:10px;padding:14px;color:var(--muted);font-size:13px;margin-top:6px;background:#fafafa}
  .shot img{max-width:100%;border-radius:8px;display:block}
  code{background:var(--tint);border-radius:5px;padding:1px 5px;font-size:13px;overflow-wrap:anywhere}
  details summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:44px;display:flex;align-items:center}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card hint">Loading…</div></div>
<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, esc = E.esc;
  var STRIPE = null, GC = null, TEAM = 'Finance', MASTER = false, GIFTS = null, DONATIONS = null;
  /* THE FINANCE JOB (H-9): Church settings' team jobs, where the church has
     said; otherwise the money team below (EGBC: Finance). */
  var JOBP = null;
  function financeTeams() { return JOBP ? EGBCTeamJobs.teamsFor(JOBP.jobs, 'finance', JOBP.set) : [TEAM]; }
  function byJobs() { return !!(JOBP && JOBP.jobs && Object.prototype.hasOwnProperty.call(JOBP.jobs, 'finance')); }
  function db() { return EGBCAuth.db; }
  function say(id, cls, m) { var el = document.getElementById(id); if (el) { el.className = cls; el.textContent = m; } }
  function when(ts) { var d = ts && ts.toDate ? ts.toDate() : null; return d ? E.fmtDate(d) : ''; }
  function webhookUrl(name) {
    var o = (firebase.app('egbc').options || {});
    return location.port === '5601' ? 'http://localhost:5102/' + o.projectId + '/europe-west2/' + (name || 'stripeWebhook')
      : 'https://europe-west2-' + o.projectId + '.cloudfunctions.net/' + (name || 'stripeWebhook');
  }
  function statusLine(s, id) {
    return '<div class="ok" id="' + id + '">Connected: ' + esc(s.accountName || 'your account') + ', account …' + esc(s.accountLast4 || '') + ', ' +
      (s.mode === 'live' ? '<b>live</b> (real money)' : '<b>test</b> (no real money)') +
      (s.addedByName ? '. Added by ' + esc(s.addedByName) + (s.addedAt ? ' on ' + esc(when(s.addedAt)) : '') : '') + '.</div>';
  }
  /* GoCardless (F-181): bank payments for tickets (Instant Bank Pay) and
     regular giving by Direct Debit, through the church's own account. */
  function gcCard() {
    var s = GC || {}, on = !!s.connected;
    return '<div class="card" id="gocardless"><h2>Bank payments and Direct Debit, through your own GoCardless account</h2>' +
      '<p class="hint" style="margin-top:0">People pay for tickets straight from their bank (Instant Bank Pay), and give regularly by Direct Debit, with Gift Aid. ' +
      'The money goes straight into your church\'s GoCardless account. The hub never sees bank details and takes nothing: GoCardless charges your church its normal fee, and that is all.</p>' +
      /* The webhook is OPTIONAL (Martin, 15 Oct; F-209). */
      (on ? statusLine(s, 'gcStatus') + (s.webhookSet ? '<p class="hint" id="gcHookStatus">The webhook is set, so payments show as they happen.</p>'
            : '<p class="hint" id="gcHookStatus">Bank payments and Direct Debit are on. The hub checks with GoCardless itself, every few minutes. The webhook (optional, step 3) makes payments show straight away.</p>')
          : '<p id="gcStatus" class="hint"><b>Not connected.</b> Follow the steps below.</p>') +
      '<details' + (on ? '' : ' open') + ' style="margin-top:8px"><summary>' + (on ? 'Replace the token, or add the optional webhook' : 'Set it up, step by step') + '</summary><ol class="guide">' +
        '<li><b>Sign in to your church\'s GoCardless dashboard</b> at manage.gocardless.com (no account yet? make one there, in the church\'s name, with the church\'s bank account).' + shot('gc-1-dashboard', 'The GoCardless dashboard, signed in') + '</li>' +
        '<li><b>Make an access token.</b> Go to Developers, then <i>Create</i>, then <i>Access token</i>. Name it "Church hub" and choose <b>Read-write access</b>. Copy it (it starts <code>live_</code>, or <code>sandbox_</code> in GoCardless\'s sandbox while you try it out).' + shot('gc-2-token', 'Making an access token in GoCardless') +
          '<label for="gcKey">Paste the token here</label><input class="inp" id="gcKey" type="password" autocomplete="off" spellcheck="false" placeholder="live_…">' +
          '<button class="btn" id="gcSaveKey">Check and save the token</button><p id="gcKeyMsg" role="status"></p></li>' +
        '<li><b>Optional: makes payments show straight away.</b> Without it, the hub asks GoCardless every few minutes, so everything still works. To add it: in GoCardless go to Developers, then <i>Create</i>, then <i>Webhook endpoint</i>. Give it this address:' +
          '<p><code id="gcHookUrl">' + esc(webhookUrl('gocardlessWebhook')) + '</code></p>Make up a long secret, or let GoCardless make one, and copy it.' + shot('gc-3-webhook', 'Adding the webhook endpoint in GoCardless') +
          '<label for="gcHookSecret">Paste the webhook secret here</label><input class="inp" id="gcHookSecret" type="password" autocomplete="off" spellcheck="false">' +
          '<button class="btn" id="gcSaveHook">Save the webhook secret</button><p id="gcHookMsg" role="status"></p></li>' +
        '<li><b>Choose which tickets can be paid by bank</b>: in Events, each ticket type has "How people can pay".</li>' +
        '<li><b>Regular giving</b> is on the Give screen, and here: <a href="give-regularly.html">give-regularly.html</a>. Share that link too.</li>' +
        '<li><b>Refunds</b> are made in your GoCardless dashboard. The hub shows them by itself.</li>' +
      '</ol></details>' +
      (on ? '<button class="btn danger" id="removeGc">Remove bank payments and Direct Debit</button><p id="removeGcMsg" role="status"></p>' : '') + '</div>';
  }
  /* Regular giving, for the treasurer: how many gifts are running, and the
     collected gifts with Gift Aid for the HMRC claim. */
  function givingCard() {
    if (!GIFTS) return '';
    var running = GIFTS.filter(function (g) { return g.status === 'active'; });
    var month = running.reduce(function (n, g) { return n + (g.interval === 'monthly' ? g.amount : g.amount * 13 / 12); }, 0);
    var ga = (DONATIONS || []).filter(function (d) { return d.giftAid && !d.refunded; });
    return '<div class="card" id="giving"><h2>Regular giving</h2>' +
      '<p id="givingSum">' + running.length + ' running, about ' + E.money(month) + ' a month. ' + (DONATIONS || []).length + ' gifts collected, ' + ga.length + ' with Gift Aid.</p>' +
      '<button class="btn sec" id="gaCsv">Download the Gift Aid gifts (CSV)</button>' +
      '<p class="hint">Name, house, postcode, date and amount, for each gift collected with Gift Aid: what the HMRC claim needs, beside the declarations on the Gift Aid page.</p></div>';
  }
  /* A screenshot for the guide, once someone with a test account has taken
     it (F-181 question 2): screenshots/payments/<name>.png. Until then the
     box says what it will show. */
  function shot(name, words) {
    return '<div class="shot" data-shot="' + name + '"><img src="screenshots/payments/' + name + '.png" alt="' + esc(words) + '" onerror="this.parentNode.textContent=\'Picture to come: \' + this.alt"></div>';
  }

  function stripeCard() {
    var s = STRIPE || {}, on = !!s.connected;
    return '<div class="card" id="stripe"><h2>Card payments, through your own Stripe account</h2>' +
      '<p class="hint" style="margin-top:0">People pay for tickets by card on Stripe\'s own page. The money goes straight into your church\'s Stripe account. ' +
      'The hub never sees a card number and takes nothing: Stripe charges your church its normal fee, and that is all.</p>' +
      (on ? '<div class="ok" id="stripeStatus">Connected: ' + esc(s.accountName || 'your Stripe account') + ', account …' + esc(s.accountLast4 || '') + ', ' +
              (s.mode === 'live' ? '<b>live</b> (real money)' : '<b>test</b> (no real money)') +
              (s.addedByName ? '. Added by ' + esc(s.addedByName) + (s.addedAt ? ' on ' + esc(when(s.addedAt)) : '') : '') + '.</div>' +
            (s.webhookSet ? '<p class="hint" id="hookStatus">The webhook is set, so payments show as they happen.</p>'
                          : '<p class="hint" id="hookStatus">Card payments are on. The hub checks with Stripe itself: when someone comes back from paying, and every few minutes. The webhook (optional, step 3) makes payments show straight away.</p>')
          : '<p id="stripeStatus" class="hint"><b>Not connected.</b> Follow the steps below; it takes about ten minutes.</p>') +
      '<details' + (on ? '' : ' open') + ' style="margin-top:8px"><summary>' + (on ? 'Replace the key, or add the optional webhook' : 'Set it up, step by step') + '</summary>' +
      '<ol class="guide">' +
        '<li><b>Sign in to your church\'s Stripe dashboard</b> at dashboard.stripe.com. No Stripe account yet? Make one there first, in the church\'s name, with the church\'s bank account.' + shot('stripe-1-dashboard', 'The Stripe dashboard, signed in') + '</li>' +
        '<li><b>Make a restricted key.</b> Go to Developers, then API keys, then <i>Create restricted key</i>. Name it "Church hub". Give it only these permissions, and leave everything else as None:' +
          '<ul><li>Checkout Sessions: <b>Write</b></li><li>Payment Intents: <b>Read</b></li><li>Charges and Refunds: <b>Read</b></li><li>Account (or Balance): <b>Read</b></li></ul>' +
          'Press <i>Create key</i>, then copy it (it starts <code>rk_live_</code>, or <code>rk_test_</code> while you try it out).' + shot('stripe-2-restricted-key', 'Making a restricted key in Stripe') +
          '<label for="stripeKey">Paste the key here</label><input class="inp" id="stripeKey" type="password" autocomplete="off" spellcheck="false" placeholder="rk_live_…">' +
          '<button class="btn" id="saveKey">Check and save the key</button><p id="keyMsg" role="status"></p></li>' +
        '<li><b>Optional: makes payments show straight away.</b> You can skip this: without it the hub asks Stripe itself (when someone comes back from paying, and every few minutes), so everything still works. To add it: in Stripe go to Developers, then Webhooks, then <i>Add endpoint</i>. For the address, copy this:' +
          '<p><code id="hookUrl">' + esc(webhookUrl()) + '</code></p>' +
          'Choose these events: <code>checkout.session.completed</code>, <code>checkout.session.expired</code>, <code>charge.refunded</code> and <code>charge.dispute.created</code>. ' +
          'Press <i>Add endpoint</i>, then <i>Reveal</i> the <b>signing secret</b> and copy it (it starts <code>whsec_</code>).' + shot('stripe-3-webhook', 'Adding the webhook in Stripe') +
          '<label for="hookSecret">Paste the signing secret here</label><input class="inp" id="hookSecret" type="password" autocomplete="off" spellcheck="false" placeholder="whsec_…">' +
          '<button class="btn" id="saveHook">Save the signing secret</button><p id="hookMsg" role="status"></p></li>' +
        '<li><b>Choose which tickets can be paid by card</b>: in Events, each ticket type has "How people can pay".</li>' +
        '<li><b>Refunds</b> are made in your Stripe dashboard (Payments, then the payment, then Refund). The hub shows them by itself.</li>' +
      '</ol></details>' +
      (on ? '<button class="btn danger" id="removeStripe">Remove card payments</button><p id="removeMsg" role="status"></p>' : '') +
      '<p class="hint" style="margin-bottom:0">The key (and the signing secret, if you add the webhook) go to the hub\'s server once and are never shown again, to anyone. To change them, paste new ones.</p></div>';
  }
  function teamCard() {
    return '<div class="card" id="team"><h2>Who can set this up</h2><p class="hint" style="margin-top:0">Master admins, and anyone on the church\'s money team: <b id="teamName">' + esc(byJobs() ? (EGBCTeamJobs.label(JOBP.jobs, 'finance', null, JOBP.set) || 'nobody yet') : TEAM) + '</b>.</p>' +
      (byJobs() ? '<p class="hint" id="teamByJobs">Church settings’ team jobs say who does the finance job, so it is changed there.</p>' : '') +
      (MASTER && !byJobs() ? '<label for="teamInp">The money team</label><input class="inp" id="teamInp" maxlength="60" value="' + esc(TEAM) + '"><button class="btn sec" id="saveTeam">Save</button><p id="teamMsg" role="status"></p>' : '') + '</div>';
  }
  function draw() {
    document.getElementById('wrap').innerHTML = '<h1>Payments</h1><p class="sub">Taking money online, straight into the church\'s own accounts.</p>' + stripeCard() + gcCard() + givingCard() + teamCard();
    var gk = document.getElementById('gcSaveKey');
    if (gk) gk.onclick = function () { save('key', document.getElementById('gcKey').value, 'gcKeyMsg', gk, 'gocardless'); };
    var gh = document.getElementById('gcSaveHook');
    if (gh) gh.onclick = function () { save('webhook', document.getElementById('gcHookSecret').value, 'gcHookMsg', gh, 'gocardless'); };
    var rg = document.getElementById('removeGc');
    if (rg) rg.onclick = function () {
      if (!confirm('Remove bank payments and Direct Debit? Nobody will be offered them until a token is added again. Gifts already running in GoCardless keep running there.')) return;
      rg.disabled = true;
      EGBCAuth.call('paymentsRemove', { provider: 'gocardless' }).then(function () { return load(); }, function (e) { rg.disabled = false; say('removeGcMsg', 'err', E.payProblem(e)); });
    };
    var gc = document.getElementById('gaCsv');
    if (gc) gc.onclick = giftAidCsv;
    var k = document.getElementById('saveKey');
    if (k) k.onclick = function () { save('key', document.getElementById('stripeKey').value, 'keyMsg', k); };
    var h = document.getElementById('saveHook');
    if (h) h.onclick = function () { save('webhook', document.getElementById('hookSecret').value, 'hookMsg', h); };
    var r = document.getElementById('removeStripe');
    if (r) r.onclick = function () {
      if (!confirm('Remove card payments? Nobody will be offered card payment until a key is added again. Payments already made are kept.')) return;
      r.disabled = true;
      EGBCAuth.call('paymentsRemove', { provider: 'stripe' }).then(function () { return load(); }, function (e) { r.disabled = false; say('removeMsg', 'err', E.payProblem(e)); });
    };
    var t = document.getElementById('saveTeam');
    if (t) t.onclick = function () {
      var v = document.getElementById('teamInp').value.trim();
      if (!v) { say('teamMsg', 'err', 'Type the team\'s name first.'); return; }
      if (v === TEAM) { say('teamMsg', 'ok', 'Nothing to save: ' + TEAM + ' is already the money team.'); return; }
      say('teamMsg', 'ok', 'Saving…');
      EGBCAuth.call('paymentsTeam', { team: document.getElementById('teamInp').value }).then(function (res) { TEAM = res.team; say('teamMsg', 'ok', 'Saved: ' + res.team + ' can set up payments.'); document.getElementById('teamName').textContent = res.team; },
        function (e) { say('teamMsg', 'err', e.message || String(e)); });
    };
  }
  function save(kind, value, msgId, btn, provider) {
    provider = provider || 'stripe';
    var who = provider === 'gocardless' ? 'GoCardless' : 'Stripe';
    value = String(value || '').trim();
    if (!value) { say(msgId, 'err', 'Paste it first.'); return; }
    btn.disabled = true; say(msgId, 'hint', kind === 'key' ? 'Checking it with ' + who + '…' : 'Saving…');
    EGBCAuth.call('paymentsSave', { provider: provider, kind: kind, value: value }).then(function () {
      return load().then(function () { say(msgId, 'ok', kind === 'key' ? 'Saved. ' + who + ' knows this ' + (provider === 'gocardless' ? 'token.' : 'key.') : 'Saved.'); });
    }, function (e) { btn.disabled = false; say(msgId, 'err', E.payProblem(e)); });
  }
  function giftAidCsv() {
    db().collection('giftAid').where('source', '==', 'regular-giving').get().then(function (s) {
      var dec = {}; s.docs.forEach(function (d) { var x = d.data(); if (x.regularGiftKey) dec[x.regularGiftKey] = x; });
      var q = function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
      var rows = [['First name', 'Last name', 'House name or number', 'Postcode', 'Date', 'Amount'].join(',')].concat((DONATIONS || []).filter(function (d) { return d.giftAid && !d.refunded; }).map(function (d) {
        var g = dec[d.regularGiftKey] || {};
        return [g.firstName || d.name, g.lastName || '', g.house || '', g.postcode || '', d.date, (Number(d.amount) || 0).toFixed(2)].map(q).join(',');
      }));
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
      a.download = 'Gift Aid gifts.csv'; document.body.appendChild(a); a.click(); a.remove();
    });
  }
  function load() {
    return Promise.all([
      db().collection('paymentSettings').doc('stripe').get(),
      db().collection('paymentSettings').doc('team').get().catch(function () { return null; }),
      db().collection('paymentSettings').doc('gocardless').get().catch(function () { return null; }),
      db().collection('regularGifts').get().catch(function () { return null; }),
      db().collection('donations').get().catch(function () { return null; })
    ]).then(function (r) {
      STRIPE = r[0].exists ? r[0].data() : null;
      TEAM = r[1] && r[1].exists ? (r[1].data().team || 'Finance') : 'Finance';
      GC = r[2] && r[2].exists ? r[2].data() : null;
      GIFTS = r[3] ? r[3].docs.map(function (d) { return Object.assign({ key: d.id }, d.data()); }) : null;
      DONATIONS = r[4] ? r[4].docs.map(function (d) { return d.data(); }) : null;
      draw();
    });
  }
  EGBCAuth.require().then(function () {
    MASTER = !!(EGBCAuth.isMaster && EGBCAuth.isMaster());
    /* THE PAGE TURNS AWAY EVERYONE ELSE ITSELF (Martin, 15 Oct 2026: "that
       shouldn't be seen by anyone other than the admin or designated
       people"). Until switch-over the rules don't, so the page must. Master
       admins and the money team only, as isTreasurer() on the server. */
    return EGBCAuth.loadPerms().then(function (P) { JOBP = P; }, function () { JOBP = null; }).then(function () {
      if (MASTER) return load();
      return db().collection('paymentSettings').doc('team').get().catch(function () { return null; }).then(function (t) {
      TEAM = (t && t.exists && t.data().team) || 'Finance';
      if (JOBP) JOBP.set = Object.assign({}, JOBP.set, { moneyTeam: TEAM });
      var mine = financeTeams().some(function (team) { return (EGBCAuth.inTeam && EGBCAuth.inTeam(team)) || (EGBCAuth.isAdminOf && EGBCAuth.isAdminOf(team)); });
      if (!mine) { var err = new Error('permission'); err.code = 'permission-denied'; throw err; }
      return load();
      });
    });
  }).catch(function (e) {
    var denied = /permission|insufficient/i.test(String(e && (e.code || e.message)));
    document.getElementById('wrap').innerHTML = '<div class="card"><h1>Payments</h1><p>' + (denied ? 'This page is for master admins and the church\'s money team.' : esc(e.message || e)) + '</p></div>';
  });
})();
</script>
</body>
</html>
