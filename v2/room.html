<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room</title>

<script src="egbc-nosend.js?v=202610212000"></script>
<script src="egbc-ui.js?v=202610150900"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js?v=202610212000"></script>
<script src="egbc-church.js?v=202610192330"></script>
<script src="egbc-poweredby.js?v=202610081518"></script>
<script src="egbc-events-rooms.js?v=202610221000"></script>
<script src="egbc-events.js?v=202610212300"></script>
<script src="egbc-events-bookings.js?v=202610141700"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;--card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:26px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .badge{width:32px;height:32px;border-radius:8px;background:var(--tint);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;flex:none}
  .main{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:#eef2f2;display:block}
  .thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
  .thumbs button{border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer;flex:none}
  .thumbs button.on{border-color:var(--brand)}
  .thumbs img{width:84px;height:56px;object-fit:cover;border-radius:6px;display:block}
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .fact .k{font-size:12px;color:var(--muted)} .fact .v{font-size:15px;font-weight:600;color:var(--ink)}
  table{border-collapse:collapse;width:100%}
  td{padding:9px 0;border-top:1px solid var(--line);font-size:14px} tr:first-child td{border-top:none}
  td.r{text-align:right;font-weight:600;color:var(--ink)}
  .fac{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;color:var(--ink)}
  .fac i{color:var(--brand)}
  .facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 16px}
  .words{white-space:pre-wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;font:500 14px Inter,sans-serif;
       background:var(--brand);color:#fff;text-decoration:none;border:1px solid transparent}
  .btn:hover{background:var(--brand-dark)}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .hint{font-size:13px;color:var(--muted)}
  /* The plain header for the public hire pages: the church's logo and name
     (from Church details) and a way back to the list. No hub menu, no
     sign-in - someone arriving from the church website stays in these pages. */
  .chead{background:#fff;border-bottom:1px solid var(--line)}
  .ch-in{max-width:1000px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ch-logo{width:32px;height:32px;object-fit:contain;border-radius:6px}
  .ch-name{font-size:15px;font-weight:600;color:var(--ink);flex:1;min-width:0}
  /* Marked out as buttons, so they read as things to click (F-067). */
  .ch-back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:13px;font-weight:500;color:var(--brand);text-decoration:none}
  .ch-back:hover{background:var(--tint)}
</style>
</head>
<body>
<header class="chead" id="chead"></header>
<div class="wrap" id="wrap"><div class="card hint">Loading…</div></div>

<footer id="poweredby"></footer>
<script>
(function () {
  'use strict';
  /* NEXT-BRIEF §19: the one small credit, from the shared snippet. */
  if (window.EGBCPoweredBy) EGBCPoweredBy.mount(document.getElementById('poweredby'));
  EGBCChurch.closeOnLeave();
  var R = window.EGBCRooms;
  /* ?id= is the address the church website uses; ?r= still works. */
  var Q = new URLSearchParams(location.search), ID = Q.get('id') || Q.get('r') || '';
  var ROOM = null, SITE = null, SHOWN = 0;
  /* ?member=1 (from the members' booking): THE MEMBERS' PAGE (the reviewing
     window, 20 Oct). A signed-in church member - or the office - sees any
     room, for hire or not, with its kit and its floor plan as the room's
     floorPlanWho allows (public / members and office / office only).
     Without it this stays the public page: rooms for hire only. */
  var MEMBER = Q.get('member') === '1', SIGNED = false, OFFICE = false, KIT = [], PLAN_URL = '';
  function planWho() { return ROOM.floorPlanWho || 'members'; }
  function mayPlan() { var w = planWho(); return w === 'public' || (w === 'members' && (SIGNED || OFFICE)) || (w === 'office' && OFFICE); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function icons() { if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons(); }
  function ico(n, px) { return '<i data-lucide="' + n + '" style="width:' + (px || 17) + 'px;height:' + (px || 17) + 'px"></i>'; }
  function fact(k, v) { return v ? '<div class="fact"><div class="k">' + k + '</div><div class="v">' + esc(v) + '</div></div>' : ''; }

  function draw() {
    var r = ROOM, d = r.dims || {}, ph = r.photos || [], a = R.area(r);
    var floor = (R.FLOORS.filter(function (f) { return f[0] === r.floor; })[0] || [])[1];
    EGBCChurch.title(r.name);
    var mail = EGBCChurch.email();
    document.getElementById('wrap').innerHTML =
      '<h1>' + esc(r.name) + '</h1><p class="sub">' + esc(SITE ? SITE.name + (SITE.address ? ', ' + SITE.address : '') : '') + '</p>' +
      (ph.length ? '<img class="main" id="mainPic" src="' + esc(ph[SHOWN].url) + '" alt="' + esc(r.name) + '">' +
        (ph.length > 1 ? '<div class="thumbs">' + ph.map(function (p, i) {
          return '<button data-i="' + i + '" class="' + (i === SHOWN ? 'on' : '') + '" aria-label="Photo ' + (i + 1) + '"><img src="' + esc(p.url) + '" alt=""></button>'; }).join('') + '</div>' : '')
        : '') +
      '<div style="margin:16px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
        (MEMBER ? '<a class="btn" id="ask" href="rooms.html">' + ico('calendar-plus', 16) + 'Book a room</a>'
          : '<a class="btn" id="ask" href="book.html?room=' + encodeURIComponent(r.id) + '">' + ico('calendar-plus', 16) + 'Ask to book this room</a>') +
        (mail ? '<span class="hint">Questions? <a href="mailto:' + esc(mail) + '?subject=' + encodeURIComponent(r.name) + '" style="color:var(--brand)">' + esc(mail) + '</a></span>' : '') +
      '</div>' +
      '<div class="card" id="week"><h2><span class="badge">' + ico('calendar') + '</span>When it is free</h2><p class="hint">Loading…</p></div>' +
      (r.description ? '<div class="card"><p class="words" style="margin:0">' + esc(r.description) + '</p></div>' : '') +
      '<div class="card"><h2><span class="badge">' + ico('ruler') + '</span>The room</h2><div class="facts">' +
        fact('Floor area', a ? a + ' m²' : '') +
        fact('Size', d.length && d.width ? d.length + ' m by ' + d.width + ' m' + (r.sizeNote ? ' (' + r.sizeNote + ')' : '') : '') +
        fact('Ceiling height', d.height ? d.height + ' m' : '') +
        fact('Where to find it', r.level ? R.levelWords(r) : '') +
        fact('Floor', floor && r.floor ? floor : '') +
        fact('Natural light', r.naturalLight ? 'Yes' : '') +
        fact('Step-free access', R.accessWords(r)) +
        fact('Nearest toilets', r.toilets) + fact('Nearest kitchen', r.kitchenNote) +
      '</div></div>' +
      '<div class="card"><h2><span class="badge">' + ico('users') + '</span>How many it holds</h2><table>' +
        R.LAYOUTS.filter(function (x) { return (r.layouts || {})[x.id]; }).map(function (x) {
          return '<tr><td>' + x.label + ' <span class="hint">· ' + esc(x.hint) + '</span></td><td class="r">' + R.holds(r, x.id) + '</td></tr>'; }).join('') +
        /* No layouts yet: "Holds up to" its capacity, as the booking card does (Martin, 20 Oct). */
        (!R.LAYOUTS.some(function (x) { return (r.layouts || {})[x.id]; }) && R.holds(r) ? '<tr id="holdsUpTo"><td>Holds up to</td><td class="r">' + R.holds(r) + '</td></tr>' : '') +
        (r.fireMax ? '<tr><td>Most allowed, for fire safety</td><td class="r" id="fireMax">' + r.fireMax + '</td></tr>' : '') +
      '</table></div>' +
      '<div class="card"><h2><span class="badge">' + ico('list-checks') + '</span>Facilities</h2><div class="facs">' +
        R.FACILITIES.filter(function (x) { return R.has(r, x.id); }).map(function (x) {
          var n = (r.facilities || {})[x.id];
          return '<div class="fac">' + ico(x.icon, 18) + x.label + (x.count ? ': ' + n : '') + '</div>'; }).join('') +
        (r.externalCaterers ? '<div class="fac">' + ico('utensils', 18) + 'You may bring your own caterers</div>' : '') +
      '</div></div>' +
      (MEMBER ? (function () { var k = R.kitFor(r, KIT); return (k.here.length || k.movable.length) ? '<div class="card" id="kit"><h2><span class="badge">' + ico('package') + '</span>Kit</h2>' +
        (k.here.length ? '<p style="margin:0 0 6px"><strong>In the room:</strong> ' + k.here.map(function (x) { return esc(x.name) + (x.unlimited ? '' : ' (' + (+x.quantity || 0) + ')'); }).join(', ') + '</p>' : '') +
        (k.movable.length ? '<p style="margin:0"><strong>Can be brought in:</strong> ' + k.movable.map(function (x) { return esc(x.name) + (x.unlimited ? '' : ' (' + (+x.quantity || 0) + ')'); }).join(', ') + '</p>' : '') + '</div>' : ''; })() : '') +
      (r.floorPlan && PLAN_URL ? '<div class="card" id="plan"><h2><span class="badge">' + ico('map') + '</span>Floor plan</h2><img src="' + esc(PLAN_URL) + '" alt="Floor plan" loading="lazy" style="max-width:100%;border-radius:8px"></div>' : '') +
      (r.houseRules ? '<div class="card"><h2><span class="badge">' + ico('scroll-text') + '</span>House rules</h2><p class="words" style="margin:0">' + esc(r.houseRules) + '</p></div>' : '');
    document.querySelectorAll('.thumbs button').forEach(function (b) { b.onclick = function () { SHOWN = +b.getAttribute('data-i'); draw(); }; });
    icons();
    drawWeek();
  }

  /* The next seven days. A free time can be clicked, and goes to the
     booking form with it filled in. */
  function drawWeek() {
    var B = window.EGBCBookings, r = ROOM, list = [0, 1, 2, 3, 4, 5, 6].map(function (n) { return B.addDays(B.today(), n); });
    Promise.all(list.map(function (d) { return B.loadDays([r], d); })).then(function (all) {
      var el = document.getElementById('week'); if (!el) return;
      el.innerHTML = '<h2><span class="badge">' + ico('calendar') + '</span>When it is free</h2>' +
        '<div style="overflow-x:auto"><div style="min-width:480px">' + B.axis() + list.map(function (d, i) {
          return B.bar(all[i][r.id], { label: EGBCEvents.fmtDateShort(d + 'T12:00'), click: true, service: function (s) { return B.serviceAt(SITE, r.id, d, s); }, attrs: ' data-day="' + d + '"' });
        }).join('') + B.key(false) + '</div></div><p class="hint" style="margin:8px 0 0">Click a free time to ask for it.</p>';
      icons();
      el.querySelectorAll('[data-slot]').forEach(function (c) {
        c.onclick = function () {
          var s = +c.dataset.slot, d = c.closest('[data-day]').dataset.day;
          location.href = 'book.html?room=' + encodeURIComponent(r.id) + '&day=' + d + '&start=' + B.hhmm(s * 15) + '&end=' + B.hhmm(Math.min(s * 15 + 60, 1425));
        };
      });
    }).catch(function () { var el = document.getElementById('week'); if (el) el.style.display = 'none'; });
  }

  function none() {
    document.getElementById('wrap').innerHTML = '<div class="card">That room could not be found, or is not for hire. Use "Back to all rooms" above to see the rooms that are.</div>';
  }

  EGBCChurch.load().then(function () { EGBCChurch.header(document.getElementById('chead'), { back: true }); });
  if (!ID) return none();
  /* The members' page asks who is signed in; the public one never does. */
  var who = MEMBER ? EGBCAuth.require().then(function (p) {
    SIGNED = !!(p && p.status === 'active');
    if (!SIGNED) return;
    var mid = p.memberId || '-';
    OFFICE = !!(EGBCAuth.isAdmin && EGBCAuth.isAdmin());
    return Promise.all([
      EGBCAuth.db.collection('bookableResources').get().then(function (q) { KIT = q.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }, function () {}),
      EGBCAuth.db.collection('rooms').doc(ID).get().then(function (s) {
        var site = s.exists ? s.data().siteId : '';
        return site ? EGBCAuth.db.collection('bookingSettings').doc(site).get().then(function (b) { if (b.exists && (b.data().bookingsAdmins || []).indexOf(mid) >= 0) OFFICE = true; }, function () {}) : null;
      }, function () {})
    ]);
  }) : Promise.resolve();
  who.then(function () { return EGBCChurch.load(); }).then(function () { return EGBCAuth.db.collection('rooms').doc(ID).get(); }).then(function (s) {
    if (!s.exists) return none();
    ROOM = Object.assign({ id: s.id }, s.data());
    if (!(MEMBER && (SIGNED || OFFICE)) && !R.hireable([ROOM]).length) return none();
    if (MEMBER && (SIGNED || OFFICE) && ROOM.active === false) return none();
    /* The floor plan, as its setting allows: an old public link, or the
       private path, which Storage only hands to the people allowed. */
    var fp = ROOM.floorPlan, plan = !fp || !mayPlan() ? Promise.resolve('') : fp.url ? Promise.resolve(fp.url)
      : (fp.path && EGBCAuth.storage ? EGBCAuth.storage().ref(fp.path).getDownloadURL().catch(function () { return ''; }) : Promise.resolve(''));
    return plan.then(function (u) { PLAN_URL = u || ''; return EGBCAuth.db.collection('sites').doc(ROOM.siteId).get(); })
      .then(function (x) { SITE = x.exists ? x.data() : null; }).catch(function () {}).then(draw);
  }).catch(none);
})();
</script>
</body>
</html>
