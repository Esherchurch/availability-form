<!DOCTYPE html>
<html lang="en">
<head>
<script src="egbc-nosend.js?v=202611011200"></script>
<script src="egbc-appmode.js?v=202611011200"></script>
<script src="egbc-shell.js?v=202611011400" data-title="Setting up your hub"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Setting up your hub</title>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3d6263">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202611011400"></script>
<script src="egbc-guard.js?v=202611011200" data-master></script>
<script src="egbc-setup.js?v=202611011400"></script>
<script src="egbc-parts.js?v=202611011400"></script>
<style>
  :root{
    --canvas:#f6f7f7; --surface:#fff; --ink:#111827; --body:#374151; --muted:#6b7280;
    --line:#e5e7eb; --line-2:#d1d5db; --brand:#3d6263; --tint:#eef5f4; --ok:#15803d; --ok-tint:#ecfdf3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;font-weight:600;color:var(--ink);margin:0 0 6px;letter-spacing:-.01em}
  .lede{color:var(--muted);margin:0 0 16px}
  .meter{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 18px}
  .meter i{display:block;height:100%;background:var(--brand)}
  .step{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;
        padding:14px;margin-bottom:10px}
  .n{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;
     background:var(--tint);color:var(--brand)}
  .step.done .n{background:var(--ok-tint);color:var(--ok)}
  .txt{flex:1;min-width:0}
  .txt b{color:var(--ink);display:block}
  .txt span{color:var(--muted);font-size:13px}
  .go{flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;
      background:var(--brand);color:#fff;text-decoration:none;font-weight:500}
  .step.done .go{background:#fff;color:var(--brand);border:1px solid var(--line-2)}
  .soon{color:var(--muted);font-size:13px}
  .uses{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 16px}
  .uses h2{font-size:16px;color:var(--ink);margin:0 0 4px}
  .uses .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
  .uses button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--brand);font:500 14px Inter,system-ui,sans-serif;cursor:pointer}
  .uses button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h">Setting up your hub</h1>
  <p class="lede" id="lede">Work down the list. Each step opens the page that does it; come back here at any time.</p>
  <div class="uses" id="uses" hidden>
    <h2>What will you use?</h2>
    <p class="lede" style="margin:0">Choose one to start. You can switch any part on or off later in <a href="church-settings.html">Church settings</a>, and nothing is deleted.</p>
    <div class="row" id="usesRow"></div>
    <p class="lede" id="usesNow" style="margin:8px 0 0"></p>
  </div>
  <div class="meter" aria-hidden="true"><i id="meter" style="width:0"></i></div>
  <div id="list"><div class="step">Loading…</div></div>
</div>
<script>
/* SETTING UP YOUR HUB (the setup frame). A church's master admin works
   through EGBCSetup.STEPS (egbc-setup.js); whether a step is done comes from
   the church's own data, so doing it on its page is enough. On a church's
   page (?church=<id>), every read here is that church's. */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
async function load() {
  const db = EGBCAuth.db;
  const d = await db.collection('churchSettings').doc('details').get().then(s => s.exists ? s.data() : {}, () => ({}));
  if (d.name) $('h').textContent = 'Setting up ' + d.name;
  drawUses(db);
  /* A step for a part the church doesn't use is left out. */
  const rows = (await EGBCSetup.status(db)).filter(r => !r.step.part || EGBCAuth.usesPart(r.step.part));
  const need = rows.filter(r => !r.step.optional), done = need.filter(r => r.done).length;
  $('meter').style.width = Math.round(100 * done / Math.max(1, need.length)) + '%';
  $('lede').textContent = done === need.length ? 'Every step is done. Church HQ will take you through going live.'
    : done + ' of ' + need.length + ' steps done. Each step opens the page that does it; come back here at any time.';
  $('list').innerHTML = rows.map((r, i) => '<div class="step' + (r.done ? ' done' : '') + '">'
    + '<span class="n">' + (r.done ? '✓' : i + 1) + '</span>'
    + '<span class="txt"><b>' + esc(r.step.title) + (r.step.optional ? ' <span>(if you want it)</span>' : '') + '</b><span>' + esc(r.step.why) + '</span></span>'
    + (r.step.page ? '<a class="go" href="' + esc(EGBCSetup.link(r.step.page)) + '">' + (r.done ? 'Change' : 'Start') + '</a>'
      : '<span class="soon">Coming soon</span>')
    + '</div>').join('');
}
/* WHAT WILL YOU USE? The ready-made choices (egbc-parts.js), saved as the
   same switches Church settings shows. */
function drawUses(db) {
  const P = window.EGBCParts; if (!P) return;
  const now = P.matching(EGBCAuth.partSwitches(), EGBCAuth.featureSwitches());
  $('uses').hidden = false;
  $('usesRow').innerHTML = P.PRESETS.map(x => '<button type="button" data-preset="' + esc(x.id) + '" aria-pressed="' + (x.id === now) + '">' + esc(x.label) + '</button>').join('');
  const cur = P.PRESETS.filter(x => x.id === now)[0];
  $('usesNow').textContent = cur ? cur.means + '.' : 'Now: your own mix (Church settings).';
  [].forEach.call(document.querySelectorAll('[data-preset]'), b => { b.onclick = async () => {
    const x = P.PRESETS.filter(y => y.id === b.dataset.preset)[0];
    if (!x || (now && !confirm('Use "' + x.label + '"?\n\n' + x.means + '.\n\nNothing is deleted.'))) return;
    b.disabled = true;
    try {
      await db.collection('churchSettings').doc('features').set(Object.assign({ updatedAt: new Date().toISOString(), updatedBy: (EGBCAuth.user() || {}).uid || '' }, P.presetSwitches(x.id)), { merge: true });
      await EGBCAuth.reloadFeatures();
      await load();
    } catch (e) { b.disabled = false; alert('That did not save: ' + (e.message || e)); }
  }; });
}
document.addEventListener('egbc-ready', () => load().catch(e => {
  console.error('setup:', e);
  $('list').innerHTML = '<div class="step">This could not be loaded. Please try again.</div>';
}));
</script>
</body>
</html>
