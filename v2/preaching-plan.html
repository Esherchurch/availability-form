<!DOCTYPE html>
<html lang="en">
<head>
<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-appmode.js?v=202610152310"></script>
<script src="egbc-shell.js?v=202610192330" data-title="Preaching plan"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Preaching plan — EGBC</title>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3d6263">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610192330"></script>
<script src="egbc-church.js?v=202610192330"></script>
<script src="egbc-guard.js?v=202610160810" data-any-team></script>
<style>
  :root{
    --canvas:#f6f7f7; --surface:#fff; --ink:#111827; --body:#374151; --muted:#6b7280;
    --faint:#9ca3af; --line:#e5e7eb; --line-2:#d1d5db; --brand:#3d6263; --brand-dark:#2a4a4b;
    --tint:#eef5f4; --ring:rgba(61,98,99,.15); --ok:#15803d; --danger:#b0392c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;font-weight:600;color:var(--ink);margin:0 0 6px;letter-spacing:-.01em}
  .lede{margin:0 0 6px;color:var(--muted)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0}
  .tick{display:inline-flex;gap:8px;align-items:center;min-height:44px;cursor:pointer;color:var(--ink)}
  .tick input{width:18px;height:18px;accent-color:var(--brand)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr.past{opacity:.7}
  .date b{display:block;color:var(--ink);font-weight:600;white-space:nowrap}
  .date small{color:var(--muted)}
  .in{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;font:400 14px Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
  .in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
  .ro{color:var(--ink);min-height:20px;display:block}
  .sermon{display:inline-flex;align-items:center;min-height:32px;margin-top:4px;font-size:13px;color:var(--brand);text-decoration:underline;text-underline-offset:3px}
  .ro.none{color:var(--faint)}
  .reader{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;margin-bottom:6px}
  .x,.add{min-height:44px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font:500 13px Inter,system-ui,sans-serif;cursor:pointer}
  .add{padding:0 12px}
  .saved{font-size:12px;color:var(--ok);min-height:0;margin:2px 0 0}
  .saved.err{color:var(--danger)}
  .lbl{display:none}
  .empty{padding:16px;color:var(--muted)}
  .settings{padding:14px 16px;margin:0 0 14px}
  .settings h2{font-size:15px;font-weight:600;margin:0 0 6px;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 6px 0 12px;border-radius:999px;background:var(--tint);color:var(--ink)}
  .chip button{min-width:36px;min-height:36px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
  /* CARDS ON A PHONE (DESIGN.md, 375px): each service is a card, each
     field labelled. */
  @media (max-width:760px){
    table,thead,tbody,tr,td{display:block}
    thead{display:none}
    tr{border-bottom:1px solid var(--line);padding:12px 14px}
    td{border:0;padding:4px 0}
    .lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:6px 0 2px}
    .reader{grid-template-columns:1fr 44px}
    .reader .in.pass{grid-column:1 / 2}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Preaching plan</h1>
  <p class="lede" id="who">Who is preaching and leading, what each Sunday is, and who is reading what.</p>
  <div id="settings"></div>
  <div class="bar">
    <span id="count" role="status"></span>
    <label class="tick"><input type="checkbox" id="showPast"> Show past services</label>
  </div>
  <div class="card"><table>
    <thead><tr><th style="width:130px">Date</th><th>Description <span style="font-weight:400">(shown in What's On)</span></th><th>Speaker</th><th>Service leader</th><th style="width:34%">Readers</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
  </table></div>
  <datalist id="people"></datalist>
</div>
<script>
/* PREACHING PLAN (Martin for Ryan, the Pastor, 15 Oct 2026).
   One table of the services: Date | Description | Speaker | Service leader
   | Readers (with passages). The next three months; past ones behind a tick.

   THE SAME FIELDS AS THE ROTA, not a copy: events/{id}.publicTitle (the
   description - what What's On shows, through rotaWhatsOn), .speaker and
   .serviceLeader (the Rota Planner's own boxes), and .readers, a list of
   { name, passage }. Change one here and the Planner, What's On and the app
   all have it. Names are free text with suggestions from the address book:
   a guest speaker can always be typed.

   WHO EDITS: master admins, the Pastor - the one chosen in Team emails
   (teamMailSettings/main.pastor, which For Sunday uses too; one place to
   name them, not two) - and the admins of Worship
   and Core Team, who run the Sunday rota. Anybody else on a team reads it.
   The rules say the same (firestore.rules, match /events: the Pastor may
   change these four fields and nothing else).

   Saved as each box is left (rule 13: no Save button). Feature
   'preachingPlan'. */
const db = EGBCAuth.db;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* The services: the Sunday and special services on the rota, and anything
   ticked for What's On. Not practices, meetings or workshops. */
const SERVICE_TYPES = ['Sunday Morning Worship', 'Evening Carol Service', 'Midnight Service', 'Special Service', 'LOUD Worship'];
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
let ROWS = [], SHOW_PAST = false, CAN_EDIT = false, PASTOR = '', PEOPLE = [];
/* THE SERMON PLAN for a service, where the preaching team has made one
   (the events window's F-229): sermonLinks/<event id>, kept by its server,
   { sessionId, title, passage }. Read-only here; it links to the plan. */
let SERMONS = {};

function iso(d) { const p = (x) => String(x).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function ukDate(s) { const d = new Date(s + 'T12:00:00'); return isNaN(d) ? s : DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
const TODAY = iso(new Date());
const UNTIL = (() => { const d = new Date(); d.setMonth(d.getMonth() + 3); return iso(d); })();
const SINCE = (() => { const d = new Date(); d.setFullYear(d.getFullYear() - 1); return iso(d); })();

function amPastor() { const me = EGBCAuth.profile() || {}; return !!me.memberId && PASTOR === me.memberId; }
function mayEdit() {
  return EGBCAuth.isMaster() || amPastor()
    || ['Worship Team', 'Core Team'].some(t => EGBCAuth.isAdminOf && EGBCAuth.isAdminOf(t));
}

async function load() {
  /* Readable by master admins and by the Pastor; anybody else is refused,
     which simply means they are not the Pastor. */
  try {
    const s = await db.collection('teamMailSettings').doc('main').get();
    PASTOR = (s.exists && s.data().pastor) || '';
  } catch (e) { PASTOR = ''; }
  CAN_EDIT = mayEdit();
  $('who').textContent = CAN_EDIT
    ? 'Who is preaching and leading, what each Sunday is, and who is reading what. Changes save as you make them, and the Rota Planner and What’s On show them too.'
    : 'Who is preaching and leading, what each Sunday is, and who is reading what.';
  try {
    const snap = await db.collection('events').where('date', '>=', SINCE).orderBy('date').get();
    ROWS = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(e => !e.archived && (SERVICE_TYPES.indexOf(e.type) !== -1 || e.whatsOn === true));
  } catch (e) {
    console.error('preaching-plan: could not load', e);
    $('rows').innerHTML = '<tr><td colspan="5" class="empty">The plan could not be loaded. Please try again.</td></tr>';
    return;
  }
  if (CAN_EDIT) loadPeople();
  drawSettings();
  draw();
  loadSermons();
}

/* Suggestions for the name boxes: adults in the address book. Anything can
   still be typed (a guest speaker). */
async function loadPeople() {
  try {
    const snap = await db.collection('addressBook').where('archived', '==', false).get();
    PEOPLE = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.name && p.isMinor !== true)
      .sort((a, b) => a.name.localeCompare(b.name));
    $('people').innerHTML = PEOPLE.map(p => '<option value="' + esc(p.name) + '">').join('');
    drawSettings();
  } catch (e) { /* no suggestions; typing still works */ }
}

function drawSettings() {
  if (!EGBCAuth.isMaster()) { $('settings').innerHTML = ''; return; }
  const who = PASTOR ? ((PEOPLE.find(p => p.id === PASTOR) || {}).name || 'Somebody no longer in the address book') : '';
  $('settings').innerHTML = `<div class="card settings" data-pp="settings"><h2>The Pastor</h2>
    <p class="lede" style="margin:0">Can change this plan without being an admin, and gets For Sunday's prayer list. Master admins only see this.</p>
    <p class="ro${who ? '' : ' none'}" data-pastor>${esc(who || 'Nobody chosen yet')}</p>
    <a class="add" href="team-mail.html">Choose the Pastor in Team emails</a></div>`;
}

async function loadSermons() {
  const ids = ROWS.map(r => r.id);
  const out = {};
  try {
    for (let i = 0; i < ids.length; i += 30) {
      const snap = await db.collection('sermonLinks')
        .where(firebase.firestore.FieldPath.documentId(), 'in', ids.slice(i, i + 30)).get();
      snap.docs.forEach(d => { out[d.id] = d.data() || {}; });
    }
  } catch (e) { return; }   /* no links is the same as none made */
  SERMONS = out;
  if (Object.keys(out).length) draw();
}
function sermon(r) {
  const s = SERMONS[r.id];
  if (!s || !s.sessionId) return '';
  const words = [s.title, s.passage].filter(Boolean).join(' \u00b7 ') || 'open it';
  return `<a class="sermon" href="session-planner.html?s=${encodeURIComponent(s.sessionId)}">Sermon plan: ${esc(words)}</a>`;
}

function field(r, f, label) {
  const v = r[f] || '';
  if (!CAN_EDIT) return `<span class="lbl">${label}</span><span class="ro${v ? '' : ' none'}">${esc(v || '—')}</span>`;
  return `<label class="lbl" for="${f}_${esc(r.id)}">${label}</label><input class="in" id="${f}_${esc(r.id)}" data-f="${f}" value="${esc(v)}" maxlength="${f === 'publicTitle' ? 140 : 80}"
    ${f === 'publicTitle' ? 'placeholder="' + esc(r.type || '') + '"' : 'list="people"'} autocomplete="off">`;
}

function readers(r) {
  const list = Array.isArray(r.readers) ? r.readers : [];
  if (!CAN_EDIT) return `<span class="lbl">Readers</span>` + (list.length
    ? list.map(x => `<span class="ro">${esc(x.name)}${x.passage ? ' – ' + esc(x.passage) : ''}</span>`).join('')
    : '<span class="ro none">—</span>');
  return `<span class="lbl">Readers</span><div data-readers>` + list.map((x, i) => `<div class="reader" data-i="${i}">
      <input class="in" data-r="name" value="${esc(x.name)}" list="people" placeholder="Reader" aria-label="Reader ${i + 1}" maxlength="80" autocomplete="off">
      <input class="in pass" data-r="passage" value="${esc(x.passage)}" placeholder="Passage, e.g. John 3:1-17" aria-label="Passage ${i + 1}" maxlength="80">
      <button type="button" class="x" data-rm="${i}" aria-label="Remove reader ${i + 1}">&times;</button></div>`).join('')
    + `</div><button type="button" class="add" data-addreader>+ Add a reader</button>`;
}

function draw() {
  const rows = ROWS.filter(r => r.date <= UNTIL && (SHOW_PAST || r.date >= TODAY));
  $('count').textContent = rows.length === 1 ? '1 service' : rows.length + ' services';
  if (!rows.length) { $('rows').innerHTML = '<tr><td colspan="5" class="empty">No services on the rota for the next three months yet.</td></tr>'; return; }
  $('rows').innerHTML = rows.map(r => `<tr data-id="${esc(r.id)}" class="${r.date < TODAY ? 'past' : ''}">
      <td class="date"><b>${esc(ukDate(r.date))}</b><small>${esc(r.serviceTime || '')}${r.serviceTime && r.type ? ' · ' : ''}${esc(r.type || '')}</small></td>
      <td>${field(r, 'publicTitle', 'Description')}</td>
      <td>${field(r, 'speaker', 'Speaker')}${sermon(r)}</td>
      <td>${field(r, 'serviceLeader', 'Service leader')}</td>
      <td>${readers(r)}<p class="saved" role="status"></p></td></tr>`).join('');
}

async function save(id, data, tr) {
  const msg = tr && tr.querySelector('.saved');
  try {
    await db.collection('events').doc(id).update(Object.assign({}, data,
      { updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: EGBCAuth.user().uid }));
    const r = ROWS.find(x => x.id === id); if (r) Object.assign(r, data);
    if (msg) { msg.className = 'saved'; msg.textContent = 'Saved'; setTimeout(() => { if (msg.textContent === 'Saved') msg.textContent = ''; }, 2000); }
  } catch (e) {
    console.error('preaching-plan: could not save', e);
    if (msg) { msg.className = 'saved err'; msg.textContent = 'That did not save. Please try again.'; }
  }
}

function readersOf(tr) {
  return [].map.call(tr.querySelectorAll('.reader'), el => ({
    name: el.querySelector('[data-r=name]').value.trim(), passage: el.querySelector('[data-r=passage]').value.trim()
  }));
}

document.addEventListener('change', (e) => {
  if (e.target.id === 'showPast') { SHOW_PAST = e.target.checked; draw(); return; }
  const tr = e.target.closest('tr[data-id]'); if (!tr || !CAN_EDIT) return;
  if (e.target.dataset.f === 'speaker' || e.target.dataset.f === 'serviceLeader') {
    /* From the address book, with the person's id (the Rota Planner does
       the same); a guest speaker is typed and has no id. */
    const name = e.target.value.trim(), f = e.target.dataset.f;
    const hits = PEOPLE.filter(p => (p.name || '').trim().toLowerCase() === name.toLowerCase());
    save(tr.dataset.id, { [f]: name, [f + 'Id']: name && hits.length === 1 ? hits[0].id : '' }, tr);
  } else if (e.target.dataset.f) save(tr.dataset.id, { [e.target.dataset.f]: e.target.value.trim() }, tr);
  else if (e.target.dataset.r) save(tr.dataset.id, { readers: readersOf(tr).filter(x => x.name || x.passage) }, tr);
});
document.addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-id]'); if (!tr || !CAN_EDIT) return;
  const r = ROWS.find(x => x.id === tr.dataset.id); if (!r) return;
  if (e.target.closest('[data-addreader]')) {
    r.readers = readersOf(tr).concat([{ name: '', passage: '' }]); draw();
    const again = document.querySelector('tr[data-id="' + CSS.escape(r.id) + '"] .reader:last-child [data-r=name]'); if (again) again.focus();
    return;
  }
  const rm = e.target.closest('[data-rm]');
  if (rm) {
    const list = readersOf(tr); list.splice(Number(rm.dataset.rm), 1);
    r.readers = list; draw();
    save(r.id, { readers: list.filter(x => x.name || x.passage) }, document.querySelector('tr[data-id="' + CSS.escape(r.id) + '"]'));
  }
});
document.addEventListener('egbc-ready', () => {
  if (window.EGBCChurch && EGBCChurch.uses && !EGBCChurch.uses('preachingPlan')) {
    $('rows').innerHTML = '<tr><td colspan="5" class="empty">The church does not use the preaching plan.</td></tr>'; return;
  }
  load();
});
</script>
</body>
</html>
