<style>
:root {
  --bg: #f0f6f6;
  --surface: #e4eeee;
  --card: #ffffff;
  --border: #d1dfdf;
  --teal: #3d6263;
  --teal-light: #5b8e8f;
  --green: #8dc63f;
  --green-dark: #6fa028;
  --text: #2c4a4a;
  --muted: #7a9e9e;
  --good: #6fa028;
  --warn: #e07b00;
  --bad: #b22222;
  --radius: 2rem;
  --font: 'Montserrat', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  min-height: 100vh;
}

/* ── HEADER ───────────────────────────────────────────────────── */
header {
  background: var(--teal);
  padding: 0 28px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(61,98,99,.2);
}
.logo {
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: #fff;
}
.logo-badge {
  background: var(--green);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 9999px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.logo-dot {
  width: 10px; height: 10px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(141,198,63,.6);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:.6; transform:scale(.8); }
}
.header-stats {
  display: flex;
  gap: 12px;
  align-items: center;
}
.stat-pill {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 9999px;
  padding: 5px 14px;
  font-size: 12px;
  color: rgba(255,255,255,.8);
  font-weight: 600;
}
.stat-pill span { color: var(--green); font-weight: 800; }
.btn-add {
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 9999px;
  padding: 10px 20px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.btn-add:hover { background: var(--green-dark); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(141,198,63,.4); }

/* ── MAIN ─────────────────────────────────────────────────────── */
main { padding: 28px; max-width: 1600px; margin: 0 auto; }

/* ── TOOLBAR ──────────────────────────────────────────────────── */
.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}
.search-wrap input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 10px 16px 10px 40px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  outline: none;
  transition: border-color .15s;
}
.search-wrap input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(61,98,99,.08); }
.search-icon {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  font-size: 14px;
}
select.filter-select {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 10px 16px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  outline: none;
  cursor: pointer;
}
select.filter-select:focus { border-color: var(--teal); }

/* ── TABLE ────────────────────────────────────────────────────── */
.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  overflow-x: auto;
  box-shadow: 0 2px 12px rgba(61,98,99,.06);
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 900px;
}
thead tr {
  background: var(--surface);
  border-bottom: 2px solid var(--border);
}
th {
  padding: 13px 16px;
  text-align: left;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--teal);
  white-space: nowrap;
}
tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f7fbfb; }
td {
  padding: 12px 16px;
  vertical-align: middle;
}

/* item photo */
.item-photo {
  width: 52px; height: 52px;
  border-radius: 1rem;
  object-fit: cover;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.item-photo:hover { transform: scale(1.08); box-shadow: 0 4px 12px rgba(61,98,99,.2); }
.photo-placeholder {
  width: 52px; height: 52px;
  border-radius: 1rem;
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  border: 2px dashed var(--border);
  transition: border-color .15s;
}
.photo-placeholder:hover { border-color: var(--teal); }

/* item name */
.item-name {
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
}
.item-id {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 600;
}

/* condition badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .3px;
  text-transform: uppercase;
}
.badge.excellent { background: #eaf2f2; color: #3d6263; border: 1px solid #c5e899; }
.badge.good      { background: #e0f0f0; color: var(--teal); border: 1px solid #b0d4d4; }
.badge.fair      { background: #fff3e0; color: #3d6263; border: 1px solid #ffd080; }
.badge.poor      { background: #fef2f2; color: var(--bad); border: 1px solid #f5b8b8; }

/* location */
.location-tag {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--teal-light);
  font-weight: 600;
}

/* AI value */
.ai-value {
  font-weight: 800;
  font-size: 15px;
  color: var(--teal);
}
.ai-value.loading { color: var(--muted); font-size: 12px; }
.btn-value {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 5px 12px;
  color: var(--teal-light);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font);
  transition: all .15s;
  display: flex; align-items: center; gap: 4px;
}
.btn-value:hover { background: var(--teal); color: #fff; border-color: var(--teal); }

/* status */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .3px;
}
.status-badge.in  { background: #eaf2f2; color: #3d6263; border: 1px solid #c5e899; }
.status-badge.out { background: #fef2f2; color: var(--bad); border: 1px solid #f5b8b8; }
.status-dot { width:6px; height:6px; border-radius:50%; background: currentColor; }

/* action buttons */
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-sm {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 5px 12px;
  color: var(--teal-light);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font);
  transition: all .15s;
  white-space: nowrap;
}
.btn-sm:hover { background: var(--teal); color: #fff; border-color: var(--teal); }
.btn-sm.danger:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn-sm.sign-out-btn:hover { background: #3d6263; color: #fff; border-color: #3d6263; }
.btn-sm.sign-in-btn:hover  { background: var(--good); color: #fff; border-color: var(--good); }

/* empty state */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state h3 { font-weight: 800; font-size: 18px; color: var(--teal); margin-bottom: 8px; }

/* ── MODALS ───────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(44,74,74,.5);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(20px);
  transition: transform .2s;
  box-shadow: 0 20px 60px rgba(44,74,74,.2);
}
.overlay.open .modal { transform: translateY(0); }
.modal.wide { max-width: 700px; }

.modal-header {
  padding: 24px 28px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
  margin-bottom: 4px;
}
.modal-title {
  font-weight: 800;
  font-size: 18px;
  color: var(--teal);
}
.modal-close {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9999px;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
  transition: all .15s;
}
.modal-close:hover { background: var(--teal); color: #fff; border-color: var(--teal); }
.modal-body { padding: 20px 28px; }
.modal-footer {
  padding: 0 28px 24px;
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  border-top: 1px solid var(--border);
  padding-top: 16px;
  margin-top: 4px;
}

/* form fields */
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 11px;
  color: var(--teal);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
  font-weight: 800;
}
.field input, .field select, .field textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 10px 16px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  outline: none;
  transition: border-color .15s;
}
.field textarea { border-radius: 1rem; min-height: 80px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(61,98,99,.08);
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* photo upload */
.photo-upload-zone {
  border: 2px dashed var(--border);
  border-radius: 1.5rem;
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  background: var(--bg);
}
.photo-upload-zone:hover { border-color: var(--teal); background: var(--surface); }
.photo-upload-zone img { max-width: 100%; max-height: 160px; border-radius: 1rem; object-fit: cover; }
.photo-upload-zone input[type=file] { display: none; }
.upload-hint { color: var(--muted); font-size: 13px; margin-top: 8px; font-weight: 600; }
.upload-icon { font-size: 32px; }

/* signature pad */
.sig-wrap {
  background: #fff;
  border-radius: 1rem;
  overflow: hidden;
  border: 2px solid var(--border);
}
canvas#sigPad {
  display: block;
  width: 100%;
  height: 160px;
  cursor: crosshair;
  touch-action: none;
}
.sig-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn-clear {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 6px 14px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font);
  transition: all .15s;
}
.btn-clear:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
.sig-hint { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 600; }

/* btn primaries */
.btn-primary {
  background: var(--teal);
  color: #fff;
  border: none;
  border-radius: 9999px;
  padding: 10px 24px;
  font-family: var(--font);
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.btn-primary:hover { background: #2c4a4b; box-shadow: 0 4px 14px rgba(61,98,99,.3); }
.btn-secondary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 10px 24px;
  color: var(--teal-light);
  font-family: var(--font);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
}
.btn-secondary:hover { border-color: var(--teal); color: var(--teal); }
.btn-danger {
  background: none;
  border: 1px solid var(--bad);
  border-radius: 9999px;
  padding: 10px 24px;
  color: var(--bad);
  font-family: var(--font);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
}
.btn-danger:hover { background: var(--bad); color: #fff; }

/* sign log */
.sign-log {
  max-height: 220px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
}
.log-entry {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1.2rem;
  padding: 12px 16px;
}
.log-entry-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.log-entry-name { font-weight: 700; font-size: 13px; color: var(--teal); }
.log-entry-time { font-size: 11px; color: var(--muted); font-weight: 600; }
.log-sig { max-width: 180px; border-radius: 6px; background: #fff; border: 1px solid var(--border); }

/* image lightbox */
.lightbox-img {
  max-width: 90vw;
  max-height: 80vh;
  border-radius: 1.5rem;
  object-fit: contain;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

/* toast */
.toast-wrap {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
}
.toast {
  background: var(--teal);
  border-radius: 9999px;
  padding: 11px 20px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: slideIn .2s ease;
  max-width: 340px;
  box-shadow: 0 4px 16px rgba(61,98,99,.3);
}
@keyframes slideIn {
  from { opacity:0; transform:translateX(20px); }
  to   { opacity:1; transform:translateX(0); }
}
.toast.success { background: #3d6263; }
.toast.error   { background: var(--bad); }
.toast.info    { background: var(--teal); }

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* loading overlay */
#loadingScreen {
  position: fixed; inset: 0;
  background: var(--teal);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  gap: 20px;
  transition: opacity .4s;
}
#loadingScreen.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(255,255,255,.3);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-weight: 700; color: rgba(255,255,255,.8); font-size: 14px; letter-spacing: 0.5px; }
</style>
</head>

<!-- Main -->
<main>
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search items, locations…" oninput="renderTable()">
    </div>
    <select class="filter-select" id="filterCondition" onchange="renderTable()">
      <option value="">All Conditions</option>
      <option value="excellent">Excellent</option>
      <option value="good">Good</option>
      <option value="fair">Fair</option>
      <option value="poor">Poor</option>
    </select>
    <select class="filter-select" id="filterStatus" onchange="renderTable()">
      <option value="">All Status</option>
      <option value="in">Signed In</option>
      <option value="out">Signed Out</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Photo</th>
          <th>Item</th>
          <th>Condition</th>
          <th>Location</th>
          <th>AI Value</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>
</main>

<!-- ── ADD/EDIT ITEM MODAL ──────────────────────────────────── -->
<div class="overlay" id="itemOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="itemModalTitle">Add New Item</div>
      <button class="modal-close" onclick="closeItemModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Photo</label>
        <div class="photo-upload-zone" id="photoZone" onclick="document.getElementById('photoFileInput').click()">
          <div id="photoPreviewWrap">
            <div class="upload-icon">📷</div>
            <div class="upload-hint">Click to upload photo</div>
          </div>
          <input type="file" id="photoFileInput" accept="image/*" onchange="handlePhotoUpload(event)">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Item Name *</label>
          <input type="text" id="fieldName" placeholder="e.g. MacBook Pro 14"">
        </div>
        <div class="field">
          <label>Serial / ID</label>
          <input type="text" id="fieldSerial" placeholder="e.g. SN123456">
        </div>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="fieldDesc" placeholder="Brief description of the item…"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Condition *</label>
          <select id="fieldCondition">
            <option value="">Select condition</option>
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="fair">Fair</option>
            <option value="poor">Poor</option>
          </select>
        </div>
        <div class="field">
          <label>Location *</label>
          <input type="text" id="fieldLocation" placeholder="e.g. Store Room A, Shelf 3">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Category</label>
          <input type="text" id="fieldCategory" placeholder="e.g. Electronics, Furniture">
        </div>
        <div class="field">
          <label>Manual Value (£)</label>
          <input type="number" id="fieldManualValue" placeholder="Optional override">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeItemModal()">Cancel</button>
      <button class="btn-primary" onclick="saveItem()">Save Item</button>
    </div>
  </div>
</div>

<!-- ── SIGN IN / OUT MODAL ─────────────────────────────────── -->
<div class="overlay" id="signOverlay">
  <div class="modal wide">
    <div class="modal-header">
      <div class="modal-title" id="signModalTitle">Sign Out Item</div>
      <button class="modal-close" onclick="closeSignModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="signLogWrap" style="display:none">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px;">Sign History</div>
        <div class="sign-log" id="signLog"></div>
      </div>

      <div class="field">
        <label>Name *</label>
        <input type="text" id="signName" placeholder="Full name of person signing">
      </div>
      <div class="field">
        <label>Notes</label>
        <input type="text" id="signNotes" placeholder="Purpose / notes (optional)">
      </div>
      <div class="field">
        <label>Signature *</label>
        <div class="sig-wrap">
          <canvas id="sigPad" width="640" height="160"></canvas>
        </div>
        <div class="sig-actions">
          <button class="btn-clear" onclick="clearSig()">✕ Clear</button>
        </div>

      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeSignModal()">Cancel</button>
      <button class="btn-primary" id="signSubmitBtn" onclick="submitSign()">Confirm Sign Out</button>
    </div>
  </div>
</div>

<!-- ── LIGHTBOX ───────────────────────────────────────────────── -->
<div class="overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
</div>

<!-- ── TOAST CONTAINER ───────────────────────────────────────── -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ── STATE ─────────────────────────────────────────────────────────
let items = [];
let currentEditId = null;
let currentSignId = null;
let currentSignAction = null;
let currentPhotoDataUrl = null;
let sigCanvas, sigCtx, sigDrawing = false;

// ── FIREBASE READY ────────────────────────────────────────────────
function onFirebaseReady() {
  document.getElementById('loadingScreen').classList.add('hidden');
  initSignaturePad();
  listenToItems();
}

// Firebase inits synchronously in <head> so __fbReady is already true by now
if (window.__fbReady) {
  onFirebaseReady();
} else {
  document.addEventListener('firebase-ready', onFirebaseReady);
  setTimeout(() => {
    if (!window.__fbReady) {
      document.getElementById('loadingScreen').querySelector('.loading-text').textContent =
        'Could not connect to Firebase. Check your network connection.';
    }
  }, 5000);
}

// ── FIRESTORE LISTENER ────────────────────────────────────────────
function listenToItems() {
  window.__db.collection('inventory').onSnapshot(snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTable();
    updateStats();
  });
}

// ── RENDER TABLE ──────────────────────────────────────────────────
function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const condF = document.getElementById('filterCondition').value;
  const statF = document.getElementById('filterStatus').value;

  let filtered = items.filter(it => {
    const matchQ = !q || [it.name, it.location, it.serial, it.category, it.description]
      .some(f => (f || '').toLowerCase().includes(q));
    const matchC = !condF || it.condition === condF;
    const matchS = !statF || it.status === statF;
    return matchQ && matchC && matchS;
  });

  const tbody = document.getElementById('tableBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7">
      <div class="empty-state">
        <div class="empty-icon">📦</div>
        <h3>No items found</h3>
        <p>Add items using the button above.</p>
      </div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(it => `
    <tr>
      <td>
        ${it.photoUrl
          ? `<img class="item-photo" src="${it.photoUrl}" alt="" onclick="openLightbox('${it.photoUrl}')">`
          : `<div class="photo-placeholder" onclick="openEditModal('${it.id}')">📷</div>`}
      </td>
      <td>
        <div class="item-name">${esc(it.name)}</div>
        <div class="item-id">${esc(it.serial || it.id.slice(0,8))}</div>
      </td>
      <td>
        <span class="badge ${it.condition || 'good'}">
          ${condIcon(it.condition)} ${it.condition || 'good'}
        </span>
      </td>
      <td><span class="location-tag">📍 ${esc(it.location || '—')}</span></td>
      <td>
        ${it.aiValue
          ? `<div class="ai-value">${esc(it.aiValue)}</div><div style="font-size:10px;color:var(--muted)">AI est.</div>`
          : `<button class="btn-value" onclick="lookupValue('${it.id}')">✨ Get Value</button>`}
      </td>
      <td>
        <span class="status-badge ${it.status === 'out' ? 'out' : 'in'}">
          <span class="status-dot"></span>
          ${it.status === 'out' ? 'Signed Out' : 'In'}
        </span>
        ${it.status === 'out' && it.lastSignedBy
          ? `<div style="font-size:11px;color:var(--muted);margin-top:3px">by ${esc(it.lastSignedBy)}</div>`
          : ''}
      </td>
      <td>
        <div class="row-actions">
          ${it.status === 'out'
            ? `<button class="btn-sm sign-in-btn" onclick="openSignModal('${it.id}','in')">↩ Sign In</button>`
            : `<button class="btn-sm sign-out-btn" onclick="openSignModal('${it.id}','out')">↪ Sign Out</button>`}
          <button class="btn-sm" onclick="openEditModal('${it.id}')">✏️</button>
          <button class="btn-sm danger" onclick="deleteItem('${it.id}')">🗑</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function condIcon(c) {
  return { excellent:'⭐', good:'✅', fair:'⚠️', poor:'❌' }[c] || '✅';
}

function esc(s) {
  return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateStats() {
  document.getElementById('statTotal').textContent = items.length;
  document.getElementById('statOut').textContent = items.filter(i=>i.status==='out').length;
  const vals = items.filter(i=>i.aiValue).map(i=>parseFloat((i.aiValue||'').replace(/[^0-9.]/g,'')));
  if (vals.length) {
    const total = vals.reduce((a,b)=>a+b,0);
    document.getElementById('statValue').textContent = '£' + total.toLocaleString('en-GB',{maximumFractionDigits:0});
  }
}

// ── ADD / EDIT MODAL ─────────────────────────────────────────────
function openAddModal() {
  currentEditId = null;
  currentPhotoDataUrl = null;
  resetPhotoPreview();
  ['fieldName','fieldSerial','fieldDesc','fieldLocation','fieldCategory','fieldManualValue']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('fieldCondition').value = '';
  document.getElementById('itemModalTitle').textContent = 'Add New Item';
  document.getElementById('itemOverlay').classList.add('open');
}

function openEditModal(id) {
  const it = items.find(i=>i.id===id);
  if (!it) return;
  currentEditId = id;
  currentPhotoDataUrl = null;
  document.getElementById('itemModalTitle').textContent = 'Edit Item';
  document.getElementById('fieldName').value = it.name || '';
  document.getElementById('fieldSerial').value = it.serial || '';
  document.getElementById('fieldDesc').value = it.description || '';
  document.getElementById('fieldCondition').value = it.condition || '';
  document.getElementById('fieldLocation').value = it.location || '';
  document.getElementById('fieldCategory').value = it.category || '';
  document.getElementById('fieldManualValue').value = it.manualValue || '';
  if (it.photoUrl) {
    document.getElementById('photoPreviewWrap').innerHTML = `<img src="${it.photoUrl}" style="max-width:100%;max-height:160px;border-radius:8px;object-fit:cover">`;
  } else {
    resetPhotoPreview();
  }
  document.getElementById('itemOverlay').classList.add('open');
}

function closeItemModal() {
  document.getElementById('itemOverlay').classList.remove('open');
}

function resetPhotoPreview() {
  document.getElementById('photoPreviewWrap').innerHTML = `
    <div class="upload-icon">📷</div>
    <div class="upload-hint">Click to upload photo</div>
  `;
}

function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    currentPhotoDataUrl = ev.target.result;
    document.getElementById('photoPreviewWrap').innerHTML =
      `<img src="${currentPhotoDataUrl}" style="max-width:100%;max-height:160px;border-radius:8px;object-fit:cover">`;
  };
  reader.readAsDataURL(file);
}

async function saveItem() {
  const name = document.getElementById('fieldName').value.trim();
  const condition = document.getElementById('fieldCondition').value;
  const location = document.getElementById('fieldLocation').value.trim();
  if (!name || !condition || !location) {
    toast('Please fill in Name, Condition, and Location.', 'error'); return;
  }

  // using firebase v8 compat
  const db = window.__db;

  let photoUrl = currentEditId ? (items.find(i=>i.id===currentEditId)||{}).photoUrl || null : null;

  if (currentPhotoDataUrl) {
    try {
      const photoRef = window.__storage.ref(`inventory/${Date.now()}.jpg`);
      await photoRef.putString(currentPhotoDataUrl, 'data_url');
      photoUrl = await photoRef.getDownloadURL();
    } catch(e) {
      console.warn('Photo upload failed, storing as data URL fallback', e);
      photoUrl = currentPhotoDataUrl;
    }
  }

  const db = window.__db;
  const data = {
    name,
    serial: document.getElementById('fieldSerial').value.trim(),
    description: document.getElementById('fieldDesc').value.trim(),
    condition,
    location,
    category: document.getElementById('fieldCategory').value.trim(),
    manualValue: document.getElementById('fieldManualValue').value.trim(),
    photoUrl,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    if (currentEditId) {
      await db.collection('inventory').doc(currentEditId).update(data);
      toast('Item updated.', 'success');
    } else {
      await db.collection('inventory').add({ ...data, status: 'in', signLog: [], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      toast('Item added.', 'success');
    }
    closeItemModal();
  } catch(e) {
    toast('Save failed: ' + e.message, 'error');
  }
}

async function deleteItem(id) {
  if (!confirm('Delete this item?')) return;
  await window.__db.collection('inventory').doc(id).delete();
  toast('Item deleted.', 'info');
}

// ── AI VALUE LOOKUP ────────────────────────────────────────────────
async function lookupValue(id) {
  const it = items.find(i=>i.id===id);
  if (!it) return;

  // Find button and show loading
  const btn = document.querySelector(`button[onclick="lookupValue('${id}')"]`);
  if (btn) { btn.disabled=true; btn.textContent='⏳ Looking up…'; }

  const prompt = `You are a secondhand goods valuations expert. Give a realistic UK market value estimate for the following item.
Item: ${it.name}
Condition: ${it.condition}
${it.description ? 'Description: ' + it.description : ''}
${it.category ? 'Category: ' + it.category : ''}

Respond with ONLY a value range in £ (e.g. "£120 – £180"). No other text.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 100,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const value = (data.content||[]).map(b=>b.text||'').join('').trim();
    if (!value) throw new Error('No value returned');

    await window.__db.collection('inventory').doc(id).update({ aiValue: value, aiValuedAt: new Date().toISOString() });
    toast(`Value estimated: ${value}`, 'success');
  } catch(e) {
    toast('Valuation failed: ' + e.message, 'error');
    if (btn) { btn.disabled=false; btn.textContent='✨ Get Value'; }
  }
}

// ── SIGN IN / OUT ─────────────────────────────────────────────────
function openSignModal(id, action) {
  currentSignId = id;
  currentSignAction = action;
  const it = items.find(i=>i.id===id);
  document.getElementById('signModalTitle').textContent =
    action === 'out' ? `Sign Out: ${it?.name||''}` : `Sign In: ${it?.name||''}`;
  document.getElementById('signName').value = '';
  document.getElementById('signNotes').value = '';
  document.getElementById('signSubmitBtn').textContent =
    action === 'out' ? 'Confirm Sign Out' : 'Confirm Sign In';

  // Show log
  const log = it?.signLog || [];
  const logWrap = document.getElementById('signLogWrap');
  if (log.length) {
    logWrap.style.display = '';
    document.getElementById('signLog').innerHTML = [...log].reverse().map(e => `
      <div class="log-entry">
        <div class="log-entry-header">
          <div class="log-entry-name">${esc(e.name)} 
            <span class="status-badge ${e.action==='out'?'out':'in'}" style="font-size:10px;padding:2px 7px">
              <span class="status-dot"></span>${e.action==='out'?'Out':'In'}
            </span>
          </div>
          <div class="log-entry-time">${e.timestamp ? new Date(e.timestamp).toLocaleString('en-GB') : '—'}</div>
        </div>
        ${e.notes ? `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">${esc(e.notes)}</div>` : ''}
        ${e.signature ? `<img class="log-sig" src="${e.signature}" alt="signature">` : ''}
      </div>
    `).join('');
  } else {
    logWrap.style.display = 'none';
  }

  clearSig();
  document.getElementById('signOverlay').classList.add('open');
  requestAnimationFrame(resizeSigPad);
}

function closeSignModal() {
  document.getElementById('signOverlay').classList.remove('open');
}

async function submitSign() {
  const name = document.getElementById('signName').value.trim();
  if (!name) { toast('Please enter a name.', 'error'); return; }
  if (isSigEmpty()) { toast('Please provide a signature.', 'error'); return; }

  const sigDataUrl = sigCanvas.toDataURL('image/png');
  const it = items.find(i=>i.id===currentSignId);
  const log = [...(it?.signLog || [])];
  log.push({
    name,
    action: currentSignAction,
    notes: document.getElementById('signNotes').value.trim(),
    signature: sigDataUrl,
    timestamp: new Date().toISOString()
  });

  try {
    await window.__db.collection('inventory').doc(currentSignId).update({
      status: currentSignAction,
      lastSignedBy: name,
      signLog: log
    });
    toast(`Item ${currentSignAction === 'out' ? 'signed out' : 'signed in'} by ${name}.`, 'success');
    closeSignModal();
  } catch(e) {
    toast('Sign failed: ' + e.message, 'error');
  }
}

// ── SIGNATURE PAD ─────────────────────────────────────────────────
function initSignaturePad() {
  sigCanvas = document.getElementById('sigPad');
  sigCtx = sigCanvas.getContext('2d');
  resizeSigPad();

  let lastX, lastY;

  function getPos(e) {
    const rect = sigCanvas.getBoundingClientRect();
    const scaleX = sigCanvas.width / rect.width;
    const scaleY = sigCanvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return [(src.clientX - rect.left) * scaleX, (src.clientY - rect.top) * scaleY];
  }

  function startDraw(e) {
    e.preventDefault();
    sigDrawing = true;
    [lastX, lastY] = getPos(e);
    sigCtx.beginPath();
    sigCtx.arc(lastX, lastY, 1.2, 0, Math.PI*2);
    sigCtx.fillStyle = '#1a1a2e';
    sigCtx.fill();
  }
  function draw(e) {
    if (!sigDrawing) return;
    e.preventDefault();
    const [x, y] = getPos(e);
    sigCtx.beginPath();
    sigCtx.moveTo(lastX, lastY);
    sigCtx.lineTo(x, y);
    sigCtx.strokeStyle = '#1a1a2e';
    sigCtx.lineWidth = 2.5;
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';
    sigCtx.stroke();
    [lastX, lastY] = [x, y];
  }
  function endDraw() { sigDrawing = false; }

  sigCanvas.addEventListener('mousedown', startDraw);
  sigCanvas.addEventListener('mousemove', draw);
  sigCanvas.addEventListener('mouseup', endDraw);
  sigCanvas.addEventListener('mouseleave', endDraw);
  sigCanvas.addEventListener('touchstart', startDraw, { passive:false });
  sigCanvas.addEventListener('touchmove', draw, { passive:false });
  sigCanvas.addEventListener('touchend', endDraw);
}

function resizeSigPad() {
  if (!sigCanvas) return;
  const w = sigCanvas.offsetWidth || 640;
  sigCanvas.width = w * window.devicePixelRatio;
  sigCanvas.height = 160 * window.devicePixelRatio;
  sigCanvas.style.height = '160px';
  const ctx = sigCanvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  clearSig();
}

function clearSig() {
  if (!sigCtx) return;
  sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
}

function isSigEmpty() {
  const data = sigCtx.getImageData(0, 0, sigCanvas.width, sigCanvas.height).data;
  for (let i=3; i<data.length; i+=4) if (data[i] > 0) return false;
  return true;
}

// ── LIGHTBOX ──────────────────────────────────────────────────────
function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightboxOverlay').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightboxOverlay').classList.remove('open');
}

// ── TOAST ─────────────────────────────────────────────────────────
function toast(msg, type='info') {
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// close modals on overlay click
document.getElementById('itemOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeItemModal();
});
document.getElementById('signOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeSignModal();
});
</script>
