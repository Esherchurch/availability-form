<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hire our rooms</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-ui.js?v=202610062100"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-church.js?v=202610082000"></script>
<script src="egbc-events-rooms.js?v=202610081800"></script>
<script src="egbc-events.js?v=202610072300"></script>
<script src="egbc-events-bookings.js?v=202610082200"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;--card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:26px;font-weight:700;color:var(--ink);margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 18px;max-width:640px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card)}
  .search{padding:18px;margin-bottom:18px}
  .search h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 12px}
  label.l{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  .inp:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .two{display:flex;gap:12px;flex-wrap:wrap}
  .two>div{flex:1;min-width:150px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:#fff;
        font:500 13px Inter,sans-serif;color:var(--body);cursor:pointer}
  .chip input{display:none}
  .chip.on{background:var(--tint);border-color:var(--brand);color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .room{overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
  .room:hover{box-shadow:0 4px 14px rgba(16,24,40,.08)}
  .room .pic{height:170px;background:#eef2f2 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .room .b{padding:14px 16px 16px}
  .room h3{font-size:16px;font-weight:600;color:var(--ink);margin:0 0 2px}
  .room .m{font-size:13px;color:var(--muted)}
  .facs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;color:var(--brand)}
  .hint{font-size:13px;color:var(--muted)}
  .nofit{margin-top:18px}
  .nofit li{font-size:13px;color:var(--muted);margin:4px 0}
  /* The plain header for the public hire pages: the church's logo and name
     (from Church details) and a way back to the list. No hub menu, no
     sign-in - someone arriving from the church website stays in these pages. */
  .chead{background:#fff;border-bottom:1px solid var(--line)}
  .ch-in{max-width:1000px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ch-logo{width:32px;height:32px;object-fit:contain;border-radius:6px}
  .ch-name{font-size:15px;font-weight:600;color:var(--ink);flex:1;min-width:0}
  .ch-back{font-size:13px;font-weight:500;color:var(--brand);text-decoration:none}
</style>
</head>
<body>
<header class="chead" id="chead"></header>
<div class="wrap">
  <h1>Hire our rooms</h1>
  <p class="sub" id="sub">Rooms for meetings, parties, classes and groups. Tell us what you need and we will show the rooms that fit.</p>
  <div class="card search" id="search"></div>
  <div id="results"><p class="hint">Loading…</p></div>
</div>

<script>
(function () {
  'use strict';
  var R = window.EGBCRooms;
  var ROOMS = [], SITES = {}, NEED = { people: '', layout: '', facilities: [], day: '', from: '', to: '' }, FREE = null, B = window.EGBCBookings;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function icons() { if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons(); }

  /* The search: the rooms that fit, and - given a date and times - the
     ones free then. */
  function drawSearch() {
    document.getElementById('search').innerHTML =
      '<h2>What do you need?</h2><div class="two">' +
        '<div><label class="l" for="q-people">How many people</label><input class="inp" id="q-people" type="number" min="1" inputmode="numeric" value="' + esc(NEED.people) + '"></div>' +
        '<div><label class="l" for="q-layout">Set out as</label><select id="q-layout"><option value="">Any layout</option>' +
          R.LAYOUTS.map(function (x) { return '<option value="' + x.id + '"' + (NEED.layout === x.id ? ' selected' : '') + '>' + x.label + ' (' + x.hint + ')</option>'; }).join('') +
        '</select></div></div>' +
      '<div class="two" style="margin-top:12px">' +
        '<div><label class="l" for="q-day">On (optional)</label><input class="inp" id="q-day" type="date" min="' + B.today() + '" value="' + esc(NEED.day) + '"></div>' +
        '<div><label class="l" for="q-from">From</label><select id="q-from">' + tOpts(NEED.from) + '</select></div>' +
        '<div><label class="l" for="q-to">Until</label><select id="q-to">' + tOpts(NEED.to) + '</select></div></div>' +
      '<div class="chips">' + R.FACILITIES.filter(function (x) { return !x.count; }).map(function (x) {
        var on = NEED.facilities.indexOf(x.id) >= 0;
        return '<label class="chip' + (on ? ' on' : '') + '"><input type="checkbox" class="q-fac" value="' + x.id + '"' + (on ? ' checked' : '') + '>' +
          '<i data-lucide="' + x.icon + '" style="width:15px;height:15px"></i>' + x.label + '</label>';
      }).join('') + '</div>';
    document.getElementById('q-people').oninput = function () { NEED.people = this.value; drawResults(); };
    document.getElementById('q-layout').onchange = function () { NEED.layout = this.value; drawResults(); };
    ['day', 'from', 'to'].forEach(function (k) { document.getElementById('q-' + k).onchange = function () { NEED[k] = this.value; findFree(); }; });
    document.querySelectorAll('.q-fac').forEach(function (c) {
      c.onchange = function () {
        NEED.facilities = [].slice.call(document.querySelectorAll('.q-fac:checked')).map(function (x) { return x.value; });
        c.parentNode.classList.toggle('on', c.checked);
        drawResults();
      };
    });
    icons();
  }

  function tOpts(sel) {
    var o = '<option value="">Any time</option>';
    for (var m = 360; m <= 1425; m += 15) { var t = B.hhmm(m); o += '<option value="' + t + '"' + (t === sel ? ' selected' : '') + '>' + t + '</option>'; }
    return o;
  }
  /* Which rooms have every quarter-hour free between the two times. */
  function findFree() {
    var s = NEED.day && NEED.from && NEED.to ? B.slots(B.toMin(NEED.from), B.toMin(NEED.to), 0, 0) : null;
    if (!s) { FREE = null; drawResults(); return; }
    var want = NEED.day + NEED.from + NEED.to;
    B.loadDays(ROOMS, NEED.day).then(function (days) {
      if (want !== NEED.day + NEED.from + NEED.to) return;
      FREE = {}; ROOMS.forEach(function (r) { FREE[r.id] = B.free(days[r.id], s); });
      drawResults();
    });
  }

  function sizes(r) {
    var bits = R.LAYOUTS.filter(function (x) { return (r.layouts || {})[x.id]; }).map(function (x) { return R.holds(r, x.id) + ' ' + x.label.toLowerCase(); });
    if (!bits.length && R.holds(r)) bits.push('up to ' + R.holds(r));
    return bits.join(' · ');
  }

  function card(r) {
    var ph = R.mainPhoto(r), a = R.area(r);
    var when = FREE ? '&day=' + NEED.day + '&start=' + NEED.from + '&end=' + NEED.to : '';
    return '<a class="card room" href="' + (FREE ? 'book.html?room=' + encodeURIComponent(r.id) + when : 'room.html?id=' + encodeURIComponent(r.id)) + '" data-room="' + esc(r.id) + '">' +
      '<div class="pic"' + (ph ? ' style="background-image:url(\'' + esc(ph.url) + '\')"' : '') + '>' + (ph ? '' : '<i data-lucide="image" style="width:28px;height:28px"></i>') + '</div>' +
      '<div class="b"><h3>' + esc(r.name) + '</h3>' +
        '<div class="m">' + esc(SITES[r.siteId] || '') + (a ? ' · ' + a + ' m²' : '') + '</div>' +
        (sizes(r) ? '<div class="m" style="margin-top:4px">Holds ' + esc(sizes(r)) + '</div>' : '') +
        '<div class="facs">' + R.FACILITIES.filter(function (x) { return R.has(r, x.id); }).map(function (x) {
          return '<i data-lucide="' + x.icon + '" style="width:18px;height:18px" title="' + esc(x.label) + '" aria-label="' + esc(x.label) + '"></i>';
        }).join('') + '</div></div></a>';
  }

  function drawResults() {
    var need = { people: Number(NEED.people) || 0, layout: NEED.layout, facilities: NEED.facilities };
    var fits = [], not = [];
    ROOMS.forEach(function (r) {
      var f = R.fit(r, need);
      if (FREE && !FREE[r.id]) { f = { ok: false, why: f.why.concat(['booked then']) }; }
      (f.ok ? fits : not).push({ r: r, why: f.why });
    });
    var asked = need.people || need.layout || need.facilities.length || FREE;
    document.getElementById('results').innerHTML =
      (fits.length ? '<p class="hint" id="count">' + (asked ? fits.length + ' room' + (fits.length === 1 ? '' : 's') + ' fit what you need' + (FREE ? ' and ' + (fits.length === 1 ? 'is' : 'are') + ' free then. Choose one to ask for it.' : '.') : ROOMS.length + ' rooms for hire.') + '</p>' +
        '<div class="grid">' + fits.map(function (x) { return card(x.r); }).join('') + '</div>'
        : '<div class="card" style="padding:18px"><p style="margin:0" id="count">No room fits all of that. Try fewer things, or ask us: we may be able to help.</p></div>') +
      (asked && not.length ? '<div class="nofit"><p class="hint" style="margin:0">Not shown:</p><ul>' + not.map(function (x) {
        return '<li>' + esc(x.r.name) + ': ' + esc(x.why.join(', ')) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<p class="hint" style="margin-top:20px">Prices depend on the room and the time; ask when you ask to book.</p>';
    icons();
  }

  /* Read as anyone would: these pages never look at who is signed in. */
  EGBCChurch.load().then(function (c) {
    EGBCChurch.header(document.getElementById('chead'), { back: false });
    if (c.name) document.getElementById('sub').textContent = 'Rooms at ' + c.name + ' for meetings, parties, classes and groups. Tell us what you need and we will show the rooms that fit.';
    EGBCChurch.title('Hire our rooms');
    var db = EGBCAuth.db;
    return Promise.all([db.collection('rooms').where('active', '==', true).get(), db.collection('sites').where('active', '==', true).get()]);
  }).then(function (r) {
    r[1].docs.forEach(function (d) { SITES[d.id] = d.data().name || ''; });
    ROOMS = R.hireable(r[0].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }))
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    drawSearch(); drawResults();
  }).catch(function (e) {
    document.getElementById('results').innerHTML = '<div class="card" style="padding:18px">The rooms could not be loaded. Please try again later.</div>';
  });
})();
</script>
</body>
</html>
