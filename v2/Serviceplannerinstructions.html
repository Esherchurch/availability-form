<!DOCTYPE html>
<html lang="en">
<head>
<script src="egbc-shell.js?v=202609041745" data-title="Sunday Planner - how to"></script>

<title>Worship Planner — How to Use | Worship & AV Hub</title>
<style>
  :root{
    --canvas:#eef4f3;--surface:#fff;--surface-2:#f6faf9;--ink:#14201f;--body:#3a4d4c;--muted:#6b8281;--faint:#93a8a6;
    --hairline:#dde7e6;--hairline-strong:#c9d8d6;--brand:#3d6263;--brand-dark:#2e4c4d;--brand-tint:#e7f0ef;--brand-ring:rgba(61,98,99,.28);
    --success:#3b7d23;--success-tint:#e7f1e0;--danger:#b0392c;--danger-tint:#f7e7e4;--gold:#b07d2e;--gold-tint:#f6efe1;
    --shadow-sm:0 1px 2px rgba(20,32,31,.05);--shadow:0 1px 2px rgba(20,32,31,.04),0 6px 20px rgba(20,32,31,.07);--shadow-lg:0 2px 4px rgba(20,32,31,.05),0 18px 48px rgba(20,32,31,.12);
    --r-sm:8px;--r-md:12px;--r-lg:18px;--r-pill:999px;
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:0; background:var(--brand); font-family:'Segoe UI', Arial, sans-serif; color:var(--body); }

  .site-header { height:90px; background:var(--surface); padding:0 40px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--hairline); box-shadow:var(--shadow-sm); }

  .tut-outer { background:var(--brand); padding:28px 20px 48px; min-height:calc(100vh - 90px); }
  .tut-inner { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:32px; max-width:760px; margin:0 auto; box-shadow:var(--shadow-lg); }

  .chapter-nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:22px; }
  .chapter-pill { font-size:13px; font-weight:700; padding:6px 14px; border-radius:var(--r-pill); cursor:pointer; border:1px solid var(--hairline-strong); color:var(--muted); background:var(--surface-2); transition:all .15s; font-family:inherit; }
  .chapter-pill:hover { border-color:var(--brand); color:var(--brand); }
  .chapter-pill.active { background:var(--brand); color:#fff; border-color:var(--brand); }

  .tut-heading { margin:0 0 6px; font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--ink); text-transform:none; }
  .tut-subheading { margin:0 0 22px; font-size:13px; font-weight:500; color:var(--muted); }

  .progress-bar-bg { height:6px; background:var(--hairline); border-radius:var(--r-pill); margin-bottom:1.5rem; overflow:hidden; }
  .progress-bar-fill { height:6px; background:var(--brand); border-radius:var(--r-pill); transition:width .35s ease; }

  .step-badge { display:inline-block; font-size:12px; font-weight:700; color:var(--brand); background:var(--brand-tint); border-radius:var(--r-pill); padding:5px 12px; margin-bottom:12px; }
  .step-title { font-size:20px; font-weight:800; letter-spacing:-.015em; color:var(--ink); margin:0 0 10px; }
  .step-desc { font-size:16px; font-weight:400; line-height:1.7; color:var(--body); margin:0 0 1.25rem; }

  .sim-area { border:1px solid var(--hairline); border-radius:var(--r-md); overflow:hidden; margin-bottom:1.25rem; background:var(--surface); box-shadow:var(--shadow-sm); }
  .sim-topbar { background:var(--surface-2); border-bottom:1px solid var(--hairline); padding:11px 16px; font-size:13px; font-weight:700; color:var(--brand); }
  .sim-body { padding:16px; }

  .highlight { outline:2.5px solid var(--brand); outline-offset:1px; border-radius:var(--r-sm); animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{ outline-color:var(--brand); } 50%{ outline-color:var(--brand-ring); } }

  .tip-box { background:var(--brand-tint); border:1px solid var(--hairline-strong); border-radius:var(--r-md); padding:12px 15px; font-size:13px; font-weight:500; color:var(--brand-dark); margin-bottom:1.25rem; line-height:1.6; }
  .tip-box::before { content: "💡 "; }
  .warn-box { background:var(--gold-tint); border:1px solid #e6cc96; border-radius:var(--r-md); padding:12px 15px; font-size:13px; font-weight:500; color:#7a5500; margin-bottom:1.25rem; line-height:1.6; }
  .warn-box::before { content: "⚠️ "; }

  .nav-row { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .nav-btn { background:var(--surface); border:1px solid var(--hairline-strong); border-radius:var(--r-md); padding:11px 20px; font-size:14px; font-weight:700; cursor:pointer; color:var(--brand); font-family:inherit; transition:all .15s; }
  .nav-btn:hover { background:var(--surface-2); border-color:var(--brand); }
  .nav-btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .nav-btn.primary:hover { background:var(--brand-dark); border-color:var(--brand-dark); }
  .step-counter { font-size:13px; font-weight:500; color:var(--muted); text-align:center; }

  .sim-btn-primary { display:inline-block; background:var(--brand); color:#fff; padding:8px 16px; border-radius:var(--r-md); font-size:12px; font-weight:700; cursor:default; }
  .sim-btn-secondary { display:inline-block; background:var(--brand-tint); color:var(--brand); border:1px solid var(--hairline-strong); padding:8px 16px; border-radius:var(--r-md); font-size:12px; font-weight:700; cursor:default; }
  .sim-input { display:inline-block; background:var(--surface); border:1px solid var(--hairline-strong); border-radius:var(--r-md); padding:7px 12px; font-size:13px; font-weight:700; color:var(--brand); }
  .sim-select { display:inline-block; background:var(--surface); border:1px solid var(--hairline-strong); border-radius:var(--r-md); padding:7px 12px; font-size:13px; font-weight:700; color:var(--brand); }
  .sim-tag { display:inline-block; background:var(--brand-tint); border:1px solid var(--hairline); border-radius:var(--r-sm); padding:3px 10px; font-size:11px; font-weight:700; color:var(--brand); margin:2px; }
  .sim-song-block { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-md); padding:14px 16px; margin-bottom:10px; }
  .sim-item-block { background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-md); padding:10px 16px; margin-bottom:8px; font-weight:700; font-size:13px; color:var(--brand); display:flex; align-items:center; gap:10px; }
  .drag-handle-sim { color:var(--faint); font-size:18px; cursor:grab; }
  .song-num { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .conf-teal { background:var(--brand-tint); color:var(--brand); }
  .rota-table { width:100%; border-collapse:separate; border-spacing:0 4px; font-size:13px; }
  .rota-table th { text-align:left; padding:8px 10px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:800; }
  .rota-table td { padding:10px 12px; background:var(--surface); border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline); color:var(--ink); }
  .rota-table td:first-child { border-left:1px solid var(--hairline); border-radius:var(--r-md) 0 0 var(--r-md); font-weight:700; color:var(--brand); }
  .rota-table td:last-child { border-right:1px solid var(--hairline); border-radius:0 var(--r-md) var(--r-md) 0; }
  .rota-tech td:first-child { color:var(--success); }
  .modal-sim { background:var(--surface); border-radius:var(--r-lg); padding:20px; border:1px solid var(--hairline); max-width:340px; margin:0 auto; box-shadow:var(--shadow-lg); }

  .finish-box { text-align:center; padding:2rem 0; }
  .finish-box h2 { font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--ink); margin:0 0 10px; }
  .finish-box p { color:var(--body); font-size:16px; line-height:1.7; margin:0 0 1.25rem; }
</style>
</head>
<body>

<div class="site-header">
  <img src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media&token=ea8cd929-6f35-4a23-9ffa-e78ac46fa300"
       style="height: 75px; width: auto; margin-top: 8px;" alt="Church logo">
  <div style="text-align: right; margin-top: 8px;">
    <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800;">Secure Portal</div>
    <div style="font-size: 13px; color: var(--brand); font-weight: 700;">Worship & AV Hub</div>
  </div>
</div>

<div class="tut-outer">
  <div class="tut-inner">

    <p class="tut-heading">Sunday Worship Planner — How to use</p>
    <p class="tut-subheading">Click any chapter to jump ahead, or use Next to work through from the beginning.</p>

    <div class="chapter-nav" id="chapterNav"></div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog"></div></div>
    <div id="step-content"></div>

    <div class="nav-row">
      <button class="nav-btn" id="btn-prev" onclick="changeStep(-1)">← Back</button>
      <span class="step-counter" id="step-ctr"></span>
      <button class="nav-btn primary" id="btn-next" onclick="changeStep(1)">Next →</button>
    </div>

  </div>
</div>

<script>
const chapters = [
  { label: "Overview" },
  { label: "Setup" },
  { label: "Order of Service" },
  { label: "Songs" },
  { label: "Team" },
  { label: "Saving & Emailing" },
];

const steps = [

  // ── CHAPTER 1: OVERVIEW ──
  {
    chapter: 0,
    badge: "Chapter 1 — Overview",
    title: "What is the Sunday Worship Planner?",
    desc: "The Worship Planner is where you build the full plan for a Sunday service. You can plan the songs, arrange the order of service, see who's on the team, add notes for each person, and then send the whole plan to the team by email — all from one page.",
    tip: "Nothing is sent or saved until you press a button. You can plan freely without worrying about sending something by accident.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Sunday Worship Planner — at a glance</div>
        <div class="sim-body" style="text-align:center; padding:24px 16px">
          <p style="font-size:28px;margin:0 0 10px">🎵</p>
          <p style="font-size:14px;color:#4a6060;margin:0 0 20px">Plan your whole service in one place</p>
          <div style="display:flex;justify-content:center;gap:20px;flex-wrap:wrap">
            <div style="text-align:center;font-size:12px;color:#4a6060"><div style="font-size:20px">📅</div>Pick the date & service</div>
            <div style="text-align:center;font-size:12px;color:#4a6060"><div style="font-size:20px">🎶</div>Build the order of service</div>
            <div style="text-align:center;font-size:12px;color:#4a6060"><div style="font-size:20px">👥</div>See the team rota</div>
            <div style="text-align:center;font-size:12px;color:#4a6060"><div style="font-size:20px">💾</div>Save & email the plan</div>
          </div>
        </div>
      </div>`
  },

  // ── CHAPTER 2: SETUP ──
  {
    chapter: 1,
    badge: "Chapter 2 — Setup",
    title: "Step 1: Pick the date",
    desc: "At the top of the page you'll see a date picker. Click on it and choose the Sunday you're planning for. As soon as you pick a date, the planner automatically looks up what services are happening that day.",
    tip: "Always start by picking the date first — everything else on the page depends on it.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Top bar — date picker</div>
        <div class="sim-body">
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <div>
              <p style="font-size:11px;color:#7a9a9a;font-weight:700;margin:0 0 4px;text-transform:uppercase">1. Click here first</p>
              <input type="date" class="sim-input highlight" value="2025-06-15" style="min-width:150px">
            </div>
            <div style="opacity:0.3">
              <p style="font-size:11px;color:#7a9a9a;font-weight:700;margin:0 0 4px;text-transform:uppercase">2. Then this appears</p>
              <span class="sim-select">Select Service...</span>
            </div>
          </div>
        </div>
      </div>`
  },
  {
    chapter: 1,
    badge: "Chapter 2 — Setup",
    title: "Step 2: Choose the service",
    desc: "Once you've picked a date, a dropdown appears showing the services happening that day — for example \"Morning Service\" or \"Evening Service\". Click on the one you want to plan for.<br><br>The page will then load the team rota and any previously saved plan for that service automatically.",
    tip: "If the dropdown is empty after picking a date, it means no services have been set up in the rota for that day yet. Check with whoever manages the rota.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Choosing a service</div>
        <div class="sim-body">
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start">
            <div>
              <p style="font-size:11px;color:#7a9a9a;font-weight:700;margin:0 0 4px;text-transform:uppercase">Date chosen</p>
              <span class="sim-input">15 June 2025</span>
            </div>
            <div>
              <p style="font-size:11px;color:#7a9a9a;font-weight:700;margin:0 0 4px;text-transform:uppercase">Now pick the service</p>
              <select class="sim-select highlight" style="min-width:180px">
                <option>Select Service...</option>
                <option selected>Morning Service</option>
                <option>Evening Service</option>
              </select>
            </div>
          </div>
          <div style="margin-top:14px;padding:10px 14px;background:#e6f0f0;border-radius:8px;font-size:13px;color:#3d6263;font-weight:700">
            ✓ Team rota loaded &nbsp;·&nbsp; Worship Leader: <strong>Sarah</strong>
          </div>
        </div>
      </div>`
  },
  {
    chapter: 1,
    badge: "Chapter 2 — Setup",
    title: "General Notes for the service",
    desc: "Next to the date and service dropdowns, there's a \"General Notes\" field. This fills in automatically from the main rota when you select the service — so you'll usually see something already there.<br><br>You can edit it if you need to add or change anything. These notes appear at the top of the team email.",
    tip: "Because this comes from the rota, you usually won't need to touch it — just check it looks right before sending.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">General Notes — auto-filled from the rota</div>
        <div class="sim-body">
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <span class="sim-input" style="min-width:150px">15 June 2025</span>
            <span class="sim-select">Morning Service</span>
            <input class="sim-input highlight" value="Communion this week" style="min-width:220px">
          </div>
          <p style="font-size:12px;color:#7a9a9a;margin:10px 0 0">↑ This filled in automatically from the rota — you can still edit it if needed</p>
        </div>
      </div>`
  },

  // ── CHAPTER 3: ORDER OF SERVICE ──
  {
    chapter: 2,
    badge: "Chapter 3 — Order of Service",
    title: "What is the Order of Service?",
    desc: "The Order of Service is the running list of everything that happens during the service — songs, the message, welcome and notices, and anything else. You build it by adding songs and service items, and you can drag them into the right order.",
    tip: "A default order is set up for you when you load the page — you can add, remove, or rearrange anything.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Example order of service</div>
        <div class="sim-body">
          <div class="sim-song-block" style="display:flex;gap:10px;align-items:center">
            <span class="drag-handle-sim">⠿</span><span class="song-num">Song 1</span>
            <span style="font-size:13px;font-weight:700;color:#3d6263;flex:1">How Great Is Our God</span>
            <span class="sim-tag">G</span>
          </div>
          <div class="sim-song-block" style="display:flex;gap:10px;align-items:center">
            <span class="drag-handle-sim">⠿</span><span class="song-num">Song 2</span>
            <span style="font-size:13px;font-weight:700;color:#3d6263;flex:1">Amazing Grace</span>
            <span class="sim-tag">D</span>
          </div>
          <div class="sim-item-block"><span class="drag-handle-sim">⠿</span><span>Welcome and Notices</span></div>
          <div class="sim-song-block" style="display:flex;gap:10px;align-items:center">
            <span class="drag-handle-sim">⠿</span><span class="song-num">Song 3</span>
            <span style="font-size:13px;font-weight:700;color:#3d6263;flex:1">In Christ Alone</span>
            <span class="sim-tag">E</span>
          </div>
          <div class="sim-item-block"><span class="drag-handle-sim">⠿</span><span>Message</span></div>
        </div>
      </div>`
  },
  {
    chapter: 2,
    badge: "Chapter 3 — Order of Service",
    title: "Adding songs and service items",
    desc: "Use the two buttons above the order of service list to add things:<br><br><strong>+ Add Song</strong> — adds a new song slot where you can search for a song from the library.<br><br><strong>+ Add Item</strong> — adds a text item like \"Welcome\", \"Message\", \"Communion\" or anything else that's not a song.<br><br>Each item can be deleted using the × button on the right.",
    tip: "Service items (like Welcome and Message) are just labels — type whatever you like in them.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Add Song and Add Item buttons</div>
        <div class="sim-body">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
            <span class="sim-btn-secondary highlight">+ Add Song</span>
            <span class="sim-btn-secondary">+ Add Item</span>
          </div>
          <div class="sim-song-block" style="display:flex;gap:10px;align-items:center;border:2px dashed #3d6263">
            <span class="drag-handle-sim">⠿</span><span class="song-num">Song 4</span>
            <input class="sim-input" placeholder="Song title" style="flex:1;min-width:120px">
            <span style="color:#d1dfdf;font-size:18px;font-weight:700">×</span>
          </div>
          <p style="font-size:12px;color:#7a9a9a;margin:8px 0 0">A new song slot appears — ready for you to type in</p>
        </div>
      </div>`
  },
  {
    chapter: 2,
    badge: "Chapter 3 — Order of Service",
    title: "Reordering with drag and drop",
    desc: "You can drag any song or item into a different position. Each row has a dotted drag handle (⠿) on the left — click and hold that, then drag the row up or down to where you want it.<br><br>The song numbers update automatically when you rearrange.",
    tip: "On a touchscreen, press and hold the drag handle for a moment before dragging.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Drag to reorder — grab the ⠿ handle</div>
        <div class="sim-body">
          <div class="sim-song-block" style="display:flex;gap:10px;align-items:center;border:2px solid #3d6263;background:#e6f0f0">
            <span class="drag-handle-sim highlight" style="color:#3d6263;font-size:22px">⠿</span>
            <span class="song-num">Song 2</span>
            <span style="font-size:13px;font-weight:700;color:#3d6263;flex:1">Amazing Grace</span>
            <span style="font-size:11px;color:#7a9a9a;font-style:italic">← being dragged</span>
          </div>
          <div class="sim-item-block" style="opacity:0.4"><span class="drag-handle-sim">⠿</span><span>Welcome and Notices</span></div>
          <div class="sim-song-block" style="display:flex;gap:10px;align-items:center;opacity:0.4">
            <span class="drag-handle-sim">⠿</span><span class="song-num">Song 3</span>
            <span style="font-size:13px;font-weight:700;color:#3d6263;flex:1">In Christ Alone</span>
          </div>
          <p style="font-size:12px;color:#7a9a9a;margin:10px 0 0">Grab the ⠿ handle and drag — song numbers update automatically</p>
        </div>
      </div>`
  },
  {
    chapter: 2,
    badge: "Chapter 3 — Order of Service",
    title: "Opening and Closing Remarks",
    desc: "At the top and bottom of the page there are two text boxes:<br><br><strong>Opening Remarks</strong> — this becomes the introduction at the top of the team email, just below the service notes. Use it for a personal message to the team, a call to worship, or anything you want them to read before seeing the order of service.<br><br><strong>Closing Remarks</strong> — this appears at the very end of the email, after the team rota. Use it for a blessing, closing encouragement, or any final reminders.",
    tip: "Think of these as your personal message wrapping the email — the opening sets the tone, the closing sends the team off well.",
    render: () => `
      <div class="sim-area">
        <div class="sim-topbar">Opening & Closing Remarks — email intro and ending</div>
        <div class="sim-body">
          <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.2em;color:#3d6263;opacity:0.6;margin:0 0 6px">Opening Remarks</p>
          <textarea class="sim-input highlight" style="width:100%;min-height:55px;font-size:12px;font-weight:400;color:#4a6060;resize:none" readonly>Hi team — really looking forward to worshipping together this Sunday. Let's make sure we arrive by 9:15 for sound check...</textarea>
          <div style="margin:10px 0;padding:8px 12px;background:#e6f0f0;border-radius:8px;font-size:11px;color:#3d6263;font-weight:700">↑ Appears at the top of the email, just below the service notes</div>
          <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.2em;color:#3d6263;opacity:0.6;margin:12px 0 6px">Closing Remarks</p>
          <textarea class="sim-input" style="width:100%;min-height:45px;font-size:12px;font-weight:400;color:#4a6060;resize:none;opacity:0.7" readonly>May the Lord bless you and keep you. See you Sunday!</textarea>
          <div style="margin:10px 0;padding:8px 12px;background:#f4f8f8;border-radius:8px;font-size:11px;color:#3d6263;font-weight:700">↑ Appears at the very end of the email, after the team rota</div>
        </div>
      </div>`
  },

  // ── CHAPTER 4: SONGS ──
  {
    chapter: 3,
    badge: "Chapter 4 — Songs",
    title: "Searching for a song",
    desc: "When you add a song slot, click in the title field and start typing. After 2 letters, a list of matching songs from the library appears below — click on the one you want to select it.<br><br>If the song isn't in the library, you'll see links to search SongSelect and YouTube, and an option to upload the song.",
    tip: "You can search by any word in the title — you don't have to start from the beginning. For example, typing \"great\" will find \"How Great Is Our God\".",

let current = 0;

function buildChapterNav() {
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = '';
  chapters.forEach((ch, i) => {
    const pill = document.createElement('button');
    pill.className = 'chapter-pill' + (i === steps[current].chapter ? ' active' : '');
    pill.textContent = ch.label;
    pill.onclick = () => jumpToChapter(i);
    nav.appendChild(pill);
  });
}

function jumpToChapter(chIdx) {
  const idx = steps.findIndex(s => s.chapter === chIdx);
  if (idx !== -1) { current = idx; render(); }
}

function render() {
  const s = steps[current];
  const pct = Math.round(((current + 1) / steps.length) * 100);
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('step-ctr').textContent = `Step ${current + 1} of ${steps.length}`;
  document.getElementById('btn-prev').style.visibility = current === 0 ? 'hidden' : 'visible';
  document.getElementById('btn-next').style.display = '';
  document.getElementById('btn-prev').style.display = '';
  document.getElementById('btn-next').textContent = current === steps.length - 1 ? 'Finish ✓' : 'Next →';
  buildChapterNav();

  document.getElementById('step-content').innerHTML = `
    <span class="step-badge">${s.badge}</span>
    <p class="step-title">${s.title}</p>
    <p class="step-desc">${s.desc}</p>
    ${s.render()}
    <div class="tip-box">${s.tip}</div>
  `;
}

function changeStep(dir) {
  if (current + dir < 0) return;
  if (current + dir >= steps.length) {
    document.getElementById('step-content').innerHTML = `
      <div class="finish-box">
        <h2>All done! 🎉</h2>
        <p>You now know how to use the Sunday Worship Planner from start to finish.<br>Use the chapter buttons above to jump back to any section at any time.</p>
        <button class="nav-btn primary" onclick="current=0;render()">Start again from the beginning</button>
      </div>
      <div class="tip-box" style="margin-top:1.5rem">Remember: nothing is sent or saved until you press a button — so you can explore the planner freely without worrying about making a mistake.</div>
    `;
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('btn-prev').style.display = 'none';
    document.getElementById('step-ctr').textContent = 'Complete ✓';
    document.getElementById('prog').style.width = '100%';
    buildChapterNav();
    return;
  }
  current += dir;
  render();
}

render();
