<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event — EGBC</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610062100" data-title="Event"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-ics.js?v=202610062100"></script>
<script src="egbc-email.js?v=202610062100"></script>
<script src="egbc-events.js?v=202610062100"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);
        padding:20px;margin-bottom:14px}
  h1{font-size:24px;font-weight:700;color:var(--ink);margin:0 0 6px}
  h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .hero{width:100%;max-height:260px;object-fit:cover;border-radius:14px;border:1px solid var(--line);margin-bottom:14px;display:block}
  .meta{color:var(--muted);font-size:14px;margin:0 0 4px;display:flex;gap:8px;align-items:flex-start}
  .meta i{flex:none;margin-top:2px;color:var(--brand)}
  .desc{margin-top:14px;color:var(--body);line-height:1.6}
  .desc img{max-width:100%}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
       border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#f9fafb;margin:8px 6px 0 0}
  .dot{width:8px;height:8px;border-radius:9999px;flex:none}

  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select,textarea{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;
       font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  textarea{height:auto;padding:10px 12px;min-height:76px;resize:vertical}
  .inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .field{margin-bottom:14px}
  .two{display:flex;gap:12px;flex-wrap:wrap}
  .two>.field{flex:1;min-width:190px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
       border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent;
       background:var(--brand);color:#fff;text-decoration:none}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.sec:hover{background:#f3f4f6}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:#f3f4f6}

  .att{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
  .att .field{flex:1;margin:0}
  .banner{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:14px}
  .banner.warn{background:var(--danger-bg);color:var(--danger)}
  .banner.info{background:var(--tint);color:var(--body);border:1px solid #cfe0de}
  .banner.ok{background:var(--ok-bg);color:var(--ok)}
  .hint{font-size:13px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="card" id="loading">Loading…</div>
</div>

<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, esc = E.esc;
  var ID = new URLSearchParams(location.search).get('event') || '';
  var EV = null, TT = [], QS = [], CAP = null, LOOK = {}, WHERE = '';
  var openedAt = Date.now();          /* for the minimum fill time */
  var attendees = [{ name: '' }];

  function catOf(ev) {
    return E.CATEGORIES.filter(function (c) { return c.id === (ev.category || 'other'); })[0] || E.CATEGORIES[7];
  }

  function left() { return CAP ? E.placesLeft(CAP) : null; }
  function full() { var l = left(); return l !== null && l <= 0; }

  function questionField(q, idPrefix) {
    var id = idPrefix + q.id;
    var lab = '<label for="' + id + '">' + esc(q.label || 'Question') + (q.required ? ' *' : '') + '</label>';
    if (q.kind === 'choice') {
      return '<div class="field">' + lab + '<select id="' + id + '" ' + (q.required ? 'required' : '') + '>' +
        '<option value="">Choose…</option>' +
        (q.options || []).map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') +
        '</select></div>';
    }
    if (q.kind === 'yesno') {
      return '<div class="field">' + lab + '<select id="' + id + '" ' + (q.required ? 'required' : '') + '>' +
        '<option value="">Choose…</option><option>Yes</option><option>No</option></select></div>';
    }
    if (q.kind === 'number') {
      return '<div class="field">' + lab + '<input class="inp" type="number" id="' + id + '" ' + (q.required ? 'required' : '') + '></div>';
    }
    return '<div class="field">' + lab + '<input class="inp" type="text" id="' + id + '" maxlength="300" ' + (q.required ? 'required' : '') + '></div>';
  }

  function attendeeRows() {
    var perAtt = QS.filter(function (q) { return q.per === 'attendee'; });
    return attendees.map(function (a, i) {
      return '<div class="att">' +
        '<div class="field"><label for="att' + i + '">Person ' + (i + 1) + '</label>' +
        '<input class="inp" id="att' + i + '" value="' + esc(a.name || '') + '" placeholder="Name" maxlength="120"></div>' +
        (i > 0 ? '<button type="button" class="btn ghost" data-drop="' + i + '" aria-label="Remove">' +
                 '<i data-lucide="x" style="width:16px;height:16px"></i></button>' : '') +
        '</div>' +
        perAtt.map(function (q) { return questionField(q, 'a' + i + '_'); }).join('');
    }).join('');
  }

  function formHtml() {
    var p = E.signedIn() ? EGBCAuth.profile() : null;
    var waiting = full();
    var perBooking = QS.filter(function (q) { return q.per !== 'attendee'; });
    return '<div class="card" id="signupCard">' +
      '<h2>' + (waiting ? 'Join the waiting list' : 'Sign up') + '</h2>' +
      (waiting ? '<div class="banner info">This event is full. Join the waiting list and we will be in touch if a place comes free.</div>' : '') +
      (p ? '<div class="banner info">Signed in as ' + esc(p.name || p.email) + '. Your sign-up will be linked to your record.</div>' : '') +
      '<form id="f" novalidate>' +
        '<div class="two">' +
          '<div class="field"><label for="nm">Your name *</label>' +
            '<input class="inp" id="nm" maxlength="120" required value="' + esc(p ? (p.name || '') : '') + '"></div>' +
          '<div class="field"><label for="em">Your email *</label>' +
            '<input class="inp" id="em" type="email" maxlength="200" required value="' + esc(p ? (p.email || '') : '') + '"></div>' +
        '</div>' +
        '<div class="field"><label for="ph">Phone (optional)</label><input class="inp" id="ph" maxlength="40"></div>' +
        (TT.length > 1 ? '<div class="field"><label for="tt">Ticket</label><select id="tt">' +
          TT.map(function (t) {
            return '<option value="' + esc(t.id) + '">' + esc(t.name) +
                   (t.price ? ' — £' + Number(t.price).toFixed(2) : ' — free') + '</option>';
          }).join('') + '</select></div>' : '') +
        '<div class="field"><label>Who is coming</label><div id="atts">' + attendeeRows() + '</div>' +
          '<button type="button" class="btn sec sm" id="addAtt"><i data-lucide="plus" style="width:15px;height:15px"></i>Add someone else</button>' +
        '</div>' +
        perBooking.map(function (q) { return questionField(q, 'b_'); }).join('') +
        (EV.donationsOn ? '<div class="field"><label for="don">Optional donation (£)</label>' +
          '<input class="inp" id="don" type="number" min="0" step="1"></div>' +
          '<p class="hint">Separate from any ticket, and entirely optional. We will be in touch about how to give it.</p>' : '') +
        '<div class="field"><label for="notes">Anything we should know? (optional)</label>' +
          '<textarea id="notes" maxlength="2000"></textarea></div>' +
        /* Spam defence, §7.2: a field no person sees, and a form that was
           filled in impossibly fast. Neither is a wall; both are free. */
        '<div class="hp" aria-hidden="true"><label>Leave this empty<input id="website" tabindex="-1" autocomplete="off"></label></div>' +
        '<div id="err"></div>' +
        '<button class="btn" id="go" type="submit">' +
          '<i data-lucide="check" style="width:16px;height:16px"></i>' +
          (waiting ? 'Join the waiting list' : 'Sign up') + '</button>' +
      '</form></div>';
  }

  function draw() {
    var cat = catOf(EV);
    var l = left();
    var closed = EV.status === 'cancelled' || !EV.signupOn;
    var html =
      (EV.image ? '<img class="hero" src="' + esc(EV.image) + '" alt="">' : '') +
      '<div class="card">' +
        (EV.status === 'cancelled' ? '<div class="banner warn">This event has been cancelled.</div>' : '') +
        (EV.status === 'pending' ? '<div class="banner info">Not announced yet — you are seeing it because you are signed in.</div>' : '') +
        '<h1>' + esc(EV.title || 'Event') + '</h1>' +
        '<p class="meta"><i data-lucide="calendar-days" style="width:16px;height:16px"></i>' + esc(E.fmtWhen(EV)) + '</p>' +
        (WHERE ? '<p class="meta"><i data-lucide="map-pin" style="width:16px;height:16px"></i>' + esc(WHERE) + '</p>' : '') +
        (EV.organiserName ? '<p class="meta"><i data-lucide="user" style="width:16px;height:16px"></i>' + esc(EV.organiserName) + '</p>' : '') +
        (EV.signupOn && l !== null && EV.status !== 'cancelled'
          ? '<p class="meta"><i data-lucide="users" style="width:16px;height:16px"></i>' +
            (l > 0 ? l + ' place' + (l === 1 ? '' : 's') + ' left of ' + CAP.capacity : 'Full — waiting list open') + '</p>'
          : '') +
        '<div>' +
          '<span class="tag"><span class="dot" style="background:' + cat.colour + '"></span>' + esc(cat.name) + '</span>' +
          (EV.labels || []).map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('') +
        '</div>' +
        (EV.description ? '<div class="desc">' + EV.description + '</div>' : '') +
        '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn sec" id="ics"><i data-lucide="calendar-plus" style="width:15px;height:15px"></i>Add to calendar</button>' +
          '<a class="btn ghost" href="whatson.html"><i data-lucide="arrow-left" style="width:15px;height:15px"></i>What\'s on</a>' +
        '</div>' +
      '</div>' +
      (closed ? '' : formHtml());

    document.getElementById('wrap').innerHTML = html;
    if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
    wire();
  }

  function wire() {
    var icsBtn = document.getElementById('ics');
    if (icsBtn) icsBtn.onclick = function () { EGBCICS.download(EV.title || 'event', E.icsFor(EV, WHERE)); };

    var add = document.getElementById('addAtt');
    if (add) add.onclick = function () {
      readAttendees();
      if (attendees.length >= 20) return;
      attendees.push({ name: '' });
      document.getElementById('atts').innerHTML = attendeeRows();
      if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
      wireDrops();
    };
    wireDrops();

    var f = document.getElementById('f');
    if (f) f.onsubmit = submit;
  }

  function wireDrops() {
    document.querySelectorAll('[data-drop]').forEach(function (b) {
      b.onclick = function () {
        readAttendees();
        attendees.splice(parseInt(b.getAttribute('data-drop'), 10), 1);
        if (!attendees.length) attendees = [{ name: '' }];
        document.getElementById('atts').innerHTML = attendeeRows();
        if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
        wireDrops();
      };
    });
  }

  function readAttendees() {
    attendees = attendees.map(function (a, i) {
      var el = document.getElementById('att' + i);
      var out = { name: el ? el.value.trim() : (a.name || '') };
      QS.filter(function (q) { return q.per === 'attendee'; }).forEach(function (q) {
        var qe = document.getElementById('a' + i + '_' + q.id);
        if (qe) out['q_' + q.id] = qe.value;
      });
      return out;
    });
    return attendees;
  }

  function fail(msg) {
    document.getElementById('err').innerHTML = '<div class="banner warn">' + esc(msg) + '</div>';
    var go = document.getElementById('go'); if (go) go.disabled = false;
  }

  function submit(e) {
    e.preventDefault();
    var go = document.getElementById('go'); go.disabled = true;
    document.getElementById('err').innerHTML = '';

    /* Spam defence. Quiet on purpose: a bot is told nothing useful. */
    if ((document.getElementById('website') || {}).value) { fail('Sorry, that did not go through.'); return; }
    if (Date.now() - openedAt < 2500) { fail('Please take a moment to check the form, then try again.'); return; }

    var name = document.getElementById('nm').value.trim();
    var email = document.getElementById('em').value.trim();
    if (!name) return fail('Please put your name in.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('That email address does not look right.');

    readAttendees();
    var who = attendees.filter(function (a) { return a.name; });
    if (!who.length) who = [{ name: name }];

    var answers = {};
    var bad = '';
    QS.filter(function (q) { return q.per !== 'attendee'; }).forEach(function (q) {
      var el = document.getElementById('b_' + q.id);
      var v = el ? el.value.trim() : '';
      if (q.required && !v) bad = bad || q.label;
      answers[q.id] = v;
    });
    if (bad) return fail('Please answer: ' + bad);

    var waiting = full();
    var payload = {
      ev: EV, places: who.length, name: name, email: email,
      phone: document.getElementById('ph').value.trim(),
      attendees: who, answers: answers,
      ticketTypeId: (document.getElementById('tt') || {}).value || (TT[0] ? TT[0].id : ''),
      donation: Number((document.getElementById('don') || {}).value || 0) || 0,
      notes: document.getElementById('notes').value.trim(),
      status: waiting ? 'waiting' : 'confirmed'
    };

    E.signUp(payload).then(function (res) {
      var mail = E.confirmationEmail({
        ev: EV, where: WHERE, email: email, places: who.length,
        attendees: who, manageKey: res.manageKey, status: payload.status
      });
      return EGBCEmail.send(mail).then(function (sent) { return { res: res, sent: sent }; });
    }).then(function (out) {
      done(out.res.manageKey, waiting, out.sent);
    }).catch(function (err) {
      var m = String(err && (err.message || err));
      /* The rules refuse the whole batch when the last place went while
         this form was open. That is the right answer, and it has to read
         like one rather than like a crash. */
      if (/permission|PERMISSION/.test(m)) {
        fail('Someone took the last place while you were filling this in. Reload the page and the waiting list will be offered.');
      } else {
        fail(m || 'That could not be saved.');
      }
    });
  }

  function done(manageKey, waiting, sent) {
    var url = E.manageUrl(manageKey);
    document.getElementById('signupCard').innerHTML =
      '<h2>' + (waiting ? 'You are on the waiting list' : 'You are signed up') + '</h2>' +
      '<div class="banner ok">' + (waiting
        ? 'We will email you if a place comes free.'
        : 'That is booked. We have emailed you a confirmation.') + '</div>' +
      (sent && sent.stubbed ? '<div class="banner info">Development: the confirmation was composed but not sent.</div>' : '') +
      (sent && !sent.ok ? '<div class="banner warn">We could not email the confirmation. Keep this link: it is the only way back to your booking.</div>' : '') +
      '<p>Keep this link to view or cancel your place:</p>' +
      '<p><a href="' + esc(url) + '" style="color:var(--brand);word-break:break-all">' + esc(url) + '</a></p>' +
      '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn sec" id="ics2"><i data-lucide="calendar-plus" style="width:15px;height:15px"></i>Add to calendar</button>' +
        '<a class="btn ghost" href="whatson.html">What\'s on</a></div>';
    document.getElementById('ics2').onclick = function () { EGBCICS.download(EV.title || 'event', E.icsFor(EV, WHERE)); };
    if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
    window.scrollTo({ top: document.getElementById('signupCard').offsetTop - 20, behavior: 'smooth' });
  }

  if (!ID) {
    document.getElementById('wrap').innerHTML = '<div class="card">No event was named. <a href="whatson.html" style="color:var(--brand)">See what\'s on</a>.</div>';
    return;
  }

  EGBCAuth.optional().then(function () {
    return Promise.all([E.load(ID), E.lookups()]);
  }).then(function (r) {
    if (!r[0]) {
      document.getElementById('wrap').innerHTML =
        '<div class="card">That event could not be found, or it is not open to you. ' +
        '<a href="whatson.html" style="color:var(--brand)">See what\'s on</a>.</div>';
      return;
    }
    EV = r[0].ev; TT = r[0].ticketTypes; QS = r[0].questions; CAP = r[0].capacity;
    LOOK = r[1]; WHERE = E.locationText(EV, LOOK);
    document.title = (EV.title || 'Event') + ' — EGBC';
    draw();
  }).catch(function (e) {
    document.getElementById('wrap').innerHTML =
      '<div class="card">That event could not be loaded.<br><span style="font-size:13px;color:#6b7280">' + esc(e.message || e) + '</span></div>';
  });
})();
</script>
</body>
</html>
