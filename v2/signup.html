<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610160500" data-title="Event"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610160500"></script>
<script src="egbc-church.js?v=202610121600"></script>
<script src="egbc-ics.js?v=202610091200"></script>
<script src="egbc-email.js?v=202610081729"></script>
<script src="egbc-events.js?v=202610161700"></script>
<script src="egbc-launch.js?v=202610141700"></script>
<script src="egbc-events-usual.js?v=202610151900"></script>
<script src="egbc-events-qr.js?v=202610072300"></script>
<script src="egbc-events-checkin.js?v=202610152300"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);
        padding:20px;margin-bottom:14px}
  h1{font-size:24px;font-weight:700;color:var(--ink);margin:0 0 6px}
  h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  /* "Same as last time" (usualPeople) */
  .usual{background:var(--tint);border:1px solid #cfe0de;border-radius:10px;padding:12px;margin:0 0 14px}
  .usual .btn{min-height:44px}
  .usual .ticks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
  .usual .ticks label{display:flex;gap:6px;align-items:center;min-height:40px;font-weight:500}
  .prefill .inp,.prefill select{background:var(--gold-bg);border-color:var(--gold)}
  .prefill .from{display:block;font-size:12px;color:var(--gold);margin-top:3px}
  /* The event's picture, WHOLE (Martin, 15 Oct): EGBCEvents.picFigure on a
     phone; on a computer, two columns, the picture on the left at its own
     shape. */
  @media (min-width:900px){
    .wrap.has-pic{max-width:1180px}
    .evgrid.has-pic{display:grid;grid-template-columns:35% minmax(0,1fr);gap:24px;align-items:start}
    .evgrid .egbc-pic{position:sticky;top:16px;background:none;margin:0}
    .evgrid .egbc-pic .bg{display:none}
    .evgrid .egbc-pic .whole{width:100%;max-height:70vh;object-fit:contain;border-radius:14px}
  }
  .meta{color:var(--muted);font-size:14px;margin:0 0 4px;display:flex;gap:8px;align-items:flex-start}
  .meta i{flex:none;margin-top:2px;color:var(--brand)}
  .desc{margin-top:14px;color:var(--body);line-height:1.6}
  .desc img{max-width:100%}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
       border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#f9fafb;margin:8px 6px 0 0}
  .dot{width:8px;height:8px;border-radius:9999px;flex:none}

  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select,textarea{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;
       font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  textarea{height:auto;padding:10px 12px;min-height:76px;resize:vertical}
  .inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .field{margin-bottom:14px}
  .two{display:flex;gap:12px;flex-wrap:wrap}
  .two>.field{flex:1;min-width:190px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
       border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent;
       background:var(--brand);color:#fff;text-decoration:none}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.sec:hover{background:#f3f4f6}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:#f3f4f6}

  .att{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
  .att .field{flex:1;margin:0}
  .banner{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:14px}
  .banner.warn{background:var(--danger-bg);color:var(--danger)}
  .banner.info{background:var(--tint);color:var(--body);border:1px solid #cfe0de}
  .banner.ok{background:var(--ok-bg);color:var(--ok)}
  .hint{font-size:13px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="card" id="loading">Loading…</div>
</div>

<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, esc = E.esc;
  var ID = new URLSearchParams(location.search).get('event') || '';
  /* An invitation (F-187): ?invite=<its key> fills in who they are; with
     &reply=no it records "I can't come". Signing up records "coming". */
  var INVKEY = new URLSearchParams(location.search).get('invite') || '', NOREPLY = new URLSearchParams(location.search).get('reply') === 'no', INV = null, INVSAID = '';
  function loadInvite() {
    if (!INVKEY) return Promise.resolve();
    var ref = EGBCAuth.db.collection('eventInvites').doc(INVKEY);
    return ref.get().then(function (s) {
      if (!s.exists || s.data().calEventId !== ID) return;
      INV = s.data();
      if (!NOREPLY || INV.response === 'yes') return;
      return ref.update({ response: 'no', respondedAt: firebase.firestore.FieldValue.serverTimestamp(), signupKey: INV.signupKey || '' })
        .then(function () { INV.response = 'no'; INVSAID = 'Thank you for letting us know you can’t come. If that changes, you can still sign up below.'; });
    }).catch(function () {});
  }
  function applyInvite() {
    if (!INV) return;
    if (INVSAID) document.getElementById('wrap').insertAdjacentHTML('afterbegin', '<div class="card"><div class="banner info" id="invNo">' + esc(INVSAID) + '</div></div>');
    var fill = function (id, v) { var el = document.getElementById(id); if (el && !el.value && v) el.value = v; };
    fill('nm', INV.name); fill('em', INV.email); fill('att0', INV.name);
  }
  function inviteAnswered(key) {
    if (!INV || !INVKEY) return;
    EGBCAuth.db.collection('eventInvites').doc(INVKEY).update({ response: 'yes', respondedAt: firebase.firestore.FieldValue.serverTimestamp(), signupKey: key }).catch(function () {});
  }
  var EV = null, TT = [], QS = [], CAP = null, LOOK = {}, WHERE = '';
  /* The health questions set aside until switch-over, and the launch state. */
  var HELD = [], LAUNCH = { locked: false, opensOn: '' };
  /* The whole series (F-184): every date this sign-up is for, when the event
     says "sign up to the whole series". null: just this date. */
  var SERIES = null;
  /* Card payment (F-181): can this church take it (paymentSettings/public),
     and may the chosen ticket be paid that way. */
  var PAYPUB = {};
  function chosenTicket() { var id = (document.getElementById('tt') || {}).value || (TT[0] ? TT[0].id : ''); return TT.filter(function (t) { return t.id === id; })[0] || TT[0] || null; }
  /* The ways this ticket can be paid online, that the church takes. */
  function online(t) { return ['card', 'bank'].filter(function (m) { return PAYPUB[m] && E.payBy(t).indexOf(m) >= 0; }); }
  function cardOk(t) { return online(t).length > 0; }
  function dayOk(t) { return E.payBy(t).indexOf('day') >= 0 || !cardOk(t); }
  function onlineWords(t) { var o = online(t); return o.length === 2 ? 'by card or bank online' : o[0] === 'bank' ? 'by bank online' : 'by card online'; }
  function payCard(key, btn, method) {
    var was = btn.textContent; btn.disabled = true; btn.textContent = 'Opening the payment page…';
    E.callPublic('ticketPay', { key: key, method: method || 'card' }).then(function (r) { location.href = r.url; }, function (e) {
      btn.disabled = false; btn.textContent = was;
      var m = document.getElementById('payMsg'); if (m) m.textContent = E.payProblem(e);
    });
  }
  var openedAt = Date.now();          /* for the minimum fill time */
  var attendees = [{ name: '' }];

  function catOf(ev) {
    return E.catOf(ev.category);
  }

  function left() { return CAP ? E.placesLeft(CAP) : null; }
  function full() { var l = left(); return l !== null && l <= 0; }

  /* `value` puts back what was already typed. Without it, adding or
     removing a person redrew every person's answers empty - so a parent who
     wrote one child's allergy and then added a second child lost the
     allergy without being told (FINDINGS-events.md F-026). */
  function questionField(q, idPrefix, value, pre) {
    var id = idPrefix + q.id;
    if (pre) return questionField(q, idPrefix, value).replace('<div class="field">', '<div class="field prefill" data-prefill="' + esc(q.id) + '">').replace(/<\/div>$/, '<span class="from">From last time: please check it is still right.</span></div>');
    var v = value == null ? '' : String(value);
    var sel = function (o) { return o === v ? ' selected' : ''; };
    var lab = '<label for="' + id + '">' + esc(q.label || 'Question') + (q.required ? ' *' : '') + '</label>';
    if (q.kind === 'choice') {
      return '<div class="field">' + lab + '<select id="' + id + '" ' + (q.required ? 'required' : '') + '>' +
        '<option value="">Choose…</option>' +
        (q.options || []).map(function (o) { return '<option' + sel(o) + '>' + esc(o) + '</option>'; }).join('') +
        '</select></div>';
    }
    if (q.kind === 'yesno') {
      return '<div class="field">' + lab + '<select id="' + id + '" ' + (q.required ? 'required' : '') + '>' +
        '<option value="">Choose…</option><option' + sel('Yes') + '>Yes</option><option' + sel('No') + '>No</option></select></div>';
    }
    if (q.kind === 'number') {
      return '<div class="field">' + lab + '<input class="inp" type="number" id="' + id + '" value="' + esc(v) + '" ' + (q.required ? 'required' : '') + '></div>';
    }
    return '<div class="field">' + lab + '<input class="inp" type="text" id="' + id + '" value="' + esc(v) + '" maxlength="300" ' + (q.required ? 'required' : '') + '></div>';
  }

  function attendeeRows() {
    var perAtt = QS.filter(function (q) { return q.per === 'attendee'; });
    return attendees.map(function (a, i) {
      return '<div class="att">' +
        '<div class="field"><label for="att' + i + '">Person ' + (i + 1) + '</label>' +
        '<input class="inp" id="att' + i + '" value="' + esc(a.name || '') + '" placeholder="Name" maxlength="120" list="usualNames" autocomplete="off"></div>' +
        (i > 0 ? '<button type="button" class="btn ghost" data-drop="' + i + '" aria-label="Remove">' +
                 '<i data-lucide="x" style="width:16px;height:16px"></i></button>' : '') +
        '</div>' +
        perAtt.map(function (q) { return questionField(q, 'a' + i + '_', a['q_' + q.id], a._pre && a._pre[q.id]); }).join('');
    }).join('');
  }

  function formHtml() {
    var p = E.signedIn() ? EGBCAuth.profile() : null;
    var waiting = full();
    var perBooking = QS.filter(function (q) { return q.per !== 'attendee'; });
    return '<div class="card" id="signupCard">' +
      '<h2>' + (waiting ? 'Join the waiting list' : 'Sign up') + '</h2>' +
      (waiting ? '<div class="banner info">This event is full. Join the waiting list and we will be in touch if a place comes free.</div>' : '') +
      (p ? '<div class="banner info">Signed in as ' + esc(p.name || p.email) + '. Your sign-up will be linked to your record.</div>' : '') +
      '<form id="f" novalidate><div id="usualBox"></div><datalist id="usualNames"></datalist>' +
        '<div class="two">' +
          '<div class="field"><label for="nm">Your name *</label>' +
            '<input class="inp" id="nm" maxlength="120" required value="' + esc(p ? (p.name || '') : '') + '"></div>' +
          '<div class="field"><label for="em">Your email *</label>' +
            '<input class="inp" id="em" type="email" maxlength="200" required value="' + esc(p ? (p.email || '') : '') + '"></div>' +
        '</div>' +
        '<div class="field"><label for="ph">Phone (optional)</label><input class="inp" id="ph" maxlength="40"></div>' +
        (TT.length > 1 ? '<div class="field"><label for="tt">Ticket</label><select id="tt">' +
          TT.map(function (t) {
            return '<option value="' + esc(t.id) + '">' + esc(t.name) +
                   (t.price ? ' — £' + Number(t.price).toFixed(2) : ' — free') + '</option>';
          }).join('') + '</select></div>' : '') +
        (SERIES ? '<div class="banner info" id="seriesNote">This signs you up to <strong>all ' + SERIES.length + ' dates</strong> in the series:</div>' +
          '<ul id="seriesDates" style="margin:6px 0 14px;padding-left:20px">' + SERIES.map(function (d) { return '<li>' + esc(E.fmtWhen(d)) + '</li>'; }).join('') + '</ul>' : '') +
        '<div class="field"><label>Who is coming</label><div id="atts">' + attendeeRows() + '</div>' +
          '<button type="button" class="btn sec sm" id="addAtt"><i data-lucide="plus" style="width:15px;height:15px"></i>Add someone else</button>' +
        '</div>' +
        (HELD.length ? '<div class="banner info" id="healthLater">' + esc(E.healthLaterWords(LAUNCH.opensOn)) + '</div>' : '') +
        perBooking.map(function (q) { return questionField(q, 'b_'); }).join('') +
        (EV.donationsOn ? '<div class="field"><label for="don">Optional donation (£)</label>' +
          '<input class="inp" id="don" type="number" min="0" step="1"></div>' +
          '<p class="hint">Separate from any ticket, and entirely optional. We will be in touch about how to give it.</p>' : '') +
        '<div class="field"><label for="notes">Anything we should know? (optional)</label>' +
          '<textarea id="notes" maxlength="2000"' + (LAUNCH.locked ? '' : ' aria-describedby="notesLater"') + '></textarea>' +
          /* Before switch-over (F-203): this box is saved too, and can be read by anybody until then. */
          (LAUNCH.locked ? '' : '<p class="hint" id="notesLater" style="margin:4px 0 0">Please don\'t put health details here yet - tell the organiser directly until ' + esc(LAUNCH.opensOn || 'the new church hub opens') + '.</p>') + '</div>' +
        /* Spam defence, §7.2: a field no person sees, and a form that was
           filled in impossibly fast. Neither is a wall; both are free. */
        '<div class="hp" aria-hidden="true"><label>Leave this empty<input id="website" tabindex="-1" autocomplete="off"></label></div>' +
        '<p class="hint" id="due" role="status"></p>' +
        '<div id="usualCheck"></div><div id="err"></div>' +
        '<button class="btn" id="go" type="submit">' +
          '<i data-lucide="check" style="width:16px;height:16px"></i>' +
          (SERIES ? 'Sign up to all ' + SERIES.length + ' dates' : waiting ? 'Join the waiting list' : 'Sign up') + '</button>' +
      '</form></div>';
  }

  function draw() {
    var cat = catOf(EV);
    var l = left();
    var closed = EV.status === 'cancelled' || !EV.signupOn;
    var pic = E.picFigure(EV.image, 'id="picOpen"');
    var html = '<div class="evgrid' + (pic ? ' has-pic' : '') + '">' + pic + '<div class="evmain">' +
      '<div class="card">' +
        (EV.status === 'cancelled' ? '<div class="banner warn">This event has been cancelled.</div>' : '') +
        (EV.status === 'pending' ? '<div class="banner info">Not announced yet — you are seeing it because you are signed in.</div>' : '') +
        '<h1>' + esc(EV.title || 'Event') + '</h1>' +
        '<p class="meta"><i data-lucide="calendar-days" style="width:16px;height:16px"></i>' + esc(E.fmtWhen(EV)) + '</p>' +
        (WHERE ? '<p class="meta"><i data-lucide="map-pin" style="width:16px;height:16px"></i>' + esc(WHERE) + '</p>' : '') +
        (EV.organiserName ? '<p class="meta"><i data-lucide="user" style="width:16px;height:16px"></i>' + esc(EV.organiserName) + '</p>' : '') +
        (EV.signupOn && l !== null && EV.status !== 'cancelled'
          ? '<p class="meta"><i data-lucide="users" style="width:16px;height:16px"></i>' +
            (l > 0 ? l + ' place' + (l === 1 ? '' : 's') + ' left of ' + CAP.capacity : 'Full — waiting list open') + '</p>'
          : '') +
        '<div>' +
          '<span class="tag"><span class="dot" style="background:' + cat.colour + '"></span>' + esc(cat.name) + '</span>' +
          (EV.labels || []).map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('') +
        '</div>' +
        (E.safeHtml(EV.description) ? '<div class="desc">' + E.safeHtml(EV.description) + '</div>' : '') +
        '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn sec" id="ics"><i data-lucide="calendar-plus" style="width:15px;height:15px"></i>Add to calendar</button>' +
          /* Not for an event that is not announced yet. */
          (EV.status === 'pending' ? '' : '<button class="btn sec" id="share"><i data-lucide="share-2" style="width:15px;height:15px"></i>Share on WhatsApp</button>') +
          /* F-188 (Martin: as ChurchSuite does, and better): Facebook, X and
             email, on a computer too - but only for an event anyone may see,
             since a members' event's link means nothing to the public. */
          (EV.status !== 'pending' && EV.status !== 'cancelled' && EV.visibility === 'public' ? (function () {
            var u = encodeURIComponent(E.eventUrl(EV.id)), t = encodeURIComponent((EV.title || '') + ' - ' + E.fmtWhen(EV));
            return '<a class="btn ghost" id="shareFb" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=' + u + '">Facebook</a>' +
              '<a class="btn ghost" id="shareX" target="_blank" rel="noopener" href="https://x.com/intent/post?text=' + t + '&url=' + u + '">X</a>' +
              '<a class="btn ghost" id="shareMail" href="mailto:?subject=' + encodeURIComponent(EV.title || '') + '&body=' + t + '%0A' + u + '">Email</a>';
          })() : '') +
          '<a class="btn ghost" href="whatson.html"><i data-lucide="arrow-left" style="width:15px;height:15px"></i>What\'s on</a>' +
        '</div>' +
      '</div>' +
      (closed ? '' : formHtml()) + '</div></div>';

    document.getElementById('wrap').innerHTML = html;
    document.getElementById('wrap').classList.toggle('has-pic', !!pic);
    var po = document.getElementById('picOpen'); if (po) po.onclick = function () { E.picOpen(po); };
    if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
    wire();
    applyInvite();
    drawUsual();
  }

  /* ---- "Same as last time" (usualPeople; Martin, 15 Oct) ---------------
     EGBCUsual (egbc-events-usual.js) reads the person's OWN past sign-ups;
     this fills the form with them, for checking. Nothing is sent until
     they press Sign up, and nobody added is emailed. */
  var USUAL = null;
  function drawUsual() {
    var box = document.getElementById('usualBox');
    if (!box || !window.EGBCUsual || !EGBCUsual.on()) return;
    EGBCUsual.load().then(function (u) {
      USUAL = u;
      box = document.getElementById('usualBox'); if (!box) return;
      var dl = document.getElementById('usualNames');
      if (dl) dl.innerHTML = u.names.concat(u.household).filter(function (n, i, all) { return all.map(EGBCUsual.key).indexOf(EGBCUsual.key(n)) === i; })
        .map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
      var me = E.signedIn() ? ((EGBCAuth.profile() || {}).name || '') : '';
      var house = u.household.length ? [me].concat(u.household).filter(Boolean) : [];
      if (!u.last && !house.length) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="usual" id="usual">' +
        (u.last ? '<button type="button" class="btn sec" id="usualSame">Same as last time: ' + esc(EGBCUsual.listWords(u.last.names)) + '</button>' +
          (!u.signedIn ? ' <button type="button" class="btn ghost" id="usualClear">Not you? Clear</button>' : '') : '') +
        (house.length ? '<p class="hint" style="margin:10px 0 0">Who is coming from your household?</p><div class="ticks" id="usualHouse">' + house.map(function (n) {
          return '<label><input type="checkbox" data-usual-name="' + esc(n) + '"' + (hasName(n) ? ' checked' : '') + '>' + esc(n) + '</label>'; }).join('') + '</div>' : '') +
        '</div>';
      var same = document.getElementById('usualSame'); if (same) same.onclick = sameAsLast;
      var clr = document.getElementById('usualClear'); if (clr) clr.onclick = function () { EGBCUsual.deviceClear(); USUAL = null; box.innerHTML = ''; if (dl) dl.innerHTML = ''; };
      box.querySelectorAll('[data-usual-name]').forEach(function (c) { c.onchange = function () { tickPerson(c.getAttribute('data-usual-name'), c.checked); }; });
    }).catch(function () {});
  }
  /* A household tick box holds a first name ("Natasha"); the form may hold her
     full name from last time. Either counts as her. */
  function samePerson(full, n) {
    var a = EGBCUsual.key(full), k = EGBCUsual.key(n);
    return a === k || (k.indexOf(' ') < 0 && a.split(' ')[0] === k);
  }
  function hasName(n) { return readAttendees().some(function (a) { return samePerson(a.name, n); }); }
  function redrawPeople() {
    document.getElementById('atts').innerHTML = attendeeRows();
    if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
    wireDrops(); showDue();
  }
  function tickPerson(n, on) {
    readAttendees();
    var k = EGBCUsual.key(n);
    if (on && !attendees.some(function (a) { return samePerson(a.name, n); })) {
      var blank = attendees.filter(function (a) { return !a.name; })[0];
      if (blank) blank.name = n; else if (attendees.length < 20) attendees.push({ name: n });
    }
    if (!on) { attendees = attendees.filter(function (a) { return !samePerson(a.name, n); }); if (!attendees.length) attendees = [{ name: '' }]; }
    redrawPeople();
  }
  function sameAsLast() {
    var L = USUAL && USUAL.last; if (!L) return;
    var now = Date.now(), health = false;
    var perAtt = QS.filter(function (q) { return q.per === 'attendee'; }), perBooking = QS.filter(function (q) { return q.per !== 'attendee'; });
    attendees = L.names.slice(0, 20).map(function (n) {
      var a = { name: n }, theirs = L.people[EGBCUsual.key(n)] || {};
      perAtt.forEach(function (q) {
        var v = theirs[EGBCUsual.key(q.label)];
        if (v && EGBCUsual.mayFill(q.label, L.at, now)) { a['q_' + q.id] = v; (a._pre = a._pre || {})[q.id] = 1; if (EGBCUsual.isHealth(q.label)) health = true; }
      });
      return a;
    });
    /* The ticket, by its name (each event has its own tickets). */
    var tt = document.getElementById('tt');
    if (tt && L.ticketName) TT.forEach(function (t) { if (EGBCUsual.key(t.name) === EGBCUsual.key(L.ticketName)) tt.value = t.id; });
    perBooking.forEach(function (q) {
      var v = L.booking[EGBCUsual.key(q.label)], el = document.getElementById('b_' + q.id);
      if (!el || !v || el.value || !EGBCUsual.mayFill(q.label, L.at, now)) return;
      el.value = v;
      var fld = el.closest('.field'); if (fld && !fld.classList.contains('prefill')) { fld.classList.add('prefill'); fld.setAttribute('data-prefill', q.id); fld.insertAdjacentHTML('beforeend', '<span class="from">From last time: please check it is still right.</span>'); }
      if (EGBCUsual.isHealth(q.label)) health = true;
    });
    redrawPeople();
    document.querySelectorAll('#usualHouse [data-usual-name]').forEach(function (c) { c.checked = hasName(c.getAttribute('data-usual-name')); });
    var ck = document.getElementById('usualCheck');
    if (ck) ck.innerHTML = health ? '<label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-weight:500"><input type="checkbox" id="usualChecked" style="margin-top:3px">I have checked the health answers filled in from last time (allergies, medical, dietary) and they are still right.</label>' : '';
    var first = document.querySelector('.prefill .inp, .prefill select'); if (first) first.focus();
  }
  /* Signed out: this device remembers the names (only), for next time. */
  function rememberHere(who, ticketTypeId) {
    if (E.signedIn() || !window.EGBCUsual || !EGBCUsual.on()) return;
    var t = TT.filter(function (x) { return x.id === ticketTypeId; })[0];
    EGBCUsual.deviceSave(who.map(function (a) { return a.name; }), t ? t.name : '');
  }

  function wire() {
    var icsBtn = document.getElementById('ics');
    if (icsBtn) icsBtn.onclick = function () { EGBCICS.download(EV.title || 'event', E.icsFor(EV, WHERE)); };
    var shareBtn = document.getElementById('share');
    if (shareBtn) shareBtn.onclick = function () {
      E.share(E.shareItem(EV, WHERE)).catch(function (e) { alert(e.message || 'Sharing could not be opened.'); });
    };

    var add = document.getElementById('addAtt');
    if (add) add.onclick = function () {
      readAttendees();
      if (attendees.length >= 20) return;
      attendees.push({ name: '' });
      document.getElementById('atts').innerHTML = attendeeRows();
      if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
      wireDrops();
    };
    wireDrops();

    var f = document.getElementById('f');
    if (f) f.onsubmit = submit;
    /* Pay on the day (F-183): the amount, as tickets and people change. */
    if (f) { f.addEventListener('input', showDue); f.addEventListener('change', showDue); f.addEventListener('click', function () { setTimeout(showDue, 0); }); }
    showDue();
  }

  function dueNow() {
    if (full() && !SERIES) return 0;
    var n = readAttendees().filter(function (a) { return a.name; }).length || 1;
    return E.toPay({ status: 'confirmed', places: n, ticketTypeId: (document.getElementById('tt') || {}).value || (TT[0] ? TT[0].id : '') }, TT) * (SERIES ? SERIES.length : 1);
  }
  function showDue() {
    var el = document.getElementById('due'); if (!el) return;
    var d = dueNow();
    var t = chosenTicket();
    el.textContent = !d ? '' : cardOk(t) && dayOk(t) ? 'To pay: ' + E.money(d) + ', ' + onlineWords(t) + ' after you sign up, or at the door on the day.'
      : cardOk(t) ? 'To pay: ' + E.money(d) + ', ' + onlineWords(t) + ' straight after you sign up.' : 'To pay on the day: ' + E.money(d) + '. Pay at the door when you arrive.';
  }

  function wireDrops() {
    document.querySelectorAll('[data-drop]').forEach(function (b) {
      b.onclick = function () {
        readAttendees();
        attendees.splice(parseInt(b.getAttribute('data-drop'), 10), 1);
        if (!attendees.length) attendees = [{ name: '' }];
        document.getElementById('atts').innerHTML = attendeeRows();
        if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
        wireDrops();
      };
    });
  }

  function readAttendees() {
    attendees = attendees.map(function (a, i) {
      var el = document.getElementById('att' + i);
      var out = { name: el ? el.value.trim() : (a.name || '') };
      if (a._pre) out._pre = a._pre;
      QS.filter(function (q) { return q.per === 'attendee'; }).forEach(function (q) {
        var qe = document.getElementById('a' + i + '_' + q.id);
        if (qe) out['q_' + q.id] = qe.value;
      });
      return out;
    });
    return attendees;
  }

  function fail(msg) {
    document.getElementById('err').innerHTML = '<div class="banner warn">' + esc(msg) + '</div>';
    var go = document.getElementById('go'); if (go) go.disabled = false;
  }

  function submit(e) {
    e.preventDefault();
    var go = document.getElementById('go'); go.disabled = true;
    document.getElementById('err').innerHTML = '';

    /* Spam defence. Quiet on purpose: a bot is told nothing useful. */
    if ((document.getElementById('website') || {}).value) { fail('Sorry, that did not go through.'); return; }
    if (Date.now() - openedAt < 2500) { fail('Please take a moment to check the form, then try again.'); return; }

    var name = document.getElementById('nm').value.trim();
    var email = document.getElementById('em').value.trim();
    if (!name) return fail('Please put your name in.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('That email address does not look right.');

    /* Answers filled in from last time are never sent unseen. */
    var chk = document.getElementById('usualChecked');
    if (chk && !chk.checked) return fail('Please check the answers filled in from last time, then tick to say you have.');

    readAttendees();
    var who = attendees.filter(function (a) { return a.name; }).map(function (a) { var o = Object.assign({}, a); delete o._pre; HELD.forEach(function (q) { delete o['q_' + q.id]; }); return o; });
    if (!who.length) who = [{ name: name }];

    var answers = {};
    var bad = '';
    QS.filter(function (q) { return q.per !== 'attendee'; }).forEach(function (q) {
      var el = document.getElementById('b_' + q.id);
      var v = el ? el.value.trim() : '';
      if (q.required && !v) bad = bad || q.label;
      answers[q.id] = v;
    });
    if (bad) return fail('Please answer: ' + bad);
    HELD.forEach(function (q) { delete answers[q.id]; });

    var waiting = full();
    var payload = {
      ev: EV, places: who.length, name: name, email: email,
      phone: document.getElementById('ph').value.trim(),
      attendees: who, answers: answers,
      ticketTypeId: (document.getElementById('tt') || {}).value || (TT[0] ? TT[0].id : ''),
      donation: Number((document.getElementById('don') || {}).value || 0) || 0,
      notes: document.getElementById('notes').value.trim(),
      status: waiting ? 'waiting' : 'confirmed'
    };

    /* The confirmation is emailed by the hub's server once this is saved (functions/public-mail.js,
       F-168): a page with nobody signed in may not send email. */
    if (SERIES) {
      /* Every date at once; a full date puts them on its waiting list. */
      E.signUpSeries(payload, SERIES).then(function (res) {
        rememberHere(who, payload.ticketTypeId);
        var waitingOn = res.signups.filter(function (s) { return s.status === 'waiting'; }).length;
        var each = E.toPay({ status: 'confirmed', places: who.length, ticketTypeId: payload.ticketTypeId }, TT);
        done(res.keys[0], false, each * (SERIES.length - waitingOn), { dates: SERIES.length, waitingOn: waitingOn });
      }).catch(function (err) {
        var m = String(err && (err.message || err));
        fail(/permission|PERMISSION/.test(m) ? 'Someone took a place while you were filling this in. Reload the page and try again.' : (m || 'That could not be saved.'));
      });
      return;
    }
    E.signUp(payload).then(function (res) {
      rememberHere(who, payload.ticketTypeId);
      done(res.manageKey, waiting, waiting ? 0 : E.toPay({ status: 'confirmed', places: who.length, ticketTypeId: payload.ticketTypeId }, TT));
    }).catch(function (err) {
      var m = String(err && (err.message || err));
      /* The rules refuse the whole batch when the last place went while
         this form was open. That is the right answer, and it has to read
         like one rather than like a crash. */
      if (/permission|PERMISSION/.test(m)) {
        fail('Someone took the last place while you were filling this in. Reload the page and the waiting list will be offered.');
      } else {
        fail(m || 'That could not be saved.');
      }
    });
  }

  var chosenTicketDone = null;
  function done(manageKey, waiting, due, series) {
    inviteAnswered(manageKey);
    chosenTicketDone = chosenTicket();
    var url = E.manageUrl(manageKey);
    document.getElementById('signupCard').innerHTML =
      '<h2>' + (series ? 'You are signed up to all ' + series.dates + ' dates' : waiting ? 'You are on the waiting list' : 'You are signed up') + '</h2>' +
      (series && series.waitingOn ? '<div class="banner warn" id="seriesWaiting">' + series.waitingOn + ' of the dates ' + (series.waitingOn === 1 ? 'was' : 'were') + ' already full: you are on the waiting list for ' + (series.waitingOn === 1 ? 'it' : 'those') + '.</div>' : '') +
      '<div class="banner ok">' + (waiting
        ? 'An email saying so is on its way to you. We will email you again if a place comes free.'
        : 'That is booked. A confirmation is on its way to you by email, and should arrive in the next few minutes.') + '</div>' +
      (due && cardOk(chosenTicketDone) ? '<div class="card" id="payBox" style="background:var(--tint,#eef5f4);margin:10px 0"><p style="margin:0 0 8px"><strong>To pay: ' + E.money(due) + '</strong>' +
          (dayOk(chosenTicketDone) ? '. Pay now online, or at the door on the day.' : '. Your place is held for 30 minutes while you pay.') + '</p>' +
          (online(chosenTicketDone).indexOf('card') >= 0 ? '<button class="btn" id="payCard">Pay ' + E.money(due) + ' by card</button> ' : '') +
          (online(chosenTicketDone).indexOf('bank') >= 0 ? '<button class="btn" id="payBank">Pay ' + E.money(due) + ' by bank</button>' : '') +
          '<p class="hint" id="payMsg" role="status"></p>' +
          '<p class="hint" style="margin:6px 0 0">You pay on ' + (online(chosenTicketDone).length === 2 ? 'Stripe\'s or GoCardless\'s' : online(chosenTicketDone)[0] === 'bank' ? 'GoCardless\'s' : 'Stripe\'s') + ' secure page. The money goes straight to the church.</p></div>'
       : due ? '<p id="dueDone"><strong>To pay on the day: ' + E.money(due) + '</strong>. Pay at the door when you arrive.</p>' : '') +
      '<p>Keep this link to view or cancel your place. It works even if the email has not arrived:</p>' +
      '<p><a href="' + esc(url) + '" style="color:var(--brand);word-break:break-all">' + esc(url) + '</a></p>' +
      '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn sec" id="ics2"><i data-lucide="calendar-plus" style="width:15px;height:15px"></i>Add to calendar</button>' +
        '<a class="btn ghost" href="whatson.html">What\'s on</a></div>';
    document.getElementById('ics2').onclick = function () { EGBCICS.download(EV.title || 'event', E.icsFor(EV, WHERE)); };
    var pc = document.getElementById('payCard'); if (pc) pc.onclick = function () { payCard(manageKey, pc, 'card'); };
    var pk = document.getElementById('payBank'); if (pk) pk.onclick = function () { payCard(manageKey, pk, 'bank'); };
    if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
    window.scrollTo({ top: document.getElementById('signupCard').offsetTop - 20, behavior: 'smooth' });
  }

  if (!ID) {
    document.getElementById('wrap').innerHTML = '<div class="card">No event was named. <a href="whatson.html" style="color:var(--brand)">See what\'s on</a>.</div>';
    return;
  }

  EGBCAuth.optional().then(function () {
    EGBCAuth.db.collection('paymentSettings').doc('public').get().then(function (s) { PAYPUB = s.exists ? s.data() : {}; showDue(); }, function () {});
    return Promise.all([E.load(ID), E.lookups(), window.EGBCLaunch ? EGBCLaunch.check() : { locked: false, opensOn: '' }]);
  }).then(function (r) {
    if (!r[0]) {
      document.getElementById('wrap').innerHTML =
        '<div class="card">That event could not be found, or it is not open to you. ' +
        '<a href="whatson.html" style="color:var(--brand)">See what\'s on</a>.</div>';
      return;
    }
    EV = r[0].ev; TT = r[0].ticketTypes; QS = r[0].questions; CAP = r[0].capacity;
    /* UNTIL SWITCH-OVER (F-203): the live database can be read by anybody
       until the locked rules deploy (churchSettings/launch.rulesLocked), so
       questions about health are not asked or saved before then. The
       sign-up still works; the page says to tell the organiser directly. */
    LAUNCH = r[2] || { locked: false, opensOn: '' };
    if (!LAUNCH.locked) { HELD = QS.filter(E.isHealthQuestion); QS = QS.filter(function (q) { return !E.isHealthQuestion(q); }); }
    LOOK = r[1]; WHERE = E.locationText(EV, LOOK);
    return loadInvite().then(function () { return r; });
  }).then(function (r) {
    if (!r) return;
    document.title = (EV.title || 'Event') + ' — EGBC';
    if (EV.signupScope === 'series' && EV.seriesId && EV.signupOn) {
      return E.seriesDates(EV).then(function (d) { SERIES = d.length > 1 ? d : null; draw(); }, function () { draw(); });
    }
    draw();
  }).catch(function (e) {
    /* Not open to this person (Who can come, §21): say exactly what a
       missing event says, so a members-only event is not even hinted at. */
    if (/permission/i.test(String((e && (e.code || e.message)) || e))) {
      document.getElementById('wrap').innerHTML =
        '<div class="card">That event could not be found, or it is not open to you. ' +
        '<a href="whatson.html" style="color:var(--brand)">See what\'s on</a>.</div>';
      return;
    }
    document.getElementById('wrap').innerHTML =
      '<div class="card">That event could not be loaded.<br><span style="font-size:13px;color:#6b7280">' + esc(e.message || e) + '</span></div>';
  });
})();
</script>
</body>
</html>
