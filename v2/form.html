<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610081518" data-title="Form"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-church.js?v=202610101000"></script>
<script src="egbc-email.js?v=202610062100"></script>
<script src="egbc-ics.js?v=202610091200"></script>
<script src="egbc-events.js?v=202610072300"></script>
<script src="egbc-events-checkin.js?v=202610080900"></script>
<script src="egbc-events-forms.js?v=202610080900"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 72px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:20px;margin-bottom:14px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 6px}
  h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line);
     display:flex;align-items:center;gap:10px}
  .purpose{color:var(--body);margin:0 0 10px}
  .meta{color:var(--muted);font-size:13px;margin:0}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .help{font-size:12px;color:var(--muted);margin:-2px 0 6px}
  .inp,select,textarea{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;
       font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
  .inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .field{margin-bottom:16px}
  .check{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--body);font-weight:400}
  .check input{width:16px;height:16px;accent-color:var(--brand);flex:none;margin-top:2px}
  .row-card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fafafa}
  .row-card h3{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
       border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent;
       background:var(--brand);color:#fff;text-decoration:none}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.sec:hover{background:#f3f4f6}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.sm{height:32px;padding:0 11px}
  .banner{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:14px}
  .banner.warn{background:var(--danger-bg);color:var(--danger)}
  .banner.ok{background:var(--ok-bg);color:var(--ok)}
  .banner.info{background:var(--tint);color:var(--body);border:1px solid #cfe0de}
  .ans{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .ans:first-child{border-top:none}
  .ans .k{color:var(--muted)}
  .ans .v{color:var(--ink);font-weight:500;text-align:right;white-space:pre-wrap}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card">Loading…</div></div>

<script>
(function () {
  'use strict';
  var F = window.EGBCForms, E = window.EGBCEvents, esc = E.esc;
  var P = new URLSearchParams(location.search);
  var KEY = P.get('k') || '', SECRET = P.get('s') || '';
  var REQ = null, FORM = null, PREFILL = {}, ROWS = {};

  function db() { return EGBCAuth.db; }
  function icons() { if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons(); }
  function ico(n, px) { return '<i data-lucide="' + n + '" style="width:' + (px || 15) + 'px;height:' + (px || 15) + 'px"></i>'; }
  function wrap(html) { document.getElementById('wrap').innerHTML = html; icons(); }
  function header() {
    return '<h1>' + esc(FORM.title) + '</h1>' +
      (REQ.eventTitle ? '<p class="meta">For ' + esc(REQ.eventTitle) + '</p>' : '') +
      (FORM.purpose ? '<p class="purpose" style="margin-top:10px">' + esc(FORM.purpose) + '</p>' : '');
  }
  function privacyNote() {
    return '<p class="meta" style="margin-top:6px">' + ico('lock', 13) +
      ' Answers marked with a lock (health, allergies, needs) are kept apart and seen only by the people responsible for safeguarding. ' +
      esc(F.validityText(FORM)) + '.</p>';
  }

  /* ---------- filling it in ---------- */

  function fieldHtml(f, id, value) {
    var req = f.required ? ' *' : '';
    var lock = F.isSensitive(f) ? '<span class="lock">' + ico('lock', 12) + 'kept private</span>' : '';
    var lab = '<label for="' + id + '">' + esc(f.label) + req + lock + '</label>' + (f.help ? '<p class="help">' + esc(f.help) + '</p>' : '');
    var v = value == null ? '' : value;
    if (f.type === 'longtext') return '<div class="field">' + lab + '<textarea id="' + id + '" maxlength="3000">' + esc(v) + '</textarea></div>';
    if (f.type === 'choice' || f.type === 'yesno') {
      var opts = f.type === 'yesno' ? ['Yes', 'No'] : (f.options || []);
      return '<div class="field">' + lab + '<select id="' + id + '"><option value="">Choose…</option>' +
        opts.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></div>';
    }
    if (f.type === 'date') return '<div class="field">' + lab + '<input class="inp" type="date" id="' + id + '" value="' + esc(v) + '"></div>';
    if (f.type === 'number') return '<div class="field">' + lab + '<input class="inp" type="number" id="' + id + '" value="' + esc(v) + '"></div>';
    if (f.type === 'file') return '<div class="field">' + lab + '<input class="inp" type="file" id="' + id + '" accept="application/pdf,image/*" style="height:auto;padding:8px 12px">' +
      '<p class="help">A PDF or a picture, up to 10 MB.</p></div>';
    if (f.type === 'signature') {
      return '<div class="field"><label for="' + id + '_n">Sign by typing your full name' + req + '</label>' +
        '<input class="inp" id="' + id + '_n" autocomplete="name" maxlength="120">' +
        '<label class="check" style="margin-top:8px"><input type="checkbox" id="' + id + '_a">' + esc(f.label) + '</label></div>';
    }
    return '<div class="field">' + lab + '<input class="inp" id="' + id + '" maxlength="300" value="' + esc(v) + '"></div>';
  }

  function repeatHtml(f) {
    var rows = ROWS[f.id];
    return '<div id="rep_' + esc(f.id) + '">' + rows.map(function (row, i) {
      return '<div class="row-card"><h3>' + ico('user', 15) + esc(f.label) + ' ' + (i + 1) +
        (rows.length > 1 ? '<span style="flex:1"></span><button type="button" class="btn ghost sm" data-droprow="' + esc(f.id) + '" data-i="' + i + '">Remove</button>' : '') + '</h3>' +
        (f.fields || []).map(function (sf) { return fieldHtml(sf, 'f_' + f.id + '__' + i + '__' + sf.id, row[sf.id]); }).join('') +
        '</div>';
    }).join('') + '</div>' +
    '<button type="button" class="btn sec sm" data-addrow="' + esc(f.id) + '">' + ico('plus') + 'Add another</button>';
  }

  function drawForm(note) {
    (FORM.fields || []).forEach(function (f) {
      if (f.type !== 'repeat' || ROWS[f.id]) return;
      var prev = PREFILL[f.id];
      ROWS[f.id] = (prev && prev.length) ? prev.map(function (r) { return Object.assign({}, r); })
        : (REQ.subjects && REQ.subjects.length ? REQ.subjects : ['']).map(function (n) { return { name: n }; });
    });
    wrap('<div class="card">' + header() + privacyNote() + '</div>' +
      (note ? '<div class="banner info">' + note + '</div>' : '') +
      '<form id="f" class="card" novalidate>' +
        (FORM.fields || []).map(function (f) {
          return f.type === 'repeat' ? '<div class="field"><label>' + esc(f.label) + '</label>' + repeatHtml(f) + '</div>'
                                     : fieldHtml(f, 'f_' + f.id, PREFILL[f.id]);
        }).join('') +
        '<div id="err"></div>' +
        '<button class="btn" id="go" type="submit">' + ico('send', 16) + 'Send the form</button>' +
      '</form>');
    wireRows();
    document.getElementById('f').onsubmit = submit;
    /* A message about something missing goes as soon as the person changes
       anything, so it is never left on screen after they have fixed it. */
    var clear = function () { var e = document.getElementById('err'); if (e && e.innerHTML) e.innerHTML = ''; };
    document.getElementById('f').addEventListener('input', clear);
    document.getElementById('f').addEventListener('change', clear);
  }

  function readRows() {
    (FORM.fields || []).forEach(function (f) {
      if (f.type !== 'repeat') return;
      ROWS[f.id] = ROWS[f.id].map(function (row, i) {
        var out = {};
        (f.fields || []).forEach(function (sf) { var v = read(sf, 'f_' + f.id + '__' + i + '__' + sf.id); if (v !== undefined) out[sf.id] = v; else if (row[sf.id] !== undefined) out[sf.id] = row[sf.id]; });
        return out;
      });
    });
  }

  function wireRows() {
    document.querySelectorAll('[data-addrow]').forEach(function (b) {
      b.onclick = function () { readRows(); ROWS[b.getAttribute('data-addrow')].push({}); keep(); };
    });
    document.querySelectorAll('[data-droprow]').forEach(function (b) {
      b.onclick = function () { readRows(); ROWS[b.getAttribute('data-droprow')].splice(+b.getAttribute('data-i'), 1); keep(); };
    });
  }
  /* Redraw without losing what has been typed outside the sections. */
  function keep() {
    (FORM.fields || []).forEach(function (f) { if (f.type !== 'repeat' && f.type !== 'file' && f.type !== 'signature') { var v = read(f, 'f_' + f.id); if (v !== undefined) PREFILL[f.id] = v; } });
    drawForm();
  }

  function read(f, id) {
    if (f.type === 'signature') {
      var n = document.getElementById(id + '_n'), a = document.getElementById(id + '_a');
      return n ? { name: n.value.trim(), agreed: !!(a && a.checked) } : undefined;
    }
    if (f.type === 'file') { var el = document.getElementById(id); return el && el.files && el.files[0] ? el.files[0] : null; }
    var e = document.getElementById(id);
    if (!e) return undefined;
    if (f.type === 'number') return e.value === '' ? '' : Number(e.value);
    return e.value.trim();
  }

  function empty(f, v) {
    if (f.type === 'signature') return !v || !v.name || !v.agreed;
    if (f.type === 'file') return !v;
    return v === '' || v == null;
  }

  function fail(m) {
    document.getElementById('err').innerHTML = '<div class="banner warn">' + esc(m) + '</div>';
    document.getElementById('go').disabled = false;
  }

  function submit(e) {
    e.preventDefault();
    var go = document.getElementById('go'); go.disabled = true;
    document.getElementById('err').innerHTML = '';
    readRows();
    var answers = {}, files = [], missing = '';
    (FORM.fields || []).forEach(function (f) {
      if (f.type === 'repeat') {
        answers[f.id] = ROWS[f.id];
        if (f.required && !ROWS[f.id].length) missing = missing || f.label;
        ROWS[f.id].forEach(function (row, i) {
          (f.fields || []).forEach(function (sf) {
            if (sf.required && empty(sf, row[sf.id])) missing = missing || (sf.label + ' (' + f.label.toLowerCase() + ' ' + (i + 1) + ')');
          });
        });
        return;
      }
      var v = read(f, 'f_' + f.id);
      /* A signature's label is the sentence being agreed to, which reads
         like a question when quoted back - so say what to do instead. */
      if (f.required && empty(f, v)) missing = missing || (f.type === 'signature'
        ? { sign: (!v || !v.name) ? 'type your full name' + (v && v.agreed ? '' : ' and tick the box') : 'tick the box under your name' }
        : f.label);
      if (f.type === 'file') { if (v) files.push({ id: f.id, file: v }); return; }
      if (f.type === 'signature') { if (v && v.name) answers[f.id] = { name: v.name, agreed: v.agreed, at: new Date().toISOString() }; return; }
      if (v !== undefined && v !== '') answers[f.id] = v;
    });
    if (missing) return fail(missing.sign ? 'Please sign the form: ' + missing.sign + '.' : 'Please answer: ' + missing);
    var big = files.filter(function (x) { return x.file.size > 10 * 1024 * 1024; })[0];
    if (big) return fail('That file is too big. Please keep it under 10 MB.');

    /* Files first, into this request's own folder, so the answer can say
       where they are. */
    Promise.all(files.map(function (x) {
      var path = 'formUploads/' + KEY + '/' + Date.now() + '-' + x.file.name.replace(/[^a-z0-9.\-_]/gi, '_');
      return EGBCAuth.storage().ref(path).put(x.file, { contentType: x.file.type }).then(function () {
        answers[x.id] = { path: path, name: x.file.name, size: x.file.size, type: x.file.type };
      });
    })).then(function () {
      var parts = F.split(FORM, answers);
      var rid = E.key(32), sid = parts.hasSensitive ? E.key(32) : '';
      var now = new Date().toISOString();
      var until = F.validUntil(FORM, REQ.eventStart || '', new Date());
      var del = F.deleteAfter(FORM, until);
      var b = db().batch();
      b.set(db().collection('formResponses').doc(rid), {
        formId: REQ.formId, formVersion: FORM.version || 1, requestKey: KEY, calEventId: REQ.calEventId || '',
        personKind: REQ.personKind || '', personId: REQ.personId || '', email: REQ.email, name: REQ.name || '',
        subjects: subjectsOf(answers), siteId: REQ.siteId || '', answers: parts.plain, hasSensitive: parts.hasSensitive,
        submittedAt: now, validUntil: until, deleteAfter: del
      });
      if (sid) b.set(db().collection('sensitiveResponses').doc(sid), {
        responseId: rid, requestKey: KEY, formId: REQ.formId, siteId: REQ.siteId || '', calEventId: REQ.calEventId || '',
        answers: parts.sensitive, submittedAt: now, deleteAfter: del
      });
      b.update(db().collection('formRequests').doc(KEY), { status: 'done', completedAt: now, responseId: rid });
      return b.commit().then(function () {
        REQ.status = 'done'; REQ.responseId = rid;
        return EGBCChurch.send(F.doneEmail(REQ, sid, false)).catch(function () {});
      }).then(function () { done(sid, false); });
    }).catch(function (err) {
      var m = String((err && err.message) || err);
      fail(/permission|insufficient/i.test(m)
        ? 'This form could not be sent. It may already have been filled in from this link.'
        : 'This form could not be sent: ' + m);
    });
  }

  /* Who the answer covers: the names in a section for each child, or the
     person themselves. This is what reuse matches on. */
  function subjectsOf(answers) {
    var rep = (FORM.fields || []).filter(function (f) { return f.type === 'repeat'; })[0];
    if (rep) return (answers[rep.id] || []).map(function (r) { return r.name || ''; }).filter(Boolean);
    return [REQ.name || REQ.email];
  }

  function done(sid, reused) {
    wrap('<div class="card">' + header() + '</div>' +
      '<div class="card"><div class="banner ok">' + ico('check', 15) + ' Thank you. ' +
        (reused ? 'You have told us it is still correct.' : 'Your form is in.') + '</div>' +
      '<p style="margin:0 0 12px">We have emailed you a copy of the link to see what you sent. Keep it: only you have it.</p>' +
      (sid || reused ? '<a class="btn sec" href="form.html?k=' + encodeURIComponent(KEY) + (sid ? '&s=' + encodeURIComponent(sid) : '') + '">' + ico('eye') + 'See what you sent</a>' : '') +
      '</div>');
  }

  /* ---------- "still correct?" ---------- */

  function drawReuse(prev) {
    wrap('<div class="card">' + header() + '</div>' +
      '<div class="card"><h2>' + ico('history', 17) + 'What we have on file</h2>' +
        '<p class="meta" style="margin:-4px 0 12px">Sent on ' + esc(E.fmtDate(prev.submittedAt)) + ', valid until ' + esc(E.fmtDate(prev.validUntil + 'T12:00')) + '.</p>' +
        answersHtml(prev.answers) +
        (prev.hasSensitive ? '<div class="banner info" style="margin-top:12px">' + ico('lock', 13) +
          ' Health and medical details are on file too. They are not shown on this page to keep them private; the link in your earlier "form received" email shows them.</div>' : '') +
        '<div class="bar">' +
          '<button class="btn" id="yes">' + ico('check', 16) + 'Yes, all still correct</button>' +
          '<button class="btn sec" id="no">' + ico('pencil', 15) + 'Something has changed</button>' +
        '</div><div id="err"></div></div>');
    document.getElementById('yes').onclick = function () {
      this.disabled = true;
      db().collection('formRequests').doc(KEY).update({
        status: 'done', completedAt: new Date().toISOString(), responseId: REQ.reuseOf, confirmedStillCorrect: true
      }).then(function () {
        REQ.status = 'done';
        return EGBCChurch.send(F.doneEmail(REQ, '', true)).catch(function () {});
      }).then(function () { done('', true); })
        .catch(function (e) { document.getElementById('err').innerHTML = '<div class="banner warn">That did not go through: ' + esc(e.message || e) + '</div>'; });
    };
    document.getElementById('no').onclick = function () {
      /* The ordinary answers come back filled in; medical ones are asked
         again, because this page cannot read them. */
      PREFILL = JSON.parse(JSON.stringify(prev.answers || {}));
      drawForm('We have filled in what we already knew, apart from health and medical details, which we ask again each time something changes.');
    };
  }

  /* ---------- what was sent ---------- */

  function answersHtml(ans) {
    return (FORM.fields || []).map(function (f) {
      if (f.type === 'repeat') {
        return (ans[f.id] || []).map(function (row, i) {
          return '<div class="row-card"><h3>' + ico('user', 15) + esc(row.name || (f.label + ' ' + (i + 1))) + '</h3>' +
            (f.fields || []).filter(function (sf) { return F.show(sf, row[sf.id]); }).map(function (sf) {
              return '<div class="ans"><span class="k">' + esc(sf.label) + '</span><span class="v">' + esc(F.show(sf, row[sf.id])) + '</span></div>';
            }).join('') + '</div>';
        }).join('');
      }
      var v = F.show(f, ans[f.id]);
      return v ? '<div class="ans"><span class="k">' + esc(f.label) + '</span><span class="v">' + esc(v) + '</span></div>' : '';
    }).join('');
  }

  function drawView(resp, sens) {
    var all = F.merge(FORM, resp.answers, sens ? sens.answers : {});
    wrap('<div class="card">' + header() + '</div>' +
      '<div class="card"><h2>' + ico('file-check', 17) + 'What you sent</h2>' +
        '<p class="meta" style="margin:-4px 0 12px">Sent on ' + esc(E.fmtDate(resp.submittedAt)) + '. Valid until ' +
          esc(E.fmtDate(resp.validUntil + 'T12:00')) + '. Kept until ' + esc(E.fmtDate(resp.deleteAfter + 'T12:00')) + ', then deleted.</p>' +
        answersHtml(all) +
        (resp.hasSensitive && !sens ? '<div class="banner info" style="margin-top:12px">' + ico('lock', 13) + ' Health and medical details are held too. Use the link in your "form received" email to see them.</div>' : '') +
      '</div>');
  }

  /* ---------- start ---------- */

  if (!KEY) { wrap('<div class="card">This link is missing its key. Use the link in your email.</div>'); return; }

  EGBCAuth.optional().then(function () {
    return db().collection('formRequests').doc(KEY).get();
  }).then(function (s) {
    if (!s.exists) throw new Error('missing');
    REQ = Object.assign({ key: KEY }, s.data());
    return db().collection('forms').doc(REQ.formId).get();
  }).then(function (s) {
    if (!s.exists) throw new Error('missing');
    FORM = s.data();
    if (REQ.status === 'done') {
      var rid = REQ.responseId;
      return Promise.all([
        db().collection('formResponses').doc(rid).get(),
        SECRET ? db().collection('sensitiveResponses').doc(SECRET).get() : Promise.resolve(null)
      ]).then(function (r) {
        if (!r[0].exists) throw new Error('missing');
        var sens = r[1] && r[1].exists && r[1].data().responseId === rid ? r[1].data() : null;
        if (REQ.confirmedStillCorrect || SECRET) return drawView(r[0].data(), sens);
        wrap('<div class="card">' + header() + '<div class="banner ok" style="margin-top:12px">' + ico('check', 15) +
          ' This form was sent on ' + esc(E.fmtDate(REQ.completedAt)) + '. Thank you.</div>' +
          '<p class="meta">To see what you sent, use the link in your "form received" email.</p></div>');
      });
    }
    if (REQ.status === 'reuse' && REQ.reuseOf) {
      return db().collection('formResponses').doc(REQ.reuseOf).get().then(function (r) {
        if (r.exists) return drawReuse(r.data());
        drawForm();
      });
    }
    drawForm();
  }).catch(function () {
    wrap('<div class="card">This form could not be found. The link may have been mistyped, or the request withdrawn.</div>');
  });
})();
</script>
</body>
</html>
