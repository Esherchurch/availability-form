<!DOCTYPE html>
<html lang="en">
<head>
<script src="egbc-nosend.js?v=202610212000"></script>
<script src="egbc-appmode.js?v=202610201500"></script>
<script src="egbc-shell.js?v=202610311800" data-title="Your services"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your services</title>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3d6263">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610311900"></script>
<script src="egbc-guard.js?v=202610311900" data-job="office"></script>
<style>
  :root{
    --canvas:#f6f7f7; --surface:#fff; --ink:#111827; --body:#374151; --muted:#6b7280;
    --faint:#9ca3af; --line:#e5e7eb; --line-2:#d1d5db; --brand:#3d6263;
    --tint:#eef5f4; --ring:rgba(61,98,99,.15); --danger:#b0392c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
  h1{font-size:22px;font-weight:600;color:var(--ink);margin:0 0 6px;letter-spacing:-.01em}
  h2{font-size:17px;font-weight:600;color:var(--ink);margin:24px 0 4px}
  .lede,.hint{color:var(--muted);margin:0 0 12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
        box-shadow:0 1px 2px rgba(16,24,40,.05);padding:14px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (max-width:560px){.grid{grid-template-columns:1fr 1fr}}
  label.fl{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:10px 0 4px}
  input[type=text],input[type=time],select{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:8px;
       padding:6px 10px;font:400 14px Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
  .tick{display:inline-flex;gap:8px;align-items:center;min-height:40px;margin-right:14px;cursor:pointer}
  .tick input{width:18px;height:18px;accent-color:var(--brand)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row input[type=text]{flex:1;min-width:160px}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;
       border:1px solid var(--line-2);background:#fff;color:var(--ink);font:500 14px Inter,system-ui,sans-serif;cursor:pointer}
  .btn.small{min-height:36px;padding:0 10px;font-size:13px}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.danger{color:var(--danger)}
  .btn[disabled]{opacity:.55;cursor:default}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
  .chip{border:1px dashed var(--line-2);border-radius:999px;padding:4px 12px;background:#fff;cursor:pointer;min-height:36px;font:inherit;color:var(--ink)}
  .bar{position:sticky;bottom:0;background:var(--canvas);padding:12px 0;border-top:1px solid var(--line);margin-top:18px}
  #msg{margin:8px 0 0;color:var(--muted);min-height:20px}
  .errs{color:var(--danger);margin:8px 0 0;padding-left:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Your services</h1>
  <p class="lede">The kinds of service and meeting your rota offers, and the people a service names (such as who leads it and who preaches).
    Each service keeps its own rota, plan and building.</p>
  <div id="out"><div class="card">Loading…</div></div>
</div>
<script>
/* YOUR SERVICES (H-11 items 3 and 4; Martin's answers, 23 Oct 2026).
   Kept in churchSettings/services (egbc-services.js says what each field
   means); the office and master admins change it (firestore.rules). With
   nothing stored, the church's lists are EGBC's defaults, shown here so
   they can be changed. Also the "Your services" step of a new church's
   setup. */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Ideas to add with one tap: general words, no church's own. */
const TYPE_IDEAS = ['Holy Communion', 'Parish Eucharist', 'Morning Prayer', 'Choral Evensong', 'Evening Prayer', 'All-age service',
  'Family service', 'Midweek communion', 'Prayer meeting', 'Baptism', 'Wedding', 'Funeral', 'Band practice', 'Choir practice'];
const ROLE_IDEAS = ['President', 'Preacher', 'Intercessor', 'Reader', 'Deacon', 'Leader', 'Worship leader', 'Welcome', 'Chalice assistant'];
let S = null, TYPES = [], ROLES = [], SITES = [], JOBS = [], STORED = false;

async function load() {
  const sv = await EGBCAuth.services();
  S = sv.S; STORED = !!sv.cfg;
  TYPES = JSON.parse(JSON.stringify(S.types(sv.cfg)));
  ROLES = JSON.parse(JSON.stringify(S.roles(sv.cfg)));
  try {
    SITES = (await EGBCAuth.db.collection('sites').get()).docs.map(d => ({ id: d.id, name: String((d.data() || {}).name || d.id), active: (d.data() || {}).active !== false }))
      .filter(x => x.active);
  } catch (e) { SITES = []; }
  JOBS = (window.EGBCTeamJobs ? EGBCTeamJobs.JOBS : []).map(j => ({ id: j.id, teams: EGBCAuth.teamsForJob(j.id) }))
    .filter(j => j.teams.length);
  draw();
}

function typeCard(t, i) {
  const sites = SITES.length > 1 ? '<div><label class="fl" for="t-site-' + i + '">Usual building</label><select id="t-site-' + i + '" data-t="' + i + '" data-k="siteId">'
    + SITES.map((x, n) => '<option value="' + (n ? esc(x.id) : '') + '"' + ((t.siteId || '') === (n ? x.id : '') ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select></div>' : '';
  return '<div class="card">'
    + '<div class="row"><input type="text" aria-label="Name" value="' + esc(t.name) + '" maxlength="80" data-t="' + i + '" data-k="name">'
    + '<button type="button" class="btn small" data-up="' + i + '" aria-label="Move up"' + (i ? '' : ' disabled') + '>↑</button>'
    + '<button type="button" class="btn small danger" data-del-t="' + i + '">Remove</button></div>'
    + '<label class="tick"><input type="checkbox" data-t="' + i + '" data-k="service"' + (t.service ? ' checked' : '') + '> A service (on What’s on, the preaching plan and the planners)</label>'
    + '<div class="grid"><div><label class="fl" for="t-s-' + i + '">Team arrives</label><input type="time" id="t-s-' + i + '" value="' + esc(t.start || '') + '" data-t="' + i + '" data-k="start"></div>'
    + '<div><label class="fl" for="t-e-' + i + '">Ends</label><input type="time" id="t-e-' + i + '" value="' + esc(t.end || '') + '" data-t="' + i + '" data-k="end"></div>'
    + (t.service ? '<div><label class="fl" for="t-p-' + i + '">Starts (public)</label><input type="time" id="t-p-' + i + '" value="' + esc(t.publicTime || '') + '" data-t="' + i + '" data-k="publicTime"></div>' : '')
    + sites + '</div>'
    + (JOBS.length ? '<label class="fl">The teams it needs</label>' + JOBS.map(j => '<label class="tick"><input type="checkbox" data-t="' + i + '" data-job="' + esc(j.id) + '"'
      + ((t.jobs || []).indexOf(j.id) !== -1 ? ' checked' : '') + '> ' + esc(j.teams.join(', ')) + '</label>').join('') : '')
    + '<label class="fl" for="t-sl-' + i + '">Rota places it starts with <span class="hint">(comma between each)</span></label>'
    + '<input type="text" id="t-sl-' + i + '" value="' + esc((t.slots || []).join(', ')) + '" data-t="' + i + '" data-k="slots">'
    + '</div>';
}

function draw() {
  let h = (STORED ? '' : '<p class="hint">These are the starting lists. Change anything, then save.</p>')
    + '<h2>Kinds of service and meeting</h2><p class="hint">In the order the rota offers them. The first service is the one “Populate term” fills each Sunday.</p>'
    + TYPES.map(typeCard).join('')
    + '<div class="row"><input type="text" id="new-type" maxlength="80" placeholder="Add a kind, such as 10am Parish Eucharist"><button type="button" class="btn" id="add-type">Add</button></div>'
    + '<div class="chips">' + TYPE_IDEAS.filter(n => !TYPES.some(t => t.name.toLowerCase() === n.toLowerCase())).map(n => '<button type="button" class="chip" data-idea-t="' + esc(n) + '">+ ' + esc(n) + '</button>').join('') + '</div>'
    + '<h2>The roles a service names</h2><p class="hint">People who are not rota places, typed on each service. Ticked ones go on the team slides.</p>'
    + ROLES.map((r, i) => '<div class="card row"><input type="text" aria-label="Role" value="' + esc(r.name) + '" maxlength="60" data-r="' + i + '">'
      + '<label class="tick"><input type="checkbox" data-r-slides="' + i + '"' + (r.slides !== false ? ' checked' : '') + '> On the slides</label>'
      + '<button type="button" class="btn small danger" data-del-r="' + i + '">Remove</button></div>').join('')
    + '<div class="row"><input type="text" id="new-role" maxlength="60" placeholder="Add a role, such as Intercessor"><button type="button" class="btn" id="add-role">Add</button></div>'
    + '<div class="chips">' + ROLE_IDEAS.filter(n => !ROLES.some(r => r.name.toLowerCase() === n.toLowerCase())).map(n => '<button type="button" class="chip" data-idea-r="' + esc(n) + '">+ ' + esc(n) + '</button>').join('') + '</div>'
    + '<div class="bar"><button type="button" class="btn primary" id="save">Save</button><ul class="errs" id="errs"></ul><p id="msg" role="status"></p></div>';
  $('out').innerHTML = h;
}

function addType(name) {
  name = String(name || '').trim(); if (!name) return;
  TYPES.push({ name, service: true, start: '', end: '', publicTime: '', siteId: '', jobs: [], slots: [] });
  draw();
}
function addRole(name) {
  name = String(name || '').trim(); if (!name) return;
  ROLES.push({ id: S.roleId(name, ROLES.map(r => r.id)), name, slides: true });
  draw();
}

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.t !== undefined && t.dataset.k) {
    const x = TYPES[+t.dataset.t], k = t.dataset.k;
    if (k === 'service') { x.service = t.checked; draw(); return; }
    x[k] = k === 'slots' ? t.value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 60) : t.value;
  } else if (t.dataset.t !== undefined && t.dataset.job) {
    const x = TYPES[+t.dataset.t]; x.jobs = (x.jobs || []).filter(j => j !== t.dataset.job);
    if (t.checked) x.jobs.push(t.dataset.job);
  } else if (t.dataset.r !== undefined) ROLES[+t.dataset.r].name = t.value;
  else if (t.dataset.rSlides !== undefined) ROLES[+t.dataset.rSlides].slides = t.checked;
});
document.addEventListener('change', (e) => { if (e.target.dataset.k === 'siteId') TYPES[+e.target.dataset.t].siteId = e.target.value; });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'add-type') return addType($('new-type').value);
  if (b.id === 'add-role') return addRole($('new-role').value);
  if (b.dataset.ideaT) return addType(b.dataset.ideaT);
  if (b.dataset.ideaR) return addRole(b.dataset.ideaR);
  if (b.dataset.delT) { TYPES.splice(+b.dataset.delT, 1); return draw(); }
  if (b.dataset.delR) { ROLES.splice(+b.dataset.delR, 1); return draw(); }
  if (b.dataset.up) { const i = +b.dataset.up; [TYPES[i - 1], TYPES[i]] = [TYPES[i], TYPES[i - 1]]; return draw(); }
  if (b.id === 'save') return save();
});

async function save() {
  const body = { types: TYPES.map(t => ({ name: String(t.name || '').trim(), service: !!t.service, start: t.start || '', end: t.end || '',
      publicTime: t.service ? (t.publicTime || '') : '', siteId: t.siteId || '', jobs: (t.jobs || []).slice(0, 20), slots: (t.slots || []).slice(0, 60) })),
    roles: ROLES.map(r => ({ id: r.id, name: String(r.name || '').trim(), slides: r.slides !== false })) };
  const problems = S.validate(body);
  $('errs').innerHTML = problems.map(p => '<li>' + esc(p) + '</li>').join('');
  if (problems.length) { $('msg').textContent = ''; return; }
  $('save').disabled = true;
  try {
    await EGBCAuth.db.collection('churchSettings').doc('services').set(Object.assign(body,
      { updatedAt: new Date().toISOString(), updatedBy: (EGBCAuth.user() || {}).uid || '' }));
    S.forget(); STORED = true;
    $('msg').textContent = 'Saved. New services on the rota use these from now on.';
  } catch (err) {
    console.error('services-settings: could not save', err);
    $('msg').textContent = 'That did not save. Please try again.';
  }
  $('save').disabled = false;
}
document.addEventListener('egbc-ready', () => load().catch(e => {
  console.error('services-settings:', e);
  $('out').innerHTML = '<div class="card">This could not be loaded. Please try again.</div>';
}));
</script>
</body>
</html>
