<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gift Aid</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-appmode.js?v=202610201500"></script>
<script src="egbc-shell.js?v=202610211500" data-title="Gift Aid"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610210900"></script>
<script src="egbc-guard.js?v=202610210900"></script>
<script src="egbc-church.js?v=202610192330"></script>
<script src="egbc-events.js?v=202610161700"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;--muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;--ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px calc(72px + env(safe-area-inset-bottom))}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:16px;font-weight:600;color:var(--ink);margin:0 0 8px}
  label.l{display:block;font-size:14px;font-weight:500;color:var(--ink);margin:10px 0 5px}
  .inp,select{width:100%;min-width:0;min-height:48px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font:400 16px Inter,sans-serif;color:var(--ink);background:#fff}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
  @media (max-width:480px){.two{grid-template-columns:minmax(0,1fr)}}
  .words{background:var(--tint);border-radius:10px;padding:12px;font-size:15px;color:var(--ink)}
  .tick{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px;color:var(--ink)}.tick input{margin-top:3px;width:20px;height:20px;flex:none}
  .hint{font-size:13px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:10px;font:600 15px Inter,sans-serif;cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}.btn.small{min-height:40px;font-size:14px;padding:0 12px}
  .btn:disabled{opacity:.55}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .done{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:12px}
  .row{padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:none}
  .row b{color:var(--ink)}.row .m{font-size:13px;color:var(--muted);overflow-wrap:break-word}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--tint);color:var(--brand)}.pill.no{background:#fdf1ef;color:var(--danger)}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gift Aid</h1>
  <p class="sub">If you pay UK tax, Gift Aid lets the church claim an extra 25p from HMRC for every £1 you give, at no cost to you.</p>
  <div id="main"><div class="card">Loading…</div></div>
  <div id="office"></div>
</div>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  /* GIFT AID DECLARATIONS (NEXT-BRIEF §24 item 6; F-168), feature name
     'giftAid'. Signed in only; sensitive (name, address, tax status).
     EACH DECLARATION IS ITS OWN RECORD AND IS NEVER DELETED: HMRC expects
     the church to keep them (at least six years after the last claim that
     relies on one). Cancelling marks it cancelled from a date; declaring
     again makes a new one. Read by the person and by the office and the
     treasurer only - master admins, the Finance group and the Church office
     group (the rules, giftAid). */
  var E = window.EGBCEvents, esc = E.esc;
  var ME = {}, MINE = [], OFFICE = null, PEOPLE = {}, BUSY = false;
  var TITLES = ['', 'Mr', 'Mrs', 'Miss', 'Ms', 'Mx', 'Dr', 'Rev'];
  function db() { return EGBCAuth.db; }
  function uid() { return (EGBCAuth.user() || {}).uid || ''; }
  function now() { return firebase.firestore.FieldValue.serverTimestamp(); }
  function $(id) { return document.getElementById(id); }
  function val(id) { var e = $(id); return e ? String(e.value || '').trim() : ''; }
  function all(s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 4000); }
  function today() { var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  function dateSaid(ymd) { return ymd ? E.fmtDate(ymd + 'T12:00') : ''; }
  /* A UK postcode, roughly: enough to catch a slip, not to refuse a real one. */
  function postcodeOk(p) { return /^[A-Z]{1,2}[0-9][A-Z0-9]? ?[0-9][A-Z]{2}$/i.test(p.trim()); }
  function church() { return EGBCChurch.name() || 'the church'; }
  /* HMRC's model wording, in the church's own name. */
  function wording() {
    return 'I want to Gift Aid any donations I make in the future, and have made in the past 4 years, to ' + church() + '. ' +
      'I am a UK taxpayer and understand that if I pay less Income Tax and/or Capital Gains Tax in the current tax year than the amount of Gift Aid claimed on all my donations, it is my responsibility to pay any difference.';
  }
  function nameFields(pre, d) {
    d = d || {};
    return '<div class="two"><div><label class="l" for="' + pre + 'title">Title (optional)</label><select id="' + pre + 'title">' +
      TITLES.map(function (t) { return '<option' + (d.title === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div><div></div></div>' +
      '<div class="two"><div><label class="l" for="' + pre + 'first">First name</label><input class="inp" id="' + pre + 'first" maxlength="60" value="' + esc(d.firstName || '') + '"></div>' +
      '<div><label class="l" for="' + pre + 'last">Last name</label><input class="inp" id="' + pre + 'last" maxlength="60" value="' + esc(d.lastName || '') + '"></div></div>' +
      '<label class="l" for="' + pre + 'house">House name or number</label><input class="inp" id="' + pre + 'house" maxlength="60" value="' + esc(d.house || '') + '">' +
      '<label class="l" for="' + pre + 'addr">The rest of the address (optional)</label><input class="inp" id="' + pre + 'addr" maxlength="200" value="' + esc(d.address || '') + '">' +
      '<label class="l" for="' + pre + 'pc">Postcode</label><input class="inp" id="' + pre + 'pc" maxlength="10" autocapitalize="characters" value="' + esc(d.postcode || '') + '">';
  }
  function readName(pre) {
    return { title: val(pre + 'title'), firstName: val(pre + 'first').slice(0, 60), lastName: val(pre + 'last').slice(0, 60), house: val(pre + 'house').slice(0, 60),
      address: val(pre + 'addr').slice(0, 200), postcode: val(pre + 'pc').toUpperCase().replace(/\s+/g, ' ').slice(0, 10) };
  }
  function check(n) {
    if (!n.firstName || !n.lastName) return 'Give your first and last name';
    if (!n.house) return 'Give your house name or number';
    if (!postcodeOk(n.postcode)) return 'That postcode does not look right';
    return '';
  }

  /* ---------------- your declaration ---------------- */
  function drawMine() {
    if (window.EGBCChurch && EGBCChurch.uses && !EGBCChurch.uses('giftAid')) { $('main').innerHTML = '<div class="card">Gift Aid is not used by this church.</div>'; return; }
    var on = MINE.filter(function (d) { return !d.cancelled; })[0];
    if (on) {
      $('main').innerHTML = '<div class="card" id="have"><h2>Thank you</h2><div class="done">You have a Gift Aid declaration from ' + esc(dateSaid(on.declaredOn)) +
        (on.source === 'paper' ? ' (on paper)' : '') + '. ' + esc(church()) + ' can claim Gift Aid on what you give.</div>' +
        '<p class="hint">Please tell us if you change your name or address, or no longer pay enough tax.</p>' +
        '<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600;color:var(--ink);min-height:40px;display:flex;align-items:center">Change my name or address</summary>' + nameFields('m-', on) +
        '<div class="acts"><button class="btn" id="m-save">Save</button></div></details>' +
        '<details style="margin-top:4px"><summary style="cursor:pointer;font-weight:600;color:var(--ink);min-height:40px;display:flex;align-items:center">I no longer pay enough tax, or want to stop</summary>' +
        '<p>Cancelling stops Gift Aid on what you give from today. It does not change what has been claimed before.</p>' +
        '<div class="acts"><button class="btn sec" id="m-cancel">Cancel my declaration</button></div></details></div>';
      $('m-save').onclick = function () { var n = readName('m-'), e = check(n); if (e) { toast(e); return; }
        db().collection('giftAid').doc(on.id).update(Object.assign(n, { updatedAt: now(), updatedBy: uid() })).then(function () { toast('Saved.'); return load(); }).catch(function (x) { toast('Could not: ' + (x.message || x)); }); };
      $('m-cancel').onclick = function () { if (!confirm('Cancel your Gift Aid declaration from today?')) return;
        db().collection('giftAid').doc(on.id).update({ cancelled: true, cancelledOn: today(), updatedAt: now(), updatedBy: uid() }).then(function () { toast('Cancelled from today.'); return load(); }).catch(function (x) { toast('Could not: ' + (x.message || x)); }); };
      return;
    }
    var p = ME || {}, parts = String(p.name || '').split(' ');
    $('main').innerHTML = '<div class="card" id="declare"><h2>Make a Gift Aid declaration</h2>' + nameFields('g-', { firstName: parts[0] || '', lastName: parts.slice(1).join(' ') }) +
      '<p class="words" id="g-words">' + esc(wording()) + '</p>' +
      '<label class="tick"><input type="checkbox" id="g-yes"><span>Yes, I am a UK taxpayer and I want to Gift Aid my donations, as above.</span></label>' +
      '<p class="hint">Only the church office and the treasurer see this, to claim Gift Aid from HMRC.</p>' +
      '<div class="acts"><button class="btn" id="g-go">Make my declaration</button></div></div>';
    $('g-go').onclick = declare;
  }
  function declare() {
    if (BUSY) return;
    var n = readName('g-'), e = check(n);
    if (e) { toast(e); return; }
    if (!$('g-yes').checked) { toast('Tick the box to say you are a UK taxpayer'); return; }
    BUSY = true;
    db().collection('giftAid').add(Object.assign(n, { memberId: ME.memberId, source: 'app', taxpayer: true, wording: wording().slice(0, 1000), declaredOn: today(), declaredAt: now(),
      paperHeld: false, cancelled: false, cancelledOn: '', recordedBy: uid(), updatedAt: now(), updatedBy: uid() }))
      .then(function () { BUSY = false; toast('Thank you. Your declaration is made.'); return load(); })
      .catch(function (x) { BUSY = false; toast('Could not: ' + (x.message || x)); });
  }

  /* ---------------- the office and the treasurer ---------------- */
  function drawOffice() {
    if (!OFFICE) { $('office').innerHTML = ''; return; }
    var on = OFFICE.filter(function (d) { return !d.cancelled; }), off = OFFICE.filter(function (d) { return d.cancelled; });
    var people = Object.keys(PEOPLE).map(function (k) { return { id: k, name: PEOPLE[k] }; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    var row = function (d) { return '<div class="row"><b>' + esc([d.title, d.firstName, d.lastName].filter(Boolean).join(' ')) + '</b> <span class="pill' + (d.cancelled ? ' no' : '') + '">' +
      (d.cancelled ? 'cancelled ' + esc(dateSaid(d.cancelledOn)) : d.source === 'paper' ? 'on paper' : 'in the app') + '</span><div class="m">' + esc([d.house, d.postcode].filter(Boolean).join(', ')) +
      ' · declared ' + esc(dateSaid(d.declaredOn)) + '</div></div>'; };
    $('office').innerHTML = '<div class="card" id="list"><h2>Declarations: ' + on.length + '</h2><p class="hint" style="margin:0 0 6px">For the Gift Aid claim. Private: the office and the treasurer only.</p>' +
      (on.length ? on.map(row).join('') : '<p class="hint">None yet.</p>') +
      '<div class="acts"><button class="btn sec" id="csv">Download the list (CSV)</button></div>' +
      (off.length ? '<h2 style="margin-top:14px">Cancelled: ' + off.length + '</h2>' + off.map(row).join('') : '') + '</div>' +
      '<div class="card" id="paper"><h2>Record a declaration made on paper</h2><p class="hint" style="margin:0 0 6px">For someone who has already filled in a paper form. Keep the paper.</p>' +
      '<label class="l" for="p-who">Who</label><input class="inp" id="p-who" list="p-people" placeholder="Start typing a name"><datalist id="p-people">' +
      people.map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join('') + '</datalist>' +
      nameFields('p-', {}) + '<label class="l" for="p-date">The date on the paper form</label><input class="inp" type="date" id="p-date" max="' + today() + '">' +
      '<label class="tick"><input type="checkbox" id="p-held"><span>The signed paper declaration is held by the church.</span></label>' +
      '<div class="acts"><button class="btn" id="p-go">Record it</button></div></div>';
    $('csv').onclick = function () { download(on, off); };
    $('p-who').onchange = function () { var nm = val('p-who').split(' '); if (!val('p-first')) $('p-first').value = nm[0] || ''; if (!val('p-last')) $('p-last').value = nm.slice(1).join(' '); };
    $('p-go').onclick = recordPaper;
  }
  function recordPaper() {
    var id = Object.keys(PEOPLE).filter(function (k) { return PEOPLE[k] === val('p-who'); })[0], n = readName('p-'), e = check(n), date = val('p-date');
    if (!id) { toast('Choose the person from the list'); return; }
    if (e) { toast(e); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > today()) { toast('Give the date on the paper form'); return; }
    if (!$('p-held').checked) { toast('Tick that the paper declaration is held'); return; }
    db().collection('giftAid').add(Object.assign(n, { memberId: id, source: 'paper', taxpayer: true, wording: '', declaredOn: date, declaredAt: now(), paperHeld: true,
      cancelled: false, cancelledOn: '', recordedBy: uid(), updatedAt: now(), updatedBy: uid() }))
      .then(function () { toast('Recorded.'); return load(); }).catch(function (x) { toast('Could not: ' + (x.message || x)); });
  }
  /* In the order HMRC's claim schedule asks for the donor, then the
     declaration itself. */
  function download(on, off) {
    var head = ['Title', 'First name', 'Last name', 'House name or number', 'Postcode', 'Declaration date', 'How made', 'Status', 'Cancelled on'];
    var q = function (v) { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var rows = on.concat(off).map(function (d) { return [d.title, d.firstName, d.lastName, d.house, d.postcode, d.declaredOn, d.source === 'paper' ? 'Paper' : 'Online', d.cancelled ? 'Cancelled' : 'Active', d.cancelledOn || ''].map(q).join(','); });
    var csv = [head.join(',')].concat(rows).join('\r\n');
    window.__giftAidCsv = csv;   /* the browser test reads it here */
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'gift-aid-declarations-' + today() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------------- loading ---------------- */
  function load() {
    return Promise.all([
      db().collection('giftAid').where('memberId', '==', ME.memberId || '-').get().catch(function () { return { docs: [] }; }),
      /* Asked, not guessed: the office and the treasurer may list them all. */
      /* Asked, not guessed - but a preview (view as) can't be refused by the rules, so it doesn't ask. */
      E.viewing() ? null : db().collection('giftAid').get().then(all, function () { return null; })
    ]).then(function (r) {
      MINE = all(r[0]).sort(function (a, b) { return String(b.declaredOn).localeCompare(String(a.declaredOn)); });
      OFFICE = r[1] ? r[1].sort(function (a, b) { return String(a.lastName).localeCompare(String(b.lastName)); }) : null;
      drawMine();
      if (OFFICE && !Object.keys(PEOPLE).length) {
        return db().collection('addressBook').get().then(function (s) { s.docs.forEach(function (d) { var x = d.data(); if (x.name && !x.archived) PEOPLE[d.id] = x.name; }); }, function () {}).then(drawOffice);
      }
      drawOffice();
    });
  }
  EGBCAuth.require().then(function (p) { ME = E.asSeen(p || {}); return EGBCChurch.load(); }).then(load)
    .catch(function (e) { $('main').innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
})();
</script>
</body>
</html>
