<!DOCTYPE html>
<html>
<head>
<script src="egbc-shell.js?v=202609041014" data-title="Music Uploader"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202609041014"></script>
<script src="egbc-guard.js?v=202609041014" data-team="Worship Team" data-role="leader"></script>
<title>Batch Music Importer</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#eef4f3; --surface:#fff; --surface-2:#f6faf9; --ink:#14201f; --body:#3a4d4c; --muted:#6b8281; --faint:#93a8a6;
  --hairline:#dde7e6; --hairline-strong:#c9d8d6; --brand:#3d6263; --brand-dark:#2e4c4d; --brand-tint:#e7f0ef; --brand-ring:rgba(61,98,99,.28);
  --success:#3b7d23; --success-tint:#e7f1e0; --danger:#b0392c; --danger-tint:#f7e7e4; --gold:#b07d2e; --gold-tint:#f6efe1;
  --shadow-sm:0 1px 2px rgba(20,32,31,.05); --shadow:0 1px 2px rgba(20,32,31,.04),0 6px 20px rgba(20,32,31,.07); --shadow-lg:0 2px 4px rgba(20,32,31,.05),0 18px 48px rgba(20,32,31,.12);
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
}
*{ box-sizing:border-box; }
body{ font-family:'Montserrat',sans-serif; padding:28px; max-width:1320px; margin:0 auto; background:var(--canvas); color:var(--body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
h2{ font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--ink); margin:0 0 18px; }

.dropzone{
  border:2px dashed var(--hairline-strong);
  padding:36px;
  text-align:center;
  border-radius:var(--r-lg);
  cursor:pointer;
  margin-bottom:16px;
  background:var(--surface-2);
  color:var(--muted);
  font-weight:600;
  transition:border-color .2s, background .2s, color .2s;
}
.dropzone:hover, .dropzone.dragover{ border-color:var(--brand); background:var(--brand-tint); color:var(--brand); }
.dropzone .dz-hint{ display:block; font-size:13px; font-weight:500; color:var(--faint); margin-top:6px; }
.dropzone .dz-buttons{ margin-top:14px; }

/* Hidden pickers — never overlay the page */
.file-picker{ display:none; }

#status{ font-size:13px; font-weight:500; color:var(--muted); margin:8px 0 14px; }

/* Buttons */
button{
  font-family:inherit; font-weight:700; font-size:13px;
  border-radius:var(--r-sm); border:1px solid var(--hairline-strong);
  background:var(--surface); color:var(--body);
  padding:8px 14px; margin:2px; cursor:pointer;
  transition:background .15s, border-color .15s, color .15s, transform .05s;
}
button:hover{ background:var(--surface-2); border-color:var(--brand); color:var(--brand); }
button:active{ transform:translateY(1px); }
button:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--brand-ring); }
.btn-primary{ background:var(--brand); border-color:var(--brand); color:#fff; padding:11px 20px; font-size:14px; border-radius:var(--r-md); }
.btn-primary:hover{ background:var(--brand-dark); border-color:var(--brand-dark); color:#fff; }

/* Table */
table{ border-collapse:separate; border-spacing:0; width:100%; font-size:13px; margin-top:16px; background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow); }
thead th{ background:var(--surface-2); color:var(--muted); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; text-align:left; padding:12px 10px; border-bottom:1px solid var(--hairline); white-space:nowrap; }
td{ padding:9px 10px; border-bottom:1px solid var(--hairline); vertical-align:middle; color:var(--body); }
tbody tr:last-child td{ border-bottom:none; }
td button{ padding:5px 10px; font-size:12px; }

.status-new{ background:var(--success-tint); }
.status-exists{ background:var(--danger-tint); }
.status-review{ background:var(--gold-tint); }
.status-skipped{ background:var(--surface-2); }

input, select{
  width:100%; font-family:inherit; font-size:13px; color:var(--ink);
  background:var(--surface); border:1px solid var(--hairline-strong);
  border-radius:var(--r-sm); padding:7px 9px;
  transition:border-color .15s, box-shadow .15s;
}
input:focus, select:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-ring); }

.group-row td{ background:var(--brand-tint); font-weight:700; color:var(--brand-dark); }
.conf-high{ color:var(--success); font-weight:700; }
.conf-medium{ color:var(--gold); font-weight:700; }
.conf-low{ color:var(--danger); font-weight:700; }

/* Help button — matches all other pages */
#helpBtn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  width: 38px;
  height: 38px;
  border-radius: var(--r-pill);
  background: var(--surface);
  border: 1px solid var(--hairline-strong);
  color: var(--brand);
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}
#helpBtn:hover {
  background: var(--brand);
  color: #ffffff;
  border-color: var(--brand);
  box-shadow: var(--shadow-lg);
  transform: translateY(-1px);
}
</style>
</head>

<body>

<!-- Help button — bottom right, matches all other pages -->
<a id="helpBtn"
   href="https://esherchurch.github.io/availability-form/uploaderinstructions.html"
   target="_blank"
   rel="noopener"
   aria-label="Open instructions">?</a>

<h2>Batch Music Importer</h2>

<div class="dropzone" id="dropzone">
  Drag files or a folder here
  <span class="dz-hint">…or use the buttons below. Only PDFs are picked up.</span>
  <span class="dz-buttons">
    <button type="button" id="pickFilesBtn">Choose Files</button>
    <button type="button" id="pickFolderBtn">Choose Folder</button>
  </span>
</div>

<!-- Hidden pickers: one for individual files, one for whole folders -->
<input type="file" id="fileInput" class="file-picker" multiple accept="application/pdf,.pdf">
<input type="file" id="folderInput" class="file-picker" multiple webkitdirectory directory>

<div id="status"></div>

<button class="btn-primary" onclick="processAll()">Upload</button>

<table>
<thead>
<tr>
<th>File</th>
<th>Title</th>
<th>Key</th>
<th>Type</th>
<th>Match</th>
<th>Confidence</th>
<th>YouTube</th>
<th>CCLI</th>
<th>Assist</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
  authDomain: "egbc-worship-planner.firebaseapp.com",
  projectId: "egbc-worship-planner",
  storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let songs = [];
let rows = [];

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// For a plain-text value placed inside a single-quoted JS string that itself lives in an HTML attribute (e.g. onclick="fn('...')").
function jsAttr(s){return escapeHtml(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));}

const KEYS = ["C","Cm","C#","C#m","Db","Dbm","D","Dm","Eb","Ebm","E","Em","F","Fm","F#","F#m","Gb","Gbm","G","Gm","Ab","Abm","A","Am","Bb","Bbm","B","Bm"];
const TYPES = ["Lead Sheet","Chord Sheet","Lyrics","Bass Tabs"];

async function loadSongs(){
  const snap = await db.collection("songs").get();
  songs = snap.docs.map(d => ({id:d.id,...d.data()}));
}

function getConfidence(matches){
  if(!matches || matches.length === 0) return "low";
  let top = matches[0];
  if(top.score >= 0.7) return "high";
  if(top.score >= 0.4) return "medium";
  return "low";
}

function detectKey(name){
  let lower = name.toLowerCase().replace(".pdf", "");
  const searchOrder = ["C#","Db","Eb","F#","Gb","Ab","Bb","C","D","E","F","G","A","B"];
  for (let k of searchOrder) {
    let regex = new RegExp(`\\b${k.replace('#', '\\#')}\\b| ${k.replace('#', '\\#')}$`, 'i');
    if (regex.test(lower)) { return k; }
  }
  for (let k of searchOrder) {
    if (lower.includes(k.toLowerCase())) { return k; }
  }
  return "";
}

function detectType(name){
  let lower = name.toLowerCase();
  if(lower.includes("chord")) return "Chord Sheet";
  if(lower.includes("lead")) return "Lead Sheet";
  if(lower.includes("lyric")) return "Lyrics";
  if(lower.includes("bass")) return "Bass Tabs";
  return "";
}

function cleanTitle(name){
  return name.toLowerCase()
    .replace(".pdf","")
    .replace(/\(.*?\)/g,"")
    .replace(/\bin [a-g](#|b)?m?\b/g,"")
    .replace(/\bkey [a-g](#|b)?m?\b/g,"")
    .replace(/\b(chord|lead|lyrics|bass|tab|sheet)\b/g,"")
    .replace(/\b[a-g](#|b)?m?\b/g,"")
    .replace(/[^a-z0-9 ]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function getMatches(title){
  const words = title.split(" ");
  return songs.map(s => {
    const sWords = s.title.toLowerCase().split(" ");
    let overlap = words.filter(w => sWords.includes(w));
    let score = sWords.length > 0 ? overlap.length / sWords.length : 0;
    return {song:s, score};
  })
  .sort((a,b)=>b.score-a.score)
  .slice(0,5);
}

function applyToGroup(index, field){
  let group = rows[index].group;
  let value = rows[index][field];
  rows.forEach(r=>{ if(r.group === group){ r[field] = value; } });
  render();
}

function openYouTubeSearch(title){
  window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(title)}`, '_blank');
}

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const folderInput = document.getElementById("folderInput");

function isPdf(f){ return f && /\.pdf$/i.test(f.name); }

// Buttons open the matching picker. stopPropagation so the dropzone click doesn't fire too.
document.getElementById("pickFilesBtn").addEventListener("click", e=>{ e.stopPropagation(); fileInput.click(); });
document.getElementById("pickFolderBtn").addEventListener("click", e=>{ e.stopPropagation(); folderInput.click(); });

// Clicking the dropzone itself opens the individual-file picker.
dropzone.addEventListener("click", ()=> fileInput.click());

function pickerChanged(e){
  const picked = Array.from(e.target.files || []).filter(isPdf);
  e.target.value = "";               // allow re-selecting the same files/folder
  if(!picked.length){
    document.getElementById("status").textContent = "No PDFs found in that selection.";
    return;
  }
  handleFiles(picked);
}

fileInput.addEventListener("change", pickerChanged);
folderInput.addEventListener("change", pickerChanged);

dropzone.addEventListener("dragover", e=>{ e.preventDefault(); dropzone.classList.add("dragover"); });
dropzone.addEventListener("dragleave", ()=> dropzone.classList.remove("dragover"));

dropzone.addEventListener("drop", async e=>{
  e.preventDefault();
  dropzone.classList.remove("dragover");
  let files = [];
  let promises = [];
  const items = e.dataTransfer.items ? Array.from(e.dataTransfer.items) : [];
  for(let item of items){
    let entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
    if (entry) { promises.push(traverse(entry, files)); }
  }
  await Promise.all(promises);

  // Fallback for browsers that don't expose directory entries
  if(!files.length && e.dataTransfer.files){
    files = Array.from(e.dataTransfer.files).filter(isPdf);
  }

  if(!files.length){
    document.getElementById("status").textContent = "No PDFs found in that drop.";
    return;
  }
  handleFiles(files);
});

async function traverse(entry, files){
  if(entry.isFile){
    return new Promise(res=>{
      entry.file(f=>{ if(isPdf(f)) files.push(f); res(); }, ()=>res());
    });
  } else if(entry.isDirectory){
    let reader = entry.createReader();
    return new Promise(async (resolve) => {
      let readEntries = async () => {
        reader.readEntries(async (entries) => {
          if (entries.length > 0) {
            for (let e of entries) { await traverse(e, files); }
            await readEntries();
          } else { resolve(); }
        });
      };
      await readEntries();
    });
  }
}

async function handleFiles(files){
  document.getElementById("status").textContent = "Loading song library…";
  await loadSongs();
  rows = files.map(file=>{
    let detectedKey = detectKey(file.name);
    let detectedType = detectType(file.name);
    let rawTitle = cleanTitle(file.name);
    let matches = getMatches(rawTitle);
    return {
      file, rawTitle,
      title: file.name.replace(/\.pdf$/i,""),
      key: detectedKey,
      type: detectedType,
      matches,
      match: matches[0]?.song || null,
      youtube: matches[0]?.song?.youtube || "",
      ccli: matches[0]?.song?.ccli || "",
      confidence: getConfidence(matches),
      group: cleanTitle(file.name),
      skip:false, force:false
    };
  });
  document.getElementById("status").textContent = rows.length + " PDF(s) ready.";
  render();
}

function getStatus(r){
  if(r.skip) return "SKIPPED";
  if(!r.key || !r.type) return "REVIEW";
  if(!r.match) return "NEW";
  let dup = (r.match.files||[]).find(f => f.key===r.key && f.type===r.type);
  if(dup && !r.force) return "EXISTS";
  return "NEW";
}

function render(){
  const tbody = document.getElementById("table");
  tbody.innerHTML = "";
  let lastGroup = null;
  rows.sort((a,b)=> a.group.localeCompare(b.group));
  rows.forEach((r,i)=>{
    if(r.group !== lastGroup){
      let groupRow = document.createElement("tr");
      groupRow.className = "group-row";
      let td = document.createElement("td");
      td.colSpan = 11;
      td.innerHTML = `${escapeHtml(r.group)}
        <button onclick="applyToGroup(${i}, 'title')">Apply Title</button>
        <button onclick="applyToGroup(${i}, 'match')">Apply Match</button>
        <button onclick="applyToGroup(${i}, 'youtube')">Apply YouTube</button>
        <button onclick="applyToGroup(${i}, 'ccli')">Apply CCLI</button>`;
      groupRow.appendChild(td);
      tbody.appendChild(groupRow);
      lastGroup = r.group;
    }

    let status = getStatus(r);
    let tr = document.createElement("tr");
    tr.className = "status-"+status.toLowerCase();
    tr.innerHTML = `
      <td>${escapeHtml(r.file.name)}</td>
      <td><input value="${escapeHtml(r.title)}"></td>
      <td>
        <select>
          <option value="">Key</option>
          ${KEYS.map(k=>`<option ${r.key===k?"selected":""}>${k}</option>`).join("")}
        </select>
      </td>
      <td>
        <select>
          <option value="">Type</option>
          ${TYPES.map(t=>`<option ${r.type===t?"selected":""}>${t}</option>`).join("")}
        </select>
      </td>
      <td>
        <select>
          <option value="">— New Song —</option>
          ${r.matches.map(m=>`<option value="${escapeHtml(m.song.id)}" ${r.match?.id===m.song.id?"selected":""}>${escapeHtml(m.song.title)}</option>`).join("")}
        </select>
      </td>
      <td class="conf-${r.confidence}">${r.confidence}</td>
      <td><input value="${escapeHtml(r.youtube)}"></td>
      <td><input value="${escapeHtml(r.ccli)}"></td>
      <td>
        <button onclick="openYouTubeSearch('${jsAttr(r.title)}')">Find YouTube</button>
        <button onclick="window.open('https://songselect.ccli.com/search/results?query=${encodeURIComponent(r.title)}')">Search CCLI</button>
      </td>
      <td>${status}</td>
      <td>
        <button onclick="rows[${i}].skip=!rows[${i}].skip; render()">${r.skip ? 'Undo' : 'Skip'}</button>
        <button onclick="rows[${i}].force=true; render()">Force</button>
      </td>
    `;
    tbody.appendChild(tr);

    const inputs = tr.querySelectorAll("input, select");
    inputs[0].onchange = e => { r.title=e.target.value; render(); };
    inputs[1].onchange = e => { r.key=e.target.value; render(); };
    inputs[2].onchange = e => { r.type=e.target.value; render(); };
    inputs[3].onchange = e => {
      if(!e.target.value){ r.match = null; }
      else {
        let m = r.matches.find(x=>x.song.id===e.target.value);
        r.match = m.song;
        r.youtube = m.song.youtube || "";
        r.ccli = m.song.ccli || "";
      }
      render();
    };
    inputs[4].onchange = e => { r.youtube=e.target.value; };
    inputs[5].onchange = e => { r.ccli=e.target.value; };
  });
}

async function processAll(){
  if(!rows.length){ alert("Nothing to upload — choose some PDFs first."); return; }
  if(!confirm("Upload?")) return;
  let succeeded = [], failed = [];
  for(const r of rows){
    let status = getStatus(r);
    if(status==="SKIPPED" || status==="EXISTS") continue;
    if(status==="REVIEW"){ alert("Fix: "+r.file.name); return; }

    try {
      let finalTitle = r.match ? r.match.title : r.title;
      // Match the reader's id scheme (SundayServicePlanner.html): title.toLowerCase().replace(/\s+/g,"-")
      // plus sanitizing "/" and "\" which are illegal in Firestore doc ids / Storage paths.
      let id = finalTitle.toLowerCase().replace(/[\\/]/g,"-").replace(/\s+/g,"-");

      const ref = storage.ref(`songs/${id}/${r.file.name}`);
      await ref.put(r.file);
      const url = await ref.getDownloadURL();

      const docRef = db.collection("songs").doc(id);
      const snap = await docRef.get();
      let data = snap.exists ? snap.data() : {};
      let files = data.files || [];
      files.push({ name:r.file.name, url, type:r.type, key:r.key });

      await docRef.set({
        title: finalTitle,
        normalized: finalTitle.toLowerCase(),
        youtube: r.youtube,
        ccli: r.ccli,
        files
      },{merge:true});
      succeeded.push(r.file.name);
    } catch(err){
      failed.push(r.file.name + " — " + (err && err.message ? err.message : err));
    }
  }
  if(failed.length){
    alert("Upload finished.\nSucceeded: " + succeeded.length + "\nFailed: " + failed.length + "\n\n" + failed.join("\n"));
  } else {
    alert("Upload complete — " + succeeded.length + " file(s) uploaded.");
  }
}

</script>
</body>
</html>
