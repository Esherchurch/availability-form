<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sermons</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610082145" data-title="Sermons"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-guard.js?v=202610062100"></script>
<script src="egbc-events.js?v=202610091400"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px calc(72px + env(safe-area-inset-bottom))}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  h2{font-weight:600}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:16px;margin-bottom:14px}
  .card h2{font-size:16px;font-weight:600;color:var(--ink);margin:0 0 8px}
  label.l{display:block;font-size:14px;font-weight:500;color:var(--ink);margin:10px 0 5px}
  .inp,select,textarea{min-height:48px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font:400 15px Inter,sans-serif;color:var(--ink);background:#fff;width:100%}
  textarea{padding:10px 12px;min-height:80px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  @media (max-width:480px){.two{grid-template-columns:1fr}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:10px;font:600 15px Inter,sans-serif;
       cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff;text-decoration:none}
  .btn:disabled{opacity:.55}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .acts .btn.small{min-height:40px;font-size:14px;padding:0 12px}
  .srm{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
  .srm:first-child{border-top:none}
  .srm .t{flex:1;min-width:0}.srm .t b{color:var(--ink)}
  .pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.draft{background:var(--gold-bg);color:var(--gold)}.pill.no{background:var(--danger-bg);color:var(--danger)}.pill.feed{background:var(--tint);color:var(--brand)}
  .hint{font-size:13px;color:var(--muted)}
  .st{border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}.st.ok{background:var(--ok-bg);color:var(--ok)}.st.no{background:var(--danger-bg);color:var(--danger)}.st.warn{background:var(--gold-bg);color:var(--gold)}
  progress{width:100%;height:10px;margin-top:8px}
  details summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:40px;display:flex;align-items:center}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sermons</h1>
  <p class="sub">Sunday's sermons come in from Val's podcast on Spotify by themselves. Add the series and the Bible passage here.</p>
  <div id="main"><div class="card hint">Loading…</div></div>
</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  /* MARTIN'S OPTION 3 (F-138). Val keeps uploading to Spotify for Creators.
     Every hour the function sermonFeedSync (codebase "hub") reads the
     show's feed - its address is set below - and adds or refreshes one
     sermon per episode, never two. Audio plays from the feed's own address.

     WHAT THIS PAGE DOES:
       - a feed episode: add its series, Bible book and passage, and speaker,
         or hide it. Its title, words and audio are the feed's, refreshed on
         every read; the rules let nobody change them here;
       - the backup way: upload a sermon by hand (its audio in the hub);
       - the feed's address, and what the last read found;
       - series; and (master admins) who may do all this.
     The rules enforce every part of it. Nothing is deleted: hide instead. */
  var E = window.EGBCEvents, esc = E.esc;
  var BOOKS = ['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles',
    'Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Songs','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos',
    'Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians',
    '2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews',
    'James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];
  var ME = {}, MASTER = false, MAY = false, SERMONS = [], SERIES = [], FEEDSET = null, STATUS = null, ACCESS = { memberIds: [] }, PEOPLE = {}, EDIT = null, BUSY = false;
  function db() { return EGBCAuth.db; }
  function st() { return EGBCAuth.storage(); }
  function uid() { return (EGBCAuth.user() || {}).uid || ''; }
  function now() { return firebase.firestore.FieldValue.serverTimestamp(); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 4000); }
  function all(s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }
  function $(id) { return document.getElementById(id); }
  function val(id) { var e = $(id); return e ? String(e.value || '').trim() : ''; }
  function seriesMap() { var m = {}; SERIES.forEach(function (s) { m[s.id] = s; }); return m; }
  function lastSunday() { var d = new Date(); d.setDate(d.getDate() - d.getDay()); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function mins(sec) { return sec ? Math.round(sec / 60) + ' min' : ''; }
  function isFeed(s) { return s && s.source === 'feed'; }
  function audioType(file) {
    if (file.type && /^audio\//.test(file.type)) return file.type;
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    return { mp3: 'audio/mpeg', m4a: 'audio/x-m4a', mp4: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav' }[ext] || '';
  }
  /* How long it is, read from the file itself before it goes up. */
  function measure(file) {
    return new Promise(function (resolve) {
      var a = new Audio(), u = URL.createObjectURL(file), done = false;
      function end(v) { if (done) return; done = true; URL.revokeObjectURL(u); resolve(v); }
      a.preload = 'metadata';
      a.onloadedmetadata = function () { end(isFinite(a.duration) ? Math.round(a.duration) : 0); };
      a.onerror = function () { end(0); };
      setTimeout(function () { end(0); }, 15000);
      a.src = u;
    });
  }
  /* Every write carries who and when (the rules check both). */
  function stamp(o) { o.updatedAt = now(); o.updatedBy = uid(); return o; }
  function when(ts) { var d = ts && ts.toDate ? ts.toDate() : ts ? new Date(ts) : null; return d && !isNaN(d) ? E.fmtDateShort(d.toISOString()) + ' ' + E.fmtTime(d.toISOString()) : ''; }

  /* ---------------- drawing ---------------- */

  function draw() {
    if (!MAY) {
      $('main').innerHTML = '<div class="card"><h2>Only the people named can look after sermons</h2><p>A master admin names who adds the series and passages. Ask the office if it should be you.</p></div>';
      return;
    }
    $('main').innerHTML = formCard() +
      '<div class="card" id="list"><h2>Sermons</h2>' + (SERMONS.length ? SERMONS.map(row).join('') : '<p class="hint">None yet. They arrive from Val\'s podcast once its address is set (below).</p>') + '</div>' +
      seriesCard() + feedCard() + (MASTER ? accessCard() : '');
    wire();
  }

  /* A feed episode: the hub's part only. An upload (the backup way): all of it. */
  function formCard() {
    var s = EDIT || {}, feed = isFeed(EDIT);
    var speakers = {}; SERMONS.forEach(function (x) { if (x.speaker) speakers[x.speaker] = 1; });
    var hubPart =
      '<div class="two"><div><label class="l" for="f-speaker">Speaker</label><input class="inp" id="f-speaker" maxlength="120" list="f-speakers" value="' + esc(s.speaker || '') + '">' +
        '<datalist id="f-speakers">' + Object.keys(speakers).sort().map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist></div>' +
      (feed ? '' : '<div><label class="l" for="f-date">Date</label><input class="inp" id="f-date" type="date" value="' + esc(s.date || lastSunday()) + '"></div>') + '</div>' +
      '<label class="l" for="f-series">Series</label><select id="f-series"><option value="">Not part of a series</option>' +
        SERIES.map(function (x) { return '<option value="' + esc(x.id) + '"' + (s.seriesId === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select>' +
      '<div class="two"><div><label class="l" for="f-book">Bible book</label><select id="f-book"><option value="">None</option>' +
        BOOKS.map(function (b) { return '<option' + (s.book === b ? ' selected' : '') + '>' + esc(b) + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="l" for="f-passage">Passage</label><input class="inp" id="f-passage" maxlength="120" value="' + esc(s.passage || '') + '" placeholder="e.g. 1:1-11"></div></div>';
    if (feed) {
      return '<div class="card" id="add"><h2>“' + esc(s.title) + '”</h2>' +
        '<p class="st ok">From Val\'s podcast. Its title, words and recording come from Spotify and stay as they are there; add the rest here. Nothing you add is lost when the podcast is read again.</p>' +
        hubPart +
        '<label style="display:flex;gap:8px;align-items:center;margin-top:10px;min-height:40px"><input type="checkbox" id="f-pub"' + (s.published ? ' checked' : '') + '> Show it in the app</label>' +
        '<div id="f-err"></div><div class="acts"><button class="btn" id="f-go">Save</button><button class="btn sec" id="f-cancel">Cancel</button></div></div>';
    }
    return '<details class="card" id="add"' + (EDIT ? ' open' : '') + '><summary>' + (EDIT ? 'Change “' + esc(s.title) + '”' : '+ Upload a sermon by hand (if one is not on the podcast)') + '</summary>' +
      '<label class="l" for="f-file">' + (EDIT ? 'New audio (only if it needs replacing)' : 'The recording') + '</label>' +
      '<input class="inp" id="f-file" type="file" accept="audio/mpeg,audio/mp4,audio/x-m4a,audio/aac,audio/wav,.mp3,.m4a,.wav" style="padding:10px">' +
      '<p class="hint">An MP3 is best: it plays everywhere. Up to 300 MB. This is the backup way; sermons on Val\'s podcast arrive by themselves.</p>' +
      '<label class="l" for="f-title">Title</label><input class="inp" id="f-title" maxlength="200" value="' + esc(s.title || '') + '" placeholder="e.g. Ask boldly, plan wisely">' +
      hubPart +
      '<label class="l" for="f-notes">Notes (optional)</label><textarea id="f-notes" maxlength="4000">' + esc(s.description || '') + '</textarea>' +
      '<label style="display:flex;gap:8px;align-items:center;margin-top:10px;min-height:40px"><input type="checkbox" id="f-pub"' + (EDIT ? (s.published ? ' checked' : '') : ' checked') + '> Show it in the app</label>' +
      '<div id="f-err"></div><progress id="f-prog" max="100" value="0" style="display:none"></progress>' +
      '<div class="acts"><button class="btn" id="f-go">' + (EDIT ? 'Save' : 'Upload') + '</button>' + (EDIT ? '<button class="btn sec" id="f-cancel">Cancel</button>' : '') + '</div></details>';
  }

  function state(s) {
    if (!isFeed(s) && (!s.audioPath || !s.audioSize)) return '<span class="pill no">Needs its audio</span>';
    return s.published ? '<span class="pill ok">Shown</span>' : '<span class="pill draft">Hidden</span>';
  }
  function row(s) {
    var ser = s.seriesId ? seriesMap()[s.seriesId] : null, feed = isFeed(s);
    var needs = feed && (!s.seriesId && !s.book) ? ' · <b>add its series or passage</b>' : '';
    return '<div class="srm" data-srm="' + esc(s.id) + '"><div class="t"><b>' + esc(s.title) + '</b> ' + state(s) + (feed ? ' <span class="pill feed">From Spotify</span>' : ' <span class="pill feed">Uploaded here</span>') + '<br>' +
      '<span class="hint">' + esc([E.fmtDateShort(s.date + 'T12:00'), s.speaker, s.book ? s.book + (s.passage ? ' ' + s.passage : '') : '', ser ? ser.name : '', mins(s.durationSec)].filter(Boolean).join(' · ')) + '</span>' +
      '<span class="hint">' + needs + '</span>' +
      '<div class="acts"><button class="btn sec small" data-edit="' + esc(s.id) + '">' + (feed ? 'Add series and passage' : s.audioPath ? 'Change' : 'Add its audio') + '</button>' +
      (feed || (s.audioPath && s.audioSize) ? (s.published ? '<button class="btn sec small" data-unpub="' + esc(s.id) + '">Hide</button>' : '<button class="btn small" data-pub="' + esc(s.id) + '">Show</button>') : '') +
      '</div></div></div>';
  }

  function seriesCard() {
    return '<div class="card" id="series"><h2>Series</h2>' +
      (SERIES.length ? SERIES.map(function (x) {
        var n = SERMONS.filter(function (s) { return s.seriesId === x.id; }).length;
        return '<div class="srm"><div class="t"><b>' + esc(x.name) + '</b><br><span class="hint">' + n + ' sermon' + (n === 1 ? '' : 's') + (x.artworkPath ? ' · has a picture' : '') + '</span></div></div>';
      }).join('') : '<p class="hint">No series yet.</p>') +
      '<details><summary>+ Add a series</summary>' +
      '<label class="l" for="ns-name">Name</label><input class="inp" id="ns-name" maxlength="120" placeholder="e.g. Nehemiah: rebuilding what matters">' +
      '<label class="l" for="ns-desc">A line about it (optional)</label><input class="inp" id="ns-desc" maxlength="2000">' +
      '<label class="l" for="ns-art">A square picture (optional, JPEG or PNG)</label><input class="inp" id="ns-art" type="file" accept="image/jpeg,image/png" style="padding:10px">' +
      '<div class="acts"><button class="btn" id="ns-go">Add the series</button></div></details></div>';
  }

  /* The feed's address, and what the last read found. */
  function feedCard() {
    var u = (FEEDSET && FEEDSET.url) || '', s = STATUS;
    var said = !u ? '<p class="st warn" id="feed-state">No address yet, so nothing comes in. Val finds it in Spotify for Creators, under Settings, as the RSS feed.</p>'
      : !s ? '<p class="st warn" id="feed-state">Saved. The podcast is read every hour; the first read has not happened yet.</p>'
      : s.ok ? '<p class="st ok" id="feed-state">Last read ' + esc(when(s.lastReadAt)) + ': ' + (s.episodes || 0) + ' episode' + (s.episodes === 1 ? '' : 's') + (s.showTitle ? ' of “' + esc(s.showTitle) + '”' : '') +
          (s.created ? ', ' + s.created + ' new' : '') + '.</p>'
      : '<p class="st no" id="feed-state">The last read, ' + esc(when(s.lastReadAt)) + ', did not work: ' + esc(s.error || 'no reason given') + ' Check the address.</p>';
    return '<div class="card" id="feed"><h2>Val\'s podcast</h2><p class="hint" style="margin:0 0 6px">New episodes come in by themselves within the hour, and play from Spotify\'s own recordings. Nothing on Spotify changes.</p>' + said +
      '<label class="l" for="fd-url">The podcast\'s RSS address</label><input class="inp" id="fd-url" maxlength="500" placeholder="https://anchor.fm/s/…/podcast/rss" value="' + esc(u) + '">' +
      '<div class="acts"><button class="btn" id="fd-go">Save the address</button></div></div>';
  }

  function accessCard() {
    var names = Object.keys(PEOPLE).map(function (k) { return { id: k, name: PEOPLE[k] }; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    return '<div class="card" id="access"><h2>Who can look after sermons</h2><p class="hint">Master admins always can. Add anyone else, such as Val. (A "Sermons" tick in the address book will replace this list.)</p>' +
      ((ACCESS.memberIds || []).length ? (ACCESS.memberIds || []).map(function (m) {
        return '<div class="srm"><div class="t"><b>' + esc(PEOPLE[m] || m) + '</b></div><button class="btn sec small" data-unname="' + esc(m) + '" style="min-height:40px">Remove</button></div>';
      }).join('') : '<p class="hint">Nobody else yet.</p>') +
      '<label class="l" for="ac-who">Add someone</label><input class="inp" id="ac-who" list="ac-people" placeholder="Start typing a name">' +
      '<datalist id="ac-people">' + names.map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join('') + '</datalist>' +
      '<div class="acts"><button class="btn" id="ac-go">Add</button></div></div>';
  }

  function wire() {
    $('f-go').onclick = save;
    if ($('f-cancel')) $('f-cancel').onclick = function () { EDIT = null; draw(); };
    document.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { EDIT = SERMONS.filter(function (s) { return s.id === b.dataset.edit; })[0] || null; draw(); $('add').scrollIntoView(); }; });
    document.querySelectorAll('[data-pub]').forEach(function (b) { b.onclick = function () { setPub(b.dataset.pub, true, b); }; });
    document.querySelectorAll('[data-unpub]').forEach(function (b) { b.onclick = function () { setPub(b.dataset.unpub, false, b); }; });
    $('ns-go').onclick = addSeries;
    $('fd-go').onclick = saveFeed;
    if ($('ac-go')) $('ac-go').onclick = addPerson;
    document.querySelectorAll('[data-unname]').forEach(function (b) { b.onclick = function () { setAccess((ACCESS.memberIds || []).filter(function (m) { return m !== b.dataset.unname; })); }; });
  }

  /* ---------------- a sermon ---------------- */

  function hubFields() {
    return { speaker: val('f-speaker').slice(0, 120), seriesId: val('f-series'), book: val('f-book'), passage: val('f-passage').slice(0, 120) };
  }
  function save() {
    if (BUSY) return;
    if (isFeed(EDIT)) return saveFeedEpisode();
    var file = ($('f-file').files || [])[0], err = $('f-err'), title = val('f-title'), date = val('f-date');
    err.innerHTML = '';
    if (!title || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { err.innerHTML = '<p class="st no">Give it a title and a date.</p>'; return; }
    if (!EDIT && !file) { err.innerHTML = '<p class="st no">Choose the recording.</p>'; return; }
    var type = file ? audioType(file) : '';
    if (file && !type) { err.innerHTML = '<p class="st no">That file is not a recording this can play. Use an MP3.</p>'; return; }
    if (file && file.size >= 300 * 1024 * 1024) { err.innerHTML = '<p class="st no">That file is over 300 MB. Save it as an MP3 first.</p>'; return; }
    var id = EDIT ? EDIT.id : 'srm_' + E.key(12), ref = db().collection('sermons').doc(id), pub = $('f-pub').checked;
    var base = Object.assign({ title: title.slice(0, 200), date: date, description: val('f-notes').slice(0, 4000) }, hubFields());
    BUSY = true; $('f-go').disabled = true;
    var first = EDIT ? Promise.resolve() : ref.set(stamp(Object.assign({}, base, { audioPath: '', audioType: '', audioSize: 0, durationSec: 0, audioUrl: '', published: false,
      guid: 'egbc-sermon-' + id, source: 'upload', createdAt: now(), createdBy: uid() })));
    first.then(function () {
      if (!file) return null;
      return measure(file).then(function (secs) {
        var prog = $('f-prog'); prog.style.display = '';
        var task = st().ref('sermons/' + id + '/audio').put(file, { contentType: type });
        task.on('state_changed', function (s) { prog.value = s.totalBytes ? Math.round(100 * s.bytesTransferred / s.totalBytes) : 0; });
        return task.then(function () { return { audioPath: 'sermons/' + id + '/audio', audioType: type, audioSize: file.size, durationSec: secs }; });
      });
    }).then(function (audio) {
      var has = audio || (EDIT ? { audioPath: EDIT.audioPath, audioType: EDIT.audioType, audioSize: EDIT.audioSize, durationSec: EDIT.durationSec } : {});
      var ok = has.audioPath && has.audioSize > 0 && has.durationSec > 0;
      return ref.update(stamp(Object.assign({}, base, audio || {}, { published: !!(pub && ok) }))).then(function () { return { pub: pub, ok: ok }; });
    }).then(function (r) {
      toast(r.pub && !r.ok ? 'Saved, but not shown: the recording\'s length could not be read. Try the MP3 again.' : r.pub ? 'Shown in the app.' : 'Saved. Hidden for now.');
      EDIT = null; BUSY = false; return load();
    }).catch(function (e) {
      BUSY = false; $('f-go').disabled = false;
      err.innerHTML = '<p class="st no">Could not save it: ' + esc(e.message || e) + (EDIT ? '' : ' It is kept, hidden; use “Add its audio” to try again.') + '</p>';
      if (!EDIT) load();
    });
  }
  /* A feed episode: only the hub's own fields (the rules allow no more). */
  function saveFeedEpisode() {
    BUSY = true; $('f-go').disabled = true;
    db().collection('sermons').doc(EDIT.id).update(stamp(Object.assign(hubFields(), { published: $('f-pub').checked }))).then(function () {
      toast('Saved. It stays when the podcast is read again.'); EDIT = null; BUSY = false; return load();
    }).catch(function (e) { BUSY = false; $('f-go').disabled = false; $('f-err').innerHTML = '<p class="st no">Could not save it: ' + esc(e.message || e) + '</p>'; });
  }
  function setPub(id, on, btn) {
    btn.disabled = true;
    db().collection('sermons').doc(id).update(stamp({ published: on })).then(function () { toast(on ? 'Shown in the app' : 'Hidden. It stays hidden when the podcast is read again.'); return load(); })
      .catch(function (e) { btn.disabled = false; toast('Could not: ' + (e.message || e)); });
  }

  /* ---------------- series ---------------- */

  function addSeries() {
    var name = val('ns-name'), file = ($('ns-art').files || [])[0];
    if (!name) { toast('Give the series a name'); return; }
    var id = 'ser_' + E.key(10), ref = db().collection('sermonSeries').doc(id);
    $('ns-go').disabled = true;
    ref.set(stamp({ name: name.slice(0, 120), description: val('ns-desc').slice(0, 2000), artworkPath: '', order: SERIES.length + 1 })).then(function () {
      if (!file) return;
      return st().ref('sermonSeries/' + id + '/artwork').put(file, { contentType: file.type || 'image/jpeg' })
        .then(function () { return ref.update(stamp({ artworkPath: 'sermonSeries/' + id + '/artwork' })); });
    }).then(function () { toast('Series added'); return load(); }).catch(function (e) { $('ns-go').disabled = false; toast('Could not: ' + (e.message || e)); });
  }

  /* ---------------- the feed's address ---------------- */

  function saveFeed() {
    var u = val('fd-url');
    if (u && !/^https:\/\/\S+$/.test(u)) { toast('The address starts https:// and has no spaces'); return; }
    $('fd-go').disabled = true;
    db().collection('sermonShow').doc('feed').set({ url: u.slice(0, 500), updatedAt: now(), updatedBy: uid() })
      .then(function () { toast(u ? 'Saved. Episodes come in within the hour.' : 'Cleared. Nothing new comes in.'); return load(); })
      .catch(function (e) { $('fd-go').disabled = false; toast('Could not: ' + (e.message || e)); });
  }

  /* ---------------- who may look after sermons (master admins) ---------------- */

  function addPerson() {
    var name = val('ac-who'), id = Object.keys(PEOPLE).filter(function (k) { return PEOPLE[k] === name; })[0];
    if (!id) { toast('Choose someone from the list'); return; }
    var ids = (ACCESS.memberIds || []).slice(); if (ids.indexOf(id) < 0) ids.push(id);
    setAccess(ids);
  }
  function setAccess(ids) {
    db().collection('sermonShow').doc('access').set({ memberIds: ids, updatedAt: now(), updatedBy: uid() })
      .then(function () { ACCESS = { memberIds: ids }; toast('Saved'); return load(); }).catch(function (e) { toast('Could not: ' + (e.message || e)); });
  }

  /* ---------------- loading ---------------- */

  function load() {
    return Promise.all([
      db().collection('sermons').get(),
      db().collection('sermonSeries').get(),
      db().collection('sermonShow').doc('feed').get().catch(function () { return null; }),
      db().collection('sermonShow').doc('feedStatus').get().catch(function () { return null; })
    ]).then(function (r) {
      SERMONS = all(r[0]).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || String(a.title).localeCompare(String(b.title)); });
      SERIES = all(r[1]).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      FEEDSET = r[2] && r[2].exists ? r[2].data() : null;
      STATUS = r[3] && r[3].exists ? r[3].data() : null;
      draw();
    });
  }

  EGBCAuth.require().then(function (profile) {
    ME = profile || {};
    MASTER = !!(EGBCAuth.isMaster && EGBCAuth.isMaster());
    return db().collection('sermonShow').doc('access').get().then(function (d) { ACCESS = d.exists ? d.data() : { memberIds: [] }; }, function () { ACCESS = { memberIds: [] }; });
  }).then(function () {
    MAY = MASTER || (ACCESS.memberIds || []).indexOf(ME.memberId) >= 0;
    if (!MAY) { draw(); return; }
    return (MASTER ? db().collection('addressBook').get().then(function (s) {
      s.docs.forEach(function (d) { var x = d.data(); if (x.name && !x.archived) PEOPLE[d.id] = x.name; });
    }).catch(function () {}) : Promise.resolve()).then(load);
  }).catch(function (e) { $('main').innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
})();
</script>
</body>
</html>
