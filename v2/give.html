<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Give</title>

<!-- SIGNED IN ONLY, and that is the rules' decision, not this page's.
     churchSettings/giving is readable only once you have signed in: the
     bank details are not a secret - they are on the giving envelopes -
     but an account number on a world-readable page is an invitation to
     a convincing fake. So the guard asks for an account, and the page
     says plainly what it would say if the read were refused anyway. -->
<script src="egbc-nosend.js?v=202610212000"></script>
<script src="egbc-appmode.js?v=202610201500"></script>
<script src="egbc-shell.js?v=202610292200" data-title="Give"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610292200"></script>
<script src="egbc-church.js?v=202610192330"></script>
<script src="egbc-guard.js?v=202610282000" data-feature="payments"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);
        padding:16px;margin-bottom:12px}
  /* NOTHING IN HERE MAY BE WIDER THAN THE PHONE. An account name is as
     long as the bank made it, and a Gift Aid link is a URL with no
     spaces in it, which is the exact thing that pushed the hub's
     notices off a 375px screen. */
  .card,.card *{min-width:0;max-width:100%}
  .lbl{font-size:12.5px;color:var(--muted)}
  .val{font-weight:600;color:var(--ink);font-size:18px;margin:2px 0 0;
       font-variant-numeric:tabular-nums;word-break:break-word}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;
       padding:0 14px;border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;
       border:1px solid var(--line-2);background:#fff;color:var(--ink);margin-top:10px}
  .btn:hover{background:var(--tint)}
  .note{font-size:13px;color:var(--muted)}
  .note a{color:var(--brand)}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);
         color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Give</h1>
  <p class="sub">Thank you. You can set up a standing order with your bank, or send a one-off gift, using these details.</p>
  <div id="body"><p class="note">Getting the details…</p></div>
</div>
<div id="toast"></div>
<script>
(function () {
  'use strict';

  var COPY = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<rect width="14" height="14" x="8" y="8" rx="2"/>'
    + '<path d="M16 4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></svg>';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function toast(m) {
    var t = document.getElementById('toast');
    t.textContent = m; t.style.display = 'block';
    clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3000);
  }

  /* The same three details and the same order as the app's Give sheet,
     so somebody reading one and then the other is not comparing two
     different-looking lists of the same numbers. */
  var LINES = [
    ['accountName', 'Account name'],
    ['sortCode', 'Sort code'],
    ['accountNumber', 'Account number']
  ];

  var G = null;

  function line(key, label, value) {
    return '<div class="card">'
      + '<div class="lbl">' + esc(label) + '</div>'
      + '<div class="val" id="v-' + esc(key) + '">' + esc(value) + '</div>'
      + '<button class="btn" data-copy="' + esc(key) + '">' + COPY + ' Copy</button>'
      + '</div>';
  }

  function draw() {
    var el = document.getElementById('body');
    if (!G) {
      el.innerHTML = '<p class="note">Could not get the giving details just now. '
        + 'Please try again in a moment.</p>';
      return;
    }
    if (!EGBCChurch.givingReady()) {
      el.innerHTML = '<p class="note">The bank details are not up yet. The church office is '
        + 'setting them, and they will appear here.</p>';
      return;
    }
    var html = LINES.map(function (r) {
      return G[r[0]] ? line(r[0], r[1], G[r[0]]) : '';
    }).join('');
    if (G.reference) html += line('reference', 'Put this as the reference', G.reference);
    if (G.note) html += '<p class="note">' + esc(G.note) + '</p>';
    if (G.giftAid) {
      html += '<p class="note">If you pay UK tax, Gift Aid adds 25p to every pound you give, '
        + 'at no cost to you.'
        + (G.giftAidUrl
            ? ' <a href="' + esc(G.giftAidUrl) + '" target="_blank" rel="noopener">'
              + 'Fill in the Gift Aid form</a>.'
            : ' Ask the church office for a Gift Aid form.')
        + '</p>';
    }
    el.innerHTML = html;
    regularly(el);
  }

  /* "GIVE REGULARLY BY DIRECT DEBIT" (the events window's give-regularly.html,
     F-168 payments): shown when the church takes Direct Debits
     (paymentSettings/public.bank). Asked once; nothing shown until it says
     yes, and nothing if it cannot be read. */
  var DD = null;
  function regularly(el) {
    var put = function () {
      if (DD !== true || document.getElementById('dd-link')) return;
      var p = document.createElement('p');
      p.className = 'note'; p.id = 'dd-link';
      p.innerHTML = '<a href="give-regularly.html">Give regularly by Direct Debit</a>';
      el.appendChild(p);
    };
    if (DD !== null) { put(); return; }
    DD = false;
    EGBCAuth.db.collection('paymentSettings').doc('public').get().then(function (s) {
      DD = !!(s.exists && s.data().bank === true); put();
    }, function () { DD = false; });
  }

  /* The value is read back out of the drawn element, so the clipboard
     gets exactly what the page shows and the two can never drift. */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-copy]');
    if (!b) return;
    var el = document.getElementById('v-' + b.dataset.copy);
    var val = el ? el.textContent.trim() : '';
    if (!val) { toast('Nothing to copy yet.'); return; }
    (navigator.clipboard && navigator.clipboard.writeText
      ? navigator.clipboard.writeText(val) : Promise.reject())
      .then(function () { toast('Copied.'); },
            function () { toast('Could not copy it. You can type it in instead.'); });
  });

  EGBCAuth.require().then(function () {
    return EGBCChurch.giving();
  }).then(function (g) { G = g; draw(); })
    .catch(function () { G = null; draw(); });
})();
</script>
</body>
</html>
