<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunday check-in</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610082145" data-title="Sunday check-in"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-church.js?v=202610101000"></script>
<script src="egbc-guard.js?v=202610062100"></script>
<script src="egbc-email.js?v=202610081729"></script>

<script src="egbc-events-forms.js?v=202610081500"></script>
<script src="egbc-events-kids.js?v=202610091800"></script>
<script src="egbc-notify-core.js?v=202610111300"></script>
<script src="egbc-notify.js?v=202610111300"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 8px}
  label.l{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select,textarea{border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff;width:100%}
  .inp,select{height:40px} textarea{padding:8px 12px;min-height:60px}
  .big{height:52px;font-size:18px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;font:500 13px Inter,sans-serif;
       cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--brand-dark)} .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)} .btn.sec:hover{background:#f3f4f6}
  .btn.tall{height:48px;font-size:16px;padding:0 20px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font:500 13px Inter,sans-serif;color:var(--body);cursor:pointer}
  .tab.on{background:var(--tint);border-color:var(--brand);color:var(--ink)}
  .hint{font-size:13px;color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.row .f{min-width:160px;flex:1}
  .kid{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
  .kid:first-child{border-top:none}.kid .t{flex:1;min-width:180px}.kid .t b{color:var(--ink)}
  .kid input[type=checkbox]{width:24px;height:24px}
  .pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;margin:2px 4px 2px 0;background:#f3f4f6}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.wait{background:var(--gold-bg);color:var(--gold)}.pill.no{background:var(--danger-bg);color:var(--danger)}
  .st{border-radius:8px;padding:10px 12px;font-size:13px;margin:8px 0}
  .st.ok{background:var(--ok-bg);color:var(--ok)}.st.wait{background:var(--gold-bg);color:var(--gold)}.st.no{background:var(--danger-bg);color:var(--danger)}
  dl{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin:8px 0;font-size:13px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
  .two{display:flex;gap:10px;flex-wrap:wrap}.two>div{flex:1;min-width:140px}
  .ck{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}
  .ck input{margin-top:3px}
  .count{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .count div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
  .count b{display:block;font-size:22px;color:var(--ink)}
  video{width:100%;max-width:420px;border-radius:10px;background:#000;display:block;margin:8px 0}
  /* labels: one per child, and the parent's slip */
  #labels{display:flex;flex-wrap:wrap;gap:10px}
  .label{width:260px;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:#fff}
  .label .n{font-size:20px;font-weight:700;color:var(--ink);line-height:1.2}
  .label .g{font-size:13px;color:var(--body)}
  .label .code{font:700 22px ui-monospace,Menlo,monospace;letter-spacing:3px;color:var(--ink);margin-top:6px}
  .label .flag{display:inline-block;background:var(--danger);color:#fff;font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px;margin-top:6px}
  .label.slip{border-style:dashed}
  .label .qr{width:110px;height:110px;margin-top:6px}
  table.reg{border-collapse:collapse;font-size:13px;min-width:100%}
  table.reg th,table.reg td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
  table.reg th:first-child,table.reg td:first-child{text-align:left}
  table.reg tr.tot td{font-weight:600;background:var(--tint)}
  .scroll{overflow-x:auto}
  .rname{background:none;border:none;padding:0;font:600 14px Inter,sans-serif;color:var(--brand);cursor:pointer;text-decoration:underline}
  .page-call{font-size:22px;font-weight:700;color:var(--ink)}
  #back{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:80;overflow:auto}
  #modal{background:#fff;border-radius:14px;max-width:480px;width:100%;padding:18px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none;max-width:90vw}
  @media print{
    body{background:#fff}
    body *{visibility:hidden}
    #labels,#labels *,#roll,#roll *{visibility:visible}
    #labels,#roll{position:absolute;left:0;top:0;width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sunday check-in</h1>
  <p class="sub">Children into their groups, labels with a collection code, and home again only with someone on their list or with that code.</p>
  <div id="main"><div class="card hint">Loading…</div></div>
</div>
<div id="back"><div id="modal"></div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  /* NEED TO KNOW (Martin, F-087), as the rules enforce it:
     the LEADS (master admins, the safeguarding lead and deputy, admins of
     the children's teams) run the desk and see every group; a GROUP'S
     LEADERS see and check in their own group's children, and nothing else.
     This is E1's check-in (the checkins collection), a session per group
     per day; nothing here is a second check-in. */
  var K = window.EGBCKids, C = window.EGBCCheckin, F = window.EGBCForms, E = window.EGBCEvents, QR = window.EGBCEventsQR;
  var SITES = [], GROUPS = [], CHILDREN = [], CKS = {}, ROLL = {}, MED = {}, SETTINGS = {}, ME = {}, LEAD = false, MYGROUPS = [];
  /* The morning (stage 3, F-094): MORNING is today's record if this person may
     read it; SESSION is true for the rota's Session Leader while it is open;
     ROLLALL when they may see every group's roll-call. */
  var MORNING = null, SESSION = false, ROLLALL = false, SLNAME = '', ROTASL = false, TERMS = [], ROOMS = [], PAGES = {}, LEADERS = {};
  var PAGE_MINUTES = 5;
  var V = { site: '', tab: '', q: '', group: '', labels: null, scanning: false, msg: '' }, UNSUB = [];
  var DAY = C.today();
  function db() { return EGBCAuth.db; }
  function uid() { return (EGBCAuth.user() || {}).uid || ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 4000); }
  function all(s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }
  function group(id) { return GROUPS.filter(function (g) { return g.id === id; })[0] || null; }
  function child(id) { return CHILDREN.filter(function (c) { return c.id === id; })[0] || null; }
  function ckOf(c) { return c && c.groupId ? CKS[K.checkinIdFor(c.id, c.groupId, DAY)] || null : null; }
  function time(iso) { return iso ? E.fmtTime(iso) : ''; }
  function tel(p) { return String(p || '').replace(/[^\d+]/g, ''); }
  function visibleGroups() { return LEAD ? GROUPS : GROUPS.filter(function (g) { return MYGROUPS.some(function (m) { return m.id === g.id; }); }); }
  function openModal(html) { document.getElementById('modal').innerHTML = html; document.getElementById('back').style.display = 'flex'; }
  function closeModal() { document.getElementById('back').style.display = 'none'; }
  document.getElementById('back').onclick = function (e) { if (e.target.id === 'back') closeModal(); };
  function myGroupsHere() { return MYGROUPS.filter(function (g) { return g.siteId === V.site; }); }
  function notSetUp(noSite, canChoose) {
    document.getElementById('main').innerHTML = K.notSetUpHtml({ admin: !!(EGBCAuth.isAdmin && EGBCAuth.isAdmin()), noSite: noSite, canChooseTeam: canChoose });
  }
  function noAccess() {
    document.getElementById('main').innerHTML = '<div class="card" id="noaccess">This page is for the children\'s team leads and each group\'s leaders. If you lead a children\'s group, ask a lead to add you to it on the Children\'s register.</div>';
  }

  /* ---- load: the leads read the site; a group leader reads their groups ---- */
  function load() {
    UNSUB.forEach(function (u) { u(); }); UNSUB = []; CKS = {}; ROLL = {};
    var site = V.site, mine = MYGROUPS.filter(function (g) { return g.siteId === site; });
    var kids = LEAD ? db().collection('kidsChildren').where('siteId', '==', site).get().then(all)
      : !mine.length ? Promise.resolve([]) : Promise.all(mine.map(function (g) { return db().collection('kidsChildren').where('groupId', '==', g.id).get().then(all); }))
          .then(function (l) { return [].concat.apply([], l); });
    return Promise.all([db().collection('kidsGroups').where('siteId', '==', site).get(), kids,
                        db().collection('kidsTerms').doc(site).get().catch(function () { return null; }),
                        db().collection('rooms').where('siteId', '==', site).get().catch(function () { return { docs: [] }; })]).then(function (r) {
      GROUPS = all(r[0]).filter(function (g) { return g.active !== false; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      TERMS = r[2] && r[2].exists ? (r[2].data().terms || []) : [];
      ROOMS = all(r[3]);
      /* Pages on the screen not yet cleared (anyone signed in may read them). */
      PAGES = {};
      UNSUB.push(db().collection('screenPages').where('siteId', '==', site).where('clearedAt', '==', null).onSnapshot(function (snap) {
        snap.docChanges().forEach(function (ch) { if (ch.type === 'removed') delete PAGES[ch.doc.id]; else PAGES[ch.doc.id] = Object.assign({ id: ch.doc.id }, ch.doc.data()); });
        tidyPages();
        if (V.tab === 'groups') drawPages();
      }, function () {}));
      CHILDREN = r[1].filter(function (c) { return c.status !== 'left'; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      var want = new URLSearchParams(location.search).get('tab');
      if (!V.tab) V.tab = want || (LEAD ? 'desk' : mine.length ? 'groups' : 'roll');
      if (!V.group || !visibleGroups().some(function (g) { return g.id === V.group; })) V.group = (visibleGroups()[0] || {}).id || '';
      /* Today's check-ins, live: by site for the leads, by group for a leader. */
      var queries = LEAD ? [db().collection('checkins').where('siteId', '==', site).where('day', '==', DAY)]
        : mine.map(function (g) { return db().collection('checkins').where('groupId', '==', g.id).where('day', '==', DAY); });
      queries.forEach(function (q) {
        UNSUB.push(q.onSnapshot(function (snap) {
          snap.docChanges().forEach(function (ch) { if (ch.type === 'removed') delete CKS[ch.doc.id]; else CKS[ch.doc.id] = Object.assign({ id: ch.doc.id }, ch.doc.data()); });
          refresh();
        }, function (e) { toast('Could not load today\'s check-ins: ' + (e.message || e)); }));
      });
      /* The roll-call copies: the whole site for the leads and this morning's
         leaders; otherwise a group leader's own groups. */
      var rq = LEAD || ROLLALL ? [db().collection('kidsRoll').where('siteId', '==', site).where('day', '==', DAY)]
        : mine.map(function (g) { return db().collection('kidsRoll').where('groupId', '==', g.id).where('day', '==', DAY); });
      LEADERS = {};
      if (LEAD || ROLLALL) UNSUB.push(db().collection('kidsLeaderIns').where('siteId', '==', site).where('day', '==', DAY).onSnapshot(function (snap) {
        snap.docChanges().forEach(function (ch) { if (ch.type === 'removed') delete LEADERS[ch.doc.id]; else LEADERS[ch.doc.id] = ch.doc.data(); });
        if (V.tab === 'roll') drawRollBody();
      }, function () {}));
      rq.forEach(function (q) {
        UNSUB.push(q.onSnapshot(function (snap) {
          snap.docChanges().forEach(function (ch) { if (ch.type === 'removed') delete ROLL[ch.doc.id]; else ROLL[ch.doc.id] = Object.assign({ id: ch.doc.id }, ch.doc.data()); });
          if (V.tab === 'roll') drawRollBody();
        }, function () {}));
      });
      if (LEAD) openMorning(GROUPS);
      draw();
    });
  }

  function draw() {
    var mine = myGroupsHere();
    var tabs = LEAD ? [['desk', 'Desk'], ['visitor', 'First time here'], ['groups', 'Groups'], ['roll', 'Roll-call'], ['register', 'Registers'], ['visitors', 'Visitors']]
      : (mine.length ? [['groups', 'Your group' + (mine.length > 1 ? 's' : '')]] : []).concat([['roll', 'Roll-call']]).concat(mine.length ? [['register', 'Registers']] : []);
    /* A tab this person does not have (an old link, the app's buttons): their first one. */
    if (!tabs.some(function (t) { return t[0] === V.tab; })) V.tab = tabs[0][0];
    document.getElementById('main').innerHTML =
      (SITES.length > 1 ? '<div class="row"><div class="f"><label class="l" for="k-site">Site</label><select id="k-site">' + SITES.map(function (s) {
        return '<option value="' + esc(s.id) + '"' + (s.id === V.site ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select></div></div>' : '') +
      '<div class="tabs">' + tabs.map(function (t) { return '<button class="tab' + (V.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') +
      (LEAD ? '<a class="btn sec" href="kids-admin.html" style="margin-left:auto">Children\'s register</a>' : '') + '</div>' +
      '<div id="body"></div>';
    var ks = document.getElementById('k-site'); if (ks) ks.onchange = function () { V.site = this.value; start(); };
    document.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { stopScan(); V.tab = b.dataset.tab; V.labels = null; draw(); }; });
    var el = document.getElementById('body');
    if (V.tab === 'visitor') return drawVisitor(el);
    if (V.tab === 'groups') return drawGroup(el);
    if (V.tab === 'roll') return drawRoll(el);
    if (V.tab === 'register') return drawRegister(el);
    if (V.tab === 'visitors') return drawVisitors(el);
    drawDesk(el);
  }
  /* A check-in changed: redraw the part that shows it, not the search box. */
  function refresh() {
    if (V.tab === 'desk') drawResults();
    else if (V.tab === 'groups') drawGroupBody();
    else if (V.tab === 'roll') drawRollBody();
  }

  function pills(c) {
    var f = c.flags || null;
    return (f ? (f.allergies ? '<span class="pill no">Allergies</span>' : '') + (f.medical ? '<span class="pill no">Medical</span>' : '') : '<span class="pill wait">Medical not checked</span>') +
      (c.status === 'visitor' ? '<span class="pill wait">Visitor</span>' : '') +
      (K.consentOk(c, DAY) ? (K.consentSoon(c, DAY) ? '<span class="pill wait">Renew: consent runs out ' + esc(E.fmtDateShort(c.consentUntil + 'T12:00')) + '</span>' : '')
        : '<span class="pill no">Consent ' + (c.consentUntil ? 'ran out' : 'missing') + '</span>');
  }

  /* ================= the desk (the leads) ================= */
  function drawDesk(el) {
    el.innerHTML = '<div class="card"><label class="l" for="d-q">Find the family</label>' +
      '<div class="two"><div style="flex:3 1 200px"><input class="inp big" id="d-q" value="' + esc(V.q) + '" placeholder="A name, the parent\'s phone, or the family code" autocomplete="off"></div>' +
      '<div style="flex:1 1 150px"><button class="btn sec tall" id="d-scan" style="width:100%">' + (V.scanning ? 'Stop the camera' : 'Scan their code') + '</button></div></div>' +
      (V.scanning ? '<video id="vid" playsinline muted></video>' : '') +
      '<div id="d-msg">' + V.msg + '</div></div><div id="d-morning"></div><div id="d-results"></div><div id="d-labels"></div>';
    drawMorningNote();
    var q = document.getElementById('d-q');
    q.oninput = function () { V.q = this.value; V.msg = ''; V.labels = null; drawResults(); };
    /* A hand-held scanner types the code and presses Enter. */
    q.onkeydown = function (e) { if (e.key === 'Enter') { var code = K.parseFamilyQR(this.value); if (code) { V.q = code; this.value = code; drawResults(); } } };
    document.getElementById('d-scan').onclick = function () { V.scanning ? stopScan() : startScan(); };
    if (V.scanning) EGBCScan.start(document.getElementById('vid'), onScan).catch(function (e) { V.scanning = false; toast((e.message || e) + ' Search by name instead.'); drawDesk(el); });
    if (!V.q) q.focus();
    drawResults();
  }
  function startScan() { V.scanning = true; drawDesk(document.getElementById('body')); }
  function stopScan() { if (V.scanning) { EGBCScan.stop(); V.scanning = false; if (V.tab === 'desk' && document.getElementById('d-q')) drawDesk(document.getElementById('body')); } }
  function onScan(text) {
    var code = K.parseFamilyQR(text);
    if (!code) { V.msg = '<div class="st wait">That is not a family code from this page.</div>'; document.getElementById('d-msg').innerHTML = V.msg; return; }
    V.q = code; document.getElementById('d-q').value = code; V.msg = ''; document.getElementById('d-msg').innerHTML = '';
    drawResults();
  }
  window.__kidsScan = onScan;

  function drawResults() {
    var box = document.getElementById('d-results'); if (!box) return;
    var fams = K.findFamilies(CHILDREN, V.q);
    if (!String(V.q).trim()) { box.innerHTML = ''; drawLabels(); return; }
    box.innerHTML = fams.length ? fams.slice(0, 8).map(function (f) {
      return '<div class="card" data-fam="' + esc(f.familyId) + '"><h2>' + esc(f.parentName) + ' <span class="hint">' + esc(f.phone) + '</span></h2>' +
        f.children.map(function (c) {
          var g = group(c.groupId), ck = ckOf(c), isIn = ck && ck.state === 'in';
          return '<div class="kid" data-kid="' + esc(c.id) + '">' +
            (isIn ? '<span class="pill ok">In</span>' : '<input type="checkbox" class="d-tick" value="' + esc(c.id) + '"' + (g ? ' checked' : ' disabled') + ' aria-label="' + esc(c.name) + ' is here">') +
            '<div class="t"><b>' + esc(c.name) + '</b> <span class="hint">' + esc(g ? g.name : 'not in a group: a lead places them on the Children\'s register') + '</span><br>' + pills(c) +
            (isIn ? '<br><span class="hint">In since ' + esc(time(ck.inAt)) + ' · collection code <b>' + esc(ck.pickupCode) + '</b></span>' : '') +
            (ck && ck.state === 'out' ? '<br><span class="hint">Went home ' + esc(time(ck.outAt)) + ' with ' + esc(ck.collectedBy) + '</span>' : '') + '</div>' +
            (isIn ? '<button class="btn sec" data-out="' + esc(ck.id) + '">Check out</button>' : '') + '</div>';
        }).join('') +
        (SETTINGS.formId && f.children.some(function (c) { return !K.consentOk(c, DAY); })
          ? '<div class="st no" style="margin-top:8px">Consent has run out or is missing. Let them in, and give the parent the form to renew it. <button class="btn sec" data-renew="' + esc(f.familyId) + '">Show the renewal QR code</button></div>' : '') +
        (f.children.some(function (c) { var ck = ckOf(c); return group(c.groupId) && !(ck && ck.state === 'in'); })
          ? '<div style="margin-top:10px"><button class="btn tall" data-checkin="' + esc(f.familyId) + '">Check in</button></div>' : '') + '</div>';
    }).join('') : '<div class="card"><p class="hint">Nobody found. New here? Use <b>First time here</b>.</p></div>';
    box.querySelectorAll('[data-checkin]').forEach(function (b) { b.onclick = function () { checkInFamily(b.dataset.checkin, b); }; });
    box.querySelectorAll('[data-out]').forEach(function (b) { b.onclick = function () { checkOutBox(b.dataset.out); }; });
    box.querySelectorAll('[data-renew]').forEach(function (b) { b.onclick = function () { renewConsent(b.dataset.renew, b); }; });
    drawLabels();
  }

  /* Expired consent (Martin, F-094): the child comes in, and the parent is
     shown a QR code for the registration form, to fill in on their phone.
     If we have their email, the link goes there too. */

  function addVisitor(btn) {

    }).filter(function (k, i) { return i === 0 || k.name; });

    var probs = [];

    var now = new Date().toISOString(), famId = 'kf_' + E.key(14), famCode = K.familyCode(), batch = db().batch(), made = [];
    var collectors = [v.parentName];
    batch.set(db().collection('kidsFamilies').doc(famId), { siteId: V.site, parentName: v.parentName, phone: v.phone, email: v.email, emergency: '', collectors: collectors,
      familyCode: famCode, responseIds: [], visitor: true, firstVisit: DAY, createdAt: now, updatedAt: now, updatedBy: uid() });
    kids.forEach(function (k) {
      var id = 'kc_' + E.key(14), c = { year: k.year, groupFixed: false };
      var groupId = K.groupFor(c, GROUPS);
      var d = { siteId: V.site, familyId: famId, name: k.name.slice(0, 120), dob: '', year: k.year, dietary: '', photo: false, firstaid: v.firstaid, alone: false,
        flags: { allergies: K.meaningful(k.allergies), medical: false }, consentUntil: DAY, consentKind: 'door', responseId: '', groupId: groupId, groupFixed: false,
        status: 'visitor', parentName: v.parentName, phone: v.phone, email: v.email, emergency: '', collectors: collectors, familyCode: famCode,
        createdAt: now, updatedAt: now, updatedBy: uid() };
      batch.set(db().collection('kidsChildren').doc(id), d);
      batch.set(db().collection('kidsMedical').doc(id), { siteId: V.site, groupId: groupId, allergies: k.allergies.slice(0, 500), medical: '', medication: '', needs: '',
        responseId: '', updatedAt: now, updatedBy: uid() });

    });

    }).then(function () {

  function drawGroupBody() {

  /* For snack time: every allergy and medical need among the children in

  /* ================= the morning, and the fire roll-call ================= */
  /* A lead opening the page on a day a group meets opens the morning: every
     group leader meeting today, and the rota's Session Leader, see the
     roll-call until the end of the day. The rules check the Session Leader
     against the rota. */
  function openMorning(groups) {
    var wd = new Date().getDay() || 7, meeting = (groups || GROUPS).filter(function (g) { return g.active !== false && (g.day || 7) === wd; });
    if (!meeting.length) return Promise.resolve(null);
    var mday = K.morningDay();
    return db().collection('events').where('date', '==', mday).get().then(function (snap) {
      var rotaId = '', sl = '';
      snap.docs.forEach(function (d) { var a = (d.data().assignments || {})['Session Leader']; if (!sl && a && !Array.isArray(a) && a.id) { sl = a.id; SLNAME = a.name || ''; rotaId = d.id; } });
      var ids = {}; meeting.forEach(function (g) { (g.leaderIds || []).forEach(function (m) { ids[m] = 1; }); });
      var end = new Date(); end.setHours(23, 59, 0, 0);
      var exp = new Date(Math.min(end.getTime(), Date.now() + 17 * 3600000));
      var d = { siteId: V.site, day: mday, rotaId: rotaId, leaderIds: Object.keys(ids).slice(0, 60), sessionLeaderIds: sl ? [sl] : [],
        expiresAt: firebase.firestore.Timestamp.fromDate(exp), updatedAt: new Date().toISOString(), updatedBy: uid() };
      return db().collection('kidsMornings').doc(V.site + '_' + mday).set(d).then(function () { MORNING = d; drawMorningNote(); return d; });
    }).catch(function (e) { toast('Could not open the morning: ' + (e.message || e)); return null; });
  }
  function drawMorningNote() {
    var box = document.getElementById('d-morning'); if (!box || !MORNING) return;
    box.innerHTML = '<div class="st ok" id="morning-note">This morning: ' + (MORNING.sessionLeaderIds.length ? 'Session Leader <b>' + esc(SLNAME || 'from the rota') + '</b> (from the rota). ' : 'no Session Leader on the rota. ') +
      MORNING.leaderIds.length + ' group leader' + (MORNING.leaderIds.length === 1 ? '' : 's') + ' and the Session Leader see the roll-call until ' +
      esc(E.fmtTime(MORNING.expiresAt.toDate().toISOString())) + '.</div>';
  }
  function drawRoll(el) {
    el.innerHTML = (ROLLALL || LEAD ? '' : '<div class="st wait">You see your own group here. The whole roll-call opens to this morning\'s leaders when a lead opens the desk.</div>') +
      '<div style="margin-bottom:10px"><button class="btn sec" id="r-print">Print the roll-call</button></div><div id="roll"></div>';
    document.getElementById('r-print').onclick = function () { window.print(); };
    drawRollBody();
  }
  /* Who is in the building now, by group: name and time in. The Session
     Leader (and the leads) can open a child's medical details. */
  function drawRollBody() {
    var box = document.getElementById('roll'); if (!box) return;
    var ins = Object.keys(ROLL).map(function (k) { return ROLL[k]; }).filter(function (x) { return x.state === 'in'; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    var gids = GROUPS.map(function (g) { return g.id; }).filter(function (id) { return ins.some(function (x) { return x.groupId === id; }); });
    ins.forEach(function (x) { if (gids.indexOf(x.groupId) < 0) gids.push(x.groupId); });
    var canMed = LEAD || SESSION;
    box.innerHTML = '<div class="card"><h2>Fire roll-call · ' + esc(E.fmtDate(DAY + 'T12:00')) + '</h2><div class="count"><div><b id="roll-total">' + ins.length + '</b><span class="hint">children in now</span></div>' +
      gids.map(function (id) { var g = group(id); return '<div><b>' + ins.filter(function (x) { return x.groupId === id; }).length + '</b><span class="hint">' + esc(g ? g.name : (ins.filter(function (x) { return x.groupId === id; })[0] || {}).groupName) + '</span></div>'; }).join('') + '</div>' +
      (gids.length ? gids.map(function (id) {
        var g = group(id), list = ins.filter(function (x) { return x.groupId === id; });
        return '<div data-rgroup="' + esc(id) + '" style="margin-top:10px"><h2>' + esc(g ? g.name : list[0].groupName) + '</h2>' + list.map(function (x) {
          return '<div class="kid" data-roll="' + esc(x.childId) + '"><div class="t">' + (canMed ? '<button class="rname" data-rmed="' + esc(x.childId) + '">' + esc(x.name) + '</button>' : '<b>' + esc(x.name) + '</b>') +
            ' <span class="hint">in since ' + esc(time(x.inAt)) + '</span></div><span style="font-size:20px;color:var(--muted)">&#9744;</span></div>';
        }).join('') + '</div>';
      }).join('') : '<p class="hint">Nobody is checked in right now.</p>') +
      (function () {
        var ls = Object.keys(LEADERS).map(function (k) { return LEADERS[k]; }).filter(function (l) { return l.state === 'in'; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
        return '<div data-rleaders style="margin-top:10px"><h2>Leaders in (' + ls.length + ')</h2>' + (ls.length ? ls.map(function (l) {
          return '<div class="kid"><div class="t"><b>' + esc(l.name) + '</b> <span class="hint">in since ' + esc(l.inAt && l.inAt.toDate ? E.fmtTime(l.inAt.toDate().toISOString()) : '') + '</span></div><span style="font-size:20px;color:var(--muted)">&#9744;</span></div>';
        }).join('') : '<p class="hint">No leader has checked in yet (they do it on the app\'s Kids Church "Today").</p>') + '</div>';
      })() + '</div>';
    box.querySelectorAll('[data-rmed]').forEach(function (b) {
      b.onclick = function () {
        var x = Object.keys(ROLL).map(function (k) { return ROLL[k]; }).filter(function (r) { return r.childId === b.dataset.rmed; })[0];
        openModal('<h2 style="margin:0 0 6px;font-size:17px;color:var(--ink)">' + esc(x.name) + '</h2><p class="hint">' + esc(x.groupName) + (SESSION && !LEAD ? ' · shown to the Session Leader this morning only' : '') + '</p>' +
          '<div id="m-med" class="st wait">Loading the medical details…</div><button class="btn sec" id="m-close">Close</button>');
        document.getElementById('m-close').onclick = closeModal;
        medOf(x.childId).then(function (m) {
          document.getElementById('m-med').innerHTML = '<span data-med="' + esc(x.childId) + '"><b>Allergies</b>: ' + esc(m.allergies || 'none given') + '<br><b>Medical</b>: ' + esc(m.medical || 'none given') +
            '<br><b>Medication</b>: ' + esc(m.medication || 'none given') + '<br><b>Additional needs</b>: ' + esc(m.needs || 'none given') + '</span>';
        }).catch(function () { document.getElementById('m-med').textContent = 'Could not open the medical details.'; });
      };
    });
  }

  /* ================= registers ================= */
  function drawRegister(el) {
    var gs = visibleGroups();
    if (!gs.length) { el.innerHTML = '<div class="card hint">No groups yet.</div>'; return; }
    if (!V.rgroup || !gs.some(function (g) { return g.id === V.rgroup; })) V.rgroup = gs[0].id;
    V.rperiod = V.rperiod || 'term';
    var t = K.termOf(DAY, TERMS), lt = K.termBefore(DAY, TERMS);
    el.innerHTML = '<div class="card"><div class="row"><div class="f"><label class="l" for="reg-group">Group</label><select id="reg-group">' + gs.map(function (g) {
        return '<option value="' + esc(g.id) + '"' + (g.id === V.rgroup ? ' selected' : '') + '>' + esc(g.name) + '</option>'; }).join('') + '</select></div>' +
      '<div class="f"><label class="l" for="reg-period">Which weeks</label><select id="reg-period">' + [['week', 'The latest week'], ['term', 'This term (' + t.name + ')'], ['last', 'Last term (' + lt.name + ')'], ['custom', 'Choose the dates']].map(function (o) {
        return '<option value="' + o[0] + '"' + (V.rperiod === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select></div>' +
      '<div class="f" id="reg-dates" style="display:' + (V.rperiod === 'custom' ? 'block' : 'none') + '"><label class="l" for="reg-from">From</label><input class="inp" type="date" id="reg-from" value="' + esc(V.rfrom || t.from) + '"></div>' +
      '<div class="f" style="display:' + (V.rperiod === 'custom' ? 'block' : 'none') + '"><label class="l" for="reg-to">Until</label><input class="inp" type="date" id="reg-to" value="' + esc(V.rto || DAY) + '"></div></div>' +
      '<div id="reg-body" class="hint">Loading…</div></div>';
    document.getElementById('reg-group').onchange = function () { V.rgroup = this.value; drawRegister(el); };
    document.getElementById('reg-period').onchange = function () { V.rperiod = this.value; drawRegister(el); };
    document.getElementById('reg-from').onchange = function () { V.rfrom = this.value; drawRegister(el); };
    document.getElementById('reg-to').onchange = function () { V.rto = this.value; drawRegister(el); };
    var g = group(V.rgroup), from, to;
    if (V.rperiod === 'week') { var d7 = new Date(DAY + 'T12:00:00Z'); d7.setUTCDate(d7.getUTCDate() - 6); from = d7.toISOString().slice(0, 10); to = DAY; }
    else if (V.rperiod === 'last') { from = lt.from; to = lt.to; }
    else if (V.rperiod === 'custom') { from = V.rfrom || t.from; to = V.rto || DAY; }
    else { from = t.from; to = t.to; }
    if (to > DAY) to = DAY;
    var dates = K.sessionDates(g.day, from, to);
    if (V.rperiod === 'week') dates = dates.slice(-1);
    if (!dates.length) { document.getElementById('reg-body').innerHTML = 'No ' + esc(K.DAYS[g.day || 7]) + 's in those dates yet.'; return; }
    Promise.all(dates.map(function (d) {
      var q = LEAD ? db().collection('checkins').where('siteId', '==', V.site).where('day', '==', d) : db().collection('checkins').where('groupId', '==', g.id).where('day', '==', d);
      return q.get().then(all).then(function (l) { return l.filter(function (k) { return k.groupId === g.id; }); });
    })).then(function (lists) {
      var reg = K.register(CHILDREN.filter(function (c) { return c.groupId === g.id; }), [].concat.apply([], lists), dates);
      var short = function (d) { return +d.slice(8, 10) + '/' + +d.slice(5, 7); };
      var b = document.getElementById('reg-body'); if (!b) return;
      b.className = '';
      b.innerHTML = '<div class="scroll"><table class="reg" id="reg-table"><thead><tr><th>' + esc(g.name) + '</th>' + dates.map(function (d) { return '<th>' + short(d) + '</th>'; }).join('') + '<th>Weeks</th></tr></thead><tbody>' +
        reg.rows.map(function (rw) { return '<tr><td>' + esc(rw.name) + '</td>' + dates.map(function (d) { return '<td>' + (rw.days[d] ? '&#10003;' : '') + '</td>'; }).join('') + '<td>' + rw.total + '</td></tr>'; }).join('') +
        '<tr class="tot"><td>Children</td>' + reg.totals.map(function (n) { return '<td>' + n + '</td>'; }).join('') + '<td></td></tr></tbody></table></div>' +
        '<div style="margin-top:10px"><button class="btn sec" id="reg-csv">Download (CSV, for Excel)</button></div>';
      document.getElementById('reg-csv').onclick = function () {
        var head = ['Child'].concat(dates).concat(['Weeks']);
        var rows = reg.rows.map(function (rw) { return [rw.name].concat(dates.map(function (d) { return rw.days[d] ? 'Yes' : ''; })).concat([rw.total]); })
          .concat([['Children'].concat(reg.totals).concat([''])]);
        C.logDownload({ calEventId: 'kids_' + g.id, what: 'Register: ' + g.name + ' ' + dates[0] + ' to ' + dates[dates.length - 1], format: 'csv', columns: head, sensitive: false }).then(function () {
          C.saveFile('Register ' + g.name + ' ' + dates[0] + '.csv', new Blob(['\ufeff' + C.csvText(head, rows)], { type: 'text/csv' }));
        }).catch(function (e) { toast('Could not download: ' + (e.message || e)); });
      };
    }).catch(function (e) { var b = document.getElementById('reg-body'); if (b) b.textContent = 'Could not load the register: ' + (e.message || e); });
  }

  /* ================= visitors to follow up (the leads) ================= */
  function drawVisitors(el) {
    V.vsince = V.vsince || '7';
    el.innerHTML = '<div class="card"><h2>New families to welcome</h2><p class="hint">Families who came for the first time, so the children\'s team can say hello and help with the form.</p>' +
      '<div class="row"><div class="f"><label class="l" for="vis-since">Since</label><select id="vis-since"><option value="7"' + (V.vsince === '7' ? ' selected' : '') + '>This week</option><option value="28"' + (V.vsince === '28' ? ' selected' : '') + '>The last four weeks</option></select></div></div>' +
      '<div id="vis-body" class="hint">Loading…</div></div>';
    document.getElementById('vis-since').onchange = function () { V.vsince = this.value; drawVisitors(el); };
    var since = new Date(DAY + 'T12:00:00Z'); since.setUTCDate(since.getUTCDate() - (+V.vsince - 1)); since = since.toISOString().slice(0, 10);
    db().collection('kidsFamilies').where('siteId', '==', V.site).get().then(all).then(function (fams) {
      var list = fams.filter(function (f) { return f.visitor === true && (f.firstVisit || '') >= since; }).sort(function (a, b) { return a.firstVisit < b.firstVisit ? 1 : -1; });
      var b = document.getElementById('vis-body'); if (!b) return;
      b.className = '';
      b.innerHTML = list.length ? list.map(function (f) {
        var kids = CHILDREN.filter(function (c) { return c.familyId === f.id; }), back = kids.length && kids.every(function (c) { return c.status === 'registered'; });
        return '<div class="kid" data-vfam="' + esc(f.id) + '"><div class="t"><b>' + esc(f.parentName) + '</b> <span class="hint">first came ' + esc(E.fmtDateShort(f.firstVisit + 'T12:00')) + '</span><br>' +
          kids.map(function (c) { return esc(c.name) + ' <span class="hint">(' + esc((group(c.groupId) || {}).name || 'no group') + ')</span>'; }).join(', ') + '<br>' +
          (f.phone ? '<a href="tel:' + esc(tel(f.phone)) + '" style="color:var(--brand)">' + esc(f.phone) + '</a>' : '') + (f.email ? ' · ' + esc(f.email) : '') + '<br>' +
          (back ? '<span class="pill ok">Full form back</span>' : '<span class="pill wait">Full form not back yet</span>') +
          (f.welcomedAt ? '<span class="pill ok">Welcomed by ' + esc(f.welcomedByName || 'the team') + ', ' + esc(E.fmtDateShort(f.welcomedAt)) + '</span>' : '') + '</div>' +
          (f.welcomedAt ? '' : '<button class="btn sec" data-welcome="' + esc(f.id) + '">We have said hello</button>') +
          (!back && f.email && SETTINGS.formId ? '<button class="btn sec" data-resend="' + esc(f.id) + '">Send the form again</button>' : '') + '</div>';
      }).join('') : '<p class="hint">No new families in that time.</p>';
      b.querySelectorAll('[data-welcome]').forEach(function (x) {
        x.onclick = function () {
          x.disabled = true;
          db().collection('kidsFamilies').doc(x.dataset.welcome).update({ welcomedAt: new Date().toISOString(), welcomedBy: uid(), welcomedByName: ME.name || '', updatedAt: new Date().toISOString(), updatedBy: uid() })
            .then(function () { toast('Noted'); drawVisitors(el); }).catch(function (e) { x.disabled = false; toast('Could not: ' + (e.message || e)); });
        };
      });
      b.querySelectorAll('[data-resend]').forEach(function (x) {
        x.onclick = function () {
          var f = list.filter(function (y) { return y.id === x.dataset.resend; })[0];
          x.disabled = true;
          sendFullForm({ parentName: f.parentName, email: f.email }, CHILDREN.filter(function (c) { return c.familyId === f.id; })).then(function (ok) { if (ok) toast('Sent to ' + f.email); });
        };
      });
    }).catch(function (e) { var b = document.getElementById('vis-body'); if (b) b.textContent = 'Could not load: ' + (e.message || e); });
  }

  /* A child's details for the leader: medical, and the parent on tap. */
  function details(c) {
    openModal('<h2 style="margin:0 0 6px;font-size:17px;color:var(--ink)">' + esc(c.name) + '</h2>' + pills(c) +
      '<div id="m-med" class="st wait">Loading the medical details…</div>' +
      '<dl><dt>Parent</dt><dd>' + esc(c.parentName || '') + '</dd><dt>Phone</dt><dd>' + (c.phone ? '<a href="tel:' + esc(tel(c.phone)) + '" style="color:var(--brand)">' + esc(c.phone) + '</a>' : 'none given') + '</dd>' +
      '<dt>Emergency</dt><dd>' + esc(c.emergency || 'none given') + '</dd><dt>May collect</dt><dd>' + esc((c.collectors || []).join(', ')) + '</dd>' +
      '<dt>First aid</dt><dd>' + (c.firstaid ? 'Yes' : 'No: ring the parent') + '</dd><dt>Photos</dt><dd>' + (c.photo ? 'Yes' : 'No') + '</dd></dl>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="m-page">Page a parent</button>' +
      (ckOf(c) && ckOf(c).state === 'in' ? '<button class="btn" id="m-screen">Show on screen</button>' : '') +
      (ckOf(c) && ckOf(c).state === 'in' && window.EGBCNotify ? '<button class="btn" id="m-phone">Call on their phone</button>' : '') +
      '<button class="btn sec" id="m-close">Close</button></div><div id="m-pager"></div>');
    document.getElementById('m-close').onclick = closeModal;
    /* §23: the family's own phones get the group and the code only, never
       the child's name; anyone with no phone set up is emailed. */
    var mp = document.getElementById('m-phone');
    if (mp) mp.onclick = function () {
      mp.disabled = true;
      EGBCNotify.callParent(ckOf(c).id).then(function (r) {
        document.getElementById('m-pager').innerHTML = '<div class="st ' + (r && !r.error && (r.phones || r.emailed) ? 'ok' : 'wait') + '" id="m-called" style="margin-top:10px">' + esc(EGBCNotify.callWords(r)) + '</div>';
        mp.disabled = false;
      });
    };
    var ms = document.getElementById('m-screen');
    if (ms) ms.onclick = function () {
      ms.disabled = true;
      showOnScreen(c).then(function (pg) {
        document.getElementById('m-pager').innerHTML = '<div class="st ok" id="on-screen" style="margin-top:10px"><div class="hint">On the screen now (for ' + PAGE_MINUTES + ' minutes):</div><div class="page-call">' + esc(pg.message) + '</div>' +
          '<div style="margin-top:8px"><button class="btn tall" id="m-done">Done: the parent is here</button></div></div>';
        document.getElementById('m-done').onclick = function () { clearPage(pg.id).then(function () { closeModal(); toast('Taken off the screen'); }); };
      }).catch(function (e) { ms.disabled = false; toast('Could not show it: ' + (e.message || e)); });
    };
    document.getElementById('m-page').onclick = function () {
      document.getElementById('m-pager').innerHTML = '<div class="st wait" id="pager" style="margin-top:10px"><div class="hint">Call ' + esc(c.parentName || 'the parent') + ' to come to ' + esc((group(c.groupId) || {}).name || 'the group') + ':</div>' +
        (c.phone ? '<a class="page-call" href="tel:' + esc(tel(c.phone)) + '">' + esc(c.phone) + '</a><div style="margin-top:8px"><a class="btn tall" href="tel:' + esc(tel(c.phone)) + '">Call now</a></div>' : '<div class="page-call">No phone number on their record</div>') +
        '<div class="hint" style="margin-top:6px">A text message to the parent comes later.</div></div>';
    };
    db().collection('kidsMedical').doc(c.id).get().then(function (s) {
      var m = s.exists ? s.data() : {};
      document.getElementById('m-med').innerHTML = '<span data-med="' + esc(c.id) + '"><b>Allergies</b>: ' + esc(m.allergies || 'none given') + '<br><b>Medical</b>: ' + esc(m.medical || 'none given') +
        '<br><b>Medication</b>: ' + esc(m.medication || 'none given') + '<br><b>Additional needs</b>: ' + esc(m.needs || 'none given') + '</span>';
    }).catch(function () { document.getElementById('m-med').textContent = 'Could not open the medical details.'; });
  }

  /* ---- paging on the screen, through ChurchShow (Martin, F-098) ----
     One document per page in screenPages, its id the child's check-in id.
     The contract ChurchShow reads is in FINDINGS-events.md (F-100). The
     code only, never the child's name. */
  function roomName(g) { var r = ROOMS.filter(function (x) { return x.id === g.roomId; })[0]; return r ? r.name : g.name; }
  function showOnScreen(c) {
    var ck = ckOf(c), g = group(c.groupId);
    var pg = { siteId: ck.siteId, code: ck.pickupCode, room: roomName(g).slice(0, 80), message: ck.pickupCode + ', please come to ' + g.name,
      createdBy: uid(), createdAt: firebase.firestore.FieldValue.serverTimestamp(), clearedAt: null };
    return db().collection('screenPages').doc(ck.id).set(pg).then(function () { return Object.assign({ id: ck.id }, pg); });
  }
  function clearPage(id) {
    return db().collection('screenPages').doc(id).update({ clearedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(function (e) { toast('Could not clear it: ' + (e.message || e)); });
  }
  function pageAge(p) { var t = p.createdAt && p.createdAt.toMillis ? p.createdAt.toMillis() : Date.now(); return Date.now() - t; }
  function myPage(p) { return Object.keys(CKS).indexOf(p.id) >= 0; }
  /* A page clears itself after five minutes: ChurchShow stops showing it,
     and whichever leader's screen is open writes clearedAt. */
  function tidyPages() {
    Object.keys(PAGES).forEach(function (id) {
      var p = PAGES[id];
      if (myPage(p) && !p._clearing && pageAge(p) > PAGE_MINUTES * 60000) { p._clearing = true; clearPage(id); }
    });
  }
  setInterval(function () { tidyPages(); if (V.tab === 'groups') drawPages(); }, 30000);
  function drawPages() {
    var box = document.getElementById('g-pages'); if (!box) return;
    var list = Object.keys(PAGES).map(function (k) { return PAGES[k]; }).filter(function (p) {
      var ck = CKS[p.id]; return ck && ck.groupId === V.group && pageAge(p) <= PAGE_MINUTES * 60000;
    });
    box.innerHTML = list.length ? '<div class="st ok" id="g-onscreen"><b>On the screen now</b>' + list.map(function (p) {
      return '<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><span class="page-call" style="font-size:16px">' + esc(p.message) + '</span><button class="btn sec" data-pdone="' + esc(p.id) + '">Done</button></div>';
    }).join('') + '</div>' : '';
    box.querySelectorAll('[data-pdone]').forEach(function (b) { b.onclick = function () { b.disabled = true; clearPage(b.dataset.pdone); }; });
  }

  /* ---- who am I, for this site (as the Children's register works it out) ---- */
  function start() {
    var s = SITES.filter(function (x) { return x.id === V.site; })[0] || {};
    SETTINGS = s._settings || {}; LEAD = !!s._lead; V.tab = ''; V.labels = null;
    MORNING = s._mdoc || null; SESSION = !!s._session; ROLLALL = !!s._morning; SLNAME = '';
    /* The rota's Session Leader, if no lead has opened the morning yet,
       opens it (Martin, F-098; the rules check the rota). */
    if (ROTASL && !SESSION && !LEAD) {
      return db().collection('kidsGroups').where('siteId', '==', V.site).get().then(function (g) {
        return openMorning(all(g));
      }).then(function (d) {
        if (d) { MORNING = d; SESSION = true; ROLLALL = true; }
        return load();
      }).catch(function () { noAccess(); });
    }
    return load().catch(function () { noAccess(); });
  }
  function begin() {
    var mid = ME.memberId || '-', adminFor = ME.adminFor || [];
    return Promise.all([db().collection('sites').get(), db().collection('bookingSettings').get().catch(function () { return { docs: [] }; }),
                        db().collection('kidsSettings').get().catch(function () { return { docs: [] }; }),
                        db().collection('kidsGroups').where('leaderIds', 'array-contains', mid).get().catch(function () { return { docs: [] }; })]).then(function (r) {
      var bs = {}, ks = {};
      all(r[1]).forEach(function (s) { bs[s.id] = s; }); all(r[2]).forEach(function (s) { ks[s.id] = s; });
      MYGROUPS = all(r[3]);
      /* Am I the Session Leader on today's rota? */
      var rota = db().collection('events').where('date', '==', K.morningDay()).get().then(function (s) {
        ROTASL = s.docs.some(function (d) { var a = (d.data().assignments || {})['Session Leader']; return a && !Array.isArray(a) && a.id === mid; });
      }).catch(function () {});
      return rota.then(function () { return Promise.all(all(r[0]).map(function (s) {
        return db().collection('kidsMornings').doc(s.id + '_' + K.morningDay()).get().then(function (m) { return m.exists ? m.data() : null; }, function () { return null; });
      })); }).then(function (ms) { return { r: r, ms: ms, bs: bs, ks: ks }; });
    }).then(function (x) {
      var r = x.r, bs = x.bs, ks = x.ks, mid = ME.memberId || '-', adminFor = ME.adminFor || [];
      /* Not set up yet: no site in Places, or no children's team chosen. */
      var live = all(r[0]).filter(function (s) { return s.active !== false; });
      var anyTeam = live.some(function (s) { return ((ks[s.id] || {}).teams || []).length > 0; });
      var canChoose = !!ME.masterAdmin || live.some(function (s) { var b = bs[s.id] || {}; return b.safeguardingLead === mid || b.safeguardingDeputy === mid; });
      if (!live.length || !anyTeam) return notSetUp(!live.length, canChoose);
      SITES = all(r[0]).map(function (s, i) { s._i = i; return s; }).filter(function (s) { return s.active !== false; }).map(function (s) { var i = s._i;
        s._settings = ks[s.id] || {};
        var sg = (bs[s.id] || {}).safeguardingLead === mid || (bs[s.id] || {}).safeguardingDeputy === mid;
        s._lead = !!(ME.masterAdmin || sg || (s._settings.teams || []).some(function (t) { return adminFor.indexOf(t) >= 0; }));
        s._leader = MYGROUPS.some(function (g) { return g.siteId === s.id; });
        var m = x.ms[i], open = m && m.expiresAt && m.expiresAt.toMillis() > Date.now();
        s._session = !!(open && (m.sessionLeaderIds || []).indexOf(mid) >= 0);
        s._morning = !!(open && (s._session || (m.leaderIds || []).indexOf(mid) >= 0));
        s._mdoc = m;
        return s;
      }).filter(function (s) { return s._lead || s._leader || s._morning || (ROTASL && ((s._settings.teams || []).length > 0)); }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      if (!SITES.length) return noAccess();
      if (!SITES.some(function (s) { return s.id === V.site; })) V.site = SITES[0].id;
      return start();
    });
  }

  EGBCAuth.require().then(function (profile) {
    ME = profile || {};
    return begin();
  }).catch(function (e) { document.getElementById('main').innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
})();
</script>
</body>
</html>
