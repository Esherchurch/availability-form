<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send photos</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610062100" data-title="Send photos"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-church.js?v=202610091200"></script>
<script src="egbc-ics.js?v=202610091200"></script>
<script src="egbc-events.js?v=202610072300"></script>
<script src="egbc-events-uploads.js?v=202610081600"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 64px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:20px;margin-bottom:14px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 6px}
  .meta{color:var(--muted);font-size:14px;margin:0}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp{width:100%;height:44px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;
       font:400 15px Inter,sans-serif;color:var(--ink);background:#fff}
  .inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .field{margin-bottom:16px}
  .pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line-2);
        border-radius:12px;padding:28px 16px;text-align:center;color:var(--body);cursor:pointer;background:#fafafa}
  .pick:hover{border-color:var(--brand)}
  .pick input{display:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;width:100%;
       border-radius:8px;font:500 15px Inter,sans-serif;cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .files{margin:12px 0 0;padding:0;list-style:none}
  .files li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .files li:first-child{border-top:none}
  .files .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .files .st{font-size:13px;color:var(--muted);white-space:nowrap}
  .files .st.ok{color:var(--ok)} .files .st.no{color:var(--danger)}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px}
  .bar span{display:block;height:100%;background:var(--brand);width:0}
  .banner{border-radius:8px;padding:11px 13px;font-size:14px;margin-bottom:14px}
  .banner.ok{background:var(--ok-bg);color:var(--ok)}
  .banner.warn{background:var(--danger-bg);color:var(--danger)}
  .banner.info{background:var(--tint);color:var(--body);border:1px solid #cfe0de}
  .hint{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card">Loading…</div></div>

<script>
(function () {
  'use strict';
  var U = window.EGBCUploads, E = window.EGBCEvents, esc = E.esc;
  var KEY = new URLSearchParams(location.search).get('k') || '';
  var LINK = null, FILES = [];

  function icons() { if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons(); }
  function ico(n, px) { return '<i data-lucide="' + n + '" style="width:' + (px || 16) + 'px;height:' + (px || 16) + 'px"></i>'; }
  function wrap(html) { document.getElementById('wrap').innerHTML = html; icons(); }
  function left() { return Math.max(0, (LINK.maxFiles || 0) - (LINK.count || 0)); }

  function closed(st) {
    var why = st === 'expired' ? 'This link has run out.' : st === 'full' ? 'This link has taken all the photos it can.' : 'This link has been switched off.';
    wrap('<div class="card"><h1>' + esc(LINK.eventTitle || 'Photos') + '</h1><div class="banner warn" id="closed" style="margin-top:12px">' + why +
      '</div><p class="meta">If you still have photos to send, ask whoever gave you the link.</p></div>');
  }

  function draw() {
    var st = U.state(LINK);
    if (st !== 'open') return closed(st);
    wrap('<div class="card"><h1>Send photos</h1><p class="meta">' + esc(LINK.eventTitle || '') + '</p></div>' +
      '<div class="card">' +
        '<div class="banner info">Nothing you send is shown anywhere until someone at the church has looked at it. ' +
          'Please only send photos you took, and think of anyone in them, especially children.</div>' +
        '<label class="pick" for="files">' + ico('image-plus', 28) + '<strong>Choose photos</strong>' +
          '<span class="hint">JPEG, PNG, HEIC or WebP, under 15 MB each. Up to ' + left() + ' more.</span>' +
          '<input type="file" id="files" accept="image/jpeg,image/png,image/heic,image/heif,image/webp,.heic,.heif" multiple></label>' +
        '<ul class="files" id="list"></ul>' +
        '<div class="field" style="margin-top:16px"><label for="nm">Your name (optional)</label><input class="inp" id="nm" maxlength="80" autocomplete="name"></div>' +
        '<button class="btn" id="go" disabled>' + ico('upload') + 'Send</button>' +
        '<div class="bar" id="bar" style="display:none"><span id="barIn"></span></div>' +
        '<div id="msg" style="margin-top:12px"></div>' +
      '</div>');
    document.getElementById('files').onchange = function () { FILES = [].slice.call(this.files); list(); };
    document.getElementById('go').onclick = send;
  }

  function list() {
    var ok = FILES.filter(function (f) { return !U.refuse(f); }).length;
    document.getElementById('list').innerHTML = FILES.map(function (f, i) {
      var why = U.refuse(f);
      return '<li id="f' + i + '"><span class="nm">' + esc(f.name) + '</span><span class="st' + (why ? ' no' : '') + '">' + (why ? esc(why) : 'ready') + '</span></li>';
    }).join('');
    var tooMany = ok > left();
    document.getElementById('go').disabled = !ok || tooMany;
    document.getElementById('go').innerHTML = ico('upload') + 'Send ' + ok + ' photo' + (ok === 1 ? '' : 's');
    document.getElementById('msg').innerHTML = tooMany ? '<div class="banner warn">This link can take ' + left() + ' more. Please choose fewer.</div>' : '';
    icons();
  }

  /* One at a time: a phone on church wifi is not the place to send twelve
     photos at once, and each one takes its own place on the link. */
  function send() {
    var go = document.getElementById('go'); go.disabled = true;
    document.getElementById('files').disabled = true;
    var name = document.getElementById('nm').value;
    var todo = FILES.map(function (f, i) { return { f: f, i: i }; }).filter(function (x) { return !U.refuse(x.f); });
    var done = 0, sent = 0, failed = [];
    document.getElementById('bar').style.display = 'block';
    var setBar = function (part) { document.getElementById('barIn').style.width = Math.round(((done + part) / todo.length) * 100) + '%'; };
    todo.reduce(function (p, x) {
      return p.then(function () {
        var st = document.querySelector('#f' + x.i + ' .st'); st.textContent = 'sending…';
        return U.uploadOne(LINK, x.f, name, setBar).then(function (r) {
          done++; setBar(0);
          if (r.ok) { sent++; st.textContent = 'sent'; st.className = 'st ok'; }
          else { failed.push(r); st.textContent = 'not sent'; st.className = 'st no'; }
        });
      });
    }, Promise.resolve()).then(function () {
      if (sent && !failed.length) {
        wrap('<div class="card"><h1>Thank you</h1><div class="banner ok" id="thanks" style="margin-top:12px">' + ico('check') + ' ' + sent + ' photo' + (sent === 1 ? '' : 's') + ' sent.</div>' +
          '<p class="meta">Someone at the church will look at them before they are used anywhere.</p>' +
          '<p style="margin:16px 0 0"><a href="upload.html?k=' + encodeURIComponent(KEY) + '" style="color:var(--brand)">Send some more</a></p></div>');
        return;
      }
      document.getElementById('msg').innerHTML = '<div class="banner ' + (sent ? 'ok' : 'warn') + '">' + sent + ' sent' +
        (failed.length ? '. Not sent: ' + failed.map(function (r) { return esc(r.name) + ' (' + esc(r.reason) + ')'; }).join('; ') : '') + '</div>';
    });
  }

  if (!KEY) { wrap('<div class="card">This link is missing its key. Use the whole link you were given.</div>'); return; }
  EGBCAuth.optional().then(function () {
    return EGBCAuth.db.collection('uploadLinks').doc(KEY).get();
  }).then(function (s) {
    if (!s.exists) throw new Error('missing');
    LINK = Object.assign({ id: s.id }, s.data());
    draw();
  }).catch(function () {
    wrap('<div class="card">This link could not be found. Check you have the whole link.</div>');
  });
})();
</script>
</body>
</html>
