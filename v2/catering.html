<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catering orders</title>

<script src="egbc-nosend.js?v=202611011200"></script>
<script src="egbc-appmode.js?v=202611011200"></script>
<script src="egbc-shell.js?v=202611011200" data-title="Catering orders"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202611011300"></script>
<script src="egbc-church.js?v=202611011200"></script>
<script src="egbc-events.js?v=202610281600"></script>
<script src="egbc-events-roomday.js?v=202610220900"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#3d6263;--ink:#111827;--body:#374151;--muted:#6b7280;--line:#e5e7eb;--canvas:#f6f7f7;--ok:#15803d;--ok-bg:#ecfdf3;--gold:#b07d2e;--gold-bg:#fdf8ee}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 15px/1.5 Inter,system-ui,-apple-system,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}.sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .hint{color:var(--muted);font-size:13.5px}
  .btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:600 14.5px Inter,sans-serif;cursor:pointer}
  .btn.sec{background:#fff;color:var(--brand)}
  .pill{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:999px;font:600 13px Inter,sans-serif}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.wait{background:var(--gold-bg);color:var(--gold)}
  select{min-height:44px;border-radius:10px;border:1px solid var(--line);padding:0 10px;font:500 15px Inter,sans-serif}
  @media print{.noprint,#egbc-bar,#egbc-shell-top{display:none!important}body{background:#fff}.card{border:0;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Catering orders</h1>
  <p class="sub">Refreshments for room bookings, the next two weeks.</p>
  <div id="app"><p class="hint">Loading…</p></div>
</div>
<script>
(function () {
  'use strict';
  /* THE CATERERS' LIST (F-260): for the "Catering" team, the office (a
     site's bookings admins) and master admins. What the kitchen needs and
     nothing about who booked - cateringOrders, made by the server from each
     confirmed booking with refreshments. Marked prepared, then served. */
  var RD = window.EGBCRoomDay, DAYS = 14, app = document.getElementById('app'), V = { site: '' };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var toast = function (m) { alert(m); };
  function db() { return EGBCAuth.db; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function plus(day, n) { var p = day.split('-').map(Number), t = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)); return t.toISOString().slice(0, 10); }
  var SITES = [], ME = {};
  /* ---- who may do what: by job, never a team's name (H-9; the rules say the same) ---- */
  var JOBP = null;
  function onJob(job) { return !!JOBP && EGBCTeamJobs.teamsFor(JOBP.jobs, job, JOBP.set).some(function (t) { return EGBCAuth.inTeam(t); }); }
  function jobName(job) { return (JOBP && EGBCTeamJobs.label(JOBP.jobs, job, null, JOBP.set)) || ''; }
  function perms(profile) { return EGBCAuth.loadPerms().then(function (P) { JOBP = P; return profile; }, function () { return profile; }); }
  function load() {
    var from = today(), to = plus(from, DAYS);
    return db().collection('cateringOrders').where('siteId', '==', V.site).get().then(function (s) {
      var orders = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (o) { return o.day >= from && o.day <= to; });
      var box = document.createElement('div');
      app.innerHTML = (SITES.length > 1 ? '<div class="noprint" style="margin:0 0 12px"><label class="hint" for="c-site">Site</label> <select id="c-site">' + SITES.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === V.site ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div>' : '');
      app.appendChild(box);
      RD.drawCatering(box, { orders: orders, db: db(), me: ME, days: DAYS, reload: load, toast: toast, fmtDate: function (d) { return EGBCEvents.fmtDate(d + 'T12:00'); } });
      var sel = document.getElementById('c-site'); if (sel) sel.onchange = function () { V.site = this.value; load(); };
    }, function (e) { app.innerHTML = '<div class="card">The orders could not be loaded: ' + esc(e.message || e) + '</div>'; });
  }
  EGBCAuth.require().then(perms).then(function (profile) {
    ME = { uid: (EGBCAuth.user() || {}).uid, name: (profile || {}).name || '' };
    var all = (EGBCAuth.isMaster && EGBCAuth.isMaster()) || (EGBCAuth.isAdmin && EGBCAuth.isAdmin()) || onJob('catering');
    return db().collection('sites').where('active', '==', true).get().then(function (s) {
      var sites = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      if (all) return sites;
      /* otherwise the sites this person is a bookings admin of - nobody's,
         while a master admin views the site as someone else */
      var mid = (EGBCAuth.viewingAs && EGBCAuth.viewingAs()) ? '' : ((profile || {}).memberId || '');
      if (!mid) return [];
      return Promise.all(sites.map(function (x) { return db().collection('bookingSettings').doc(x.id).get().then(function (b) { return b.exists && (b.data().bookingsAdmins || []).indexOf(mid) >= 0 ? x : null; }, function () { return null; }); }))
        .then(function (r) { return r.filter(Boolean); });
    });
  }).then(function (sites) {
    SITES = sites || [];
    if (!SITES.length) { app.innerHTML = '<div class="card"><p style="margin:0" id="whoFor">This page is for the caterers (' + esc(jobName('catering') || 'nobody yet') + ') and the church office.</p></div>'; return; }
    V.site = SITES[0].id;
    return load();
  }).catch(function (e) { app.innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
})();
</script>
</body>
</html>
