<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The building</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-appmode.js?v=202610152310"></script>
<script src="egbc-shell.js?v=202610160500" data-title="The building"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js?v=202610160500"></script>
<script src="egbc-guard.js?v=202610121600"></script>
<script src="egbc-church.js?v=202610121600"></script>
<script src="egbc-events.js?v=202610161700"></script>
<script src="egbc-compliance.js?v=202610191800"></script>
<script src="egbc-compliance-templates.js?v=202610191800"></script>
<script src="egbc-compliance-store.js?v=202610191800"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#3d6263;--ink:#111827;--body:#374151;--muted:#6b7280;--line:#e5e7eb;--canvas:#f6f7f7;--red:#b0392c;--red-bg:#fdecea;--amber:#b07d2e;--amber-bg:#fdf6e9;--green:#15803d;--green-bg:#ecfdf3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 16px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(32px + env(safe-area-inset-bottom))}
  .bar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .bar b{color:var(--ink);font-size:18px}
  .backb{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;font-size:18px;background:#fff;cursor:pointer;flex:none}
  h1{font-size:22px;color:var(--ink);margin:0 0 2px}.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
  .report{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;width:100%;border:0;border-radius:16px;background:var(--red);color:#fff;font:700 19px Inter,sans-serif;margin:0 0 14px;cursor:pointer}
  .sec{font:700 13px Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px}
  .item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px;display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;min-height:64px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
  .dot{width:12px;height:12px;border-radius:50%}.red{background:var(--red)}.amber{background:var(--amber)}.green{background:var(--green)}.grey{background:#9ca3af}
  .t{color:var(--ink);font-weight:600}.m{font-size:13.5px;color:var(--muted)}.chev{color:var(--muted);font-size:20px}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eef5f4;color:var(--brand);margin-top:2px}
  .pill.basis-legal{background:#e8eefb;color:#1e3a8a}.pill.basis-practice{background:#f3f4f6;color:#4b5563}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:14px;font:700 17px Inter,sans-serif;background:var(--brand);color:#fff;border:0;width:100%;margin:8px 0;cursor:pointer}
  .btn.sec2{background:#fff;color:var(--ink);border:1px solid #d1d5db}
  .btn[disabled]{opacity:.6}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px}
  label.l{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:10px 0 4px}
  .inp,select,textarea{width:100%;min-height:48px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;font:inherit;background:#fff;color:var(--ink)}
  textarea{padding:10px 12px;min-height:72px}
  .tick{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;min-height:56px;border-top:1px solid var(--line);cursor:pointer}
  .tick:first-of-type{border-top:0}
  .tick input{width:32px;height:32px;accent-color:var(--brand);margin:0 6px}
  .room{font:700 15px Inter,sans-serif;color:var(--ink);margin:4px 0 0}
  .warn{background:var(--amber-bg);color:#7a5a1f;border-radius:10px;padding:8px 10px;font-size:13.5px;margin:6px 0 0}
  .done{background:var(--green-bg);border-radius:16px;padding:22px 16px;text-align:center;color:var(--green)}.done b{display:block;font-size:22px;margin:6px 0}
  .guide{font-size:12.5px;color:var(--muted);text-align:center;margin:12px 4px 0}
  .said{font-size:14px;color:var(--muted);min-height:20px;margin:4px 0 0}
  .chk{display:flex;gap:10px;align-items:center;min-height:48px}.chk input{width:22px;height:22px}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card">Loading…</div></div>
<script>
(function () {
  'use strict';
  /* THE BUILDING (building compliance, Stage 2; F-231), for the people a
     check is given to - Val's "mode" (Martin, 19 Oct): the checks due, the
     jobs to do, and a big "Report a problem". Only her own checks: the rules
     refuse the rest. Due dates and colours come only from
     EGBCCompliance.schedule(). A follow-up IS a Maintenance job. */
  var E = window.EGBCEvents, C = window.EGBCCompliance, T = window.EGBCComplianceTemplates, ST = window.EGBCComplianceStore, esc = E.esc;
  var ME = {}, MID = '', SITES = {}, ROOMS = [], TEMPLATES = [], CHECKS = [], RECORDS = [], JOBS = [], EQUIP = [], KINDS = {}, ITEMS = [];
  var TODAY = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  function db() { return EGBCAuth.db; }
  function $(id) { return document.getElementById(id); }
  function all(s) { return s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; }); }
  function who() { return { uid: (EGBCAuth.user() || {}).uid || '', name: ME.name || '' }; }
  function day(s) { if (!s) return ''; var p = String(s).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }); }
  function label(i) { return '<span class="pill basis-' + esc(i.basis) + '">' + esc(C.BASIS[i.basis] || '') + '</span>'; }
  function site(id) { return (SITES[id] || {}).name || id; }
  function bar(t, back) { return '<div class="bar">' + (back ? '<button class="backb" id="back" aria-label="Back">←</button>' : '') + '<b>' + esc(t) + '</b></div>'; }
  function show(html) { $('wrap').innerHTML = html; window.scrollTo(0, 0); if ($('back')) $('back').onclick = home; }

  /* ---- home: due now, jobs to do, coming up ---- */
  function home() {
    var first = (ME.name || '').split(' ')[0];
    var due = ITEMS.filter(function (i) { return i.rag === 'red' || i.rag === 'amber'; });
    var later = ITEMS.filter(function (i) { return i.rag === 'green'; });
    var jobs = JOBS.filter(function (j) { return j.status !== 'done'; });
    var siteNames = Array.from(new Set(CHECKS.map(function (c) { return site(c.siteId); })));
    var row = function (i) { return '<button class="item" data-check="' + esc(i.id) + '" data-rag="' + i.rag + '"><span class="dot ' + i.rag + '"></span><div><div class="t">' + esc(i.title) + '</div><div class="m">' + esc(site(i.siteId)) + ' · ' + esc(i.why) + '</div>' + label(i) + '</div><span class="chev">›</span></button>'; };
    show('<h1>Hello ' + esc(first) + '</h1><p class="sub">' + (siteNames.length ? esc(siteNames.join(' and ')) + ' · what needs doing' : 'Nothing has been given to you yet.') + '</p>' +
      '<button class="report" id="report">⚠ Report a problem</button>' +
      (due.length ? '<div class="sec">Due now</div><div id="due">' + due.map(row).join('') + '</div>' : (CHECKS.length ? '<div class="card" id="due"><b>Nothing due.</b> Thank you.</div>' : '')) +
      (jobs.length ? '<div class="sec">Jobs to do</div><div id="jobs">' + jobs.map(function (j) {
        var r = j.safety ? (j.due && j.due < TODAY ? 'red' : 'amber') : 'grey';
        return '<a class="item" href="maintenance.html#' + esc(j.id) + '" style="text-decoration:none"><span class="dot ' + r + '"></span><div><div class="t">' + esc(j.what) + '</div><div class="m">' + esc(j.where || site(j.siteId)) + (j.safety ? ' · safety' : '') + (j.due ? ' · due ' + esc(day(j.due)) : '') + '</div></div><span class="chev">›</span></a>';
      }).join('') + '</div>' : '') +
      (later.length ? '<div class="sec">Coming up</div><div id="later">' + later.map(row).join('') + '</div>' : '') +
      '<p class="guide">' + esc(T.GUIDANCE) + '</p>');
    $('report').onclick = function () { report(null); };
    document.querySelectorAll('[data-check]').forEach(function (b) { b.onclick = function () { open(b.getAttribute('data-check')); }; });
  }

  /* ---- one check ---- */
  function open(id) {
    var it = ITEMS.filter(function (x) { return x.id === id; })[0], c = CHECKS.filter(function (x) { return x.id === id; })[0];
    if (!it || !c) return home();
    if (c.kind === 'register') return walk(it, c);
    show(bar(it.title, true) + '<p class="sub">' + esc(site(c.siteId)) + ' · ' + esc(C.everyWords(it.every)) + (it.lastDone ? ' · last done ' + esc(day(it.lastDone)) : '') + '</p>' +
      '<p>' + label(it) + '</p>' + (it.note ? '<div class="card"><div class="t">How</div><div class="m">' + esc(it.note) + '</div></div>' : '') +
      '<div class="card"><label class="l" for="dOn">Done on</label><input class="inp" type="date" id="dOn" value="' + TODAY + '" max="' + TODAY + '">' +
      '<label class="l" for="dFile">Photo or certificate (optional)</label><input class="inp" type="file" id="dFile" accept="image/*,.pdf" style="padding-top:10px">' +
      '<label class="l" for="dNotes">Note (optional)</label><textarea id="dNotes" maxlength="2000"></textarea></div>' +
      '<button class="btn" id="dGo">✓ Done</button><button class="btn sec2" id="wrong">⚠ Something is wrong</button><p class="said" id="dMsg" role="status"></p>' +
      '<p class="guide">"Something is wrong" makes a Maintenance job for it, marked safety.</p>');
    $('dGo').onclick = function () {
      var f = $('dFile').files[0]; $('dGo').disabled = true; $('dMsg').textContent = 'Saving…';
      (f ? upload(c, f) : Promise.resolve([])).then(function (files) {
        return ST.recordDone(db(), c, { doneOn: $('dOn').value, notes: $('dNotes').value, files: files }, who());
      }).then(function () { return done(c); }, function (e) { $('dGo').disabled = false; $('dMsg').textContent = 'Not saved: ' + (e.message || e); });
    };
    $('wrong').onclick = function () { report(c); };
  }

  /* ---- the extinguisher walk-round: room by room, tick each one seen ---- */
  function walk(it, c) {
    var rooms = ROOMS.filter(function (r) { return r.siteId === c.siteId; });
    var reg = C.register({ rooms: rooms, roomKinds: KINDS, equipment: EQUIP, guide: T.FIRE_GUIDE });
    var name = function (t) { return ((T.EQUIPMENT.filter(function (x) { return x[0] === t; })[0]) || [0, t])[1]; };
    var service = c.templateId === 'ext-service';
    show(bar(it.title, true) + '<p class="sub">' + esc(site(c.siteId)) + ' · ' + esc(C.everyWords(it.every)) + ' · ' + (service ? 'tick each one serviced' : 'tick each one as you see it') + '</p><p>' + label(it) + '</p>' +
      reg.map(function (r) {
        var eq = EQUIP.filter(function (e) { return e.roomId === r.roomId && !e.removed; });
        if (!eq.length && !r.missing.length) return '';
        return '<div class="card" data-room="' + esc(r.roomId) + '"><div class="room">' + esc(r.name) + '</div>' +
          eq.map(function (e) { return '<label class="tick"><input type="checkbox" data-eq="' + esc(e.id) + '"><div><div class="t">' + esc(name(e.type)) + (e.label ? ' · ' + esc(e.label) : '') + '</div>' + (e.nextService ? '<div class="m">Service due ' + esc(day(e.nextService)) + '</div>' : '') + '</div></label>'; }).join('') +
          (r.missing.length ? '<div class="warn">The guide suggests ' + esc(r.missing.map(function (m) { return String(m).split('|').map(name).join(' or '); }).join(', ')) + ' here. ' + esc(T.FIRE_GUIDE_NOTE.split('.')[0]) + '.</div>' : '') + '</div>';
      }).join('') + (EQUIP.some(function (e) { return rooms.some(function (r) { return r.id === e.roomId; }); }) ? '' : '<div class="card">Nothing is on the register for this building yet. The office adds them.</div>') +
      '<button class="btn" id="wGo">✓ Done</button><button class="btn sec2" id="wrong">⚠ One is missing or used</button><p class="said" id="dMsg" role="status"></p>');
    var count = function () { var n = document.querySelectorAll('[data-eq]').length, k = document.querySelectorAll('[data-eq]:checked').length; $('wGo').textContent = '✓ Done' + (n ? ': ' + k + ' of ' + n + ' ' + (service ? 'serviced' : 'seen') : ''); };
    document.querySelectorAll('[data-eq]').forEach(function (b) { b.onchange = count; }); count();
    $('wGo').onclick = function () {
      var items = [].map.call(document.querySelectorAll('[data-eq]'), function (b) { return { id: b.getAttribute('data-eq'), ok: b.checked }; });
      $('wGo').disabled = true; $('dMsg').textContent = 'Saving…';
      ST.recordDone(db(), c, { doneOn: TODAY, items: items, notes: items.filter(function (i) { return !i.ok; }).length ? items.filter(function (i) { return !i.ok; }).length + ' not ticked' : '' }, who())
        .then(function () { return done(c); }, function (e) { $('wGo').disabled = false; $('dMsg').textContent = 'Not saved: ' + (e.message || e); });
    };
    $('wrong').onclick = function () { report(c); };
  }

  function done(c) {
    return load().then(function () {
      var it = ITEMS.filter(function (x) { return x.id === c.id; })[0] || {};
      show(bar('The building', true) + '<div class="done" id="doneCard">✓<b>Recorded</b>' + esc(it.title || c.title) + ' · ' + esc(day(it.lastDone || TODAY)) + (it.nextDue ? '<br>Next due ' + esc(day(it.nextDue)) : '') + '</div>' +
        '<button class="btn" id="toList" style="margin-top:16px">Back to the list</button>');
      $('toList').onclick = home;
    });
  }

  /* ---- Report a problem: a Maintenance job (one list). Tied to a check
     when it comes from one; the safety tick suggested from its words. ---- */
  function report(c) {
    var siteIds = Array.from(new Set(CHECKS.map(function (x) { return x.siteId; }).concat(Object.keys(SITES)))).filter(function (s) { return SITES[s]; });
    var rooms = ROOMS.filter(function (r) { return !c || r.siteId === c.siteId; });
    show(bar(c ? 'Something is wrong' : 'Report a problem', true) + (c ? '<p class="sub">' + esc(c.title) + ' · ' + esc(site(c.siteId)) + '</p>' : '') +
      '<div class="card">' + (c ? '' : '<label class="l" for="rSite">Which building?</label><select id="rSite">' + siteIds.map(function (s) { return '<option value="' + esc(s) + '">' + esc(site(s)) + '</option>'; }).join('') + '</select>') +
      '<label class="l" for="rRoom">Where?</label><select id="rRoom"><option value="">Somewhere else / outside</option></select>' +
      '<label class="l" for="rWhat">What is wrong?</label><input class="inp" id="rWhat" maxlength="200" placeholder="e.g. Emergency light by the side exit not working">' +
      '<label class="chk"><input type="checkbox" id="rSafety"' + (c ? ' checked' : '') + '> It is a safety problem</label></div>' +
      '<button class="btn" id="rGo">Report it</button><p class="said" id="rMsg" role="status"></p>');
    var fill = function () {
      var s = c ? c.siteId : $('rSite').value;
      $('rRoom').innerHTML = '<option value="">Somewhere else / outside</option>' + ROOMS.filter(function (r) { return r.siteId === s; }).map(function (r) { return '<option value="' + esc(r.id) + '">' + esc(r.name) + '</option>'; }).join('');
    };
    if ($('rSite')) $('rSite').onchange = fill; fill();
    var touched = !!c;
    $('rSafety').onchange = function () { touched = true; };
    $('rWhat').oninput = function () { if (!touched) $('rSafety').checked = C.suggestSafety($('rWhat').value); };
    $('rGo').onclick = function () {
      var what = $('rWhat').value.trim(); if (!what) { $('rMsg').textContent = 'Say what is wrong.'; return; }
      var s = c ? c.siteId : $('rSite').value, room = ROOMS.filter(function (r) { return r.id === $('rRoom').value; })[0];
      var ref = db().collection('maintJobs').doc();
      $('rGo').disabled = true; $('rMsg').textContent = 'Sending…';
      ref.set({ siteId: s, roomId: room ? room.id : '', where: room ? room.name : site(s), what: what, details: '', photoPath: '', status: 'todo',
        checkId: c ? c.id : '', safety: $('rSafety').checked, due: '', ownerId: '',
        reportedBy: who().uid, reportedByName: ME.name || '', reportedAt: firebase.firestore.FieldValue.serverTimestamp() })
        .then(function () { return c ? db().collection('complianceLog').doc().set({ siteId: s, what: 'job', by: who().uid, byName: who().name, at: new Date().toISOString(), detail: { jobId: ref.id, checkId: c.id } }) : null; })
        .then(function () {
          show(bar('The building', true) + '<div class="done" id="reported">✓<b>Reported</b>It is on the Maintenance list' + ($('rSafety') && $('rSafety').checked ? ', marked safety' : '') + '.</div><button class="btn" id="toList" style="margin-top:16px">Back to the list</button>');
          $('toList').onclick = function () { load().then(home); };
        }, function (e) { $('rGo').disabled = false; $('rMsg').textContent = 'Not sent: ' + (e.message || e); });
    };
  }

  function upload(c, f) {
    if (f.size > 20 * 1024 * 1024) return Promise.reject(new Error('That file is over 20 MB.'));
    var path = 'compliance/' + c.siteId + '/' + c.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\- ]+/g, '_').slice(-80);
    return EGBCAuth.storage().ref(path).put(f, { contentType: f.type || 'application/octet-stream' }).then(function () { return [{ name: f.name.slice(0, 80), path: path, type: f.type || '' }]; });
  }

  /* ---- loading: MY checks only (the rules refuse anyone else's) ---- */
  function load() {
    return db().collection('buildingChecks').where('responsibleIds', 'array-contains', MID || '-').get().then(function (s) {
      CHECKS = all(s).filter(function (c) { return c.state === 'on'; });
      var ids = CHECKS.map(function (c) { return c.id; }), sites = Array.from(new Set(CHECKS.map(function (c) { return c.siteId; })));
      return Promise.all([
        Promise.all(ids.map(function (id) { return db().collection('checkRecords').where('checkId', '==', id).get().then(all); })),
        db().collection('maintJobs').where('ownerId', '==', MID || '-').get().then(all, function () { return []; }),
        Promise.all(ids.map(function (id) { return db().collection('maintJobs').where('checkId', '==', id).get().then(all, function () { return []; }); })),
        Promise.all(sites.map(function (s) { return db().collection('fireEquipment').where('siteId', '==', s).get().then(all, function () { return []; }); })),
        Promise.all(sites.map(function (s) { return db().collection('roomProfiles').where('siteId', '==', s).get().then(all, function () { return []; }); }))
      ]).then(function (r) {
        RECORDS = [].concat.apply([], r[0]);
        var seen = {}; JOBS = r[1].concat([].concat.apply([], r[2])).filter(function (j) { if (seen[j.id]) return false; seen[j.id] = 1; return true; });
        EQUIP = [].concat.apply([], r[3]);
        KINDS = {}; [].concat.apply([], r[4]).forEach(function (p) { KINDS[p.id] = p.kind; });
        ITEMS = [];
        sites.forEach(function (s) {
          var sc = C.schedule({ profile: {}, templates: TEMPLATES, checks: CHECKS.filter(function (c) { return c.siteId === s; }), records: RECORDS, jobs: JOBS.filter(function (j) { return j.siteId === s; }), triggers: [], today: TODAY });
          sc.items.forEach(function (i) { i.siteId = s; ITEMS.push(i); });
        });
        var order = { red: 0, amber: 1, green: 2, grey: 3 };
        ITEMS = ITEMS.filter(function (i) { return i.state === 'on'; }).sort(function (a, b) { return order[a.rag] - order[b.rag] || String(a.nextDue || '').localeCompare(String(b.nextDue || '')); });
      });
    });
  }

  E.ready().then(function (profile) {
    ME = E.asSeen(profile || {}); MID = ME.memberId || '';
    return Promise.all([
      db().collection('sites').get().then(all, function () { return []; }),
      db().collection('rooms').get().then(all, function () { return []; }),
      db().collection('complianceTemplates').get().then(all, function () { return []; })
    ]).then(function (r) {
      r[0].filter(function (s) { return s.active !== false; }).forEach(function (s) { SITES[s.id] = s; });
      ROOMS = r[1].filter(function (x) { return x.active !== false; });
      TEMPLATES = r[2].length ? r[2] : T.TEMPLATES;
      return load();
    }).then(home);
  }).catch(function (e) { $('wrap').innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
})();
</script>
</body>
</html>
