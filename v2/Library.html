    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root{
            --canvas:#eef4f3; --surface:#fff; --surface-2:#f6faf9; --ink:#14201f; --body:#3a4d4c; --muted:#6b8281; --faint:#93a8a6; --hairline:#dde7e6; --hairline-strong:#c9d8d6; --brand:#3d6263; --brand-dark:#2e4c4d; --brand-tint:#e7f0ef; --brand-ring:rgba(61,98,99,.28); --success:#3b7d23; --success-tint:#e7f1e0; --danger:#b0392c; --danger-tint:#f7e7e4; --gold:#b07d2e; --gold-tint:#f6efe1;
            --shadow-sm:0 1px 2px rgba(20,32,31,.05); --shadow:0 1px 2px rgba(20,32,31,.04),0 6px 20px rgba(20,32,31,.07); --shadow-lg:0 2px 4px rgba(20,32,31,.05),0 18px 48px rgba(20,32,31,.12);
            --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            color: var(--body);
            background-color: var(--canvas);
            font-size: 16px;
        }

        #left {
            width: 340px;
            padding: 22px;
            overflow-y: auto;
            background-color: var(--surface);
            margin: 15px;
            border-radius: var(--r-lg);
            border: 1px solid var(--hairline);
            box-shadow: var(--shadow);
        }

        #right {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--surface);
            margin: 15px 15px 15px 0;
            border-radius: var(--r-lg);
            border: 1px solid var(--hairline);
            box-shadow: var(--shadow);
        }

        .song {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--hairline);
            border-radius: var(--r-md);
            transition: background 0.2s;
        }

        .song:hover { background: var(--surface-2); }

            font-weight: 600;
            font-size: 14px;
            color: var(--ink);

            display: flex;

            margin-top: 4px;

        .stat-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;

            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .stat-total {
            background: var(--brand-tint);
            color: var(--brand);

        .stat-recent {
            background: var(--gold-tint);
            color: var(--gold);
        }

        .stat-recent.warning {
            background: var(--danger-tint);
            color: var(--danger);
        }

        .stat-last {
            background: var(--surface-2);

        .stat-never {

        h2 { color: var(--ink); margin-top: 0; font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
        h3 { color: var(--ink); border-bottom: 1px solid var(--hairline-strong); padding-bottom: 10px; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }

        label {
            display: block;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--muted);
            padding-left: 2px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px 16px;
            margin-bottom: 20px;
            border: 1px solid var(--hairline-strong);
            border-radius: var(--r-md);

            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            color: var(--ink);
            background: var(--surface);

            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-ring);
        }

        button {
            background-color: var(--brand);
            color: #fff;
            padding: 11px 20px;
            border: none;
            border-radius: var(--r-md);
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            transition: background 0.15s;
        }

        button:hover { background-color: var(--brand-dark); }
        button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--brand-ring); }
        button:active { transform: translateY(1px); }

        .delete-btn {
            background-color: var(--danger);
            margin-top: 20px;
            font-size: 13px;
        }

        .delete-btn:hover { background-color: #8f2d23; }

        .status-msg {
            font-size: 11px;
            color: var(--muted);
            margin-top: -15px;
            margin-bottom: 15px;
            height: 15px;
            font-weight: 700;
            padding-left: 6px;
        }

        .file-item {
            background: var(--surface-2);
            border: 1px solid var(--hairline);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: var(--r-md);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-row { display: flex; gap: 15px; align-items: center; }
        .file-row label { margin-bottom: 0; width: 100px; }

        .view-link {
            display: inline-block;
            color: var(--brand);
            text-decoration: underline;
            font-weight: 700;
        }

        .usage-panel {
            background: var(--surface-2);
            border: 1px solid var(--hairline);
            border-radius: var(--r-md);
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .usage-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .usage-stat-number {
            font-size: 24px;
            font-weight: 800;
            color: var(--brand);
            line-height: 1;
        }

        .usage-stat-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
        }

        .usage-divider {
            width: 1px;
            height: 40px;
            background: var(--hairline-strong);
        }

        .usage-last {
            font-size: 13px;
            font-weight: 700;
            color: var(--brand);
        }

        .usage-last-label {
            font-size: 11px;
            color: var(--muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .usage-warning {
            font-size: 11px;
            font-weight: 700;
            color: var(--danger);
            background: var(--danger-tint);
            padding: 4px 12px;
            border-radius: var(--r-pill);
        }

        #stats-loading {
            font-size: 11px;
            color: var(--muted);
            font-weight: 700;
            padding: 4px 0;
        }

        /* CCLI row: input + link button side by side */
        .ccli-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .ccli-row input {
            margin-bottom: 0;
            flex: 1;
        }

        .ccli-link-btn {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--brand-tint);
            color: var(--brand);
            padding: 11px 16px;
            border-radius: var(--r-md);
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .ccli-link-btn:hover {
            background-color: var(--hairline-strong);
        }

        .ccli-link-btn.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* YouTube field: hide the input, show a button instead */
        .youtube-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .youtube-row input {
            /* Keep it in DOM for saving, but hide it visually */
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 0;
            height: 0;
            margin: 0;
            padding: 0;
            border: 0;
        }

        .youtube-open-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #ff0000;
            color: white;
            padding: 11px 20px;
            border-radius: var(--r-md);
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .youtube-open-btn:hover { background-color: #cc0000; }

        .youtube-open-btn.disabled {
            background-color: var(--hairline-strong);
            color: var(--muted);
            pointer-events: none;
        }

        .youtube-edit-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--brand-tint);
            color: var(--brand);
            padding: 11px 16px;
            border-radius: var(--r-md);
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: background 0.2s;
        }

        .youtube-edit-btn:hover { background-color: var(--hairline-strong); }

        .youtube-input-row {
            display: none;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .youtube-input-row.visible { display: flex; }

        .youtube-input-row input {

            position: static;

        }

        /* Mobile: stack the song list above the editor (full width) */
        @media (max-width: 800px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            #left {
                width: auto;

                margin: 15px 15px 8px 15px;

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentDoc = null;
let currentFiles = [];

let servicesCache = null;

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){return /^(https?:|mailto:)/i.test(String(u||'').trim())?String(u).trim():'';}

async function getServicesCache() {
    if (servicesCache) return servicesCache;
    const snap = await db.collection("services").get();
    servicesCache = snap.docs.map(d => d.data());
    return servicesCache;
}

async function getSongUsageStats(songTitle) {
    const services = await getServicesCache();
    const title = songTitle.trim().toLowerCase();

    const matchingDates = [];
    services.forEach(service => {
        if (!service.date || !Array.isArray(service.order)) return;
        const hasSong = service.order.some(item =>
            item.type === "song" && (item.title || "").trim().toLowerCase() === title
        );
        if (hasSong) matchingDates.push(service.date);
    });

    const uniqueDates = [...new Set(matchingDates)];
    const totalCount = uniqueDates.length;

    const threeMonthsAgo = new Date();
    threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
    const threeMonthStr = threeMonthsAgo.toISOString().split("T")[0];
    const recentCount = uniqueDates.filter(d => d >= threeMonthStr).length;

    const sortedDates = [...uniqueDates].sort();
    const lastUsed = sortedDates.length > 0 ? sortedDates[sortedDates.length - 1] : null;

    return { totalCount, recentCount, lastUsed };
}

function formatDate(dateStr) {
    if (!dateStr) return null;
    const [y, m, d] = dateStr.split("-");
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function getKeyOptionsHTML(selectedKey) {
    const keys = [
        { group: "Major Keys", list: ["C", "C#", "Db", "D", "D#", "Eb", "E", "F", "F#", "Gb", "G", "G#", "Ab", "A", "A#", "Bb", "B"] },
        { group: "Minor Keys", list: ["Cm", "C#m", "Dbm", "Dm", "D#m", "Ebm", "Em", "Fm", "F#m", "Gbm", "Gm", "G#m", "Abm", "Am", "A#m", "Bbm", "Bm"] }
    ];
    let options = '<option value="">Select Key</option>';
    keys.forEach(category => {
        options += `<optgroup label="${category.group}">`;
        category.list.forEach(k => {
            options += `<option value="${k}" ${k === selectedKey ? 'selected' : ''}>${k}</option>`;
        });
        options += `</optgroup>`;
    });
    return options;
}

function normalizeTitle(title) { return title.toLowerCase().trim(); }

async function loadSongs() {
    const snapshot = await db.collection("songs").orderBy("normalized").get();
    getServicesCache();
    renderList(snapshot.docs);
}

async function renderList(docs) {
    const list = document.getElementById("list");
    list.innerHTML = docs.map(doc => `
        <div class="song" onclick="openSong('${doc.id.replace(/'/g, "\\'")}')">
            <div class="song-title-text">${escapeHtml(doc.data().title)}</div>
            <div class="song-stats" id="stats-${doc.id}">
                <span class="stat-badge stat-never">Loading...</span>
            </div>
        </div>
    `).join("");

    for (const doc of docs) {
        const stats = await getSongUsageStats(doc.data().title);
        const statsEl = document.getElementById(`stats-${doc.id}`);
        if (!statsEl) continue;

        if (stats.totalCount === 0) {
            statsEl.innerHTML = `<span class="stat-badge stat-never">Never used</span>`;
        } else {
            let html = `<span class="stat-badge stat-total">✦ ${stats.totalCount} total</span>`;
            if (stats.recentCount > 0) {
                const cls = stats.recentCount >= 3 ? "stat-recent warning" : "stat-recent";
                html += `<span class="stat-badge ${cls}">↺ ${stats.recentCount} recent</span>`;
            }
            if (stats.lastUsed) {
                html += `<span class="stat-badge stat-last">Last: ${formatDate(stats.lastUsed)}</span>`;
            }
            statsEl.innerHTML = html;
        }
    }
}

async function searchSongs() {
    const input = document.getElementById("search").value;
    if (!input) { loadSongs(); return; }
    const norm = normalizeTitle(input);
    const snapshot = await db.collection("songs")
        .orderBy("normalized").startAt(norm).endAt(norm + "\uf8ff").get();
    renderList(snapshot.docs);
}

async function openSong(id) {
    const doc = await db.collection("songs").doc(id).get();
    const data = doc.data();
    currentDoc = id;
    currentFiles = data.files || [];
    document.getElementById("editor").style.display = "block";
    document.getElementById("display-title").innerText = data.title;
    document.getElementById("edit-title").value = data.title;
    document.getElementById("artist").value = data.artist || "";
    document.getElementById("youtube").value = data.youtube || "";
    document.getElementById("ccli").value = data.ccli || "";
    document.getElementById("artist-status").innerText = "";

    // Hide youtube edit row when opening a song
    document.getElementById("youtube-input-row").classList.remove("visible");

    updateYoutubeButton();
    updateCcliLink();
    renderFiles();
    renderUsagePanel(data.title);

    if (!data.artist && data.youtube) {
        smartScanArtist();
    }
}

// Update the YouTube open button href and enabled state
function updateYoutubeButton() {
    const url = document.getElementById("youtube").value.trim();
    const btn = document.getElementById("youtube-open-btn");
    if (url) {
        btn.href = url;
        btn.classList.remove("disabled");
    } else {
        btn.href = "#";
        btn.classList.add("disabled");
    }
}

// Toggle youtube edit input row
function toggleYoutubeEdit() {
    const inputRow = document.getElementById("youtube-input-row");
    const isVisible = inputRow.classList.contains("visible");
    if (isVisible) {
        inputRow.classList.remove("visible");
        updateYoutubeButton();
    } else {
        inputRow.classList.add("visible");
        document.getElementById("youtube").focus();
    }
}

// Update the CCLI Song Select link
function updateCcliLink() {
    const ccli = document.getElementById("ccli").value.trim();
    const link = document.getElementById("ccli-link");
    if (ccli) {
        link.href = `https://songselect.ccli.com/Songs/${ccli}`;
        link.classList.remove("disabled");
    } else {
        link.href = "#";
        link.classList.add("disabled");
    }
}

async function renderUsagePanel(songTitle) {
    const panel = document.getElementById("usage-panel");
    panel.innerHTML = `<span id="stats-loading">Loading usage stats...</span>`;

    const stats = await getSongUsageStats(songTitle);

    if (stats.totalCount === 0) {
        panel.innerHTML = `
            <div class="usage-stat">
                <span class="usage-stat-number">0</span>
                <span class="usage-stat-label">Times Used</span>
            </div>
            <div class="usage-divider"></div>
            <span style="font-size:12px; color:#aaa; font-weight:700;">This song hasn't been used yet</span>
        `;
        return;
    }

    const recentWarning = stats.recentCount >= 2
        ? `<span class="usage-warning">⚠ Used ${stats.recentCount}x in last 3 months</span>`
        : "";

    panel.innerHTML = `
        <div class="usage-stat">
            <span class="usage-stat-number">${stats.totalCount}</span>
            <span class="usage-stat-label">All Time</span>
        </div>
        <div class="usage-divider"></div>
        <div class="usage-stat">
            <span class="usage-stat-number" style="color: ${stats.recentCount >= 3 ? '#b22222' : stats.recentCount >= 1 ? '#e65100' : '#3d6263'}">${stats.recentCount}</span>
            <span class="usage-stat-label">Last 3 Months</span>
        </div>
        <div class="usage-divider"></div>
        <div class="usage-stat">
            <span class="usage-last">${stats.lastUsed ? formatDate(stats.lastUsed) : "—"}</span>
            <span class="usage-last-label">Last Used</span>
        </div>
        ${recentWarning ? `<div class="usage-divider"></div>${recentWarning}` : ""}
    `;
}

async function smartScanArtist() {
    const youtubeUrl = document.getElementById("youtube").value;
    const songTitleFromDB = document.getElementById("edit-title").value;
    const status = document.getElementById("artist-status");

    if (!youtubeUrl) return;

    status.innerText = "Scanning YouTube...";

    try {
        const response = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(youtubeUrl)}`);
        const data = await response.json();

        if (data.title) {
            let videoTitle = data.title;
            let artist = "";

            const separators = [" - ", " | ", " // ", " — "];
            let parts = [videoTitle];

            for (let sep of separators) {
                if (videoTitle.includes(sep)) {
                    parts = videoTitle.split(sep);
                    break;
                }
            }

            if (parts.length > 1) {
                const part1 = parts[0].trim();
                const part2 = parts[1].trim();
                if (part1.toLowerCase().includes(songTitleFromDB.toLowerCase())) {
                    artist = part2;
                } else {
                    artist = part1;
                }
            } else {
                const regex = new RegExp(songTitleFromDB.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "gi");
                artist = videoTitle.replace(regex, "");
            }

            artist = artist.replace(/^\s*by\s+/i, "").replace(/\s+by\s*$/i, "").trim();
            artist = artist.replace(/\(.*\)|\[.*\]/g, "")
                           .replace(/lyrics|official video|live|video|audio|hd|4k/gi, "")
                           .replace(/^[:\-\s\u2013\u2014]+|[:\-\s\u2013\u2014]+$/g, "")
                           .trim();

            if (!artist || artist.length < 2) {
                artist = (data.author_name || "").replace("- Topic", "").trim();
            }

            // Only fill the artist when it's currently empty; never overwrite a hand-entered artist.
            const existingArtist = document.getElementById("artist").value.trim();
            if (existingArtist) {
                status.innerText = "";
                return;
            }

            document.getElementById("artist").value = artist;

            if (currentDoc && artist) {
                await db.collection("songs").doc(currentDoc).update({ artist: artist });
                status.innerText = "Artist auto-saved!";
                setTimeout(() => { status.innerText = ""; }, 3000);
            }
        }
    } catch (e) {
        console.log("Auto-scan failed.");
        status.innerText = "";
    }
}

async function deleteSong() {
    if (!currentDoc) return;
    const confirmDelete = confirm("Are you sure you want to permanently delete this song? This cannot be undone.");
    if (!confirmDelete) return;
    try {
        await db.collection("songs").doc(currentDoc).delete();
        alert("Song deleted successfully.");
        document.getElementById("editor").style.display = "none";
        document.getElementById("display-title").innerText = "Select a Song";
        currentDoc = null;
        loadSongs();
    } catch (err) {
        console.error(err);
        alert("Error deleting song.");
    }
}

function renderFiles() {
    const container = document.getElementById("files-container");
    container.innerHTML = currentFiles.map((file, index) => `
        <div class="file-item">
            <div class="file-row"><label>File Name</label><input type="text" value="${escapeHtml(file.name)}" onchange="updateFileMetadata(${index}, 'name', this.value)"></div>
            <div class="file-row"><label>Key</label><select onchange="updateFileMetadata(${index}, 'key', this.value)">${getKeyOptionsHTML(file.key)}</select></div>
            <div class="file-row"><label>Type</label>
                <select onchange="updateFileMetadata(${index}, 'type', this.value)">
                    <option value="Chord Sheet" ${file.type === 'Chord Sheet' ? 'selected' : ''}>Chord Sheet</option>
                    <option value="Lead Sheet" ${file.type === 'Lead Sheet' ? 'selected' : ''}>Lead Sheet</option>
                    <option value="Sheet Music" ${file.type === 'Sheet Music' ? 'selected' : ''}>Sheet Music</option>
                    <option value="Lyrics" ${file.type === 'Lyrics' ? 'selected' : ''}>Lyrics</option>
                    <option value="Other" ${file.type === 'Other' ? 'selected' : ''}>Other</option>
                </select>
            </div>
            <a href="${escapeHtml(safeUrl(file.url))}" target="_blank" class="view-link">View Physical File</a>
        </div>
    `).join("");
}

function updateFileMetadata(index, field, value) { currentFiles[index][field] = value; }

async function save() {
    if (!currentDoc) return;
    const newTitle = document.getElementById("edit-title").value;
    try {
        await db.collection("songs").doc(currentDoc).update({
            title: newTitle,
            normalized: normalizeTitle(newTitle),
            artist: document.getElementById("artist").value,
            youtube: document.getElementById("youtube").value,
            ccli: document.getElementById("ccli").value,
            files: currentFiles
        });
        document.getElementById("display-title").innerText = newTitle;
        alert("All changes saved.");
        loadSongs();
    } catch (err) {
        console.error(err);
        alert("Error saving changes. Please try again.");
    }
}

async function handleLyricsSearch(e) {
    if (e.key !== "Enter") return;
    const text = document.getElementById("lyricsSearch").value;
    if (!text) { loadSongs(); return; }

    try {
        const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(text)}&entity=song&limit=5`);
        const result = await response.json();

        if (!result.results || result.results.length === 0) {
            alert("No matches found online.");
            return;
        }

        const allSongsSnapshot = await db.collection("songs").get();
        const allSongs = allSongsSnapshot.docs;

        const matchingDocs = [];
        const seenIds = new Set();

        for (let item of result.results) {
            const onlineTitle = normalizeTitle(item.trackName);
            const onlineKeywords = onlineTitle.split(' ').filter(w => w.length > 3);

            allSongs.forEach(doc => {
                const dbTitle = normalizeTitle(doc.data().title);
                const isPhraseMatch = dbTitle.includes(onlineTitle) || onlineTitle.includes(dbTitle);
                const matchesMultipleKeywords = onlineKeywords.length > 0 &&
                                              onlineKeywords.filter(k => dbTitle.includes(k)).length >= Math.ceil(onlineKeywords.length / 2);

                if ((isPhraseMatch || matchesMultipleKeywords) && !seenIds.has(doc.id)) {
                    matchingDocs.push(doc);
                    seenIds.add(doc.id);
                }
            });
        }

        if (matchingDocs.length > 0) {
            renderList(matchingDocs);
            if (matchingDocs.length === 1) {
                openSong(matchingDocs[0].id);
            } else {
                alert(`Found ${matchingDocs.length} potential matches for those lyrics.`);
            }
        } else {
            alert(`Found matches like "${result.results[0].trackName}" online, but no similar title exists in your database.`);
        }
    } catch (err) {
        console.error(err);
        alert("Search failed. Check your internet connection.");
    }
}

loadSongs();
</script>
