<!DOCTYPE html>
<html lang="en">
<head>
<script src="egbc-shell.js?v=202609040906" data-title="Rota Planner"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202609040906"></script>
<script src="egbc-guard.js?v=202609040906" data-team="Worship Team" data-role="leader"></script>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest-planner.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#3d6263">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EGBC Rota Planner">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGBC Master Rota Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc, updateDoc, arrayUnion, arrayRemove, deleteField, getDoc, setDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL, uploadBytes, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
            authDomain: "egbc-worship-planner.firebaseapp.com",
            projectId: "egbc-worship-planner",
            storageBucket: "egbc-worship-planner.firebasestorage.app",
            messagingSenderId: "199442060489",
            appId: "1:199442060489:web:7eaf85a76334c753db6918"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const OPTIONAL_ROLES = ['Sound', 'Words', 'Cameras', 'Violin', 'Congas', '2nd Guitar', '2nd Keys', 'Electric Guitar', 'Oboe', 'Trumpet', 'Cahon', 'Singer 1', 'Singer 2', 'Singer 3', 'Other', 'Other 2', 'Other 3', 'Choir'];
        const MANDATORY_SUNDAY_ROLES = ["Worship Leader", "Keyboard", "Guitar", "Drums", "Bass", "Sound", "Words", "Cameras"];
        const EVENT_TYPES = ['Sunday Morning Worship', 'Sunday Team Practice', 'Evening Carol Service', 'Midnight Service', 'Worship and AV Team Meeting', 'All Team Practice', 'Core Team Meeting', 'Worship Team Meeting', 'AV Team Meeting', 'Song Writing Workshop', 'LOUD Worship'];
        const AV_ROLES = ["Sound", "Words", "Cameras"];

        /* ---- Kids Church ------------------------------------------------
           Slots on the rota, which are not quite the same as the abilities
           held in the address book: a person ticks "Helper" once, but a week
           can carry up to five helper slots. Which group each helper takes is
           decided when the week is planned, not here - that is how Karen and
           Simon work, and forcing it at rota stage would break it. */
        const KIDS_FIXED_ROLES = ['Session Leader',
            'Leader (Younger)', 'Leader (Older)', 'Leader (Creche)',
            'Assistant (Younger)', 'Assistant (Older)', 'Assistant (Creche)'];
        const KIDS_HELPER_SLOTS = ['Helper 1', 'Helper 2', 'Helper 3', 'Helper 4', 'Helper 5'];
        const KIDS_ROLES = [...KIDS_FIXED_ROLES, ...KIDS_HELPER_SLOTS];

        /* The standard Sunday. Provisional until Karen confirms it - change
           this line and nothing else. */
        const KIDS_MANDATORY_ROLES = ['Session Leader',
            'Leader (Younger)', 'Leader (Older)', 'Leader (Creche)', 'Helper 1'];

        /* A rota slot maps to the ability ticked in the address book.
           "Helper 4" is just a Helper. */
        const roleAbility = r => /^Helper \d+$/.test(r) ? 'Helper' : r;

        /* Which team owns a slot. This is what makes one rota show each
           person only their own part of it. */
        function roleTeam(r) {
            if (AV_ROLES.includes(r)) return 'AV Team';
            if (KIDS_ROLES.includes(r) || /^Helper \d+$/.test(r)) return 'Kids Church';
            return 'Worship Team';
        }

        /* null means "everything". A master admin sees the lot - and if a
           master admin is previewing another team, EGBCAuth reports that team
           here, so this needs no special case of its own. */
        function myRotaTeams() {
            if (typeof EGBCAuth === 'undefined') return null;
            try {
                if (EGBCAuth.isMaster()) return null;
                const areas = EGBCAuth.adminAreas() || [];
                return areas.length ? areas : null;
            } catch (e) { return null; }
        }

        function canEditRole(r) {
            const mine = myRotaTeams();
            return !mine || mine.includes(roleTeam(r));
        }

        /* Every team that actually has a slot somewhere in this term. A term
           with no Kids Church slots needs no Kids Church sign-off, so nothing
           changes for Worship until Kids Church starts using it. */
        function teamsInTerm(termLabel) {
            const out = new Set();
            cachedEvents.filter(e => e.termLabel === termLabel && !e.archived)
                .forEach(e => (e.roles || []).forEach(r => out.add(roleTeam(r))));
            return [...out];
        }

        /* ---- sign-off ---------------------------------------------------
           One rota, built by several people at different times. Sending it
           before everyone has finished means someone on two teams gets an
           email with half their duties on it. Each team says when its part is
           done, and sending waits for all of them. */
        let signoffs = {};        /* "Autumn 2026__Kids Church" -> {by, at} */

        const signoffKey = (term, team) => term + '__' + team;

        async function loadSignoffs() {
            try {
                const snap = await getDocs(collection(db, "rotaSignoff"));
                signoffs = {};
                snap.forEach(d => { signoffs[d.id] = d.data(); });
            } catch (e) { console.warn('sign-off read failed', e); }
        }

        window.setSignoff = async (termLabel, team, ready) => {
            const key = signoffKey(termLabel, team);
            try {
                if (ready) {
                    const who = (typeof EGBCAuth !== 'undefined' && EGBCAuth.profile && EGBCAuth.profile())
                        ? (EGBCAuth.profile().name || EGBCAuth.profile().email) : 'someone';
                    await setDoc(doc(db, "rotaSignoff", key), {
                        term: termLabel, team: team, by: who, at: new Date()
                    });
                } else {
                    await deleteDoc(doc(db, "rotaSignoff", key));
                }
                await loadSignoffs();
                renderEvents();
            } catch (e) { alert('Could not save that: ' + e.message); }
        };

        /* Any change to a team's part of a term withdraws that team's
           sign-off. Without this a sign-off would describe the rota as it was
           when someone pressed the button, which is not the same thing. */
        async function clearSignoff(eventId, team) {
            const ev = cachedEvents.find(e => e.id === eventId);
            if (!ev || !ev.termLabel) return;
            const teams = team ? [team] : teamsInTerm(ev.termLabel);
            for (const t of teams) {
                const key = signoffKey(ev.termLabel, t);
                if (!signoffs[key]) continue;
                try { await deleteDoc(doc(db, "rotaSignoff", key)); delete signoffs[key]; }
                catch (e) { console.warn('sign-off clear failed', e); }
            }
        }

        /* Who still has to finish before this term can go out. */
        function outstandingTeams(termLabel) {
            return teamsInTerm(termLabel).filter(t => !signoffs[signoffKey(termLabel, t)]);
        }

        function signoffStrip(term) {
            const teams = teamsInTerm(term);
            if (!teams.length) return '';
            const mine = myRotaTeams();
            let h = '<div class="flex items-center gap-2 flex-wrap">';
            teams.forEach(t => {
                const done = signoffs[signoffKey(term, t)];
                const canPress = !mine || mine.includes(t);
                const label = t.replace(' Team', '');
                if (done) {
                    const title = 'Signed off by ' + (done.by || 'someone').replace(/"/g, '');
                    h += '<button title="' + title + '" ' +
                         (canPress ? 'onclick="setSignoff(\'' + term + '\',\'' + t + '\',false)"' : 'disabled') +
                         ' class="text-[10px] bg-white text-[#3d6263] px-4 py-1 rounded-full uppercase font-bold">'
                       + '&#10003; ' + label + '</button>';
                } else if (canPress) {
                    h += '<button onclick="setSignoff(\'' + term + '\',\'' + t + '\',true)" ' +
                         'class="text-[10px] bg-white/20 px-4 py-1 rounded-full uppercase font-bold hover:bg-white/40">'
                       + label + ' not done</button>';
                } else {
                    h += '<span class="text-[10px] bg-white/10 px-4 py-1 rounded-full uppercase font-bold opacity-70">'
                       + label + ' waiting</span>';
                }
            });
            h += '</div>';
            return h;
        }

        let collapsedTerms = new Set();
        let expandedEvents = new Set();
        let openBuckets = new Set();
        let cachedEvents = [];
        let addressBook = [];
        let availability = {};
        let logoBase64 = null;
        let logoNaturalWidth = 1;
        let logoNaturalHeight = 1;
        let hideAssigned = false;

        const FORM_LINK = "https://esherchurch.github.io/availability-form/";

        let logoLoadPromise = null;
        const getLogoBase64 = () => {
            if (logoLoadPromise) return logoLoadPromise;
            logoLoadPromise = new Promise(async (resolve) => {
                try {
                    const url = await getDownloadURL(ref(storage, '1774936285076.png'));
                    const img = new Image();
                    img.setAttribute('crossOrigin', 'anonymous');
                    img.onload = () => {
                        logoNaturalWidth = img.naturalWidth;
                        logoNaturalHeight = img.naturalHeight;
                        const canvas = document.createElement("canvas");
                        canvas.width = img.width; canvas.height = img.height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0);
                        logoBase64 = canvas.toDataURL("image/jpeg", 1.0);
                        resolve(logoBase64);
                    };
                    img.onerror = () => resolve(null);
                    img.src = url + "?c=" + new Date().getTime();
                } catch (e) { resolve(null); }
            });
            return logoLoadPromise;
        };
        getLogoBase64();

        function getTermLabel(dateString) {
            const d = new Date(dateString);
            const month = d.getMonth() + 1;
            const year = d.getFullYear();
            let term = (month <= 4) ? "Spring" : (month <= 8) ? "Summer" : "Autumn";
            return `${term} ${year}`;
        }

        onSnapshot(collection(db, "addressBook"), (snap) => {
            addressBook = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const select = document.getElementById('memberPdfSelect');
            if (select) {
                const currentVal = select.value;
                select.innerHTML = '<option value="">Select Member...</option>';
                addressBook.sort((a,b) => a.name.localeCompare(b.name)).forEach(m => {
                    select.innerHTML += `<option value="${m.id}">${m.name}</option>`;
                });
                select.value = currentVal;
            }
            renderPlanner();
        });

        onSnapshot(collection(db, "availability"), (snap) => {
            availability = {};
            snap.forEach(d => {
                const data = d.data();
                if (!availability[data.eventId]) availability[data.eventId] = {};
                availability[data.eventId][data.memberId] = data.status;
            });
            renderPlanner();
        });

        onSnapshot(query(collection(db, "events"), orderBy("date")), (snap) => {
            cachedEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderPlanner();
            populateSendTermSelect();
            loadSignoffs().then(renderPlanner);
        });

        // ── POPULATE TERM SELECT IN SEND MODAL ─────────────────────────
        function populateSendTermSelect() {
            const sel = document.getElementById('sendTermSelect');
            if (!sel) return;
            const terms = [...new Set(cachedEvents.filter(e => !e.archived).map(e => e.termLabel).filter(Boolean))].sort();
            const current = sel.value;
            sel.innerHTML = '<option value="">All active terms</option>';
            terms.forEach(t => {
                sel.innerHTML += `<option value="${t}"${t === current ? ' selected' : ''}>${t}</option>`;
            });
        }

        window.toggleHideAssigned = () => {
            hideAssigned = !hideAssigned;
            renderPlanner();
        };

        window.toggleTermCollapse = (termId) => {
            collapsedTerms.has(termId) ? collapsedTerms.delete(termId) : collapsedTerms.add(termId);
            renderPlanner();
        };

        window.toggleEventExpand = (eventId) => {
            expandedEvents.has(eventId) ? expandedEvents.delete(eventId) : expandedEvents.add(eventId);
            renderPlanner();
        };

        window.toggleBucket = (eventId) => {
            openBuckets.has(eventId) ? openBuckets.delete(eventId) : openBuckets.add(eventId);
            renderPlanner();
        };

        window.updateField = async (id, field, value) => {
            const updates = { [field]: value };
            if (field === 'date') updates.termLabel = getTermLabel(value);
            await updateDoc(doc(db, "events", id), updates);
        };

        window.toggleTeam = async (eventId, teamName) => {
            const eventRef = doc(db, "events", eventId);
            const eventSnap = await getDoc(eventRef);
            if (!eventSnap.exists()) return;
            const currentTeams = eventSnap.data().teams || [];
            const adding = !currentTeams.includes(teamName);
            const newTeams = adding ? [...currentTeams, teamName] : currentTeams.filter(t => t !== teamName);
            const updates = { teams: newTeams };

            /* Ticking Kids Church puts its standard slots on the week, the way
               a new Sunday already arrives with the worship ones. Unticking
               takes back only the empty ones - anybody already rostered stays,
               so a mis-click cannot quietly wipe Karen's work. */
            if (teamName === 'Kids Church') {
                const ev = eventSnap.data();
                const roles = new Set(ev.roles || []);
                if (adding) {
                    KIDS_MANDATORY_ROLES.forEach(r => roles.add(r));
                } else {
                    KIDS_ROLES.forEach(r => { if (!ev.assignments?.[r]) roles.delete(r); });
                }
                updates.roles = [...roles];
            }

            await updateDoc(eventRef, updates);
            if (teamName === 'Kids Church') await clearSignoff(eventId, 'Kids Church');
        };

        window.addRole = async (eventId, roleName) => {
            if(!roleName) return;
            await updateDoc(doc(db, "events", eventId), { roles: arrayUnion(roleName) });
            await clearSignoff(eventId, roleTeam(roleName));
        };

        window.removeRole = async (eventId, roleName) => {
            if(confirm(`Remove role "${roleName}"?`)) {
                const updates = { roles: arrayRemove(roleName) };
                updates[`assignments.${roleName}`] = deleteField();
                await updateDoc(doc(db, "events", eventId), updates);
                await clearSignoff(eventId, roleTeam(roleName));
            }
        };

        window.assignPerson = async (eventId, role, personId, personName) => {
            const updates = {};
            updates[`assignments.${role}`] = { id: personId, name: personName };
            await updateDoc(doc(db, "events", eventId), updates);
        };

        window.unassignPerson = async (eventId, role) => {
            const updates = {};
            updates[`assignments.${role}`] = deleteField();
            await updateDoc(doc(db, "events", eventId), updates);
        };

        // Remove a single person from a multi-person role
        window.unassignOnePerson = async (eventId, role, personId) => {
            const ev = cachedEvents.find(e => e.id === eventId);
            const raw = ev?.assignments?.[role];
            const current = Array.isArray(raw) ? raw : (raw ? [raw] : []);
            const remaining = current.filter(p => p.id !== personId);
            const updates = {};
            updates[`assignments.${role}`] = remaining.length > 0 ? remaining : deleteField();
            await updateDoc(doc(db, "events", eventId), updates);
        };

        // Called from data-attribute inputs — avoids inline JS string escaping issues
        window.quickAssignFromEl = async (el) => {
            const eventId = el.dataset.evid;
            const role = el.dataset.role;
            const name = el.value.trim();
            if (!eventId || !role) return;
            await quickAssign(eventId, role, name);
        };

        // Quick-assign from the header text inputs (Service Leader / Speaker)
        window.quickAssign = async (eventId, role, name) => {
            const updates = {};
            if (!name || !name.trim()) {
                updates[`assignments.${role}`] = deleteField();
            } else {
                const member = addressBook.find(m => m.name?.trim().toLowerCase() === name.trim().toLowerCase());
                updates[`assignments.${role}`] = [{ id: member?.id || name.trim(), name: name.trim() }];
            }
            try {
                await updateDoc(doc(db, "events", eventId), updates);
                // Brief visual confirmation on the input
                const inputs = document.querySelectorAll(`input[data-qid="${eventId}-${role}"]`);
                inputs.forEach(el => { el.style.borderColor = '#3b7d23'; setTimeout(() => { el.style.borderColor = ''; }, 1500); });
            } catch(e) {
                console.error('quickAssign failed', e);
                alert('Save failed: ' + e.message);
            }
        };

        window.deleteEvent = async (eventId) => {
            if(confirm("Permanently delete this service?")) await deleteDoc(doc(db, "events", eventId));
        };

        window.archiveTerm = async (termLabel) => {
            if(confirm(`Archive all services in ${termLabel}?`)) {
                const toArchive = cachedEvents.filter(e => e.termLabel === termLabel);
                for (const ev of toArchive) {
                    await updateDoc(doc(db, "events", ev.id), { archived: true });
                }
            }
        };

        // ── UNARCHIVE ───────────────────────────────────────────────────
        window.unarchiveTerm = async (termLabel) => {
            if(confirm(`Restore all services in ${termLabel} back to active?`)) {
                const toRestore = cachedEvents.filter(e => e.termLabel === termLabel && e.archived);
                for (const ev of toRestore) {
                    await updateDoc(doc(db, "events", ev.id), { archived: false });
                }
            }
        };

        window.onDragStart = (e, personId, personName, eventId = null, role = null) => {
            e.dataTransfer.setData("personId", personId);
            e.dataTransfer.setData("personName", personName);
            if(eventId && role) {
                e.dataTransfer.setData("sourceEventId", eventId);
                e.dataTransfer.setData("sourceRole", role);
            }
        };

        window.onDropRole = async (e, eventId, role) => {
            e.preventDefault();
            const personId = e.dataTransfer.getData("personId");
            const personName = e.dataTransfer.getData("personName");
            const sourceEventId = e.dataTransfer.getData("sourceEventId");
            const sourceRole = e.dataTransfer.getData("sourceRole");
            if(sourceEventId === eventId && sourceRole) {
                await unassignPerson(sourceEventId, sourceRole);
            }
            await assignPerson(eventId, role, personId, personName);
        };

        window.onDropBucket = async (e, eventId, targetStatus = null) => {
            e.preventDefault();
            const personId = e.dataTransfer.getData("personId");
            const sourceEventId = e.dataTransfer.getData("sourceEventId");
            const sourceRole = e.dataTransfer.getData("sourceRole");

            if(sourceEventId && sourceRole) {
                await unassignPerson(sourceEventId, sourceRole);
            }

            if(targetStatus && eventId && personId) {
                const availQuery = query(collection(db, "availability"), where("eventId", "==", eventId), where("memberId", "==", personId));
                const snap = await getDocs(availQuery);

                if (targetStatus === 'pending') {
                    for (const d of snap.docs) {
                        await deleteDoc(doc(db, "availability", d.id));
                    }
                } else {
                    if (!snap.empty) {
                        await updateDoc(doc(db, "availability", snap.docs[0].id), { status: targetStatus });
                    } else {
                        await addDoc(collection(db, "availability"), { eventId, memberId: personId, status: targetStatus });
                    }
                }
            }
        };

        window.addSingleLine = async () => {
            const dateStr = new Date().toISOString().split('T')[0];
            await addDoc(collection(db, "events"), {
                date: dateStr, termLabel: getTermLabel(dateStr), type: "Sunday Morning Worship", description: "",
                teams: ["Worship Team", "AV Team"], startTime: "08:00", endTime: "11:30", roles: MANDATORY_SUNDAY_ROLES, archived: false
            });
        };

        window.generateTerm = async () => {
            const term = document.getElementById('termSelect').value;
            if(!term) return alert("Select a Term");
            const year = new Date().getFullYear();
            let curr = new Date(`${year}-${term === 'Spring' ? '01' : term === 'Summer' ? '05' : '09'}-01`);
            let end = new Date(`${year}-${term === 'Spring' ? '04' : term === 'Summer' ? '08' : '12'}-31`);
            while (curr.getDay() !== 0) curr.setDate(curr.getDate() + 1);
            while (curr <= end) {
                const dateStr = curr.toISOString().split('T')[0];
                await addDoc(collection(db, "events"), {
                    date: dateStr, termLabel: getTermLabel(dateStr), type: "Sunday Morning Worship", description: "",
                    teams: ["Worship Team", "AV Team"], startTime: "08:00", endTime: "11:30", roles: MANDATORY_SUNDAY_ROLES, archived: false
                });
                curr.setDate(curr.getDate() + 7);
            }
        };

        window.addThursdayPractices = async () => {
            const term = document.getElementById('termSelect').value;
            if(!term) return alert("Select a Term");
            const year = new Date().getFullYear();
            let curr = new Date(`${year}-${term === 'Spring' ? '01' : term === 'Summer' ? '05' : '09'}-01`);
            let end = new Date(`${year}-${term === 'Spring' ? '04' : term === 'Summer' ? '08' : '12'}-31`);
            while (curr.getDay() !== 4) curr.setDate(curr.getDate() + 1);
            while (curr <= end) {
                const dateStr = curr.toISOString().split('T')[0];
                await addDoc(collection(db, "events"), {
                    date: dateStr, termLabel: getTermLabel(dateStr), type: "Sunday Team Practice", description: "Thursday Rehearsal",
                    teams: ["Worship Team"], startTime: "19:30", endTime: "21:30", roles: ["Worship Leader", "Keyboard", "Guitar", "Drums", "Bass"], archived: false
                });
                curr.setDate(curr.getDate() + 7);
            }
        };

        window.autoFillPractice = async (practiceId, silent = false) => {
            const practice = cachedEvents.find(e => e.id === practiceId);
            if(!practice) return;
            const practiceDate = new Date(practice.date);
            const sundayService = cachedEvents.find(e => {
                const eDate = new Date(e.date);
                const diff = (eDate - practiceDate) / (1000 * 60 * 60 * 24);
                return e.type === "Sunday Morning Worship" && diff > 0 && diff <= 4;
            });
            if(!sundayService) {
                if(!silent) alert("No Sunday Worship found within 4 days after this practice.");
                return;
            }
            const updates = {};
            const roles = practice.roles || sundayService.roles || [];
            roles.forEach(role => {
                const sundayPerson = sundayService.assignments?.[role];
                if(sundayPerson) {
                    updates[`assignments.${role}`] = { id: sundayPerson.id, name: sundayPerson.name };
                }
            });
            if(Object.keys(updates).length > 0) {
                await updateDoc(doc(db, "events", practiceId), updates);
            }
        };

        window.autoFillAllEvents = async () => {
            if (!confirm("Auto-populate all Sunday services and sync practices?")) return;

            const activeEvents = cachedEvents.filter(e => !e.archived).sort((a,b) => new Date(a.date) - new Date(b.date));
            const sundayEvents = activeEvents.filter(e => e.type === "Sunday Morning Worship");
            const practiceEvents = activeEvents.filter(e => e.type !== "Sunday Morning Worship");

            const lastServed = {};
            sundayEvents.forEach(ev => {
                Object.values(ev.assignments || {}).forEach(raw => {
                    const people = Array.isArray(raw) ? raw : [raw];
                    people.forEach(a => {
                        const d = new Date(ev.date);
                        if (!lastServed[a.id] || d > lastServed[a.id]) lastServed[a.id] = d;
                    });
                });
            });
            const monthlyCounts = {};
            /* The same tally, split by department. maxFrequency limits the
               total; teamCaps limits how much of it any one team may take. */
            const teamCounts = {};

            for (const ev of sundayEvents) {
                const monthKey = new Date(ev.date).toLocaleString('en-GB', { month: 'long', year: 'numeric' });
                if (!monthlyCounts[monthKey]) monthlyCounts[monthKey] = {};
                if (!teamCounts[monthKey]) teamCounts[monthKey] = {};

                const evDate = new Date(ev.date);
                const members = addressBook.filter(m =>
                    availability[ev.id]?.[m.id] === 'avail' &&
                    (ev.teams?.some(t => m.markers?.includes(t)) || (ev.teams?.includes("Youth") && m.markers?.includes("Youth Worship")))
                );
                const alreadyAssignedToday = new Set(Object.values(ev.assignments || {}).flatMap(raw => Array.isArray(raw) ? raw.map(p=>p.id) : [raw.id]));
                const assignments = { ...(ev.assignments || {}) };
                const liveRoles = new Set(ev.roles || []);

                const tryAssign = (roleName, instrumentName, isPrimaryOnly) => {
                    if (assignments[roleName]) return false;
                    /* Never fill a slot belonging to a department you do not
                       run. Karen pressing AutoFill must not touch worship. */
                    if (!canEditRole(roleName)) return false;
                    let candidates = members.filter(m => {
                        if (alreadyAssignedToday.has(m.id)) return false;
                        if ((monthlyCounts[monthKey][m.id] || 0) >= (parseInt(m.maxFrequency) || 2)) return false;
                        /* maxFrequency is the total across everything. teamCaps
                           is how much of that total any one department may use,
                           which is what stops three Kids Church weeks eating a
                           month that was meant to cover worship as well. */
                        const cap = (m.teamCaps || {})[roleTeam(roleName)];
                        if (cap !== undefined) {
                            const usedHere = (teamCounts[monthKey] && teamCounts[monthKey][m.id]
                                && teamCounts[monthKey][m.id][roleTeam(roleName)]) || 0;
                            if (usedHere >= cap) return false;
                        }
                        const hasInst = isPrimaryOnly
                            ? m.primaryInstruments?.includes(instrumentName)
                            : (m.primaryInstruments?.includes(instrumentName) || m.secondaryInstruments?.includes(instrumentName));
                        return hasInst;
                    });

                    candidates.sort((a, b) => {
                        const aYouth = a.markers?.includes("Youth Worship") ? 1 : 0;
                        const bYouth = b.markers?.includes("Youth Worship") ? 1 : 0;
                        if (aYouth !== bYouth) return aYouth - bYouth;
                        const aPrimary = a.primaryInstruments?.includes(instrumentName) ? 0 : 1;
                        const bPrimary = b.primaryInstruments?.includes(instrumentName) ? 0 : 1;
                        if (aPrimary !== bPrimary) return aPrimary - bPrimary;
                        const aLast = lastServed[a.id] ? (evDate - lastServed[a.id]) : Infinity;
                        const bLast = lastServed[b.id] ? (evDate - lastServed[b.id]) : Infinity;
                        return bLast - aLast;
                    });

                    if (candidates.length > 0) {
                        const chosen = candidates[0];
                        assignments[roleName] = { id: chosen.id, name: chosen.name };
                        alreadyAssignedToday.add(chosen.id);
                        monthlyCounts[monthKey][chosen.id] = (monthlyCounts[monthKey][chosen.id] || 0) + 1;
                        const rt = roleTeam(roleName);
                        if (!teamCounts[monthKey][chosen.id]) teamCounts[monthKey][chosen.id] = {};
                        teamCounts[monthKey][chosen.id][rt] = (teamCounts[monthKey][chosen.id][rt] || 0) + 1;
                        lastServed[chosen.id] = evDate;
                        liveRoles.add(roleName);
                        return true;
                    }
                    return false;
                };

                MANDATORY_SUNDAY_ROLES.forEach(r => tryAssign(r, r, true));
                MANDATORY_SUNDAY_ROLES.forEach(r => tryAssign(r, r, false));

                [...liveRoles].filter(r => r.startsWith("Singer")).forEach(r => {
                    tryAssign(r, "Sing", true) || tryAssign(r, "Sing", false);
                });

                const availableSingers = members.filter(m =>
                    !alreadyAssignedToday.has(m.id) &&
                    (m.primaryInstruments?.includes("Sing") || m.secondaryInstruments?.includes("Sing")) &&
                    (monthlyCounts[monthKey][m.id] || 0) < (parseInt(m.maxFrequency) || 2)
                ).sort((a, b) => {
                    const aYouth = a.markers?.includes("Youth Worship") ? 1 : 0;
                    const bYouth = b.markers?.includes("Youth Worship") ? 1 : 0;
                    if (aYouth !== bYouth) return aYouth - bYouth;
                    const aLast = lastServed[a.id] ? (evDate - lastServed[a.id]) : Infinity;
                    const bLast = lastServed[b.id] ? (evDate - lastServed[b.id]) : Infinity;
                    return bLast - aLast;
                });

                for (const m of availableSingers) {
                    let nextIdx = 1;
                    while (liveRoles.has(`Singer ${nextIdx}`)) nextIdx++;
                    const newRole = `Singer ${nextIdx}`;
                    assignments[newRole] = { id: m.id, name: m.name };
                    alreadyAssignedToday.add(m.id);
                    monthlyCounts[monthKey][m.id] = (monthlyCounts[monthKey][m.id] || 0) + 1;
                    lastServed[m.id] = evDate;
                    liveRoles.add(newRole);
                }

                ["Guitar", "Keyboard"].forEach(inst => {
                    const rName = inst === "Guitar" ? "2nd Guitar" : "2nd Keys";
                    if (!liveRoles.has(rName)) {
                        if (tryAssign(rName, inst, true) || tryAssign(rName, inst, false)) liveRoles.add(rName);
                    }
                });

                if (!liveRoles.has("Electric Guitar")) {
                    if (tryAssign("Electric Guitar", "Electric Guitar", true) || tryAssign("Electric Guitar", "Electric Guitar", false)) liveRoles.add("Electric Guitar");
                }

                const extraInstruments = [
                    { role: "Violin", inst: "Violin" },
                    { role: "Trumpet", inst: "Trumpet" },
                    { role: "Congas", inst: "Congas" },
                    { role: "Cahon", inst: "Cahon" },
                ];
                extraInstruments.forEach(({ role, inst }) => {
                    if (!liveRoles.has(role)) {
                        if (tryAssign(role, inst, true) || tryAssign(role, inst, false)) liveRoles.add(role);
                    }
                });

                await updateDoc(doc(db, "events", ev.id), { assignments, roles: [...liveRoles] });
            }

            let practicesSynced = 0;
            for (const practice of practiceEvents) {
                await autoFillPractice(practice.id, true);
                practicesSynced++;
            }

            alert(`Auto-fill complete!\n\nSundays filled: ${sundayEvents.length}\nPractices synced: ${practicesSynced}`);
        };

        function buildICS(events, getMemberEvents) {
            const CRLF = "\r\n";
            const formatDateTime = (dateStr, timeStr) => {
                const [y, m, d] = dateStr.split('-');
                if (timeStr) { const [h, min] = timeStr.split(':'); return `${y}${m}${d}T${h}${min}00`; }
                return `${y}${m}${d}`;
            };
            const escapeICS = str => (str || '').replace(/[\\;,]/g, c => '\\' + c).replace(/\n/g, '\\n');
            let lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//EGBC Worship & AV//Rota//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:EGBC Rota","X-WR-TIMEZONE:Europe/London"];
            events.forEach(ev => {
                const { summary, description, dateStr, startTime, endTime } = getMemberEvents(ev);
                const uid = `egbc-rota-${ev.id}-${dateStr}@esherchurch.org`;
                const dtstamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                lines.push("BEGIN:VEVENT", `UID:${uid}`, `DTSTAMP:${dtstamp}`);
                if (startTime) {
                    lines.push(`DTSTART;TZID=Europe/London:${formatDateTime(dateStr, startTime)}`, `DTEND;TZID=Europe/London:${formatDateTime(dateStr, endTime || startTime)}`);
                } else {
                    lines.push(`DTSTART;VALUE=DATE:${formatDateTime(dateStr, null)}`, `DTEND;VALUE=DATE:${formatDateTime(dateStr, null)}`);
                }
                lines.push(`SUMMARY:${escapeICS(summary)}`, `DESCRIPTION:${escapeICS(description)}`, "END:VEVENT");
            });
            lines.push("END:VCALENDAR");
            return lines.join(CRLF) + CRLF;
        }

                html += '<button onclick="toggleTermCollapse(\'' + term + '\')" class="uppercase font-bold tracking-widest font-montserrat flex items-center gap-2">' + term + '</button>';
                html += signoffStrip(term);
                html += '<button onclick="archiveTerm(\'' + term + '\')" class="text-[10px] bg-white/20 px-4 py-1 rounded-full uppercase font-bold hover:bg-white/40 transition-all">Archive</button>';
                html += '</div>';
                html += '<div class="' + (isCollapsed ? 'hidden' : 'block') + ' bg-white p-6 border-x border-b border-gray-200 rounded-b-[2rem] shadow-inner">';

                const termEventsSorted = grouped[term].sort((a,b) => new Date(a.date) - new Date(b.date));
                const byMonth = {};
                termEventsSorted.forEach(ev => {
                    const month = new Date(ev.date).toLocaleString('en-GB', { month: 'long', year: 'numeric' });
                    if(!byMonth[month]) byMonth[month] = [];
                    byMonth[month].push(ev);
                });

                Object.keys(byMonth).forEach(month => {
                    html += '<div class="mb-10 pb-8"><h3 class="text-sm font-black uppercase text-[#3d6263] opacity-60 mb-6 tracking-[0.2em]">' + month + '</h3>';
                    const blocks = []; let current = [];
                    byMonth[month].forEach(ev => {
                        current.push(ev);
                        if(ev.type === "Sunday Morning Worship") { blocks.push(current); current = []; }
                    });
                    if(current.length > 0) blocks.push(current);
                    blocks.forEach((block, idx) => { block.forEach(ev => { html += generateEventHtml(ev, idx); }); });

                    const stats = {};
                    byMonth[month].forEach(ev => {
                        if(ev.type === 'Sunday Morning Worship' && ev.assignments) {
                            const names = new Set(Object.values(ev.assignments).map(p => p.name));
                            names.forEach(n => { if(n) stats[n] = (stats[n] || 0) + 1; });
                        }
                    });
                    if(Object.keys(stats).length > 0) {
                        html += '<div class="mt-8 bg-[#f0f6f6] rounded-[2rem] p-8 border border-[#d1dfdf] shadow-sm">';
                        html += '<div class="text-xs font-black uppercase text-[#3d6263] mb-6 tracking-widest text-center border-b border-[#d1dfdf] pb-4">Monthly Unique Serving Totals (Sundays)</div>';
                        html += '<div class="flex flex-wrap justify-center gap-4">';
                        Object.entries(stats).sort((a,b) => a[0].localeCompare(b[0])).forEach(([n, c]) => {
                            html += '<div class="text-[12px] font-bold text-[#3d6263] bg-white px-5 py-2.5 rounded-full border border-[#d1dfdf] shadow-sm flex items-center gap-2"><span>' + n + ':</span><span class="font-black text-sm">' + c + '</span></div>';
                        });
                        html += '</div></div>';
                    }
                    html += '</div>';
                });
                container.innerHTML += html + '</div></div>';
            });

            // ── ARCHIVED TERMS SECTION ──────────────────────────────────
            const archivedDedupMap = {};
            cachedEvents.forEach(ev => {
                if(!ev.archived) return;
                const key = `${ev.date}||${ev.type}`;
                if (!archivedDedupMap[key]) {
                    archivedDedupMap[key] = ev;
                } else {
                    const existingCount = Object.keys(archivedDedupMap[key].assignments || {}).length;
                    const newCount = Object.keys(ev.assignments || {}).length;
                    if (newCount > existingCount) archivedDedupMap[key] = ev;
                }
            });
            const archivedGrouped = {};
            Object.values(archivedDedupMap).forEach(ev => {
                const termKey = ev.termLabel || getTermLabel(ev.date);
                if (!archivedGrouped[termKey]) archivedGrouped[termKey] = [];
                archivedGrouped[termKey].push(ev);
            });

            if (Object.keys(archivedGrouped).length > 0) {
                let archHtml = '<div class="mt-16 mb-4">';
                archHtml += '<div class="flex items-center gap-4 mb-6">';
                archHtml += '<div class="flex-1 h-px bg-[#d1dfdf]"></div>';
                archHtml += '<span class="text-[11px] font-black uppercase tracking-widest text-[#3d6263] opacity-40">Archived Terms</span>';
                archHtml += '<div class="flex-1 h-px bg-[#d1dfdf]"></div>';
                archHtml += '</div>';

                Object.keys(archivedGrouped).sort().forEach(term => {
                    const count = archivedGrouped[term].length;
                    archHtml += '<div class="flex items-center justify-between bg-[#f0f6f6] border border-[#d1dfdf] rounded-[1.5rem] px-6 py-4 mb-3">';
                    archHtml += `<div class="flex items-center gap-4">`;
                    archHtml += `<span class="text-[13px] font-bold text-[#3d6263] opacity-60">${term}</span>`;
                    archHtml += `<span class="text-[11px] font-bold text-[#3d6263] opacity-40">${count} service${count !== 1 ? 's' : ''}</span>`;
                    archHtml += `</div>`;
                    archHtml += `<button onclick="unarchiveTerm('${term}')" class="bg-[#3d6263] text-white px-5 py-2 rounded-full font-black text-[10px] uppercase hover:bg-[#2e4c4d] transition-all shadow-sm">↩ Restore</button>`;
                    archHtml += '</div>';
                });

                archHtml += '</div>';
                container.innerHTML += archHtml;
            }
        }

        function generateEventHtml(ev, blockIdx) {
            const assignedIds = Object.values(ev.assignments || {}).flatMap(a => Array.isArray(a) ? a.map(p => p.id) : [a.id]);
            const members = addressBook.filter(m => (ev.teams?.some(t => m.markers?.includes(t)) || (ev.teams?.includes("Youth") && m.markers?.includes("Youth Worship"))));
            const respondersAvail = members.filter(m => availability[ev.id]?.[m.id] === 'avail' && (!hideAssigned || !assignedIds.includes(m.id)));
            const declined = members.filter(m => (availability[ev.id]?.[m.id] === 'unavailable' || availability[ev.id]?.[m.id] === 'not-avail') && (!hideAssigned || !assignedIds.includes(m.id)));
            const pending = members.filter(m => !availability[ev.id]?.[m.id] && (!hideAssigned || !assignedIds.includes(m.id)));
            const isSunday = ev.type === "Sunday Morning Worship";
            const mandatoryFilled = isSunday && MANDATORY_SUNDAY_ROLES.every(r => {
                const raw = ev.assignments?.[r];
                return Array.isArray(raw) ? raw.length > 0 : !!raw;
            });
            const rowClass = !isSunday ? 'bg-slate-50 border-dashed border-[#d1dfdf]' : (mandatoryFilled ? 'bg-white border-green-300' : (blockIdx % 2 === 0 ? 'bg-white border-[#d1dfdf]' : 'bg-[#f0f6f6]/30 border-[#d1dfdf]'));
            const dateBg = !isSunday ? 'bg-[#d1dfdf]' : 'bg-[#3d6263]';
            /* One rota, but each person edits only their department's part
               of it. A master admin sees the lot. */
            const visibleRoles = (ev.roles || []).filter(canEditRole);
            const sortedRoles = [...visibleRoles.filter(r => !AV_ROLES.includes(r)), ...visibleRoles.filter(r => AV_ROLES.includes(r))];
            const hiddenRoleCount = (ev.roles || []).length - visibleRoles.length;
            const iconStyles = 'width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"';
            const timeSelectStyle = 'bg-white border border-[#d1dfdf] text-[#3d6263] px-2 py-1 rounded-full font-bold text-[11px] outline-none';
            const startTimeHtml = `<select onchange="updateField('${ev.id}', 'startTime', this.value)" class="${timeSelectStyle}">${buildTimeOptions(ev.startTime || '08:00')}</select>`;
            const endTimeHtml = `<select onchange="updateField('${ev.id}', 'endTime', this.value)" class="${timeSelectStyle}">${buildTimeOptions(ev.endTime || '11:30')}</select>`;
            const timeGroupHtml = `<div class="flex items-center gap-1 bg-white px-3 py-1 rounded-full border border-[#d1dfdf] shadow-sm text-[10px] font-black text-[#3d6263] uppercase">${startTimeHtml}<span class="opacity-40">–</span>${endTimeHtml}</div>`;

            let html = '<div class="' + rowClass + ' border rounded-[1.5rem] p-4 mb-3 shadow-sm relative overflow-visible transition-all">';
            html += '<div class="flex flex-wrap items-center gap-4 overflow-visible">';
            html += '<div class="relative">';
            html += '<button onclick="toggleEventExpand(\'' + ev.id + '\')" class="w-8 h-8 flex items-center justify-center rounded-full bg-white text-[#3d6263] shadow-sm border border-[#d1dfdf]">';
            html += (expandedEvents.has(ev.id) || isSunday ? '<svg ' + iconStyles + ' viewBox="0 0 24 24"><path d="M19.5 12h-15" /></svg>' : '<svg ' + iconStyles + ' viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15" /></svg>');
            html += '</button>';
            if (mandatoryFilled) html += '<div class="absolute -top-1 -right-1 w-3 h-3 bg-green-400 rounded-full border-2 border-white" title="All mandatory roles filled"></div>';
            html += '</div>';
            html += '<input type="date" value="' + ev.date + '" onchange="updateField(\'' + ev.id + '\', \'date\', this.value)" class="' + dateBg + ' ' + (!isSunday ? 'text-[#3d6263]' : 'text-white') + ' px-4 py-2 rounded-full font-bold text-[11px] shadow-sm">';
            html += timeGroupHtml;
            html += '<select onchange="updateField(\'' + ev.id + '\', \'type\', this.value)" class="bg-white px-4 py-2 rounded-full font-bold text-[#3d6263] text-[11px] border border-[#d1dfdf] outline-none">';
            EVENT_TYPES.forEach(t => { html += '<option value="' + t + '" ' + (ev.type === t ? 'selected' : '') + '>' + t + '</option>'; });
            html += '</select>';
            html += '<textarea rows="1" onblur="updateField(\'' + ev.id + '\', \'description\', this.value)" onclick="event.stopPropagation()" placeholder="Notes..." class="flex-grow bg-white px-5 py-2 rounded-xl text-[12px] font-bold border border-[#d1dfdf] outline-none text-[#3d6263]">' + (ev.description || '') + '</textarea>';
            // ── Service Leader & Speaker quick-fields ──
            const svcLeaderVal = ev.serviceLeader || '';
            const speakerVal = ev.speaker || '';
            html += '<input value="' + svcLeaderVal.replace(/"/g,'&quot;') + '" placeholder="Service Leader" onblur="updateField(\'' + ev.id + '\',\'serviceLeader\',this.value)" onclick="event.stopPropagation()" class="bg-white px-4 py-2 rounded-full font-bold text-[#3d6263] text-[11px] border border-[#d1dfdf] outline-none w-36">';
            html += '<input value="' + speakerVal.replace(/"/g,'&quot;') + '" placeholder="Speaker" onblur="updateField(\'' + ev.id + '\',\'speaker\',this.value)" onclick="event.stopPropagation()" class="bg-white px-4 py-2 rounded-full font-bold text-[#3d6263] text-[11px] border border-[#d1dfdf] outline-none w-32">';
            html += '<div class="flex gap-3 bg-white px-4 py-2 rounded-full border border-[#d1dfdf] shadow-sm">';
            ["Core Team", "Worship Team", "AV Team", "Choir", "Youth", "Kids Church"].forEach(t => {
                html += '<label class="text-[9px] font-black uppercase flex items-center gap-1.5 cursor-pointer text-[#3d6263]"><input type="checkbox" onchange="toggleTeam(\'' + ev.id + '\', \'' + t + '\')" ' + (ev.teams?.includes(t) ? 'checked' : '') + ' class="w-3.5 h-3.5 accent-[#3d6263]"><span>' + t + '</span></label>';
            });
            html += '</div>';
            if (!isSunday) {
                html += '<button onclick="autoFillPractice(\'' + ev.id + '\')" class="bg-[#d1dfdf] text-[#3d6263] px-5 py-2 rounded-full font-black text-[10px] uppercase shadow-sm flex items-center gap-1 hover:bg-[#3d6263] hover:text-white transition-all"><svg ' + iconStyles + ' viewBox="0 0 24 24" class="w-3 h-3"><path d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>Sync</button>';
            }
            html += '<div class="flex items-center gap-4 relative">';
            html += '<button onclick="toggleBucket(\'' + ev.id + '\')" class="w-11 h-11 rounded-full bg-white text-[#3d6263] flex items-center justify-center border border-[#d1dfdf] shadow-sm hover:scale-110 transition-all"><svg ' + iconStyles + ' viewBox="0 0 24 24"><path d="M20.25 14.15v4.25c0 .414-.336.75-.75.75H4.5a.75.75 0 0 1-.75-.75v-4.25m16.5 0a3 3 0 0 0-3-3H7.012a3 3 0 0 0-3 3m16.5 0-2.25-6.108a4.835 4.835 0 0 0-3.6-3.392 48.359 48.359 0 0 0-5.325 0 4.835 4.835 0 0 0-3.6 3.392L3.75 14.15m6.5 2.15a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm6 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" /></svg></button>';
            html += '<button onclick="deleteEvent(\'' + ev.id + '\')" class="text-[#d1dfdf] hover:text-red-500 transition-colors"><svg ' + iconStyles + ' viewBox="0 0 24 24" class="w-6 h-6"><path d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg></button>';
            html += '</div></div>';

            html += '<div class="' + (expandedEvents.has(ev.id) || isSunday ? 'flex' : 'hidden') + ' mt-6 border-t border-[#f0f6f6] pt-6 flex-row gap-6 overflow-visible">';
            html += '<div class="flex flex-wrap gap-4 flex-grow">';
            sortedRoles.forEach(r => {
                // Support both old single-object and new array format
                const raw = ev.assignments?.[r];
                const people = Array.isArray(raw) ? raw : (raw ? [raw] : []);
                const isAV = AV_ROLES.includes(r);
                const hasPeople = people.length > 0;
                const borderColor = isAV ? 'border-amber-400' : (hasPeople ? 'border-[#3d6263]' : 'border-[#d1dfdf]');
                html += '<div ondragover="event.preventDefault()" ondrop="onDropRole(event, \'' + ev.id + '\', \'' + r + '\')" class="bg-white border-2 ' + (hasPeople ? 'border-solid' : 'border-dashed') + ' ' + borderColor + ' p-4 rounded-2xl min-w-[170px] group/role transition-all relative">';
                html += '<div class="text-[10px] font-black uppercase text-[#3d6263] opacity-40 mb-2 flex justify-between"><span>' + r + '</span><button onclick="removeRole(\'' + ev.id + '\', \'' + r + '\')" class="invisible group-hover/role:visible text-red-400 hover:text-red-600"><svg ' + iconStyles + ' viewBox="0 0 24 24" class="w-3.5 h-3.5"><path d="M6 18 18 6M6 6l12 12" /></svg></button></div>';
                if (hasPeople) {
                    html += '<div class="flex flex-wrap gap-1">';
                    people.forEach(p => {
                        const isPending = !availability[ev.id]?.[p.id];
                        const chipColor = isPending ? 'bg-[#f6efe1] text-[#b07d2e]' : 'bg-[#e7f0ef] text-[#3d6263]';
                        const safeId = (p.id||'').replace(/'/g,"\\'");
                        const safeName = (p.name||'').replace(/'/g,"\\'");
                        html += '<div draggable="true" ondragstart="onDragStart(event,\'' + safeId + '\',\'' + safeName + '\',\'' + ev.id + '\',\'' + r + '\')" class="flex items-center gap-1 ' + chipColor + ' px-2 py-1 rounded-full text-[11px] font-bold cursor-grab">';
                        html += '<span>' + p.name + '</span>';
                        html += '<button onclick="event.stopPropagation();unassignOnePerson(\'' + ev.id + '\',\'' + r + '\',\'' + safeId + '\')" class="opacity-50 hover:opacity-100 ml-0.5 leading-none">&times;</button>';
                        html += '</div>';
                    });
                    html += '</div>';
                } else {
                    html += '<div class="text-[#d1dfdf] italic text-[13px] font-bold">Unassigned</div>';
                }
                html += '</div>';
            });
            html += '<select onchange="addRole(\'' + ev.id + '\', this.value); this.value=\'\';" class="bg-white border-2 border-dashed border-[#d1dfdf] text-[#3d6263] text-[11px] font-bold px-6 py-3 rounded-2xl uppercase hover:bg-[#f0f6f6] self-center"><option value="">+ Role</option>';
            [...OPTIONAL_ROLES, ...KIDS_ROLES]
                .filter(canEditRole)
                .filter(opt => !(ev.roles || []).includes(opt))
                .forEach(opt => { html += '<option value="' + opt + '">' + opt + '</option>'; });
            html += '</select>';
            /* Say that other departments have slots here, without showing
               them. Otherwise a half-empty week looks like a mistake. */
            if (hiddenRoleCount > 0) {
                html += '<div class="self-center text-[10px] font-bold uppercase tracking-wider text-[#93a8a6] px-3">'
                     + hiddenRoleCount + ' more handled by another team</div>';
            }
            html += '</div>';

            if (openBuckets.has(ev.id)) {
                html += '<div ondragover="event.preventDefault()" ondrop="onDropBucket(event, \'' + ev.id + '\')" class="bg-[#f0f6f6] p-7 rounded-[2.5rem] border border-[#d1dfdf] shadow-inner min-w-[340px]">';
                html += '<div class="max-h-[400px] overflow-y-auto space-y-6">';
                html += '<div ondragover="event.preventDefault()" ondrop="onDropBucket(event, \'' + ev.id + '\', \'avail\'); event.stopPropagation();">';
                html += '<div class="text-[10px] font-black text-green-600 uppercase mb-3">Available</div>';
                html += '<div class="flex flex-wrap gap-2 min-h-[30px]">';
                respondersAvail.forEach(m => { html += '<div draggable="true" ondragstart="onDragStart(event, \'' + m.id + '\', \'' + m.name.replace(/'/g, "\\'") + '\')" class="px-3 py-2 bg-green-50 text-green-700 rounded-xl text-[12px] font-bold border border-green-200 cursor-grab">' + m.name + '</div>'; });
                html += '</div></div>';
                html += '<div ondragover="event.preventDefault()" ondrop="onDropBucket(event, \'' + ev.id + '\', \'not-avail\'); event.stopPropagation();">';
                html += '<div class="text-[10px] font-black text-red-600 uppercase mb-3">Declined</div>';
                html += '<div class="flex flex-wrap gap-2 min-h-[30px]">';
                declined.forEach(m => { html += '<div draggable="true" ondragstart="onDragStart(event, \'' + m.id + '\', \'' + m.name.replace(/'/g, "\\'") + '\')" class="px-3 py-1.5 bg-red-50 text-red-700 rounded-xl text-[11px] font-bold border border-red-200 cursor-grab">' + m.name + '</div>'; });
                html += '</div></div>';
                html += '<div ondragover="event.preventDefault()" ondrop="onDropBucket(event, \'' + ev.id + '\', \'pending\'); event.stopPropagation();">';
                html += '<div class="text-[10px] font-black text-gray-400 uppercase mb-3">Pending</div>';
                html += '<div class="flex flex-wrap gap-2 min-h-[30px]">';
                pending.forEach(m => { html += '<div draggable="true" ondragstart="onDragStart(event, \'' + m.id + '\', \'' + m.name.replace(/'/g, "\\'") + '\')" class="px-3 py-1.5 bg-gray-50 text-gray-500 rounded-xl text-[11px] font-bold border border-gray-200 cursor-grab">' + m.name + '</div>'; });
                html += '</div></div></div></div>';
            }
            html += '</div></div>';
            return html;
        }
    </script>
    <style>
        :root{

        button.uppercase{ border-radius:var(--r-md) !important; font-weight:700 !important; letter-spacing:.02em !important; text-transform:none !important; transition:background .15s ease, transform .05s ease, box-shadow .15s ease !important; }
        button.uppercase:active{ transform:translateY(1px) !important; }
        button.uppercase:focus-visible{ outline:none !important; box-shadow:0 0 0 3px var(--brand-ring) !important; }
        button.uppercase.bg-\[\#3d6263\]{ background:var(--brand) !important; color:#fff !important; box-shadow:var(--shadow-sm) !important; }
        button.uppercase.bg-\[\#3d6263\]:hover{ background:var(--brand-dark) !important; }
        button.uppercase.bg-\[\#f0f6f6\]{ background:var(--brand-tint) !important; color:var(--brand) !important; border-color:transparent !important; }
        button.uppercase.bg-\[\#f0f6f6\]:hover{ background:#d8e6e4 !important; }
        button.uppercase.bg-white{ background:var(--surface) !important; color:var(--brand) !important; border:1px solid var(--hairline-strong) !important; }
        button.uppercase.bg-white:hover{ background:var(--surface-2) !important; }
        input, select, textarea { font-family:'Montserrat', sans-serif; }
        input:not([type=checkbox]):not([type=radio]):focus, select:focus, textarea:focus{ border-color:var(--brand) !important; box-shadow:0 0 0 3px var(--brand-ring) !important; outline:none !important; }
        .styled-input{ border:1px solid var(--hairline-strong); border-radius:var(--r-md); background:var(--surface); color:var(--brand); }
        .text-\[7px\], .text-\[8px\], .text-\[9px\], .text-\[10px\] { font-size:11px !important; }
        .sk{ background:linear-gradient(90deg,var(--surface-2) 25%,var(--hairline) 37%,var(--surface-2) 63%); background-size:400% 100%; animation:sh 1.4s ease infinite; border-radius:6px; }
        @keyframes sh{ 0%{background-position:100% 0} 100%{background-position:0 0} }
        @media (prefers-reduced-motion:reduce){ .sk{ animation:none } }
    </style>
</head>
<body class="p-4 sm:p-8 lg:p-12">
    <div class="max-w-[1900px] mx-auto">
        <header class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-12 gap-10 border-b border-[#d1dfdf] pb-12">
            <div class="flex flex-wrap gap-5 bg-white p-5 rounded-[3rem] shadow-xl border border-[#d1dfdf] items-center">
                <select id="termSelect" class="bg-[#f0f6f6] rounded-full px-8 py-3 text-sm font-bold border border-[#d1dfdf] text-[#3d6263] outline-none">
                    <option value="">Term</option>
                    <option value="Spring">Spring</option>
                    <option value="Summer">Summer</option>
                    <option value="Autumn">Autumn</option>
                </select>
                <button onclick="generateTerm()" class="bg-[#f0f6f6] text-[#3d6263] px-8 py-3 rounded-full font-black text-[11px] uppercase border border-[#d1dfdf]">Populate</button>
                <button onclick="autoFillAllEvents()" class="bg-[#3d6263] text-white px-8 py-3 rounded-full font-black text-[11px] uppercase shadow-lg">Auto-Populate</button>
                <button onclick="addThursdayPractices()" class="bg-[#3d6263] text-white px-8 py-3 rounded-full font-black text-[11px] uppercase shadow-lg">Add Practices</button>
                <button onclick="addSingleLine()" class="bg-[#3d6263] text-white px-10 py-3 rounded-full font-black text-[11px] uppercase shadow-lg">+ Service</button>
                <button onclick="gatherTermAvailability()" class="bg-white text-[#3d6263] border border-[#d1dfdf] px-8 py-3 rounded-full font-black text-[11px] uppercase shadow-sm">Gather Avail</button>
                <button onclick="toggleHideAssigned()" class="bg-white text-[#3d6263] border border-[#d1dfdf] px-8 py-3 rounded-full font-black text-[11px] uppercase shadow-sm">Hide Assigned</button>
                <div class="flex items-center gap-3 bg-white border border-[#d1dfdf] rounded-2xl px-4 py-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-[#3d6263] whitespace-nowrap">Sending as</label>
                    <input id="rotaSenderEmail" type="email" placeholder="your@email.com" class="styled-input text-sm flex-1 min-w-[180px] !py-1 !px-2" oninput="localStorage.setItem('egbc-sender-email',this.value)">
                </div>
                <!-- Term filter for send -->
                <div class="flex items-center gap-3 bg-white border border-[#d1dfdf] rounded-2xl px-4 py-2">
                    <label class="text-[10px] font-black uppercase tracking-widest text-[#3d6263] whitespace-nowrap">Send term</label>
                    <select id="sendTermSelect" class="bg-[#f0f6f6] rounded-full px-4 py-1 text-[11px] font-bold border border-[#d1dfdf] text-[#3d6263] outline-none min-w-[160px]">
                        <option value="">All active terms</option>
                    </select>
                </div>
                <button onclick="prepareDistributionPackage()" class="bg-[#3d6263] text-white px-8 py-3 rounded-full font-black text-[11px] uppercase shadow-lg hover:bg-black transition-all">🚀 SEND ALL ROTAS</button>
            </div>
            <div class="flex flex-wrap gap-5 bg-white p-5 rounded-[3rem] shadow-xl border border-[#d1dfdf] items-center">
                <button onclick="generatePDF('full')" class="bg-[#f0f6f6] text-[#3d6263] px-6 py-3 rounded-full font-black text-[10px] uppercase border border-[#d1dfdf]">Full PDF</button>
                <button onclick="exportToExcel()" class="bg-[#f0f6f6] text-[#3d6263] px-6 py-3 rounded-full font-black text-[10px] uppercase border border-[#d1dfdf]">Excel</button>
                <select id="memberPdfSelect" class="bg-[#f0f6f6] rounded-full px-6 py-3 text-[11px] font-black uppercase outline-none min-w-[180px] text-[#3d6263] border border-[#d1dfdf]"></select>
                <button onclick="generatePDF('individual', document.getElementById('memberPdfSelect').value)" class="bg-[#3d6263] text-white px-6 py-3 rounded-full font-black text-[10px] uppercase shadow-md">Indiv</button>
                <button onclick="generatePDF('household', document.getElementById('memberPdfSelect').value)" class="bg-[#3d6263] text-white px-6 py-3 rounded-full font-black text-[10px] uppercase shadow-md">Home</button>
                <button onclick="generatePDF('wall', document.getElementById('memberPdfSelect').value)" class="bg-[#3d6263] text-white px-6 py-3 rounded-full font-black text-[10px] uppercase shadow-md">Wall</button>
                <button onclick="sendSingleRota(document.getElementById('memberPdfSelect').value)" class="bg-white text-[#3d6263] border-2 border-[#3d6263] px-6 py-3 rounded-full font-black text-[10px] uppercase shadow-md hover:bg-[#3d6263] hover:text-white transition-all">✉ Send</button>
            </div>
        </header>
        <div id="eventList"></div>
    </div>

    <a href="https://esherchurch.github.io/availability-form/rotaplannerinstructions.html"
       target="_blank" rel="noopener noreferrer"
       title="How to use the planner"
       style="font-family: 'Montserrat', sans-serif;"
       class="fixed bottom-6 right-6 w-9 h-9 rounded-full bg-white border-2 border-[#3d6263] text-[#3d6263] flex items-center justify-center font-black text-sm shadow-lg hover:bg-[#3d6263] hover:text-white transition-all z-50">
        ?
    </a>
</body>
</html>
