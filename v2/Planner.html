<!DOCTYPE html>

<head>

    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest-planner.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#3d6263">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { db, storage, ready } from './egbc-db.js';
        import { collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc, updateDoc, arrayUnion, arrayRemove, deleteField, getDoc, setDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ref, getDownloadURL, uploadBytes, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        /* One signed-in connection. Nothing below runs until the session is
           restored: a query sent before then goes out anonymous, whatever the
           page has already checked, and on localhost it would not be the
           emulator either. */
        await ready;



        /* THE ROTA PLACES ARE THE CHURCH'S (Teams & groups, "Roles on this
           team"; EGBCAuth.roleChoices): "+ Role" offers the places of the
           teams doing the AV, worship and choir jobs, in that order. Asked
           each time, since they follow the teams and jobs once those load. */
        const OPTIONAL_ROLES = () => EGBCAuth.roleChoices ? EGBCAuth.roleChoices(['av', 'worship', 'choir']) : [];
        const MANDATORY_SUNDAY_ROLES = ["Worship Leader", "Keyboard", "Guitar", "Drums", "Bass", "Sound", "Words", "Cameras"];
        const EVENT_TYPES = ['Sunday Morning Worship', 'Sunday Team Practice', 'Evening Carol Service', 'Midnight Service', 'Special Service', 'Worship and AV Team Meeting', 'All Team Practice', 'Core Team Meeting', 'Worship Team Meeting', 'AV Team Meeting', 'Song Writing Workshop', 'LOUD Worship'];
        const AV_ROLES = () => EGBCAuth.roleChoices ? EGBCAuth.roleChoices(['av']) : [];
        // A part the church has switched off is not offered (HANDOVER-MAIN rule 12).
        const EGBCChurchUses = (n) => !window.EGBCChurch || !EGBCChurch.uses || EGBCChurch.uses(n);
        // ENTER A SUNDAY ONCE: a new Sunday service is in What's On at 10:00
        // unless somebody unticks it or changes the time on its row.
        const SUNDAY_PUBLIC = { whatsOn: true, serviceTime: "10:00" };
        /* THE CHURCH'S OWN KINDS OF SERVICE AND ITS SERVICE ROLES (H-11,
           egbc-services.js): EGBC's lists above until they load, and for EGBC
           after. mainType: the church's first service (Sunday Morning Worship). */
        const SV = { S: null, cfg: null };
        const escP = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
        const svcReady = (window.EGBCAuth && EGBCAuth.services ? EGBCAuth.services() : Promise.resolve({ S: null, cfg: null }))
            .then(r => { SV.S = r.S; SV.cfg = r.cfg; try { if (typeof renderPlanner === 'function') renderPlanner(); } catch (e) {} return SV; }, () => SV);
        const typeNames = () => SV.S ? SV.S.types(SV.cfg).map(t => t.name) : EVENT_TYPES;
        const mainType = () => SV.S ? (SV.S.serviceNames(SV.cfg)[0] || typeNames()[0]) : 'Sunday Morning Worship';
        const isServiceType = (t) => SV.S ? SV.S.isService(SV.cfg, t) : ['Sunday Morning Worship', 'Evening Carol Service', 'Midnight Service', 'Special Service', 'LOUD Worship'].includes(t);
        const serviceRoles = () => SV.S ? SV.S.roles(SV.cfg) : [{ id: 'serviceLeader', name: 'Service Leader' }, { id: 'speaker', name: 'Speaker' }];
        const freshEvent = (type, date) => {
            const ev = SV.S ? SV.S.newEvent(SV.cfg, type, date, j => EGBCAuth.teamsForJob(j)) : Object.assign({
                date, type, description: "", teams: [...new Set([...EGBCAuth.teamsForJob('worship'), ...EGBCAuth.teamsForJob('av')])], startTime: "08:00", endTime: "11:30",
                roles: isServiceType(type) ? MANDATORY_SUNDAY_ROLES : [], archived: false }, isServiceType(type) ? SUNDAY_PUBLIC : {});
            ev.termLabel = getTermLabel(date);
            return ev;
        };
        /* The rota places a kind of service starts with, from the church's
           own list; these are what Auto-Populate fills and what the green
           "all filled" dot checks. */
        const slotsFor = (type) => {
            const t = SV.S && SV.S.type(SV.cfg, type);
            return t ? (t.slots || []) : (isServiceType(type) ? MANDATORY_SUNDAY_ROLES : []);
        };
        /* WHICH SERVICES AUTO-POPULATE FILLS (and Sync copies from, and the
           month's totals count). A church that has listed its own kinds in
           Your services: every service kind with rota places. With nothing
           stored (EGBC's defaults), the defaults give every service the same
           places, so nothing in them tells the main service from a carol or
           special one; there only the main service - the first - is filled,
           and the others are synced like practices, as they always were. */
        const isFilledKind = (type) => {
            if (!isServiceType(type)) return false;
            const own = SV.cfg && Array.isArray(SV.cfg.types) && SV.cfg.types.length;
            return own ? slotsFor(type).length > 0 : type === mainType();
        };

        /* ---- The church's teams --------------------------------------
           Team ids come from the church's own teams (EGBCAuth.TEAMS) and team
           jobs, never from a list here. Older rota rows sometimes saved a
           team's label ("Youth") instead of its id, so a row counts a team
           as ticked under either. */
        const TEAMS = () => (window.EGBCAuth && EGBCAuth.TEAMS) || {};
        const teamLabel = (t) => (TEAMS()[t] && TEAMS()[t].label) || t;
        const evHasTeam = (ev, t) => !!(ev.teams && (ev.teams.includes(t) || (TEAMS()[t] && ev.teams.includes(TEAMS()[t].label))));
        /* Teams for several jobs, each once, in the order the jobs are given. */
        const jobTeams = (...jobs) => [...new Set(jobs.flatMap(j => EGBCAuth.teamsForJob(j)))];
        /* The tick boxes on a row: the core team(s) covering the worship
           job's teams, then the teams doing the worship, AV, choir, youth and
           children jobs - the teams this rota is for, in that order. */
        const rotaTeams = () => {
            const T = TEAMS(), worship = EGBCAuth.teamsForJob('worship');
            const cores = Object.keys(T).filter(t => !T[t].archived && (T[t].coreFor || []).some(c => worship.includes(c)));
            return [...new Set([...cores, ...jobTeams('worship', 'av', 'choir', 'youth', 'children')])];
        };
        /* A box shows the name the row stores: the team's id, or - on an
           older row that saved the team's label ("Youth") - that label. */
        const tickName = (ev, t) => (ev.teams && !ev.teams.includes(t) && evHasTeam(ev, t)) ? teamLabel(t) : t;
        /* Young people are offered last when filling a slot, so adults are
           not passed over; "young people" are the teams doing the youth job. */
        const isYouthMember = (m) => jobTeams('youth').some(t => m.markers?.includes(t));

        /* ---- The church's name, logo and reply address in emails ------
           From churchSettings/details (egbc-church.js), never typed in here.
           Replies go to the "Sending as" address; with none, to the church's
           enquiry address. A blank detail is simply left out. */
        const escE = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const churchDetails = () => (window.EGBCChurch ? EGBCChurch.load() : Promise.resolve({ name: '', enquiryEmail: '', logoUrl: '' }));
        /* Replies go to "Sending as", else the worship team's own address
           (Team mail), else the church's enquiry email. */
        const replyAddress = async () => (document.getElementById('rotaSenderEmail')?.value || '').trim()
            || (await EGBCAuth.teamAddress('worship')) || (window.EGBCChurch ? EGBCChurch.email() : '');
        /* "Worship & AV" for EGBC: the labels of the teams doing the rota's
           worship and AV jobs. */
        const rotaWords = () => jobTeams('worship', 'av').map(teamLabel).join(' & ');

        /**
         * The rota emails' shared frame: header with the church's logo, the
         * body, and a footer with the church's name and the reply address.
         * @param {string} title  the big heading
         * @param {string} sub    the line under it (already safe HTML)
         * @param {string} body   the email's middle (HTML)
         * @returns {Promise<string>} the whole email
         */
        async function rotaEmail(title, sub, body) {
            const d = await churchDetails();
            const reply = await replyAddress();
            const words = rotaWords();
            /* The worship team's own logo (Teams & groups), else the church's. */
            await (window.EGBCChurch ? EGBCChurch.jobsReady() : null);
            const logoSrc = (window.EGBCChurch && EGBCChurch.logoFor('worship')) || d.logoUrl;
            const logo = logoSrc ? `<td style="vertical-align:top;text-align:right;padding-left:20px;"><div style="display:inline-block;background:#ffffff;border-radius:10px;padding:8px 12px;"><img src="${escE(logoSrc)}" height="44" style="display:block;height:44px;border:0;" alt="${escE(d.name)}"></div></td>` : '';
            const foot = [d.name, words ? words + ' Team' : ''].filter(Boolean).map(escE).join(' &bull; ');
            return `<!DOCTYPE html><html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background-color:#eaf2f2;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eaf2f2"><tr><td align="center" style="padding:40px 16px;">
<table width="620" cellpadding="0" cellspacing="0" border="0" style="max-width:620px;width:100%;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(61,98,99,0.13);">
  <tr><td bgcolor="#3d6263" style="padding:32px 40px;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td style="vertical-align:bottom;"><p style="margin:0 0 8px;font-family:Arial,sans-serif;font-size:26px;font-weight:800;color:#ffffff;">${title}</p><p style="margin:0;font-family:Arial,sans-serif;font-size:12px;color:#a8c5c5;font-weight:700;text-transform:uppercase;letter-spacing:2px;">${sub}</p></td>
      ${logo}
    </tr></table>
  </td></tr>
  <tr><td style="padding:36px 40px 0;">
${body}
  </td></tr>
  <tr><td bgcolor="#3d6263" style="padding:24px 40px;">
    <p style="margin:0 0 4px;font-family:Arial,sans-serif;font-size:13px;color:#c8dede;font-style:italic;">&ldquo;By this everyone will know that you are my disciples, if you love one another.&rdquo; &mdash; John 13:35</p>
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #4d7475;margin-top:10px;"><tr>
      <td style="font-family:Arial,sans-serif;font-size:11px;color:#7a9e9f;padding-top:10px;">${foot}</td>
      <td align="right" style="font-family:Arial,sans-serif;font-size:11px;color:#7a9e9f;padding-top:10px;">${escE(reply)}</td>
    </tr></table>
  </td></tr>
</table></td></tr></table></body></html>`;
        }
        /* The church's name before a calendar entry's title, or nothing when
           the church has no name set. */
        const churchPrefix = (sep) => (shortName ? shortName + sep : '');
        /* The church's short name ("EGBC"), else its name - the same as the
           server's rota feed - from the one helper (egbc-church.js). */
        let shortName = '';
        const churchShortName = () => churchDetails().then(d => {
            shortName = String((window.EGBCChurch && EGBCChurch.shortName()) || d.name || '').trim();
            return shortName;
        });
        /* The send itself, with the reply address above (none if both are blank). */
        const sendRota = async (opts) => {
            const reply = await replyAddress();
            return EGBCAuth.sendEmail(Object.assign({ source: 'rota' }, opts, reply ? { replyTo: reply } : {}));
        };

        // Video meetings: the church's own rooms (egbc-video.js, churchSettings/video; Church HQ's
        // Daily account since 21 Oct 2026). No copy of the list or of a Daily address here.
        const V = () => window.EGBCVideo || null;
        // ev.videoRoom: room name, '' = no call, undefined = use the default for the event type
        const videoRoomFor = ev => V() ? V().roomFor(ev) : (ev.videoRoom || '');
        // The hub's meeting page, in full for calendar files: the host gets their key there.
        const videoLinkFor = ev => { const r = videoRoomFor(ev); return r && V() ? new URL(V().link(r, ev), location.href).href : ''; };
        if (V()) V().load().then(() => { try { if (typeof renderPlanner === 'function') renderPlanner(); } catch (e) { /* drawn on the next change */ } });

        // Who gets an event in their rota email/ICS: anyone with a role, plus — for meetings — everyone in the ticked teams
        const isMeeting = ev => /Meeting/.test(ev.type || '');
        const inEventTeams = (m, ev) => !!m && (m.markers || []).some(t => evHasTeam(ev, t));
        const isInvitedTo = (ev, memberId) =>
            Object.values(ev.assignments || {}).some(raw => (Array.isArray(raw) ? raw : [raw]).some(a => a?.id === memberId)) ||
            (isMeeting(ev) && inEventTeams(addressBook.find(m => m.id === memberId), ev));

        /* ---- The children's teams' places --------------------------------
           Slots on the rota, which are not quite the same as the abilities
           held in the address book: a person ticks "Helper" once, but a week
           can carry several helper slots. Which group each helper takes is
           decided when the week is planned, not here. The places are the
           children's teams' roles (Teams & groups; EGBCAuth.roleChoices),
           asked each time since they follow the teams once those load. */
        const KIDS_ROLES = () => EGBCAuth.roleChoices ? EGBCAuth.roleChoices(['children']) : [];

        /* The places a week gets when a children's team is ticked on it: the
           standard Sunday (EGBC's is one Session Leader and two
           interchangeable helpers). The fuller places stay selectable for a
           week that needs one pinned. */
        const KIDS_MANDATORY_ROLES = () => EGBCAuth.roleStarts ? EGBCAuth.roleStarts(['children']) : [];

        /* The skill a place needs (Teams & groups: "2nd Keys" needs Keyboard,
           "Helper 4" a Helper; '' = filled by hand), and whether a person has
           it ticked - an old tick ("Sing") counts under its skill's name. */
        const roleAbility = r => EGBCAuth.placeSkill ? EGBCAuth.placeSkill(r) : r;
        const hasSkill = (m, skill, usuallyOnly) => EGBCAuth.hasSkill ? EGBCAuth.hasSkill(m, skill, usuallyOnly)
            : !!skill && ((m.primaryInstruments || []).includes(skill) || (!usuallyOnly && (m.secondaryInstruments || []).includes(skill)));

        /* Which team owns a slot: the team whose roles list it (egbc-auth.js),
           so the read-only rota answers it the same way. */
        function roleTeam(r) {
            if (typeof EGBCAuth === 'undefined') return '';
            return EGBCAuth.roleTeamOf ? EGBCAuth.roleTeamOf(r) : EGBCAuth.roleTeam(r);
        }

        /* null means "everything". A master admin sees the lot - and if a
           master admin is previewing another team, EGBCAuth reports that team
           here, so this needs no special case of its own. */
        function myRotaTeams() {
            if (typeof EGBCAuth === 'undefined') return null;
            try {
                if (EGBCAuth.isMaster()) return null;
                const areas = EGBCAuth.adminAreas() || [];
                if (areas.length) return areas;
                /* A leader who administers nothing used to get "everything"
                   here, so a team leader could change every other team's
                   slots. They get the teams they lead (by role, or through a
                   core team), and nothing more. */
                return Object.keys(TEAMS()).filter(t => EGBCAuth.isLeaderOf(t));
            } catch (e) { return null; }
        }

        /* ev, when given: a row for one of my teams whose slots belong to a
           team not ticked on it (a youth service using the worship slots)
           is mine to fill, since nobody else is planning it. */
        function canEditRole(r, ev) {
            const mine = myRotaTeams();
            if (!mine || mine.includes(roleTeam(r))) return true;
            return !!ev && mine.some(t => evHasTeam(ev, t)) && !evHasTeam(ev, roleTeam(r));
        }

        /* Every team that actually has a slot somewhere in this term. A term
           with no Kids Church slots needs no Kids Church sign-off, so nothing
           changes for Worship until Kids Church starts using it. */
        function teamsInTerm(termLabel) {
            const out = new Set();
            cachedEvents.filter(e => e.termLabel === termLabel && !e.archived)
                .forEach(e => (e.roles || []).forEach(r => out.add(roleTeam(r))));
            return [...out];
        }

        /* ---- sign-off ---------------------------------------------------
           One rota, built by several people at different times. Sending it
           before everyone has finished means someone on two teams gets an
           email with half their duties on it. Each team says when its part is
           done, and sending waits for all of them. */
        let signoffs = {};        /* "Autumn 2026__Kids Church" -> {by, at} */

        const signoffKey = (term, team) => term + '__' + team;

        async function loadSignoffs() {
            try {
                const snap = await getDocs(collection(db, "rotaSignoff"));
                signoffs = {};
                snap.forEach(d => { signoffs[d.id] = d.data(); });
            } catch (e) { console.warn('sign-off read failed', e); }
        }

        window.setSignoff = async (termLabel, team, ready) => {
            const key = signoffKey(termLabel, team);
            try {
                if (ready) {
                    const who = (typeof EGBCAuth !== 'undefined' && EGBCAuth.profile && EGBCAuth.profile())
                        ? (EGBCAuth.profile().name || EGBCAuth.profile().email) : 'someone';
                    await setDoc(doc(db, "rotaSignoff", key), {
                        term: termLabel, team: team, by: who, at: new Date()
                    });
                } else {
                    await deleteDoc(doc(db, "rotaSignoff", key));
                }
                await loadSignoffs();
                renderEvents();
            } catch (e) { alert('Could not save that: ' + e.message); }
        };

        /* Any change to a team's part of a term withdraws that team's
           sign-off. Without this a sign-off would describe the rota as it was
           when someone pressed the button, which is not the same thing. */
        async function clearSignoff(eventId, team) {
            const ev = cachedEvents.find(e => e.id === eventId);
            if (!ev || !ev.termLabel) return;
            const teams = team ? [team] : teamsInTerm(ev.termLabel);
            for (const t of teams) {
                const key = signoffKey(ev.termLabel, t);
                if (!signoffs[key]) continue;
                try { await deleteDoc(doc(db, "rotaSignoff", key)); delete signoffs[key]; }
                catch (e) { console.warn('sign-off clear failed', e); }
            }
        }

        /* Who still has to finish before this term can go out. */
        function outstandingTeams(termLabel) {
            return teamsInTerm(termLabel).filter(t => !signoffs[signoffKey(termLabel, t)]);
        }

        function signoffStrip(term) {
            const teams = teamsInTerm(term);
            if (!teams.length) return '';
            const mine = myRotaTeams();
            let h = '<div class="flex items-center gap-2 flex-wrap">';
            teams.forEach(t => {
                const done = signoffs[signoffKey(term, t)];
                const canPress = !mine || mine.includes(t);
                const label = t.replace(' Team', '');
                if (done) {
                    const title = 'Signed off by ' + (done.by || 'someone').replace(/"/g, '');
                    h += '<button title="' + title + '" ' +
                         (canPress ? 'onclick="this.disabled=true;this.textContent=\'Saving…\';setSignoff(\'' + term + '\',\'' + t + '\',false)"' : 'disabled') +
                         ' class="text-[13px] font-medium bg-[#eef5f4] text-[#3d6263] border border-[#cfe0de] px-3 py-1 rounded-[8px]">'
                       + '&#10003; ' + label + '</button>';
                } else if (canPress) {
                    /* "Saving…" at once: the button changes for real only when the
                       save comes back, and on a phone that pause read as a dead
                       button (audit, 16 Oct 2026). */
                    h += '<button onclick="this.disabled=true;this.textContent=\'Saving…\';setSignoff(\'' + term + '\',\'' + t + '\',true)" ' +
                         'class="text-[13px] font-medium bg-white text-[#6b7280] border border-[#e5e7eb] px-3 py-1 rounded-[8px] hover:bg-[#f3f4f6]">'
                       + label + ' not done</button>';
                } else {
                    h += '<span class="text-[13px] font-medium bg-white text-[#9ca3af] border border-[#e5e7eb] px-3 py-1 rounded-[8px]">'
                       + label + ' waiting</span>';
                }
            });
            h += '</div>';
            return h;
        }

        let collapsedTerms = new Set();
        let expandedEvents = new Set();
        let openBuckets = new Set();
        let cachedEvents = [];
        let addressBook = [];
        let availability = {};
        let logoBase64 = null;
        let logoNaturalWidth = 1;
        let logoNaturalHeight = 1;
        let hideAssigned = false;

        const FORM_LINK = location.origin + location.pathname.replace(/[^/]*$/, '') + 'index.html'; /* the availability form, at the address this page is open at (github.io, or egbc.churchhq.co.uk, whose bare address opens the hub) */

        let logoLoadPromise = null;
        /* The worship team's logo for the PDFs, else the church's; none set,
           no logo. */
        const getLogoBase64 = () => {
            if (logoLoadPromise) return logoLoadPromise;
            logoLoadPromise = new Promise(async (resolve) => {
                try {
                    const d = await churchDetails();
                    await (window.EGBCChurch ? EGBCChurch.jobsReady() : null);
                    const url = (window.EGBCChurch && EGBCChurch.logoFor('worship')) || d.logoUrl;
                    if (!url) return resolve(null);
                    const img = new Image();
                    img.setAttribute('crossOrigin', 'anonymous');
                    img.onload = () => {
                        logoNaturalWidth = img.naturalWidth;
                        logoNaturalHeight = img.naturalHeight;
                        const canvas = document.createElement("canvas");
                        canvas.width = img.width; canvas.height = img.height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0);
                        logoBase64 = canvas.toDataURL("image/jpeg", 1.0);
                        resolve(logoBase64);
                    };
                    img.onerror = () => resolve(null);
                    img.src = url + (url.includes('?') ? '&' : '?') + "c=" + new Date().getTime();
                } catch (e) { resolve(null); }
            });
            return logoLoadPromise;
        };
        getLogoBase64();

        function getTermLabel(dateString) {
            const d = new Date(dateString);
            const month = d.getMonth() + 1;
            const year = d.getFullYear();
            let term = (month <= 4) ? "Spring" : (month <= 8) ? "Summer" : "Autumn";
            return `${term} ${year}`;
        }

        /* Read nothing until the page's guard has let this person in: a
           refused visitor's reads were refused too, and filled the console
           under the "not for you" card (audit, 16 Oct 2026). */
        const egbcStart = () => {
        onSnapshot(collection(db, "addressBook"), (snap) => {
            addressBook = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            /* Names to choose the service leader and speaker from (Martin,
               16 Oct 2026); adults only, archived left out. */
            let dl = document.getElementById('ppPeople');
            if (!dl) { dl = document.createElement('datalist'); dl.id = 'ppPeople'; document.body.appendChild(dl); }
            dl.innerHTML = addressBook.filter(m => m.name && m.archived !== true && m.isMinor !== true)
                .map(m => '<option value="' + String(m.name).replace(/"/g, '&quot;') + '">').join('');
            const select = document.getElementById('memberPdfSelect');
            if (select) {
                const currentVal = select.value;
                select.innerHTML = '<option value="">Select Member...</option>';
                addressBook.sort((a,b) => a.name.localeCompare(b.name)).forEach(m => {
                    select.innerHTML += `<option value="${m.id}">${m.name}</option>`;
                });
                select.value = currentVal;
            }
            renderPlanner();
        });

        onSnapshot(collection(db, "availability"), (snap) => {
            availability = {};
            snap.forEach(d => {
                const data = d.data();
                if (!availability[data.eventId]) availability[data.eventId] = {};
                availability[data.eventId][data.memberId] = data.status;
            });
            renderPlanner();
        });

        onSnapshot(query(collection(db, "events"), orderBy("date")), (snap) => {
            cachedEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderPlanner();
            /* A meeting's notes from its own part, for the invited (the meetings split). */
            if (cachedEvents.some(e => e.meeting === true)) {
                const asOf = cachedEvents;
                EGBCAuth.meetingDetails(asOf).then(m => { if (cachedEvents === asOf) { cachedEvents = m; renderPlanner(); } });
            }
            populateSendTermSelect();
            loadSignoffs().then(renderPlanner);
        });
        };
        if (window.EGBC_READY) egbcStart(); else document.addEventListener('egbc-ready', egbcStart, { once: true });

        // ── POPULATE TERM SELECT IN SEND MODAL ─────────────────────────
        function populateSendTermSelect() {
            const sel = document.getElementById('sendTermSelect');
            if (!sel) return;
            const terms = [...new Set(cachedEvents.filter(e => !e.archived).map(e => e.termLabel).filter(Boolean))].sort();
            const current = sel.value;
            sel.innerHTML = '<option value="">All active terms</option>';
            terms.forEach(t => {
                sel.innerHTML += `<option value="${t}"${t === current ? ' selected' : ''}>${t}</option>`;
            });
        }

        window.toggleHideAssigned = () => {
            hideAssigned = !hideAssigned;
            renderPlanner();
        };

        /* Past dates are hidden unless this is on; remembered on this device. */
        window.toggleShowPast = (btn) => {
            EGBCUKDates.togglePast(btn);
            renderPlanner();
            EGBCUKDates.scrollToNext(document.getElementById('eventList'));
        };
        EGBCUKDates.paintPast(document.querySelector('[data-past-toggle]'));

        window.toggleTermCollapse = (termId) => {
            collapsedTerms.has(termId) ? collapsedTerms.delete(termId) : collapsedTerms.add(termId);
            renderPlanner();
        };

        window.toggleEventExpand = (eventId) => {
            expandedEvents.has(eventId) ? expandedEvents.delete(eventId) : expandedEvents.add(eventId);
            renderPlanner();
        };

        window.toggleBucket = (eventId) => {
            openBuckets.has(eventId) ? openBuckets.delete(eventId) : openBuckets.add(eventId);
            renderPlanner();
        };

        /* THE SERVICE LEADER AND SPEAKER, CHOSEN FROM THE ADDRESS BOOK (Martin,
           16 Oct 2026). The name is kept as typed; when it is exactly one
           person in the address book their id goes with it (serviceLeaderId,
           speakerId) - For Sunday's prayer list matches by it. A guest
           speaker is typed and has no id. */
        window.updatePerson = async (id, field, value) => {
            const name = String(value || '').trim();
            const hits = addressBook.filter(m => (m.name || '').trim().toLowerCase() === name.toLowerCase() && m.archived !== true);
            await updateDoc(doc(db, "events", id), { [field]: name, [field + 'Id']: name && hits.length === 1 ? hits[0].id : '' });
        };

        window.updateField = async (id, field, value) => {
            /* A meeting's notes go to its own part (the meetings split). */
            const evM = cachedEvents.find(e => e.id === id);
            if (field === 'description' && evM && evM.meeting === true) { await EGBCAuth.setMeetingField(id, 'description', value); return; }
            const updates = { [field]: value };
            if (field === 'date') updates.termLabel = getTermLabel(value);
            await updateDoc(doc(db, "events", id), updates);
        };

        window.toggleTeam = async (eventId, teamName) => {
            const eventRef = doc(db, "events", eventId);
            const eventSnap = await getDoc(eventRef);
            if (!eventSnap.exists()) return;
            const currentTeams = eventSnap.data().teams || [];
            const adding = !evHasTeam({ teams: currentTeams }, teamName);
            /* Unticking also takes off the label an older row may have saved. */
            const newTeams = adding ? [...currentTeams, teamName] : currentTeams.filter(t => t !== teamName && t !== teamLabel(teamName));
            const updates = { teams: newTeams };
            const kidsTeam = jobTeams('children').includes(teamName);

            /* Ticking a children's team puts its standard slots on the week, the
               way a new Sunday already arrives with the worship ones. Unticking
               takes back only the empty ones - anybody already rostered stays,
               so a mis-click cannot quietly wipe Karen's work. */
            if (kidsTeam) {
                const ev = eventSnap.data();
                const roles = new Set(ev.roles || []);
                if (adding) {
                    KIDS_MANDATORY_ROLES().forEach(r => roles.add(r));
                } else {
                    KIDS_ROLES().forEach(r => { if (!ev.assignments?.[r]) roles.delete(r); });
                }
                updates.roles = [...roles];
            }

            await updateDoc(eventRef, updates);
            if (kidsTeam) await clearSignoff(eventId, roleTeam(KIDS_MANDATORY_ROLES()[0] || KIDS_ROLES()[0] || ''));
        };

        window.addRole = async (eventId, roleName) => {
            if(!roleName) return;
            await updateDoc(doc(db, "events", eventId), { roles: arrayUnion(roleName) });
            await clearSignoff(eventId, roleTeam(roleName));
        };

        window.removeRole = async (eventId, roleName) => {
            if(confirm(`Remove role "${roleName}"?`)) {
                const updates = { roles: arrayRemove(roleName) };
                updates[`assignments.${roleName}`] = deleteField();
                await updateDoc(doc(db, "events", eventId), updates);
                await clearSignoff(eventId, roleTeam(roleName));
            }
        };

        window.assignPerson = async (eventId, role, personId, personName) => {
            const updates = {};
            updates[`assignments.${role}`] = { id: personId, name: personName };
            await updateDoc(doc(db, "events", eventId), updates);
        };

        window.unassignPerson = async (eventId, role) => {
            const updates = {};
            updates[`assignments.${role}`] = deleteField();
            await updateDoc(doc(db, "events", eventId), updates);
        };

        // Remove a single person from a multi-person role
        window.unassignOnePerson = async (eventId, role, personId) => {
            const ev = cachedEvents.find(e => e.id === eventId);
            const raw = ev?.assignments?.[role];
            const current = Array.isArray(raw) ? raw : (raw ? [raw] : []);
            const remaining = current.filter(p => p.id !== personId);
            const updates = {};
            updates[`assignments.${role}`] = remaining.length > 0 ? remaining : deleteField();
            await updateDoc(doc(db, "events", eventId), updates);
        };

        // Called from data-attribute inputs — avoids inline JS string escaping issues
        window.quickAssignFromEl = async (el) => {
            const eventId = el.dataset.evid;
            const role = el.dataset.role;
            const name = el.value.trim();
            if (!eventId || !role) return;
            await quickAssign(eventId, role, name);
        };

        // Quick-assign from the header text inputs (Service Leader / Speaker)
        window.quickAssign = async (eventId, role, name) => {
            const updates = {};
            if (!name || !name.trim()) {
                updates[`assignments.${role}`] = deleteField();
            } else {
                const member = addressBook.find(m => m.name?.trim().toLowerCase() === name.trim().toLowerCase());
                updates[`assignments.${role}`] = [{ id: member?.id || name.trim(), name: name.trim() }];
            }
            try {
                await updateDoc(doc(db, "events", eventId), updates);
                // Brief visual confirmation on the input
                const inputs = document.querySelectorAll(`input[data-qid="${eventId}-${role}"]`);
                inputs.forEach(el => { el.style.borderColor = '#3b7d23'; setTimeout(() => { el.style.borderColor = ''; }, 1500); });
            } catch(e) {
                console.error('quickAssign failed', e);
                alert('Save failed: ' + e.message);
            }
        };

        window.deleteEvent = async (eventId) => {
            if(confirm("Permanently delete this service?")) await deleteDoc(doc(db, "events", eventId));
        };

        window.archiveTerm = async (termLabel) => {
            if(confirm(`Archive all services in ${termLabel}?`)) {
                const toArchive = cachedEvents.filter(e => e.termLabel === termLabel);
                for (const ev of toArchive) {
                    await updateDoc(doc(db, "events", ev.id), { archived: true });
                }
            }
        };

        // ── UNARCHIVE ───────────────────────────────────────────────────
        window.unarchiveTerm = async (termLabel) => {
            if(confirm(`Restore all services in ${termLabel} back to active?`)) {
                const toRestore = cachedEvents.filter(e => e.termLabel === termLabel && e.archived);
                for (const ev of toRestore) {
                    await updateDoc(doc(db, "events", ev.id), { archived: false });
                }
            }
        };

        window.onDragStart = (e, personId, personName, eventId = null, role = null) => {
            e.dataTransfer.setData("personId", personId);
            e.dataTransfer.setData("personName", personName);
            if(eventId && role) {
                e.dataTransfer.setData("sourceEventId", eventId);
                e.dataTransfer.setData("sourceRole", role);
            }
        };

        window.onDropRole = async (e, eventId, role) => {
            e.preventDefault();
            const personId = e.dataTransfer.getData("personId");
            const personName = e.dataTransfer.getData("personName");
            const sourceEventId = e.dataTransfer.getData("sourceEventId");
            const sourceRole = e.dataTransfer.getData("sourceRole");
            if(sourceEventId === eventId && sourceRole) {
                await unassignPerson(sourceEventId, sourceRole);
            }
            await assignPerson(eventId, role, personId, personName);
        };

        window.onDropBucket = async (e, eventId, targetStatus = null) => {
            e.preventDefault();
            const personId = e.dataTransfer.getData("personId");
            const sourceEventId = e.dataTransfer.getData("sourceEventId");
            const sourceRole = e.dataTransfer.getData("sourceRole");

            if(sourceEventId && sourceRole) {
                await unassignPerson(sourceEventId, sourceRole);
            }

            if(targetStatus && eventId && personId) {
                const availQuery = query(collection(db, "availability"), where("eventId", "==", eventId), where("memberId", "==", personId));
                const snap = await getDocs(availQuery);

                if (targetStatus === 'pending') {
                    for (const d of snap.docs) {
                        await deleteDoc(doc(db, "availability", d.id));
                    }
                } else {
                    if (!snap.empty) {
                        await updateDoc(doc(db, "availability", snap.docs[0].id), { status: targetStatus });
                    } else {
                        await addDoc(collection(db, "availability"), { eventId, memberId: personId, status: targetStatus });
                    }
                }
            }
        };

        /* ---- A small sheet that asks before anything is saved ----------
           "+ Service", "Add Practices" and "Gather Avail" each ask a question
           or two first; Cancel, the X, a tap outside or Escape save nothing.
           One sheet for all three, so they look and close the same way. */
        const SHEET_LBL = 'display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:4px';
        const SHEET_FLD = 'width:100%;height:46px;box-sizing:border-box;border:1px solid #d1d5db;border-radius:10px;padding:0 10px;font:500 15px Inter,system-ui,sans-serif;margin-bottom:12px;background:#fff';
        const closeSheet = () => { const s = document.getElementById('ppAddService'); if (s) s.remove(); document.removeEventListener('keydown', sheetKey); };
        const sheetKey = (e) => { if (e.key === 'Escape') closeSheet(); };
        /**
         * Opens the sheet.
         * @param {string} title     its heading
         * @param {string} fields    the questions (HTML, using SHEET_LBL / SHEET_FLD)
         * @param {string} goLabel   the button that does it ("Add")
         * @param {(msg: HTMLElement) => Promise<boolean|void>} onGo  does the work; false keeps the sheet open
         */
        function openSheet(title, fields, goLabel, onGo) {
            closeSheet();
            const wrap = document.createElement('div');
            wrap.id = 'ppAddService'; wrap.setAttribute('data-egbc-overlay', '');
            wrap.style.cssText = 'position:fixed;inset:0;z-index:2000;background:rgba(17,24,39,.4);display:flex;align-items:flex-end;justify-content:center';
            wrap.innerHTML = '<div role="dialog" aria-modal="true" aria-labelledby="ppAddT" style="background:#fff;width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:16px 16px 20px;font-family:Inter,system-ui,sans-serif">'
              + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><b id="ppAddT" style="font-size:16px;color:#111827">' + escP(title) + '</b>'
              + '<button type="button" data-close="1" aria-label="Close" style="width:44px;height:44px;border:1px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-size:18px;color:#3d6263">&times;</button></div>'
              + fields
              + '<div style="display:flex;gap:8px;margin-top:4px"><button type="button" data-close="1" style="flex:1;min-height:48px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer">Cancel</button>'
              + '<button type="button" id="ppAddGo" style="flex:1;min-height:48px;border:0;border-radius:12px;background:#3d6263;color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer">' + escP(goLabel) + '</button></div>'
              + '<p id="ppAddMsg" role="status" style="margin:10px 0 0;font-size:13px;color:#b0392c;min-height:1em"></p></div>';
            document.body.appendChild(wrap);
            if (window.matchMedia('(min-width:700px)').matches) { wrap.style.alignItems = 'center'; wrap.firstChild.style.borderRadius = '18px'; }
            wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.closest('[data-close]')) closeSheet(); });
            document.addEventListener('keydown', sheetKey);
            const go = document.getElementById('ppAddGo');
            go.onclick = async () => {
                const msg = document.getElementById('ppAddMsg');
                msg.textContent = '';
                go.disabled = true; go.textContent = 'Working…';
                let keep = false;
                try { keep = (await onGo(msg)) === false; }
                catch (e) { console.error('Planner:', title, e); msg.textContent = 'That did not save. Please try again.'; keep = true; }
                if (keep) { go.disabled = false; go.textContent = goLabel; } else closeSheet();
            };
            setTimeout(() => { try { wrap.querySelector('input,select').focus(); } catch (e) {} }, 50);
        }

        /* "+ SERVICE" ASKS FIRST (the reviewing window, 19 Oct 2026): it used
           to save the main service dated TODAY the moment it was tapped - one
           mis-tap on the phone bar, or the live audit, put a real empty
           service on the rota. Now the sheet asks the date (next Sunday to
           start with) and the kind, and nothing is saved until "Add". */
        const nextSundayIso = () => { const d = new Date(); d.setHours(12, 0, 0, 0); while (d.getDay() !== 0) d.setDate(d.getDate() + 1); return d.toISOString().split('T')[0]; };
        window.addSingleLine = async () => {
            await svcReady;
            openSheet('Add a service',
                '<label for="ppAddDate" style="' + SHEET_LBL + '">Date</label>'
              + '<input id="ppAddDate" type="date" value="' + nextSundayIso() + '" style="' + SHEET_FLD + '">'
              + '<label for="ppAddType" style="' + SHEET_LBL + '">What kind</label>'
              + '<select id="ppAddType" style="' + SHEET_FLD + '">'
              + typeNames().map(t => '<option' + (t === mainType() ? ' selected' : '') + '>' + escP(t) + '</option>').join('') + '</select>',
                'Add', async (msg) => {
                    const dateStr = document.getElementById('ppAddDate').value, type = document.getElementById('ppAddType').value;
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) { msg.textContent = 'Choose the date first.'; return false; }
                    await addDoc(collection(db, "events"), freshEvent(type, dateStr));
                });
        };

        /* ---- The term being worked on ---------------------------------
           The Term box offers the current term and the next three, each
           with its year ("Spring 2027"), so Populate and Add Practices make
           dates in that term's year - not this calendar year, which put a
           Spring term planned in the autumn into the Spring just gone. The
           terms' months are the ones getTermLabel() uses. */
        const TERM_MONTHS = { Spring: ['01', '04'], Summer: ['05', '08'], Autumn: ['09', '12'] };
        (function fillTermSelect() {
            const sel = document.getElementById('termSelect');
            if (!sel) return;
            const names = Object.keys(TERM_MONTHS);
            const now = getTermLabel(new Date().toISOString().split('T')[0]).split(' ');
            let i = names.indexOf(now[0]), y = +now[1];
            let html = '<option value="">Term</option>';
            for (let n = 0; n < 4; n++) {
                html += '<option value="' + names[i] + ' ' + y + '">' + names[i] + ' ' + y + '</option>';
                i++; if (i === names.length) { i = 0; y++; }
            }
            sel.innerHTML = html;
        })();
        /* { from, to } Date of the chosen term, or null with a message. */
        const chosenTerm = () => {
            const v = document.getElementById('termSelect').value;
            if (!v) { alert("Select a Term"); return null; }
            const [name, year] = v.split(' ');
            const m = TERM_MONTHS[name];
            /* Day 0 of the next month is the last day of this one. */
            return { from: new Date(`${year}-${m[0]}-01`), to: new Date(Date.UTC(+year, +m[1], 0)) };
        };

        window.generateTerm = async () => {
            const term = chosenTerm();
            if (!term) return;
            let curr = term.from;
            while (curr.getDay() !== 0) curr.setDate(curr.getDate() + 1);
            await svcReady;
            while (curr <= term.to) {
                const dateStr = curr.toISOString().split('T')[0];
                await addDoc(collection(db, "events"), freshEvent(mainType(), dateStr));
                curr.setDate(curr.getDate() + 7);
            }
        };

        /* ADD PRACTICES: one a week through the chosen term. The kind, the
           day and the times are asked each time, because the church keeps no
           setting for its practice night; the kind's own times (Your
           services) are filled in to start, and Thursday is the day offered
           first, as it always was. */
        const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        window.addPractices = async () => {
            const term = chosenTerm();
            if (!term) return;
            await svcReady;
            const kinds = SV.S ? SV.S.types(SV.cfg).filter(t => !t.service) : [];
            if (!kinds.length) { alert("This church has no practice or meeting kinds in Your services yet."); return; }
            const first = kinds.find(t => /practi|rehears/i.test(t.name)) || kinds[0];
            const times = (sel) => buildTimeOptions(sel);
            openSheet('Add practices',
                '<label for="ppPrKind" style="' + SHEET_LBL + '">What kind</label>'
              + '<select id="ppPrKind" style="' + SHEET_FLD + '">' + kinds.map(t => '<option' + (t === first ? ' selected' : '') + '>' + escP(t.name) + '</option>').join('') + '</select>'
              + '<label for="ppPrDay" style="' + SHEET_LBL + '">Day of the week</label>'
              + '<select id="ppPrDay" style="' + SHEET_FLD + '">' + DAY_NAMES.map((d, i) => '<option value="' + i + '"' + (i === 4 ? ' selected' : '') + '>' + d + '</option>').join('') + '</select>'
              + '<div style="display:flex;gap:8px"><div style="flex:1"><label for="ppPrStart" style="' + SHEET_LBL + '">Starts</label>'
              + '<select id="ppPrStart" style="' + SHEET_FLD + '">' + times(first.start || '19:30') + '</select></div>'
              + '<div style="flex:1"><label for="ppPrEnd" style="' + SHEET_LBL + '">Ends</label>'
              + '<select id="ppPrEnd" style="' + SHEET_FLD + '">' + times(first.end || '21:30') + '</select></div></div>',
                'Add', async (msg) => {
                    const kind = document.getElementById('ppPrKind').value, day = +document.getElementById('ppPrDay').value;
                    const startTime = document.getElementById('ppPrStart').value, endTime = document.getElementById('ppPrEnd').value;
                    if (endTime <= startTime) { msg.textContent = 'The end time must be after the start.'; return false; }
                    let curr = new Date(term.from);
                    while (curr.getDay() !== day) curr.setDate(curr.getDate() + 1);
                    while (curr <= term.to) {
                        const dateStr = curr.toISOString().split('T')[0];
                        await addDoc(collection(db, "events"), Object.assign(freshEvent(kind, dateStr),
                            { startTime, endTime, description: DAY_NAMES[day] + ' Rehearsal' }));
                        curr.setDate(curr.getDate() + 7);
                    }
                });
            /* A different kind brings its own usual times. */
            document.getElementById('ppPrKind').onchange = (e) => {
                const t = kinds.find(k => k.name === e.target.value);
                if (!t) return;
                if (t.start) document.getElementById('ppPrStart').value = t.start;
                if (t.end) document.getElementById('ppPrEnd').value = t.end;
            };
        };

        window.autoFillPractice = async (practiceId, silent = false) => {
            const practice = cachedEvents.find(e => e.id === practiceId);
            if(!practice) return;
            const practiceDate = new Date(practice.date);
            const sundayService = cachedEvents.find(e => {
                const eDate = new Date(e.date);
                const diff = (eDate - practiceDate) / (1000 * 60 * 60 * 24);
                return isFilledKind(e.type) && diff > 0 && diff <= 4;
            });
            if(!sundayService) {
                if(!silent) alert("No service found within 4 days after this practice.");
                return;
            }
            const updates = {};
            const roles = practice.roles || sundayService.roles || [];
            roles.forEach(role => {
                const sundayPerson = sundayService.assignments?.[role];
                if(sundayPerson) {
                    updates[`assignments.${role}`] = { id: sundayPerson.id, name: sundayPerson.name };
                }
            });
            if(Object.keys(updates).length > 0) {
                await updateDoc(doc(db, "events", practiceId), updates);
            }
        };

        window.autoFillAllEvents = async () => {
            if (!confirm("Auto-populate all services and sync practices?")) return;
            await svcReady;

            /* The services isFilledKind() picks, not one kind by name;
               everything else is synced like a practice. */
            const activeEvents = cachedEvents.filter(e => !e.archived).sort((a,b) => new Date(a.date) - new Date(b.date));
            const sundayEvents = activeEvents.filter(e => isFilledKind(e.type));
            const practiceEvents = activeEvents.filter(e => !isFilledKind(e.type));

            const lastServed = {};
            sundayEvents.forEach(ev => {
                Object.values(ev.assignments || {}).forEach(raw => {
                    const people = Array.isArray(raw) ? raw : [raw];
                    people.forEach(a => {
                        const d = new Date(ev.date);
                        if (!lastServed[a.id] || d > lastServed[a.id]) lastServed[a.id] = d;
                    });
                });
            });
            const monthlyCounts = {};
            /* The same tally, split by department. maxFrequency limits the
               total; teamCaps limits how much of it any one team may take. */
            const teamCounts = {};

            for (const ev of sundayEvents) {
                const monthKey = new Date(ev.date).toLocaleString('en-GB', { month: 'long', year: 'numeric' });
                if (!monthlyCounts[monthKey]) monthlyCounts[monthKey] = {};
                if (!teamCounts[monthKey]) teamCounts[monthKey] = {};

                const evDate = new Date(ev.date);
                const members = addressBook.filter(m =>
                    availability[ev.id]?.[m.id] === 'avail' && inEventTeams(m, ev)
                );
                const alreadyAssignedToday = new Set(Object.values(ev.assignments || {}).flatMap(raw => Array.isArray(raw) ? raw.map(p=>p.id) : [raw.id]));
                const assignments = { ...(ev.assignments || {}) };
                const liveRoles = new Set(ev.roles || []);

                const tryAssign = (roleName, instrumentName, isPrimaryOnly) => {
                    if (assignments[roleName]) return false;
                    /* Never fill a slot belonging to a department you do not
                       run. Karen pressing AutoFill must not touch worship. */
                    if (!canEditRole(roleName, ev)) return false;
                    let candidates = members.filter(m => {
                        if (alreadyAssignedToday.has(m.id)) return false;
                        if ((monthlyCounts[monthKey][m.id] || 0) >= (parseInt(m.maxFrequency) || 2)) return false;
                        /* maxFrequency is the total across everything. teamCaps
                           is how much of that total any one department may use,
                           which is what stops three Kids Church weeks eating a
                           month that was meant to cover worship as well. */
                        const cap = (m.teamCaps || {})[roleTeam(roleName)];
                        if (cap !== undefined) {
                            const usedHere = (teamCounts[monthKey] && teamCounts[monthKey][m.id]
                                && teamCounts[monthKey][m.id][roleTeam(roleName)]) || 0;
                            if (usedHere >= cap) return false;
                        }
                        return hasSkill(m, instrumentName, isPrimaryOnly);
                    });

                    candidates.sort((a, b) => {
                        const aYouth = isYouthMember(a) ? 1 : 0;
                        const bYouth = isYouthMember(b) ? 1 : 0;
                        if (aYouth !== bYouth) return aYouth - bYouth;
                        const aPrimary = hasSkill(a, instrumentName, true) ? 0 : 1;
                        const bPrimary = hasSkill(b, instrumentName, true) ? 0 : 1;
                        if (aPrimary !== bPrimary) return aPrimary - bPrimary;
                        const aLast = lastServed[a.id] ? (evDate - lastServed[a.id]) : Infinity;
                        const bLast = lastServed[b.id] ? (evDate - lastServed[b.id]) : Infinity;
                        return bLast - aLast;
                    });

                    if (candidates.length > 0) {
                        const chosen = candidates[0];
                        assignments[roleName] = { id: chosen.id, name: chosen.name };
                        alreadyAssignedToday.add(chosen.id);
                        monthlyCounts[monthKey][chosen.id] = (monthlyCounts[monthKey][chosen.id] || 0) + 1;
                        const rt = roleTeam(roleName);
                        if (!teamCounts[monthKey][chosen.id]) teamCounts[monthKey][chosen.id] = {};
                        teamCounts[monthKey][chosen.id][rt] = (teamCounts[monthKey][chosen.id][rt] || 0) + 1;
                        lastServed[chosen.id] = evDate;
                        liveRoles.add(roleName);
                        return true;
                    }
                    return false;
                };

                /* The kind's own rota places (Your services); each is filled
                   by someone who plays or does the thing it is named for. */
                const slots = slotsFor(ev.type);
                slots.forEach(r => tryAssign(r, roleAbility(r), true));
                slots.forEach(r => tryAssign(r, roleAbility(r), false));

                /* THE EXTRA PLACES are the worship, AV and choir teams' places
                   (EGBCAuth.roleFill), each filled by people with its skill:
                   `grow` is a numbered family that takes every available
                   person with the skill (EGBC's singers); `fill` adds one
                   place each, in the teams' order. */
                const plan = EGBCAuth.roleFill ? EGBCAuth.roleFill(['worship', 'av', 'choir']) : { fill: [], grow: [] };
                const inFamily = (r, base) => r === base || new RegExp('^' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' \\d+$').test(r);
                plan.grow.forEach(([base, ability]) => {
                    [...liveRoles].filter(r => inFamily(r, base)).forEach(r => {
                        tryAssign(r, ability, true) || tryAssign(r, ability, false);
                    });

                    const available = members.filter(m =>
                        !alreadyAssignedToday.has(m.id) &&
                        hasSkill(m, ability, false) &&
                        (monthlyCounts[monthKey][m.id] || 0) < (parseInt(m.maxFrequency) || 2)
                    ).sort((a, b) => {
                        const aYouth = isYouthMember(a) ? 1 : 0;
                        const bYouth = isYouthMember(b) ? 1 : 0;
                        if (aYouth !== bYouth) return aYouth - bYouth;
                        const aLast = lastServed[a.id] ? (evDate - lastServed[a.id]) : Infinity;
                        const bLast = lastServed[b.id] ? (evDate - lastServed[b.id]) : Infinity;
                        return bLast - aLast;
                    });

                    /* The extra places are their team's too: only for someone
                       who may fill them. */
                    for (const m of (canEditRole(base + ' 1', ev) ? available : [])) {
                        let nextIdx = 1;
                        while (liveRoles.has(`${base} ${nextIdx}`)) nextIdx++;
                        const newRole = `${base} ${nextIdx}`;
                        assignments[newRole] = { id: m.id, name: m.name };
                        alreadyAssignedToday.add(m.id);
                        monthlyCounts[monthKey][m.id] = (monthlyCounts[monthKey][m.id] || 0) + 1;
                        lastServed[m.id] = evDate;
                        liveRoles.add(newRole);
                    }
                });

                plan.fill.forEach(([role, ability]) => {
                    if (!liveRoles.has(role)) {
                        if (tryAssign(role, ability, true) || tryAssign(role, ability, false)) liveRoles.add(role);
                    }
                });

                await updateDoc(doc(db, "events", ev.id), { assignments, roles: [...liveRoles] });
            }

            let practicesSynced = 0;
            for (const practice of practiceEvents) {
                await autoFillPractice(practice.id, true);
                practicesSynced++;
            }

            alert(`Auto-fill complete!\n\nServices filled: ${sundayEvents.length}\nPractices synced: ${practicesSynced}`);

        /* Everyone in a person's household.

           The address book records households two ways. Natasha and Daniel
           point at Martin; Martin points back at Natasha. Asking "who is the
           head, and who points at them" starts from Martin, lands on Natasha
           as the head, and collects only the people pointing at her - so
           Daniel, one link further out, was missing from Martin's rota and
           his wall planner while appearing on both of theirs.

           Deciding a head by hand for every family is a rule people have to
           remember. Following every link instead, in both directions until
           nothing new turns up, needs nobody to know anything: a household
           is just the group of people joined by those pointers. */
        function householdOf(memberId) {
            const seen = new Set([memberId]);
            const queue = [memberId];
            while (queue.length) {
                const id = queue.shift();
                const person = addressBook.find(m => m.id === id);
                if (person?.householdId && !seen.has(person.householdId)) {
                    seen.add(person.householdId);
                    queue.push(person.householdId);
                }
                addressBook.forEach(m => {
                    if (m.householdId === id && !seen.has(m.id)) { seen.add(m.id); queue.push(m.id); }
                });
            }
            return addressBook.filter(m => seen.has(m.id)).map(m => m.id);
        }

        function buildICS(events, getMemberEvents) {
            const CRLF = "\r\n";
            const formatDateTime = (dateStr, timeStr) => {
                const [y, m, d] = dateStr.split('-');
                if (timeStr) { const [h, min] = timeStr.split(':'); return `${y}${m}${d}T${h}${min}00`; }
                return `${y}${m}${d}`;
            };
            const escapeICS = str => (str || '').replace(/[\\;,]/g, c => '\\' + c).replace(/\n/g, '\\n');
            // RFC 5545: lines longer than 75 characters must be folded (long video links would otherwise break some calendars)
            const fold = line => line.length <= 75 ? line : line.match(/.{1,74}/gu).join(CRLF + ' ');
            /* The calendar is named after the church; the event ids carry this
               site's own address, so they never clash with another church's. */
            let lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Church HQ//Rota//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",fold(`X-WR-CALNAME:${escapeICS(churchPrefix(' ') + 'Rota')}`),"X-WR-TIMEZONE:Europe/London"];
            events.forEach(ev => {
                const { summary, description, dateStr, startTime, endTime } = getMemberEvents(ev);
                const uid = `rota-${ev.id}-${dateStr}@${location.hostname || 'churchhq'}`;
                const dtstamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                lines.push("BEGIN:VEVENT", `UID:${uid}`, `DTSTAMP:${dtstamp}`);
                if (startTime) {
                    lines.push(`DTSTART;TZID=Europe/London:${formatDateTime(dateStr, startTime)}`, `DTEND;TZID=Europe/London:${formatDateTime(dateStr, endTime || startTime)}`);
                } else {
                    lines.push(`DTSTART;VALUE=DATE:${formatDateTime(dateStr, null)}`, `DTEND;VALUE=DATE:${formatDateTime(dateStr, null)}`);
                }
                const videoLink = videoLinkFor(ev);
                const fullDescription = videoLink ? `${description}\n\nJoin the video call: ${videoLink}` : description;
                lines.push(fold(`SUMMARY:${escapeICS(summary)}`), fold(`DESCRIPTION:${escapeICS(fullDescription)}`));
                if (videoLink) lines.push(fold(`LOCATION:${escapeICS(videoLink)}`), fold(`URL:${videoLink}`));
                lines.push("END:VEVENT");
            });
            lines.push("END:VCALENDAR");
            return lines.join(CRLF) + CRLF;
        }

                if (fullDoc) attachments.push({ filename: 'Full_Church_Rota.pdf', content: await uploadAndEncode(fullDoc.output('blob'), `rota-temp/${packageId}/${safeName}_Full_Church_Rota.pdf`) });

                const rolesForMemberS = (ev, id) => Object.entries(ev.assignments || {}).filter(([r,raw]) => { const pp=Array.isArray(raw)?raw:[raw]; return pp.some(p=>p.id===id); }).map(([r])=>r).join(', ');
                const rolesForFamilyS = (ev, ids) => Object.entries(ev.assignments || {}).flatMap(([r,raw]) => { const pp=Array.isArray(raw)?raw:[raw]; return pp.filter(p=>ids.includes(p.id)).map(p=>`${p.name.split(' ')[0]}: ${r}`); }).join(', ');

                if (personalEvents.length > 0) {
                    const icsStr = buildICS(personalEvents, ev => ({
                        dateStr: ev.date, startTime: ev.startTime || null, endTime: ev.endTime || null,

                    }));
