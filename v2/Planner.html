                if (familyEvents.length > 0) {
                    const hIcsStr = buildICS(familyEvents, ev => ({
                        dateStr: ev.date, startTime: ev.startTime || null, endTime: ev.endTime || null,
                        summary: `${churchPrefix(' ')}Family: ${rolesForFamilyS(ev, hIds) || ev.type}`,
                        description: `${ev.type}${ev.description ? ' — ' + ev.description : ''}`
                    }));
                    attachments.push({ filename: `${safeName}_Household_Rota.ics`, content: btoa(unescape(encodeURIComponent(hIcsStr))) });
                }

                const dateRows = personalEvents.map(ev => {
                    const roles = rolesForMemberS(ev, mId) || ev.type;
                    const d = new Date(ev.date);
                    const dateStr = d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'long', year:'numeric' });
                    const timeStr = ev.startTime ? ` &bull; ${ev.startTime}–${ev.endTime || ''}` : '';
                    return `<tr><td style="padding:9px 10px;border-bottom:1px solid #eaf2f2;font-family:Arial,sans-serif;font-size:13px;color:#333333;">${dateStr}${timeStr}</td><td style="padding:9px 10px;border-bottom:1px solid #eaf2f2;font-family:Arial,sans-serif;font-size:13px;color:#3d6263;font-weight:800;">${roles}</td></tr>`;
                }).join('');

                const html = await rotaEmail("Your Rota", escE(termLabels), `    <p style="margin:0 0 20px;font-family:Arial,sans-serif;font-size:15px;color:#333333;line-height:1.8;">Hi ${firstName},</p>
    <p style="margin:0 0 28px;font-family:Arial,sans-serif;font-size:15px;color:#555555;line-height:1.8;">Please find your rota attached for the upcoming term. We are really grateful for your faithful service and look forward to worshipping together with you.</p>
    <p style="margin:0 0 12px;font-family:Arial,sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:#3d6263;">Your Serving Dates</p>
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;border-top:2px solid #3d6263;margin-bottom:32px;">
      <tr bgcolor="#f4f9f9"><td style="padding:8px 10px;font-family:Arial,sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7a9e9f;font-weight:800;">Date &amp; Time</td><td style="padding:8px 10px;font-family:Arial,sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7a9e9f;font-weight:800;">Role</td></tr>
      ${dateRows}
    </table>
    <p style="margin:0 0 36px;font-family:Arial,sans-serif;font-size:14px;color:#555555;line-height:1.8;">Your individual rota, household rota, wall planner, full church rota and calendar files (.ics) are all attached.</p>`);

                toast.innerHTML = `Sending to <strong>${member.name}</strong>...`;
                const result = await sendRota({ to: [member.email], subject: `Your ${rotaWords() ? rotaWords() + ' ' : ''}Rota — ${termLabels}`, html, attachments });
                await Promise.allSettled(storageRefs.map(r => deleteObject(r)));
                if (result.ok) {
                    toast.innerHTML = `Rota sent to <strong>${member.name}</strong>`;
                    toast.style.background = '#3B7D23';
                } else {
                    toast.innerHTML = `Could not send: ${result.error}`;
                    toast.style.background = '#e05555';
                }
            } catch(e) {
                await Promise.allSettled(storageRefs.map(r => deleteObject(r)));
                toast.innerHTML = `Could not send: ${e.message}`;
                toast.style.background = '#e05555';
            }
            setTimeout(() => toast.remove(), 6000);
        };

        /* GATHER AVAIL: the term is chosen from the terms on the rota, not
           typed (a typed name had to match exactly or nothing was found). */
        window.gatherTermAvailability = async () => {
            await Promise.all([churchDetails(), svcReady, churchShortName()]);
            const terms = [...new Set(cachedEvents.filter(e => !e.archived).map(e => e.termLabel).filter(Boolean))].sort();
            if (!terms.length) { alert("There are no terms on the rota yet."); return; }
            openSheet('Gather availability',
                '<label for="ppGaTerm" style="' + SHEET_LBL + '">Which term</label>'
              + '<select id="ppGaTerm" style="' + SHEET_FLD + '">' + terms.map(t => '<option>' + escP(t) + '</option>').join('') + '</select>',
                'Next', () => { const t = document.getElementById('ppGaTerm').value; setTimeout(() => gatherFor(t), 0); });
        };
        async function gatherFor(selectedTerm) {
            if (!selectedTerm) return;

            const termEvents = cachedEvents.filter(e => !e.archived && e.termLabel === selectedTerm).sort((a, b) => new Date(a.date) - new Date(b.date));
            const emails = new Set();
            termEvents.forEach(ev => {
                addressBook.forEach(m => {
                    if (m.email && inEventTeams(m, ev)) emails.add(m.email);
                });
            });

            const emailList = [...emails].filter(Boolean);
            if (emailList.length === 0) { alert("No team members found for that term."); return; }
            if (!confirm(`Send availability request for ${selectedTerm} to ${emailList.length} team members?`)) return;

            /* Every service in the term (Your services), each with its kind
               when the church has more than one. */
            const svcEvents = termEvents.filter(e => isServiceType(e.type));
            const manyKinds = new Set(svcEvents.map(e => e.type)).size > 1;
            const dateRows = svcEvents
                .map(ev => {
                    const d = new Date(ev.date);
                    const dateStr = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
                    return `<tr><td style="padding:9px 10px;border-bottom:1px solid #eaf2f2;font-family:Arial,sans-serif;font-size:13px;color:#333333;">${dateStr}${manyKinds ? ' &bull; ' + escE(ev.type) : ''}</td></tr>`;
                }).join('');

            const html = await rotaEmail("Availability Request", escE(selectedTerm), `    <p style="margin:0 0 20px;font-family:Arial,sans-serif;font-size:15px;color:#333333;line-height:1.8;">Hi,</p>
    <p style="margin:0 0 20px;font-family:Arial,sans-serif;font-size:15px;color:#555555;line-height:1.8;">We are planning the ${escE(rotaWords() ? rotaWords() + ' ' : '')}rota for <strong>${escE(selectedTerm)}</strong> and would love to know your availability.</p>
    <p style="margin:0 0 12px;font-family:Arial,sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:#3d6263;">Services This Term</p>
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;border-top:2px solid #3d6263;margin-bottom:32px;">
      <tr bgcolor="#f4f9f9"><td style="padding:8px 10px;font-family:Arial,sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7a9e9f;font-weight:800;">Date</td></tr>
      ${dateRows}
    </table>
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:36px;"><tr><td align="center">
      <a href="${FORM_LINK}" style="display:inline-block;background:#3d6263;color:#ffffff;font-family:Arial,sans-serif;font-size:15px;font-weight:800;text-decoration:none;padding:16px 40px;border-radius:12px;">Fill In My Availability →</a>
    </td></tr></table>
    <p style="margin:0 0 36px;font-family:Arial,sans-serif;font-size:14px;color:#555555;line-height:1.8;">Thank you so much for your faithful service.</p>`);

            const toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#3d6263;color:white;padding:14px 22px;border-radius:14px;font-family:Inter, system-ui, sans-serif;font-size:13px;font-weight:500;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.25);min-width:240px;line-height:1.4;';
            toast.textContent = 'Sending availability requests...';
            document.body.appendChild(toast);

            try {
                const result = await sendRota({ to: emailList, subject: `Availability Request — ${selectedTerm}`, html });
                if (result.ok) {
                    toast.innerHTML = `Availability request sent to <strong>${emailList.length}</strong> team members!`;
                    toast.style.background = '#3B7D23';
                } else {
                    toast.innerHTML = `Could not send: ${result.error}`;
                    toast.style.background = '#e05555';
                }
            } catch (e) {
                toast.innerHTML = `Could not send: no connection (${e.message})`;
                toast.style.background = '#e05555';
            }
            setTimeout(() => toast.remove(), 6000);
        };

        function buildTimeOptions(selected) {
            let opts = '';
            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m += 15) {
                    const val = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
                    opts += `<option value="${val}"${selected === val ? ' selected' : ''}>${val}</option>`;
                }
            }
            return opts;
        }

        setTimeout(() => {
            const savedSender = localStorage.getItem('egbc-sender-email') || '';
            const rotaEl = document.getElementById('rotaSenderEmail');
            if (rotaEl) rotaEl.value = savedSender;
        }, 800);

        /* The guard resolves the profile after this module has already run,
           so the first render happens without knowing who is looking - and
           myRotaTeams() answers "everyone" when there is no profile yet.
           That put every worship role on Karen's screen. Draw it again once
           we know. Same fix as the read-only rota. */
        document.addEventListener('egbc-ready', () => {
            loadSignoffs().then(renderPlanner).catch(() => renderPlanner());
        });

        function renderPlanner() {
            // Don't re-render if user is typing in an input/textarea
            const active = document.activeElement;
            if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && active.closest('#eventList')) return;
            const container = document.getElementById('eventList');
            container.innerHTML = '';
            /* Opens at the next date (Martin, 14 Oct 2026): after this redraw, for the first few seconds. */
            setTimeout(() => EGBCUKDates.openAtNext(container), 0);

            // ── Deduplicate: for each date+type keep the doc with the most assignments ──
            const dedupMap = {};
            cachedEvents.forEach(ev => {
                if(ev.archived) return;
                const key = `${ev.date}||${ev.type}`;
                if (!dedupMap[key]) {
                    dedupMap[key] = ev;
                } else {
                    const existingCount = Object.keys(dedupMap[key].assignments || {}).length;
                    const newCount = Object.keys(ev.assignments || {}).length;
                    if (newCount > existingCount) dedupMap[key] = ev;
                }
            });
            const deduped = Object.values(dedupMap);

            const grouped = {};
            deduped.forEach(ev => {
                const termKey = ev.termLabel || getTermLabel(ev.date);
                if (!grouped[termKey]) grouped[termKey] = [];
                grouped[termKey].push(ev);
            });

            Object.keys(grouped).sort().forEach(term => {
                /* A term whose dates are all past is not drawn while they are hidden. */
                if (!grouped[term].some(ev => !EGBCUKDates.hidden(ev.date))) return;
                const isCollapsed = collapsedTerms.has(term);
                let html = '<div class="mb-12">';
                html += '<div class="flex justify-between items-center gap-4 flex-wrap bg-white px-5 py-4 border border-[#e5e7eb] rounded-t-[14px]">';
                html += '<button onclick="toggleTermCollapse(\'' + term + '\')" class="text-[14px] font-semibold text-[#111827] flex items-center gap-2">' + term + '</button>';
                html += signoffStrip(term);
                html += '<button onclick="archiveTerm(\'' + term + '\')" class="text-[13px] font-medium text-[#6b7280] border border-[#e5e7eb] px-3 py-1.5 rounded-[8px] hover:bg-[#f3f4f6] transition-colors">Archive</button>';
                html += '</div>';
                html += '<div class="' + (isCollapsed ? 'hidden' : 'block') + ' bg-white p-5 border-x border-b border-[#e5e7eb] rounded-b-[14px]">';

                const termEventsSorted = grouped[term].sort((a,b) => new Date(a.date) - new Date(b.date));
                const byMonth = {};
                termEventsSorted.forEach(ev => {
                    const month = new Date(ev.date).toLocaleString('en-GB', { month: 'long', year: 'numeric' });
                    if(!byMonth[month]) byMonth[month] = [];
                    byMonth[month].push(ev);
                });

                Object.keys(byMonth).forEach(month => {
                    /* The rows shown; the month's totals below still count every Sunday in it. */
                    const shown = byMonth[month].filter(ev => !EGBCUKDates.hidden(ev.date));
                    if (!shown.length) return;
                    html += '<div class="mb-10 pb-8"><h3 class="text-[14px] font-semibold text-[#111827] mb-5 pb-3 border-b border-[#e5e7eb]">' + month + '</h3>';
                    const blocks = []; let current = [];
                    shown.forEach(ev => {
                        current.push(ev);
                        if(isFilledKind(ev.type)) { blocks.push(current); current = []; }
                    });
                    if(current.length > 0) blocks.push(current);
                    blocks.forEach((block, idx) => { block.forEach(ev => { html += generateEventHtml(ev, idx); }); });

                    const stats = {};
                    byMonth[month].forEach(ev => {
                        if(isFilledKind(ev.type) && ev.assignments) {
                            /* A slot can hold several people: each counts once a service. */
                            const names = new Set(Object.values(ev.assignments).flatMap(p => (Array.isArray(p) ? p : [p]).map(x => x && x.name)));
                            names.forEach(n => { if(n) stats[n] = (stats[n] || 0) + 1; });
                        }
                    });
                    if(Object.keys(stats).length > 0) {
                        html += '<div class="mt-8 bg-white rounded-[14px] p-5 border border-[#e5e7eb]" style="box-shadow:0 1px 2px rgba(16,24,40,.05)">';
                        html += '<div class="text-[13px] font-semibold text-[#111827] mb-4 pb-3 border-b border-[#e5e7eb]">' + escP(EGBCAuth.serviceDay()) + 's served this month</div>';
                        html += '<div class="flex flex-wrap justify-center gap-4">';
                        Object.entries(stats).sort((a,b) => a[0].localeCompare(b[0])).forEach(([n, c]) => {
                            html += '<div class="text-[13px] text-[#374151] bg-[#f9fafb] px-3 py-2 rounded-[8px] border border-[#e5e7eb] flex items-center gap-2"><span>' + n + '</span><span class="text-[14px] font-semibold text-[#111827]">' + c + '</span></div>';
                        });
                        html += '</div></div>';
                    }
                    html += '</div>';
                });
                container.innerHTML += html + '</div></div>';
            });

            // ── ARCHIVED TERMS SECTION ──────────────────────────────────
            const archivedDedupMap = {};
            cachedEvents.forEach(ev => {
                if(!ev.archived) return;
                const key = `${ev.date}||${ev.type}`;
                if (!archivedDedupMap[key]) {
                    archivedDedupMap[key] = ev;
                } else {
                    const existingCount = Object.keys(archivedDedupMap[key].assignments || {}).length;
                    const newCount = Object.keys(ev.assignments || {}).length;
                    if (newCount > existingCount) archivedDedupMap[key] = ev;
                }
            });
            const archivedGrouped = {};
            Object.values(archivedDedupMap).forEach(ev => {
                const termKey = ev.termLabel || getTermLabel(ev.date);
                if (!archivedGrouped[termKey]) archivedGrouped[termKey] = [];
                archivedGrouped[termKey].push(ev);
            });

            if (Object.keys(archivedGrouped).length > 0) {
                let archHtml = '<div class="mt-16 mb-4">';
                archHtml += '<div class="flex items-center gap-4 mb-6">';
                archHtml += '<div class="flex-1 h-px bg-[#d1dfdf]"></div>';
                archHtml += '<span class="text-[11px] font-semibold uppercase tracking-widest text-[#3d6263] opacity-40">Archived Terms</span>';
                archHtml += '<div class="flex-1 h-px bg-[#d1dfdf]"></div>';
                archHtml += '</div>';

                Object.keys(archivedGrouped).sort().forEach(term => {
                    const count = archivedGrouped[term].length;
                    archHtml += '<div class="flex items-center justify-between bg-[#f0f6f6] border border-[#d1dfdf] rounded-[1.5rem] px-6 py-4 mb-3">';
                    archHtml += `<div class="flex items-center gap-4">`;
                    archHtml += `<span class="text-[13px] font-medium text-[#3d6263] opacity-60">${term}</span>`;
                    archHtml += `<span class="text-[11px] font-medium text-[#3d6263] opacity-40">${count} service${count !== 1 ? 's' : ''}</span>`;
                    archHtml += `</div>`;
                    archHtml += `<button onclick="unarchiveTerm('${term}')" class="bg-[#3d6263] text-white px-5 py-2 rounded-full font-semibold text-[10px] uppercase hover:bg-[#2e4c4d] transition-all shadow-sm"><i data-lucide="undo-2" style="width:15px;height:15px;vertical-align:-2px"></i> Restore</button>`;
                    archHtml += '</div>';
                });

                archHtml += '</div>';
                container.innerHTML += archHtml;
            }
        }

        function generateEventHtml(ev, blockIdx) {
            const assignedIds = Object.values(ev.assignments || {}).flatMap(a => Array.isArray(a) ? a.map(p => p.id) : [a.id]);
            const members = addressBook.filter(m => inEventTeams(m, ev));
            const respondersAvail = members.filter(m => availability[ev.id]?.[m.id] === 'avail' && (!hideAssigned || !assignedIds.includes(m.id)));
            const declined = members.filter(m => (availability[ev.id]?.[m.id] === 'unavailable' || availability[ev.id]?.[m.id] === 'not-avail') && (!hideAssigned || !assignedIds.includes(m.id)));
            const pending = members.filter(m => !availability[ev.id]?.[m.id] && (!hideAssigned || !assignedIds.includes(m.id)));
            const isSunday = isServiceType(ev.type);
            const mandatoryFilled = isSunday && slotsFor(ev.type).every(r => {
                const raw = ev.assignments?.[r];
                return Array.isArray(raw) ? raw.length > 0 : !!raw;
            });
            const rowClass = !isSunday ? 'bg-white border-dashed border-[#e5e7eb]' : 'bg-white border-[#e5e7eb]';
            const dateBg = !isSunday ? 'bg-[#d1dfdf]' : 'bg-[#3d6263]';
            /* One rota, but each person edits only their department's part
               of it. A master admin sees the lot. */
            const visibleRoles = (ev.roles || []).filter(r => canEditRole(r, ev));
            const sortedRoles = [...visibleRoles.filter(r => !AV_ROLES().includes(r)), ...visibleRoles.filter(r => AV_ROLES().includes(r))];
            const hiddenRoleCount = (ev.roles || []).length - visibleRoles.length;
            const iconStyles = 'width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"';
            const timeSelectStyle = 'bg-white border border-[#d1dfdf] text-[#3d6263] px-2 py-1 rounded-full font-medium text-[11px] outline-none';
            const startTimeHtml = `<select onchange="updateField('${ev.id}', 'startTime', this.value)" class="${timeSelectStyle}">${buildTimeOptions(ev.startTime || '08:00')}</select>`;
            const endTimeHtml = `<select onchange="updateField('${ev.id}', 'endTime', this.value)" class="${timeSelectStyle}">${buildTimeOptions(ev.endTime || '11:30')}</select>`;
            const timeGroupHtml = `<div class="flex items-center gap-1 bg-white px-3 py-1 rounded-full border border-[#d1dfdf] shadow-sm text-[10px] font-semibold text-[#3d6263] uppercase">${startTimeHtml}<span class="opacity-40">–</span>${endTimeHtml}</div>`;

            let html = '<div data-date="' + ev.date + '" class="' + rowClass + ' border rounded-[14px] p-4 mb-3 relative overflow-visible" style="box-shadow:0 1px 2px rgba(16,24,40,.05)">';
            html += '<div class="flex flex-wrap items-center gap-4 overflow-visible">';
            html += '<div class="relative">';
            html += '<button onclick="toggleEventExpand(\'' + ev.id + '\')" class="w-8 h-8 flex items-center justify-center rounded-full bg-white text-[#3d6263] shadow-sm border border-[#d1dfdf]">';
            html += (expandedEvents.has(ev.id) || isSunday ? '<svg ' + iconStyles + ' viewBox="0 0 24 24"><path d="M19.5 12h-15" /></svg>' : '<svg ' + iconStyles + ' viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15" /></svg>');
            html += '</button>';
            if (mandatoryFilled) html += '<div class="absolute -top-1 -right-1 w-3 h-3 bg-green-400 rounded-full border-2 border-white" title="All mandatory roles filled"></div>';
            html += '</div>';
            html += '<input type="date" value="' + ev.date + '" onchange="updateField(\'' + ev.id + '\', \'date\', this.value)" class="' + dateBg + ' ' + (!isSunday ? 'text-[#3d6263]' : 'text-white') + ' px-4 py-2 rounded-full font-medium text-[11px] shadow-sm">';
            html += timeGroupHtml;
            html += '<select onchange="updateField(\'' + ev.id + '\', \'type\', this.value)" class="bg-white px-4 py-2 rounded-full font-medium text-[#3d6263] text-[11px] border border-[#d1dfdf] outline-none">';
            if (ev.type && !typeNames().includes(ev.type)) html += '<option value="' + escP(ev.type) + '" selected>' + escP(ev.type) + '</option>';
            typeNames().forEach(t => { html += '<option value="' + escP(t) + '" ' + (ev.type === t ? 'selected' : '') + '>' + escP(t) + '</option>'; });
            html += '</select>';
            html += '<textarea rows="1" onblur="updateField(\'' + ev.id + '\', \'description\', this.value)" onclick="event.stopPropagation()" placeholder="Notes..." class="flex-grow bg-white px-5 py-2 rounded-xl text-[12px] font-medium border border-[#d1dfdf] outline-none text-[#3d6263]">' + (ev.description || '') + '</textarea>';
            const vRoom = videoRoomFor(ev);
            html += '<select title="Video call" onclick="event.stopPropagation()" onchange="updateField(\'' + ev.id + '\', \'videoRoom\', this.value)" class="' + (vRoom ? 'bg-[#3d6263] text-white' : 'bg-white text-[#3d6263]') + ' px-4 py-2 rounded-full font-medium text-[11px] border border-[#d1dfdf] outline-none">';
            html += '<option value=""' + (vRoom ? '' : ' selected') + '>No video call</option>';
            (V() ? V().rooms() : []).forEach(({ key: r, label }) => {
                html += '<option value="' + r + '"' + (vRoom === r ? ' selected' : '') + '>' + label + '</option>';
            });
            /* A meeting's own room (functions/meeting-rooms.js), as the rota shows it. */
            if (vRoom && V() && !V().rooms().some(x => x.key === vRoom)) html += '<option value="' + escP(vRoom) + '" selected>Its own room</option>';
            html += '</select>';
            if (vRoom && V()) html += '<a href="' + V().link(vRoom, ev) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="bg-green-600 text-white px-4 py-2 rounded-full font-semibold text-[10px] uppercase shadow-sm hover:bg-black transition-all">Join</a>';
            // ── The church's service roles (H-11; EGBC: Service Leader, Speaker) ──
            serviceRoles().forEach(r => {

            // time the public come (not the team's call time), a line about it,
            // and the speaker. Saved as each is changed, like the rest of the row.

                const pubEsc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

                html += '<input data-f="publicTitle" value="' + pubEsc(ev.publicTitle) + '" maxlength="140" placeholder="' + pubEsc(ev.type || 'Title') + '" aria-label="Title in What\'s On" onblur="updateField(\'' + ev.id + '\',\'publicTitle\',this.value.trim())" class="bg-white px-3 py-2 rounded-full font-medium text-[#3d6263] text-[11px] border border-[#d1dfdf] outline-none w-48">';

                html += '<button onclick="autoFillPractice(\'' + ev.id + '\')" class="bg-[#d1dfdf] text-[#3d6263] px-5 py-2 rounded-full font-semibold text-[10px] uppercase shadow-sm flex items-center gap-1 hover:bg-[#3d6263] hover:text-white transition-all"><svg ' + iconStyles + ' viewBox="0 0 24 24" class="w-3 h-3"><path d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>Sync</button>';

            html += '<div class="flex items-center gap-4 relative">';
            html += '<button onclick="toggleBucket(\'' + ev.id + '\')" class="w-11 h-11 rounded-full bg-white text-[#3d6263] flex items-center justify-center border border-[#d1dfdf] shadow-sm hover:scale-110 transition-all"><svg ' + iconStyles + ' viewBox="0 0 24 24"><path d="M20.25 14.15v4.25c0 .414-.336.75-.75.75H4.5a.75.75 0 0 1-.75-.75v-4.25m16.5 0a3 3 0 0 0-3-3H7.012a3 3 0 0 0-3 3m16.5 0-2.25-6.108a4.835 4.835 0 0 0-3.6-3.392 48.359 48.359 0 0 0-5.325 0 4.835 4.835 0 0 0-3.6 3.392L3.75 14.15m6.5 2.15a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm6 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" /></svg></button>';
            html += '<button onclick="deleteEvent(\'' + ev.id + '\')" class="text-[#d1dfdf] hover:text-red-500 transition-colors"><svg ' + iconStyles + ' viewBox="0 0 24 24" class="w-6 h-6"><path d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg></button>';

                // Support both old single-object and new array format

            if (hiddenRoleCount > 0) {

            if (openBuckets.has(ev.id)) {

                html += '<div class="flex flex-wrap gap-2 min-h-[30px]">';
                respondersAvail.forEach(m => { html += '<div draggable="true" ondragstart="onDragStart(event, \'' + m.id + '\', \'' + m.name.replace(/'/g, "\\'") + '\')" class="px-3 py-1.5 bg-[#f0f7ec] text-[#3b7d23] rounded-[8px] text-[13px] font-medium border border-[#dbead1] cursor-grab">' + m.name + '</div>'; });
                html += '</div></div>';
                html += '<div ondragover="event.preventDefault()" ondrop="onDropBucket(event, \'' + ev.id + '\', \'not-avail\'); event.stopPropagation();">';
                html += '<div class="text-[13px] font-semibold text-[#111827] mb-3 pb-2 border-b border-[#e5e7eb]">Declined</div>';
                html += '<div class="flex flex-wrap gap-2 min-h-[30px]">';
                declined.forEach(m => { html += '<div draggable="true" ondragstart="onDragStart(event, \'' + m.id + '\', \'' + m.name.replace(/'/g, "\\'") + '\')" class="px-3 py-1.5 bg-[#fbeeec] text-[#b0392c] rounded-[8px] text-[13px] font-medium border border-[#f0d8d4] cursor-grab">' + m.name + '</div>'; });
                html += '</div></div>';
                html += '<div ondragover="event.preventDefault()" ondrop="onDropBucket(event, \'' + ev.id + '\', \'pending\'); event.stopPropagation();">';
                html += '<div class="text-[13px] font-semibold text-[#111827] mb-3 pb-2 border-b border-[#e5e7eb]">Pending</div>';
                html += '<div class="flex flex-wrap gap-2 min-h-[30px]">';
                pending.forEach(m => { html += '<div draggable="true" ondragstart="onDragStart(event, \'' + m.id + '\', \'' + m.name.replace(/'/g, "\\'") + '\')" class="px-3 py-1.5 bg-[#f9fafb] text-[#6b7280] rounded-[8px] text-[13px] font-medium border border-[#e5e7eb] cursor-grab">' + m.name + '</div>'; });
                html += '</div></div></div></div>';
            }
            html += '</div></div>';
            return html;
        }
    </script>

<script>
/* ── egbc-uk-dates (Martin, 14 Oct 2026) ─────────────────────────────
   One copy in each rota and planner page, here and on the original site,
   because the original site's pages load nothing shared. KEEP EVERY COPY
   THE SAME: screenshots/events/rota-dates.test.mjs fails if one differs.

   EGBCUKDates.long('2026-10-11')   "Sunday 11 October 2026"
   EGBCUKDates.short('2026-10-11')  "Sun 11 Oct 2026"
   EGBCUKDates.today()              today in England, yyyy-mm-dd

   Rotas: past dates hidden unless "Show past dates" is on, remembered on
   this device; the page opens at the next date.
     hidden(date), showPast(), togglePast(btn), paintPast(btn), scrollToNext(box),
     openAtNext(box) after every redraw

   Planners: "Service date" becomes the coming services from the rota,
   with ◀ ▶ and "Pick another date". The date box stays underneath with
   its own id and value (yyyy-mm-dd), so everything that reads it, and
   everything that sets it, works as before.
     attach(input, { load, eventSelect, preferred, keepValue })

   Every date box on the page (rota rows, "new event", "Pick another
   date"): shows "Sun 18 Oct 2026", never the browser's 10/18/2026.
     ukify(input), ukifyAll(box), and it happens by itself to any added
   ─────────────────────────────────────────────────────────────────── */
(function (g) {
  if (g.EGBCUKDates) return;
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var KEY = 'egbc-rota-show-past';

  function parts(ymd) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd || '').slice(0, 10));
    if (!m) return null;
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return { y: +m[1], m: +m[2] - 1, d: +m[3], w: d.getUTCDay() };
  }
  function long(ymd) { var p = parts(ymd); return p ? DAYS[p.w] + ' ' + p.d + ' ' + MONTHS[p.m] + ' ' + p.y : String(ymd == null ? '' : ymd); }
  function short(ymd) { var p = parts(ymd); return p ? DAYS[p.w].slice(0, 3) + ' ' + p.d + ' ' + MONTHS[p.m].slice(0, 3) + ' ' + p.y : String(ymd == null ? '' : ymd); }
  function today() {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) {
      var d = new Date();
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }
  }

  /* ---- rotas ---- */
  function showPast() { try { return g.localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function setShowPast(v) { try { if (v) g.localStorage.setItem(KEY, '1'); else g.localStorage.removeItem(KEY); } catch (e) {} }
  function hidden(ymd) { return !showPast() && String(ymd || '') < today(); }
  function paintPast(btn) {
    if (!btn) return;
    var on = showPast();
    btn.textContent = on ? 'Hide past dates' : 'Show past dates';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('data-past-toggle', on ? 'on' : 'off');
  }
  function togglePast(btn) { setShowPast(!showPast()); paintPast(btn); return showPast(); }
  /* The first row dated today or later, brought into view. */
  function scrollToNext(box) {
    var rows = (box || document).querySelectorAll('[data-date]'), t = today();
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].getAttribute('data-date') >= t) {
        try { rows[i].scrollIntoView({ block: 'start' }); } catch (e) { rows[i].scrollIntoView(); }
        return rows[i];
      }
    }
    return null;
  }
  /* Called after every redraw: for the first few seconds the list is
     drawn again as the rota arrives, and each redraw would put the page
     back at the top. Stops the moment the person scrolls, taps or types. */
  var opened = 0, stopped = false;
  function stop() { stopped = true; }
  function openAtNext(box) {
    if (stopped || (opened && Date.now() - opened > 5000)) return null;

<!-- ================================================================

<style>

    #ppBar .pp-new { background: #3d6263; border-color: #3d6263; color: #fff; }

    #ppScrim.on { display: block; position: fixed; inset: 0; background: rgba(17,24,39,.4); z-index: 9000; }

    #ppSheet .pp-sh b { font-size: 16px; color: #14201f; }
    #ppSheet .pp-x { width: 44px; height: 44px; border: 1px solid #d1dfdf; border-radius: 10px; background: #fff; font-size: 18px; }
    #ppSheet header { display: flex !important; flex-direction: column; gap: 12px; margin: 0 !important; padding: 0 !important; border: 0 !important; }
    #ppSheet header > div { padding: 10px !important; gap: 8px !important; width: 100%; }
    #ppSheet header button, #ppSheet header select, #ppSheet header input { min-height: 44px; }
    #ppSheet header input { min-width: 0 !important; }

    .pp-sum { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 64px; padding: 12px 14px; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
