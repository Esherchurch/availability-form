<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Team Hub</title>
<link rel="manifest" href="./manifest-hub.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3d6263">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js"></script>
<style>
  :root{
    --canvas:#eef4f3; --surface:#fff; --surface-2:#f6faf9; --ink:#14201f; --body:#3a4d4c;
    --muted:#6b8281; --faint:#93a8a6; --line:#dde7e6; --line-2:#c9d8d6;
    --brand:#3d6263; --brand-dark:#2e4c4d; --tint:#e7f0ef;
    --gold:#b07d2e; --gold-tint:#f6efe1; --gold-line:#e8d9b8; --gold-ink:#8a5f1e;
    --sh-sm:0 1px 2px rgba(20,32,31,.05);
    --sh:0 1px 2px rgba(20,32,31,.04),0 6px 20px rgba(20,32,31,.07);
    --sh-lg:0 2px 4px rgba(20,32,31,.05),0 18px 48px rgba(20,32,31,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);font-family:'Montserrat',sans-serif;color:var(--brand);-webkit-font-smoothing:antialiased}
  h1,h2,h3{color:var(--ink);margin:0}
  a{color:inherit}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}

  /* ---- bar ---- */
  .bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;
       padding:10px 18px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none}
  .brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
  .brand .k{font-size:9px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);line-height:1.4}
  .brand .n{font-size:14px;font-weight:900;color:var(--ink);line-height:1.2}
  .btn{font-family:inherit;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
       padding:9px 17px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--brand);cursor:pointer;transition:.15s}
  .btn:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.solid{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.solid:hover{background:#000}
  .btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
  .btn.gold:hover{background:#000}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;
          justify-content:center;font-size:9px;font-weight:900;flex-shrink:0}

  /* ---- hero ---- */
  .hero{position:relative;min-height:200px;display:flex;align-items:flex-end;padding:34px 30px 28px;overflow:hidden;background:var(--brand)}
  .hero .bg{position:absolute;inset:0;background-size:cover;opacity:.36}
  .hero .in{position:relative;max-width:760px}
  .hero h1{font-size:clamp(24px,4vw,34px);font-weight:900;color:#fff;letter-spacing:-.02em;line-height:1.1}
  .hero p{font-size:14px;color:rgba(255,255,255,.93);margin:7px 0 0;font-weight:600}
  .hero .edit{position:absolute;top:14px;right:16px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;
              background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.36);color:#fff;padding:7px 13px;border-radius:9px;cursor:pointer;font-family:inherit}
  .hero .edit:hover{background:rgba(255,255,255,.32)}

  /* ---- layout ---- */
  .wrap{max-width:1120px;margin:0 auto;padding:22px 18px 60px;display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:start}
  @media(max-width:900px){.wrap{grid-template-columns:1fr;gap:20px}}
  .lab{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 11px}

  /* ---- pinned ---- */
  .pin{background:var(--gold-tint);border:1px solid var(--gold-line);border-left:4px solid var(--gold);
       border-radius:16px;padding:17px 20px;margin-bottom:18px}
  .pin .tag{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.11em;color:var(--gold);margin-bottom:7px}
  .pin h3{font-size:16px;font-weight:800;margin-bottom:6px}
  .pin .bd{font-size:13px;color:#5c5033;line-height:1.6;margin-bottom:13px}
  .pin .seen{font-size:10px;color:#9a8a63;margin-left:11px;font-weight:700}

  /* ---- body ---- */
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;box-shadow:var(--sh-sm)}
  .rich{font-size:14px;color:var(--body);line-height:1.7}
  .rich h1,.rich h2{font-size:21px;font-weight:900;margin:0 0 9px;letter-spacing:-.015em}
  .rich h3{font-size:16px;font-weight:800;margin:16px 0 6px}
  .rich p{margin:0 0 11px}
  .rich img{max-width:100%;border-radius:12px;margin:12px 0}
  .rich ul,.rich ol{margin:0 0 11px;padding-left:20px}
  .rich a{color:var(--brand);font-weight:700}

  /* ---- news ---- */
  .nw{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:9px;box-shadow:var(--sh-sm)}
  .nw .m{display:flex;gap:7px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .nw .t{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;padding:2px 9px;border-radius:99px;color:#fff}
  .nw .d{font-size:10px;color:var(--faint);font-weight:700}
  .nw h4{font-size:13.5px;font-weight:800;margin:0 0 4px;line-height:1.35}
  .nw .bd{font-size:12px;color:#5b6f6e;line-height:1.55;overflow-wrap:anywhere}
  .nw .bd img{max-width:100%;height:auto;border-radius:8px;margin:7px 0}
  .nw .bd p{margin:0 0 7px}
  .nw .bd a{color:var(--brand);font-weight:700}
  .nw .bd *{font-size:12px!important;line-height:1.55!important;font-family:inherit!important;
            max-width:100%!important;width:auto!important;color:inherit!important;background:none!important}
  .nw .bd b,.nw .bd strong{font-weight:800!important;color:var(--ink)!important}
  .pin .bd img{max-width:100%;height:auto;border-radius:10px;margin:8px 0}
  .pin .bd *{max-width:100%!important;width:auto!important;font-family:inherit!important}
  .nw .del{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#d99;background:none;border:none;cursor:pointer;font-family:inherit;padding:0;margin-left:auto}
  .nw .del:hover{color:#b0392c}

  /* ---- tools panel ---- */
  .scrim{position:fixed;inset:0;background:rgba(20,32,31,.4);z-index:80;opacity:0;pointer-events:none;transition:.2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;bottom:0;width:330px;max-width:88vw;background:var(--surface-2);
         border-left:1px solid var(--line);z-index:90;transform:translateX(100%);transition:transform .22s cubic-bezier(.3,0,.2,1);
         display:flex;flex-direction:column}
  .panel.on{transform:translateX(0)}
  .panel .hd{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
  .panel .bd{flex:1;overflow-y:auto;padding:14px 16px 30px}
  .panel input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:99px;background:#fff;
               font-family:inherit;font-size:12px;font-weight:600;outline:none;margin-bottom:15px}
  .panel input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.2)}
  .grp{font-size:9px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;margin:0 0 7px 3px}
  .tool{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);
        margin-bottom:5px;text-decoration:none;font-size:13px;font-weight:700;color:var(--ink);transition:.12s}
  .tool:hover{border-color:var(--brand);transform:translateX(-2px)}
  .tool .ic{font-size:15px;flex-shrink:0}
  .tool .ds{font-size:10px;color:var(--faint);font-weight:600;margin-top:1px}

  /* ---- modal ---- */
  .modal{position:fixed;inset:0;background:rgba(20,32,31,.45);z-index:100;display:none;overflow-y:auto;padding:20px}
  .modal.on{display:block}
  .modal .box{background:#fff;border-radius:22px;max-width:940px;margin:0 auto;padding:28px;box-shadow:var(--sh-lg)}
  .fld{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:99px;background:var(--surface-2);
       font-family:inherit;font-size:13px;font-weight:600;outline:none;margin-bottom:9px}
  .fld:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.2)}
  textarea.fld{border-radius:16px;resize:vertical;line-height:1.6}
  .chip{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;padding:6px 13px;border-radius:99px;
        border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:var(--muted);transition:.12s}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tab{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:8px 18px;border-radius:99px;
       border:none;background:none;cursor:pointer;font-family:inherit;color:var(--muted)}
  .tab.on{background:var(--brand);color:#fff}
  .skel{background:linear-gradient(90deg,#e8f0f0 25%,#d8e4e4 50%,#e8f0f0 75%);background-size:200% 100%;
        animation:sh 1.4s infinite;border-radius:14px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .empty{text-align:center;padding:44px 20px;color:var(--faint)}
  .empty .i{font-size:34px;opacity:.4;margin-bottom:10px}
  .empty .t{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}

  /* team picker */
  .pick{position:fixed;inset:0;z-index:120;background:var(--canvas);display:none;align-items:center;justify-content:center;padding:24px}
  .pick.on{display:flex}
  .pick-box{background:#fff;border:1px solid var(--line);border-radius:26px;padding:44px 40px;max-width:440px;width:100%;
            box-shadow:var(--sh-lg);text-align:center}
  .pick-box img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:var(--sh);margin-bottom:20px}
  .pick-box h1{font-size:21px;font-weight:900;margin-bottom:8px}
  .pick-box p{font-size:13.5px;color:var(--muted);line-height:1.6;margin:0 0 24px;font-weight:600}
  .pick-t{display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:1px solid var(--line);
          border-left:4px solid var(--brand);border-radius:15px;padding:15px 19px;margin-bottom:9px;cursor:pointer;
          font-family:inherit;text-align:left;transition:.14s}
  .pick-t:hover{transform:translateX(3px);box-shadow:var(--sh)}
  .pick-t .nm{font-size:15px;font-weight:800;color:var(--ink)}
  .pick-t .ct{font-size:11px;color:var(--faint);font-weight:600;margin-top:2px}

  /* team panels */
  .tp{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:16px;
      padding:20px 24px;margin-top:16px;box-shadow:var(--sh-sm)}
  .tp .hd{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
  .tp .nm{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
  body.editing .edit-only{display:inline-block!important}
  body.editing .tp{border-style:dashed}
  #editModeBtn.on{background:var(--gold);color:#fff;border-color:var(--gold)}
</style>
</head>
<body>

<div class="pick" id="teamPicker">
  <div class="pick-box">
    <img id="pickLogo" alt="EGBC">
    <h1 id="pickTitle">Which team today?</h1>
    <p id="pickSub">You're on more than one. You can switch whenever you like.</p>
    <div id="pickList"></div>
  </div>
</div>

<div class="bar">
  <a class="brand" href="hub.html">
    <img id="logo" alt="EGBC">
    <div>
      <div class="k">Esher Green Baptist Church</div>
      <div class="n">Team Hub</div>
    </div>
  </a>
  <div style="display:flex;align-items:center;gap:9px">
    <button class="btn" id="teamSwitch" style="display:none" onclick="openTeamPicker()"></button>
    <button class="btn solid" onclick="openTools()">&#9776;&nbsp; Tools</button>
    <button class="btn" id="editModeBtn" style="display:none" onclick="toggleEditMode()">Edit mode</button>
    <button class="btn" id="adminBtn" style="display:none" onclick="openAdmin()">&#9881;</button>
    <div class="avatar" id="av"></div>
    <button class="btn" onclick="EGBCAuth.signOut()" style="border:none;background:none;padding:6px 4px;color:var(--muted)">Sign out</button>
  </div>
</div>

<div class="hero" id="hero">
  <div class="bg" id="heroBg"></div>
  <button class="edit edit-only" id="heroEdit" style="display:none" onclick="editHero()">Edit banner</button>
  <div class="in">
    <h1 id="heroTitle">&nbsp;</h1>
    <p id="heroSub"></p>
  </div>
</div>

<div class="wrap">
  <div>
    <div id="pinned"></div>

    <div class="card" id="bodyCard">
      <div class="rich" id="bodyContent"><div class="skel" style="height:15px;width:45%;margin-bottom:12px"></div><div class="skel" style="height:12px;margin-bottom:7px"></div><div class="skel" style="height:12px;width:80%"></div></div>
      <button class="btn edit-only" id="bodyEdit" style="display:none;margin-top:16px" onclick="editBody()">Edit this</button>
    </div>

    <div id="teamPanels"></div>
  </div>

  <div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px">
      <div class="lab" style="margin:0">Latest</div>
      <button class="btn edit-only" id="newsAdd" style="display:none;padding:6px 13px" onclick="openNewsEditor()">+ Post</button>
    </div>
    <div id="newsList"><div class="skel" style="height:74px;margin-bottom:9px"></div><div class="skel" style="height:74px"></div></div>
  </div>
</div>

<!-- TOOLS -->
<div class="scrim" id="scrim" onclick="closeTools()"></div>
<aside class="panel" id="panel">
  <div class="hd">
    <div style="font-size:14px;font-weight:900;color:var(--ink)">Tools</div>
    <button class="btn" style="border:none;background:none;padding:4px 8px;font-size:16px" onclick="closeTools()">&times;</button>
  </div>
  <div class="bd">
    <input id="toolSearch" placeholder="Search&hellip;" oninput="renderTools()" autocomplete="off">
    <div id="toolList"></div>
  </div>
</aside>

<!-- NEWS EDITOR -->
<div class="modal" id="newsModal" onclick="if(event.target===this)closeNewsEditor()">
  <div class="box" style="max-width:560px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <h2 style="font-size:17px;font-weight:900" id="newsModalTitle">New notice</h2>
      <button class="btn" style="border:none;background:none;font-size:18px" onclick="closeNewsEditor()">&times;</button>
    </div>
    <input type="hidden" id="nwId">
    <input class="fld" id="nwTitle" placeholder="Title">
    <textarea class="fld" id="nwBody" rows="4" placeholder="What do people need to know?"></textarea>

    <div class="lab" style="margin:14px 0 6px">Who sees it</div>
    <p style="font-size:11px;color:var(--faint);font-weight:600;margin:0 0 9px;line-height:1.5">
      Pick the teams this is for. <strong>Everyone</strong> is for genuinely church-wide things &mdash; the bulletin, a whole-church event.
    </p>
    <div id="nwTeams" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px"></div>

    <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-bottom:10px">
      <input type="checkbox" id="nwPinned" style="width:16px;height:16px;accent-color:var(--gold);margin-top:2px">
      <span>
        <span style="font-size:12px;font-weight:800;color:var(--ink)">Pin it to the top</span>
        <span style="display:block;font-size:11px;color:var(--faint);font-weight:600;margin-top:1px">For the things everyone really must see</span>
      </span>
    </label>

    <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-bottom:18px">
      <input type="checkbox" id="nwAck" style="width:16px;height:16px;accent-color:var(--gold);margin-top:2px">
      <span>
        <span style="font-size:12px;font-weight:800;color:var(--ink)">Ask people to confirm they have read it</span>
        <span style="display:block;font-size:11px;color:var(--faint);font-weight:600;margin-top:1px">You will be able to see who has and who has not</span>
      </span>
    </label>

    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn solid" onclick="saveNews()">Post</button>
      <button class="btn" onclick="closeNewsEditor()">Cancel</button>
    </div>
  </div>
</div>

<!-- ADMIN -->
<div class="modal" id="adminModal" onclick="if(event.target===this)closeAdmin()">
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line)">
      <h2 style="font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.1em">Administration</h2>
      <button class="btn" style="border:none;background:none;font-size:18px" onclick="closeAdmin()">&times;</button>
    </div>
    <div style="display:flex;gap:4px;background:var(--surface-2);padding:5px;border-radius:99px;width:fit-content;margin-bottom:22px;flex-wrap:wrap">
      <button class="tab on" id="ta-people" onclick="adminTab('people')">People</button>
      <button class="tab" id="ta-pages" onclick="adminTab('pages')">Tools</button>
      <button class="tab" id="ta-news" onclick="adminTab('news')">Notices</button>
      <button class="tab" id="ta-youth" onclick="adminTab('youth')">Youth codes</button>
    </div>
    <div id="tab-people"></div>
    <div id="tab-pages" style="display:none"></div>
    <div id="tab-news" style="display:none"></div>
    <div id="tab-youth" style="display:none"></div>
  </div>
</div>

<script src="hub-app.js"></script>
</body>
</html>
