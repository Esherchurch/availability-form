    <script src="https://cdn.tailwindcss.com"></script>

         you download here is what people were sent. -->
    <script src="egbc-rota-pdf.js?v=202610121800"></script>
    
    <script type="module">
        import { db, storage, ready } from './egbc-db.js';
        import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";



        let cachedEvents = [];
        let addressBook = [];
        let collapsedTerms = new Set();
        let logoBase64 = null;

        /* ---- What this person is allowed to see -------------------------

           One rota, several departments. Kids Church sees Kids Church rows,
           which on a week nobody has filled in yet is correctly a list of
           blanks. Someone on two teams sees both, because your own duties
           should never depend on which page you happened to open. A master
           admin sees everything, and so does the preview bar, both handled
           inside EGBCAuth rather than here. */

        function visibleTeams() {
            if (typeof EGBCAuth === 'undefined' || !EGBCAuth.visibleRoleTeams) return null;
            const mine = EGBCAuth.visibleRoleTeams();
            if (!mine) return null;
            const out = mine.slice();
            /* Choir is part of Worship rather than a team of its own. */
            if (out.includes('Worship Team') && !out.includes('Choir')) out.push('Choir');
            return out;
        }

        function visibleRoles(ev) {
            const all = ev.roles || [];
            const mine = visibleTeams();
            if (!mine) return all;
            return all.filter(r => mine.includes(EGBCAuth.roleTeam(r)));
        }

        /* The name list for the PDFs. Sending the rota out is a departmental
           job, so Karen picks from Kids Church and not from the whole church.
           Your own name stays in the list whatever team you are on, because
           the household PDF is built from it. */
        function visibleMembers() {
            const mine = visibleTeams();
            if (!mine) return addressBook;
            const me = (typeof EGBCAuth !== 'undefined' && EGBCAuth.profile) ? EGBCAuth.profile() : null;
            return addressBook.filter(m => {
                if (me && me.memberId === m.id) return true;
                return (Array.isArray(m.markers) ? m.markers : []).some(t => mine.includes(t));
            });
        }

        function refreshMemberList() {
            const select = document.getElementById('memberPdfSelect');
            if (!select) return;
            const was = select.value;
            select.innerHTML = '<option value="">Select Member...</option>';
            visibleMembers()
                .slice()
                .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
                .forEach(m => { select.innerHTML += `<option value="${m.id}">${m.name}</option>`; });
            if (was) select.value = was;
        }

        /* Signing in resolves after this script runs, so whatever was drawn
           first was drawn without knowing who was looking. Draw it again. */
        document.addEventListener('egbc-ready', () => {
            refreshMemberList();
            renderRota();
        });

        const getLogoBase64 = () => {
            return new Promise(async (resolve) => {
                if (logoBase64) return resolve(logoBase64);
                try {
                    const url = await getDownloadURL(ref(storage, '1774936285076.png'));
                    const img = new Image();
                    img.setAttribute('crossOrigin', 'anonymous');
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = img.width; canvas.height = img.height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0);
                        logoBase64 = canvas.toDataURL("image/png");
                        resolve(logoBase64);
                    };
                    img.src = url + "?c=" + new Date().getTime();
                } catch (e) { resolve(null); }
            });
        };
        getLogoBase64();

        /* Nothing is read until the session is restored: a query sent before
           then goes out anonymous, whatever the page already checked. */
        await ready;

        onSnapshot(collection(db, "addressBook"), (snap) => {
            addressBook = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            refreshMemberList();
        });

        onSnapshot(query(collection(db, "events"), orderBy("date")), (snap) => {
            cachedEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderRota();
        });

        /* Past dates are hidden unless this is on; remembered on this device. */
        window.toggleShowPast = (btn) => {
            EGBCUKDates.togglePast(btn);
            renderRota();
            EGBCUKDates.scrollToNext(document.getElementById('rotaContent'));
        };
        EGBCUKDates.paintPast(document.querySelector('[data-past-toggle]'));

        window.toggleTermCollapse = (term) => {
            collapsedTerms.has(term) ? collapsedTerms.delete(term) : collapsedTerms.add(term);
            renderRota();
        };

        /* A role can hold one person or several - the planner stores two
           singers as an array. Anything that asks "is this person on?" has to
           cope with both, or half a household's duties go missing. */
        function idsIn(v) {
            if (!v) return [];
            return (Array.isArray(v) ? v : [v]).map(x => x && x.id).filter(Boolean);
        }

        /* One generator for all four documents, shared with the Rota
           Planner - see egbc-rota-pdf.js. The download and the emailed copy
           are now the same file, which they were not before: this page used
           to look households up by a field the address book does not
           maintain, left the time column out, and had no wall planner. */
        window.generatePDF = async (type, memberId) => {
            if (type !== 'full' && !addressBook.find(m => m.id === memberId)) {
                return alert('Select your name first.');
            }

            const today = new Date().toISOString().split('T')[0];
            const events = cachedEvents.filter(e => !e.archived && e.date >= today);

            let doc;
            try {
                doc = EGBCRotaPdf.build({
                    type, memberId, addressBook, events,
                    logo: await getLogoBase64(),
                    avRoles: (typeof EGBCAuth !== 'undefined' && EGBCAuth.AV_ROLES) || [],
                    /* Only the full rota is narrowed to the reader's teams. */
                    roleFilter: visibleRoles
                });
            } catch (e) {
                console.error(e);
                return alert('Could not build that PDF: ' + e.message);
            }

            if (!doc) return alert('No upcoming dates found.');

            const who = (addressBook.find(m => m.id === memberId) || {}).name || 'EGBC';
            const name = type === 'full' ? 'EGBC_full_rota'
                       : who.replace(/[^A-Za-z0-9]+/g, '_') + '_' +
                         (type === 'wall' ? 'wall_planner' : type + '_rota');
            doc.save(name + '.pdf');
        };

        function renderRota() {
            const container = document.getElementById('rotaContent');
            container.innerHTML = '';
            /* Opens at the next date (Martin, 14 Oct 2026): after this redraw, for the first few seconds. */
            setTimeout(() => EGBCUKDates.openAtNext(container), 0);
            const grouped = {};
            /* Past dates (England's today) are hidden unless "Show past dates" is on. */
            cachedEvents.forEach(ev => {
                if(ev.archived || EGBCUKDates.hidden(ev.date)) return;
                const term = ev.termLabel || "Current Rota";
                if (!grouped[term]) grouped[term] = [];
                grouped[term].push(ev);
            });

            /* A term where none of this person's teams has a single slot.
               The dates are still worth showing - that is what a Kids
               Church helper should see before Karen has filled it in - but
               a column of blank cards with no explanation reads as broken
               rather than as empty. */
            const nothingForMe = term =>
                grouped[term].every(ev => visibleRoles(ev).length === 0);

            Object.keys(grouped).sort().forEach(term => {
                const isCollapsed = collapsedTerms.has(term);
                let termHtml = `
                    <div class="mb-6" style="border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)">
                        <div onclick="toggleTermCollapse('${term}')" class="flex justify-between items-center bg-white px-5 py-4 border border-[#e5e7eb] ${isCollapsed ? 'rounded-[14px]' : 'rounded-t-[14px]'} cursor-pointer">
                            <h2 class="text-[14px] font-semibold text-[#111827]">${term}</h2>
                            <span class="text-[13px] font-medium text-[#6b7280]">${isCollapsed ? 'Show' : 'Hide'}</span>
                        </div>
                        <div class="${isCollapsed ? 'hidden' : 'block'} bg-white px-5 pt-4 pb-5 border-x border-b border-[#e5e7eb] rounded-b-[14px]">`;

                if (nothingForMe(term)) {
                    termHtml += `
                        <div class="bg-[#f9fafb] border border-[#e5e7eb] rounded-[8px] px-4 py-3 mb-3 text-[13px] text-[#6b7280]">
                            Nothing on this rota for your team yet
                        </div>`;
                }
                
                grouped[term].forEach(ev => {
                    termHtml += `
                        <div data-date="${ev.date}" class="bg-white rounded-[14px] p-4 mb-3 border border-[#e5e7eb]" style="box-shadow:0 1px 2px rgba(16,24,40,.05)">
                            <div class="flex flex-wrap items-center gap-3 mb-4 border-b border-[#e5e7eb] pb-3">
                                <span class="bg-[#eef5f4] text-[#3d6263] px-2 py-1 rounded-[6px] font-medium text-[13px]">
                                    ${new Date(ev.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' })}
                                </span>
                                <span class="text-[#6b7280] text-[13px]">${ev.startTime || '08:00'}</span>
                                <span class="text-[#111827] font-semibold text-[14px]">${ev.type}</span>
                                <span class="text-[#6b7280] text-[13px] flex-grow text-right">${ev.description || ''}</span>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2">
                                ${visibleRoles(ev).map(role => {
                                    const assigned = ev.assignments?.[role]?.name || (role === 'Choir' ? '<span class="text-[#9bc34a]">Choir</span>' : '---');
                                    return `
                                        <div class="bg-[#f9fafb] p-3 border border-[#e5e7eb] rounded-[8px]">
                                            <div class="text-[12px] text-[#6b7280] mb-0.5">${role}</div>
                                            <div class="text-[14px] font-semibold text-[#111827] truncate">${assigned}</div>
                                        </div>`;
                                }).join('')}
                            </div>
                        </div>`;
                });
                container.innerHTML += termHtml + `</div></div>`;
            });
        }
    </script>
    <style>
        /* ============================================================
           EGBC shared design system (visual only — merged tokens)
           ============================================================ */
        :root{
            --canvas:#eef4f3; --surface:#fff; --surface-2:#f6faf9;
            --ink:#14201f; --body:#3a4d4c; --muted:#6b8281; --faint:#93a8a6;
            --hairline:#dde7e6; --hairline-strong:#c9d8d6;
            --brand:#3d6263; --brand-dark:#2e4c4d; --brand-tint:#e7f0ef; --brand-ring:rgba(61,98,99,.28);
            --success:#3b7d23; --success-tint:#e7f1e0; --danger:#b0392c; --danger-tint:#f7e7e4;
            --gold:#b07d2e; --gold-tint:#f6efe1;
            --shadow-sm:0 1px 2px rgba(20,32,31,.05);
            --shadow:0 1px 2px rgba(20,32,31,.04),0 6px 20px rgba(20,32,31,.07);
            --shadow-lg:0 2px 4px rgba(20,32,31,.05),0 18px 48px rgba(20,32,31,.12);
            --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
        }
        body { color:var(--body); font-family:Inter, system-ui, sans-serif; }
        body.bg-\[\#f0f6f6\] { background:var(--canvas) !important; }

        /* Neutral + brand colour remaps */
        .bg-\[\#f0f6f6\], .bg-\[\#f0f6f6\]\/30 { background-color:var(--surface-2) !important; }
        .border-\[\#d1dfdf\] { border-color:var(--hairline) !important; }
        .bg-\[\#d1dfdf\] { background-color:var(--hairline-strong) !important; }
        .text-\[\#3d6263\] { color:var(--brand) !important; }
        .bg-\[\#3d6263\] { background-color:var(--brand) !important; }
        .border-\[\#3d6263\] { border-color:var(--brand) !important; }
        .text-\[\#d1dfdf\] { color:var(--faint) !important; }
        .bg-\[\#9bc34a\] { background-color:var(--success) !important; }
        .text-\[\#9bc34a\] { color:var(--success) !important; }

        /* Typography — tame heavy weights + shouty tracking */
        /* DESIGN.md caps weight at 600; a page title is the exception and
           sets its own. */
        .font-semibold { font-weight:600 !important; }
        .tracking-widest { letter-spacing:.08em !important; }

        /* Radii → tokens (pills/badges keep rounded-full) */
        .rounded-\[3rem\], .rounded-\[2rem\], .rounded-3xl { border-radius:var(--r-lg) !important; }
        .rounded-t-\[2rem\], .rounded-t-2xl { border-top-left-radius:var(--r-lg) !important; border-top-right-radius:var(--r-lg) !important; }
        .rounded-b-\[2rem\], .rounded-b-2xl { border-bottom-left-radius:var(--r-lg) !important; border-bottom-right-radius:var(--r-lg) !important; }
        .rounded-2xl, .rounded-xl { border-radius:var(--r-md) !important; }
        .rounded-lg { border-radius:var(--r-sm) !important; }

        /* Shadows → tokens */
        .shadow-xl, .shadow-lg { box-shadow:var(--shadow) !important; }
        .shadow-md, .shadow-sm { box-shadow:var(--shadow-sm) !important; }

        /* Nothing below 12px; 13px is the secondary size in the guide. */
        .text-\[7px\], .text-\[8px\], .text-\[9px\], .text-\[10px\], .text-\[11px\] { font-size:13px !important; }
        select, input, textarea { font-size:13px !important; border-radius:8px !important; min-height:36px; }

        /* Buttons → one system (text action buttons all carry .uppercase) */
        /* A button: 36px tall, 8px corners, 13px/500, sentence case. */
        button.uppercase{
            border-radius:8px !important;
            font-weight:500 !important;
            font-size:13px !important;
            min-height:36px; padding:0 14px !important;
            letter-spacing:0 !important;
            text-transform:none !important;
            transition:background .15s ease, transform .05s ease, box-shadow .15s ease !important;
        }
        button.uppercase:active{ transform:translateY(1px) !important; }
        button.uppercase:focus-visible{ outline:none !important; box-shadow:0 0 0 3px var(--brand-ring) !important; }
        button.uppercase.bg-\[\#3d6263\]{ background:var(--brand) !important; color:#fff !important; box-shadow:var(--shadow-sm) !important; }
        button.uppercase.bg-\[\#3d6263\]:hover{ background:var(--brand-dark) !important; }
        button.uppercase.bg-\[\#f0f6f6\]{ background:var(--brand-tint) !important; color:var(--brand) !important; border-color:transparent !important; }
        button.uppercase.bg-\[\#f0f6f6\]:hover{ background:#d8e6e4 !important; }
        button.uppercase.bg-\[\#9bc34a\]{ background:var(--success) !important; color:#fff !important; }
        button.uppercase.bg-\[\#9bc34a\]:hover{ filter:brightness(.94) !important; }

        /* Inputs / selects */
        input, select, textarea { font-family:Inter, system-ui, sans-serif; }
        select:focus, input:focus{
            border-color:var(--brand) !important;
            box-shadow:0 0 0 3px var(--brand-ring) !important;
            outline:none !important;
        }

        /* The readability pass that lifted tiny labels to 11px has gone: the
           rule above puts them at 13px, which is the guide's own size, and
           two rules of equal weight meant the later one quietly won. */

        /* Loading shimmer skeleton (design-system component) */
        .sk{ background:linear-gradient(90deg,var(--surface-2) 25%,var(--hairline) 37%,var(--surface-2) 63%); background-size:400% 100%; animation:sh 1.4s ease infinite; border-radius:6px; }
        @keyframes sh{ 0%{background-position:100% 0} 100%{background-position:0 0} }
        @media (prefers-reduced-motion:reduce){ .sk{ animation:none } }

        /* Clean printing: hide download chrome, white page, keep brand colours legible */
        @media print {
            @page { margin: 12mm; }
            header { display: none !important; }
            body { background: #ffffff !important; }
            body.bg-\[\#f0f6f6\] { background: #ffffff !important; }
            *, *::before, *::after {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                box-shadow: none !important;
            }
        }

<script>
/* ── egbc-uk-dates (Martin, 14 Oct 2026) ─────────────────────────────
   One copy in each rota and planner page, here and on the original site,
   because the original site's pages load nothing shared. KEEP EVERY COPY
   THE SAME: screenshots/events/rota-dates.test.mjs fails if one differs.

   EGBCUKDates.long('2026-10-11')   "Sunday 11 October 2026"
   EGBCUKDates.short('2026-10-11')  "Sun 11 Oct 2026"
   EGBCUKDates.today()              today in England, yyyy-mm-dd

   Rotas: past dates hidden unless "Show past dates" is on, remembered on
   this device; the page opens at the next date.
     hidden(date), showPast(), togglePast(btn), paintPast(btn), scrollToNext(box),
     openAtNext(box) after every redraw

   Planners: "Service date" becomes the coming services from the rota,
   with ◀ ▶ and "Pick another date". The date box stays underneath with
   its own id and value (yyyy-mm-dd), so everything that reads it, and
   everything that sets it, works as before.
     attach(input, { load, eventSelect, preferred, keepValue })

   Every date box on the page (rota rows, "new event", "Pick another
   date"): shows "Sun 18 Oct 2026", never the browser's 10/18/2026.
     ukify(input), ukifyAll(box), and it happens by itself to any added
   ─────────────────────────────────────────────────────────────────── */
(function (g) {
  if (g.EGBCUKDates) return;
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var KEY = 'egbc-rota-show-past';

  function parts(ymd) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd || '').slice(0, 10));
    if (!m) return null;
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return { y: +m[1], m: +m[2] - 1, d: +m[3], w: d.getUTCDay() };
  }
  function long(ymd) { var p = parts(ymd); return p ? DAYS[p.w] + ' ' + p.d + ' ' + MONTHS[p.m] + ' ' + p.y : String(ymd == null ? '' : ymd); }
  function short(ymd) { var p = parts(ymd); return p ? DAYS[p.w].slice(0, 3) + ' ' + p.d + ' ' + MONTHS[p.m].slice(0, 3) + ' ' + p.y : String(ymd == null ? '' : ymd); }
  function today() {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) {
      var d = new Date();
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }
  }

  /* ---- rotas ---- */
  function showPast() { try { return g.localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function setShowPast(v) { try { if (v) g.localStorage.setItem(KEY, '1'); else g.localStorage.removeItem(KEY); } catch (e) {} }
  function hidden(ymd) { return !showPast() && String(ymd || '') < today(); }
  function paintPast(btn) {
    if (!btn) return;
    var on = showPast();
    btn.textContent = on ? 'Hide past dates' : 'Show past dates';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('data-past-toggle', on ? 'on' : 'off');
  }
  function togglePast(btn) { setShowPast(!showPast()); paintPast(btn); return showPast(); }
  /* The first row dated today or later, brought into view. */
  function scrollToNext(box) {
    var rows = (box || document).querySelectorAll('[data-date]'), t = today();
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].getAttribute('data-date') >= t) {
        try { rows[i].scrollIntoView({ block: 'start' }); } catch (e) { rows[i].scrollIntoView(); }
        return rows[i];
      }
    }
    return null;
  }
  /* Called after every redraw: for the first few seconds the list is
     drawn again as the rota arrives, and each redraw would put the page
     back at the top. Stops the moment the person scrolls, taps or types. */
  var opened = 0, stopped = false;
  function stop() { stopped = true; }
  function openAtNext(box) {
    if (stopped || (opened && Date.now() - opened > 5000)) return null;
    var row = scrollToNext(box);
    if (row && !opened) {
      opened = Date.now();
      ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (t) { g.addEventListener(t, stop, { capture: true, passive: true }); });
    }
    return row;
  }

  /* ---- planners ---- */
  var BTN = 'background:#f0f6f6;color:#3d6263;border:1px solid #d1dfdf;border-radius:8px;padding:8px 12px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;flex:0 0 auto;';
  var SEL = 'flex:1 1 200px;min-width:0;max-width:100%;background:#fff;color:#111827;border:1px solid #d1dfdf;border-radius:8px;padding:8px 10px;font:500 14px Inter,system-ui,sans-serif;';
  var LINK = 'background:none;border:none;color:#3d6263;text-decoration:underline;font:500 13px Inter,system-ui,sans-serif;padding:4px 2px;cursor:pointer;flex:0 0 auto;';
  function isService(ev) { return !/practice|meeting|workshop/i.test(ev.type || ''); }
  function fire(el) { var e; try { e = new Event('change', { bubbles: true }); } catch (x) { e = document.createEvent('Event'); e.initEvent('change', true, true); } el.dispatchEvent(e); }

  /* ---- every date box: UK words on top ----
     A browser draws <input type="date"> in ITS language: on a computer set
     to US English, 10/18/2026, whatever the page says. So every date box on
     these pages shows "Sun 18 Oct 2026" instead, with the browser's own box
     lying invisibly over the words: a click or a tap still opens its
     calendar, and the value underneath is the same yyyy-mm-dd as ever. */
  var OVER = 'position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0;cursor:pointer;font-size:16px;';
  function outer(input) { var p = input.parentNode; return p && p.getAttribute && p.getAttribute('data-uk-date') !== null ? p : input; }
  function paintDate(input) {
    var p = input.parentNode, shown = p && p.querySelector ? p.querySelector('[data-uk-shown]') : null;
    if (shown && shown.parentNode === p) shown.textContent = input.value ? short(input.value) : 'Pick a date';
    input.setAttribute('aria-label', 'Date: ' + (input.value ? long(input.value) : 'not chosen'));
  }
  function ukify(input) {
    if (!input || String(input.type).toLowerCase() !== 'date' || outer(input) !== input || !input.parentNode) return;
    var box = document.createElement('span');
    box.setAttribute('data-uk-date', '');
    box.className = input.className;
    box.style.cssText = input.style.cssText;
    box.style.position = 'relative';
