function fxDuotone(){ showAdjust('Duotone',(body,preview)=>{
  let shadow='#241a3a', hi='#f4d38a';
  body.appendChild(colorField('Shadow colour', shadow, v=>{shadow=v;preview();}));
  body.appendChild(colorField('Highlight colour', hi, v=>{hi=v;preview();}));
  return (work)=>{ const s=hexToRgb(shadow), h=hexToRgb(hi); const d=work.data;
    for(let i=0;i<d.length;i+=4){ const l=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;
      d[i]=s[0]+(h[0]-s[0])*l; d[i+1]=s[1]+(h[1]-s[1])*l; d[i+2]=s[2]+(h[2]-s[2])*l; } };
}); }
function fxGradientMap(){ showAdjust('Gradient Map',(body,preview)=>{
  const presets={ 'Custom':null, 'Grayscale':['#000000','#808080','#ffffff'], 'Sepia':['#1b1006','#8a5a2b','#f5e6c8'],
    'Purple Haze':['#0b0620','#7c5cd6','#f0c0ff'], 'Sunset':['#241236','#d1495b','#ffd166'], 'Teal-Orange':['#08313a','#2a9d8f','#f4a261'] };
  let stops=['#1b1006','#8a5a2b','#f5e6c8'];
  const pf=document.createElement('label'); pf.className='field'; const ps=document.createElement('span'); ps.textContent='Preset'; pf.appendChild(ps);
  const selP=document.createElement('select'); Object.keys(presets).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;selP.appendChild(o);}); selP.value='Sepia';
  pf.appendChild(selP); body.appendChild(pf);
  const c0=colorField('Dark', stops[0], v=>{stops[0]=v;preview();});
  const c1=colorField('Mid', stops[1], v=>{stops[1]=v;preview();});
  const c2=colorField('Light', stops[2], v=>{stops[2]=v;preview();});
  body.appendChild(c0); body.appendChild(c1); body.appendChild(c2);
  selP.onchange=()=>{ const p=presets[selP.value]; if(p){ stops=[p[0],p[1],p[2]];
    c0.querySelector('input').value=p[0]; c1.querySelector('input').value=p[1]; c2.querySelector('input').value=p[2]; preview(); } };
  function lut(){ const a=hexToRgb(stops[0]),b=hexToRgb(stops[1]),cc=hexToRgb(stops[2]); const T=[];
    for(let i=0;i<256;i++){ const t=i/255; let r,g,bl;
      if(t<0.5){ const u=t/0.5; r=a[0]+(b[0]-a[0])*u; g=a[1]+(b[1]-a[1])*u; bl=a[2]+(b[2]-a[2])*u; }
      else { const u=(t-0.5)/0.5; r=b[0]+(cc[0]-b[0])*u; g=b[1]+(cc[1]-b[1])*u; bl=b[2]+(cc[2]-b[2])*u; } T.push([r,g,bl]); }
    return T; }
  return (work)=>{ const T=lut(); const d=work.data; for(let i=0;i<d.length;i+=4){ const l=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]); const c=T[l]; d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; } };
}); }
function fxVignette(){ showAdjust('Vignette',(body,preview)=>{
  let size=55, amount=60, soft=50;
  body.appendChild(slider('Size',0,100,55,1,v=>{size=v;preview();},v=>v+'%'));
  body.appendChild(slider('Amount',0,100,60,1,v=>{amount=v;preview();},v=>v+'%'));
  body.appendChild(slider('Softness',1,100,50,1,v=>{soft=v;preview();},v=>v+'%'));
  return (work)=>{ const w=work.width,h=work.height,d=work.data; const cx=w/2,cy=h/2; const maxR=Math.hypot(cx,cy);
    const inner=(size/100)*maxR; const outer=inner+Math.max(1,(soft/100)*maxR); const amt=amount/100;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){ const dist=Math.hypot(x-cx,y-cy); let f=1;
      if(dist>inner) f=1-amt*Math.min(1,(dist-inner)/(outer-inner));

}); }
function fxGlow(){ showAdjust('Glow / Bloom',(body,preview)=>{
  let radius=12, amount=70, thr=60;
  body.appendChild(slider('Radius',1,60,12,1,v=>{radius=v;preview();},v=>v+'px'));
  body.appendChild(slider('Amount',0,150,70,1,v=>{amount=v;preview();},v=>v+'%'));
  body.appendChild(slider('Threshold',0,100,60,1,v=>{thr=v;preview();},v=>v+'%'));
  return (work)=>{ const w=work.width,h=work.height; const src=new Uint8ClampedArray(work.data);
    const hi=new ImageData(w,h); const hd=hi.data; const t=thr/100*255;
    for(let i=0;i<src.length;i+=4){ const l=0.299*src[i]+0.587*src[i+1]+0.114*src[i+2]; const f=l>t?(l-t)/(255-t):0;

    boxBlur(hd,w,h,Math.round(radius)); boxBlur(hd,w,h,Math.max(1,Math.round(radius*0.6)));
    const a=amount/100; const d=work.data;
    for(let i=0;i<d.length;i+=4){
      d[i]=clamp255(255-(255-src[i])*(255-hd[i]*a)/255);
      d[i+1]=clamp255(255-(255-src[i+1])*(255-hd[i+1]*a)/255);

}); }
function fxFilm(){ showAdjust('Film / Vintage',(body,preview)=>{

  return (work)=>{ const d=work.data; const f=fade/100; const lift=20*f, drop=24*f; const wk=tone/100;

function hasBgBridge(){ return !!(window.api && window.api.bgRemove); }
async function removeBackground(){
  if(!hasBgBridge()) return;
  const L=activeLayer();
  if(!doc || !L){ toast('Open a document first'); return; }
  const btn=document.getElementById('btnRemoveBg');
  const src=L.canvas.toDataURL('image/png');
  try{
    // ensure API key
    if(!(await window.api.bgHasKey())){
      const k=await window.api.callaPrompt('Paste your remove.bg API key. Stored locally on this PC.');
      if(!k) return;
      await window.api.bgSetKey(k);
    }
    btn.disabled=true; const label=btn.textContent; btn.textContent='Removing background…'; toast('Removing background…');
    let r=await window.api.bgRemove({ imageDataUrl: src, size: 'auto' });
    // if the key was missing/invalid, offer one re-prompt
    if(r && !r.ok && r.error==='no-key'){
      const k=await window.api.callaPrompt('remove.bg needs an API key. Paste it here (stored locally on this PC).');
      if(k){ await window.api.bgSetKey(k); r=await window.api.bgRemove({ imageDataUrl: src, size: 'auto' }); }
    }
    if(r && r.ok && r.dataUrl){
      await new Promise((resolve,reject)=>{
        const img=new Image();

          commit('Remove background');
          L.ctx.clearRect(0,0,doc.width,doc.height);
          L.ctx.drawImage(img, 0, 0, doc.width, doc.height);
          renderLayers(); composite();
          toast('Background removed ✓'); resolve();
        };
        img.onerror=()=>reject(new Error('Could not load the returned image'));
        img.src=r.dataUrl;
      });
    } else {
      const err=(r&&r.error)?r.error:'unknown-error';

    toast('Remove background failed: '+(err&&err.message?err.message:err));
  }finally{
    btn.disabled=false;
    if(btn.textContent==='Removing background…') btn.textContent='✂ Remove Background';
  }
}

/* ============================================================
   FREE TRANSFORM  (scale / rotate / move the active layer)
   Reuses the layer model, overlay and history. On enter we snapshot
   the layer's pixels into srcCanvas and compute the non-empty content
   bounding box. The session (xf) tracks scale (sx,sy), rotation (ang)
   and centre translation (dx,dy) around the box's centre pivot; each
   frame we re-render srcCanvas through that transform into L.canvas as
   a live preview. Commit keeps it + snapshots history; cancel restores
   from srcCanvas.
   ============================================================ */
function computeContentBounds(cv){
  const w=cv.width,h=cv.height; const d=cv.getContext('2d').getImageData(0,0,w,h).data;
  let minx=w,miny=h,maxx=-1,maxy=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){ if(d[(y*w+x)*4+3]>0){ if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; } }
  if(maxx<0) return {x:0,y:0,w:w,h:h};
  return {x:minx, y:miny, w:maxx-minx+1, h:maxy-miny+1};
}
function enterTransform(){
  const L=activeLayer(); if(!doc||!L) return;
  // bake any pending move offset so the source is doc-aligned
  const src=document.createElement('canvas'); src.width=doc.width; src.height=doc.height;
  src.getContext('2d').drawImage(L.canvas, L.x, L.y);
  if(L.text){ L.text.x+=L.x; L.text.y+=L.y; }
  const base=document.createElement('canvas'); base.width=doc.width; base.height=doc.height;
  base.getContext('2d').drawImage(src,0,0);
  L.canvas=base; L.ctx=base.getContext('2d'); L.x=0; L.y=0;
  const b=computeContentBounds(src);
  xf={layer:L, srcCanvas:src, b:b, px:b.x+b.w/2, py:b.y+b.h/2, sx:1, sy:1, ang:0, dx:0, dy:0};
  toast('Transform: drag handles to scale, outside a corner to rotate. Enter=apply, Esc=cancel.');
}
function xfRender(){
  const L=xf.layer, c=L.ctx;
  c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,doc.width,doc.height);
  c.save();
  c.translate(xf.px+xf.dx, xf.py+xf.dy);
  c.rotate(xf.ang);
  c.scale(xf.sx, xf.sy);
  c.translate(-xf.px, -xf.py);
  c.drawImage(xf.srcCanvas, 0, 0);
  c.restore();
  composite();
}
function commitTransform(){
  if(!xf) return; xfRender();
  xf=null; xfDrag=null; renderLayers(); composite(); commit('Transform'); buildToolOptions();
}
function cancelTransform(){
  if(!xf) return; const L=xf.layer;
  L.ctx.setTransform(1,0,0,1,0,0); L.ctx.clearRect(0,0,doc.width,doc.height); L.ctx.drawImage(xf.srcCanvas,0,0);
  xf=null; xfDrag=null; renderLayers(); composite(); buildToolOptions();
}
function xfPt(sxp, syp){
  const x=(sxp-xf.px)*xf.sx, y=(syp-xf.py)*xf.sy;
  const c=Math.cos(xf.ang), s=Math.sin(xf.ang);
  return {x: x*c - y*s + xf.px+xf.dx, y: x*s + y*c + xf.py+xf.dy};
}
function xfToLocalPt(P){
  let x=P.x-(xf.px+xf.dx), y=P.y-(xf.py+xf.dy);
  const c=Math.cos(-xf.ang), s=Math.sin(-xf.ang);
  const rx=x*c - y*s, ry=x*s + y*c;
  return {x: rx/xf.sx + xf.px, y: ry/xf.sy + xf.py};
}
function _dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function xfHit(P){
  const b=xf.b, tol=9/zoom, rot=24/zoom;
  const corners={nw:xfPt(b.x,b.y), ne:xfPt(b.x+b.w,b.y), se:xfPt(b.x+b.w,b.y+b.h), sw:xfPt(b.x,b.y+b.h)};
  const sides={n:xfPt(b.x+b.w/2,b.y), e:xfPt(b.x+b.w,b.y+b.h/2), s:xfPt(b.x+b.w/2,b.y+b.h), w:xfPt(b.x,b.y+b.h/2)};
  for(const k in corners){ if(_dist(P,corners[k])<=tol) return {type:'scale', h:k}; }
  for(const k in sides){ if(_dist(P,sides[k])<=tol) return {type:'stretch', h:k}; }
  for(const k in corners){ if(_dist(P,corners[k])<=rot) return {type:'rotate', h:k}; }
  const Pl=xfToLocalPt(P);
  if(Pl.x>=b.x && Pl.x<=b.x+b.w && Pl.y>=b.y && Pl.y<=b.y+b.h) return {type:'move'};
  return null;
}
function _handleSign(h){ return { sx: h.indexOf('e')>=0?1 : h.indexOf('w')>=0?-1 : 0, sy: h.indexOf('s')>=0?1 : h.indexOf('n')>=0?-1 : 0 }; }
function _clampScale(v){ const a=Math.abs(v); if(a<0.02) return v<0?-0.02:0.02; if(a>40) return v<0?-40:40; return v; }
function xfApplyDrag(P, shift){
  const d=xfDrag;
  if(d.type==='move'){ xf.dx=d.dx0+(P.x-d.P0.x); xf.dy=d.dy0+(P.y-d.P0.y); }
  else if(d.type==='rotate'){
    const a0=Math.atan2(d.P0.y-d.C0.y, d.P0.x-d.C0.x);
    const a1=Math.atan2(P.y-d.C0.y, P.x-d.C0.x);
    xf.ang=d.ang0+(a1-a0);
    if(shift){ const step=Math.PI/12; xf.ang=Math.round(xf.ang/step)*step; }
  } else {
    const c=Math.cos(d.ang0), s=Math.sin(d.ang0);
    const ux={x:c,y:s}, uy={x:-s,y:c};
    const rel={x:P.x-d.C0.x, y:P.y-d.C0.y};
    const projX=rel.x*ux.x+rel.y*ux.y, projY=rel.x*uy.x+rel.y*uy.y;
    const hw=xf.b.w/2, hh=xf.b.h/2, hs=_handleSign(d.h);
    let nsx=xf.sx, nsy=xf.sy;
    if(hs.sx!==0) nsx=projX/(hs.sx*hw);
    if(hs.sy!==0) nsy=projY/(hs.sy*hh);
    if(d.type==='scale' && shift){
      const origLen=Math.hypot(hs.sx*hw*d.sx0, hs.sy*hh*d.sy0);
      const newLen=Math.hypot(projX, projY);
      const r=origLen>0? newLen/origLen : 1;
      nsx=d.sx0*r; nsy=d.sy0*r;
    }
    xf.sx=_clampScale(nsx); xf.sy=_clampScale(nsy);
  }
  xfRender();
}

/* ============================================================
   IMAGE SIZE (resample all layers) & CANVAS SIZE (anchored, no scale)
   ============================================================ */
function scaleCanvas(cv,nw,nh){ const c=document.createElement('canvas'); c.width=nw; c.height=nh; const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; ctx.drawImage(cv,0,0,cv.width,cv.height,0,0,nw,nh); return c; }
function resampleDocument(nw,nh,label){
  const rx=nw/doc.width, ry=nh/doc.height;
  doc.layers.forEach(L=>{
    const cv=scaleCanvas(L.canvas,nw,nh); L.canvas=cv; L.ctx=cv.getContext('2d');
    if(L.mask){ const mk=scaleCanvas(L.mask,nw,nh); L.mask=mk; L.maskCtx=mk.getContext('2d'); }
    if(L.splashColor) L.splashColor=scaleCanvas(L.splashColor,nw,nh);
    if(L.splashGray) L.splashGray=scaleCanvas(L.splashGray,nw,nh);
    L.x=Math.round(L.x*rx); L.y=Math.round(L.y*ry);
    if(L.text){ L.text.x*=rx; L.text.y*=ry; L.text.size*=ry; }
  });
  doc.width=nw; doc.height=nh; sel=null;
  setupCanvasSizes(); fitToScreen(); renderLayers(); composite(); updateSelStatus(); commit(label||'Image size');
}
function canvasResizeAnchored(nw,nh,ac,ar,label){
  const ow=doc.width, oh=doc.height;
  const ox = ac===0?0 : ac===1?Math.round((nw-ow)/2) : (nw-ow);
  const oy = ar===0?0 : ar===1?Math.round((nh-oh)/2) : (nh-oh);
  doc.layers.forEach(L=>{
    const lx=L.x, ly=L.y;
    const cv=document.createElement('canvas'); cv.width=nw; cv.height=nh; const ctx=cv.getContext('2d');
    ctx.drawImage(L.canvas, ox+lx, oy+ly); L.canvas=cv; L.ctx=ctx; L.x=0; L.y=0;
    if(L.mask){ const mk=document.createElement('canvas'); mk.width=nw; mk.height=nh; mk.getContext('2d').drawImage(L.mask, ox, oy); L.mask=mk; L.maskCtx=mk.getContext('2d'); }
    if(L.splashColor){ const s=document.createElement('canvas'); s.width=nw; s.height=nh; s.getContext('2d').drawImage(L.splashColor,ox,oy); L.splashColor=s; }
    if(L.splashGray){ const s=document.createElement('canvas'); s.width=nw; s.height=nh; s.getContext('2d').drawImage(L.splashGray,ox,oy); L.splashGray=s; }
    if(L.text){ L.text.x+=ox+lx; L.text.y+=oy+ly; }
  });
  doc.width=nw; doc.height=nh; sel=null;
  setupCanvasSizes(); fitToScreen(); renderLayers(); composite(); updateSelStatus(); commit(label||'Canvas size');
}
function numField(label, val){ const f=document.createElement('label'); f.className='field'; f.style.flex='1'; const s=document.createElement('span'); s.textContent=label; const inp=document.createElement('input'); inp.type='number'; inp.min=1; inp.value=val; f.appendChild(s); f.appendChild(inp); return {f,inp}; }

  hF.inp.oninput=()=>{ h=Math.max(1,parseInt(hF.inp.value)||1); if(lock){ w=Math.max(1,Math.round(h*ratio)); wF.inp.value=w; } scaleF.inp.value=Math.round(h/oh*100); };
  scaleF.inp.oninput=()=>{ const p=Math.max(1,parseFloat(scaleF.inp.value)||1)/100; w=Math.max(1,Math.round(ow*p)); h=Math.max(1,Math.round(oh*p)); wF.inp.value=w; hF.inp.value=h; };
  const m=openModal({title:'Image size', node, buttons:[
