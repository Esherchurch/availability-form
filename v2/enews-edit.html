<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-news editor</title>
<!-- THE E-NEWS EDITOR (comms window; FINDINGS-comms plan A, approved by
     Martin 20 Oct 2026). It works the same way as Mailchimp's email builder
     - add blocks by dragging them onto the email, type on the email, the
     block's settings on the left, the whole email's look in Look - but in
     the hub's own look, icons and words (Martin: "never look like it").

     The email on the canvas is drawn by egbc-mailblocks.js in its edit mode
     (each block marked, the words typed on where they are), so what is
     edited is what is sent. Saving, the copies that are sent, scheduling
     and subscribers stay on the E-news page (enews.html): "Done" goes back
     there. Same data, same rules (enewsIssues, enewsSettings). -->
<script src="egbc-nosend.js?v=202610212000"></script>
<script src="egbc-shell.js?v=202610222000" data-title="E-news editor"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610222000"></script>
<script src="egbc-church.js?v=202610121600"></script>
<script src="egbc-editor.js?v=202610221600"></script>
<script src="egbc-mailblocks.js?v=202610222100"></script>
<script src="egbc-core-meetings.js?v=202610221500"></script>
<script src="egbc-meeting-pick.js?v=202610202000"></script>
<script src="egbc-bible.js?v=202610161700"></script>
<script src="egbc-comms.js?v=202610192100"></script>
<script src="egbc-unsplash.js?v=202610221700"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;--muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#e9ecec;
        --ok:#15803d;--danger:#b0392c;--gold:#b07d2e;--gold-bg:#fdf8ee}
  *{box-sizing:border-box}
  body{margin:0;background:#f6f7f7;color:var(--body);font:400 14px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit}
  #ed{display:flex;flex-direction:column;height:calc(100vh - var(--shell-h,0px))}
  .top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);min-height:56px}
  .top .back{display:inline-flex;align-items:center;gap:4px;color:var(--body);text-decoration:none;font-weight:500;min-height:40px;padding:0 6px;border-radius:8px}
  .top input{flex:1;min-width:80px;max-width:420px;border:1px solid transparent;border-radius:8px;min-height:38px;padding:0 8px;font:600 15px Inter,sans-serif;color:var(--ink);background:none}
  .top input:hover,.top input:focus{border-color:var(--line-2);outline:none;background:#fff}
  .sp{flex:1}
  .saved{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:500;font-size:13px;white-space:nowrap}
  .saved.busy{color:var(--muted)}.saved.err{color:var(--danger)}
  .b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none}
  .b.p{background:var(--brand);border-color:var(--brand);color:#fff}
  .b.g{border-color:transparent;background:none}
  .b:disabled{opacity:.45;cursor:default}
  .b svg{width:17px;height:17px}
  .menu{position:absolute;right:12px;top:52px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,.14);padding:6px;z-index:40;min-width:250px}
  .menu a,.menu button{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;padding:0 10px;border:0;background:none;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;text-align:left}
  .menu a:hover,.menu button:hover{background:var(--tint)}
  .body{flex:1;display:flex;min-height:0}
  .rail{width:72px;background:#fff;border-right:1px solid var(--line);padding:10px 6px;display:flex;flex-direction:column;gap:6px;flex:none}
  .rail button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;border:0;border-radius:10px;background:none;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;min-height:56px}
  .rail button[aria-pressed="true"]{background:var(--tint);color:var(--brand-dark)}
  .rail svg{width:20px;height:20px}
  .side{width:330px;flex:none;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:0 18px 90px;position:relative}
  .side h3{margin:18px 0 2px;font-size:13px;font-weight:600;color:var(--ink)}
  .side .s{margin:0 0 10px;color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{border:1px solid var(--line);border-radius:12px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500;color:var(--body);background:#fff;text-align:center;line-height:1.15;padding:6px 4px;cursor:grab}
  .tile:hover{border-color:var(--brand)}.tile svg{color:var(--brand);width:20px;height:20px}
  .tile.hub{background:var(--tint);border-color:#d5e6e3}
  .pback{display:inline-flex;align-items:center;gap:6px;margin:14px 0 6px;color:var(--brand);font-weight:500;border:0;background:none;cursor:pointer;min-height:40px;padding:0}
  .ptitle{font-size:16px;font-weight:600;color:var(--ink);margin:0 0 10px}
  .tabs{display:flex;gap:4px;background:#f3f4f6;border-radius:10px;padding:3px;margin:0 0 8px}
  .tabs button{flex:1;border:0;border-radius:8px;background:none;min-height:36px;font-weight:500;color:var(--muted);cursor:pointer}
  .tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
  label{display:block;font-size:12px;font-weight:600;color:var(--body);margin:12px 0 5px}
  input[type=text],input[type=url],input[type=email],input[type=number],select,textarea{width:100%;min-height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  textarea{padding:8px 10px;min-height:80px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .tick{display:flex;gap:10px;align-items:center;min-height:40px;margin:10px 0 0;font-weight:500;color:var(--ink)}
  .tick input{width:20px;height:20px;accent-color:var(--brand)}
  .m{color:var(--muted);font-size:12px}
  .seg2{display:flex;gap:4px;flex-wrap:wrap}.seg2 button{min-height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:#fff;cursor:pointer;color:var(--body)}
  .seg2 button[aria-pressed="true"]{background:var(--tint);border-color:var(--brand);color:var(--brand-dark);font-weight:600}
  .sw{display:flex;flex-wrap:wrap;gap:7px}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0}
  .sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--brand)}
  .pics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 0}
  .pics button{aspect-ratio:1;border:2px solid transparent;border-radius:8px;background:#eee center/cover no-repeat;cursor:pointer;min-height:40px}
  .pics button[aria-pressed="true"]{border-color:var(--brand)}
  .chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .chk svg{flex:none;width:18px;height:18px;margin-top:2px}.chk.bad svg{color:var(--danger)}.chk.warn svg{color:var(--gold)}.chk.ok svg{color:var(--ok)}
  .chk button{margin-left:auto}
  .pick a{display:flex;gap:8px;align-items:center;min-height:48px;padding:6px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;cursor:pointer}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);position:relative}
  .sub{height:50px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--line);flex:none}
  .dev{display:flex;background:#f3f4f6;border-radius:10px;padding:3px;gap:2px}
  .dev button{width:42px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .dev button[aria-pressed="true"]{background:#fff;color:var(--brand-dark);box-shadow:0 1px 2px rgba(16,24,40,.12)}
  .sub .r{position:absolute;right:12px;display:flex;gap:4px;align-items:center}
  .tool{display:none;align-items:center;gap:2px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
  .tool.on{display:flex}
  .tool select{width:auto;min-height:34px;font-size:13px}
  .tool button{min-width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .tool button:hover{background:#f3f4f6}.tool button.on{background:var(--tint);color:var(--brand-dark)}
  .tool .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .tool svg{width:17px;height:17px}
  .pop{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 20px rgba(16,24,40,.14);padding:10px;display:none}
  .pop.on{display:block}
  .emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}.emo button{font-size:20px;height:36px;border:0;background:none;border-radius:6px;cursor:pointer}.emo button:hover{background:#f3f4f6}
  .canvas{flex:1;overflow:auto;position:relative}
  .canvas iframe{display:block;border:0;width:100%;min-height:400px;background:#dee0e2}
  .canvas.phone{display:flex;justify-content:center}
  .canvas.phone iframe{width:390px;flex:none;box-shadow:0 1px 6px rgba(16,24,40,.12)}
  .dock{display:none}
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;max-width:90vw}
  #toast.on{opacity:1}
  .over{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:70;display:flex;flex-direction:column}
  .over .hd{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:#fff}
  .over .bd{flex:1;overflow:auto;display:flex;justify-content:center;padding:14px}
  .over iframe{border:0;background:#dee0e2;width:100%;max-width:700px;height:100%}
  .over.phone iframe{width:390px}
  .note{margin:20px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px}
  /* A phone: one column. The panel opens as a sheet from the dock. */
  @media (max-width:899px){
    .rail{display:none}
    .side{position:fixed;left:0;right:0;bottom:60px;width:auto;max-height:62vh;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(16,24,40,.16);z-index:35;display:none;padding-bottom:20px}
    .side.on{display:block}
    .top input{font-size:14px}
    .top .wide{display:none}
    .sub .dev{display:none}
    .canvas iframe{min-height:300px}
    .dock{display:flex;position:fixed;left:0;right:0;bottom:0;height:60px;background:#fff;border-top:1px solid var(--line);justify-content:space-around;align-items:center;z-index:36}
    .dock button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:11px;font-weight:500;color:var(--muted);min-width:64px;min-height:52px;cursor:pointer}
    .dock button[aria-pressed="true"]{color:var(--brand-dark)}
    .dock svg{width:20px;height:20px}
    .tool{position:fixed;left:0;right:0;bottom:60px;z-index:34;flex-wrap:nowrap;overflow-x:auto}
    .main{padding-bottom:60px}
  }
</style>
</head>
<body>
<div id="ed"><div class="note m">Loading…</div></div>
<div id="toast" role="status"></div>
<script src="egbc-enews-editor.js?v=202610222100"></script>
</body>
</html>
