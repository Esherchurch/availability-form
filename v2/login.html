<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — EGBC</title>
<link rel="manifest" href="./manifest-hub.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3d6263">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="content">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{--canvas:#eef4f3;--ink:#14201f;--body:#3a4d4c;--muted:#6b8281;--hairline:#dde7e6;--brand:#3d6263;--brand-dark:#2e4c4d;--brand-tint:#e7f0ef}
  body{background:var(--canvas);font-family:'Montserrat',sans-serif;color:var(--brand);-webkit-font-smoothing:antialiased}
  input:focus{border-color:var(--brand)!important;box-shadow:0 0 0 3px rgba(61,98,99,.28)!important}
  .spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-md">

  <div class="text-center mb-8">
    <img src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/copilot_image_1775806874083.jpeg?alt=media&token=7e9040a5-1d29-47e1-8f31-6e003db53ec8" alt="EGBC" class="w-20 h-20 rounded-full object-cover mx-auto mb-5 shadow-lg" style="border:3px solid #fff">
    <h1 class="text-2xl font-black tracking-tight text-[#14201f]">Esher Green Baptist Church</h1>
    <p class="text-sm font-semibold opacity-50 mt-1">Team Hub</p>
  </div>

  <div class="bg-white rounded-[2rem] border border-[#dde7e6] shadow-lg p-8">

    <div id="signinView">
      <h2 class="font-black uppercase tracking-widest text-[11px] opacity-50 mb-6 text-center">Sign in</h2>

      <button onclick="signInGoogle()" id="googleBtn"
        class="w-full flex items-center justify-center gap-3 bg-white border border-[#dde7e6] py-3.5 rounded-full font-bold text-sm hover:bg-[#f0f6f6] transition-all mb-5">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.11a6.6 6.6 0 0 1 0-4.22V7.05H2.18a11 11 0 0 0 0 9.9l3.66-2.84z"/><path fill="#EA4335" d="M12 4.75c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.46 14.97.5 12 .5A11 11 0 0 0 2.18 7.05l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <div class="flex items-center gap-3 mb-5">
        <div class="h-px flex-1 bg-[#dde7e6]"></div>
        <span class="text-[10px] font-black uppercase tracking-widest opacity-30">or</span>
        <div class="h-px flex-1 bg-[#dde7e6]"></div>
      </div>

      <label class="text-[10px] font-black uppercase tracking-widest opacity-50 block mb-2 px-1">Email a sign-in link</label>
      <input id="emailInput" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"
        class="w-full px-5 py-3.5 rounded-full border border-[#dde7e6] bg-[#f0f6f6] font-semibold text-sm outline-none mb-3"
        onkeydown="if(event.key==='Enter')sendLink()">
      <button onclick="sendLink()" id="linkBtn"
        class="w-full bg-[#3d6263] text-white py-3.5 rounded-full font-black text-[11px] uppercase tracking-widest hover:bg-black transition-all">
        Send me a link
      </button>

      <p class="text-[11px] leading-relaxed opacity-45 mt-6 text-center">
        No password needed. Use whichever email address the church has for you.
      </p>

      <div id="msg" class="hidden mt-5 text-[12px] font-bold text-center px-3 py-3 rounded-2xl"></div>
    </div>

    <div id="sentView" class="hidden text-center">
      <div class="text-4xl mb-4">📬</div>
      <h2 class="font-black text-lg mb-3">Check your email</h2>
      <p class="text-sm opacity-60 leading-relaxed mb-6">
        We've sent a sign-in link to <strong id="sentTo"></strong>.
        Open it on this device and you'll be signed straight in.
      </p>
      <button onclick="backToSignin()" class="text-[10px] font-black uppercase tracking-widest opacity-50 hover:opacity-100 transition-opacity">
        Use a different address
      </button>
    </div>

    <div id="loadingView" class="hidden text-center py-8">
      <div class="w-10 h-10 rounded-full mx-auto mb-4 spin" style="border:3px solid #dde7e6;border-top-color:#3d6263"></div>
      <p class="text-[11px] font-black uppercase tracking-widest opacity-50">Signing you in…</p>
    </div>

  </div>

  <p class="text-center text-[11px] opacity-35 mt-8 font-semibold">
    Trouble signing in? Speak to your team leader.
  </p>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",authDomain:"egbc-worship-planner.firebaseapp.com",projectId:"egbc-worship-planner",storageBucket:"egbc-worship-planner.firebasestorage.app",appId:"1:199442060489:web:7eaf85a76334c753db6918"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

const HUB='hub.html';
const EMAIL_KEY='egbc_signin_email';

function show(id){['signinView','sentView','loadingView'].forEach(v=>document.getElementById(v).classList.toggle('hidden',v!==id));}
function msg(text,ok){const m=document.getElementById('msg');m.textContent=text;m.className='mt-5 text-[12px] font-bold text-center px-3 py-3 rounded-2xl '+(ok?'bg-green-50 text-green-800':'bg-red-50 text-red-700');m.classList.remove('hidden');}
function backToSignin(){show('signinView');}

function destination(){
  const back=sessionStorage.getItem('egbc_return_to');
  sessionStorage.removeItem('egbc_return_to');
  return back&&!back.startsWith('login')?back:HUB;
}

/* ---- Email link completion ---- */
if(auth.isSignInWithEmailLink(window.location.href)){
  show('loadingView');
  let email=window.localStorage.getItem(EMAIL_KEY);
  if(!email)email=window.prompt('Please confirm your email address to finish signing in:');
  if(email){
    auth.signInWithEmailLink(email,window.location.href)
      .then(()=>{window.localStorage.removeItem(EMAIL_KEY);location.href=destination();})
      .catch(e=>{show('signinView');msg(friendly(e),false);});
  }else{show('signinView');}
}else{
  auth.onAuthStateChanged(u=>{if(u)location.href=destination();});
}

function sendLink(){
  const email=document.getElementById('emailInput').value.trim().toLowerCase();
  if(!email||!email.includes('@')){msg('Please enter a valid email address.',false);return;}
  const btn=document.getElementById('linkBtn');
  btn.disabled=true;btn.textContent='Sending…';

  auth.sendSignInLinkToEmail(email,{
    url:location.href.split('?')[0].split('#')[0],
    handleCodeInApp:true
  }).then(()=>{
    window.localStorage.setItem(EMAIL_KEY,email);
    document.getElementById('sentTo').textContent=email;
    show('sentView');
  }).catch(e=>{
    msg(friendly(e),false);
  }).finally(()=>{
    btn.disabled=false;btn.textContent='Send me a link';
  });
}

function signInGoogle(){
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(provider)
    .then(()=>{location.href=destination();})
    .catch(e=>{if(e.code!=='auth/popup-closed-by-user')msg(friendly(e),false);});
}

function friendly(e){
  const map={
    'auth/invalid-email':'That email address does not look right.',
    'auth/unauthorized-domain':'This site is not yet authorised for sign-in. Add it under Authentication → Settings → Authorised domains in Firebase.',
    'auth/operation-not-allowed':'This sign-in method is not switched on yet in Firebase.',
    'auth/invalid-action-code':'That link has expired or has already been used. Request a new one.',
    'auth/network-request-failed':'No connection. Check your network and try again.'
  };
  return map[e.code]||e.message;
}
</script>
</body>
</html>
