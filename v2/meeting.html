<!DOCTYPE html>
<html lang="en">
<head>
<script src="egbc-appmode.js?v=202610201500"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="./manifest-hub.json">

<meta name="theme-color" content="#3d6263">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{--canvas:#f6f7f7;--ink:#111827;--body:#374151;--muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;
        --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4}
  html,body{height:100%}
  body{margin:0;padding:0 12px 12px;background:var(--canvas);font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--body);
       -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;box-sizing:border-box}
  .strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;padding:12px 16px;background:#fff;
         border:1px solid var(--line);border-radius:12px}
  .strip .t{font-size:15px;font-weight:600;color:var(--ink)}
  .strip .s{font-size:13px;color:var(--muted);margin-top:2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;
       border:1px solid var(--line-2);background:#fff;color:var(--ink);font:500 13px Inter,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{background:#f3f4f6}
  .btn.solid{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.solid:hover{background:var(--brand-dark)}
  .btn.sm{height:32px;padding:0 12px}
  #stage{flex:1;min-height:420px;border-radius:12px;overflow:hidden;isolation:isolate;clip-path:inset(0 round 12px);background:#fff;border:1px solid var(--line);position:relative}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}
  .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
       color:var(--ink);text-align:center;padding:24px}
  .msg .t{font-size:20px;font-weight:600}
  .msg .s{font-size:14px;color:var(--muted);max-width:420px;line-height:1.5}
  .msg .btn{background:#fff;border-color:var(--line-2);color:var(--ink)}
  /* "Start as host" is the one to press (21 Oct 2026); 44px for a thumb. */
  .msg .btn{min-height:44px}
  .msg .btn.solid{background:var(--brand);border-color:var(--brand);color:#fff}
  #lobby{width:100%;max-width:920px;margin:0 auto}
  body.lobby-mode .strip{width:100%;max-width:920px;margin:12px auto 0;box-sizing:border-box}
  .lab{font-size:12px;font-weight:600;color:var(--muted);margin:22px 4px 8px}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .row .ic{width:36px;height:36px;border-radius:8px;background:var(--tint);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .row .t{font-size:14px;font-weight:600;color:var(--ink)}
  .row .s{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-all}
  @media(max-width:700px){body{padding:0 8px 8px}.strip{margin:8px 0;padding:10px 12px}#stage{border-radius:12px}}
  /* In a call: the title lives in the bar, gaps shrink, the call takes the rest. */
  body.in-call .strip{display:none}
  body.in-call #egbc-bar{margin-bottom:8px!important}
  body.in-call #stage{min-height:0}
  #stage:fullscreen{border-radius:0}
  /* FULL SCREEN ALWAYS HAS A WAY OUT (Martin's test, 28 Oct 2026): Escape,
     and this button, which only shows while the call fills the screen. */
  #mtExitFs{display:none;position:absolute;top:10px;right:10px;z-index:5;min-height:36px}
  #stage:fullscreen #mtExitFs{display:inline-flex}
  #invScrim{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:300;overflow:auto;padding:24px 12px;box-sizing:border-box}
  #invScrim.on{display:block}
  #invBox{max-width:600px;margin:0 auto;display:block}
  #invBox input{width:100%;box-sizing:border-box;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  #invBox .lbl{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:16px 0 6px}
  #invBox .hit{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  #invBox .hit .n{flex:1;min-width:0;font-weight:500;color:var(--ink)}
</style>

<body>

<div class="strip">
  <div style="flex:1;min-width:180px">
    <div class="t" id="mtTitle">Meeting</div>
    <div class="s" id="mtSub">&nbsp;</div>
  </div>
  <button class="btn" id="copyBtn" onclick="copyInvite()" title="The plain link works for anyone, even without a hub login"><i data-lucide="link" style="width:15px;height:15px"></i>Copy invite link</button>
</div>

<div id="lobby" style="display:none"></div>

<!-- PRESENT SLIDES (the events window's F-263): the slides, large, while
     a host presents; the call becomes a strip beside them (below on a
     phone). egbc-present.js draws in here and lays the page out itself. -->
<div id="present"></div>
<!-- Invite people to one meeting (28 Oct 2026). -->
<div id="invScrim" onclick="if(event.target===this)closeInvite()"><div class="row" id="invBox"></div></div>
<div id="stage"><div class="msg" id="msg"><div class="s">Getting the meeting ready&hellip;</div></div></div>

<script>
/* EGBC-branded video meeting. The call is Daily.co's ready-made screen
   (Daily Prebuilt) embedded here, so the waiting room, host admit, screen
   share, background blur and full screen all come with it.

   Address:  meeting.html?room=CMM[&event=<events doc id>][&t=<host token>]

   - room is one of the church's own rooms (churchSettings/video, through
     egbc-video.js): every church's rooms live in Church HQ's Daily account
     since 21 Oct 2026, so no page keeps a list or a Daily address.
   - event, when given, titles the page from the rota.
   - t is a host's meeting token, as before. Since 21 Oct 2026 nobody needs
     one sent to them: the meeting's organiser, a leader of the room's team
     and a master admin get "Start as host", which asks the hub
     (meetingHostToken, functions/video.js) for a short-lived owner token
     and joins with it. Never stored, never in this public repo.

   START AS HOST (Martin, 20 Oct 2026): he set a meeting up, joined, and was
   told to knock and wait for a host - with nobody to let him in, because he
   WAS the host. Everyone else still knocks. */

/* The church's own rooms (egbc-video.js). */
const roomLabel = r => window.EGBCVideo ? EGBCVideo.label(r) : r;
const roomUrl = r => window.EGBCVideo ? EGBCVideo.url(r) : '';
const roomExists = r => !!window.EGBCVideo && EGBCVideo.has(r);
const roomList = () => window.EGBCVideo ? EGBCVideo.rooms().map(x => [x.key, x.label]) : [];

/* The site's own colours on Daily's controls and backgrounds (Martin: make
   it look part of the page, not embedded). Daily Prebuilt only takes
   colours, so these are the hub's tokens: white panels, the light canvas
   behind the video, ink text, grey lines and the teal accent. */
const THEME = { colors: {
  accent: '#3d6263', accentText: '#FFFFFF',
  background: '#FFFFFF', backgroundAccent: '#eef5f4', baseText: '#111827',
  border: '#e5e7eb', mainAreaBg: '#f6f7f7', mainAreaBgAccent: '#eef5f4',
  mainAreaText: '#111827', supportiveText: '#6b7280',
} };

const params = new URLSearchParams(location.search);
const room = params.get('room') || '';
let eventId = params.get('event') || '';
let hostToken = params.get('t') || '';
let frame = null;

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function showMsg(title, sub, buttons) {
  const stage = document.getElementById('stage');
  stage.querySelectorAll('iframe').forEach(f => f.style.display = 'none');
  stage.querySelector('.msg')?.remove();
  const m = document.createElement('div');
  m.className = 'msg';
  m.innerHTML = `<div class="t">${esc(title)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${buttons || ''}</div>`;
  stage.appendChild(m);
}

async function copyInvite() {
  const link = roomUrl(room);
  try { await navigator.clipboard.writeText(link); alert('Invite link copied:\n' + link); }
  catch { prompt('Copy this invite link:', link); }
}

/* In a call every pixel goes to the video. The title strip is hidden and its
   job moves into the EGBC bar: the meeting's name and date replace "Meeting /
   Esher Green Baptist Church", and Copy invite link and Full screen sit beside
   Hub and Menu. The bar is drawn by egbc-shell.js?v=202610311800 once the person is known,
   so wait for it. */
function callBar() {
  const bar = document.getElementById('egbc-bar');
  if (!bar) { setTimeout(callBar, 150); return; }
  const n = bar.querySelector('.eb-n'), k = bar.querySelector('.eb-k');
  if (n) n.textContent = document.getElementById('mtTitle').textContent;
  if (k) k.textContent = document.getElementById('mtSub').textContent;
  const r = bar.querySelector('.eb-r');
  if (r && !document.getElementById('mtCopy')) {
    const ic = n => `<i data-lucide="${n}" style="width:16px;height:16px"></i>`;
    const copy = document.createElement('button');
    copy.id = 'mtCopy'; copy.className = 'eb-b'; copy.title = 'The plain link works for anyone, even without a hub login';
    copy.innerHTML = ic('link') + '<span class="eb-lbl">Copy invite link</span>';
    copy.onclick = copyInvite;
    r.insertBefore(copy, r.firstChild);
    const stage = document.getElementById('stage');
    if (document.fullscreenEnabled && stage.requestFullscreen) {
      const fs = document.createElement('button');
      fs.id = 'mtFull'; fs.className = 'eb-b'; fs.title = 'Fill the screen with the call';
      fs.innerHTML = ic('maximize') + '<span class="eb-lbl">Full screen</span>';
      fs.onclick = () => document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen();
      r.insertBefore(fs, copy.nextSibling);
    }
  }
}

/* One meeting, its own part merged in. Somebody invited by name who is on
   no team cannot read the rota, so for them it comes from the meeting's
   own part, which carries its kind, date, times, teams and room. */
async function meetingById(id) {
  if (!id) return null;
  try {
    const d = await EGBCAuth.db.collection('events').doc(id).get();
    return d.exists ? (await EGBCAuth.meetingDetails([{ id: d.id, ...d.data() }]))[0] : null;
  } catch (e) {
    const m = await EGBCAuth.db.collection('meetings').doc(id).get().catch(() => null);
    return m && m.exists ? Object.assign({ id, meeting: true }, m.data()) : null;
  }
}

async function describe(db) {
  document.getElementById('mtTitle').textContent = roomLabel(room);
  document.getElementById('mtSub').textContent = hostToken ? 'You are the host' : 'Video meeting';
  callBar();
  if (!eventId) return;
  try {
    /* Its title is on its own part (the meetings split). */
    const ev = await meetingById(eventId);
    if (!ev) return;
    const day = new Date(ev.date + 'T12:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    const time = ev.startTime ? ` · ${ev.startTime}${ev.endTime ? '–' + ev.endTime : ''}` : '';
    document.getElementById('mtTitle').textContent = ev.type + (ev.description ? ' · ' + ev.description : '');
    document.getElementById('mtSub').textContent = `${day}${time} · ${roomLabel(room)}${hostToken ? ' · You are the host' : ''}`;
    document.title = ev.type + ' — EGBC';
    callBar();
  } catch (e) { console.warn('Could not load event', e); }
}

/* Opened with no room (from the hub menu or "All rooms"): list my upcoming
   online meetings and my rooms - EGBCAuth.invitedTo and roomForMe, the one
   rule (27 Oct 2026). Everything for a master admin, or with the
   Permissions screen's "meetingsAll". */
const videoRoomFor = ev => window.EGBCVideo ? EGBCVideo.roomFor(ev) : (ev.videoRoom || '');

async function lobby(profile) {
  document.getElementById('stage').style.display = 'none';
  document.body.classList.add('lobby-mode');
  document.getElementById('copyBtn').style.display = 'none';
  document.getElementById('mtTitle').textContent = 'Meetings';
  const every = EGBCAuth.seesAllMeetings();
  document.getElementById('mtSub').textContent = every ? 'Your upcoming video calls, and every meeting room' : 'Your upcoming video calls, and your meeting rooms';
  const box = document.getElementById('lobby');
  box.style.display = '';

  const forMe = ev => EGBCAuth.invitedTo(ev);

  let upcoming = [], all = [];
  try {
    const today = new Date().toISOString().split('T')[0];
    /* The rota is for people on a team (the rules' volunteer()). Somebody
       on none still has the church's own rooms below - the members' room
       among them (§21) - so this list is simply empty for them, rather
       than a refusal on the console (audit, 15 Oct 2026). */
    const me = EGBCAuth.profile() || {};
    if (me.masterAdmin || (me.teams || []).length || (me.adminFor || []).length || every) {
      const snap = await EGBCAuth.db.collection('events').where('date', '>=', today).orderBy('date').limit(150).get();
      all = await EGBCAuth.meetingDetails(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }
    /* Invited by name (28 Oct 2026): the meetings that name me, whether or
       not I am on a team. */
    if (me.memberId) {
      const mine = await EGBCAuth.db.collection('meetings').where('invitees', 'array-contains', me.memberId).get().catch(() => null);
      (mine ? mine.docs : []).forEach(d => {
        if (!all.some(ev => ev.id === d.id) && (d.data().date || '') >= today) all.push(Object.assign({ id: d.id, meeting: true }, d.data()));
      });
    }
    /* Members' meetings (functions/members-meeting.js), for a member on no team too. */
    if (EGBCAuth.isChurchMember()) {
      const mm = await EGBCAuth.db.collection('meetings').where('membersMeeting', '==', true).get().catch(() => null);
      (mm ? mm.docs : []).forEach(d => { if (!all.some(ev => ev.id === d.id) && (d.data().date || '') >= today) all.push(Object.assign({ id: d.id, meeting: true }, d.data())); });
    }
    SHOWN = {};
    all.forEach(ev => { SHOWN[ev.id] = ev; });
    upcoming = all
      .filter(ev => !ev.archived && roomExists(videoRoomFor(ev)) && forMe(ev)
                    && EGBCAuth.mayJoinRoom(videoRoomFor(ev)))
      .sort((a, b) => (a.date + (a.startTime || '')).localeCompare(b.date + (b.startTime || '')));
  } catch (e) { console.error('Could not load meetings', e); }

  const I = (n, s) => `<i data-lucide="${n}" style="width:${s || 18}px;height:${s || 18}px"></i>`;
  let html = canSchedule() ? `<div style="margin:16px 0 0;display:flex;justify-content:flex-end">
      <button class="btn solid" onclick="openNewMeeting()">${I('plus', 16)}New meeting</button></div>
      <div id="newMeeting" style="display:none"></div>` : '';
  html += '<div class="lab">Upcoming</div>';
  if (!upcoming.length) html += '<div class="row"><div class="s" style="margin:0">No online meetings coming up for your teams.</div></div>';
  upcoming.forEach(ev => {
    const r = videoRoomFor(ev);
    const day = new Date(ev.date + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const time = ev.startTime ? ` · ${ev.startTime}${ev.endTime ? '–' + ev.endTime : ''}` : '';
    html += `<div class="row"><div class="ic">${I('calendar-clock')}</div><div style="flex:1;min-width:170px"><div class="t">${esc(ev.type)}${ev.description ? ' · ' + esc(ev.description) : ''}</div>
      <div class="s">${esc(day + time)} · ${esc(roomLabel(r))}</div></div>
      ${EGBCAuth.mayManageMeeting(ev) ? `<button class="btn sm" onclick="openInvite('${escAttr(ev.id)}')">${I('user-plus', 15)}Invite people</button>
        <button class="btn sm" onclick="cancelMeeting('${escAttr(ev.id)}')">${I('trash-2', 15)}Cancel</button>` : ''}
      <a class="btn sm solid" href="meeting.html?room=${encodeURIComponent(r)}&event=${encodeURIComponent(ev.id)}">Join</a></div>`;
  });

  const rooms = roomList().filter(([r]) => EGBCAuth.roomForMe(r));
  if (rooms.length) html += '<div class="lab">' + (every ? 'All meeting rooms' : 'Your meeting rooms') + '</div>';
  /* A members' meeting is not offered to somebody who is not a member, and
     is not shown locked either - section 21: it simply is not there. Nor
     is another team's room (27 Oct 2026). */
  rooms.forEach(([r, label]) => {
    /* In use now (27 Oct 2026): the meeting's title and when it ends. */
    const busy = EGBCVideo.inUse(r, all);
    const sub = busy ? `<div class="s in-use" style="color:#b45309;font-weight:600">In use now: ${esc(busy.type + (busy.description ? ' · ' + busy.description : ''))}, until ${esc(EGBCVideo.until(busy))}</div>` : '';
    html += `<div class="row"><div class="ic">${I('video')}</div><div style="flex:1;min-width:170px"><div class="t">${esc(label)}</div>${sub}<div class="s">${esc(roomUrl(r))}</div></div>
      <button class="btn sm" onclick="copyLink('${r}')">${I('link', 15)}Copy invite link</button>
      <a class="btn sm solid" href="meeting.html?room=${encodeURIComponent(r)}">Join</a></div>`;
  });
  html += '<div style="font-size:13px;color:var(--muted);margin:14px 4px;line-height:1.5">Rooms are private: people type their name and knock, and the host lets them in. The invite link works for anyone, even without a hub login.</div>';
  box.innerHTML = html;

  /* Arrived from the hub card's "New meeting". */
  if (params.get('new') === '1' && canSchedule() && !document.getElementById('nmType')) openNewMeeting();
  if (params.get('invite') && SHOWN[params.get('invite')] && !document.getElementById('invScrim').classList.contains('on')) openInvite(params.get('invite'));
}
let SHOWN = {};

/* ---- Cancel a meeting (28 Oct 2026) -------------------------------- */
async function cancelMeeting(id) {
  const ev = SHOWN[id];
  if (ev && await EGBCAuth.cancelMeeting(ev)) lobby(CURRENT_PROFILE);
}

/* ---- Invite people (28 Oct 2026; Martin: "invite any single person") --
   Anyone in the address book (not an under-18 on their own), or somebody
   who is not in it by name and email - an interview candidate. Each is
   emailed at once by the hub (functions/meeting-manage.js): a hub link for
   an address book person, a guest link for this one meeting for anyone
   else. */
let BOOK = null, INV = null;
async function addressBook() {
  if (BOOK) return BOOK;
  try {
    const s = await EGBCAuth.db.collection('addressBook').get();
    BOOK = s.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(p => p.name && p.archived !== true && p.status !== 'archived' && p.isMinor !== true && p.under18 !== true)
      .sort((a, b) => String(a.name).localeCompare(String(b.name)));
  } catch (e) { BOOK = []; }
  return BOOK;
}
const fieldCss = 'width:100%;box-sizing:border-box;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff';
async function openInvite(id) {
  INV = SHOWN[id] || await meetingById(id);
  if (!INV) { alert('That meeting is not there any more.'); return; }
  document.getElementById('invScrim').classList.add('on');
  invDraw(null, 'Loading who is invited…');
  try { const r = await EGBCAuth.call('meetingInvite', { event: id }, { timeoutMs: 20000 }); invDraw(r.invited); }
  catch (e) { invDraw([], 'Could not load who is invited: ' + (e.message || e)); }
  addressBook();
}
function closeInvite() { document.getElementById('invScrim').classList.remove('on'); INV = null; }
function invDraw(list, note) {
  const ev = INV, r = videoRoomFor(ev);
  const day = new Date(ev.date + 'T12:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  const I = (n, s) => `<i data-lucide="${n}" style="width:${s || 15}px;height:${s || 15}px"></i>`;
  const teams = (ev.teams || []).map(t => teamLabel(t));
  const people = (list || []).map(p => `<div class="hit"><div class="n">${esc(p.name)}<div class="s" style="margin:0">${p.kind === 'guest' ? 'Guest · ' + esc(p.email) : 'Address book'}</div></div>
      <button class="btn sm" onclick='invRemove(${JSON.stringify(p.kind === 'guest' ? { email: p.email } : { memberId: p.memberId }).replace(/'/g, '&#39;')})'>Remove</button></div>`).join('');
  document.getElementById('invBox').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px"><div class="t" style="flex:1">Invite people</div><button class="btn sm" onclick="closeInvite()">Done</button></div>
    <div class="s">${esc(ev.type + (ev.description ? ' · ' + ev.description : ''))} · ${esc(day)}${ev.startTime ? ' · ' + esc(ev.startTime) : ''}</div>
    ${r && roomUrl(r) ? `<span class="lbl">Its video room</span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="s" style="flex:1;margin:0">${esc(roomUrl(r))}</div>
      <button class="btn sm" onclick="copyLink('${escAttr(r)}')">${I('link')}Copy link</button></div>` : ''}
    <span class="lbl">Someone in the address book</span>
    <input id="invFind" placeholder="Type a name" oninput="invFind()" autocomplete="off"><div id="invHits"></div>
    <span class="lbl">Someone who is not in the address book</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="invName" placeholder="Their name" style="flex:1;min-width:150px">
      <input id="invEmail" type="email" placeholder="Their email" style="flex:1.4;min-width:190px"></div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap"><div class="s" style="flex:1;min-width:200px;margin:0">They are emailed a link for this meeting only. No hub account needed: they type their name and knock, and the host lets them in.</div>
      <button class="btn sm solid" onclick="invGuest()">Invite by email</button></div>
    <span class="lbl">Invited by name</span>
    ${people || '<div class="s">Nobody yet.</div>'}
    ${teams.length ? `<div class="s" style="margin-top:10px">And everyone on ${esc(teams.join(', '))}, who see it in the hub.</div>` : ''}
    <div class="s" id="invNote" style="margin-top:10px;color:#b45309;font-weight:600">${esc(note || '')}</div>`;
  if (window.lucide) lucide.createIcons();
}
async function invFind() {
  const q = document.getElementById('invFind').value.trim().toLowerCase();
  const box = document.getElementById('invHits');
  if (q.length < 2) { box.innerHTML = ''; return; }
  const hits = (await addressBook()).filter(p => String(p.name).toLowerCase().includes(q)).slice(0, 8);
  box.innerHTML = hits.length ? hits.map(p => `<div class="hit"><div class="n">${esc(p.name)}${p.email ? '' : '<div class="s" style="margin:0">No email address: they will see it in the hub</div>'}</div>
      <button class="btn sm solid" onclick="invPerson('${escAttr(p.id)}')">Invite</button></div>`).join('')
    : '<div class="s">Nobody by that name. Add them below by name and email.</div>';
}
async function invSend(data, done) {
  const note = document.getElementById('invNote');
  if (note) note.textContent = 'Sending…';
  try {
    const r = await EGBCAuth.call('meetingInvite', Object.assign({ event: INV.id }, data), { timeoutMs: 30000 });
    invDraw(r.invited, r.emailed === false ? 'Invited, but the email did not go. They can still see it in the hub if they have an account.' : (done || ''));
  } catch (e) { if (note) note.textContent = (e && e.message) || 'Could not invite them.'; }
}
function invPerson(id) { invSend({ memberId: id }, 'Invited and emailed.'); }
function invGuest() {
  const name = document.getElementById('invName').value.trim(), email = document.getElementById('invEmail').value.trim();
  if (!name || !email) { document.getElementById('invNote').textContent = 'Their name and email, please.'; return; }
  invSend({ guest: { name, email } }, 'Invited: ' + name + ' has been emailed their link.');
}
function invRemove(who) {
  if (!confirm('Take them off this meeting? A guest’s link stops working.')) return;
  invSend({ remove: who }, 'Taken off.');
}

/* ---- + New meeting -------------------------------------------------
   Saves into the rota's events collection, exactly as the Core Team app's
   "+" does, so it shows in the rota, the hub card, calendar files and here.
   The rules let admins, or members of one of the meeting's teams, write
   it - so non-admins are only offered their teams.
   EVERY TEAM'S OWN MEETING (reviewing window, 22 Oct 2026: a Kids Church
   leader could not set up a Kids Church meeting). The church's own meeting
   kinds come first (Services and roles: a kind that is not a service and
   says "meeting" - practices and workshops are rota kinds, not meetings),
   each with the teams it is for; after them "<team> Meeting" for every
   other team the church has (Teams & groups), in its order. The rota keeps
   a type it does not list rather than overwriting it (egbc-core-rota.js). */
let SERVICES = null;   /* { S, cfg } from EGBCAuth.services(), read in start() */
function rotaTeamsByType() {
  const out = {};
  if (!SERVICES) return out;
  const S = SERVICES.S, cfg = SERVICES.cfg;
  S.types(cfg).filter(k => !k.service && /meeting/i.test(k.name)).forEach(k => {
    out[k.name] = S.newEvent(cfg, k.name, '', EGBCAuth.teamsForJob).teams;
  });
  return out;
}
const escAttr = s => esc(s).replace(/"/g, '&quot;');
const teamLabel = t => ((EGBCAuth.TEAMS || {})[t] || {}).label || t;
/* The church's teams, in its order, nothing archived. */
function churchTeams() {
  return EGBCAuth.viewAsChoices ? EGBCAuth.viewAsChoices() : [];
}
/* The teams the meeting kinds name first, then the rest of the church's. */
function meetingTeams() {
  const by = rotaTeamsByType(), first = [];
  Object.keys(by).forEach(type => by[type].forEach(t => { if (!first.includes(t)) first.push(t); }));
  return first.concat(churchTeams().filter(t => !first.includes(t)));
}
function teamsByType() {
  const out = rotaTeamsByType(), named = [].concat(...Object.values(out));
  churchTeams().filter(t => !named.includes(t)).forEach(t => {
    const name = teamLabel(t) + ' Meeting';
    if (!out[name]) out[name] = [t];
  });
  return out;
}

function myRotaTeams() {
  if (EGBCAuth.isAdmin()) return meetingTeams();
  /* Literal match on purpose: the rule compares the event's team names with
     the user's own, so a Youth Worship member could not save a "Youth" event. */
  const mine = EGBCAuth.effectiveTeams() || [];
  return meetingTeams().filter(t => mine.includes(t));
}
/* The types to offer: the rota's, then each of my teams' own. */
function myMeetingTypes() {
  const mine = myRotaTeams(), by = teamsByType();
  /* "Meeting" first: a one-to-one or an interview belongs to no team. */
  return ['Meeting'].concat(Object.keys(by).filter(type => by[type].some(t => mine.includes(t))));
}
function canSchedule() { return myRotaTeams().length > 0; }

function termLabel(dateStr) {   /* same as getTermLabel in CoreTeamApp.html */
  const d = new Date(dateStr);
  const m = d.getMonth() + 1, y = d.getFullYear();
  return `${m <= 4 ? 'Spring' : m <= 8 ? 'Summer' : 'Autumn'} ${y}`;
}

function openNewMeeting() {
  const box = document.getElementById('newMeeting');
  const teams = myRotaTeams();
  const today = new Date().toISOString().split('T')[0];
  const field = 'width:100%;box-sizing:border-box;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff';
  const label = 'display:block;font-size:13px;font-weight:500;color:var(--ink);margin:14px 0 6px';
  box.innerHTML = `<div class="row" style="display:block;margin-top:10px">
    <div class="t" style="margin-bottom:4px">New meeting</div>
    <label style="${label}">Meeting</label>
    <select id="nmType" style="${field}" onchange="nmTypeChanged()">${myMeetingTypes().map(t => `<option value="${escAttr(t)}">${esc(t)}</option>`).join('')}</select>
    <label style="${label}">Title or notes (optional)</label>
    <input id="nmDesc" style="${field}" placeholder="e.g. Elders, Autumn planning">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="flex:2;min-width:150px"><label style="${label}">Date</label><input id="nmDate" type="date" value="${today}" style="${field}"></div>
      <div style="flex:1;min-width:100px"><label style="${label}">Start</label><input id="nmStart" type="time" value="19:30" style="${field}"></div>
      <div style="flex:1;min-width:100px"><label style="${label}">End</label><input id="nmEnd" type="time" value="21:00" style="${field}"></div>
    </div>
    <label style="${label}">Video call</label>
    <!-- EVERY MEETING ITS OWN ROOM (Martin's test, 28 Oct 2026): never a
         standing room, so two meetings never share a link. -->
    <select id="nmRoom" style="${field}"><option value="own">Yes, in a room of its own</option><option value="">No video call</option></select>
    <!-- WHO IS IT FOR: people first, whole teams only if wanted, so a
         one-to-one never invites a whole team. -->
    <label style="${label}">People</label>
    <input id="nmFind" style="${field}" placeholder="Type a name from the address book" oninput="nmFind()" autocomplete="off">
    <div id="nmHits"></div>
    <label style="${label}">Someone not in the address book</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="nmGName" style="${field};flex:1;min-width:140px;width:auto" placeholder="Their name">
      <input id="nmGEmail" type="email" style="${field};flex:1.4;min-width:180px;width:auto" placeholder="Their email">
      <button class="btn" type="button" onclick="nmAddGuest()">Add</button></div>
    <div id="nmChips" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div>
    <label style="${label}">Whole teams (optional)</label>
    <div id="nmTeams" style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink)">
      ${teams.map(t => `<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" value="${escAttr(t)}" onchange="nmCheck()" style="width:18px;height:18px;accent-color:#3d6263">${esc(teamLabel(t))}</label>`).join('')}
    </div>
    <div style="font-size:13px;color:var(--muted);margin-top:8px">With no team ticked, only you, the people you add and master admins can see it.</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:16px">
      <span id="nmWhy" style="font-size:13px;color:#b45309;font-weight:600"></span>
      <button class="btn" onclick="document.getElementById('newMeeting').style.display='none'">Cancel</button>
      <button class="btn solid" id="nmSave" onclick="saveNewMeeting()">Create meeting</button>
    </div>
  </div>`;
  box.style.display = '';
  NM_PEOPLE = []; NM_GUESTS = [];
  nmChips();
}

/* Nothing is ticked for you: a team is invited only when somebody chooses it. */
function nmTypeChanged() {}

let NM_PEOPLE = [], NM_GUESTS = [];
async function nmFind() {
  const q = document.getElementById('nmFind').value.trim().toLowerCase();
  const box = document.getElementById('nmHits');
  if (q.length < 2) { box.innerHTML = ''; return; }
  const hits = (await addressBook()).filter(p => String(p.name).toLowerCase().includes(q) && !NM_PEOPLE.some(x => x.id === p.id)).slice(0, 6);
  box.innerHTML = hits.length ? hits.map(p => `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)"><div style="flex:1">${esc(p.name)}</div>
      <button class="btn sm" type="button" onclick="nmAddPerson('${escAttr(p.id)}')">Add</button></div>`).join('')
    : '<div style="font-size:13px;color:var(--muted);padding:6px 0">Nobody by that name. Add them below by name and email.</div>';
}
function nmAddPerson(id) {
  const p = (BOOK || []).find(x => x.id === id);
  if (p && !NM_PEOPLE.some(x => x.id === id)) NM_PEOPLE.push({ id, name: p.name });
  document.getElementById('nmFind').value = ''; document.getElementById('nmHits').innerHTML = '';
  nmChips();
}
function nmAddGuest() {
  const name = document.getElementById('nmGName').value.trim(), email = document.getElementById('nmGEmail').value.trim();
  if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { document.getElementById('nmWhy').textContent = 'A guest needs a name and an email address.'; return; }
  if (!NM_GUESTS.some(g => g.email.toLowerCase() === email.toLowerCase())) NM_GUESTS.push({ name, email });
  document.getElementById('nmGName').value = ''; document.getElementById('nmGEmail').value = '';
  nmChips();
}
function nmRemove(kind, i) { (kind === 'g' ? NM_GUESTS : NM_PEOPLE).splice(i, 1); nmChips(); }
function nmChips() {
  const chip = (text, kind, i) => `<span style="display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--brand-dark);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:500">${esc(text)}
    <button type="button" onclick="nmRemove('${kind}', ${i})" aria-label="Remove" style="border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1;color:var(--brand-dark);padding:0 4px">&times;</button></span>`;
  document.getElementById('nmChips').innerHTML = NM_PEOPLE.map((p, i) => chip(p.name, 'p', i)).join('')
    + NM_GUESTS.map((g, i) => chip(g.name + ' (guest)', 'g', i)).join('');
  nmCheck();
}
/* At least one person or one team, or nobody would be invited. */
function nmCheck() {
  const teams = document.querySelectorAll('#nmTeams input:checked').length;
  const ok = teams || NM_PEOPLE.length || NM_GUESTS.length;
  document.getElementById('nmSave').disabled = !ok;
  document.getElementById('nmWhy').textContent = ok ? '' : 'Add at least one person or tick a team.';
  return !!ok;
}

async function saveNewMeeting() {
  const date = document.getElementById('nmDate').value;
  const startTime = document.getElementById('nmStart').value;
  const endTime = document.getElementById('nmEnd').value;
  const teams = [...document.querySelectorAll('#nmTeams input:checked')].map(c => c.value);
  if (!date) { alert('Pick a date.'); return; }
  if (!startTime) { alert('Pick a start time.'); return; }
  if (endTime && endTime <= startTime) { alert('The end time is before the start time.'); return; }
  if (!nmCheck()) return;
  if (NM_GUESTS.length && !document.getElementById('nmRoom').value) { document.getElementById('nmWhy').textContent = 'Guests can only join a video call.'; return; }
  const btn = document.getElementById('nmSave');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    /* Both parts at once: what the rota needs on the event, and its title
       and organiser where only the invited read them (the meetings split).
       With a call, the hub makes its own room before this resolves. */
    const id = await EGBCAuth.saveMeeting({
      date, termLabel: termLabel(date),
      type: document.getElementById('nmType').value,
      description: document.getElementById('nmDesc').value.trim(),
      teams, startTime, endTime: endTime || startTime,
      roles: [], videoRoom: document.getElementById('nmRoom').value,
      /* Who set it up: they may start the call as host (functions/video.js). */
      organiserUid: (EGBCAuth.user() || {}).uid || '',
      archived: false,
    });
    /* Then everyone chosen, in one go; each is emailed. */
    let said = 'Created.';
    if (NM_PEOPLE.length || NM_GUESTS.length) {
      btn.textContent = 'Inviting…';
      try {
        const r = await EGBCAuth.call('meetingInvite', { event: id, people: NM_PEOPLE.map(p => p.id), guests: NM_GUESTS }, { timeoutMs: 60000 });
        const sent = r.results.filter(x => x.ok && x.emailed).map(x => x.name);
        const quiet = r.results.filter(x => x.ok && !x.emailed).map(x => x.name);
        const bad = r.results.filter(x => !x.ok).map(x => x.name + ' (' + x.error + ')');
        said += (sent.length ? ' Emailed: ' + sent.join(', ') + '.' : '')
          + (quiet.length ? ' Invited, no email sent: ' + quiet.join(', ') + '.' : '')
          + (bad.length ? ' Not invited: ' + bad.join('; ') + '.' : '');
      } catch (e) { said += ' But the invitations did not go: ' + (e.message || e) + '. Use Invite people on the meeting.'; }
    }
    await lobby(CURRENT_PROFILE);
    const note = document.createElement('div');
    note.className = 'row'; note.style.cssText = 'margin-top:16px;border-color:#3d6263;color:var(--ink);font-weight:500';
    note.textContent = said;
    document.getElementById('lobby').prepend(note);
  } catch (e) {
    console.error('Could not save meeting', e);
    alert('Could not save the meeting: ' + e.message);
    btn.disabled = false; btn.textContent = 'Create meeting';
  }
}

async function copyLink(r) {
  const link = roomUrl(r);
  try { await navigator.clipboard.writeText(link); alert('Invite link copied:\n' + link); }
  catch { prompt('Copy this invite link:', link); }
}

let CURRENT_PROFILE = null;

async function start(profile) {
  CURRENT_PROFILE = profile;
  if (window.EGBCVideo) await EGBCVideo.load();
  /* The Permissions screen's answers, before "which meetings are mine". */
  if (EGBCAuth.loadPerms) await EGBCAuth.loadPerms().catch(() => {});
  /* In the room, voting on a phone (egbc-vote.js): no video. */
  if (params.get('vote') && eventId && window.EGBCVote) { document.getElementById('copyBtn').style.display = 'none'; document.getElementById('mtTitle').textContent = 'Voting'; EGBCVote.voteOnly({ eventId, mount: document.getElementById('stage') }); return; }
  /* The church's meeting kinds, for + New meeting. */
  if (EGBCAuth.services) SERVICES = await EGBCAuth.services().catch(() => null);
  if (!room) { lobby(profile); return; }
  if (!roomExists(room)) {
    showMsg('Meeting room not found', 'This link does not point to one of the church’s meeting rooms. If the meeting was cancelled, its room has closed.', '<a class="btn" href="hub.html">Back to hub</a>');
    return;
  }
  /* Hiding the room cannot cover a pasted address, so this one has to be
     said out loud. It is the only place a members-only thing is refused
     rather than simply absent. */
  if (!EGBCAuth.mayJoinRoom(room)) {
    showMsg('Members only',
      'This room is for church members. If you have formally joined the church '
      + 'and this is wrong, ask the church office to tick it against your record.',
      '<a class="btn" href="hub.html">Back to hub</a>');
    return;
  }
  /* Only a meeting I am invited to, or one of my rooms (27 Oct 2026).
     Hiding the others cannot cover a pasted address, so it is said. */
  const host = await mayHostHere(profile);
  if (!host && !(await mayEnter())) {
    showMsg('Not one of your meetings',
      'This meeting is for the people invited to it. If you should be there, ask whoever set it up.',
      '<a class="btn" href="meeting.html">Your meetings</a>');
    return;
  }
  /* IN USE BY ANOTHER MEETING (27 Oct 2026): say so - the meeting's title
     and when it ends - rather than drop somebody into another group's
     call. Somebody invited to that meeting is simply taken to it. */
  const busy = await inUseHere();
  if (busy && busy.id !== eventId) {
    if (EGBCAuth.invitedTo(busy)) { eventId = busy.id; }
    else {
      showMsg('In use now',
        esc(busy.type + (busy.description ? ' · ' + busy.description : '')) + ' is using this room until ' + esc(EGBCVideo.until(busy)) + '.',
        '<a class="btn" href="meeting.html">Your meetings</a>');
      return;
    }
  }
  /* The organiser, a leader of the room's team or a master admin chooses;
     everyone else knocks, as before. */
  if (!hostToken && host) { askHost(profile); return; }
  join(profile);
}

/* The meeting in this room right now, if any (today's rota). */
async function inUseHere() {
  try {
    const t = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date());
    const snap = await EGBCAuth.db.collection('events').where('date', '==', t).get();
    return EGBCVideo.inUse(room, snap.docs.map(d => ({ id: d.id, ...d.data() })));
  } catch (e) { return null; }
}

/* One of my rooms, or this meeting (in this room) is one I am invited to. */
async function mayEnter() {
  if (EGBCAuth.roomForMe(room)) return true;
  if (!eventId) return false;
  try {
    const ev = await meetingById(eventId);
    return !!ev && videoRoomFor(ev) === room && EGBCAuth.invitedTo(ev);
  } catch (e) { return false; }
}

/* A hint for the page only: the hub decides (meetingHostToken refuses
   anyone else). Master admin; an admin of one of the room's teams; or
   whoever set this meeting up, in this room. */
async function mayHostHere(profile) {
  if (EGBCAuth.isMaster()) return true;
  const adminFor = (EGBCAuth.adminAreas && EGBCAuth.adminAreas()) || (profile && profile.adminFor) || [];
  const teams = window.EGBCVideo ? EGBCVideo.teams(room) : [];
  if (teams.some(t => adminFor.includes(t))) return true;
  /* Rooms chaired by a team rather than its admins: the members' meeting. */
  const hostTeams = window.EGBCVideo ? EGBCVideo.hostTeams(room) : [];
  const mine = (EGBCAuth.effectiveTeams && EGBCAuth.effectiveTeams()) || [];
  if (hostTeams.some(t => mine.includes(t))) return true;
  if (!eventId) return false;
  try {
    const ev = await meetingById(eventId);
    const me = EGBCAuth.user();
    return !!(ev && me && ev.organiserUid === me.uid && videoRoomFor(ev) === room);
  } catch (e) { return false; }
}

function askHost(profile) {
  describe(EGBCAuth.db);
  showMsg('You can host this meeting',
    'As the host you let people in when they knock, and share your screen or slides.',
    '<button class="btn solid" id="mtHost">Start as host</button><button class="btn" id="mtGuest">Join as a guest</button>');
  document.getElementById('mtGuest').onclick = () => join(profile);
  document.getElementById('mtHost').onclick = async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = 'Starting\u2026';
    try {
      const r = await EGBCAuth.call('meetingHostToken', { room, event: eventId });
      hostToken = r.token;
      join(profile);
    } catch (err) {
      showMsg('Could not start as host', (err && err.message) || '',
        '<button class="btn" id="mtGuest2">Join as a guest</button>');
      document.getElementById('mtGuest2').onclick = () => join(profile);
    }
  };
}

function join(profile) {
  document.body.classList.add('in-call');
  document.body.classList.toggle('hosting', !!hostToken);
  describe(EGBCAuth.db);

  if (!window.DailyIframe) {
    showMsg('The video service did not load', 'Check your internet connection, or open the meeting directly.',
      `<a class="btn" href="${roomUrl(room)}${hostToken ? '?t=' + encodeURIComponent(hostToken) : ''}">Open meeting directly</a>`);
    return;
  }

  document.getElementById('msg')?.remove();
  document.querySelector('#stage .msg')?.remove();
  frame = DailyIframe.createFrame(document.getElementById('stage'), {
    showLeaveButton: true,
    /* One full screen, the page's own (the bar's Full screen fills the
       screen with #stage), so the page can always take it back. */
    showFullscreenButton: false,
    theme: THEME,
    iframeStyle: { position: 'absolute', inset: '0', width: '100%', height: '100%', border: '0', borderRadius: '12px' },
  });

  /* Present slides (F-263): hosts present, everyone in the meeting follows.
     egbc-present.js puts its own "Present slides" over the call for a host,
     and stops a presentation when its presenter leaves. */
  if (window.EGBCPresent) EGBCPresent.attachMeeting({ room, eventId: params.get('event') || '',
    el: document.getElementById('present'), call: document.getElementById('stage'), host: !!hostToken,
    /* Daily's call, so leaving it ends a host's say-so (F-264) even before the page closes. */
    frame });
  /* Votes (egbc-vote.js): they pop up for everyone; the chair has "Votes". */
  if (window.EGBCVote && eventId) EGBCVote.attachMeeting({ eventId, host: !!hostToken });

  /* LEAVING OR ENDING (Martin's test, 28 Oct 2026: in full screen, when
     the meeting ended nothing worked). Out of full screen first, the call
     taken down, then the left screen, whose Rejoin and Back to hub work. */
  let over = false;
  const ended = (title, sub, again) => {
    if (over) return; over = true;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    document.body.classList.remove('in-call');
    const f = frame; frame = null;
    try { f && f.destroy(); } catch (e) {}
    showMsg(title, sub, `<button class="btn solid" onclick="location.reload()">${again}</button><a class="btn" href="hub.html">Back to hub</a>`);
  };
  frame.on('left-meeting', () => ended('You have left the meeting', '', 'Rejoin'));
  let joined = false;
  frame.on('joined-meeting', () => { joined = true; });
  frame.on('error', e => ended(joined ? 'The meeting has ended' : 'The meeting could not start', (e && e.errorMsg) || '', joined ? 'Rejoin' : 'Try again'));
  if (!document.getElementById('mtExitFs')) {
    const x = document.createElement('button');
    x.id = 'mtExitFs'; x.className = 'btn'; x.textContent = 'Exit full screen';
    x.onclick = () => document.exitFullscreen().catch(() => {});
    document.getElementById('stage').appendChild(x);
  }

  const opts = { url: roomUrl(room), userName: (profile && profile.name) || '' };
  if (hostToken) opts.token = hostToken;
  frame.join(opts).catch(e => console.error('join failed', e));
}

/* Escape always leaves full screen, wherever the focus is on this page. */
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen().catch(() => {}); });

EGBCAuth.require().then(start);
</script>
