<!DOCTYPE html>
<html lang="en">
<head>
<script src="egbc-nosend.js?v=202610212000"></script>
<script src="egbc-appmode.js?v=202610201500"></script>
<script src="egbc-shell.js?v=202610311800" data-title="Watch &amp; Listen"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Watch &amp; Listen — EGBC</title>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3d6263">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js?v=202610312000"></script>
<script src="egbc-help.js?v=202610281800"></script>
<script src="egbc-orientation.js?v=202610160500"></script>
<script src="egbc-fullvideo.js?v=202610160500"></script>
<script src="egbc-church.js?v=202610192330"></script>
<script src="egbc-watch.js?v=202610141000"></script>
<script src="egbc-guard.js?v=202610311900"></script>
<style>
  :root{
    --canvas:#f6f7f7; --surface:#fff; --ink:#111827; --body:#374151; --muted:#6b7280;
    --faint:#9ca3af; --line:#e5e7eb; --line-2:#d1d5db; --brand:#3d6263; --brand-dark:#2a4a4b;
    --tint:#eef5f4; --ring:rgba(61,98,99,.15); --live:#b0392c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  h1{font-size:22px;font-weight:600;color:var(--ink);margin:0 0 6px;letter-spacing:-.01em}
  h2{font-size:15px;font-weight:600;color:var(--ink);margin:22px 0 8px}
  .lede{margin:0 0 10px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
        box-shadow:0 1px 2px rgba(16,24,40,.05);padding:14px 16px;margin-bottom:10px}
  .empty{color:var(--muted)}
  .live{border-color:var(--live)}
  .live .k{color:var(--live);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .latest{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:560px){.latest{grid-template-columns:1fr}}
  .latest .card{margin:0;display:flex;flex-direction:column;gap:6px}
  .latest .k{font-size:12px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}
  .latest b{color:var(--ink);font-weight:600}
  .switch{display:flex;gap:6px;margin:20px 0 10px;background:#e9eeee;border-radius:12px;padding:4px}
  .switch button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--body);
                 font:500 15px Inter,system-ui,sans-serif;cursor:pointer}
  .switch button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
  .list{padding:0}
  .row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;border:0;background:none;
       text-align:left;font:inherit;color:inherit;cursor:pointer}
  .list .row+.row{border-top:1px solid var(--line)}
  .row .t{display:block;color:var(--ink);font-weight:500}
  .row .s{display:block;font-size:13px;color:var(--muted)}
  .row svg{flex-shrink:0;color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:8px;
       border:1px solid var(--brand);background:var(--brand);color:#fff;font:500 14px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none}
  .btn.plain{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .player{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  audio{width:100%;margin-top:8px}
  .q{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font:inherit;color:var(--ink);margin-bottom:10px}
  .more{margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Watch &amp; Listen</h1>
  <p class="lede">Sunday services, the church's videos and sermons, for everyone.</p>
  <div id="liveBox"></div>
  <div id="playBox"></div>
  <div id="latest" class="latest"></div>
  <div class="switch" role="group" aria-label="Listen or watch" id="switch">
    <button type="button" data-part="listen" aria-pressed="false">Listen</button>
    <button type="button" data-part="watch" aria-pressed="false">Watch</button>
  </div>
  <div id="part"><div class="card empty">Loading…</div></div>
</div>
<script>
/* WATCH & LISTEN for everyone on the website (Martin, 15 Oct 2026: "The
   podcast/YouTube admin is so everyone else can watch and listen").
   The same things as the app's Listen & Watch (the events window's
   egbc-app-listen.js), read the same way and decided by the same
   egbc-watch.js:
     - the live link on the day ("Watch live" / "Watch again");
     - the newest video and the newest sermon side by side;
     - Watch: full services (signed in, or church members) and the
       channel's latest videos, playing in place;
     - Listen: the published sermons, with a player and a search.
   It opens on whichever part has something: while there are no sermons,
   on Watch. Feature 'watch' off: Listen only. The pages that manage these
   are watch-admin.html and sermons-admin.html ("Manage Watch", "Manage
   sermons"). */
const db = EGBCAuth.db;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const W = window.EGBCWatch;
const usesWatch = () => !window.EGBCChurch || !EGBCChurch.uses || EGBCChurch.uses('watch');
const all = (s) => (s && s.docs ? s.docs : []).map(d => Object.assign({ id: d.id }, d.data()));
const ICON = {
  play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4V8z"/></svg>',
  audio: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>'
};
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function said(d) { d = String(d || '').slice(0, 10); const p = d.split('-'); return p.length === 3 ? (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0] : ''; }

let D = { sermons: [], series: {}, members: [], channel: [], live: null, channelId: '' };
let PART = '', Q = '';

function seriesName(s) { const x = D.series[s.seriesId]; return x ? x.name : ''; }
function passage(s) { return s.book ? s.book + (s.passage ? ' ' + s.passage : '') : ''; }
function subOf(s) { return [seriesName(s) || passage(s), s.speaker, said(s.date)].filter(Boolean).join(' · '); }

async function load() {
  const member = (EGBCAuth.profile() || {}).churchMember === true;
  const watch = usesWatch();
  const r = await Promise.all([
    db.collection('sermons').where('published', '==', true).get().catch(() => null),
    db.collection('sermonSeries').get().catch(() => null),
    watch ? db.collection('watchShow').doc('live').get().catch(() => null) : null,
    watch ? db.collection('watchShow').doc('settings').get().catch(() => null) : null,
    watch ? db.collection('videos').where('source', '==', 'members').where('audience', '==', 'signedIn').get().catch(() => null) : null,
    watch && member ? db.collection('videos').where('source', '==', 'members').where('audience', '==', 'churchMembers').get().catch(() => null) : null,
    watch ? db.collection('videos').where('source', '==', 'feed').get().catch(() => null) : null
  ]);
  D.sermons = all(r[0]).filter(s => s.audioUrl || (s.audioPath && s.durationSec > 0))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(a.title).localeCompare(String(b.title)));
  D.series = {}; all(r[1]).forEach(s => { D.series[s.id] = s; });
  D.live = r[2] && r[2].exists ? r[2].data() : null;
  D.channelId = r[3] && r[3].exists && W ? W.settingsOf(r[3].data()).channelId : '';
  D.members = all(r[4]).concat(all(r[5])).filter(v => !v.hidden).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  D.channel = all(r[6]).filter(v => !v.hidden).sort((a, b) => String(b.published).localeCompare(String(a.published))).slice(0, 12);
  if (!watch) $('switch').hidden = true;
  /* Open on whichever part has something (Martin: an empty Listen made
     people think nothing was there). */
  PART = !watch ? 'listen' : (D.sermons.length ? 'listen' : 'watch');
  draw();
}

function liveCard() {
  const st = W && D.live ? W.liveState(D.live, new Date()) : null;
  if (!st) return '';
  const again = st === 'again';
  return `<div class="card live" data-w="live"><div class="k">${again ? 'Watch again' : 'Live now'}</div>
    <h2 style="margin:4px 0 10px">${esc(D.live.title || 'Sunday service')}</h2>
    <button type="button" class="btn" data-video="${esc(W.videoIdFromUrl(D.live.url))}" data-title="${esc(D.live.title || 'Sunday service')}">${ICON.play} ${again ? 'Watch again' : 'Watch live'}</button></div>`;
}

function latest() {
  const v = D.members[0] && D.channel[0] ? (String(D.members[0].date) >= String(D.channel[0].published).slice(0, 10) ? D.members[0] : D.channel[0]) : (D.members[0] || D.channel[0]);
  const s = D.sermons[0];
  const out = [];
  if (v && usesWatch()) out.push(`<div class="card" data-w="latest-video"><span class="k">Latest video</span><b>${esc(v.title)}</b>
    <span class="s">${esc(said(v.date || v.published))}</span>
    <button type="button" class="btn plain" data-video="${esc(v.videoId)}" data-title="${esc(v.title)}">${ICON.play} Watch</button></div>`);
  if (s) out.push(`<div class="card" data-w="latest-sermon"><span class="k">Latest sermon</span><b>${esc(s.title)}</b>
    <span class="s">${esc(subOf(s))}</span>
    <button type="button" class="btn plain" data-sermon="${esc(s.id)}">${ICON.audio} Listen</button></div>`);
  return out.join('');
}

function watchPart() {
  const rows = (list, label) => list.length ? `<h2>${label}</h2><div class="card list">${list.map(v =>
    `<button type="button" class="row" data-video="${esc(v.videoId)}" data-title="${esc(v.title)}">${ICON.play}<span><span class="t">${esc(v.title)}</span>
      <span class="s">${esc(said(v.date || v.published))}${v.audience === 'churchMembers' ? ' · church members' : ''}</span></span></button>`).join('')}</div>` : '';
  const channel = D.channelId ? `<p class="more"><a class="btn plain" href="https://www.youtube.com/channel/${esc(D.channelId)}" target="_blank" rel="noopener">The church's YouTube channel</a></p>` : '';
  const body = rows(D.members, 'Full services') + rows(D.channel, 'Latest videos');
  return (body || '<div class="card empty" data-w="no-videos">Videos will appear here once the church puts them up.</div>') + channel;
}

function listenPart() {
  if (!D.sermons.length) return '<div class="card empty" data-w="no-sermons">Sermons will appear here once they are put up.</div>';
  const q = Q.toLowerCase().trim();
  const list = !q ? D.sermons.slice(0, 40) : D.sermons.filter(s =>
    [s.title, s.speaker, seriesName(s), passage(s), said(s.date), s.date].join(' ').toLowerCase().includes(q));
  return `<input class="q" id="q" type="search" placeholder="Search by speaker, book, title or date" aria-label="Search sermons" value="${esc(Q)}">
    <div class="card list">${list.length ? list.map(s =>
      `<button type="button" class="row" data-sermon="${esc(s.id)}">${ICON.audio}<span><span class="t">${esc(s.title)}</span><span class="s">${esc(subOf(s))}</span></span></button>`).join('')
      : '<p class="empty" style="padding:14px 16px;margin:0">Nothing matches that.</p>'}</div>`;
}

function draw() {
  $('liveBox').innerHTML = usesWatch() ? liveCard() : '';
  $('latest').innerHTML = latest();
  document.querySelectorAll('#switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.part === PART)));
  $('part').innerHTML = PART === 'watch' ? watchPart() : listenPart();
  $('part').dataset.part = PART;
}

function playVideo(id, title) {
  if (!id || !W) return;
  /* The same full screen as the app (F-215): always closes, sideways on
     Android, the picture turned on an iPhone. */
  $('playBox').innerHTML = window.EGBCFullVideo
    ? '<div class="card" style="padding:10px">' + EGBCFullVideo.html(W.embedUrl(id) + '&autoplay=1', title || 'Video') + '</div>'
    : `<div class="player"><iframe src="${esc(W.embedUrl(id) + '&autoplay=1')}" title="${esc(title || 'Video')}"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  $('playBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
async function playSermon(id) {
  const s = D.sermons.find(x => x.id === id); if (!s) return;
  let url = s.audioUrl || '';
  if (!url && s.audioPath) { try { url = await EGBCAuth.storage().ref(s.audioPath).getDownloadURL(); } catch (e) { url = ''; } }
  $('playBox').innerHTML = `<div class="card" data-w="now"><span class="s" style="color:var(--muted);font-size:13px">Now playing</span>
    <h2 style="margin:2px 0 0">${esc(s.title)}</h2><p style="margin:2px 0 0;color:var(--muted)">${esc(subOf(s))}</p>
    ${url ? `<audio controls autoplay preload="none" src="${esc(url)}"></audio>` : '<p class="empty">This sermon could not be loaded. Please try again.</p>'}</div>`;
  $('playBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.addEventListener('click', (e) => {
  const sw = e.target.closest('#switch button');
  if (sw) { PART = sw.dataset.part; draw(); return; }
  const v = e.target.closest('[data-video]');
  if (v) { playVideo(v.dataset.video, v.dataset.title); return; }
  const s = e.target.closest('[data-sermon]');
  if (s) playSermon(s.dataset.sermon);
});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  Q = e.target.value; const at = e.target.selectionStart;
  $('part').innerHTML = listenPart();
  const q = $('q'); if (q) { q.focus(); q.setSelectionRange(at, at); }
});
document.addEventListener('egbc-ready', () => { load().catch((e) => {
  console.error('watch: could not load', e);
  $('part').innerHTML = '<div class="card empty">This could not be loaded. Please try again.</div>';
}); });
</script>
</body>
</html>
