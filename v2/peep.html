<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My evacuation plan</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-appmode.js?v=202610152310"></script>
<script src="egbc-shell.js?v=202610160500" data-title="My evacuation plan"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610160500"></script>
<script src="egbc-guard.js?v=202610121600"></script>
<script src="egbc-church.js?v=202610121600"></script>
<script src="egbc-events.js?v=202610161700"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#3d6263;--ink:#111827;--body:#374151;--muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;--red:#b0392c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 16px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
  h1{font-size:22px;color:var(--ink);margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
  label.l{display:block;font-size:14px;font-weight:600;color:var(--ink);margin:12px 0 4px}
  .hint{font-size:13px;color:var(--muted);margin:2px 0 0}
  textarea{width:100%;min-height:72px;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink)}
  .chk{display:flex;gap:10px;align-items:flex-start;min-height:48px;margin-top:12px}.chk input{width:22px;height:22px;flex:none;margin-top:2px}
  .btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;font:700 16px Inter,sans-serif;background:var(--brand);color:#fff;border:0;width:100%;margin:8px 0;cursor:pointer}
  .btn.sec{background:#fff;color:var(--red);border:1px solid #e7c3be}
  .said{font-size:14px;color:var(--muted);min-height:20px}
  .warn{background:#fdf6e9;color:#7a5a1f;border-radius:10px;padding:10px 12px;margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card">Loading…</div></div>
<script>
(function () {
  'use strict';
  /* MY EVACUATION PLAN (a PEEP; Stage 4, F-234; Martin, 19 Oct). The person's
     own plan, made with their agreement: what help they need to get out,
     who helps, where they go, any equipment. NO MEDICAL HISTORY. They edit
     it; it is reviewed yearly; they delete it when it is no longer needed.
     Only they and master admins can open it here. On the day they are in -
     checked in, or on the rota - the fire wardens and the duty stewards on
     duty see it on the fire roll-call, and nobody else. Never in an email.
     Every change is logged. */
  var E = window.EGBCEvents, esc = E.esc, ME = {}, MID = '', P = null;
  var TODAY = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  function db() { return EGBCAuth.db; }
  function $(id) { return document.getElementById(id); }
  function day(s) { var p = String(s).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }); }
  function nextYear() { var p = TODAY.split('-').map(Number); return new Date(Date.UTC(p[0] + 1, p[1] - 1, p[2])).toISOString().slice(0, 10); }
  function log(what) { return db().collection('peepLog').doc().set({ what: what, memberId: MID, by: EGBCAuth.user().uid, byName: ME.name || '', at: new Date().toISOString() }).catch(function () {}); }
  function field(id, label, hint, v) { return '<label class="l" for="' + id + '">' + label + '</label><textarea id="' + id + '" maxlength="300">' + esc(v || '') + '</textarea><p class="hint">' + hint + '</p>'; }
  function draw() {
    var p = P || {};
    $('wrap').innerHTML = '<h1>My evacuation plan</h1><p class="sub">If you would need help to get out of the building in a fire, a short plan means the people on duty know what to do. It is yours: change it or delete it whenever you like.</p>' +
      (P && P.reviewDue && P.reviewDue < TODAY ? '<div class="warn" id="reviewDue">Please check your plan is still right, and save it again.</div>' : '') +
      '<div class="card">' +
      field('needs', 'What help would you need to get out quickly?', 'For example: "I use a wheelchair and cannot use stairs." Please do not put medical details here.', p.needs) +
      field('helpers', 'Who helps you? (optional)', 'For example: "My husband, or a steward."', p.helpers) +
      field('route', 'Where do you go? (optional)', 'For example: "The ground floor side exit", or "the refuge on the landing".', p.route) +
      field('equipment', 'Any equipment? (optional)', 'For example: "the evacuation chair".', p.equipment) +
      '<label class="chk"><input type="checkbox" id="agree"' + (P ? ' checked' : '') + '> <span>I agree that the fire wardens and the duty stewards on duty may see this plan on the fire roll-call when I am in the building. Nobody else sees it, and it is never emailed.</span></label>' +
      '</div><button class="btn" id="save">' + (P ? 'Save my plan' : 'Make my plan') + '</button>' +
      (P ? '<button class="btn sec" id="del">Delete my plan (I no longer need it)</button><p class="hint">Saved. Review it by ' + esc(day(P.reviewDue)) + '.</p>' : '') +
      '<p class="said" id="msg" role="status"></p>';
    $('save').onclick = function () {
      var needs = $('needs').value.trim();
      if (!needs) { $('msg').textContent = 'Say what help you would need.'; return; }
      if (!$('agree').checked) { $('msg').textContent = 'Tick to agree, or the plan cannot be shown to the people on duty.'; return; }
      var d = { memberId: MID, name: ME.name || '', agreed: true, agreedAt: (P && P.agreedAt) || new Date().toISOString(), needs: needs.slice(0, 300),
        helpers: $('helpers').value.trim().slice(0, 300), route: $('route').value.trim().slice(0, 300), equipment: $('equipment').value.trim().slice(0, 300),
        reviewDue: nextYear(), madeBy: 'self', updatedBy: EGBCAuth.user().uid, updatedAt: new Date().toISOString() };
      var made = !P;
      db().collection('peeps').doc(MID).set(d).then(function () { P = d; return log(made ? 'made' : 'changed'); }).then(function () { draw(); $('msg').textContent = 'Saved.'; }, function (e) { $('msg').textContent = 'Not saved: ' + (e.message || e); });
    };
    if ($('del')) $('del').onclick = function () {
      if (!confirm('Delete your evacuation plan?')) return;
      db().collection('peeps').doc(MID).delete().then(function () { P = null; return log('deleted'); }).then(function () { draw(); $('msg').textContent = 'Deleted.'; }, function (e) { $('msg').textContent = 'Not deleted: ' + (e.message || e); });
    };
  }
  E.ready().then(function (profile) {
    ME = E.asSeen(profile || {}); MID = ME.memberId || '';
    /* "View as": the page a member with no plan sees - and nothing saves
       (it would be the master admin's own plan, under someone else's view). */
    if (E.viewing()) { P = null; draw(); $('save').onclick = function () { $('msg').textContent = 'Not while viewing as someone else.'; }; return; }
    if (!MID) { $('wrap').innerHTML = '<h1>My evacuation plan</h1><div class="card">This is for people in the church’s address book. Ask the church office.</div>'; return; }
    return db().collection('peeps').doc(MID).get().then(function (d) { P = d.exists ? d.data() : null; draw(); });
  }).catch(function (e) { $('wrap').innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
})();
</script>
</body>
</html>
