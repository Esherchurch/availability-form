<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Session planner</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-appmode.js?v=202610201500"></script>
<script src="egbc-shell.js?v=202610211500" data-title="Session planner"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js?v=202610210900"></script>
<script src="egbc-guard.js?v=202610210900"></script>
<script src="egbc-church.js?v=202610121600"></script>
<script src="egbc-launch.js?v=202610141700"></script>
<script src="egbc-events.js?v=202610161700"></script>
<script src="egbc-bible.js?v=202610161700"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;--muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;
        --canvas:#f6f7f7;--ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--gold:#b07d2e;--gold-bg:#fdf8ee}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:18px 16px calc(80px + env(safe-area-inset-bottom))}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 2px}
  .sub{color:var(--muted);margin:0 0 12px;font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:16px;font-weight:600;color:var(--ink);margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .spacer{flex:1}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
  .chip{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font:600 14px Inter,sans-serif;color:var(--ink);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border-radius:10px;font:600 15px Inter,sans-serif;
       cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff;text-decoration:none}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.small{min-height:44px;font-size:14px;padding:0 12px}
  .btn.danger{background:#fff;color:var(--danger);border-color:#e7c3be}
  .btn:disabled{opacity:.55}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label.l{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:10px 0 4px}
  .inp,select,textarea{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font:inherit;background:#fff;color:var(--ink)}
  textarea{padding:10px 12px;min-height:70px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:520px){.grid2{grid-template-columns:1fr}}
  .wk{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 4px;border-top:1px solid var(--line);min-height:44px;cursor:pointer;border-radius:8px}
  .wk:first-of-type{border-top:0}.wk:hover{background:var(--tint)}
  .d{font-weight:700;color:var(--ink);font-size:14px}.d small{display:block;font-weight:500;color:var(--muted)}
  .t{color:var(--ink);font-weight:600}.m{font-size:13px;color:var(--muted)}
  .code{display:inline-block;padding:0 8px;border-radius:6px;background:var(--tint);color:var(--brand-dark);font-weight:700;font-size:12px;margin-right:6px}
  .away{color:var(--danger)}
  .special{background:var(--gold-bg);border-radius:10px;padding:6px 10px;color:#7a5a1f;font-weight:600;font-size:14px;display:inline-block}
  .part{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
  .part .ph{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:4px;min-height:52px;padding:4px 8px 4px 0;cursor:pointer}
  .handle{display:grid;place-items:center;min-height:44px;color:var(--muted);font-size:20px;cursor:grab;touch-action:none}
  .part .pb{padding:0 12px 12px;border-top:1px solid var(--line)}
  .step{display:grid;grid-template-columns:44px 1fr auto;gap:4px;align-items:center;border:1px solid var(--line);border-radius:10px;margin:6px 0;padding:4px 6px 4px 0;background:var(--canvas)}
  .tag{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--canvas);display:inline-block;margin:2px 4px 2px 0}
  .pill{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 4px 0 10px;border-radius:999px;background:var(--tint);color:var(--brand-dark);font-size:13px;font-weight:600;margin:2px 4px 2px 0}
  .pill.away{background:#fdecea;color:var(--danger)}
  .pill button{border:0;background:none;min-width:36px;min-height:36px;cursor:pointer;color:inherit;font-size:16px}
  .said{font-size:13px;color:var(--muted);min-height:18px;margin:6px 0 0}
  .verse{font-family:Georgia,serif;font-size:15px;color:var(--ink);line-height:1.6}
  .verse sup{color:var(--brand);font:700 10px Inter,sans-serif;margin-right:2px}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin:0 0 10px}
  .seg button{min-height:48px;border:0;background:#fff;font:600 13px Inter,sans-serif;color:var(--ink);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
  .back{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
  @media (min-width:700px){.back{align-items:center}}
  .sheet{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;position:relative}
  @media (min-width:700px){.sheet{border-radius:16px}}
  .sheet .x{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:#fff;font-size:18px;cursor:pointer;z-index:2}
  .ro .edit{display:none}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;display:none;max-width:90vw}
  @media print{
    body{background:#fff}.wrap{padding:0;max-width:none}.chips,.noprint,.handle,#toast,#egbc-viewas,#egbc-viewas-top{display:none!important}
    .card,.part{border:none;padding:0;margin:0 0 10px}.part .pb{border:0;padding:0}.part .ph{grid-template-columns:1fr auto;min-height:0}
    .inp,select,textarea{border:0;padding:0;min-height:0}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card">Loading…</div></div>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  /* THE SESSION PLANNER (F-223, F-225; Martin, 16 Oct), feature name
     'sessionPlanner'. Groups (Kids Church, Lazers, Youth, the preaching
     team) are set up by a master admin; each group's leaders edit every
     plan of it, its team reads them. Copied in approach from the Sunday
     Service Planner - one document per plan, the parts an array inside it,
     dragged to reorder with SortableJS and saved in the dropped order.
     (session-planner.html, not planner.html: on Windows that is the same
     file as the Rota Planner, Planner.html.) */
  var E = window.EGBCEvents, B = window.EGBCBible, esc = E.esc;
  var SITES = [], ME = {}, MASTER = false, GROUPS = [], G = null, SESS = [], S = null, PEOPLE = {}, MARKERS = {}, TEAMMEM = [], VIEW = 'term', DIRTY = false, OPEN = {};
  /* SERMON MODE (Martin, 16 Oct): a group of kind 'sermon' (the preaching
     team) plans sermons. Each plan is made from a service on the rota and
     keeps its id (eventId): the date, the speaker (events.speakerId) and the
     readers' passages come from the rota / Preaching plan, read afresh each
     time; the plan adds the title, series, passage and the outline. The
     other way, a server trigger (sermonLinkKeep) keeps sermonLinks/<event>
     for the Preaching plan to show and link to. */
  var SERVICE_TYPES = ['Sunday Morning Worship', 'Evening Carol Service', 'Midnight Service', 'Special Service', 'LOUD Worship'];
  var SERMON_PARTS = ['Introduction', 'Point 1', 'Point 2', 'Point 3', 'Application', 'Response'];
  var EVENT = null;
  function sermon() { return !!G && G.kind === 'sermon'; }
  var KINDS = ['Welcome', 'Game', 'Story', 'Video', 'Craft', 'Worship', 'Prayer', 'Quiz', 'Talk', 'Discussion', 'Other'];
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var STEP_TYPES = [['verses', 'Bible verses'], ['video', 'Video file'], ['youtube', 'YouTube'], ['picture', 'Picture'], ['song', 'Song'], ['memory', 'Memory verse'],
    ['timer', 'Timer'], ['text', 'Text slide'], ['quiz', 'Quiz'], ['pptx', 'PowerPoint'], ['link', 'Open a link (e.g. Urban Saints)']];
  function db() { return EGBCAuth.db; }
  function $(id) { return document.getElementById(id); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3500); }
  function all(s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }
  function realUid() { return (EGBCAuth.user() || {}).uid || ''; }
  function rid() { return Math.random().toString(36).slice(2, 10); }
  /* The group's leaders - and master admins, for any group (Martin, 19 Oct). */
  function canEdit() { return !!G && (MASTER || (G.leaderIds || []).indexOf(ME.memberId || '-') >= 0); }
  function dayOf(d) { var p = String(d).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function dm(d) { var x = dayOf(d); return [x.getUTCDate() + ' ' + x.toLocaleDateString('en-GB', { month: 'short', timeZone: 'UTC' }), x.toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' })]; }
  function longDay(d) { return dayOf(d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }); }
  function today() { var n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())).toISOString().slice(0, 10); }
  function nextDate(after, dow) {
    var x = dayOf(after || today());
    if (after) x.setUTCDate(x.getUTCDate() + 1);
    while (x.getUTCDay() !== (dow == null ? 0 : dow)) x.setUTCDate(x.getUTCDate() + 1);
    return x.toISOString().slice(0, 10);
  }
  function names(ids) { return (ids || []).map(function (i) { return PEOPLE[i] || ''; }).filter(Boolean).join(', '); }

  /* ---------------- the page ---------------- */
  function draw() {
    if (window.EGBCChurch && EGBCChurch.uses && !EGBCChurch.uses('sessionPlanner')) { $('wrap').innerHTML = '<div class="card">The session planner is not used by this church.</div>'; return; }
    if (!GROUPS.length && !MASTER) {
      E.refused();
      $('wrap').innerHTML = '<h1>Session planner</h1><div class="card"><p>This page is for the leaders and teams of the groups that plan their sessions here (for example Kids Church). Ask a master admin to add you to a group.</p></div>';
      return;
    }
    var chips = '<div class="chips noprint" role="tablist">' + GROUPS.map(function (g) {
      return '<button class="chip" data-g="' + esc(g.id) + '" aria-pressed="' + (!!G && G.id === g.id && VIEW !== 'groups') + '">' + esc(g.name) + '</button>';
    }).join('') + (MASTER ? '<button class="chip" data-v="groups" aria-pressed="' + (VIEW === 'groups') + '">⚙ Groups</button>' : '') + '</div>';
    var body = VIEW === 'groups' ? groupsView() : !G ? '<div class="card"><p>No groups yet. Add one under ⚙ Groups.</p></div>' : VIEW === 'session' && S ? sessionView() : termView();
    $('wrap').innerHTML = chips + body;
    wire();
  }

  /* ---- the term: a table of weeks like Karen's ---- */
  function termView() {
    var rows = SESS.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    return '<h1>' + esc(G.name) + '</h1><p class="sub">' + esc([G.ageFrom || G.ageTo ? 'ages ' + (G.ageFrom || '?') + '-' + (G.ageTo || '?') : '', canEdit() ? 'you lead this group' : 'you can read the plans'].filter(Boolean).join(' · ')) + '</p>' +
      '<div class="card" id="term"><h2>The term<span class="spacer"></span><span class="m">' + rows.length + ' plan' + (rows.length === 1 ? '' : 's') + '</span></h2>' +
      (rows.length ? rows.map(function (s) {
        var d = dm(s.date);
        return '<div class="wk" data-s="' + esc(s.id) + '" role="button" tabindex="0"><div class="d">' + esc(d[0]) + '<small>' + esc(d[1]) + '</small></div><div>' +
          (s.special === 'none' ? '<span class="special">No ' + esc(G.name) + (s.title ? ': ' + esc(s.title) : '') + '</span>'
            : (s.special ? '<span class="special">★ ' + esc(s.special) + '</span>' + (s.title || s.lessonCode ? '<br>' : '') : '') + (s.special && !s.title && !s.lessonCode ? '' : '<span class="t">' + (s.lessonCode ? '<span class="code">' + esc(s.lessonCode) + '</span>' : '') + esc(s.title || 'Untitled') + '</span>')) +
          (sermon() && (s.speaker || s.speakerId) ? '<div class="m">Speaker: ' + esc(s.speaker || PEOPLE[s.speakerId] || '') + (s.series ? ' · ' + esc(s.series) : '') + '</div>' : '') +
          (((LIVE[s.date] || s).onIds || []).length ? '<div class="m">On: ' + esc(names((LIVE[s.date] || s).onIds)) + '</div>' : '') +
          (((LIVE[s.date] || s).awayIds || []).length ? '<div class="m away">Away: ' + esc(names((LIVE[s.date] || s).awayIds)) + '</div>' : '') + '</div></div>';
      }).join('') : '<p class="m">No plans yet.</p>') +
      '<div class="row noprint" style="margin-top:10px">' + (canEdit() ? '<button class="btn" id="addWeek">' + (sermon() ? '+ Plan a sermon for a service' : '+ Add a ' + esc(DAYS[G.day == null ? 0 : +G.day])) + '</button>' : '') +
        '<button class="btn sec" id="printTerm">Print the term</button></div></div>';
  }

  /* ---- one week ---- */
  function sessionView() {
    var ro = !canEdit(), dis = ro ? ' disabled' : '';
    var progs = G.programmes || [];
    var bring = [].concat.apply([], (S.parts || []).map(function (p) { return p.bring || []; })).filter(Boolean);
    var specialSel = S.special === 'none' ? 'none' : (S.special ? 'note' : '');
    return '<div class="' + (ro ? 'ro' : '') + '" id="session">' +
      '<div class="row noprint" style="margin:0 0 8px"><button class="btn sec small" id="toTerm">← The term</button></div>' +
      '<h1>' + esc(S.title || (S.special === 'none' ? 'No session' : 'New plan')) + '</h1><p class="sub">' + esc(longDay(S.date)) + ' · ' + esc(G.name) + '</p>' +
      '<div class="card">' +
        '<div class="grid2"><div><label class="l" for="sDate">Date</label><input class="inp" type="date" id="sDate" value="' + esc(S.date) + '"' + dis + '></div>' +
        '<div' + (sermon() ? ' hidden' : '') + '><label class="l" for="sSpecial">This week</label><select id="sSpecial"' + dis + '><option value="">A normal session</option><option value="note"' + (specialSel === 'note' ? ' selected' : '') + '>A special week (say what)</option><option value="none"' + (specialSel === 'none' ? ' selected' : '') + '>No session this week</option></select></div></div>' +
        '<div id="specialBox"' + (specialSel === 'note' ? '' : ' hidden') + '><label class="l" for="sSpecialText">What is special</label><input class="inp" id="sSpecialText" maxlength="120" value="' + esc(specialSel === 'note' ? S.special.trim() : '') + '"' + dis + '></div>' +
        '<label class="l" for="sTitle">' + (S.special === 'none' ? 'Why (e.g. family nativity service)' : sermon() ? 'Sermon title' : 'Lesson title') + '</label><input class="inp" id="sTitle" maxlength="120" value="' + esc(S.title || '') + '"' + dis + '>' +
        (sermon() ? fromPlanCard() + '<label class="l" for="sSeries">Series</label><input class="inp" id="sSeries" maxlength="80" value="' + esc(S.series || '') + '"' + dis + '>' : '') +
        (sermon() ? '' : '<div class="grid2"><div><label class="l" for="sProg">Programme</label><select id="sProg"' + dis + '><option value="">(none)</option>' +
          progs.map(function (p) { return '<option value="' + esc(p.name) + '"' + (S.programme === p.name ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="l" for="sCode">Lesson code</label><input class="inp" id="sCode" maxlength="20" placeholder="e.g. EJ03" value="' + esc(S.lessonCode || '') + '"' + dis + '></div></div>' +
        '<label class="l" for="sLink">Link to the lesson</label><input class="inp" id="sLink" type="url" placeholder="https://" value="' + esc(S.lessonLink || '') + '"' + dis + '>' +
        (S.lessonLink ? '<p class="said"><a href="' + esc(S.lessonLink) + '" target="_blank" rel="noopener">Open the lesson ↗</a></p>' : '')) +
        '<label class="l">Bible passage</label><div id="passageBox">' + passageHtml(S.passage) + '</div>' +
        (ro ? '' : '<div class="row noprint edit" style="margin-top:6px"><button class="btn sec small" id="pickPassage">' + (S.passage && S.passage.ref ? 'Change the passage' : 'Choose a passage') + '</button></div>') +
        (sermon() ? '' : '<label class="l">On this week (from the rota)</label><div id="onBox">' + peopleChips('on', S.onIds, ro) + '</div>' +
        '<label class="l">Away (from the availability form)</label><div id="awayBox">' + peopleChips('away', S.awayIds, ro) + '</div>') +
        (ro || sermon() ? '' : '<div class="row noprint edit" style="margin-top:6px"><button class="btn sec small" id="fromRota">Fill in from the rota</button><select id="addPerson" style="width:auto;min-width:170px"><option value="">Add someone…</option>' +
          TEAMMEM.concat(Object.keys(PEOPLE).filter(function (i) { return (G.leaderIds || []).indexOf(i) >= 0 && !TEAMMEM.some(function (t) { return t.id === i; }); }).map(function (i) { return { id: i, name: PEOPLE[i] }; }))
            .map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('') + '</select><select id="addAs" style="width:auto"><option value="on">as on</option><option value="away">as away</option></select></div>') +
        (S.updatedByName ? '<p class="said" id="lastBy">Last changed by ' + esc(S.updatedByName) + (S.updatedAt ? ', ' + esc(new Date(S.updatedAt).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })) : '') + '</p>' : '') +
      '</div>' +
      (bring.length ? '<div class="card" id="bringAll"><h2>Things to bring</h2><p style="margin:0">' + esc(bring.join(', ')) + '</p></div>' : '') +
      (S.special === 'none' ? '' : '<div class="card"><h2>' + (sermon() ? 'The outline' : 'The session') + '<span class="spacer"></span><span class="m noprint">' + (ro ? '' : 'drag ⠿ to reorder') + '</span></h2><div id="parts">' +
        (S.parts || []).map(partHtml).join('') + '</div>' +
        (ro ? '' : '<div class="row noprint edit"><select id="newPart" style="width:auto"><option value="">+ Add a part…</option>' + (G.parts && G.parts.length ? G.parts : KINDS).map(function (k) { return '<option>' + esc(k) + '</option>'; }).join('') + '</select></div>') + '</div>') +
      '<div class="row noprint" style="margin-bottom:6px">' + (ro ? '' : '<button class="btn" id="save">Save</button><button class="btn sec" id="email">Email the plan</button>') +
        '<button class="btn sec" id="print">Print</button>' + (S.id ? '<a class="btn sec" id="present" href="present.html?s=' + encodeURIComponent(S.id) + '" target="_blank" rel="noopener">Present</a>' : '') + (ro || !S.id ? '' : '<button class="btn danger" id="del">Delete this plan</button>') + '</div><p class="said noprint" id="sMsg" role="status"></p></div>';
  }
  /* The rota's side of a sermon plan, read afresh: it is the Preaching plan's to change. */
  function fromPlanCard() {
    var e = EVENT || {};
    var rd = (e.readers || []).filter(function (x) { return x && (x.name || x.passage); });
    return '<div class="card" id="fromPlan" style="background:var(--tint);border-color:#cfe1df;margin:10px 0 0"><h2 style="margin:0 0 4px">From the Preaching plan</h2>' +
      (S.eventId && !EVENT ? '<p class="m" style="margin:0">Loading the service…</p>' : !S.eventId ? '<p class="m" style="margin:0">Not linked to a service on the rota.</p>' :
      '<p style="margin:0"><b>' + esc(longDay(e.date || S.date)) + '</b>' + (e.type ? ' · ' + esc(e.type) : '') + '</p>' +
      '<p style="margin:2px 0 0">Speaker: <b id="planSpeaker">' + esc(e.speaker || PEOPLE[e.speakerId] || 'not set yet') + '</b>' + (e.serviceLeader ? ' · Service leader: ' + esc(e.serviceLeader) : '') + '</p>' +
      (e.publicTitle ? '<p style="margin:2px 0 0">Description: ' + esc(e.publicTitle) + '</p>' : '') +
      (rd.length ? '<p style="margin:2px 0 0">Readers: ' + esc(rd.map(function (x) { return x.name + (x.passage ? ' (' + x.passage + ')' : ''); }).join(', ')) + '</p>' : '') +
      '<p class="said" style="margin:6px 0 0">The date, speaker and readers are changed in the <a href="preaching-plan.html">Preaching plan</a>.</p>') + '</div>';
  }
  function passageHtml(p) {
    if (!p || !p.ref) return '<p class="m" style="margin:0">None yet.</p>';

    document.querySelectorAll('[data-v="groups"]').forEach(function (b) { b.onclick = function () { if (DIRTY && !confirm('Leave without saving?')) return; DIRTY = false; VIEW = 'groups'; draw(); }; });
    document.querySelectorAll('.wk[data-s]').forEach(function (r) { r.onclick = r.onkeydown = function (e) { if (e.type === 'keydown' && e.key !== 'Enter') return; openSession(r.getAttribute('data-s')); }; });
    if ($('addWeek')) $('addWeek').onclick = addWeek;
    if ($('printTerm')) $('printTerm').onclick = function () { window.print(); };

  }

    if ($('addPerson')) $('addPerson').onchange = function () { var id = this.value; if (!id) return; readTop(); var k = $('addAs').value === 'away' ? 'awayIds' : 'onIds', o = k === 'onIds' ? 'awayIds' : 'onIds'; S[o] = (S[o] || []).filter(function (x) { return x !== id; }); S[k] = (S[k] || []).filter(function (x) { return x !== id; }).concat([id]); DIRTY = true; draw(); };
    document.querySelectorAll('[data-drop]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); readTop(); var x = b.getAttribute('data-drop').split(':'), k = x[0] === 'away' ? 'awayIds' : 'onIds'; S[k] = (S[k] || []).filter(function (i) { return i !== x[1]; }); DIRTY = true; draw(); }; });

        p.show = order.map(function (i) { return p.show[i]; }); DIRTY = true; draw(); } });
      var add = el.querySelector('[data-addstep]'); if (add) add.onchange = function () { var t = this.value; if (!t) return; readTop(); this.value = ''; stepEditor(t, function (st) { p.show = (p.show || []).concat([st]); DIRTY = true; draw(); }, p); };

  /* Read what is on the screen into S, so a redraw loses nothing. */

      var p = (S.parts || []).filter(function (x) { return x.id === el.getAttribute('data-p'); })[0]; if (!p || !OPEN[p.id]) return;

      p.links = v('links').split('\n').map(function (x) { return x.trim(); }).filter(function (x) { return /^https?:\/\//.test(x); }).map(function (u) { return { url: u }; });

  /* ---- saving ---- */
  function clean(p) {
    return { id: p.id, kind: p.kind || '', title: String(p.title || '').slice(0, 80), minutes: +p.minutes || 0, notes: String(p.notes || '').slice(0, 4000),
      links: (p.links || []).slice(0, 20), files: (p.files || []).slice(0, 20), bring: (p.bring || []).slice(0, 30), show: (p.show || []).slice(0, 40) };
  }
  function save() {
    readTop();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(S.date)) { say('Give the date.'); return Promise.reject(new Error('date')); }
    var doc = { groupId: G.id, date: S.date, special: S.special === ' ' ? '' : (S.special || ''), title: S.title || '', programme: S.programme || '', lessonCode: S.lessonCode || '',
      lessonLink: S.lessonLink || '', passage: S.passage || null, onIds: S.onIds || [], awayIds: S.awayIds || [], parts: (S.parts || []).map(clean),
      eventId: S.eventId || '', speakerId: S.speakerId || '', speaker: String(S.speaker || '').slice(0, 120), series: String(S.series || '').slice(0, 80),
      updatedBy: realUid(), updatedByName: String(ME.name || '').slice(0, 120), updatedAt: new Date().toISOString() };
    say('Saving…');
    var ref = S.id ? db().collection('planSessions').doc(S.id) : db().collection('planSessions').doc();
    return ref.set(doc).then(function () { S.id = ref.id; S.updatedByName = doc.updatedByName; S.updatedAt = doc.updatedAt; DIRTY = false; return loadSessions(); })
      .then(function () { draw(); say('Saved.'); }, function (e) { say('Not saved: ' + (/permission/i.test(String(e && (e.code || e.message))) ? 'only this group\'s leaders can change its plans.' : (e.message || e))); throw e; });
  }
  function sendPlan() {
    if (!S.id) { say('Save the plan first.'); return; }
    say('Sending…');
    EGBCAuth.call('planSend', { sessionId: S.id }).then(function (r) { r = r && r.data !== undefined ? r.data : r; say('Sent to ' + r.sent + ' ' + (r.sent === 1 ? 'person' : 'people') + ': every leader of ' + G.name + ' and this week\'s team.'); },
      function (e) { say('Not sent: ' + (e.message || e)); });
  }
  function upload(p, file, msg) {
    if (!file) return;
    var big = /^video\//.test(file.type) ? 500 : 50;
    if (file.size > big * 1024 * 1024) { msg.textContent = 'That file is over ' + big + ' MB.'; return; }
    if (!S.id) { msg.textContent = 'Save the plan first, then add files.'; return; }
    var name = file.name.replace(/[^\w.\- ]+/g, '_').slice(-80), path = 'planner/' + G.id + '/' + S.id + '/' + Date.now() + '-' + name;
    msg.textContent = 'Uploading…';
    var task = EGBCAuth.storage().ref(path).put(file, { contentType: file.type || 'application/octet-stream' });
    task.on('state_changed', function (s) { msg.textContent = 'Uploading… ' + Math.round(100 * s.bytesTransferred / Math.max(1, s.totalBytes)) + '%'; });
    task.then(function (s) { return s.ref.getDownloadURL(); }).then(function (url) {
      p.files = (p.files || []).concat([{ name: file.name.slice(0, 80), path: path, url: url, type: file.type || '', size: file.size }]); DIRTY = true; draw(); toast('Uploaded. Save to keep it.');
    }, function (e) { msg.textContent = 'Not uploaded: ' + (/unauthorized|permission/i.test(String(e && (e.code || e.message))) ? 'only this group\'s leaders can add files.' : (e.message || e)); });
  }

  /* ---- who's on, who's away: READ LIVE (Martin, 19 Oct) ----------------
     The rota and the availability form are the truth; a plan only keeps a
     copy (onIds, awayIds) for when the rota has no service that date. Every
     time the planner opens, the term's dates are read from the rota in one
     go, and a leader's visit quietly brings the stored copies up to date
     (the rules allow a leader that one change - onIds, awayIds, rotaAt -
     without it counting as "Last changed by"). LIVE[date] = { onIds,
     awayIds } for a date the rota has a service on; none for a date it
     hasn't, and the stored copy shows. */
  var LIVE = {};
  function liveRota(dates) {
    dates = (dates || []).filter(Boolean).sort();
    if (!dates.length || !G || sermon()) return Promise.resolve({});
    return db().collection('events').where('date', '>=', dates[0]).where('date', '<=', dates[dates.length - 1]).get().then(function (snap) {
      var evs = all(snap).filter(function (e) { return !e.archived && dates.indexOf(e.date) >= 0; }), byDate = {};
      evs.forEach(function (e) {
        var d = byDate[e.date] = byDate[e.date] || { on: [], ids: [] };
        d.ids.push(e.id);
        Object.keys(e.assignments || {}).forEach(function (role) {
          var team = EGBCAuth.roleTeam ? EGBCAuth.roleTeam(role) : '';
          if (G.teamName && team !== G.teamName) return;
          [].concat(e.assignments[role] || []).forEach(function (a) { var id = a && (a.id || a.memberId); if (id && d.on.indexOf(String(id)) < 0) d.on.push(String(id)); });
        });
      });
      var ids = [].concat.apply([], Object.keys(byDate).map(function (k) { return byDate[k].ids; })), chunks = [];
      for (var i = 0; i < ids.length; i += 30) chunks.push(ids.slice(i, i + 30));
      return Promise.all(chunks.map(function (c) { return db().collection('availability').where('eventId', 'in', c).get().catch(function () { return { docs: [] }; }); })).then(function (r) {
        var team = TEAMMEM.map(function (p) { return p.id; }).concat(G.leaderIds || []), awayBy = {};
        r.forEach(function (sn) { all(sn).forEach(function (a) {
          if (a.status !== 'unavailable' && a.status !== 'not-avail') return;
          Object.keys(byDate).forEach(function (dt) {
            var d = byDate[dt]; if (d.ids.indexOf(a.eventId) < 0) return;
            if (team.indexOf(a.memberId) < 0 && d.on.indexOf(a.memberId) < 0) return;
            var aw = awayBy[dt] = awayBy[dt] || []; if (aw.indexOf(a.memberId) < 0) aw.push(a.memberId);
          });
        }); });
        var out = {};
        Object.keys(byDate).forEach(function (dt) { var aw = awayBy[dt] || []; out[dt] = { onIds: byDate[dt].on.filter(function (i) { return aw.indexOf(i) < 0; }), awayIds: aw }; });
        return out;
      });
    }).catch(function () { return {}; });
  }
  function same(a, b) { return JSON.stringify((a || []).slice().sort()) === JSON.stringify((b || []).slice().sort()); }
  /* A leader's visit brings the stored copies up to date (the fallback). */
  function refreshCopies() {
    if (!canEdit()) return;
    SESS.forEach(function (s) {
      var l = LIVE[s.date]; if (!l || (same(l.onIds, s.onIds) && same(l.awayIds, s.awayIds))) return;
      s.onIds = l.onIds; s.awayIds = l.awayIds;
      db().collection('planSessions').doc(s.id).update({ onIds: l.onIds, awayIds: l.awayIds, rotaAt: new Date().toISOString() }).catch(function () {});
    });
  }

    return Promise.all([
      db().collection('addressBook').get().then(function (s) { s.docs.forEach(function (d) { var x = d.data(); if (x.name && !x.archived) { PEOPLE[d.id] = x.name; MARKERS[d.id] = x.markers || []; } }); }).catch(function () {}),
      EGBCChurch.load ? EGBCChurch.load().catch(function () {}) : null,
      db().collection('sites').get().then(function (s) { SITES = all(s).filter(function (x) { return x.active !== false; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); }).catch(function () {})
    ]).then(loadGroups);
  }).then(function () {
    var want = (location.search.match(/[?&]s=([\w-]+)/) || [])[1];
    var keep = ''; try { keep = localStorage.getItem('egbc_planner_group') || ''; } catch (e) {}
    if (want) return db().collection('planSessions').doc(want).get().then(function (d) {
      if (!d.exists) return pick((GROUPS[0] || {}).id);
      return pick(d.data().groupId).then(function () { openSession(want); });
    }, function () { return pick((GROUPS[0] || {}).id); });
    var g = GROUPS.filter(function (x) { return x.id === keep; })[0] || GROUPS[0];
    /* No group yet: a master admin starts on setting one up. */
    if (!g) { if (MASTER) VIEW = 'groups'; draw(); return; }
    return pick(g.id);
  }).catch(function (e) { $('wrap').innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
  window.addEventListener('beforeunload', function (e) { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
