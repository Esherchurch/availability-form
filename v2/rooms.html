<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a room</title>

<script src="egbc-nosend.js?v=202610072100"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .bar .f{min-width:140px}
  label.l{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select{height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff;width:100%}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:8px;font:500 13px Inter,sans-serif;
       cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--brand-dark)} .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)} .btn.sec:hover{background:#f3f4f6}
  .btn.sec.on{background:var(--tint);border-color:var(--brand)}
  .hint{font-size:13px;color:var(--muted)}
  .bk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .bk:first-child{border-top:none}
  .bk .t{flex:1;min-width:200px}.bk .t b{color:var(--ink);font-weight:600}
  .pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.wait{background:var(--gold-bg);color:var(--gold)}.pill.no{background:var(--danger-bg);color:var(--danger)}
  .st{border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0}
  .st.ok{background:var(--ok-bg);color:var(--ok)}.st.wait{background:var(--gold-bg);color:var(--gold)}.st.no{background:var(--danger-bg);color:var(--danger)}
  .back{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;z-index:60;overflow:auto;padding:24px 12px}
  .sheet{background:#fff;border-radius:14px;max-width:640px;margin:0 auto;padding:20px}
  .sheet h3{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 12px}
  .quote{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;background:#fbfcfc}.quote h4{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 8px}
  .scroll{overflow-x:auto}
  .scroll>div{min-width:560px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap">
  <h1>Book a room</h1>
  <p class="sub">See when rooms are free, and book one: for a band practice, a meeting, anything. Click a free time to start.</p>
  <div class="card" id="cal"><p class="hint">Loading…</p></div>
  <div class="card" id="mine"></div>
  <p class="hint" id="office"></p>
</div>
<div class="back" id="back"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var B = window.EGBCBookings;
  var SITES = [], ROOMS = [], MENUS = [], KIT = [], MINE = [], ME = null, KINDS = [], CARDS = {}, QT = window.EGBCQuote;
  var V = { site: '', view: 'day', day: B.today(), room: '' };
  function db() { return EGBCAuth.db; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3500); }
  function site() { return SITES.filter(function (s) { return s.id === V.site; })[0] || {}; }
  function siteRooms() { return ROOMS.filter(function (r) { return r.siteId === V.site; }); }
  function roomById(id) { return ROOMS.filter(function (r) { return r.id === id; })[0]; }
  function mineOn(roomId, day) {
    var m = {};
    MINE.forEach(function (b) {
      if (b.roomId !== roomId || b.day !== day || (b.status !== 'confirmed' && b.status !== 'requested')) return;
      for (var i = b.slotFrom; i < b.slotTo; i++) m[i] = true;
    });
    return m;
  }
  function svc(roomId, day) { return function (i) { return B.serviceAt(site(), roomId, day, i); }; }

  /* ---- the calendar: a day (every room) or a week (one room) ---- */
  function drawCal() {
    var rs = siteRooms();
    if (!V.room || !roomById(V.room) || roomById(V.room).siteId !== V.site) V.room = rs[0] ? rs[0].id : '';
    var head = '<div class="bar">' +
      (SITES.length > 1 ? '<div class="f"><label class="l" for="c-site">Site</label><select id="c-site">' + SITES.map(function (s) {
        return '<option value="' + esc(s.id) + '"' + (s.id === V.site ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select></div>' : '') +
      '<div><button class="btn sec' + (V.view === 'day' ? ' on' : '') + '" id="c-day">Day</button> <button class="btn sec' + (V.view === 'week' ? ' on' : '') + '" id="c-week">Week</button></div>' +
      '<div class="f"><label class="l" for="c-date">' + (V.view === 'day' ? 'Day' : 'Week from') + '</label><input class="inp" type="date" id="c-date" value="' + esc(V.day) + '"></div>' +
      '<div><button class="btn sec" id="c-prev" aria-label="Earlier">&larr;</button> <button class="btn sec" id="c-next" aria-label="Later">&rarr;</button></div>' +
      (V.view === 'week' ? '<div class="f"><label class="l" for="c-room">Room</label><select id="c-room">' + rs.map(function (r) {
        return '<option value="' + esc(r.id) + '"' + (r.id === V.room ? ' selected' : '') + '>' + esc(r.name) + '</option>'; }).join('') + '</select></div>' : '') +
      '<div style="margin-left:auto"><button class="btn" id="c-book">Book a room</button></div></div>';
    var el = document.getElementById('cal');
    el.innerHTML = head + '<div class="scroll"><div id="c-grid"><p class="hint">Loading…</p></div></div>';
    wireCal();
    if (!rs.length) { document.getElementById('c-grid').innerHTML = '<p class="hint">No rooms here can be booked by members.</p>'; return; }
    var job;
    if (V.view === 'day') {
      job = B.loadDays(rs, V.day).then(function (days) {
        return '<p class="hint" style="margin:0 0 6px">' + esc(EGBCEvents.fmtDate(V.day + 'T12:00')) + '</p>' + B.axis() + rs.map(function (r) {
          return B.bar(days[r.id], { label: r.name, mine: mineOn(r.id, V.day), service: svc(r.id, V.day), click: true, attrs: ' data-room="' + esc(r.id) + '" data-day="' + V.day + '"' });
        }).join('');
      });
    } else {
      var r = roomById(V.room), list = [0, 1, 2, 3, 4, 5, 6].map(function (n) { return B.addDays(V.day, n); });
      job = Promise.all(list.map(function (d) { return B.loadDays([r], d); })).then(function (all) {
        return '<p class="hint" style="margin:0 0 6px">' + esc(r.name) + '</p>' + B.axis() + list.map(function (d, i) {
          return B.bar(all[i][r.id], { label: EGBCEvents.fmtDateShort(d + 'T12:00'), mine: mineOn(r.id, d), service: svc(r.id, d), click: true, attrs: ' data-room="' + esc(r.id) + '" data-day="' + d + '"' });
        }).join('');
      });
    }
    job.then(function (html) {
      document.getElementById('c-grid').innerHTML = html + B.key(true);
      document.querySelectorAll('#c-grid [data-slot]').forEach(function (c) {
        c.onclick = function () {
          var row = c.closest('.bk-row'), s = +c.dataset.slot;
          openSheet({ room: row.dataset.room, day: row.dataset.day, start: B.hhmm(s * 15), end: B.hhmm(Math.min(s * 15 + 60, 1425)) });
        };
      });
    }).catch(function (e) { document.getElementById('c-grid').innerHTML = '<p class="hint">Could not load: ' + esc(e.message || e) + '</p>'; });
  }
  function wireCal() {
    var g = function (id) { return document.getElementById(id); };
    if (g('c-site')) g('c-site').onchange = function () { V.site = this.value; drawCal(); };
    g('c-day').onclick = function () { V.view = 'day'; drawCal(); };
    g('c-week').onclick = function () { V.view = 'week'; drawCal(); };
    g('c-date').onchange = function () { if (this.value) { V.day = this.value; drawCal(); } };
    g('c-prev').onclick = function () { V.day = B.addDays(V.day, V.view === 'day' ? -1 : -7); drawCal(); };
    g('c-next').onclick = function () { V.day = B.addDays(V.day, V.view === 'day' ? 1 : 7); drawCal(); };
    if (g('c-room')) g('c-room').onchange = function () { V.room = this.value; drawCal(); };
    g('c-book').onclick = function () { openSheet({ room: V.view === 'week' ? V.room : '', day: V.day }); };
  }

  /* ---- your bookings ----
     A member can cancel their own (R3). A date of a repeating booking can
     be cancelled on its own, or with every later date. */
  function drawMine() {
    var up = MINE.filter(function (b) { return b.day >= B.today(); }).sort(function (a, b) { return (a.day + a.startMin / 10000) < (b.day + b.startMin / 10000) ? -1 : 1; });
    document.getElementById('mine').innerHTML = '<h2>Your bookings</h2>' + (up.length ? up.map(function (b) {
      var r = roomById(b.roomId) || { name: 'A room' }, live = b.status === 'confirmed' || b.status === 'requested';
      var later = b.series ? up.filter(function (x) { return x.series && x.series.id === b.series.id && x.day > b.day && (x.status === 'confirmed' || x.status === 'requested'); }) : [];
      var pill = { confirmed: '<span class="pill ok">Confirmed</span>', requested: '<span class="pill wait">Waiting for approval</span>',
                   declined: '<span class="pill no">Declined</span>', cancelled: '<span class="pill no">Cancelled</span>' }[b.status] || '';
      return '<div class="bk" data-bk="' + esc(b.key) + '"><div class="t"><b>' + esc(b.title || 'Booking') + '</b><br><span class="hint">' + esc(r.name) + ', ' + esc(B.when(b)) +
        (b.series ? ' · ' + esc(B.RULES[b.series.rule] || '') + ', date ' + b.series.n + ' of ' + b.series.of : '') +
        ' · reference ' + esc(B.ref(b)) + '</span>' + (b.decisionNote && b.status !== 'confirmed' ? '<br><span class="hint">' + esc(b.decisionNote) + '</span>' : '') +
        (live ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn sec" data-cancel="one">Cancel</button>' +
          (later.length ? '<button class="btn sec" data-cancel="later">Cancel this and the ' + later.length + ' after it</button>' : '') + '</div>' : '') +
        '</div>' + pill + '</div>';
    }).join('') : '<p class="hint">Nothing booked yet.</p>');
    document.querySelectorAll('[data-cancel]').forEach(function (btn) {
      btn.onclick = function () {
        var b = MINE.filter(function (x) { return x.key === btn.closest('[data-bk]').dataset.bk; })[0];
        var list = [b].concat(btn.dataset.cancel === 'later' ? MINE.filter(function (x) {
          return x.series && x.series.id === b.series.id && x.day > b.day && (x.status === 'confirmed' || x.status === 'requested'); }) : []);
        if (!confirm(list.length > 1 ? 'Cancel these ' + list.length + ' bookings? The rooms become free for others.' : 'Cancel this booking? The room becomes free for others.')) return;
        cancelMine(list);
      };
    });
  }
  /* One at a time, so one the office has to deal with does not stop the rest. */
  function cancelMine(list) {
    var done = [], stuck = [];
    list.reduce(function (p, b) {
      return p.then(function () { return B.cancelOwn(b).then(function (x) { done.push(x); }, function (e) { stuck.push(b); if (!e.shared) throw e; }); });
    }, Promise.resolve()).then(function () {
      if (!done.length) return;
      var r = roomById(done[0].roomId) || { name: 'A room' }, site = SITES.filter(function (s) { return s.id === done[0].siteId; })[0];
      return Promise.all([B.emailMany(done, r.name, 'cancelled'), B.tellOffice(done, r.name, site, 'cancelled')]);
    }).then(function () {
      toast(stuck.length ? (done.length ? 'Cancelled ' + done.length + '. ' : '') + stuck.length + ' overlap a booking the office made: ask the office to cancel ' + (stuck.length === 1 ? 'it' : 'them') + '.'
        : 'Cancelled, and the room is free again. We have emailed you.');
      return loadMine().then(drawCal);
    }).catch(function (e) { toast('Could not cancel: ' + (e.message || e)); loadMine(); });
  }
  function loadMine() {
    return db().collection('bookings').where('memberUid', '==', ME.uid).get().then(function (s) {
      MINE = s.docs.map(function (d) { return Object.assign({ key: d.id }, d.data()); });
      drawMine();
    });
  }

  /* ---- the booking sheet ---- */
  var PLAN = null;
  function openSheet(o) {
    var rs = siteRooms();
    var sh = document.getElementById('sheet');
    sh.innerHTML = '<h3>Book a room</h3>' +
      /* What kind of booking (F-077): church and ministry kinds are free;
         a charged kind is priced, at the members' rate where there is one. */
      (KINDS.length ? '<div class="bf"><div class="field"><label class="l" for="bt">What kind of booking</label><select id="bt">' +
        KINDS.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + (t.charged ? ' (charged)' : '') + '</option>'; }).join('') + '</select></div></div>' : '') +
      '<div id="f"></div><div id="f-status"></div><div id="quoteBox"></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn sec" id="f-cancel">Close</button><button class="btn" id="f-go" disabled>Book it</button></div>';
    EGBCBookForm.render(document.getElementById('f'), {
      rooms: rs, multi: true, chosen: o.room ? [o.room] : [], day: o.day, start: o.start, end: o.end,
      menus: MENUS, kit: KIT, contact: false, onChange: check
    });
    document.getElementById('back').style.display = 'block';
    document.getElementById('f-cancel').onclick = closeSheet;
    document.getElementById('f-go').onclick = submit;
    var bt = document.getElementById('bt'); if (bt) bt.onchange = function () { check(EGBCBookForm.values(document.getElementById('f'))); };
    check(EGBCBookForm.values(document.getElementById('f')));
  }
  function kind() { var t = document.getElementById('bt'); return KINDS.filter(function (x) { return t && t.value && x.id === t.value; })[0] || null; }
  /* The quote for a charged kind, room by room, at the members' rate. */
  function quoteFor(v, rooms, dates) {
    var t = kind(), box = document.getElementById('quoteBox');
    if (!box) return null;
    if (!t || !t.charged || !dates.length) { box.innerHTML = ''; return null; }
    var out = {}, html = '';
    rooms.forEach(function (r) {
      var k = QT.pick('member', t, r.id, CARDS);
      if (!k || !k.card) { html += '<div class="st wait"><b>' + esc(r.name) + '</b>: the office will tell you the price.</div>'; return; }
      var each = dates.map(function (d) {
        return QT.price({ card: k.card, day: d, start: B.toMin(v.start), end: B.toMin(v.end), setup: v.setup, pack: v.pack, people: v.people,
          items: v.refreshments.needed ? v.refreshments.items : [], kit: v.resources.map(function (x) { var kk = KIT.filter(function (y) { return y.id === x.id; })[0] || {}; return { name: x.name, qty: x.qty, hirePrice: kk.hirePrice || 0 }; }),
          av: v.av, memberPct: k.memberPct, memberList: k.memberList });
      });
      out[r.id] = { each: each, members: k.members };
      var all = each.reduce(function (n, x) { return n + x.total; }, 0);
      html += '<div class="quote" data-quote="' + esc(r.id) + '"><h4>' + esc(r.name) + (dates.length > 1 ? ', ' + esc(EGBCEvents.fmtDate(dates[0] + 'T12:00')) : '') + '</h4>' +
        QT.table(each[0]) + (dates.length > 1 ? '<p style="margin:8px 0 0"><b>' + dates.length + ' dates in all: ' + QT.pounds(all) + '</b></p>' : '') +
        (k.members ? '' : '<p class="hint" style="margin:6px 0 0">There is no members\' rate for this kind of booking, so this is the standard price.</p>') + '</div>';
    });
    box.innerHTML = html + '<p class="hint">' + esc(t.name) + ' is charged, so it waits for the office to confirm the price.</p>';
    return out;
  }
  function closeSheet() { document.getElementById('back').style.display = 'none'; PLAN = null; }

  /* Free or not, and confirmed straight away or waiting, room by room;
     for a repeating booking, date by date as well. */
  var checking = 0;
  function check(v) {
    var go = document.getElementById('f-go'), out = document.getElementById('f-status'), mine = ++checking, form = document.getElementById('f');
    go.disabled = true; PLAN = null;
    var s = B.slots(B.toMin(v.start), B.toMin(v.end), v.setup, v.pack);
    if (!v.rooms.length) { out.innerHTML = '<div class="st wait">Choose a room.</div>'; return; }
    if (!v.day) { out.innerHTML = '<div class="st wait">Choose a date.</div>'; return; }
    if (v.day < B.today()) { out.innerHTML = '<div class="st no">That date has gone.</div>'; return; }
    if (!s) { out.innerHTML = '<div class="st no">The finish has to be after the start, and with setting up and clearing away it has to fit within the day.</div>'; return; }
    if (v.repeat.rule && !v.repeat.until) { out.innerHTML = '<div class="st wait">Choose when it stops repeating.</div>'; return; }
    var rooms = v.rooms.map(roomById), list = v.repeat.rule ? B.repeatDays(v.day, v.repeat.rule, v.repeat.until) : [v.day];
    if (rooms.length * list.length > 100) { out.innerHTML = '<div class="st no">That is more than 100 bookings at once. Choose fewer rooms or an earlier end.</div>'; return; }
    Promise.all(list.map(function (d) { return B.loadDays(rooms, d); })).then(function (all) {
      if (mine !== checking) return;
      var days = {}, report = list.map(function (d, i) {
        var why = '';
        rooms.forEach(function (r) {
          days[r.id + '_' + d] = all[i][r.id];
          if (!why && !B.free(all[i][r.id], s)) {
            var sv = ''; for (var k = s.from; k < s.to && !sv; k++) sv = all[i][r.id][k] ? B.serviceAt(site(), r.id, d, k) : '';
            why = r.name + (sv ? ': ' + sv : ' is booked');
          }
        });
        return { day: d, ok: !why, why: why };
      });
      if (v.repeat.rule) EGBCBookForm.dates(form, report);
      var skip = EGBCBookForm.values(form).skip;
      var chosen = report.filter(function (x) { return x.ok && (!v.repeat.rule || skip.indexOf(x.day) < 0); }).map(function (x) { return x.day; });
      var ok = chosen.length > 0, waits = false, msgs = [];
      if (!v.repeat.rule && !report[0].ok) msgs.push('<div class="st no"><b>' + esc(report[0].why.split(':')[0].replace(/ is booked$/, '')) + '</b> is not free then' +
        (report[0].why.indexOf(':') > 0 ? ' (' + esc(report[0].why.split(': ')[1]) + ')' : '') + '. Pick another time.</div>');
      if (v.repeat.rule) {
        var clash = report.filter(function (x) { return !x.ok; }).length;
        msgs.push('<div class="st ' + (chosen.length ? 'ok' : 'no') + '">' + chosen.length + ' date' + (chosen.length === 1 ? '' : 's') + ' to book' +
          (clash ? '; ' + clash + ' not free, left out' : '') + '.</div>');
      }
      rooms.forEach(function (r) {
        var mode = B.memberMode(r, site()), cap = R.holds(r, v.layout || undefined);
        if (r.fireMax && v.people > r.fireMax) { ok = false; msgs.push('<div class="st no"><b>' + esc(r.name) + '</b> can never hold more than ' + r.fireMax + ' people.</div>'); return; }
        if (!chosen.length) return;
        if (mode === 'approval' || (kind() && kind().charged)) waits = true;
        msgs.push('<div class="st ' + (mode === 'approval' ? 'wait' : 'ok') + '"><b>' + esc(r.name) + '</b> is free' + (v.repeat.rule ? ' on those dates' : '') + '. ' +
          (mode === 'approval' ? 'Bookings here wait for the office to approve.' : 'It will be confirmed straight away.') +
          (cap && v.people > cap ? ' It usually holds ' + cap + ' set out that way.' : '') + '</div>');
      });
      if (!v.title || !(v.people > 0)) { ok = false; msgs.push('<div class="st wait">Say what it is for, and how many people.</div>'); }
      out.innerHTML = msgs.join('');
      if (ok) PLAN = { dates: chosen, days: days, rule: v.repeat.rule, quotes: quoteFor(v, rooms, chosen) };
      else quoteFor(v, rooms, chosen);
      go.disabled = !ok;
      go.textContent = waits ? 'Ask for it' : 'Book it';
    });
  }
  var R = window.EGBCRooms;

  function submit() {
    var v = EGBCBookForm.values(document.getElementById('f')), go = document.getElementById('f-go'), plan = PLAN;
    if (!plan) return;
    go.disabled = true; go.textContent = 'Booking…';
    var group = v.rooms.length > 1 ? 'g_' + EGBCEvents.key(12) : '', sid = plan.rule ? 's_' + EGBCEvents.key(12) : '', list = [];
    try {
      v.rooms.forEach(function (id) {
        plan.dates.forEach(function (d, i) {
          list.push({ booking: B.prepare({ kind: 'member', room: roomById(id), site: site(), day: d, start: v.start, end: v.end, setup: v.setup, pack: v.pack,
            title: v.title, people: v.people, layout: v.layout, av: v.av, refreshments: v.refreshments, resources: v.resources, notes: v.notes, groupId: group,
            series: sid ? { id: sid, rule: plan.rule, n: i + 1, of: plan.dates.length } : null }) });
          /* The kind, and for a charged one: it waits, at the members' rate. */
          var b = list[list.length - 1].booking, t = kind();
          if (t) {
            b.bookingType = t.id;
            if (t.charged) {
              b.status = 'requested';
              var qq = plan.quotes && plan.quotes[id], qt = qq && qq.each[i];
              b.memberRate = !!(qq && qq.members);
              if (qt) b.quote = { lines: qt.lines, subtotal: qt.subtotal, vat: qt.vat, vatRate: qt.vatRate, total: qt.total, deposit: qt.deposit, damageDeposit: qt.damageDeposit, by: 'price list' };
            }
          }
        });
      });
    } catch (e) { toast(e.message); go.disabled = false; return; }
    B.write(list, plan.days).then(function (made) {
      /* One email per room: every date in it, and one calendar file. */
      return Promise.all(v.rooms.map(function (id) {
        var these = made.filter(function (b) { return b.roomId === id; }), name = roomById(id).name;
        return these[0].status === 'confirmed' ? B.emailMany(these, name, 'confirmed')
          : Promise.all([B.emailMany(these, name, 'waiting'), B.tellOffice(these, name, site())]);
      })).then(function () { return made; });
    }).then(function (made) {
      var waits = made.some(function (b) { return b.status !== 'confirmed'; });
      document.getElementById('sheet').innerHTML = '<h3>' + (waits ? 'Asked' : 'Booked') + '</h3>' + made.map(function (b) {
        return '<div class="st ' + (b.status === 'confirmed' ? 'ok' : 'wait') + '" data-made="' + esc(b.status) + '"><b>' + esc(roomById(b.roomId).name) + '</b>, ' + esc(B.when(b)) + ': ' +
          (b.status === 'confirmed' ? 'confirmed.' : 'waiting for the office to approve.') + ' Reference ' + esc(B.ref(b)) + '.</div>';
      }).join('') + '<p class="hint">' + (waits ? 'We have emailed you, and will email again when the office decides.' : 'We have emailed you the details, with a calendar file.') + '</p>' +
        '<div style="text-align:right"><button class="btn" id="f-done">Done</button></div>';
      document.getElementById('f-done').onclick = closeSheet;
      return loadMine().then(drawCal);
    }).catch(function (e) {
      var denied = /permission|PERMISSION_DENIED/i.test(String(e && (e.code || e.message)));
      toast(denied ? 'Someone has just booked some of that time. Look again.' : 'Could not book: ' + (e.message || e));
      go.disabled = false; go.textContent = 'Book it';
      check(EGBCBookForm.values(document.getElementById('f')));
      drawCal();
    });
  }

  EGBCAuth.require().then(function (profile) {
    ME = EGBCAuth.user();
    return Promise.all([
      db().collection('sites').where('active', '==', true).get(),
      db().collection('rooms').where('active', '==', true).get(),
      db().collection('menus').where('active', '==', true).get().catch(function () { return { docs: [] }; }),
      db().collection('bookableResources').get().catch(function () { return { docs: [] }; }),
      db().collection('bookingSettings').get().catch(function () { return { docs: [] }; }),
      db().collection('bookingTypes').where('active', '==', true).get().catch(function () { return { docs: [] }; }),
      db().collection('rateCards').get().catch(function () { return { docs: [] }; })
    ]).then(function (r) {
      var all = function (s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); };
      SITES = all(r[0]).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      ROOMS = all(r[1]).filter(function (x) { return x.kind !== 'online' && x.bookableByMembers !== false; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      MENUS = all(r[2]).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      KIT = all(r[3]).filter(function (k) { return k.active !== false; });
      KINDS = all(r[5]).sort(function (a, b) { return (a.charged ? 1 : 0) - (b.charged ? 1 : 0) || (a.order || 0) - (b.order || 0); });
      all(r[6]).forEach(function (c) { CARDS[c.id] = c; });
      /* Church and ministry use is always there, and free, first. */
      if (KINDS.length && !KINDS.some(function (t) { return !t.charged; })) KINDS.unshift({ id: '', name: 'Church or ministry use', charged: false });
      SITES = SITES.filter(function (s) { return ROOMS.some(function (x) { return x.siteId === s.id; }); });
      V.site = SITES[0] ? SITES[0].id : '';
      var mid = (profile && profile.memberId) || '-';
      var office = EGBCAuth.isAdmin() || all(r[4]).some(function (s) { return (s.bookingsAdmins || []).indexOf(mid) >= 0; });
      if (office) document.getElementById('office').innerHTML = 'You look after bookings: <a href="bookings-admin.html" style="color:var(--brand)">open Room bookings</a> to approve, move or cancel any booking.';
      if (!SITES.length) { document.getElementById('cal').innerHTML = '<p class="hint">No rooms can be booked yet.</p>'; return; }
      drawCal();
      return loadMine();
    });
  }).catch(function (e) { document.getElementById('cal').innerHTML = '<p class="hint">' + esc(e.message || e) + '</p>'; });
})();
</script>
</body>
</html>
