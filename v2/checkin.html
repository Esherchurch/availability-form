<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in</title>

<script src="egbc-nosend.js?v=202610212000"></script>
<script src="egbc-shell.js?v=202610221200" data-title="Check-in"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610212000"></script>
<script src="egbc-church.js?v=202610192330"></script>
<script src="egbc-guard.js?v=202610221200"></script>
<script src="egbc-ics.js?v=202610091200"></script>
<script src="egbc-events.js?v=202610221300"></script>
<script src="egbc-events-checkin.js?v=202610152300"></script>
<script src="egbc-labels.js?v=202610142300"></script>
<script src="egbc-events-safeguarding.js?v=202610161700"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 12px;padding-bottom:12px;
           border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .badge{width:32px;height:32px;border-radius:8px;background:var(--tint);color:var(--brand);
         display:inline-flex;align-items:center;justify-content:center;flex:none}
  .spacer{flex:1}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;
       font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  .inp:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .field{margin-bottom:14px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--body);margin-bottom:10px;font-weight:400}
  .check input{width:16px;height:16px;accent-color:var(--brand);flex:none}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
       border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent;
       background:var(--brand);color:#fff;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.sec:hover{background:#f3f4f6}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:#f3f4f6}
  .btn.sm{height:32px;padding:0 11px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--card)}
  .tile .v{font-size:24px;font-weight:700;color:var(--ink);line-height:1.2}
  .tile .k{font-size:12px;color:var(--muted)}
  .tile.in .v{color:var(--ok)}
  @media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}

  .row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .row .ib{width:36px;height:36px;border-radius:8px;background:var(--tint);color:var(--brand);
           display:flex;align-items:center;justify-content:center;flex:none}
  .row .ib.in{background:var(--ok-bg);color:var(--ok)}
  .row .ib.out{background:#f3f4f6;color:var(--muted)}
  .row .who{flex:1;min-width:0}
  .row .n{font-size:14px;font-weight:600;color:var(--ink)}
  .row .m{font-size:13px;color:var(--muted)}
  .flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:6px;padding:1px 7px;margin-left:6px;
        border:none;cursor:pointer;font-family:Inter,sans-serif}
  .flag.warn{background:var(--danger-bg);color:var(--danger)}
  .flag.info{background:var(--tint);color:var(--brand);cursor:default}
  .flagtext{font-size:13px;color:var(--danger);background:var(--danger-bg);border-radius:8px;padding:6px 9px;margin-top:6px}

  .banner{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:14px}
  .banner.warn{background:var(--danger-bg);color:var(--danger)}
  .banner.ok{background:var(--ok-bg);color:var(--ok)}
  .banner.gold{background:var(--gold-bg);color:var(--gold)}
  .banner.info{background:var(--tint);color:var(--body);border:1px solid #cfe0de}
  .hint{font-size:13px;color:var(--muted)}

  #scanBox{display:none}
  #scanBox video{width:100%;max-height:360px;border-radius:10px;background:#000;object-fit:cover}
  #scanResult{margin-top:10px}

  .modal-back{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-start;justify-content:center;
              padding:40px 12px;z-index:80;overflow:auto}
  .modal{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .modal h3{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;
         padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none;max-width:90vw}
  .room{margin-bottom:16px}
  .room h4{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 4px;display:flex;gap:8px;align-items:center}
  /* Name labels (F-185): built off screen, printed on the church's label size. */
  #nlabels{display:none}
  .nlabel{width:260px;border:1px solid var(--ink);border-radius:8px;padding:10px 12px;background:#fff}
  .nlabel .nl-n{font-size:22px;font-weight:700;color:#111;line-height:1.15;overflow-wrap:anywhere}
  .nlabel .nl-e{font-size:13px;color:#374151}
  @media print{
    body.print-labels > *:not(#nlabels){display:none !important}
    body.print-labels #nlabels{display:flex;flex-wrap:wrap;gap:8px}
    .noprint,#egbc-shell,.egbc-bar{display:none !important}
    body{background:#fff}
    .card{box-shadow:none;border:none;padding:0}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card hint">Loading…</div></div>

<div class="modal-back" id="mBack"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, C = window.EGBCCheckin, esc = E.esc;
  var params = new URLSearchParams(location.search);
  var EVID = params.get('event') || '';
  var VIEW = params.get('view') || '';
  var EV = null, QS = [], SIGNUPS = [], CHECKINS = [], SETTINGS = {}, LOOK = { sites: {}, rooms: {}, venues: {} };
  /* Pay on the day (F-183): the ticket types, and who has paid. */
  var TT = [], PAYS = {};
  var ROWS = [], FILTER = '', OPEN_FLAGS = {}, SCANNING = false, STREAM = null, LAST = { code: '', at: 0 }, SCANMSG = '';
  /* Stage 3: event leaders who are not admins use this page too, and the
     children's consent forms add collectors and medical flags. */
  var SG = window.EGBCSafeguarding, ADMIN = false, FORMINFO = { children: {} };
  var LEADS = false;   /* leads this event (eventLeaders) */

  function db() { return EGBCAuth.db; }
  function icons() { if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons(); }
  function toast(m) {
    var t = document.getElementById('toast');
    t.textContent = m; t.style.display = 'block';
    clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3200);
  }
  function time(iso) { return iso ? E.fmtTime(iso) : ''; }
  function ico(name, px) { return '<i data-lucide="' + name + '" style="width:' + (px || 16) + 'px;height:' + (px || 16) + 'px"></i>'; }

  /* ---------- choosing an event (no ?event=) ---------- */

  function pickEvent() {
    var from = Date.now() - 12 * 3600 * 1000;
    E.listUpcoming({ from: from, limit: 60 }).then(function (list) {
      var soon = list.filter(function (e) { return e.status !== 'cancelled' && e.startUtc < Date.now() + 8 * 24 * 3600 * 1000; });
      /* The events this person runs (F-212: master admins, the event's
         team) or leads; not every event because they are an admin. */
      if (EGBCAuth.isMaster && EGBCAuth.isMaster()) return soon;
      var uid = E.myUid() || '-';   /* view as: nobody's leader */
      return Promise.all(soon.map(function (e) { return SG.leadersOf(e.id); })).then(function (ls) {
        return soon.filter(function (e, i) { return E.runsEvent(e) || (ls[i] && (ls[i].leaderUids || []).indexOf(uid) >= 0); });
      });
    }).then(function (soon) {
      document.getElementById('wrap').innerHTML =
        '<h1>Check-in</h1><p class="sub">Choose the event you are checking people in to.' + (ADMIN ? '' : ' These are the events you lead.') + '</p>' +
        (ADMIN ? '<div class="bar"><a class="btn sec" href="checkin.html?view=rollcall">' + ico('siren', 15) + 'Roll-call: who is in now</a></div>' : '') +
        '<div class="card"><h2><span class="badge">' + ico('calendar-days', 17) + '</span>Today and this week</h2>' +
        (soon.length ? soon.map(function (e) {
          return '<div class="row"><span class="ib">' + ico('calendar', 17) + '</span>' +
            '<span class="who"><span class="n">' + esc(e.title) + '</span><br><span class="m">' + esc(E.fmtWhen(e)) + '</span></span>' +
            '<a class="btn sm" href="checkin.html?event=' + encodeURIComponent(e.id) + '">Open</a></div>';
        }).join('') : '<p class="hint">Nothing in the next week.</p>') + '</div>';
      icons();
    });
  }

  /* ---------- one event ---------- */

  function rebuild() {
    ROWS = C.people(EVID, SIGNUPS, QS, SETTINGS);
    /* Walk-ins on an event with no sign-ups have no booking to come from;
       they are only a check-in, so they are added from there. */
    var known = {};
    ROWS.forEach(function (r) { known[r.id] = 1; });
    CHECKINS.forEach(function (c) {
      if (c.kind === 'walkin' && !known[c.id]) {
        ROWS.push({ id: c.id, signupKey: c.signupKey, index: c.attendeeIndex || 0, name: c.name, bookedBy: 'Walk-in',
                    walkIn: true, collectors: [], flags: [], kind: 'walkin' });
      }
    });
    ROWS.forEach(function (r) {
      var fi = FORMINFO.children[SG.norm(r.name)];
      if (!fi) return;
      r.formDone = true;
      r.collectors = (r.collectors || []).concat(fi.collectors).filter(function (n, i, a) { return a.indexOf(n) === i; });
      r.flags = (r.flags || []).concat(fi.flags);
      /* Medical answers exist but this person may not read them: say so,
         rather than show a child as having nothing to know. */
      if (fi.medicalHeld && !fi.medicalVisible) {
        r.flags.push({ label: 'Medical details', value: 'Held on their consent form. This event\'s leaders and the safeguarding lead can see them.' });
      }
    });
    ROWS.sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  function ckFor(id) { return CHECKINS.filter(function (c) { return c.id === id; })[0] || null; }

  function draw() {
    var hc = C.headcount(ROWS, CHECKINS);
    var leaders = CHECKINS.filter(function (c) { return c.kind === 'leader'; });
    var where = E.locationText(EV, LOOK);
    var wrap = document.getElementById('wrap');
    var scrollY = window.scrollY;
    var keepSearch = document.activeElement && document.activeElement.id === 'search';

    var html =
      '<div class="noprint">' +
      '<h1>' + esc(EV.title) + '</h1>' +
      '<p class="sub">' + esc(E.fmtWhen(EV)) + (where ? ' · ' + esc(where) : '') + '</p>' +
      (navigator.onLine ? '' : '<div class="banner gold">No signal. Check-ins are kept on this device and sent when the signal comes back. Keep this page open.</div>') +
      (EV.status === 'cancelled' ? '<div class="banner warn">This event is cancelled.</div>' : '') +
      '<div class="tiles" id="tiles">' +
        tile('in', hc.inNow, 'In now') + tile('', hc.expected, 'Expected') +
        tile('', hc.notArrived, 'Not yet arrived') + tile('', hc.out, 'Checked out') +
      '</div>' +
      '<div class="bar">' +
        '<button class="btn" id="scan">' + ico('scan-line', 16) + (SCANNING ? 'Stop scanning' : 'Scan a code') + '</button>' +
        '<button class="btn sec" id="walk">' + ico('user-plus', 15) + 'Walk-in</button>' +
        '<button class="btn sec" id="lead">' + ico('badge-check', 15) + 'Leader</button>' +
        '<button class="btn sec" id="nameLabels">' + ico('tag', 15) + 'Name labels</button>' +
        '<span class="spacer"></span>' +
        (ADMIN ? '<button class="btn ghost sm" id="sett" title="Check-in settings">' + ico('settings', 16) + '</button>' : '') +
      '</div>' +
      '<div class="card" id="scanBox"' + (SCANNING ? ' style="display:block"' : '') + '>' +
        '<video id="vid" playsinline muted></video><div id="scanResult">' + SCANMSG + '</div>' +
      '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h2><span class="badge">' + ico('users', 17) + '</span>People<span class="spacer"></span>' +
        '<span class="hint">' + hc.walkIns + ' walk-in' + (hc.walkIns === 1 ? '' : 's') + '</span></h2>' +
        '<div class="field noprint"><label for="search">Find by name</label><input class="inp" id="search" value="' + esc(FILTER) + '" placeholder="Start typing a name" autocomplete="off"></div>' +
        '<div id="people">' + peopleRows() + '</div>' +
      '</div>' +
      '<div class="card"><h2><span class="badge">' + ico('badge-check', 17) + '</span>Leaders here<span class="spacer"></span>' +
        '<span class="hint">' + hc.leadersIn + ' in</span></h2>' +
        (leaders.length ? leaders.map(function (c) {
          return '<div class="row"><span class="ib ' + (c.state === 'in' ? 'in' : 'out') + '">' + ico('badge-check', 16) + '</span>' +
            '<span class="who"><span class="n">' + esc(c.name) + '</span><br><span class="m">' +
            (c.state === 'in' ? 'In since ' + time(c.inAt) : 'Left at ' + time(c.outAt)) + '</span></span>' +
            '<button class="btn sm ' + (c.state === 'in' ? 'sec' : '') + ' lact" data-id="' + esc(c.id) + '">' +
            (c.state === 'in' ? 'Check out' : 'Back in') + '</button></div>';
        }).join('') : '<p class="hint">No leaders checked in yet. Leaders are counted here, not in the headcount above.</p>') +
      '</div>' +
      '<div class="bar noprint">' +
        '<a class="btn ghost" href="attendance.html?event=' + encodeURIComponent(EVID) + '">' + ico('file-down', 15) + 'Registers and downloads</a>' +
        (ADMIN ? '<a class="btn ghost" href="checkin.html?view=rollcall">' + ico('siren', 15) + 'Roll-call</a>' : '') +
        '<a class="btn ghost" href="safeguarding.html?event=' + encodeURIComponent(EVID) + '">' + ico('shield-check', 15) + 'Safeguarding</a>' +
        '<a class="btn ghost" href="events-admin.html">' + ico('calendar-days', 15) + 'Events</a>' +
      '</div>';

    var video = document.getElementById('vid');
    if (video && SCANNING) {
      /* The camera keeps running across redraws: move the live element in
         rather than starting it again. */
      wrap.innerHTML = html;
      var nv = document.getElementById('vid');
      nv.parentNode.replaceChild(video, nv);
      /* Taking a video out of the page pauses it. */
      video.play().catch(function () {});
    } else {
      wrap.innerHTML = html;
    }
    wire();
    icons();
    window.scrollTo(0, scrollY);
    if (keepSearch) { var s = document.getElementById('search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  }

  function tile(cls, v, k) { return '<div class="tile ' + cls + '"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }

  function peopleRows() {
    var f = FILTER.trim().toLowerCase();
    var rows = ROWS.filter(function (r) {
      return !f || r.name.toLowerCase().indexOf(f) >= 0 || (r.bookedBy || '').toLowerCase().indexOf(f) >= 0;
    });
    if (!rows.length) return '<p class="hint">' + (ROWS.length ? 'Nobody by that name.' : 'Nobody has signed up yet. Walk-ins can be added.') + '</p>';
    return rows.map(function (r) {
      var c = ckFor(r.id);
      var state = c ? c.state : '';
      var line = state === 'in' ? 'In since ' + time(c.inAt) + (c.inByName ? ' · ' + esc(c.inByName) : '')
        : state === 'out' ? 'Left ' + time(c.outAt) + (c.collectedBy ? ' with ' + esc(c.collectedBy) : '') +
            (c.collectedBy && !c.collectorListed ? ' (not on the list)' : '')
        : (r.attended ? 'Marked as came in Events · ' : '') + (r.bookedBy && r.bookedBy !== r.name ? 'Booked by ' + esc(r.bookedBy) : (r.walkIn ? 'Walk-in' : 'Not here yet'));
      var flags = (r.flags || []).length
        ? '<button class="flag warn" data-flag="' + esc(r.id) + '" title="Show the detail">' + ico('triangle-alert', 12) + 'Medical</button>' : '';
      return '<div class="row" data-row="' + esc(r.id) + '">' +
        '<span class="ib ' + (state === 'in' ? 'in' : state === 'out' ? 'out' : '') + '">' + ico(state === 'in' ? 'check' : state === 'out' ? 'log-out' : 'user', 16) + '</span>' +
        '<span class="who"><span class="n">' + esc(r.name) + '</span>' + flags +
          (r.walkIn ? '<span class="flag info">Walk-in</span>' : '') + payFlag(r) + '<br>' +
          '<span class="m">' + line + '</span>' +
          (OPEN_FLAGS[r.id] ? r.flags.map(function (fl) { return '<div class="flagtext"><strong>' + esc(fl.label) + ':</strong> ' + esc(fl.value) + '</div>'; }).join('') : '') +
        '</span>' +
        (state === 'in' ? '<button class="btn sec sm act" data-id="' + esc(r.id) + '">Check out</button>'
          : state === 'out' ? '<button class="btn ghost sm act" data-id="' + esc(r.id) + '">Back in</button>'
          : '<button class="btn sm act" data-id="' + esc(r.id) + '">Check in</button>') +
      '</div>';
    }).join('');
  }

  /* Once per booking, on its first person: what is owed, or that it is paid. */
  function dueOf(r) {
    if (!r.signupKey || r.index) return 0;
    var su = SIGNUPS.filter(function (s) { return s.key === r.signupKey; })[0];
    return su ? E.toPay(su, TT) : 0;
  }
  function payFlag(r) {
    var due = dueOf(r); if (!due) return '';
    var p = PAYS[r.signupKey];
    return p && p.paid
      ? '<button class="flag info pay" data-pay="' + esc(r.signupKey) + '" title="Change">' + ico('check', 12) + 'Paid ' + E.money(p.amount) + '</button>'
      : '<button class="flag warn pay" data-pay="' + esc(r.signupKey) + '">' + ico('banknote', 12) + E.money(due) + ' to pay</button>';
  }
  function payModal(key) {
    var r = ROWS.filter(function (x) { return x.signupKey === key && !x.index; })[0]; if (!r) return;
    var due = dueOf(r), p = PAYS[key] || {};
    modal('<h3>' + ico('banknote', 18) + esc(r.bookedBy || r.name) + ': ' + E.money(due) + '</h3>' +
      '<label>How was it paid?</label>' + [['cash', 'Cash'], ['card', 'Card'], ['bank', 'Bank transfer'], ['other', 'Other']].map(function (m, i) {
        return '<label class="radio" style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="radio" name="payHow" value="' + m[0] + '"' + ((p.method || 'cash') === m[0] ? ' checked' : '') + '>' + m[1] + '</label>';
      }).join('') +
      '<div class="foot">' + (p.paid ? '<button class="btn ghost" id="payNo">Not paid after all</button>' : '<button class="btn sec" data-close>Cancel</button>') +
      '<button class="btn" id="payGo">Paid ' + E.money(due) + '</button></div>');
    function save(paid) {
      var how = (document.querySelector('input[name="payHow"]:checked') || {}).value || '';
      var u = EGBCAuth.user() || {}, pr = EGBCAuth.profile() || {};
      return db().collection('signupPayments').doc(key).set({ calEventId: EVID, paid: paid, amount: paid ? due : 0, method: paid ? how : '',
        by: u.uid || '', byName: String(pr.name || '').slice(0, 120), at: firebase.firestore.FieldValue.serverTimestamp() })
        .then(function () { closeModal(); toast(paid ? 'Paid ' + E.money(due) + '.' : 'Marked not paid.'); }, fail('save the payment'));
    }
    document.getElementById('payGo').onclick = function () { save(true); };
    if (document.getElementById('payNo')) document.getElementById('payNo').onclick = function () { save(false); };
  }

  function redrawPeople() {
    var p = document.getElementById('people');
    if (!p) return;
    p.innerHTML = peopleRows();
    wirePeople(); icons();
  }

  function wire() {
    document.getElementById('scan').onclick = function () { SCANNING ? stopScan() : startScan(); };
    document.getElementById('walk').onclick = function () { walkInModal('walkin'); };
    document.getElementById('lead').onclick = function () { walkInModal('leader'); };
    document.getElementById('nameLabels').onclick = labelsModal;

  /* ---------- scanning ----------
     The phone's own camera, in the page: nothing to install. Chrome on
     Android reads QR codes itself (BarcodeDetector); everywhere else,
     including iPhones, jsQR reads the frames. */

  var detector = null, jsqrLoading = null;
  function loadJsQR() {
    if (window.jsQR) return Promise.resolve();
    if (jsqrLoading) return jsqrLoading;
    jsqrLoading = new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
      s.onload = res; s.onerror = function () { rej(new Error('The code reader could not load.')); };
      document.head.appendChild(s);
    });
    return jsqrLoading;
  }

  function startScan() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast('This browser cannot use the camera here. Search by name instead.'); return;
    }
    var ready = ('BarcodeDetector' in window)
      ? window.BarcodeDetector.getSupportedFormats().then(function (f) {
          if (f.indexOf('qr_code') >= 0) detector = new window.BarcodeDetector({ formats: ['qr_code'] });
          else return loadJsQR();
        }).catch(loadJsQR)
      : loadJsQR();
    ready.then(function () {
      return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    }).then(function (stream) {
      STREAM = stream; SCANNING = true; draw();
      var v = document.getElementById('vid');
      v.srcObject = stream;
      return v.play();
    }).then(loop).catch(function (e) {
      SCANNING = false; draw();
      toast('The camera could not start: ' + (e.message || e) + '. Search by name instead.');
    });
  }

  function stopScan() {
    SCANNING = false;
    if (STREAM) STREAM.getTracks().forEach(function (t) { t.stop(); });
    STREAM = null;
    draw();
  }

  var canvas = document.createElement('canvas');
  function loop() {
    if (!SCANNING) return;
    var v = document.getElementById('vid');
    if (!v || v.readyState < 2) { setTimeout(loop, 200); return; }
    var read;
    if (detector) {
      read = detector.detect(v).then(function (codes) { return codes.length ? codes[0].rawValue : null; });
    } else {
      var w = v.videoWidth, h = v.videoHeight, scale = Math.min(1, 800 / Math.max(w, h));
      canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
      var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var r = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      read = Promise.resolve(r ? r.data : null);
    }
    read.then(function (text) {
      if (text) handleCode(text);
      setTimeout(loop, 250);
    }).catch(function () { setTimeout(loop, 400); });
  }

  /* Also the way in for a hand-held scanner that types the code and
     presses Enter into the search box. */
  function handleCode(text) {
    var now = Date.now();
    if (text === LAST.code && now - LAST.at < 4000) return;
    LAST = { code: text, at: now };
    var p = C.parseCode(text);
    var out = document.getElementById('scanResult');
    function say(cls, html) {
      SCANMSG = '<div class="banner ' + cls + '">' + html + '</div>';
      if (out) out.innerHTML = SCANMSG; else toast(html.replace(/<[^>]+>/g, ''));
    }
    if (!p) { say('warn', 'That is not an EGBC check-in code.'); return; }
    if (p.calEventId !== EVID) { say('warn', 'That code is for a different event.'); return; }
    var r = ROWS.filter(function (x) { return x.signupKey.slice(0, C.KEY_PART) === p.keyPart && x.index === p.index; })[0];
    if (!r) { say('warn', 'That booking is not on the list. It may have been cancelled.'); return; }
    var c = ckFor(r.id);
    var flag = (r.flags || []).length ? ' <span class="flag warn">Medical</span>' : '';
    if (c && c.state === 'in') { say('gold', '<strong>' + esc(r.name) + '</strong> is already in, since ' + time(c.inAt) + (c.inByName ? ' (' + esc(c.inByName) + ')' : '') + '.' + flag); return; }
    C.checkIn(EV, r, c).catch(fail('check in ' + r.name));
    say('ok', '<strong>' + esc(r.name) + '</strong> is in.' + flag);
  }
  window.__egbcHandleCode = handleCode;

  /* ---------- roll-call ---------- */

  /* Who may open the roll-call, and for which buildings:
     { all: true } or { sites: [siteId] }, or null. */
  function mayRollCall() {
    if (EGBCAuth.isMaster && EGBCAuth.isMaster()) return Promise.resolve({ all: true });
    var mid = E.asSeen().memberId || '';
    if (!mid) return Promise.resolve(null);
    return db().collection('fireRollCall').doc('main').get().then(function (s) {
      if (!s.exists) return null;
      var f = s.data() || {};
      if ((f.allSites || []).indexOf(mid) >= 0) return { all: true };
      var sites = Object.keys(f.bySite || {}).filter(function (k) { return (f.bySite[k] || []).indexOf(mid) >= 0; });
      return sites.length ? { sites: sites } : null;
    }, function () { return null; });
  }
  function rollCall(who) {
    who = who || { all: true };
    var lookups = E.lookups();
    var evCache = {};
    /* CHILDREN, AS NUMBERS (F-216; Martin, 15 Oct): kidsCounts/<site>__<day>,
       each group and how many, kept by the kidsCountsKeep function. No
       names: those stay with the Kids Church leaders. Master admins also
       see them below by name; the total takes a building's count where
       there is one and its names where there is not, never both. */
    var KC = {}, LAST = [];
    /* PERSONAL EVACUATION PLANS (Stage 4, F-234; Martin, 19 Oct): today's
       only, for the people in today (checked in, or on the rota), kept by
       the peeps.js function in peepToday/<day>. The rules let only the fire
       wardens, the duty stewards on duty today and master admins read it;
       anyone else gets nothing and sees no card. Opening a plan is logged.
       And each building's GEEP, for visitors who need help. */
    var PEEP = null, PEEPS = {}, GEEPS = [];
    function peepCard(look) {
      var es = (PEEP && PEEP.entries) || [];
      var g = GEEPS.filter(function (x) { return who.all || (who.sites || []).indexOf(x.siteId) >= 0; });
      return (es.length ? '<div class="card room" id="peeps"><h2><span class="badge">' + ico('accessibility', 17) + '</span>People who need help to get out<span class="spacer"></span><span class="hint">' + es.length + '</span></h2>' +
        '<p class="hint" style="margin-top:-4px">Their own plans, for today only. Do not copy or share them.</p>' +
        es.map(function (e) {
          return '<details class="peep" data-peep="' + esc(e.memberId) + '" style="border-top:1px solid var(--line);padding:8px 0"><summary style="min-height:44px;cursor:pointer"><strong>' + esc(e.name) + '</strong> <span class="hint">' + esc(e.why) + (e.building ? ', ' + esc(e.building) : '') + '</span></summary>' +
            '<p style="margin:4px 0"><strong>Help needed:</strong> ' + esc(e.needs) + '</p>' + (e.helpers ? '<p style="margin:4px 0"><strong>Who helps:</strong> ' + esc(e.helpers) + '</p>' : '') +
            (e.route ? '<p style="margin:4px 0"><strong>Where:</strong> ' + esc(e.route) + '</p>' : '') + (e.equipment ? '<p style="margin:4px 0"><strong>Equipment:</strong> ' + esc(e.equipment) + '</p>' : '') +
            (e.enteredByName ? '<p class="hint" style="margin:4px 0">Entered by ' + esc(e.enteredByName) + ' with their agreement.</p>' : '') + '</details>';
        }).join('') + '</div>' : '') +
        g.map(function (x) {
          var site = (look.sites && look.sites[x.siteId]) || '';
          return '<div class="card room" data-geep="' + esc(x.siteId) + '"><h2><span class="badge">' + ico('door-open', 17) + '</span>Visitors who need help' + (site ? ': ' + esc(site) : '') + '</h2>' +
            (x.identify ? '<p style="margin:4px 0"><strong>Finding them:</strong> ' + esc(x.identify) + '</p>' : '') + (x.refuges ? '<p style="margin:4px 0"><strong>Where they wait:</strong> ' + esc(x.refuges) + '</p>' : '') +
            (x.helpers ? '<p style="margin:4px 0"><strong>Who helps:</strong> ' + esc(x.helpers) + '</p>' : '') + (x.equipment ? '<p style="margin:4px 0"><strong>Equipment:</strong> ' + esc(x.equipment) + '</p>' : '') + '</div>';
        }).join('');
    }
    function wirePeeps() {
      document.querySelectorAll('[data-peep]').forEach(function (d) {
        d.addEventListener('toggle', function () {
          if (!d.open || d._logged) return; d._logged = true;
          db().collection('peepLog').doc().set({ what: 'view', memberId: d.getAttribute('data-peep'), by: EGBCAuth.user().uid, byName: (EGBCAuth.profile() || {}).name || '', at: new Date().toISOString() }).catch(function () {});
        });
      });
    }
    /* One list per building (Martin, 19 Oct): a warden or steward for one
       building reads that building's only; the rules refuse the others. */
    var peepDay = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    lookups.then(function (look) {
      var ids = who.all ? Object.keys(look.sites || {}) : (who.sites || []);
      ids.forEach(function (sid) {
        db().collection('peepToday').doc(peepDay + '__' + sid).onSnapshot(function (d) {
          if (d.exists) PEEPS[sid] = d.data(); else delete PEEPS[sid];
          PEEP = { entries: [].concat.apply([], Object.keys(PEEPS).map(function (k) { return PEEPS[k].entries || []; })) };
          render(LAST);
        }, function () { delete PEEPS[sid]; });
      });
    });
    db().collection('geeps').get().then(function (q) { GEEPS = q.docs.map(function (d) { return Object.assign({ siteId: d.id }, d.data()); }); render(LAST); }, function () {});
    function render(cks) {
      LAST = cks;
      var ins = cks.filter(function (c) { return c.state === 'in'; });
      var need = ins.filter(function (c) { return c.kind !== 'child'; }).map(function (c) { return c.calEventId; }).filter(function (id, i, a) { return a.indexOf(id) === i && !evCache[id]; });
      return Promise.all(need.map(function (id) {
        return db().collection('calEvents').doc(id).get().then(function (s) { evCache[id] = s.exists ? s.data() : { title: 'Event' }; })
          .catch(function () { evCache[id] = { title: 'Event' }; });
      })).then(function () { return lookups; }).then(function (look) {
        var groups = {};
        ins.forEach(function (c) {
          var ev = c.kind === 'child' ? { title: 'Sunday children\'s groups' } : (evCache[c.calEventId] || {});
          var place = c.roomId && look.rooms[c.roomId] ? look.rooms[c.roomId] : (E.locationText(ev, look) || 'Somewhere else');
          (groups[place] = groups[place] || { people: [], leaders: [], events: {} });
          groups[place][c.kind === 'leader' ? 'leaders' : 'people'].push(c);
          groups[place].events[ev.title || 'Event'] = 1;
        });
        var names = Object.keys(groups).sort();
        var total = ins.filter(function (c) { return c.kind !== 'leader'; }).length;
        var leaders = ins.length - total;
        var kc = Object.keys(KC).map(function (k) { return KC[k]; }).filter(function (c) { return c && c.total > 0; })
          .sort(function (a, b) { return String(a.siteId).localeCompare(String(b.siteId)); });
        var counted = {};
        Object.keys(KC).forEach(function (k) { if (KC[k]) counted[KC[k].siteId] = 1; });
        total = ins.filter(function (c) { return c.kind !== 'leader' && !(c.kind === 'child' && counted[c.siteId]); }).length +
          kc.reduce(function (t, c) { return t + (c.total || 0); }, 0);
        var kidsCards = kc.map(function (c) {
          var site = (look.sites && look.sites[c.siteId]) || '';
          return '<div class="card room" data-kids-count="' + esc(c.siteId) + '"><h2><span class="badge">' + ico('baby', 17) + '</span>Children in Sunday groups' + (site ? ': ' + esc(site) : '') +
            '<span class="spacer"></span><span class="hint">' + c.total + '</span></h2>' +
            '<p class="kidsline" style="font-size:17px;font-weight:600;margin:4px 0">' + (c.groups || []).map(function (g) { return esc(g.name) + ' ' + (+g.n || 0); }).join(' \u00b7 ') + ' \u00b7 total ' + c.total + '</p>' +
            '<p class="hint">Numbers only. The Kids Church leaders have the names.</p></div>';
        }).join('');
        var where = who.all ? '' : who.sites.map(function (sid) { return (look.sites && look.sites[sid]) || 'your building'; }).join(', ');
        document.getElementById('wrap').innerHTML =
          '<h1>Fire roll-call</h1><p class="sub">' + (where ? esc(where) + ': e' : 'E') + 'veryone checked in today and not yet checked out. ' +
          'Updated live · ' + E.fmtTime(new Date()) + '</p>' +
          '<div class="tiles" style="grid-template-columns:repeat(2,1fr)">' + tile('in', total, 'People in the building') + tile('', leaders, 'Leaders') + '</div>' +
          '<div class="bar noprint"><button class="btn sec" onclick="window.print()">' + ico('printer', 15) + 'Print</button>' +
          '<a class="btn ghost" href="checkin.html">' + ico('arrow-left', 15) + 'Check-in</a></div>' + peepCard(look) + kidsCards +
          (names.length ? names.map(function (n) {
            var g = groups[n];
            var list = function (arr) {
              return arr.sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (c) {
                return '<div class="row"><span class="ib in">' + ico(c.kind === 'leader' ? 'badge-check' : 'user', 15) + '</span>' +
                  '<span class="who"><span class="n">' + esc(c.name) + '</span><br><span class="m">In since ' + time(c.inAt) + '</span></span>' +
                  '<span class="noprint" style="font-size:20px;color:var(--faint)">' + ico('square', 20) + '</span></div>';
              }).join('');
            };
            return '<div class="card room"><h2><span class="badge">' + ico('door-open', 17) + '</span>' + esc(n) +
              '<span class="spacer"></span><span class="hint">' + g.people.length + ' + ' + g.leaders.length + ' leader' + (g.leaders.length === 1 ? '' : 's') + '</span></h2>' +
              '<p class="hint" style="margin-top:-4px">' + esc(Object.keys(g.events).join(', ')) + '</p>' +
              (g.leaders.length ? '<h4>' + ico('badge-check', 15) + 'Leaders</h4>' + list(g.leaders) : '') +
              (g.people.length ? '<h4 style="margin-top:10px">' + ico('users', 15) + 'Everyone else</h4>' + list(g.people) : '') +
              '</div>';
          }).join('') : (kc.length ? '' : '<div class="card"><p class="hint">Nobody is checked in right now.</p></div>'));
        icons(); wirePeeps();
      });
    }
    /* Event check-ins for every admin. Children in Sunday groups (Chunk 6)
       share the check-in but not who may see it (need to know, F-087): they
       are added for the children's leads, site by site, and for nobody else. */
    var PARTS = {};
    function listen(key, q) {
      q.onSnapshot(function (snap) {
        PARTS[key] = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        render([].concat.apply([], Object.keys(PARTS).map(function (k) { return PARTS[k]; })));
      }, function (e) {
        if (key === 'events') document.getElementById('wrap').innerHTML = '<div class="banner warn">Could not load the roll-call: ' + esc(e.message || e) + '</div>';
      });
    }
    if (who.all) listen('events', db().collection('checkins').where('day', '==', C.today()).where('kind', 'in', ['booked', 'walkin', 'leader']));
    /* A warden for one building: that building's check-ins only. */
    else who.sites.forEach(function (sid) {
      listen('events_' + sid, db().collection('checkins').where('day', '==', C.today()).where('kind', 'in', ['booked', 'walkin', 'leader']).where('buildingId', '==', sid));
    });
    /* The children's counts: every building's, or the warden's own. */
    var kcSnap = function (snap) {
      (snap.docs || [snap]).forEach(function (d) { if (d.exists) KC[d.id] = d.data(); });
      render(LAST);
    };
    if (who.all) db().collection('kidsCounts').where('day', '==', C.today()).onSnapshot(function (snap) { KC = {}; kcSnap(snap); }, function () {});
    else who.sites.forEach(function (sid) {
      db().collection('kidsCounts').doc(sid + '__' + C.today()).onSnapshot(function (d) { if (!d.exists) delete KC[d.id]; kcSnap(d); }, function () {});
    });
    if (!(EGBCAuth.isMaster && EGBCAuth.isMaster()) && !who.kidsLead) return;
    db().collection('kidsSettings').get().then(function (s) {
      s.docs.forEach(function (d) { listen('kids_' + d.id, db().collection('checkins').where('siteId', '==', d.id).where('day', '==', C.today())); });
    }).catch(function () {});
  }

  /* ---------- start ---------- */

  window.addEventListener('online', function () { if (EV) draw(); });
  window.addEventListener('offline', function () { if (EV) draw(); });

  EGBCAuth.require().then(function () {
    ADMIN = !!(EGBCAuth.isAdmin && EGBCAuth.isAdmin());
    if (VIEW === 'rollcall') {
      /* THE FIRE ROLL-CALL (F-214): master admins, and the people a master
         admin named for it in Safeguarding settings - each for every
         building or their own. */
      return mayRollCall().then(function (w) {
        if (!w) { E.refused(); throw new Error('The fire roll-call is for master admins and the people named for it in Safeguarding settings.'); }
        return rollCall(w);
      });
    }
    if (!EVID) return pickEvent();
    return Promise.all([SG.leadersOf(EVID), SG.myLeadSites()]).then(function (who) {
      var leader = !!E.myUid() && who[0] && (who[0].leaderUids || []).indexOf(E.myUid()) >= 0;
      LEADS = leader;
      return Promise.all([
        E.load(EVID),
        E.lookups(),
        db().collection('checkinSettings').doc(EVID).get().catch(function () { return { exists: false }; }),
        who[1]
      ]);
    }).then(function (r) {
      if (!r[0]) throw new Error('That event could not be found.');
      /* F-212: the event's team, master admins, and its leaders. */
      if (!LEADS && !E.runsEvent(r[0].ev)) { E.refused(); throw new Error('Check-in for this event is for its event team and its leaders. Ask whoever runs it to add you to its team.'); }
      EV = r[0].ev; QS = r[0].questions; LOOK = r[1]; TT = r[0].ticketTypes || [];
      SETTINGS = r[2].exists ? r[2].data() : {};
      var site = (EV.location || {}).siteId || '';
      SG.formsForEvent(EVID, [site].concat(r[3] || [])).then(function (fi) {
        FORMINFO = fi;
        if (first.s && first.c) { rebuild(); draw(); }
      }).catch(function () {});
      var first = { s: false, c: false };
      function maybeDraw() {
        if (!first.s || !first.c) return;
        /* Every change, from this device or another, redraws from the data. */
        rebuild();
        draw();
      }
      db().collection('signups').where('calEventId', '==', EVID).onSnapshot(function (snap) {
        SIGNUPS = snap.docs.map(function (d) { return Object.assign({ key: d.id }, d.data()); });
        first.s = true; maybeDraw();
      }, function (e) { toast('Could not load the sign-ups: ' + e.message); });
      db().collection('signupPayments').where('calEventId', '==', EVID).onSnapshot(function (snap) {
        PAYS = {}; snap.docs.forEach(function (d) { PAYS[d.id] = d.data(); });
        if (first.s && first.c) redrawPeople();
      }, function () { /* not allowed: no payments shown */ });
      db().collection('checkins').where('calEventId', '==', EVID).onSnapshot(function (snap) {
        CHECKINS = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        first.c = true; maybeDraw();
      }, function (e) { toast('Could not load the check-ins: ' + e.message); });
    });
  }).catch(function (e) {
    document.getElementById('wrap').innerHTML = '<div class="card"><div class="banner warn">' + esc(e.message || e) + '</div>' +
      '<a class="btn sec" href="checkin.html">Choose an event</a></div>';
  });

  /* Enter in the search box with a whole code in it: a hand-held scanner. */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'search' && /^EGBC1\|/.test(e.target.value)) {
      handleCode(e.target.value); FILTER = ''; e.target.value = ''; redrawPeople();
    }
  });
})();
</script>
</body>
</html>
