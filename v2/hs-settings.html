<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health and safety settings</title>
<!-- HEALTH, SAFETY AND FIRE: THE CHURCH'S SETTINGS (H&S step 2; F-280 section 8; Martin's answers to F-280).
     Who looks after health and safety at each building, how many the church employs (the duties follow),
     the insurance cover, and the numbers the assessments use. For any church: set by master admins and the
     team that does the office job (Teams and groups, "Who does each job"); EGBC's values only as defaults. -->
<script src="egbc-nosend.js?v=202610212000"></script>
<script src="egbc-shell.js?v=202610281800" data-title="Health and safety settings"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610281400"></script>
<script src="egbc-church.js?v=202610192330"></script>
<script src="egbc-events.js?v=202610281600"></script>
<script src="egbc-team-jobs.js?v=202610261800"></script>
<script src="egbc-compliance.js?v=202610191800"></script>
<script src="egbc-compliance-store.js?v=202610281000"></script>
<script src="egbc-hs-core.js?v=202610281000"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;
       font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  .inp:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .field{margin-bottom:12px}
  .two{display:flex;gap:12px;flex-wrap:wrap}
  .two>.field{flex:1;min-width:150px}
  .site{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  .site:first-of-type{border-top:none;padding-top:0}
  .site h3{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 8px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--body);margin:4px 0 12px;font-weight:400}
  .check input{width:16px;height:16px;accent-color:var(--brand);flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;
       border-radius:8px;font:500 14px Inter,sans-serif;cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.55;cursor:default}
  .hint{font-size:13px;color:var(--muted)}
  .banner{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:12px}
  .banner.info{background:var(--tint);color:var(--body);border:1px solid #cfe0de}
  .banner.gold{background:var(--gold-bg);color:var(--gold)}
  .banner.warn{background:var(--danger-bg);color:var(--danger)}
  ul.duties{margin:6px 0 0;padding-left:18px}
  ul.duties li{margin:3px 0}
  .btn.sec{background:#fff;color:var(--brand);border-color:var(--line-2)}
  .btn.sec:hover{background:var(--tint)}
  .frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
  .frow .fname{flex:1;min-width:140px;font-weight:500;color:var(--ink)}
  .frow select{width:auto;flex:none}
  .bar{position:sticky;bottom:0;background:var(--canvas);padding:10px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;
         padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card hint">Loading…</div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, H = window.EGBCHsCore, TJ = window.EGBCTeamJobs, esc = E.esc;
  function db() { return EGBCAuth.db; }
  function now() { return new Date().toISOString(); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3400); }
  var wrap = document.getElementById('wrap');
  var SITES = [], ROLES = {}, PEOPLE = [], SAVED = null, CHURCH = {}, MAY = false, KINDS = [];
  /* THE FIRE ROLL CALL (H&S step 3a): who may open it, for every building
     (fireRollCall/all) and for each one (fireRollCall/<siteId>). Moved here
     from Safeguarding settings, where it was one list for the whole church
     and only master admins set it. FIRE_DIRTY: the lists changed, saved
     with the rest. */
  var FIRE = {}, FIRE_DIRTY = {};
  /* A building's fire safety lead sets that building's list (Martin, 27 Oct): only those buildings, nothing else here */
  var FIRE_ONLY = null;

  function personOpts(id, sel) {
    return '<select id="' + id + '"><option value="">Nobody set</option>' + PEOPLE.map(function (p) {
      return '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') +
      (sel && !PEOPLE.some(function (p) { return p.id === sel; }) ? '<option value="' + esc(sel) + '" selected>(someone not offered here)</option>' : '') + '</select>';
  }
  function nameOf(mid) { var p = PEOPLE.filter(function (x) { return x.id === mid; })[0]; return p ? p.name : ''; }
  function numInp(id, v, opts) {
    opts = opts || {};
    return '<input class="inp" type="number" inputmode="numeric" min="' + (opts.min || 0) + '"' + (opts.max ? ' max="' + opts.max + '"' : '') + ' step="1" id="' + id + '" value="' + (v === null || v === undefined ? '' : esc(v)) + '"' + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + '>';
  }

  /* what the law asks, from the number employed: live as it is typed */
  function dutiesHtml(c) {
    var d = H.duties(c);
    if (c.employees === null) return '<p class="hint" id="hsDuties">Give the number, and the duties that follow from it are listed here and added to the buildings’ checks.</p>';
    if (!d.length) return '<p class="hint" id="hsDuties">Nobody employed: none of the employer’s duties apply.</p>';
    return '<div id="hsDuties"><p class="hint" style="margin:0">With ' + c.employees + ' employed' + (c.screenWork ? ', and screen work' : '') + ', the law asks for:</p><ul class="duties">' +
      d.map(function (x) { return '<li data-duty="' + esc(x.id) + '">' + esc(x.words) + '</li>'; }).join('') + '</ul>' +
      '<p class="hint" style="margin:6px 0 0">Each is added as a check to every building where someone employed works (“The building”, in Building compliance).</p></div>';
  }
  function coverHtml(c) {
    var f = H.coverFlags(c);
    return f.length ? '<div class="banner gold" id="hsCover">' + f.map(function (x) { return '<div data-cover="' + esc(x.id) + '">' + esc(x.words) + '</div>'; }).join('') + '</div>' : '<div id="hsCover"></div>';
  }

  function fireScopes() {
    if (FIRE_ONLY) return SITES.filter(function (s) { return FIRE_ONLY.indexOf(s.id) >= 0; }).map(function (s) { return { id: s.id, name: s.name || s.id }; });
    return [{ id: H.ROLL_ALL, name: 'Every building' }].concat(SITES.map(function (s) { return { id: s.id, name: s.name || s.id }; }));
  }
  function fireHtml() {
    return '<div class="card" id="hsFire"><h2>The fire roll call</h2>' +
      '<p class="hint" style="margin-top:0">The people who may open the fire roll call for today’s events: who is checked in, and how many. Names only: no answers, no medical details, no contact details. For example the fire wardens and the duty stewards. Master admins always can.</p>' +
      fireScopes().map(function (sc) {
        var list = FIRE[sc.id] || [], have = list.map(function (p) { return p.memberId; }), full = list.length >= H.LIST_MOST;
        return '<div class="site" data-fire="' + esc(sc.id) + '"><h3>' + esc(sc.name) + ' <span class="hint">(' + list.length + ')</span></h3>' +
          (list.length ? list.map(function (p) {
            var name = nameOf(p.memberId) || p.name;
            return '<div class="frow" data-who="' + esc(p.memberId) + '"><span class="fname">' + esc(name) + '</span>' +
              '<select class="fireRole" aria-label="Fire warden or duty steward: ' + esc(name) + '"><option value="warden">Fire warden</option><option value="steward"' + (p.role === 'steward' ? ' selected' : '') + '>Duty steward</option></select>' +
              '<button class="btn sec" type="button" data-drop>Remove</button></div>';
          }).join('') : '<p class="hint">Nobody named yet.</p>') +
          /* 500, the most one list holds (H-9): said, never cut off quietly */
          (full ? '<p class="banner gold" data-full>This list is full: ' + H.LIST_MOST + ' people, the most one building’s list holds. Take someone off to add someone else.</p>'
                : '<div class="field"><label for="fireAdd_' + esc(sc.id) + '">Add someone</label><select id="fireAdd_' + esc(sc.id) + '" data-add><option value="">Choose someone…</option>' +
                  PEOPLE.filter(function (p) { return have.indexOf(p.id) < 0; }).map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('') + '</select></div>') +
          '</div>';
      }).join('') + '</div>';
  }
  function wireFire() {
    var card = document.getElementById('hsFire'); if (!card) return;
    var changed = function (id, redraw) {
      FIRE_DIRTY[id] = true;
      document.getElementById('hsMsg').textContent = 'Not saved yet.';
      if (redraw) { card.outerHTML = fireHtml(); wireFire(); }
    };
    card.querySelectorAll('[data-fire]').forEach(function (box) {
      var id = box.getAttribute('data-fire'), add = box.querySelector('[data-add]');
      if (add) add.onchange = function () {
        var p = PEOPLE.filter(function (x) { return x.id === add.value; })[0]; if (!p) return;
        FIRE[id] = (FIRE[id] || []).concat([{ memberId: p.id, name: p.name, role: 'warden' }]);
        changed(id, true);
      };
      box.querySelectorAll('.frow').forEach(function (row) {
        var mid = row.getAttribute('data-who'), sel = row.querySelector('.fireRole');
        sel.onchange = function () { FIRE[id].forEach(function (p) { if (p.memberId === mid) p.role = sel.value; }); changed(id); };
        row.querySelector('[data-drop]').onclick = function () { FIRE[id] = FIRE[id].filter(function (p) { return p.memberId !== mid; }); changed(id, true); };
      });
    });
  }

  function saveFire() {
    var b = document.getElementById('hsSave'), msg = document.getElementById('hsMsg'), who = { uid: EGBCAuth.user().uid, name: (EGBCAuth.profile() || {}).name || '' };
    var fires = Object.keys(FIRE_DIRTY);
    b.disabled = true; msg.textContent = 'Saving…';
    Promise.all(fires.map(function (id) { return db().collection('fireRollCall').doc(id).set(Object.assign(H.rollCallDoc(id, FIRE[id]), { updatedBy: who.uid, updatedByName: who.name.slice(0, 200), updatedAt: now() })); }))
      .then(function () { fires.forEach(function (id) { delete FIRE_DIRTY[id]; }); b.disabled = false; msg.textContent = ''; toast('Saved.'); draw(); },
        function (e) { b.disabled = false; msg.textContent = 'Not saved: ' + ((e && e.message) || e); });
  }
  function draw() {
    if (FIRE_ONLY) {
      wrap.innerHTML = '<h1>Health and safety settings</h1><p class="sub">As the fire safety lead, you name who may open the fire roll call at your building.</p>' + fireHtml() +
        (PEOPLE.length ? '' : '<p class="hint" id="noBook">The address book can’t be read here, so nobody can be added: ask the office to add them.</p>') +
        '<div class="bar"><button class="btn" type="button" id="hsSave">Save</button><span class="hint" id="hsMsg" role="status"></span></div>';
      document.getElementById('hsSave').onclick = saveFire; wireFire(); return;
    }
    var c = H.settingsOf(SAVED), church = CHURCH.name || '';
    wrap.innerHTML = '<h1>Health and safety settings</h1><p class="sub">Who looks after health, safety and fire at each building, and the numbers the assessments use.</p>' +
      '<div class="banner info" id="hsNotAdvice">' + esc(H.NOT_ADVICE) + '</div>' +
      /* 1. who */
      '<div class="card" id="hsWho"><h2>Who looks after health and safety</h2>' +
        (SITES.length ? SITES.map(function (s) {
          var r = ROLES[s.id] || {};
          return '<div class="site" data-site="' + esc(s.id) + '"><h3>' + esc(s.name || s.id) + '</h3><div class="two">' +
            '<div class="field"><label for="hsLead_' + esc(s.id) + '">Health and safety lead</label>' + personOpts('hsLead_' + s.id, r.hsLead || '') + '</div>' +
            '<div class="field"><label for="hsDeputy_' + esc(s.id) + '">Deputy</label>' + personOpts('hsDeputy_' + s.id, r.hsDeputy || '') + '</div>' +
            '<div class="field"><label for="fireLead_' + esc(s.id) + '">Fire safety lead</label>' + personOpts('fireLead_' + s.id, r.fireLead || '') + '</div></div>' +
            '<p class="hint" data-responsible>The responsible person on its fire assessment: ' + esc(H.responsible(church, nameOf(r.fireLead))) + '.</p></div>';
        }).join('') : '<p class="hint">Add your buildings in Places first.</p>') +
        '<p class="hint">The fire safety lead may be the health and safety lead too.</p></div>' +
      fireHtml() +
      /* 2. employees */
      '<div class="card" id="hsStaff"><h2>The people the church employs</h2>' +
        '<div class="two"><div class="field"><label for="hsEmployees">How many people does the church employ (paid, including part-time)?</label>' + numInp('hsEmployees', c.employees, { ph: 'Not answered yet' }) + '</div>' +
        '<div class="field"><label for="hsLarger">A larger staff team, from</label>' + numInp('hsLarger', c.largerTeam, { min: 1 }) + '</div></div>' +
        '<label class="check"><input type="checkbox" id="hsScreen"' + (c.screenWork ? ' checked' : '') + '> Someone works at a screen as a regular part of their job</label>' +
        dutiesHtml(c) + '</div>' +
      /* 3. insurance */
      '<div class="card" id="hsInsure"><h2>Insurance cover</h2><div class="two">' +
        '<div class="field"><label for="hsPublic">Public liability cover (£)</label>' + numInp('hsPublic', c.publicLiability, { ph: 'e.g. 5000000' }) + '</div>' +
        '<div class="field"><label for="hsEmployers">Employers’ liability cover (£)</label>' + numInp('hsEmployers', c.employersLiability, { ph: 'e.g. 10000000' }) + '</div>' +
        '<div class="field"><label for="hsMinCover">Flag public liability under (£)</label>' + numInp('hsMinCover', c.minCover, { min: 1 }) + '</div></div>' +
        coverHtml(c) + '<p class="hint">The certificates themselves are kept with the insurance checks in Building compliance.</p></div>' +
      /* 4. the numbers the assessments use */
      '<div class="card" id="hsNumbers"><h2>Actions, events and AI drafts</h2>' +
        '<p class="hint" style="margin-top:0">An action’s target date, by its priority (months from when it is raised):</p><div class="two">' +
        '<div class="field"><label for="hsHigh">High</label>' + numInp('hsHigh', c.targets.high, { min: 1, max: 120 }) + '</div>' +
        '<div class="field"><label for="hsMedium">Medium</label>' + numInp('hsMedium', c.targets.medium, { min: 1, max: 120 }) + '</div>' +
        '<div class="field"><label for="hsLow">Low</label>' + numInp('hsLow', c.targets.low, { min: 1, max: 120 }) + '</div></div>' +
        '<div class="field"><label for="hsEventPeople">An event needs a risk assessment from this many people</label>' + numInp('hsEventPeople', c.eventPeople, { min: 1 }) + '</div>' +
        '<div class="two"><div class="field"><label for="hsAiChurch">AI drafts a day, for the church</label>' + numInp('hsAiChurch', c.ai.perChurch, { max: 500 }) + '</div>' +
        '<div class="field"><label for="hsAiPerson">AI drafts a day, for one person</label>' + numInp('hsAiPerson', c.ai.perPerson, { max: 500 }) + '</div></div>' +
        '<p class="hint">Separate from safeguarding’s. 0 turns AI drafting off.</p></div>' +
      /* 5. hirers' own risk assessments (F-280 answer 6; H&S step 5) */
      '<div class="card" id="hsHire"><h2>Hirers’ own risk assessments</h2><p class="hint" style="margin-top:0">For these kinds of booking, the hirer sends their own risk assessment. Room bookings reads it, checks it against the building’s assessments and the room’s fire maximum, and the office confirms it.</p>' +
        (KINDS.length ? KINDS.map(function (k) { return '<label class="check"><input type="checkbox" data-hirekind="' + esc(k.id) + '"' + (((SAVED || {}).hireRaTypes || []).indexOf(k.id) >= 0 ? ' checked' : '') + '> ' + esc(k.name || k.id) + '</label>'; }).join('')
          : '<p class="hint">No kinds of booking yet (Places, Hire prices).</p>') + '</div>' +
      '<div class="bar"><button class="btn" type="button" id="hsSave">Save</button><span class="hint" id="hsMsg" role="status"></span></div>';
    var live = function () { var x = read(); document.getElementById('hsDuties').outerHTML = dutiesHtml(H.settingsOf(x)); document.getElementById('hsCover').outerHTML = coverHtml(H.settingsOf(x)); };
    ['hsEmployees', 'hsLarger', 'hsScreen', 'hsPublic', 'hsEmployers', 'hsMinCover'].forEach(function (id) { var e = document.getElementById(id); e.oninput = live; e.onchange = live; });
    SITES.forEach(function (s) { var f = document.getElementById('fireLead_' + s.id); f.onchange = function () { f.closest('.site').querySelector('[data-responsible]').textContent = 'The responsible person on its fire assessment: ' + H.responsible(church, nameOf(f.value)) + '.'; }; });
    document.getElementById('hsSave').onclick = save;
    wireFire();
  }

  /* the form, as a record: a box left empty is left out (not answered), never stored as 0 */
  function read() {
    var n = function (id) { var v = String((document.getElementById(id) || {}).value || '').replace(/[£,\s]/g, ''); return v === '' ? null : Number(v); };
    var out = { screenWork: document.getElementById('hsScreen').checked, ai: {}, targets: {} };
    [['employees', 'hsEmployees'], ['largerTeam', 'hsLarger'], ['publicLiability', 'hsPublic'], ['employersLiability', 'hsEmployers'], ['minCover', 'hsMinCover'], ['eventPeople', 'hsEventPeople']]
      .forEach(function (p) { var v = n(p[1]); if (v !== null) out[p[0]] = v; });
    [['perChurch', 'hsAiChurch'], ['perPerson', 'hsAiPerson']].forEach(function (p) { var v = n(p[1]); if (v !== null) out.ai[p[0]] = v; });
    [['high', 'hsHigh'], ['medium', 'hsMedium'], ['low', 'hsLow']].forEach(function (p) { var v = n(p[1]); if (v !== null) out.targets[p[0]] = v; });
    out.hireRaTypes = [].map.call(document.querySelectorAll('[data-hirekind]:checked'), function (e) { return e.getAttribute('data-hirekind'); });
    return out;
  }

  function save() {
    var b = document.getElementById('hsSave'), msg = document.getElementById('hsMsg'), c = read();
    var bad = H.check(c), roles = {};
    SITES.forEach(function (s) {
      var r = { siteId: s.id, hsLead: document.getElementById('hsLead_' + s.id).value, hsDeputy: document.getElementById('hsDeputy_' + s.id).value, fireLead: document.getElementById('fireLead_' + s.id).value };
      bad = bad.concat(H.checkRoles(r).map(function (w) { return (s.name || s.id) + ': ' + w; }));
      var was = ROLES[s.id] || {};
      if ((was.hsLead || '') !== r.hsLead || (was.hsDeputy || '') !== r.hsDeputy || (was.fireLead || '') !== r.fireLead) roles[s.id] = r;
    });
    if (bad.length) { msg.textContent = bad.join(' '); return; }
    var was = H.settingsOf(SAVED), is = H.settingsOf(c);
    var staffChanged = was.employees !== is.employees || was.screenWork !== is.screenWork || was.largerTeam !== is.largerTeam;
    var who = { uid: EGBCAuth.user().uid, name: (EGBCAuth.profile() || {}).name || '' };
    b.disabled = true; msg.textContent = 'Saving…';
    var jobs = [db().collection('raSettings').doc('church').set(Object.assign({}, c, { updatedAt: now(), updatedBy: who.uid }))];
    Object.keys(roles).forEach(function (sid) { jobs.push(db().collection('raSiteRoles').doc(sid).set(Object.assign({}, roles[sid], { updatedAt: now(), updatedBy: who.uid }))); });
    var fires = Object.keys(FIRE_DIRTY);
    fires.forEach(function (id) {
      jobs.push(db().collection('fireRollCall').doc(id).set(Object.assign(H.rollCallDoc(id, FIRE[id]), { updatedBy: who.uid, updatedByName: who.name.slice(0, 200), updatedAt: now() })));
    });
    Promise.all(jobs).then(function () {
      SAVED = c; Object.keys(roles).forEach(function (sid) { ROLES[sid] = roles[sid]; });
      fires.forEach(function (id) { delete FIRE_DIRTY[id]; });
      if (!staffChanged) return null;
      /* THE NUMBER CHANGED: each building's checks follow it (the templates as the church has them) */
      return db().collection('complianceTemplates').get().then(function (t) {
        var tpl = t.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        return tpl.length ? EGBCComplianceStore.reapplyAll(db(), window.EGBCCompliance, tpl, who) : null;
      });
    }).then(function (r) {
      b.disabled = false; msg.textContent = '';
      toast('Saved.' + (r ? ' Buildings’ checks: ' + r.added + ' added, ' + r.removed + ' no longer apply' + (r.restored ? ', ' + r.restored + ' back' : '') + '.' : ''));
      draw();
    }, function (e) { b.disabled = false; msg.textContent = 'Not saved: ' + ((e && e.message) || e); });
  }

  EGBCAuth.require().then(function () { return EGBCAuth.loadPerms(); }).then(function (P) {
    /* covered teams count, as the rules' myTeams() (inTeam) */
    MAY = EGBCAuth.isMaster() || TJ.teamsFor(P.jobs, 'office', P.set).some(function (t) { return EGBCAuth.inTeam(t); });
    /* not the office: a building's fire safety lead still sets that building's roll call (Martin, 27 Oct) */
    var lead = MAY ? Promise.resolve(null) : db().collection('raSiteRoles').get().then(function (s) {
      var mid = (E.asSeen() || {}).memberId || '';
      var mine = mid ? s.docs.filter(function (d) { return d.data().fireLead === mid; }).map(function (d) { return d.id; }) : [];
      return mine.length ? mine : null;
    }, function () { return null; });
    return lead.then(function (mine) {
      if (!MAY && !mine) {
        E.refused();
        var office = TJ.label(P.jobs, 'office', null, P.set);
        wrap.innerHTML = '<div class="card" id="hsRefused"><h1>Health and safety settings</h1><p>These are set by ' + esc(office ? 'the ' + office : 'the church office') + ' and master admins.</p></div>';
        return null;
      }
      FIRE_ONLY = mine;
      return loadAll();
    });
  }).catch(function (e) {
    wrap.innerHTML = '<div class="card"><div class="banner warn">' + esc((e && e.message) || e) + '</div></div>';
  });
  function loadAll() {
    var get = function (c, d) { return db().collection(c).doc(d).get().then(function (x) { return x.exists ? x.data() : null; }, function () { return null; }); };
    return Promise.all([
      db().collection('sites').get().catch(function () { return { docs: [] }; }),
      db().collection('raSiteRoles').get().catch(function () { return { docs: [] }; }),
      db().collection('addressBook').get().catch(function () { return { docs: [] }; }),
      get('raSettings', 'church'), EGBCChurch.load().catch(function () { return {}; }),
      db().collection('bookingTypes').get().catch(function () { return { docs: [] }; })
    ]).then(function (w) {
      KINDS = w[5].docs.map(function (x) { return Object.assign({ id: x.id }, x.data()); }).filter(function (k) { return k.active !== false; });
      SITES = w[0].docs.map(function (x) { return Object.assign({ id: x.id }, x.data()); }).filter(function (x) { return x.active !== false; })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0) || String(a.name || '').localeCompare(String(b.name || '')); });
      w[1].docs.forEach(function (x) { ROLES[x.id] = x.data(); });
      PEOPLE = w[2].docs.map(function (x) { var v = x.data(); return { id: x.id, name: (v.name || '').trim(), minor: v.isMinor === true, archived: !!v.archived }; })
        .filter(function (p) { return p.name && !p.minor && !p.archived; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      SAVED = w[3]; CHURCH = w[4] || {};
      /* each list by its own id: the rules can't allow a query over the
         whole collection (they never let anyone but a master admin read
         the old single list, fireRollCall/main) */
      return Promise.all(fireScopes().map(function (sc) { return get('fireRollCall', sc.id); })).then(function (f) {
        fireScopes().forEach(function (sc, i) { if (f[i]) FIRE[sc.id] = (f[i].people || []).slice(); });
        draw();
      });
    });
  }
})();
</script>
