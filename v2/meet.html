<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Video meeting</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="egbc-nosend.js?v=202610212000"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610311600"></script>
<script src="https://unpkg.com/@daily-co/daily-js"></script>
<style>
  :root{--canvas:#f6f7f7;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--brand:#3d6263;--brand-dark:#2a4a4b}
  html,body{height:100%}
  body{margin:0;padding:12px;background:var(--canvas);font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--ink);
       display:flex;flex-direction:column;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  .strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}
  .strip .t{font-size:15px;font-weight:600}
  .strip .s{font-size:13px;color:var(--muted);margin-top:2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 16px;border-radius:8px;
       border:1px solid var(--line-2);background:#fff;color:var(--ink);font:500 14px Inter,sans-serif;cursor:pointer;text-decoration:none}
  .btn.solid{background:var(--brand);border-color:var(--brand);color:#fff}
  #stage{flex:1;min-height:420px;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);position:relative}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #stage:fullscreen{border-radius:0}
  #exitFs{display:none;position:absolute;top:10px;right:10px;z-index:5}
  #stage:fullscreen #exitFs{display:inline-flex}
  .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
  .msg .t{font-size:20px;font-weight:600}
  .msg .s{font-size:14px;color:var(--muted);max-width:440px;line-height:1.5}
  body.in-call .strip .s{display:none}
  @media(max-width:700px){body{padding:8px}}
</style>
</head>
<body>
<!-- A GUEST'S MEETING (main window, 28 Oct 2026; functions/meeting-manage.js).
     Opened from the link in a guest's invitation: meet.html?g=<key>. No hub
     sign-in. The hub checks the key and answers with this one meeting and
     its room, and nothing else; the guest knocks, and the host lets them
     in. The link stops working when the meeting is cancelled, when the
     guest is taken off, and two hours after it ends. -->
<div class="strip">
  <div style="flex:1;min-width:180px">
    <div class="t" id="title">Video meeting</div>
    <div class="s" id="sub">&nbsp;</div>
  </div>
  <button class="btn" id="fullBtn" style="display:none">Full screen</button>
</div>
<div id="stage"><div class="msg"><div class="s">Getting your meeting ready&hellip;</div></div></div>

<script>
const THEME = { colors: {
  accent: '#3d6263', accentText: '#FFFFFF', background: '#FFFFFF', backgroundAccent: '#eef5f4', baseText: '#111827',
  border: '#e5e7eb', mainAreaBg: '#f6f7f7', mainAreaBgAccent: '#eef5f4', mainAreaText: '#111827', supportiveText: '#6b7280',
} };
const g = new URLSearchParams(location.search).get('g') || '';
const stage = document.getElementById('stage');
let M = null, frame = null;

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function showMsg(title, sub, buttons) {
  stage.querySelectorAll('.msg').forEach(m => m.remove());
  const m = document.createElement('div');
  m.className = 'msg';
  m.innerHTML = `<div class="t">${esc(title)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${buttons || ''}</div>`;
  stage.appendChild(m);
}

async function ask() {
  const r = await fetch(EGBCAuth.functionUrl('meetingGuestJoin'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data: { g } }) });
  const body = await r.json().catch(() => ({}));
  if (body.error) throw new Error(body.error.message || 'This link did not work.');
  return body.result;
}

async function open() {
  if (!g) { showMsg('This link is not complete', 'Check you opened the whole link from your invitation email.'); return; }
  try { M = await ask(); }
  catch (e) { showMsg('This meeting cannot be opened', e.message); return; }
  document.title = M.title + (M.church ? ' — ' + M.church : '');
  document.getElementById('title').textContent = M.title;
  document.getElementById('sub').textContent = M.when + (M.church ? ' · ' + M.church : '');
  showMsg('Hello ' + (M.name || '').split(' ')[0],
    'When you join you will be asked to knock. The host will let you in.',
    '<button class="btn solid" id="joinBtn">Join the meeting</button>');
  document.getElementById('joinBtn').onclick = join;
}

function join() {
  if (!window.DailyIframe) { showMsg('The video service did not load', 'Check your internet connection and try again.', '<button class="btn" onclick="location.reload()">Try again</button>'); return; }
  stage.querySelectorAll('.msg').forEach(m => m.remove());
  document.body.classList.add('in-call');
  frame = DailyIframe.createFrame(stage, { showLeaveButton: true, showFullscreenButton: false, theme: THEME,
    iframeStyle: { position: 'absolute', inset: '0', width: '100%', height: '100%', border: '0' } });
  let over = false, joined = false;
  /* Leaving or ending: out of full screen first, then a screen that works. */
  const ended = (title, sub) => {
    if (over) return; over = true;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    document.body.classList.remove('in-call');
    const f = frame; frame = null;
    try { f && f.destroy(); } catch (e) {}
    showMsg(title, sub, '<button class="btn solid" onclick="location.reload()">Rejoin</button>');
  };
  frame.on('joined-meeting', () => { joined = true; });
  frame.on('left-meeting', () => ended('You have left the meeting', 'Thank you for joining.'));
  frame.on('error', e => ended(joined ? 'The meeting has ended' : 'The meeting could not start', (e && e.errorMsg) || ''));
  const fb = document.getElementById('fullBtn');
  if (document.fullscreenEnabled && stage.requestFullscreen) {
    fb.style.display = '';
    fb.onclick = () => document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen();
    if (!document.getElementById('exitFs')) {
      const x = document.createElement('button');
      x.id = 'exitFs'; x.className = 'btn'; x.textContent = 'Exit full screen';
      x.onclick = () => document.exitFullscreen().catch(() => {});
      stage.appendChild(x);
    }
  }
  frame.join({ url: M.url, userName: M.name || '' }).catch(e => console.error('join failed', e));
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen().catch(() => {}); });
open();
</script>
</body>
</html>
