<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church details</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-shell.js?v=202610062100" data-title="Church details"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-church.js?v=202610101000"></script>
<script src="egbc-guard.js?v=202610062100" data-admin="any"></script>
<script src="egbc-events-rooms.js?v=202610081800"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;--card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff}
  .inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .field{margin-bottom:14px}
  .hint{font-size:13px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;font:500 13px Inter,sans-serif;
       cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff}
  .btn:hover{background:var(--brand-dark)} .btn:disabled{opacity:.55}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .logo{width:96px;height:96px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fff;display:block;margin-bottom:8px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Church details</h1>
  <p class="sub">The name, enquiry email and logo shown on the public room-hire pages and in emails. Change them here, once.</p>
  <div class="card" id="form"><p class="hint">Loading…</p></div>
</div>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  var D = {};
  function db() { return EGBCAuth.db; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3000); }

  function draw() {
    document.getElementById('form').innerHTML =
      '<div class="field"><label for="c-name">Church name</label><input class="inp" id="c-name" maxlength="120" value="' + esc(D.name) + '"></div>' +
      '<div class="field"><label for="c-email">Enquiry email</label><input class="inp" id="c-email" type="email" maxlength="200" value="' + esc(D.enquiryEmail) + '">' +
        '<p class="hint" style="margin:6px 0 0">Where room-hire questions go, and the reply address on emails these pages send.</p></div>' +
      '<div class="field"><label>Logo</label>' + (D.logoUrl ? '<img class="logo" id="c-logo" src="' + esc(D.logoUrl) + '" alt="">' : '<p class="hint">No logo yet.</p>') +
        '<label class="btn sec" style="cursor:pointer;display:inline-flex">' + (D.logoUrl ? 'Change the logo' : 'Add a logo') +
        '<input type="file" id="c-file" accept="image/png,image/jpeg,image/webp" style="display:none"></label></div>' +
      '<button class="btn" id="c-save">Save</button>';
    document.getElementById('c-file').onchange = function () {
      var f = this.files[0]; if (!f) return;
      /* Kept small: it is drawn at 32 pixels in page headers. */
      EGBCRooms.shrink(f, 512, 0.9).then(function (img) {
        var path = 'church/logo-' + Date.now() + '.jpg', ref = EGBCAuth.storage().ref(path);
        return ref.put(img.blob, { contentType: 'image/jpeg' }).then(function () { return ref.getDownloadURL(); })
          .then(function (url) { var old = D.logoPath; D.logoUrl = url; D.logoPath = path; if (old) EGBCAuth.storage().ref(old).delete().catch(function () {}); return save(true); });
      }).catch(function (e) { toast(e.message || String(e)); });
    };
    document.getElementById('c-save').onclick = function () { save(false); };
  }

  function save(logoOnly) {
    var name = document.getElementById('c-name').value.trim(), email = document.getElementById('c-email').value.trim().toLowerCase();
    if (!logoOnly && !name) { toast('It needs the church\'s name.'); return Promise.resolve(); }
    if (!logoOnly && email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('That email address does not look right.'); return Promise.resolve(); }
    var u = EGBCAuth.user() || {};
    D.name = logoOnly ? (D.name || name) : name; D.enquiryEmail = logoOnly ? (D.enquiryEmail || email) : email;
    return db().collection('churchSettings').doc('details').set({
      name: D.name || '', enquiryEmail: D.enquiryEmail || '', logoUrl: D.logoUrl || '', logoPath: D.logoPath || '',
      updatedAt: new Date().toISOString(), updatedBy: u.uid || ''
    }).then(function () { toast('Saved.'); draw(); }).catch(function (e) { toast('Could not save: ' + (e.message || e)); });
  }

  EGBCAuth.require({ adminAny: true }).then(function () {
    return db().collection('churchSettings').doc('details').get();
  }).then(function (s) { D = s.exists ? s.data() : {}; draw(); })
    .catch(function (e) { document.getElementById('form').innerHTML = '<p>' + esc(e.message || e) + '</p>'; });
})();
</script>
</body>
</html>
