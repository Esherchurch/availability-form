<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 6px}
  label.l{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px}
  .inp,select{height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font:400 14px Inter,sans-serif;color:var(--ink);background:#fff;width:100%}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;font:500 13px Inter,sans-serif;
       cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--brand-dark)} .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)} .btn.sec:hover{background:#f3f4f6}
  .btn.warn{background:var(--danger)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font:500 13px Inter,sans-serif;color:var(--body);cursor:pointer}
  .tab.on{background:var(--tint);border-color:var(--brand);color:var(--ink)}
  .tab .n{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:999px;background:var(--gold);color:#fff;font-size:11px;margin-left:6px}
  .hint{font-size:13px;color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}.row .f{min-width:160px}
  .bk h3{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 2px}
  .bk dl{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin:10px 0;font-size:13px}
  .bk dt{color:var(--muted)} .bk dd{margin:0;color:var(--body);overflow-wrap:anywhere}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .act{margin-top:10px}
  .act .two{display:flex;gap:10px;flex-wrap:wrap}.act .two>div{flex:1;min-width:120px}
  .pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.wait{background:var(--gold-bg);color:var(--gold)}.pill.no{background:var(--danger-bg);color:var(--danger)}
  .st{border-radius:8px;padding:10px 12px;font-size:13px;margin:8px 0}
  .st.ok{background:var(--ok-bg);color:var(--ok)}.st.wait{background:var(--gold-bg);color:var(--gold)}.st.no{background:var(--danger-bg);color:var(--danger)}
  .scroll{overflow-x:auto}.scroll>div{min-width:560px}
  .money{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fbfcfc}
  .money h4{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 8px}
  .mrow{display:flex;gap:8px;align-items:center;margin:4px 0}.mrow .inp{height:34px}.mrow .ml{flex:1;min-width:0}.mrow .ma{width:110px;text-align:right}
  @media (max-width:520px){.mrow{flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid #f1f3f4}.mrow .ml{flex-basis:100%}.mrow .ma{flex:1}}
  .mtot{display:flex;justify-content:space-between;font-weight:600;color:var(--ink);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .dates{border:1px solid var(--line);border-radius:8px;margin:10px 0}
  .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-top:1px solid #f1f3f4;font-size:13px}
  .drow:first-child{border-top:none}.drow .d{flex:1;min-width:150px;color:var(--ink)}
  .drow .st{margin:0;padding:3px 8px}.drow .btn{height:30px;padding:0 10px}.drow .act{flex-basis:100%;margin:0}
  /* The setup sheet: plain, printable. */
  .sheet-day{margin:0 0 18px}.sheet-day h3{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
  .sheet-room{margin:0 0 12px}.sheet-room h4{font-size:14px;font-weight:600;color:var(--brand);margin:0 0 4px}
  .sheet-b{border-left:3px solid var(--line-2);padding:4px 0 4px 10px;margin:0 0 8px;font-size:13px}
  .sheet-b .w{font-weight:600;color:var(--ink)} .sheet-b div{margin:1px 0}
  .kitchen{background:var(--gold-bg);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:6px}
  @media print{
    body *{visibility:hidden}
    #print,#print *{visibility:visible}
    #print{position:absolute;left:0;top:0;width:100%;padding:0 8mm}
    .sheet-b{break-inside:avoid}
  }
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>Room bookings</h1>
  <p class="sub">Approve or decline requests, and move or cancel any booking. Members book free rooms themselves in <a href="rooms.html" style="color:var(--brand)">Book a room</a>.</p>
  <div id="main"><div class="card hint">Loading…</div></div>
</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var B = window.EGBCBookings;
  var SITES = [], ROOMS = [], KIT = [], LIST = [], V = { site: '', tab: 'waiting', day: B.today() };
  function db() { return EGBCAuth.db; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 3500); }
  function room(id) { return ROOMS.filter(function (r) { return r.id === id; })[0] || { id: id, name: 'A room', siteId: V.site }; }
  function site() { return SITES.filter(function (s) { return s.id === V.site; })[0] || {}; }
  function byTime(a, b) { return (a.day + B.hhmm(a.startMin)) < (b.day + B.hhmm(b.startMin)) ? -1 : 1; }
  function find(key) { return LIST.filter(function (b) { return b.key === key; })[0]; }

  /* ---- stage 3: hirers, invoices, accounts (egbc-events-money.js) ---- */
  var HIRERS = [], INVOICES = [], ACC = { mode: 'none' };
  var MCTX = { db: db, esc: esc, toast: toast, room: room, siteId: function () { return V.site; }, state: V,
    list: function () { return LIST; }, charges: function () { return CHARGES; }, hirers: function () { return HIRERS; }, invoices: function () { return INVOICES; },
    settings: function () { return ACC; }, payText: function () { return ACC.payText || ''; }, isAdmin: false,
    pageLink: function (b) { return pageLink(b); },
    reload: function (o) { o = o || {}; if (o.tab) V.tab = o.tab; return load().then(function () { if (o.open) MONEY.drawHirers(document.getElementById('list'), o.open); }); } };
  var MONEY = EGBCMoney(MCTX);
  function load() {
    return Promise.all([db().collection('bookings').where('siteId', '==', V.site).get(),
                        db().collection('charges').where('siteId', '==', V.site).get().catch(function () { return { docs: [] }; }),
                        db().collection('hirers').where('siteId', '==', V.site).get().catch(function () { return { docs: [] }; }),
                        db().collection('invoices').where('siteId', '==', V.site).get().catch(function () { return { docs: [] }; }),
                        EGBCAccounts.settings(true)]).then(function (r) {
      var s = r[0];
      HIRERS = r[2].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      INVOICES = r[3].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      ACC = r[4];
      CHARGES = {}; r[1].docs.forEach(function (d) { CHARGES[d.data().bookingKey] = Object.assign({ id: d.id }, d.data()); });
      LIST = s.docs.map(function (d) { return Object.assign({ key: d.id }, d.data()); }).sort(byTime);
      draw();
    }).catch(function (e) { document.getElementById('list').innerHTML = '<div class="card">Could not load: ' + esc(e.message || e) + '</div>'; });
  }

  function draw() {
    var waiting = LIST.filter(function (b) { return b.status === 'requested' && b.day >= B.today(); });
    var asks = LIST.filter(function (b) { return b.cancelRequest && b.cancelRequest.status === 'asked' && (b.status === 'confirmed' || b.status === 'requested'); });
    var tabs = [['waiting', 'Waiting', waiting.length + asks.length], ['coming', 'Coming up'], ['day', 'Day view'], ['setup', 'Setup sheet'],
                ['invoices', 'Invoices'], ['hirers', 'Hirers'], ['accounts', 'Accounts'], ['past', 'Past and cancelled']];
    document.getElementById('main').innerHTML =
      '<div class="row">' + (SITES.length > 1 ? '<div class="f"><label class="l" for="a-site">Site</label><select id="a-site">' + SITES.map(function (s) {
        return '<option value="' + esc(s.id) + '"' + (s.id === V.site ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select></div>' : '<h2 style="margin:0">' + esc(site().name) + '</h2>') + '</div>' +
      '<div class="tabs">' + tabs.map(function (t) {
        return '<button class="tab' + (V.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + (t[2] ? '<span class="n">' + t[2] + '</span>' : '') + '</button>'; }).join('') + '</div>' +
      '<div id="list"></div>';
    if (document.getElementById('a-site')) document.getElementById('a-site').onchange = function () { V.site = this.value; load(); };
    document.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { V.tab = b.dataset.tab; draw(); }; });
    var el = document.getElementById('list');
    if (V.tab === 'day') return drawDay(el);
    if (V.tab === 'setup') return drawSetup(el);
    if (V.tab === 'invoices') return MONEY.drawInvoices(el);
    if (V.tab === 'hirers') return MONEY.drawHirers(el);
    if (V.tab === 'accounts') return MONEY.drawAccounts(el);
    var show = V.tab === 'waiting' ? waiting
      : V.tab === 'coming' ? LIST.filter(function (b) { return b.status === 'confirmed' && b.day >= B.today(); })
      : LIST.filter(function (b) { return b.day < B.today() || b.status === 'cancelled' || b.status === 'declined'; }).reverse();
    var seen = {}, cards = [];
    show.forEach(function (b) {
      if (V.tab === 'waiting' && b.series) {
        if (seen[b.series.id]) return;
        seen[b.series.id] = true;
        cards.push(seriesCard(show.filter(function (x) { return x.series && x.series.id === b.series.id; })));
      } else cards.push(card(b));
    });
    if (V.tab === 'waiting') cards = asks.map(askCard).concat(cards);
    el.innerHTML = cards.length ? cards.join('') : '<div class="card hint">' + (V.tab === 'waiting' ? 'Nothing is waiting.' : 'Nothing here.') + '</div>';
    wireAsks(el);
    wireSeries(el);
    wireMoney(el);
    wire(el);
    /* Is each waiting request's time still free? */
    show.filter(function (b) { return b.status === 'requested'; }).forEach(function (b) {
      B.loadDays([room(b.roomId)], b.day).then(function (d) {
        var c = document.querySelector('[data-free="' + b.key + '"]'); if (!c) return;
        var ok = B.free(d[b.roomId], { from: b.slotFrom, to: b.slotTo });
        c.className = 'st ' + (ok ? 'ok' : 'no');
        c.textContent = ok ? 'The time is still free.' : 'Something else now has some of this time. Approving it means booking over it, with a reason.';
      });
    });
  }

  function money(v) { return '£' + (Number(v) || 0).toFixed(2); }
  function card(b) {
    var r = room(b.roomId), q = b.requester || {}, f = b.refreshments || {}, others = LIST;
    var kit = B.kitClash(b, others, KIT);
    var pill = { confirmed: '<span class="pill ok">Confirmed</span>', requested: '<span class="pill wait">Waiting</span>',
                 declined: '<span class="pill no">Declined</span>', cancelled: '<span class="pill no">Cancelled</span>' }[b.status] || '';
    var diet = Object.keys(f.dietary || {}).map(function (k) { return f.dietary[k] + ' ' + ({ vegetarian: 'vegetarian', vegan: 'vegan', glutenFree: 'gluten-free', dairyFree: 'dairy-free' }[k] || k); });
    return '<div class="card bk" data-key="' + esc(b.key) + '">' +
      '<div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap"><div><h3>' + esc(b.title || 'Booking') + '</h3>' +
        '<span class="hint">' + esc(r.name) + ', ' + esc(B.when(b)) + ' · ' + (b.kind === 'hire' ? 'hire request' : b.kind === 'office' ? 'office booking' : b.kind === 'event' ? 'event' : 'member') + ' · reference ' + esc(B.ref(b)) + '</span></div>' + pill + '</div>' +
      (b.status === 'requested' ? '<div class="st wait" data-free="' + esc(b.key) + '">Checking the time…</div>' : '') +
      (b.override ? '<div class="st wait">Booked over something else' + (b.decisionNote ? ': ' + esc(b.decisionNote) : '') + '.</div>' : '') +
      (kit.length ? '<div class="st wait">Kit: ' + esc(kit.join('; ')) + '.</div>' : '') +
      '<dl>' +
        '<dt>Who</dt><dd>' + esc(q.name || b.memberName || '') + (q.org ? ' (' + esc(q.org) + ')' : '') + (q.email ? ' · ' + esc(q.email) : '') + (q.phone ? ' · ' + esc(q.phone) : '') + '</dd>' +
        '<dt>People</dt><dd>' + esc(b.people) + (b.layout ? ', ' + esc(b.layout) : '') + '</dd>' +
        ((b.setupMins || b.packdownMins) ? '<dt>Held for</dt><dd>' + (b.setupMins || 0) + ' min to set up, ' + (b.packdownMins || 0) + ' to clear away (' + B.hhmm(b.slotFrom * 15) + ' to ' + B.hhmm(b.slotTo * 15) + ')</dd>' : '') +
        (b.av && b.av.needed ? '<dt>Sound, projection</dt><dd>' + esc(b.av.what || 'Yes') + '</dd>' : '') +
        (f.needed ? '<dt>Refreshments</dt><dd>' + (f.items || []).map(function (i) { return esc(i.qty + ' × ' + i.name) + ' <span class="hint">' + money(i.price) + (i.unit === 'item' ? ' each' : ' a person') + '</span>'; }).join('<br>') +
          (f.servingAt ? '<br>Serve at ' + esc(f.servingAt) : '') + (diet.length ? '<br>' + esc(diet.join(', ')) : '') + (f.notes ? '<br>' + esc(f.notes) : '') + '</dd>' : '') +
        ((b.resources || []).length ? '<dt>Kit</dt><dd>' + b.resources.map(function (x) { return esc(x.qty + ' × ' + x.name); }).join(', ') + '</dd>' : '') +
        (b.notes ? '<dt>Notes</dt><dd>' + esc(b.notes) + '</dd>' : '') +
        (b.decidedByName ? '<dt>Last decided by</dt><dd>' + esc(b.decidedByName) + (b.decisionNote ? ': ' + esc(b.decisionNote) : '') + '</dd>' : '') +
      '</dl>' +
      MONEY.hirerLine(b) +
      (b.status === 'requested' ? chargesBox(b) : '') +
      (CHARGES[b.key] ? '<div class="st ' + (CHARGES[b.key].status === 'paid' ? 'ok' : 'wait') + '" data-owed="' + esc(b.key) + '">Charges: ' + Q.pounds(CHARGES[b.key].total) +
        ', ' + esc(CHARGES[b.key].status.replace('-', ' ')) + (paidOf(CHARGES[b.key]) && CHARGES[b.key].status !== 'paid' ? ' (' + Q.pounds(paidOf(CHARGES[b.key])) + ' paid)' : '') +
        (CHARGES[b.key].invoiceNumber ? ' · invoice ' + esc(CHARGES[b.key].invoiceNumber) : '') + '</div>' +
        (CHARGES[b.key].damageDeposit ? '<div class="hint" data-dmg="' + esc(b.key) + '">Damage deposit ' + Q.pounds(CHARGES[b.key].damageDeposit) + ': ' + damageWords(CHARGES[b.key].damage) + '</div>' : '') +
        ((CHARGES[b.key].payments || []).length ? '<div class="hint" data-payments="' + esc(b.key) + '">' + CHARGES[b.key].payments.map(function (p) {
          return (p.kind === 'refund' ? 'Refunded ' : 'Paid ') + Q.pounds(p.amount) + ', ' + esc(p.method) + ', ' + esc(p.date) + (p.ref ? ' (' + esc(p.ref) + ')' : ''); }).join('<br>') + '</div>' : '') +
        (b.accepted ? '<div class="st ok" data-acc="' + esc(b.key) + '">Accepted by ' + esc(b.accepted.name) + (b.accepted.termsVersion ? ', terms version ' + b.accepted.termsVersion : '') + '</div>'
          : b.status === 'confirmed' ? '<div class="hint" data-acc="' + esc(b.key) + '">The quote has not been accepted yet. <a href="' + pageLink(b) + '" target="_blank" rel="noopener" style="color:var(--brand)">The hirer\'s page</a></div>' : '') : '') +
      (b.status === 'requested' ? '<div class="acts"><button class="btn" data-do="approve">Approve</button><button class="btn sec" data-do="decline">Decline</button><button class="btn sec" data-do="move">Change the time</button></div>' : '') +
      (b.status === 'confirmed' && b.day >= B.today() ? '<div class="acts"><button class="btn sec" data-do="move">Move</button><button class="btn sec" data-do="cancel">Cancel</button>' +
        (CHARGES[b.key] && CHARGES[b.key].status !== 'cancelled' ? '<button class="btn sec" data-do="pay">Record a payment</button>' : '') +
        (CHARGES[b.key] && !CHARGES[b.key].invoiceId && !(MONEY.hirerFor(b) && MONEY.hirerFor(b).monthly) ? '<button class="btn sec" data-do="invoice">Issue an invoice</button>' : '') +
        (CHARGES[b.key] && CHARGES[b.key].damageDeposit && !(CHARGES[b.key].damage && CHARGES[b.key].damage.status !== 'none') ? '<button class="btn sec" data-do="dtake">Damage deposit taken</button>' : '') +
        (CHARGES[b.key] && CHARGES[b.key].damage && CHARGES[b.key].damage.status === 'held' ? '<button class="btn sec" data-do="dreturn">Return the damage deposit</button>' : '') +
        (laterIn(b).length ? '<button class="btn sec" data-do="cancelrest">Cancel this and the ' + laterIn(b).length + ' after it</button>' : '') + '</div>' : '') +
      '<div class="act"></div></div>';
  }
  /* ---- what a hire costs (Chunk 5, stage 1) ----
     Worked out from the room's prices for the kind of booking. The office
     can change any line, add one or take one away before approving; the
     total is always the lines added up. Approving records the charge. */
  var Q = window.EGBCQuote, TYPES = {}, CARDS = {}, CHARGES = {}, EDIT = {};
  /* Which prices: the members' rate only for a member's own booking (F-077). */
  function pickOf(b) { return Q.pick(b.kind, TYPES[b.bookingType], b.roomId, CARDS); }
  function cardOf(b) { var k = pickOf(b); return k && k.card; }
  function hirerOf(b) { return b.kind === 'hire' ? MONEY.hirerFor(b) : null; }
  function charged(b) { var t = TYPES[b.bookingType]; return !!(t && t.charged); }
  function priceOf(b) {
    var k = pickOf(b), card = k && k.card; if (!card || !charged(b)) return null;
    if (EDIT[b.key]) return Q.totals(EDIT[b.key], card);
    var kit = (b.resources || []).map(function (x) { var k = KIT.filter(function (y) { return y.id === x.id; })[0] || {}; return { name: x.name, qty: x.qty, hirePrice: k.hirePrice || 0 }; });
    return Q.price({ card: card, day: b.day, start: b.startMin, end: b.endMin, setup: b.setupMins, pack: b.packdownMins, people: b.people,
      items: b.refreshments && b.refreshments.needed ? b.refreshments.items : [], kit: kit, av: b.av, memberPct: k.memberPct, memberList: k.memberList,
      /* A hirer's record, once the office has one, decides charity and
         regular: a charity only once its number is checked. */
      charity: hirerOf(b) ? !!(hirerOf(b).charity && hirerOf(b).charityChecked) : !!b.charity, regular: !!(hirerOf(b) && hirerOf(b).regular) });
  }
  function chargesBox(b) {
    if (!b.bookingType || !charged(b)) return '';
    var q = priceOf(b);
    if (!q) return '<div class="st wait">No prices are set for this room and this kind of booking. Add them on Places, Hire prices, or approve it free.</div>';
    return '<div class="money" data-money="' + esc(b.key) + '"><h4>Charges' + (b.charity ? ' <span class="pill wait">Says it is a charity: check</span>' : '') + '</h4>' +
      q.lines.map(function (l, i) {
        return '<div class="mrow"><input class="inp ml" data-ml="' + i + '" value="' + esc(l.label) + '" aria-label="What for">' +
          '<input class="inp ma" data-ma="' + i + '" type="number" step="0.01" value="' + (l.amount / 100).toFixed(2) + '" aria-label="Amount in pounds">' +
          '<button class="btn sec" data-mx="' + i + '" aria-label="Take this line off">&times;</button></div>';
      }).join('') +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn sec" data-madd="1">Add a line</button>' +
        (EDIT[b.key] ? '<button class="btn sec" data-mreset="1">Start again from the price list</button>' : '') + '</div>' +
      (q.vat ? '<div class="mrow" style="justify-content:space-between"><span>VAT (' + q.vatRate + '%)</span><span>' + Q.pounds(q.vat) + '</span></div>' : '') +
      '<div class="mtot"><span>Total</span><span data-mtotal="' + esc(b.key) + '">' + Q.pounds(q.total) + '</span></div>' +
      (q.deposit ? '<p class="hint" style="margin:4px 0 0">Deposit ' + Q.pounds(q.deposit) + (q.damageDeposit ? '; refundable damage deposit ' + Q.pounds(q.damageDeposit) : '') + '</p>' : '') + '</div>';
  }
  /* The lines as the office has them on the screen. */
  function readLines(box) {
    return [].slice.call(box.querySelectorAll('[data-ml]')).map(function (el) {
      var i = el.dataset.ml, a = box.querySelector('[data-ma="' + i + '"]').value;
      var n = Number(a); return { code: 'office', label: el.value.trim() || 'Charge', amount: isFinite(n) ? Math.round(n * 100) : 0 };
    });
  }
  function wireMoney(el) {
    el.querySelectorAll('[data-money]').forEach(function (box) {
      var key = box.dataset.money, b = find(key), redraw = function () { box.outerHTML = chargesBox(b); wireMoney(document.getElementById('list')); };
      box.oninput = function () {
        EDIT[key] = readLines(box);
        var t = box.querySelector('[data-mtotal]'); if (t) t.textContent = Q.pounds(Q.totals(EDIT[key], cardOf(b)).total);
      };
      box.querySelectorAll('[data-mx]').forEach(function (x) { x.onclick = function () { var l = readLines(box); l.splice(+x.dataset.mx, 1); EDIT[key] = l; redraw(); }; });
      var add = box.querySelector('[data-madd]'); if (add) add.onclick = function () { var l = readLines(box); l.push({ code: 'office', label: '', amount: 0 }); EDIT[key] = l; redraw(); };
      var rs = box.querySelector('[data-mreset]'); if (rs) rs.onclick = function () { delete EDIT[key]; redraw(); };
    });
  }
  /* On approval: the charge, and the price in the booking and the email. */
  function recordCharge(b, q) {
    if (!q) return Promise.resolve(null);
    var w = EGBCAuth.user() || {}, r = b.requester || {};
    var c = { bookingKey: b.key, seriesId: (b.series && b.series.id) || '', siteId: b.siteId, roomId: b.roomId, kind: b.kind === 'member' ? 'member' : 'hire',
      payer: { name: r.name || '', email: r.email || '', org: r.org || '' }, lines: q.lines.map(function (l) { return { code: l.code, label: l.label, amount: l.amount }; }),
      subtotal: q.subtotal, vat: q.vat, vatRate: q.vatRate || 0, total: q.total, deposit: q.deposit || 0, damageDeposit: q.damageDeposit || 0,
      status: 'unpaid', payments: [], dueDate: b.day, createdAt: new Date().toISOString(), createdBy: w.uid || '', adjusted: !!EDIT[b.key] };
    return db().collection('charges').doc('ch_' + b.key).set(c).then(function () {
      return db().collection('bookings').doc(b.key).update({ quote: { lines: c.lines, subtotal: c.subtotal, vat: c.vat, vatRate: c.vatRate, total: c.total,
        deposit: c.deposit, damageDeposit: c.damageDeposit, by: c.adjusted ? 'office, adjusted' : 'price list' } });
    }).then(function () { delete EDIT[b.key]; return c; });
  }
  /* The hirer's own page: the quote as a document, the terms, accepting. */
  function pageLink(b) { return location.origin + location.pathname.replace(/[^/]*$/, '') + 'my-booking.html?k=' + encodeURIComponent(b.key); }
  function linkButton(b, words) {
    return '<p><a href="' + pageLink(b) + '" style="display:inline-block;background:#3d6263;color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font:500 14px Inter,Arial,sans-serif">' + words + '</a></p>';
  }
  function priceWords(q, b) {
    return q ? '<p><strong>The price</strong></p>' + Q.table(q) + (b ? linkButton(b, 'See your quote, and accept it and the terms') : '') : '';
  }

  /* Later dates of the same repeating booking that are still on. */
  function laterIn(b) {
    return b.series ? LIST.filter(function (x) { return x.series && x.series.id === b.series.id && x.day > b.day && (x.status === 'confirmed' || x.status === 'requested'); }) : [];
  }

  /* A repeating request: the details once, then every date with whether it
     is free (the clash report), so the office can approve the free ones in
     one go and deal with the rest one by one. */
  function seriesCard(list) {
    var b = list[0], r = room(b.roomId), q = b.requester || {};
    return '<div class="card bk" data-series="' + esc(b.series.id) + '">' +
      '<div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap"><div><h3>' + esc(b.title || 'Booking') + '</h3>' +
        '<span class="hint">' + esc(r.name) + ', ' + esc(B.hhmm(b.startMin) + ' to ' + B.hhmm(b.endMin)) + ' · ' + esc(B.RULES[b.series.rule] || '') + ' · ' +
        (b.kind === 'hire' ? 'hire request' : 'member') + '</span></div><span class="pill wait">' + list.length + ' waiting</span></div>' +
      '<dl><dt>Who</dt><dd>' + esc(q.name || b.memberName || '') + (q.org ? ' (' + esc(q.org) + ')' : '') + (q.email ? ' · ' + esc(q.email) : '') + (q.phone ? ' · ' + esc(q.phone) : '') + '</dd>' +
        '<dt>People</dt><dd>' + esc(b.people) + (b.layout ? ', ' + esc(b.layout) : '') + '</dd>' +
        (b.notes ? '<dt>Notes</dt><dd>' + esc(b.notes) + '</dd>' : '') + '</dl>' +
      '<div class="dates">' + list.map(function (x) {
        return '<div class="drow" data-key="' + esc(x.key) + '"><span class="d">' + esc(EGBCEvents.fmtDate(x.day + 'T12:00')) + '</span>' +
          '<span class="st wait" data-free="' + esc(x.key) + '">Checking…</span>' +
          '<button class="btn sec" data-do="approve">Approve</button><button class="btn sec" data-do="decline">Decline</button><div class="act"></div></div>';
      }).join('') + '</div>' +
      '<div class="acts"><button class="btn" data-sdo="approve">Approve every free date</button><button class="btn sec" data-sdo="decline">Decline them all</button></div>' +
      '<div class="sact"></div></div>';
  }
  function wireSeries(el) {
    el.querySelectorAll('[data-sdo]').forEach(function (btn) {
      btn.onclick = function () {
        var c = btn.closest('[data-series]'), id = c.dataset.series, act = c.querySelector('.sact');
        var list = LIST.filter(function (x) { return x.series && x.series.id === id && x.status === 'requested'; }), r = room(list[0].roomId);
        if (btn.dataset.sdo === 'approve') {
          var done = [], left = 0;
          list.reduce(function (p, b) {
            var q = priceOf(b);
            return p.then(function () { return B.approve(b, r).then(function (x) { return recordCharge(b, q).then(function () { x.price = q; done.push(x); }); }, function (e) { if (e.clash) left++; else throw e; }); });
          }, Promise.resolve()).then(function () {
            var sum = done.reduce(function (n, x) { return n + (x.price ? x.price.total : 0); }, 0);
            return done.length ? B.emailMany(done, r.name, 'approved', '', sum ? '<p><strong>The price:</strong> ' + Q.pounds(sum) + ' for the ' + done.length + ' dates (' +
              done.map(function (x) { return Q.pounds(x.price ? x.price.total : 0); }).join(', ') + ').</p>' +
              '<p>Each date has its own quote to accept:</p><ul>' + done.map(function (x) { return '<li><a href="' + pageLink(x) + '">' + esc(B.when(x)) + '</a></li>'; }).join('') + '</ul>' : '') : null;
          }).then(function () {
            toast('Approved ' + done.length + (left ? '; ' + left + ' not free, still waiting for you' : '') + '. They have been emailed.'); load();
          }).catch(function (e) { toast('Could not approve: ' + (e.message || e)); load(); });
          return;
        }
        act.innerHTML = '<label class="l">Why not? (it goes in the email)</label><input class="inp a-note" maxlength="500">' +
          '<div class="acts"><button class="btn warn a-go">Decline all ' + list.length + '</button></div>';
        act.querySelector('.a-go').onclick = function () {
          var note = act.querySelector('.a-note').value.trim(), done = [];
          list.reduce(function (p, b) { return p.then(function () { return B.decline(b, note).then(function (x) { done.push(x); }); }); }, Promise.resolve())
            .then(function () { return B.emailMany(done, r.name, 'declined', note); })
            .then(function () { toast('Declined, and they have been told'); load(); })
            .catch(function (e) { toast('Could not: ' + (e.message || e)); load(); });
        };
      };
    });
  }

  function times(sel) { var o = ''; for (var m = 360; m <= 1425; m += 15) { var t = B.hhmm(m); o += '<option' + (t === sel ? ' selected' : '') + '>' + t + '</option>'; } return o; }

  function wire(el) {
    el.querySelectorAll('[data-do]').forEach(function (btn) {
      btn.onclick = function () {
        var c = btn.closest('[data-key]'), b = find(c.dataset.key), act = c.querySelector('.act'), what = btn.dataset.do;
        if (what === 'approve') return approve(b, act, false);
        if (what === 'decline' || what === 'cancel') {
          act.innerHTML = '<label class="l">' + (what === 'decline' ? 'Why not? (it goes in the email)' : 'Why? (it goes in the email)') + '</label>' +
            '<input class="inp a-note" maxlength="500"><div class="acts"><button class="btn warn a-go">' + (what === 'decline' ? 'Decline it' : 'Cancel the booking') + '</button></div>';
          act.querySelector('.a-go').onclick = function () {
            var note = act.querySelector('.a-note').value.trim();
            var job = what === 'decline' ? B.decline(b, note) : B.cancel(b, room(b.roomId), note);
            job.then(function (x) { return B.email(x, room(x.roomId).name, what === 'decline' ? 'declined' : 'cancelled', note); })
              .then(function () { toast(what === 'decline' ? 'Declined, and they have been told' : 'Cancelled, and they have been told'); load(); })
              .catch(function (e) { toast('Could not: ' + (e.message || e)); });
          };
          return;
        }
        if (what === 'invoice') {
          btn.disabled = true;
          MONEY.issueOne(b).then(function (inv) { toast('Invoice ' + inv.number + ' issued and emailed'); load(); }).catch(function (e) { btn.disabled = false; toast('Could not issue it: ' + (e.message || e)); });
          return;
        }
        if (what === 'dtake') {
          act.innerHTML = '<div class="two"><div><label class="l">How</label><select class="d-how">' + ['Card', 'Bank transfer', 'Cash', 'Cheque'].map(function (m) { return '<option>' + m + '</option>'; }).join('') + '</select></div>' +
            '<div><label class="l">Date</label><input class="inp d-date" type="date" value="' + B.today() + '"></div></div><div class="acts"><button class="btn d-go">Record it as taken</button></div>';
          act.querySelector('.d-go').onclick = function () { damage(b, { status: 'held', amount: CHARGES[b.key].damageDeposit, method: act.querySelector('.d-how').value, takenOn: act.querySelector('.d-date').value || B.today() }); };
          return;
        }
        if (what === 'dreturn') {
          var dd = CHARGES[b.key].damage;
          act.innerHTML = '<div class="two"><div><label class="l">Returned £</label><input class="inp d-amt" type="number" min="0" step="0.01" value="' + (dd.amount / 100).toFixed(2) + '"></div>' +
            '<div><label class="l">How</label><select class="d-how">' + ['Card', 'Bank transfer', 'Cash', 'Cheque'].map(function (m) { return '<option>' + m + '</option>'; }).join('') + '</select></div>' +
            '<div><label class="l">Date</label><input class="inp d-date" type="date" value="' + B.today() + '"></div>' +
            '<div><label class="l">Why any is kept (it goes in the email)</label><input class="inp d-note" maxlength="300"></div></div><div class="acts"><button class="btn d-go">Record it</button></div>';
          act.querySelector('.d-go').onclick = function () {
            var back = Math.min(dd.amount, Q.toPence(act.querySelector('.d-amt').value)), kept = dd.amount - back, note = act.querySelector('.d-note').value.trim();
            if (kept && !note) { toast('Say why some is kept'); return; }
            damage(b, Object.assign({}, dd, { status: back ? 'returned' : 'kept', returned: back, kept: kept, note: note, returnMethod: act.querySelector('.d-how').value, closedOn: act.querySelector('.d-date').value || B.today() }));
          };
          return;
        }
        if (what === 'pay') {
          var ch = CHARGES[b.key], left = Math.max(0, ch.total - paidOf(ch));
          act.innerHTML = '<div class="two"><div><label class="l">Amount £</label><input class="inp p-amt" type="number" min="0" step="0.01" value="' + (left / 100).toFixed(2) + '"></div>' +
            '<div><label class="l">How</label><select class="p-how">' + ['Bank transfer', 'Cash', 'Cheque', 'Card on the day'].map(function (m) { return '<option>' + m + '</option>'; }).join('') + '</select></div>' +
            '<div><label class="l">Date</label><input class="inp p-date" type="date" value="' + B.today() + '"></div>' +
            '<div><label class="l">Reference (optional)</label><input class="inp p-ref" maxlength="80"></div></div>' +
            '<div class="acts"><button class="btn p-go" data-kind="payment">Record the payment</button><button class="btn sec p-go" data-kind="refund">Record a refund</button></div>';
          act.querySelectorAll('.p-go').forEach(function (g) { g.onclick = function () { pay(b, act, g.dataset.kind); }; });
          return;
        }
        if (what === 'cancelrest') {
          var rest = [b].concat(laterIn(b));
          act.innerHTML = '<label class="l">Why? (it goes in the email)</label><input class="inp a-note" maxlength="500">' +
            '<div class="acts"><button class="btn warn a-go">Cancel these ' + rest.length + '</button></div>';
          act.querySelector('.a-go').onclick = function () {
            var note = act.querySelector('.a-note').value.trim(), done = [];
            rest.reduce(function (p, x) { return p.then(function () { return B.cancel(x, room(x.roomId), note).then(function (y) { done.push(y); }); }); }, Promise.resolve())
              .then(function () { return B.emailMany(done, room(b.roomId).name, 'cancelled', note); })
              .then(function () { toast('Cancelled ' + done.length + ', and they have been told'); load(); })
              .catch(function (e) { toast('Could not: ' + (e.message || e)); load(); });
          };
          return;
        }
        if (what === 'move') {
          var rs = ROOMS.filter(function (x) { return x.siteId === V.site; });
          act.innerHTML = '<div class="two"><div><label class="l">Room</label><select class="m-room">' + rs.map(function (x) {
              return '<option value="' + esc(x.id) + '"' + (x.id === b.roomId ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div>' +
            '<div><label class="l">Date</label><input class="inp m-day" type="date" value="' + esc(b.day) + '"></div>' +
            '<div><label class="l">Start</label><select class="m-start">' + times(B.hhmm(b.startMin)) + '</select></div>' +
            '<div><label class="l">Finish</label><select class="m-end">' + times(B.hhmm(b.endMin)) + '</select></div></div>' +
            '<div class="acts"><button class="btn m-go">Move it</button></div><div class="m-out"></div>';
          act.querySelector('.m-go').onclick = function () { move(b, act, false); };
        }
      };
    });
  }

  /* ---- payments (Chunk 5, stage 2) ----
     Recorded by hand: how much, how, when, a reference. A refund is the
     same, the other way. The charge says unpaid, part-paid or paid; the
     booking carries the same, so the hirer's page can show it; the payer
     gets a receipt. */
  function paidOf(ch) { return (ch.payments || []).reduce(function (n, p) { return n + (p.kind === 'refund' ? -p.amount : p.amount); }, 0); }
  function pay(b, act, kind) {
    var ch = CHARGES[b.key], amount = Q.toPence(act.querySelector('.p-amt').value);
    if (!amount) { toast('Type the amount'); return; }
    var w = EGBCAuth.user() || {}, entry = { kind: kind, amount: amount, method: act.querySelector('.p-how').value, date: act.querySelector('.p-date').value || B.today(),
      ref: act.querySelector('.p-ref').value.trim().slice(0, 80), by: w.uid || '', at: new Date().toISOString() };
    var payments = (ch.payments || []).concat([entry]), net = paidOf({ payments: payments });
    var status = b.status === 'cancelled' && net <= 0 ? 'cancelled' : net >= ch.total ? 'paid' : net > 0 ? 'part-paid' : 'unpaid';
    db().collection('charges').doc(ch.id).update({ payments: payments, status: status, updatedAt: new Date().toISOString(), updatedBy: w.uid || '' })
      .then(function () { return db().collection('bookings').doc(b.key).update({ payment: { status: status, paid: net, total: ch.total } }); })
      .then(function () {
        var to = (ch.payer || {}).email;
        return to ? EGBCChurch.send({ to: [to], subject: (kind === 'refund' ? 'Refund: ' : 'Payment received: ') + Q.pounds(amount) + ', ' + room(b.roomId).name + ', ' + B.when(b),
          html: EGBCChurch.wrap(kind === 'refund' ? 'We have refunded you' : 'Thank you, we have your payment',
            '<p>' + Q.pounds(amount) + ' by ' + esc(entry.method.toLowerCase()) + ' on ' + esc(EGBCEvents.fmtDate(entry.date + 'T12:00')) + (entry.ref ? ' (reference ' + esc(entry.ref) + ')' : '') + '.</p>' +
            '<p>' + (status === 'paid' ? 'That is paid in full: ' + Q.pounds(ch.total) + '.' : 'Paid so far: ' + Q.pounds(net) + ' of ' + Q.pounds(ch.total) + '.') + '</p>' +
            '<p style="color:#6b7280;font-size:13px">' + esc(room(b.roomId).name) + ', ' + esc(B.when(b)) + ', reference ' + esc(B.ref(b)) + '</p>' + linkButton(b, 'See your booking')) }) : null;
      })
      .then(function () { EGBCAccounts.sendPayment(ch, entry, payments.length - 1); return MONEY.settleInvoice(ch.invoiceId); })
      .then(function () { toast(kind === 'refund' ? 'Refund recorded' : 'Payment recorded: ' + status.replace('-', ' ')); load(); })
      .catch(function (e) { toast('Could not record it: ' + (e.message || e)); });
  }

  /* ---- the damage deposit, taken and returned (stage 3) ---- */
  function damageWords(d) {
    if (!d || d.status === 'none') return 'not taken yet';
    if (d.status === 'held') return 'held (' + esc(d.method || '') + ', ' + esc(d.takenOn || '') + ')';
    if (d.status === 'returned') return 'returned ' + Q.pounds(d.returned) + (d.kept ? ', kept ' + Q.pounds(d.kept) + ' (' + esc(d.note || '') + ')' : '');
    return 'kept ' + Q.pounds(d.kept) + ' (' + esc(d.note || '') + ')';
  }
  function damage(b, d) {
    var ch = CHARGES[b.key];
    db().collection('charges').doc(ch.id).update({ damage: d, updatedAt: new Date().toISOString(), updatedBy: (EGBCAuth.user() || {}).uid || '' })
      .then(function () { return db().collection('bookings').doc(b.key).update({ damage: { status: d.status, amount: d.amount, returned: d.returned || 0, kept: d.kept || 0, note: d.note || '' } }); })
      .then(function () {
        var to = (ch.payer || {}).email;
        if (!to || d.status === 'held') return;
        return EGBCChurch.send({ to: [to], subject: 'Your damage deposit: ' + room(b.roomId).name + ', ' + B.when(b),
          html: EGBCChurch.wrap('Your damage deposit', '<p>' + (d.returned ? 'We have returned ' + Q.pounds(d.returned) + ' by ' + esc(String(d.returnMethod || '').toLowerCase()) + '.' : '') +
            (d.kept ? ' We have kept ' + Q.pounds(d.kept) + ': ' + esc(d.note) + '.' : ' That is all of it.') + '</p>' + linkButton(b, 'See your booking')) });
      }).then(function () { toast(d.status === 'held' ? 'Damage deposit recorded as taken' : 'Damage deposit recorded'); load(); })
      .catch(function (e) { toast('Could not record it: ' + (e.message || e)); });
  }

  /* ---- asking to cancel (Martin, F-080) ----
     The hirer asks from their page; the office cancels the booking or
     keeps it, says why, and records any refund as a payment. */
  function askCard(b) {
    var c = b.cancelRequest, r = room(b.roomId), ch = CHARGES[b.key], paid = ch ? paidOf(ch) : 0;
    var at = c.at && c.at.toDate ? c.at.toDate() : new Date(c.at);
    return '<div class="card bk" data-key="' + esc(b.key) + '" data-ask="' + esc(b.key) + '"><div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap">' +
      '<div><h3>' + esc(b.title || 'Booking') + '</h3><span class="hint">' + esc(r.name) + ', ' + esc(B.when(b)) + ' · reference ' + esc(B.ref(b)) + '</span></div><span class="pill no">Asking to cancel</span></div>' +
      '<p style="margin:8px 0">' + esc((b.requester || {}).name || b.memberName || '') + ' asked on ' + esc(isNaN(at) ? '' : at.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' })) +
      (c.reason ? ': "' + esc(c.reason) + '"' : '.') + '</p>' + (paid ? '<p class="hint">They have paid ' + Q.pounds(paid) + '. Cancelling then offers to record a refund.</p>' : '') +
      '<label class="l">Your answer (it goes in the email)</label><input class="inp a-answer" maxlength="500">' +
      '<div class="acts"><button class="btn warn" data-askdo="cancel">Cancel the booking</button><button class="btn sec" data-askdo="keep">Keep the booking</button></div><div class="act"></div></div>';
  }
  function wireAsks(el) {
    el.querySelectorAll('[data-askdo]').forEach(function (btn) {
      btn.onclick = function () {
        var c = btn.closest('[data-ask]'), b = find(c.dataset.ask), answer = c.querySelector('.a-answer').value.trim(), act = c.querySelector('.act');
        var who = EGBCAuth.user() || {}, reply = { status: btn.dataset.askdo === 'cancel' ? 'accepted' : 'declined', at: b.cancelRequest.at, reason: b.cancelRequest.reason || '',
          answer: answer.slice(0, 500), answeredAt: new Date().toISOString(), answeredBy: who.uid || '' };
        if (btn.dataset.askdo === 'keep') {
          if (!answer) { toast('Say why it is kept'); return; }
          db().collection('bookings').doc(b.key).update({ cancelRequest: reply }).then(function () {
            return B.email(b, room(b.roomId).name, 'kept', answer);
          }).then(function () { toast('Kept, and they have been told'); load(); }).catch(function (e) { toast('Could not: ' + (e.message || e)); });
          return;
        }
        B.cancel(b, room(b.roomId), answer || 'Cancelled, as you asked.').then(function () {
          return db().collection('bookings').doc(b.key).update({ cancelRequest: reply });
        }).then(function () {
          var ch = CHARGES[b.key];
          if (ch && !paidOf(ch)) return db().collection('charges').doc(ch.id).update({ status: 'cancelled', updatedAt: new Date().toISOString() });
        }).then(function () {
          return B.email(Object.assign({}, b, { status: 'cancelled' }), room(b.roomId).name, 'cancelled', answer || 'Cancelled, as you asked.');
        }).then(function () {
          var ch = CHARGES[b.key], paid = ch ? paidOf(ch) : 0;
          if (!paid) { toast('Cancelled, and they have been told'); return load(); }
          /* The refund, recorded as a payment the other way. */
          b.status = 'cancelled';
          act.innerHTML = '<p class="st wait">Cancelled. They had paid ' + Q.pounds(paid) + ': record the refund.</p>' +
            '<div class="two"><div><label class="l">Amount £</label><input class="inp p-amt" type="number" min="0" step="0.01" value="' + (paid / 100).toFixed(2) + '"></div>' +
            '<div><label class="l">How</label><select class="p-how">' + ['Bank transfer', 'Cash', 'Cheque', 'Card on the day'].map(function (m) { return '<option>' + m + '</option>'; }).join('') + '</select></div>' +
            '<div><label class="l">Date</label><input class="inp p-date" type="date" value="' + B.today() + '"></div><div><label class="l">Reference (optional)</label><input class="inp p-ref" maxlength="80"></div></div>' +
            '<div class="acts"><button class="btn p-go">Record the refund</button></div>';
          act.querySelector('.p-go').onclick = function () { pay(b, act, 'refund'); };
          c.querySelectorAll('[data-askdo]').forEach(function (x) { x.disabled = true; });
        }).catch(function (e) { toast('Could not cancel: ' + (e.message || e)); });
      };
    });
    el.querySelectorAll('[data-addhirer]').forEach(function (btn) {
      btn.onclick = function () {
        var b = find(btn.dataset.addhirer), q = b.requester || {};
        V.tab = 'hirers'; draw();
        MONEY.drawHirers(document.getElementById('list'), null, { name: q.name || '', org: q.org || '', email: String(q.email || '').toLowerCase(), phone: q.phone || '', charity: !!b.charity });
      };
    });
  }

  /* A clash is refused unless the office books over it on purpose, with
     a reason. */
  function overrideBox(act, msg, go) {
    var box = document.createElement('div');
    box.innerHTML = '<div class="st no">' + esc(msg) + ' To book it anyway, say why.</div><input class="inp o-note" maxlength="500" placeholder="The fire drill moved; agreed with the band">' +
      '<div class="acts"><button class="btn warn o-go">Book it anyway</button></div>';
    act.appendChild(box);
    box.querySelector('.o-go').onclick = function () {
      var n = box.querySelector('.o-note').value.trim();
      if (!n) { toast('Give a reason first'); return; }
      go(n);
    };
  }
  function approve(b, act, note) {
    var q = priceOf(b);
    B.approve(b, room(b.roomId), note ? { override: true, note: note } : {}).then(function (x) {
      return recordCharge(b, q).then(function () { return B.email(x, room(x.roomId).name, 'approved', '', priceWords(q, b)); });
    }).then(function () { toast('Approved, and they have been emailed'); load(); }).catch(function (e) {
      if (e.clash) { act.innerHTML = ''; overrideBox(act, e.message, function (n) { approve(b, act, n); }); }
      else toast('Could not approve: ' + (e.message || e));
    });
  }
  function move(b, act, note) {
    var n = { day: act.querySelector('.m-day').value, start: act.querySelector('.m-start').value, end: act.querySelector('.m-end').value };
    var to = room(act.querySelector('.m-room').value);
    B.move(b, room(b.roomId), to, n, note ? { override: true, note: note } : {}).then(function (x) {
      return b.status === 'confirmed' ? B.email(x, to.name, 'moved', note || '') : null;
    }).then(function () { toast('Moved' + (b.status === 'confirmed' ? ', and they have been emailed' : '')); load(); }).catch(function (e) {
      if (e.clash) { act.querySelector('.m-out').innerHTML = ''; overrideBox(act.querySelector('.m-out'), e.message, function (nt) { move(b, act, nt); }); }
      else toast('Could not move: ' + (e.message || e));
    });
  }

  /* ---- the setup sheet (R3) ----
     What to set up where, day by day and room by room: the times with
     setting up and clearing away, how many and the layout, sound and
     projection, kit and where to fetch it from, refreshments, notes. The
     kitchen's list underneath each day. Printing prints the sheet only. */
  function drawSetup(el) {
    var span = V.span || 1, days = []; for (var i = 0; i < span; i++) days.push(B.addDays(V.day, i));
    var LAY = {}; (window.EGBCRooms ? EGBCRooms.LAYOUTS : []).forEach(function (x) { LAY[x.id] = x.label; });
    var kitHome = function (id) { var k = KIT.filter(function (x) { return x.id === id; })[0]; return k && k.homeRoomId ? room(k.homeRoomId).name : ''; };
    var diets = function (f) { return Object.keys(f.dietary || {}).map(function (k) { return f.dietary[k] + ' ' + ({ vegetarian: 'vegetarian', vegan: 'vegan', glutenFree: 'gluten-free', dairyFree: 'dairy-free' }[k] || k); }).join(', '); };
    var body = days.map(function (d) {
      var those = LIST.filter(function (b) { return b.day === d && b.status === 'confirmed'; }).sort(byTime);
      var rooms = ROOMS.filter(function (r) { return those.some(function (b) { return b.roomId === r.id; }); });
      var food = those.filter(function (b) { return b.refreshments && b.refreshments.needed; });
      return '<section class="sheet-day" data-sheetday="' + d + '"><h3>' + esc(EGBCEvents.fmtDate(d + 'T12:00')) + '</h3>' +
        (rooms.length ? rooms.map(function (r) {
          return '<div class="sheet-room"><h4>' + esc(r.name) + '</h4>' + those.filter(function (b) { return b.roomId === r.id; }).map(function (b) {
            var f = b.refreshments || {}, q = b.requester || {};
            return '<div class="sheet-b" data-sheet="' + esc(b.key) + '">' +
              '<div class="w">' + (b.setupMins ? 'Set up from ' + B.hhmm(b.startMin - b.setupMins) + ' · ' : '') + B.hhmm(b.startMin) + '–' + B.hhmm(b.endMin) + ' ' + esc(b.title || 'Booking') +
                (b.packdownMins ? ' · cleared by ' + B.hhmm(b.endMin + b.packdownMins) : '') + '</div>' +
              '<div>' + esc(b.people) + ' people' + (b.layout ? ', set out ' + esc((LAY[b.layout] || b.layout).toLowerCase()) : '') + '</div>' +
              (b.av && b.av.needed ? '<div>Sound and projection: ' + esc(b.av.what || 'yes') + '</div>' : '') +
              ((b.resources || []).length ? '<div>Kit: ' + b.resources.map(function (x) { var h = kitHome(x.id); return esc(x.qty + ' × ' + x.name) + (h && h !== r.name ? ' (from ' + esc(h) + ')' : ''); }).join(', ') + '</div>' : '') +
              (f.needed ? '<div>Refreshments' + (f.servingAt ? ' at ' + esc(f.servingAt) : '') + ': ' + (f.items || []).map(function (i) { return esc(i.qty + ' × ' + i.name); }).join(', ') + (diets(f) ? ' (' + esc(diets(f)) + ')' : '') + '</div>' : '') +
              (b.notes ? '<div>Notes: ' + esc(b.notes) + '</div>' : '') +
              '<div class="hint">' + esc(q.name || b.memberName || '') + (q.phone ? ', ' + esc(q.phone) : '') + '</div></div>';
          }).join('') + '</div>';
        }).join('') : '<p class="hint">Nothing to set up.</p>') +
        (food.length ? '<div class="kitchen" data-kitchen="' + d + '"><b>Kitchen</b>' + food.map(function (b) {
          var f = b.refreshments;
          return '<div>' + esc(f.servingAt || B.hhmm(b.startMin)) + ', ' + esc(room(b.roomId).name) + ': ' + (f.items || []).map(function (i) { return esc(i.qty + ' × ' + i.name); }).join(', ') +
            (diets(f) ? '; ' + esc(diets(f)) : '') + (f.notes ? '; ' + esc(f.notes) : '') + '</div>';
        }).join('') + '</div>' : '') + '</section>';
    }).join('');
    el.innerHTML = '<div class="card"><div class="row"><div class="f"><label class="l" for="s-day">From</label><input class="inp" type="date" id="s-day" value="' + esc(V.day) + '"></div>' +
      '<div><button class="tab' + (span === 1 ? ' on' : '') + '" id="s-1">One day</button> <button class="tab' + (span === 7 ? ' on' : '') + '" id="s-7">A week</button></div>' +
      '<div style="margin-left:auto"><button class="btn" id="s-print">Print</button></div></div>' +
      '<div id="print"><h2 style="font-size:18px">Setup sheet: ' + esc(site().name) + ', ' + esc(EGBCEvents.fmtDate(days[0] + 'T12:00')) +
        (span > 1 ? ' to ' + esc(EGBCEvents.fmtDate(days[span - 1] + 'T12:00')) : '') + '</h2>' + body + '</div></div>';
    document.getElementById('s-day').onchange = function () { if (this.value) { V.day = this.value; drawSetup(el); } };
    document.getElementById('s-1').onclick = function () { V.span = 1; drawSetup(el); };
    document.getElementById('s-7').onclick = function () { V.span = 7; drawSetup(el); };
    document.getElementById('s-print').onclick = function () { window.print(); };
  }

  /* Every room at the site on one day, with what is booked. */
  function drawDay(el) {
    var rs = ROOMS.filter(function (r) { return r.siteId === V.site; });
    el.innerHTML = '<div class="card"><div class="row"><div class="f"><label class="l" for="d-day">Day</label><input class="inp" type="date" id="d-day" value="' + esc(V.day) + '"></div>' +
      '<div><button class="btn sec" id="d-prev">&larr;</button> <button class="btn sec" id="d-next">&rarr;</button></div></div><div class="scroll"><div id="d-grid"></div></div><div id="d-list"></div></div>';
    document.getElementById('d-day').onchange = function () { if (this.value) { V.day = this.value; drawDay(el); } };
    document.getElementById('d-prev').onclick = function () { V.day = B.addDays(V.day, -1); drawDay(el); };
    document.getElementById('d-next').onclick = function () { V.day = B.addDays(V.day, 1); drawDay(el); };
    B.loadDays(rs, V.day).then(function (days) {
      document.getElementById('d-grid').innerHTML = B.axis() + rs.map(function (r) {
        return B.bar(days[r.id], { label: r.name, service: function (i) { return B.serviceAt(site(), r.id, V.day, i); } });
      }).join('') + B.key(false);
      var that = LIST.filter(function (b) { return b.day === V.day && b.status !== 'cancelled' && b.status !== 'declined'; });
      document.getElementById('d-list').innerHTML = that.length ? that.map(function (b) {
        return '<p style="margin:8px 0 0">' + B.hhmm(b.startMin) + '–' + B.hhmm(b.endMin) + ' <b>' + esc(room(b.roomId).name) + '</b>: ' + esc(b.title) +
          (b.status === 'requested' ? ' <span class="pill wait">Waiting</span>' : '') + '</p>'; }).join('') : '<p class="hint" style="margin:8px 0 0">No bookings that day.</p>';
    });
  }

  EGBCAuth.require().then(function (profile) {
    return Promise.all([db().collection('sites').get(), db().collection('rooms').get(), db().collection('bookingSettings').get(),
                        db().collection('bookableResources').get().catch(function () { return { docs: [] }; }),
                        db().collection('bookingTypes').get().catch(function () { return { docs: [] }; }),
                        db().collection('rateCards').get().catch(function () { return { docs: [] }; })]).then(function (r) {
      var all = function (s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); };
      var mid = (profile && profile.memberId) || '-', settings = {};
      all(r[2]).forEach(function (s) { settings[s.id] = s; });
      SITES = all(r[0]).filter(function (s) { return s.active !== false && (EGBCAuth.isAdmin() || ((settings[s.id] || {}).bookingsAdmins || []).indexOf(mid) >= 0); })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      ROOMS = all(r[1]).filter(function (x) { return x.kind !== 'online'; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      KIT = all(r[3]);
      MCTX.isAdmin = EGBCAuth.isAdmin();
      all(r[4]).forEach(function (t) { TYPES[t.id] = t; });
      all(r[5]).forEach(function (c) { CARDS[c.id] = c; });
      if (!SITES.length) {
        document.getElementById('main').innerHTML = '<div class="card">This page is for the people who look after room bookings. To book a room, use <a href="rooms.html" style="color:var(--brand)">Book a room</a>.</div>';
        return;
      }
      V.site = SITES[0].id;
      return load();
    });
  }).catch(function (e) { document.getElementById('main').innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
})();
</script>
</body>
</html>
