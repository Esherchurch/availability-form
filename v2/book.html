<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask to book a room</title>

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="egbc-ui.js?v=202610062100"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610062100"></script>
<script src="egbc-church.js?v=202610101000"></script>
<script src="egbc-poweredby.js?v=202610081518"></script>
<script src="egbc-email.js?v=202610062100"></script>
<script src="egbc-ics.js?v=202610091200"></script>
<script src="egbc-events.js?v=202610072300"></script>
<script src="egbc-events-rooms.js?v=202610081800"></script>
<script src="egbc-events-bookings.js?v=202610101900"></script>
<script src="egbc-events-bookform.js?v=202610101200"></script>
<script src="egbc-events-quote.js?v=202610101700"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;--card:0 1px 2px rgba(16,24,40,.05);
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;--gold:#b07d2e;--gold-bg:#fdf8ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 72px}
  h1{font-size:24px;font-weight:700;color:var(--ink);margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;font:500 14px Inter,sans-serif;
       cursor:pointer;border:1px solid transparent;background:var(--brand);color:#fff;text-decoration:none}
  .btn:hover{background:var(--brand-dark)} .btn:disabled{opacity:.55;cursor:default}
  .hint{font-size:13px;color:var(--muted)}
  .st{border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0}
  .st.ok{background:var(--ok-bg);color:var(--ok)}.st.wait{background:var(--gold-bg);color:var(--gold)}.st.no{background:var(--danger-bg);color:var(--danger)}
  .scroll{overflow-x:auto}.scroll>div{min-width:480px}
  .quote{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;background:#fbfcfc}.quote h2{font-size:15px;font-weight:600;color:var(--ink)}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:90;display:none;max-width:90vw}
  /* The plain header for the public hire pages: the church's logo and name
     (from Church details) and a way back to the list. No hub menu, no
     sign-in - someone arriving from the church website stays in these pages. */
  .chead{background:#fff;border-bottom:1px solid var(--line)}
  .ch-in{max-width:1000px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ch-logo{width:32px;height:32px;object-fit:contain;border-radius:6px}
  .ch-name{font-size:15px;font-weight:600;color:var(--ink);flex:1;min-width:0}
  /* Marked out as buttons, so they read as things to click (F-067). */
  .ch-back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:13px;font-weight:500;color:var(--brand);text-decoration:none}
  .ch-back:hover{background:var(--tint)}
</style>
</head>
<body>
<header class="chead" id="chead"></header>
<div class="wrap" id="wrap">
  <h1>Ask to book a room</h1>
  <p class="sub">Tell us when, and what for. Nothing is booked until we confirm it by email.</p>
  <div class="card" id="day"></div>
  <div class="card"><div id="kind"></div><div id="f"><p class="hint">Loading…</p></div><div id="f-status"></div><div id="quoteBox"></div>
    <div style="text-align:right;margin-top:10px"><button class="btn" id="f-go" disabled>Send the request</button></div></div>
</div>
<div id="toast"></div>

<footer id="poweredby"></footer>
<script>
(function () {
  'use strict';
  /* NEXT-BRIEF §19: the one small credit, from the shared snippet. */
  if (window.EGBCPoweredBy) EGBCPoweredBy.mount(document.getElementById('poweredby'));
  EGBCChurch.closeOnLeave();
  var B = window.EGBCBookings, R = window.EGBCRooms;
  var ROOMS = [], SITES = {}, MENUS = [], DAYS = null, OPENED = Date.now(), TYPES = [], CARDS = {}, QT = window.EGBCQuote;
  function kind() { var t = document.getElementById('bt'); return TYPES.filter(function (x) { return t && x.id === t.value; })[0] || null; }
  function charity() { var c = document.getElementById('charity'); return !!(c && c.checked); }
  /* A room's prices for the kind of booking, read once. */
  function cardFor(roomId, typeId) {
    var k = roomId + '__' + typeId;
    if (k in CARDS) return Promise.resolve(CARDS[k]);
    return EGBCAuth.db.collection('rateCards').doc(k).get().then(function (s) { CARDS[k] = s.exists ? s.data() : null; return CARDS[k]; }, function () { return null; });
  }
  /* The instant quote: what these times, this room and these extras cost,
     line by line, as the form is filled in (Chunk 5). For a repeating
     booking, every date is priced (a Saturday costs more). */
  function quoteFor(v, r, dates) {
    var t = kind(), box = document.getElementById('quoteBox');
    if (!t || !t.charged || !r || !dates.length) { box.innerHTML = ''; return Promise.resolve(null); }
    return cardFor(r.id, t.id).then(function (card) {
      if (!card) { box.innerHTML = '<div class="st wait">We will send you a price for this.</div>'; return null; }
      var each = dates.map(function (d) {
        return QT.price({ card: card, day: d, start: B.toMin(v.start), end: B.toMin(v.end), setup: v.setup, pack: v.pack, people: v.people,
          items: v.refreshments.needed ? v.refreshments.items : [], kit: [], av: v.av, charity: charity() });
      });
      var all = each.reduce(function (n, x) { return n + x.total; }, 0);
      box.innerHTML = '<div class="quote" id="quote"><h2 style="margin:0 0 8px">Your quote' + (dates.length > 1 ? ', for ' + esc(EGBCEvents.fmtDate(dates[0] + 'T12:00')) : '') + '</h2>' +
        QT.table(each[0], { id: 'quoteTable' }) +
        (dates.length > 1 ? '<p style="margin:8px 0 0"><b id="quoteAll">' + dates.length + ' dates in all: ' + QT.pounds(all) + '</b></p>' : '') +
        '<p class="hint" style="margin:8px 0 0">An estimate from our price list' + (charity() ? ', with the charity rate, which we will check' : '') +
        '. We confirm the price when we confirm the booking.</p></div>';
      return each;
    });
  }
  var Q = new URLSearchParams(location.search);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.display = 'none'; }, 4000); }
  function roomById(id) { return ROOMS.filter(function (r) { return r.id === id; })[0]; }
  function form() { return document.getElementById('f'); }

  /* The room's day, so people can see when it is free before they ask. */
  var checking = 0, PLAN = null;
  function check(v) {
    var go = document.getElementById('f-go'), out = document.getElementById('f-status'), r = roomById(v.rooms[0]), mine = ++checking;
    go.disabled = true; PLAN = null;
    if (!r) { out.innerHTML = '<div class="st wait">Choose a room.</div>'; return; }
    var s = B.slots(B.toMin(v.start), B.toMin(v.end), v.setup, v.pack);
    var day = v.day || B.today();
    var list = v.day && v.repeat.rule && v.repeat.until ? B.repeatDays(v.day, v.repeat.rule, v.repeat.until) : [day];
    Promise.all(list.map(function (d) { return B.loadDays([r], d); })).then(function (all) {
      if (mine !== checking) return;
      var days = {}, site = SITES[r.siteId] || {};
      list.forEach(function (d, i) { days[r.id + '_' + d] = all[i][r.id]; });
      document.getElementById('day').innerHTML = '<h2>' + esc(r.name) + ', ' + esc(EGBCEvents.fmtDate(day + 'T12:00')) + '</h2>' +
        '<div class="scroll"><div>' + B.axis(true) + B.bar(all[0][r.id], { service: function (i) { return B.serviceAt(site, r.id, day, i); }, pick: s && v.day ? s : null }) + B.key(false) + '</div></div>' +
        '<p class="hint" style="margin:8px 0 0"><a href="room.html?id=' + encodeURIComponent(r.id) + '" style="color:var(--brand)">More about this room</a></p>';
      var msg = [], chosen = [];
      if (!v.day) msg.push(['wait', 'Choose a date.']);
      else if (v.day < B.today()) msg.push(['no', 'That date has gone.']);
      else if (!s) msg.push(['no', 'The finish has to be after the start, and with setting up and clearing away it has to fit within the day.']);
      else if (v.repeat.rule && !v.repeat.until) msg.push(['wait', 'Choose when it stops repeating.']);
      else if (v.repeat.rule) {
        /* A repeating request: every date checked, the ones not free left out. */
        var report = list.map(function (d) {
          var sl = days[r.id + '_' + d], free = B.free(sl, s), sv = '';
          for (var k = s.from; k < s.to && !free && !sv; k++) sv = sl[k] ? B.serviceAt(site, r.id, d, k) : '';
          return { day: d, ok: free, why: free ? '' : (sv || 'booked') };
        });
        EGBCBookForm.dates(form(), report);
        var skip = EGBCBookForm.values(form()).skip;
        chosen = report.filter(function (x) { return x.ok && skip.indexOf(x.day) < 0; }).map(function (x) { return x.day; });
        if (!chosen.length) msg.push(['no', 'None of those dates is free.']);
      } else if (!B.free(all[0][r.id], s)) msg.push(['no', 'The room is not free for all of that time. The day above shows when it is.']);
      else chosen = [v.day];
      if (r.fireMax && v.people > r.fireMax) msg.push(['no', 'This room can never hold more than ' + r.fireMax + ' people.']);
      if (!v.title || !(v.people > 0)) msg.push(['wait', 'Say what it is for, and how many people.']);
      if (!v.requester.name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.requester.email)) msg.push(['wait', 'We need your name and email to reply.']);
      out.innerHTML = msg.length ? msg.map(function (m) { return '<div class="st ' + m[0] + '">' + esc(m[1]) + '</div>'; }).join('')
        : '<div class="st ok">' + (chosen.length > 1 ? 'The room is free on ' + chosen.length + ' of those dates.' : 'The room is free then.') + ' We will look at your request and email you.</div>';
      if (!msg.length) PLAN = { dates: chosen, days: days, rule: v.repeat.rule };
      quoteFor(v, r, chosen).then(function (q) { if (PLAN && mine === checking) PLAN.quotes = q; });
      go.disabled = msg.length > 0;
    });
  }

  function submit() {
    var v = EGBCBookForm.values(form()), go = document.getElementById('f-go'), r = roomById(v.rooms[0]), plan = PLAN;
    if (!plan || !r) return;
    /* Robots fill in the hidden box, or send the form within a second or
       two of opening it. They are thanked and nothing is saved. */
    if (v.trap || Date.now() - OPENED < 4000) { thanks([], r); return; }
    go.disabled = true; go.textContent = 'Sending…';
    var sid = plan.rule ? 's_' + EGBCEvents.key(12) : '', list;
    try {
      list = plan.dates.map(function (d, i) {
        return { booking: B.prepare({ kind: 'hire', room: r, site: SITES[r.siteId], day: d, start: v.start, end: v.end, setup: v.setup, pack: v.pack,
          title: v.title, people: v.people, layout: v.layout, av: v.av, refreshments: v.refreshments, resources: [], notes: v.notes, requester: v.requester,
          series: sid ? { id: sid, rule: plan.rule, n: i + 1, of: plan.dates.length } : null }) };
      });
      /* The kind of booking, the charity tick and the quote they saw go with
         the request; the office confirms the price. */
      list.forEach(function (x, i) {
        var t = kind();
        if (t) x.booking.bookingType = t.id;
        x.booking.charity = charity();
        var qt = plan.quotes && plan.quotes[i];
        if (qt) x.booking.quote = { lines: qt.lines, subtotal: qt.subtotal, vat: qt.vat, vatRate: qt.vatRate, total: qt.total, deposit: qt.deposit, damageDeposit: qt.damageDeposit, by: 'price list' };
      });
    } catch (e) { toast(e.message); go.disabled = false; go.textContent = 'Send the request'; return; }
    B.write(list, plan.days).then(function (made) {
      return Promise.all([B.emailMany(made, r.name, 'waiting'), B.tellOffice(made, r.name, SITES[r.siteId])]).then(function () { thanks(made, r); });
    }).catch(function (e) {
      toast(/permission/i.test(String(e && (e.code || e.message))) ? 'That time has just been taken. Please look again.' : 'Sorry, that could not be sent. Please try again.');
      go.disabled = false; go.textContent = 'Send the request';
      check(EGBCBookForm.values(form()));
    });
  }

  function thanks(made, r) {
    var b = made[0];
    document.getElementById('wrap').innerHTML = '<h1>Thank you</h1><div class="card" id="done">' +
      '<p style="margin:0 0 8px">We have your request for <b>' + esc(r.name) + '</b>' + (b ? (made.length > 1 ? ', ' + made.length + ' dates from ' : ', ') + esc(B.when(b)) : '') + '.</p>' +
      '<p style="margin:0 0 8px">Nothing is booked yet. We will look at it and email you either way.</p>' +
      (b ? '<p class="hint" style="margin:0">Your reference' + (made.length > 1 ? 's are' : ' is') + ' <b id="ref">' + made.map(function (x) { return esc(B.ref(x)); }).join(', ') + '</b>.</p>' : '') + '</div>' +
      '<p><a href="room.html?id=' + encodeURIComponent(r.id) + '" style="color:var(--brand)">Back to ' + esc(r.name) + '</a></p>';
  }

  EGBCChurch.load().then(function () {
    EGBCChurch.header(document.getElementById('chead'), { back: true });
    EGBCChurch.title('Ask to book a room');
    var db = EGBCAuth.db;
    return Promise.all([db.collection('rooms').where('active', '==', true).get(), db.collection('sites').where('active', '==', true).get(),
                        db.collection('menus').where('active', '==', true).get().catch(function () { return { docs: [] }; }),
                        db.collection('bookingTypes').where('active', '==', true).get().catch(function () { return { docs: [] }; })]);
  }).then(function (r) {
    r[1].docs.forEach(function (d) { SITES[d.id] = Object.assign({ id: d.id }, d.data()); });
    ROOMS = R.hireable(r[0].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    MENUS = r[2].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    TYPES = r[3].docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).filter(function (t) { return t.forPublic; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    document.getElementById('kind').innerHTML = TYPES.length ? '<div class="bf"><div class="field"><label class="l" for="bt" style="display:block;font-size:13px;font-weight:500;color:var(--ink);margin:0 0 5px">What kind of booking</label>' +
      '<select id="bt" style="width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font:400 14px Inter,sans-serif">' +
      TYPES.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>'; }).join('') + '</select></div>' +
      '<label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 12px"><input type="checkbox" id="charity" style="width:16px;height:16px;accent-color:var(--brand)"> We are a registered charity</label></div>' : '';
    ['bt', 'charity'].forEach(function (id) { var el = document.getElementById(id); if (el) el.onchange = function () { check(EGBCBookForm.values(form())); }; });
    if (!ROOMS.length) { document.getElementById('wrap').innerHTML = '<div class="card">No rooms are open for hire just now.</div>'; return; }
    var want = Q.get('room') || Q.get('id') || '';
    EGBCBookForm.render(form(), { rooms: ROOMS, multi: false, chosen: [roomById(want) ? want : ROOMS[0].id], day: Q.get('day') || '',
      start: Q.get('start') || '', end: Q.get('end') || '', menus: MENUS, kit: null, contact: true, onChange: check });
    document.getElementById('f-go').onclick = submit;
    check(EGBCBookForm.values(form()));
  }).catch(function () {
    document.getElementById('wrap').innerHTML = '<div class="card">The booking form could not be loaded. Please try again later.</div>';
  });
})();
</script>
</body>
</html>
