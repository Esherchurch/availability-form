<!-- VAL'S CARD MAKER (comms window; FINDINGS-comms C-17, decision 5).
     Feature name cardMaker: off until a master admin turns it on. For the
     office job and master admins.

     Pick an event from What's On, a size, a style and a movement; the card
     is drawn here (a canvas, nothing sent anywhere) and saved as an
     animated GIF for the e-news, a short video for social media and the
     screens, or a picture (PNG) for anything else and print.

     A NEW HUB PAGE, NOT CALLA DESIGN. Social Media Maker and Calla Photo
     are not touched (decision 5). The video is made the way Social Media
     Maker makes its (MediaRecorder from the canvas); the GIF uses the
     Email Compiler's GIF maker, now shared as egbc-gif.js.

     MOVEMENT NEVER HIDES THE WORDS. Outlook on Windows shows only a GIF's
     first frame, so every movement here moves the photo or the button and
     the words are all there from the first frame (C-8).

     "Save to library": the picture (PNG) for every size, now. GIFs and
     videos go in once the picture library keeps them whole (C-16, a
     request to the events window); until then they download.

     SOCIAL POSTS, STEP 1 (FINDINGS-comms plan H; Martin, 20 Oct): the
     church's two kinds of post. An event's post - the card in Instagram's
     portrait (1080x1350, as the church posts), square, Facebook and Story
     sizes, with its caption written from the event in the church's way (a
     first line, then 📅 🕝 📍 🎟 👉, then the hashtags), and a COUNTDOWN
     (the same card on the days before, a new first line each day). And the
     VERSE OF THE DAY, the hub's own: a verse a day (egbc-votd.js) from a
     Bible the church may use, in the hub's own designs. "Today's posts" at
     the top has each day's ready: Copy caption, Share (the phone's own
     sheet, straight into Instagram or Facebook) or Download. Nothing is
     posted for the church: step 2 (posting straight to the church's Page)
     needs Meta's approval, and Martin has said not now. -->

<style>

<script>
(function () {
  'use strict';
  var wrap = document.getElementById('wrap');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.className = 'on'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.className = ''; }, 3200); }

  /* ---- what can be made ------------------------------------------------- */
  var SIZES = {
    enews:    { label: 'E-news', w: 940, h: 788, gif: true },
    portrait: { label: 'Instagram', w: 1080, h: 1350, video: true, social: true },
    insta:    { label: 'Square', w: 1080, h: 1080, video: true, social: true },
    facebook: { label: 'Facebook', w: 1200, h: 630, video: true, social: true },
    story:    { label: 'Story', w: 1080, h: 1920, video: true, social: true },
    screen:   { label: 'Screen', w: 1920, h: 1080, video: true },
    a5:       { label: 'A5 print', w: 1748, h: 2480, print: true }
  };
  var STYLES = {
    shade: 'Words on the photo',
    panel: 'Colour panel beside',
    below: 'Words below the photo'
  };
  /* Each moves the photo or the button; the words never move (C-8). */
  var MOVES = { none: 'None', zoom: 'Gentle zoom', pan: 'Slow pan', pulse: 'Button pulse' };
  var S = { size: 'enews', style: 'shade', move: 'zoom', accent: '#3d6263', ev: null, photo: null, photoUrl: '',
            words: { kicker: '', title: '', when: '', button: '' },
            mode: 'event', vstyle: 'type', verse: { text: '', ref: '', version: '', copyright: '' } };
  /* The hub's own verse designs (plan H): type on the church's colour, on a
     photo, framed, or a band with the reference. Never anyone's artwork. */
  var VSTYLES = { type: 'Plain colour', photo: 'On a photo', frame: 'Framed', band: 'Band' };
  var MODES = { event: 'An event', verse: 'A Bible verse' };
  var SOC = { open: '', tags: '', capEdited: false, settings: {} };
  var EVENTS = [], LOOK = { sites: {}, rooms: {}, venues: {} };
  /* Where it is, in words: the hub's own (egbc-events.js locationText) -
     the room and the site, an outside venue, or Online - never an object
     (22 Oct: "📍 [object Object]"); nothing when the event has no place. */
  function placeOf(e) {
    if (!e || !e.location) return '';
    if (typeof e.location === 'string') return e.location.trim();
    return window.EGBCEvents && EGBCEvents.locationText ? String(EGBCEvents.locationText(e, LOOK) || '').trim() : '';
  }

  /* ---- drawing one frame (t from 0 to 1; 0 is the first frame) ----------- */
  function wrapLines(ctx, text, maxW, maxLines) {
    var words = String(text || '').split(/\s+/).filter(Boolean), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var tryLine = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(tryLine).width > maxW && line) { lines.push(line); line = words[i]; } else line = tryLine;
    }
    if (line) lines.push(line);
    return lines.length <= maxLines ? lines : null;
  }
  function fitTitle(ctx, text, maxW, size, maxLines) {
    for (var s = size; s > size * 0.45; s *= 0.92) {
      ctx.font = '700 ' + Math.round(s) + 'px Inter, Arial, sans-serif';
      var l = wrapLines(ctx, text, maxW, maxLines);
      if (l) return { size: Math.round(s), lines: l };
    }
    ctx.font = '700 ' + Math.round(size * 0.45) + 'px Inter, Arial, sans-serif';
    return { size: Math.round(size * 0.45), lines: (wrapLines(ctx, text, maxW, 99) || [text]).slice(0, maxLines) };
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function photo(ctx, x, y, w, h, t) {
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.translate(x, y);
    if (S.photo) {
      var wave = Math.sin(Math.PI * t);                 /* 0 -> 1 -> 0: loops smoothly */
      EGBCGif.drawCover(ctx, S.photo, w, h, S.move === 'zoom' ? 1 + 0.06 * wave : 1, S.move === 'pan' ? (wave * 2 - 1) * 0.6 : 0);
    } else {
      var g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, S.accent); g.addColorStop(1, '#16282a');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }
    ctx.restore();
  }
  /* THE WORDS ALWAYS FIT THEIR SPACE. Measured first at full size; if the
     block is taller than its space, or any line wider, everything shrinks
     together until it fits (to half size at most). LAST holds the box of
     the last words drawn, so the check can ask whether they fitted. */
  var LAST = null;
  function layout(ctx, maxW, base, boxH) {
    var W = S.words;
    for (var k = 1; k >= 0.5; k -= 0.05) {
      var b = base * k, gap = b * 0.018;
      var title = fitTitle(ctx, W.title || 'Your event', maxW, b * 0.085, 3);
      var kick = Math.round(b * 0.034), when = Math.round(b * 0.042), btn = Math.round(b * 0.04);
      ctx.font = '500 ' + when + 'px Inter, Arial, sans-serif';
      var whenW = W.when ? ctx.measureText(W.when).width : 0;
      ctx.font = '600 ' + kick + 'px Inter, Arial, sans-serif';
      var kickW = W.kicker ? ctx.measureText(W.kicker).width : 0;
      ctx.font = '700 ' + btn + 'px Inter, Arial, sans-serif';
      var bw = W.button ? ctx.measureText(W.button).width + btn * 1.6 : 0;
      var h = (W.kicker ? kick + gap : 0) + title.lines.length * title.size * 1.1 + (W.when ? gap + when * 1.25 : 0) + (W.button ? gap * 2 + btn * 2.2 : 0);
      var widest = Math.max(whenW, kickW, bw);
      ctx.font = '700 ' + title.size + 'px Inter, Arial, sans-serif';
      title.lines.forEach(function (l) { widest = Math.max(widest, ctx.measureText(l).width); });
      var fits = h <= boxH && widest <= maxW;
      if (fits || k <= 0.5) return { b: b, gap: gap, title: title, kick: kick, when: when, btn: btn, bw: bw, h: h, widest: widest, fits: fits };
    }
  }
  function words(ctx, x, y, maxW, base, colour, buttonFill, buttonText, t, anchorBottom, boxH) {
    var W = S.words, L = layout(ctx, maxW, base, boxH);
    var gap = L.gap, cy = anchorBottom ? y - L.h : y + Math.max(0, (boxH - L.h) / 2);
    LAST = { x: x, top: cy, bottom: cy + L.h, right: x + L.widest, maxW: maxW, boxTop: anchorBottom ? y - boxH : y, boxBottom: anchorBottom ? y : y + boxH, fits: L.fits };
    ctx.fillStyle = colour; ctx.textBaseline = 'top';
    if (W.kicker) { ctx.font = '600 ' + L.kick + 'px Inter, Arial, sans-serif'; ctx.globalAlpha = 0.92; ctx.fillText(W.kicker, x, cy); ctx.globalAlpha = 1; cy += L.kick + gap; }
    ctx.font = '700 ' + L.title.size + 'px Inter, Arial, sans-serif';
    L.title.lines.forEach(function (l) { ctx.fillText(l, x, cy); cy += L.title.size * 1.1; });
    if (W.when) { cy += gap; ctx.font = '500 ' + L.when + 'px Inter, Arial, sans-serif'; ctx.fillText(W.when, x, cy); cy += L.when * 1.25; }
    if (W.button) {
      cy += gap * 2;
      ctx.font = '700 ' + L.btn + 'px Inter, Arial, sans-serif';
      var bw = L.bw, bh = L.btn * 2.2;
      var pulse = S.move === 'pulse' ? 1 + 0.07 * Math.sin(Math.PI * t) : 1;
      ctx.save(); ctx.translate(x + bw / 2, cy + bh / 2); ctx.scale(pulse, pulse);
      roundRect(ctx, -bw / 2, -bh / 2, bw, bh, L.b * 0.012); ctx.fillStyle = buttonFill; ctx.fill();
      ctx.fillStyle = buttonText; ctx.textBaseline = 'middle'; ctx.fillText(W.button, -bw / 2 + L.btn * 0.8, 0);
      ctx.restore();
    }
  }
  /* A verse: the words as large as they will go, centred, the reference
     under them, the version's copyright line small at the foot where the
     version needs one. Everything shrinks together until it fits. */
  function verseLines(ctx, text, maxW, maxH, size) {
    for (var sz = size; sz > size * 0.35; sz *= 0.94) {
      /* Measured at the size it is drawn at (rounded), so it never spills
         a few pixels past the box. */
      var z = Math.round(sz);
      ctx.font = '600 ' + z + 'px Georgia, "Times New Roman", serif';
      var lines = wrapLines(ctx, text, maxW, 99) || [text];
      if (lines.length * z * 1.3 <= maxH) return { size: z, lines: lines };
    }
    ctx.font = '600 ' + Math.round(size * 0.35) + 'px Georgia, serif';
    return { size: Math.round(size * 0.35), lines: wrapLines(ctx, text, maxW, 99) || [text] };
  }
  function drawVerse(ctx, w, h, t) {
    var V = S.verse, m = Math.min(w, h), p = Math.round(m * 0.09);
    var text = '\u201c' + String(V.text || 'Choose a verse').trim() + '\u201d', ref = [V.ref, V.version].filter(Boolean).join(' ');
    var dark = S.vstyle === 'type' || S.vstyle === 'photo';
    ctx.clearRect(0, 0, w, h);
    if (S.vstyle === 'photo') {
      photo(ctx, 0, 0, w, h, t);
      ctx.fillStyle = 'rgba(10,25,26,.55)'; ctx.fillRect(0, 0, w, h);
    } else if (S.vstyle === 'type') {
      var g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, S.accent); g.addColorStop(1, '#16282a'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    } else {
      ctx.fillStyle = '#fbf8f2'; ctx.fillRect(0, 0, w, h);
      if (S.vstyle === 'frame') { ctx.strokeStyle = S.accent; ctx.lineWidth = Math.round(m * 0.012); ctx.strokeRect(p * 0.5, p * 0.5, w - p, h - p); }
      if (S.vstyle === 'band') { ctx.fillStyle = S.accent; ctx.fillRect(0, h - Math.round(h * 0.16), w, Math.round(h * 0.16)); }
    }
    var refSize = Math.round(m * 0.045), copySize = Math.round(m * 0.022);
    /* The band design puts the reference in the band, not under the words. */
    var refBlock = S.vstyle === 'band' ? 0 : refSize * 2.4;
    var boxH = h - 2 * p - refBlock - (V.copyright ? copySize * 3 : 0) - (S.vstyle === 'band' ? h * 0.16 : 0);
    var L = verseLines(ctx, text, w - 2 * p, boxH, m * 0.085);
    var total = L.lines.length * L.size * 1.3 + refBlock;
    var top = (S.vstyle === 'band' ? (h * 0.84 - total) / 2 : (h - total) / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = dark ? '#ffffff' : '#1e3a3a';
    ctx.font = '600 ' + L.size + 'px Georgia, "Times New Roman", serif';
    var widest = 0;
    L.lines.forEach(function (l, i) { ctx.fillText(l, w / 2, top + i * L.size * 1.3); widest = Math.max(widest, ctx.measureText(l).width); });
    ctx.font = '700 ' + refSize + 'px Inter, Arial, sans-serif';
    var refY = S.vstyle === 'band' ? h - h * 0.08 - refSize / 2 : top + L.lines.length * L.size * 1.3 + refSize * 0.9;
    ctx.fillStyle = S.vstyle === 'band' ? '#ffffff' : (dark ? '#ffffff' : S.accent);
    ctx.fillText(ref, w / 2, refY);
    if (V.copyright) {
      ctx.font = '400 ' + copySize + 'px Inter, Arial, sans-serif'; ctx.fillStyle = dark ? 'rgba(255,255,255,.75)' : 'rgba(30,58,58,.7)';
      ctx.fillText(String(V.copyright).slice(0, 120), w / 2, (S.vstyle === 'band' ? h * 0.84 : h) - p * 0.5 - copySize * 1.4);
    }
    ctx.textAlign = 'left';
    LAST = { x: (w - widest) / 2, top: top, bottom: top + L.lines.length * L.size * 1.3, right: (w + widest) / 2, maxW: w - 2 * p, boxTop: p, boxBottom: h - p, fits: widest <= w - 2 * p + 1 };
  }
  function draw(ctx, w, h, t) {
    if (S.mode === 'verse') return drawVerse(ctx, w, h, t);
    var base = Math.min(w, h) * (h > w * 1.2 ? 1.15 : 1), p = Math.round(Math.min(w, h) * 0.06);
    ctx.clearRect(0, 0, w, h); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
    if (S.style === 'panel') {
      var side = w >= h, pw = side ? Math.round(w * 0.46) : w, ph = side ? h : Math.round(h * 0.45);
      photo(ctx, side ? pw : 0, side ? 0 : 0, side ? w - pw : w, side ? h : h - ph, t);
      ctx.fillStyle = S.accent; ctx.fillRect(0, side ? 0 : h - ph, pw, ph);
      words(ctx, p, side ? p : h - ph + p, pw - 2 * p, base, '#ffffff', '#ffffff', S.accent, t, false, ph - 2 * p);
    } else if (S.style === 'below') {
      var top = Math.round(h * (h > w ? 0.6 : 0.58));
      photo(ctx, 0, 0, w, top, t);
      ctx.fillStyle = '#fbf8f2'; ctx.fillRect(0, top, w, h - top);
      words(ctx, p, top + p * 0.8, w - 2 * p, base, '#1e3a3a', S.accent, '#ffffff', t, false, h - top - 1.6 * p);
    } else {
      photo(ctx, 0, 0, w, h, t);
      /* "Text on busy photos without a dark overlay" is a DESIGN.md don't. */
      var g = ctx.createLinearGradient(0, h * 0.3, 0, h);
      g.addColorStop(0, 'rgba(10,25,26,0)'); g.addColorStop(0.45, 'rgba(10,25,26,.55)'); g.addColorStop(1, 'rgba(10,25,26,.88)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      words(ctx, p, h - p, w - 2 * p, base, '#ffffff', '#ffffff', '#2a4a4b', t, true, Math.round(h * 0.62));
    }
  }
  /* For the checks: draw a frame into any canvas, as the page would. */
  window.EGBCCards = { draw: function (c, t) { draw(c.getContext('2d'), c.width, c.height, t || 0); return LAST; }, state: S, SIZES: SIZES, caption: function () { return captionNow(); } };

  /* ---- the frames ---------------------------------------------------------- */
  var N = 14;
  function frames(sz) {
    var c = document.createElement('canvas'); c.width = sz.w; c.height = sz.h;
    var ctx = c.getContext('2d', { willReadFrequently: true }), out = [];
    var n = S.move === 'none' ? 1 : N;
    for (var i = 0; i < n; i++) { draw(ctx, sz.w, sz.h, n === 1 ? 0 : i / (n - 1)); out.push(ctx.getImageData(0, 0, sz.w, sz.h).data); }
    return out;
  }
  function blobOf(canvas, type) { return new Promise(function (res) { canvas.toBlob(res, type || 'image/png'); }); }
  function stillPng(sz) {
    var c = document.createElement('canvas'); c.width = sz.w; c.height = sz.h; draw(c.getContext('2d'), sz.w, sz.h, 0);
    return blobOf(c, 'image/png');
  }
  function makeGif(sz) {
    var f = frames(sz);
    /* About 1.3 seconds of movement, then a pause on the full card. */
    var delays = f.map(function (_, i) { return i === f.length - 1 ? 150 : 9; });
    return EGBCGif.encode(f, sz.w, sz.h, { delays: delays, dither: true });

  function makeVideo(sz) {

        '<div class="row" style="margin-top:6px"><button type="button" class="btn sec" id="s-keep">Keep these for this event</button><button type="button" class="btn sec" id="s-usual">Keep as the church\u2019s usual</button></div>' +
        '<label class="f" for="s-cap">Caption</label><textarea id="s-cap"></textarea>' +
        '<div class="row" style="margin-top:8px"><button type="button" class="btn sec" id="s-copy">Copy caption</button><button type="button" class="btn" id="s-share">Share</button><button type="button" class="btn sec" id="s-dl">Download the pictures</button></div>' +
        '<p class="m">Share opens the phone\u2019s own share sheet with the picture (Instagram, Facebook, WhatsApp\u2026); paste the caption in. Download gives Instagram (1080\u00d71350), square, Facebook and Story sizes.</p>' +
        '<details id="cd"><summary>Make it a countdown</summary><p class="m" style="margin:0">The same card on the days before, with a new first line each day. Each day\u2019s post waits in Today\u2019s posts, ready.</p>' +
          '<div class="days">' + DAYS.map(function (d) { return '<label><input type="checkbox" id="cd-' + d[0] + '"' + (d[0] >= 1 && d[0] <= 3 ? ' checked' : '') + '> ' + (d[0] === 0 ? 'On the day' : d[0] === 1 ? 'The day before' : d[0] + ' days before') + '</label><input type="text" id="cdl-' + d[0] + '" value="' + esc(d[1]) + '" maxlength="140" aria-label="First line">'; }).join('') + '</div>' +
          '<button type="button" class="btn" id="cd-save">Save the countdown</button></details></div>' +
      '<div class="card" id="vod"><h2>Verse of the day</h2><p class="m" style="margin:0">The hub\u2019s own: a verse for each day of the year, in the hub\u2019s designs, ready in Today\u2019s posts each morning.</p>' +
        '<label class="tick" style="display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500;color:var(--ink)"><input type="checkbox" id="vod-on" style="width:20px;height:20px;accent-color:var(--brand)"> Have one ready each morning</label>' +
        '<label class="f" for="vod-ver">Bible</label><select id="vod-ver"><option value="bundled|BSB|BSB">Berean Standard Bible (free)</option></select>' +
        '<label class="f">Design</label>' + chips('vod-style', VSTYLES, 'vstyle') +
        '<label class="tick" style="display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500;color:var(--ink)"><input type="checkbox" id="vod-photo" style="width:20px;height:20px;accent-color:var(--brand)"> Use a picture from the picture library (a different one each day)</label>' +
        '<label class="f" for="vod-credit">Credit line (optional; in the caption)</label><input type="text" id="vod-credit" maxlength="140">' +
        '<label class="tick" style="display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500;color:var(--ink)"><input type="checkbox" id="remind" style="width:20px;height:20px;accent-color:var(--brand)"> Email me each morning when a post is ready</label>' +
        '<div class="row" style="margin-top:8px"><button type="button" class="btn" id="vod-save">Save</button></div></div>';
    document.getElementById('ev').onchange = function () { chooseEvent(this.value); };
    wireSocial();
    ['kicker', 'title', 'when', 'button'].forEach(function (k) { document.getElementById('w-' + k).oninput = function () { S.words[k] = this.value; preview(); }; });
    document.getElementById('w-accent').oninput = function () { S.accent = this.value; preview(); };
    /* A photo from Unsplash: shown from there, and its credit goes in the
       caption ("Photo by <name> on Unsplash"), as Unsplash asks. */
    var wu = document.getElementById('w-unsplash');
    if (wu) wu.onclick = function () {
      EGBCUnsplash.pick({ shape: S.size === 'story' ? 'portrait' : '' }).then(function (p) {
        if (!p) return;
        setPhoto(p.regular); S.credit = EGBCUnsplash.credit(p);
        if (S.mode === 'verse' && S.vstyle !== 'photo' && VSTYLES.photo) { S.vstyle = 'photo'; Array.prototype.forEach.call(document.querySelectorAll('#vstyles button'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === 'photo')); }); }
        document.getElementById('w-credit').textContent = EGBCUnsplash.creditText(S.credit) + ' (in the caption).';
        EGBCUnsplash.used(p); refreshCaption();
      });
    };
    wire('sizes', 'size'); wire('styles', 'style'); wire('moves', 'move'); wire('vstyles', 'vstyle'); wire('modes', 'mode');
    Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function (b) { b.addEventListener('click', function () { SOC.open = ''; var o = document.getElementById('s-open'); if (o) o.value = ''; showMode(); refreshCaption(true); }); });
    Array.prototype.forEach.call(document.querySelectorAll('#vod-style button'), function (b) {
      b.onclick = function () { Array.prototype.forEach.call(document.querySelectorAll('#vod-style button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); }); };
    });
    showMode(); loadToday();
    outputs();
    var first = new URLSearchParams(location.search).get('event');
    if (first && EVENTS.some(function (e) { return e.id === first; })) { document.getElementById('ev').value = first; chooseEvent(first); }
    else if (EVENTS[0]) { document.getElementById('ev').value = EVENTS[0].id; chooseEvent(EVENTS[0].id); }
    else preview();
  }

  function showMode() {
    var v = S.mode === 'verse';
    document.getElementById('m-event').hidden = v; document.getElementById('m-verse').hidden = !v;
    document.getElementById('st-event').hidden = v; document.getElementById('st-verse').hidden = !v;
    document.getElementById('w-card').hidden = v;
    if (v && S.size === 'enews') { S.size = 'portrait'; Array.prototype.forEach.call(document.querySelectorAll('#sizes button'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === 'portrait')); }); }
    preview(); outputs();
  }
  function bibleOptions(sel, want) {
    if (!window.EGBCBible) return;
    Promise.all([EGBCBible.versions().catch(function () { return []; }), EGBCBible.apiVersions().catch(function () { return []; })]).then(function (r) {
      sel.innerHTML = r[0].map(function (x) { return '<option value="bundled|' + esc(x.id) + '|' + esc(x.abbrev) + '">' + esc(x.name) + ' (free)</option>'; })
        .concat(r[1].map(function (x) { return '<option value="apibible|' + esc(x.id) + '|' + esc(String(x.abbrev || '').toUpperCase()) + '">' + esc(x.name) + ' (church key)</option>'; })).join('');
      if (want && [].some.call(sel.options, function (o) { return o.value === want; })) sel.value = want;
      else { var b = [].filter.call(sel.options, function (o) { return /\|BSB\|/.test(o.value); })[0]; if (b) sel.value = b.value; }
    });
  }
  function bringVerse(ref) {
    var sel = document.getElementById('v-ver'), parts = sel.value.split('|'), msg = document.getElementById('v-msg');
    if (!EGBCBible.parse(ref)) { msg.textContent = 'That reference was not understood. Try, for example, "Psalm 23:1".'; return; }
    msg.textContent = 'Bringing it in\u2026';
    (parts[0] === 'apibible' ? EGBCBible.apiPassage(parts[1], ref, parts[2]) : EGBCBible.passage(parts[1] || 'BSB', ref)).then(function (p) {
      S.verse = { text: (p.verses || []).map(function (x) { return x.text; }).join(' ').replace(/\s+/g, ' ').trim(), ref: p.ref, version: p.version || parts[2] || '',
        copyright: parts[0] === 'apibible' || /NIV|ESV|NLT/i.test(p.version || '') ? (p.copyright || '') : '' };
      document.getElementById('v-ref').value = p.ref; document.getElementById('v-text').value = S.verse.text; document.getElementById('v-copy').value = S.verse.copyright;
      msg.textContent = 'Brought in. You can still change the words.'; preview(); refreshCaption();
    }, function (e) { msg.textContent = (e && e.message) || 'That did not work.'; });
  }
  function wireSocial() {
    var g = function (id) { return document.getElementById(id); };
    g('s-open').oninput = function () { SOC.open = this.value; refreshCaption(); };
    g('s-tags').value = SOC.tags; g('s-tags').oninput = function () { SOC.tags = this.value; refreshCaption(); };
    g('s-cap').oninput = function () { SOC.capEdited = true; };
    g('s-keep').onclick = function () { if (!S.ev) { toast('Choose an event first.'); return; } var sets = Object.assign({}, SOC.settings.sets || {}); sets[eventKey(S.ev)] = SOC.tags.slice(0, 400); saveSettings({ sets: sets }).then(function () { toast('Kept for ' + (S.ev.title || 'this event') + '.'); }, function (e) { toast('Not saved: ' + (e.message || e)); }); };
    g('s-usual').onclick = function () { saveSettings({ usual: SOC.tags.slice(0, 400) }).then(function () { toast('Kept as the church\u2019s usual hashtags.'); }, function (e) { toast('Not saved: ' + (e.message || e)); }); };
    g('s-copy').onclick = function () { copyText(g('s-cap').value).then(function () { toast('Caption copied.'); }); };
    g('s-share').onclick = function () { var sz = SIZES[SIZES[S.size].social ? S.size : 'portrait']; stillPng(sz).then(function (b) { return sharePost(b, fileName('post', sz, 'png'), g('s-cap').value); }).then(function (how) { toast(how === 'shared' ? 'Shared.' : 'Caption copied and the picture downloaded: paste the caption in.'); }, function () {}); };
    g('s-dl').onclick = function () { var self = this; busy(self, 'Making the pictures\u2026', function () { return socialSizes().reduce(function (pr, k) { return pr.then(function () { return stillPng(SIZES[k]).then(function (b) { download(b, fileName('post', SIZES[k], 'png')); }); }); }, Promise.resolve()); }, function () { return 'The pictures are downloading.'; }); };
    g('cd-save').onclick = function () { var self = this; busy(self, 'Saving\u2026', saveCountdown, function (n) { return n ? n + (n === 1 ? ' post' : ' posts') + ' saved: each waits in Today\u2019s posts on its day.' : 'Nothing saved.'; }); };
    /* The verse. */
    bibleOptions(g('v-ver'));
    g('v-get').onclick = function () { bringVerse(g('v-ref').value.trim()); };
    g('v-today').onclick = function () { g('v-ref').value = EGBCVotd.forDate(new Date()); bringVerse(g('v-ref').value); };
    g('v-text').oninput = function () { S.verse.text = this.value; preview(); refreshCaption(); };
    g('v-copy').oninput = function () { S.verse.copyright = this.value; preview(); refreshCaption(); };
    /* The verse of the day's settings. */
    var V = SOC.settings.vod || {};
    g('vod-on').checked = V.on === true; g('vod-photo').checked = V.photo === 'library'; g('vod-credit').value = V.credit || '';
    g('remind').checked = (SOC.settings.remind || []).indexOf((EGBCAuth.user() || {}).uid) >= 0;
    Array.prototype.forEach.call(document.querySelectorAll('#vod-style button'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === (V.style || 'type'))); });
    bibleOptions(g('vod-ver'), V.version ? V.version.source + '|' + V.version.id + '|' + V.version.abbrev : '');
    g('vod-save').onclick = function () {
      var parts = g('vod-ver').value.split('|'), me = (EGBCAuth.user() || {}).uid, rem = (SOC.settings.remind || []).filter(function (x) { return x !== me; });
      if (g('remind').checked && me) rem.push(me);
      var st = (document.querySelector('#vod-style button[aria-pressed="true"]') || {}).getAttribute ? document.querySelector('#vod-style button[aria-pressed="true"]').getAttribute('data-v') : 'type';
      saveSettings({ vod: { on: g('vod-on').checked, version: { source: parts[0] || 'bundled', id: parts[1] || 'BSB', abbrev: parts[2] || 'BSB' }, style: st, photo: g('vod-photo').checked ? 'library' : '', credit: g('vod-credit').value.trim().slice(0, 140) }, remind: rem.slice(0, 20) })
        .then(function () { toast('Saved.'); loadToday(); }, function (e) { toast('Not saved: ' + (e.message || e)); });
    };
  }

  EGBCAuth.require().then(EGBCComms.ready).then(function () {
    if (!EGBCComms.mayOffice()) { wrap.innerHTML = '<div class="card"><h1>Card maker</h1><p>This page is for the church office and master admins.</p></div>'; return; }
    if (!(EGBCAuth.uses && EGBCAuth.uses('cardMaker'))) { wrap.innerHTML = '<div class="card"><h1>Card maker</h1><p>The card maker is switched off for this church. A master admin can turn it on in Church settings, under “What does your church use?”.</p></div>'; return; }
    if (window.EGBCChurch) EGBCChurch.load().then(function () {}, function () {});
    var now = Date.now();
    return Promise.all([EGBCComms.eventsBetween(now - 86400000, now + 90 * 86400000),
      EGBCAuth.db.collection('socialSettings').doc('main').get().then(function (s) { return s.exists ? s.data() : {}; }, function () { return {}; }),
      window.EGBCEvents && EGBCEvents.lookups ? EGBCEvents.lookups().catch(function () { return LOOK; }) : Promise.resolve(LOOK)]).then(function (r) {
      LOOK = r[2] || LOOK;
      EVENTS = r[0].filter(function (e) { return e.status !== 'cancelled' && e.source !== 'rota' && e.visibility !== 'unlisted' && e.visibility !== 'team'; });
      SOC.settings = r[1] || {};
      page();
    });
  }).catch(function (e) { wrap.innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
})();
</script>
</body>
</html>
