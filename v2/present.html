<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Present</title>

<script src="egbc-nosend.js?v=202611011200"></script>
<script src="egbc-appmode.js?v=202611011200"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js?v=202611011500"></script>
<script src="egbc-help.js?v=202610281800"></script>
<script src="egbc-church.js?v=202611011200"></script>
<script src="egbc-events.js?v=202610281600"></script>
<script src="egbc-quiz.js?v=202611021000"></script>
<script src="egbc-present.js?v=202610311200"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b1116;color:#e2e8f0;font-family:Inter,system-ui,sans-serif}
  #app{min-height:100%}
  .msg{max-width:560px;margin:15vh auto;padding:20px;text-align:center;color:#cbd5e1}
  .msg a{color:#a7d4d4}
  .verses .ref{font-size:.55em;letter-spacing:.12em;text-transform:uppercase;color:#a7d4d4;margin:0 0 .6em}
  .verses .cr{font-size:.32em;color:#94a3b8;margin-top:1em}
</style>
</head>
<body>
<div id="app"><p class="msg">Loading…</p></div>
<script>
(function () {
  'use strict';
  /* PRESENT A SESSION (F-223 Part 2, F-242): present.html?s=<session>
     The session's steps in order - its PowerPoint slides, Bible verses,
     the memory verse, text and pictures - presented with EGBCPresent: the
     leader's phone (or laptop) presents; the TV (&tv=1) shows the slides
     full screen; the team follow on their own phones. The group's leaders
     present (and master admins); its team watch. The rules say the same. */
  var Q = new URLSearchParams(location.search), SID = Q.get('s') || '', TV = Q.get('tv') === '1';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function msg(t) { document.getElementById('app').innerHTML = '<p class="msg">' + t + '</p>'; }
  function db() { return EGBCAuth.db; }

  /* The session's steps, as the engine's items - the same list on every screen. */
  function itemsFor(s) {
    var out = [], notes = [], decks = [];
    (s.parts || []).forEach(function (p, pi) {
      (p.show || []).forEach(function (st, si) {
        if (st.type === 'pptx' && st.deckId) { decks.push(st.deckId); out.push({ deck: st.deckId }); return; }
        /* the quiz (F-255), behind its own switch: off, its steps are left out */
        if (st.type === 'quiz' && (st.questions || []).length && !(EGBCAuth.uses && !EGBCAuth.uses('quiz'))) { out.push({ kind: 'quiz', key: 'p' + pi + 's' + si, title: st.name || p.title || 'Quiz', questions: st.questions }); return; }
        if (st.type === 'text') out.push({ kind: 'html', html: '<div>' + esc(st.words).replace(/\n/g, '<br>') + '</div>' });
        else if (st.type === 'memory' || st.type === 'verses') out.push({ kind: 'html', html: '<div class="verses"><p class="ref">' + esc(st.ref || (s.passage || {}).ref || 'The Bible') + '</p><div>' + esc(st.text || st.words || (s.passage || {}).text || '') + '</div>' + ((s.passage || {}).copyright ? '<p class="cr">' + esc(s.passage.copyright) + '</p>' : '') + '</div>' });
        else if (st.type === 'picture' && st.url) out.push({ kind: 'image', full: st.url, thumb: st.url });
        else return;
      });
    });
    /* each deck: its slides, in place */
    return Promise.all(decks.map(function (id) {
      return db().collection('presentDecks').doc(id).get().then(function (d) {
        var x = d.exists ? d.data() : null;
        return x && x.status === 'ready' ? EGBCPresent.deckItems(id, x.count, x.media, x.ratio) : [];
      }, function () { return []; });
    })).then(function (got) {
      var byDeck = {}, all = [], notesOf = [];
      decks.forEach(function (id, i) { byDeck[id] = got[i]; });
      out.forEach(function (o) {
        if (o.deck) (byDeck[o.deck] || []).forEach(function (it, k) { all.push(it); notesOf.push([o.deck, k]); });
        else { all.push(o); notesOf.push(null); }
      });
      var readers = {};
      return { items: all, notesFor: function (i) { var w = notesOf[i]; if (!w) return Promise.resolve(''); readers[w[0]] = readers[w[0]] || EGBCPresent.notesReader(w[0]); return readers[w[0]](w[1]); } };
    });
  }

  /* Someone outside the group, or a master admin viewing as them: the same kind words, never a rules error. */
  var NOT_YOURS = 'This session belongs to a group you’re not part of, so its slides aren’t shown here.';
  /* Opened from the Menu, with no session: this person's groups' sessions,
     the next ones first, each to present or follow. */
  function chooser(me, master) {
    /* their teams and the ones their core teams cover (H-15), asked in 30s (Firestore's "in" takes 30) - no limit */
    var c = db().collection('planGroups'), mid = me.memberId || '-', teams = (me.teams || []).concat(EGBCAuth.coversOfTeams ? EGBCAuth.coversOfTeams(me.teams || []) : []).filter(function (t, i, a) { return a.indexOf(t) === i; });
    var qs = master ? [c.get()] : [c.where('leaderIds', 'array-contains', mid).get()];
    for (var ti = 0; !master && ti < teams.length; ti += 30) qs.push(c.where('teamName', 'in', teams.slice(ti, ti + 30)).get());
    return Promise.all(qs.map(function (q) { return q.catch(function () { return { docs: [] }; }); })).then(function (r) {
      var groups = {}; r.forEach(function (s) { s.docs.forEach(function (d) { var g = d.data(); if (!g.archived) groups[d.id] = g; }); });
      var ids = Object.keys(groups), from = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      return Promise.all(ids.map(function (id) {
        return db().collection('planSessions').where('groupId', '==', id).get().then(function (s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }, function () { return []; });
      })).then(function (lists) {
        var all = [].concat.apply([], lists).filter(function (s) { return (s.date || '') >= from; }).sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); }).slice(0, 12);
        var day = function (d) { try { return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); } catch (e) { return d; } };
        document.title = 'Present';
        document.getElementById('app').innerHTML = '<div style="max-width:640px;margin:0 auto;padding:24px 16px">' +
          '<h1 style="font:800 26px Inter,sans-serif;color:#fff;margin:0 0 4px">Present</h1><p style="color:#94a3b8;margin:0 0 16px">Your groups’ sessions. Leaders present; everyone else follows on their own phone. <a href="present-guide.html" style="color:#a7d4d4">How to present</a></p>' +
          (all.length ? all.map(function (s) { var g = groups[s.groupId] || {};
            return '<a href="present.html?s=' + encodeURIComponent(s.id) + '" style="display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;margin:0 0 10px;border:1px solid #22303b;border-radius:14px;background:#121a21;color:#e2e8f0;text-decoration:none">' +
              '<span style="flex:1"><b style="color:#fff">' + esc(s.title || 'Session') + '</b><br><span style="font-size:13px;color:#94a3b8">' + esc(g.name || '') + ' · ' + esc(day(s.date)) + '</span></span><span style="color:#a7d4d4;font-weight:600">Open ▶</span></a>'; }).join('')
            : '<p class="msg" style="margin:6vh auto">No sessions coming up in your groups. Plan one in the <a href="session-planner.html">session planner</a>, with slides, verses or pictures to show.</p>') + '</div>';
      });
    });
  }
  /* The TV view (&tv=1): the same session, slides only, full screen. A
     leader opens it on the computer connected to the TV; it follows
     whatever they present from their phone. */
  function tvLink(sid) {
    var u = 'present.html?s=' + encodeURIComponent(sid) + '&tv=1';
    return EGBCAuth.churchLink ? EGBCAuth.churchLink(u) : u;
  }
  function tvButton() {
    var a = document.createElement('a');
    a.href = tvLink(SID); a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Open TV view';
    a.title = 'Open this on the computer connected to the TV. It shows the slides full screen and follows what you present.';
    a.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:50;padding:10px 14px;border-radius:999px;background:#1d3b3c;color:#fff;font:600 14px Inter,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35)';
    document.body.appendChild(a);
  }
  EGBCAuth.require().then(function (profile) {
    /* "View as": the viewed person's rights, as the planner does (asSeen). */
    var me = EGBCEvents.asSeen(profile || {}), master = !me.viewingAs && !!(EGBCAuth.isMaster && EGBCAuth.isMaster()), mid = me.memberId || '-';
    if (!SID) return chooser(me, master);
    return db().collection('planSessions').doc(SID).get().then(function (d) {
      if (!d.exists) return msg('That session could not be found.');
      var s = d.data();
      return db().collection('planGroups').doc(s.groupId).get().then(function (g) {
        var grp = g.exists ? g.data() : {};
        var lead = (grp.leaderIds || []).indexOf(mid) >= 0;
        if (!master && !lead && (me.teams || []).concat(EGBCAuth.coversOfTeams ? EGBCAuth.coversOfTeams(me.teams || []) : []).indexOf(grp.teamName || '-') < 0) return msg(NOT_YOURS);
        var may = master || lead;
        return itemsFor(s).then(function (x) {
          if (!x.items.length) return msg('This session has nothing to show yet. In the planner, add slides, verses or a picture to a part.');
          document.title = (s.title || 'Present') + ' · Present';
          EGBCPresent.mount(document.getElementById('app'), {
            key: 'ps_' + SID, context: { type: 'session', groupId: s.groupId, sessionId: SID },
            items: x.items, notesFor: x.notesFor, title: (grp.name ? grp.name + ' · ' : '') + (s.title || 'Session'),
            mayPresent: may && !TV, tv: TV
          });
          if (may && !TV) tvButton();
        });
      });
    });
  }).catch(function (e) { msg(e && e.code === 'permission-denied' ? NOT_YOURS : 'This could not be opened. Check your connection and try again.'); });
})();
</script>
</body>
</html>
