<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-news</title>
<!-- THE WEEKLY E-NEWS (comms window; FINDINGS-comms, plan bebcbd9e accepted
     19 Oct 2026). Feature name enews: off until a master admin turns it on
     in Church settings. For the office job and master admins (rules:
     enewsIssues, enewsSettings).

     An issue is a list of blocks (plain data). egbc-mailblocks.js turns
     them into the email, and decides what is members-only - this page
     never builds email HTML itself. "New e-news" drafts one from What's On,
     the rota and the notices; Val adds the verse and anything else.

     Sending: Schedule saves the two finished copies on the issue and the
     hub's server sends them when the time comes (functions/enews-send.js),
     to confirmed subscribers only; "Send me a test" sends the members' copy
     to you. Subscribers: the list, and "Add someone", through the hub's
     functions (functions/enews.js). Both shut until switch-over. -->
<script src="egbc-nosend.js?v=202610212000"></script>
<script src="egbc-shell.js?v=202610282000" data-title="E-news"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="egbc-notices.js?v=202610252100"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;--muted:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
        --ok:#15803d;--danger:#b0392c;--gold:#b07d2e;--gold-bg:#fdf8ee;--card:0 1px 2px rgba(16,24,40,.05)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:16px 16px 96px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 4px}
  h2{font-size:16px;font-weight:600;color:var(--ink);margin:0 0 10px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:14px;margin-bottom:12px}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin:12px 0 5px}
  input[type=text],input[type=url],input[type=datetime-local],select,textarea{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;font:400 14px Inter,sans-serif;background:#fff;color:var(--ink)}
  textarea{padding:10px;min-height:80px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,98,99,.15)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;font:500 14px Inter,sans-serif;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.ghost{background:none;border-color:transparent;color:var(--danger)}
  .btn:disabled{opacity:.55;cursor:default}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .m{color:var(--muted);font-size:13px}
  .seg{display:flex;background:#eef0f0;border-radius:9px;padding:3px;gap:3px;margin:0 0 12px}
  .seg button{flex:1;min-height:40px;border:0;border-radius:7px;background:none;font:500 13px Inter,sans-serif;color:var(--muted);cursor:pointer}
  .seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .pill{font-size:12px;padding:4px 9px;border-radius:7px;background:var(--tint);color:var(--brand);font-weight:500}
  .pill.gold{background:var(--gold-bg);color:var(--gold)}
  .blk{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;display:flex;align-items:stretch;overflow:hidden}
  .blk.mem{border-color:#e7c98f;background:#fffaf0}
  .blk .mv{display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fafafa}
  .blk .mv button{flex:1;min-width:44px;min-height:44px;border:0;background:none;color:var(--muted);cursor:pointer}
  .blk .mv button:disabled{opacity:.3}
  .blk .th{width:60px;flex:none;background:#dfe7e7 center/cover no-repeat}
  .blk .c{flex:1;min-width:0;padding:10px 12px;border:0;background:none;text-align:left;font:inherit;cursor:pointer;color:inherit}
  .blk .t{font-size:11px;font-weight:600;color:var(--brand)}
  .blk.mem .t{color:var(--gold)}
  .blk .c b{display:block;color:var(--ink);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .blk .c small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .add{width:100%;min-height:46px;border:1.5px dashed var(--line-2);border-radius:12px;background:none;color:var(--brand);font:600 14px Inter,sans-serif;cursor:pointer;margin:4px 0 12px}
  .list a{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  .list a:first-child{border-top:0}
  .list b{color:var(--ink)}
  .st{margin-left:auto;font-size:12px;padding:3px 8px;border-radius:7px;background:var(--tint);color:var(--brand);font-weight:500;white-space:nowrap}
  .st.sent{background:#ecfdf3;color:var(--ok)}
  .frame{background:#e9ecec;border-radius:12px;padding:10px;overflow:hidden}
  .frame iframe{display:block;border:0;background:#fff;border-radius:8px}
  .sheet{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet .in{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 16px 18px}
  @media (min-width:700px){ .sheet{align-items:center} .sheet .in{border-radius:14px} }
  .sheet .hd{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}
  .sheet .hd h2{margin:0;font-size:17px}
  .x{min-width:44px;min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:#fff;cursor:pointer;font-size:18px;color:var(--ink)}
  .tick{display:flex;gap:10px;align-items:center;min-height:44px;margin:8px 0 0;font-weight:500;color:var(--ink)}
  .tick input{width:22px;height:22px;accent-color:var(--brand)}
  .pics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 0}
  .pics button{aspect-ratio:1;border:2px solid transparent;border-radius:8px;background:#eee center/cover no-repeat;cursor:pointer;min-height:44px}
  .pics button[aria-pressed="true"]{border-color:var(--brand)}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .types button{min-height:52px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font:500 14px Inter,sans-serif;color:var(--ink);cursor:pointer;text-align:left;padding:8px 12px}
  .types small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  .foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center;z-index:5}
  .foot .btn{flex:1;max-width:280px}
  .swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .swatches label{display:flex;align-items:center;gap:8px;margin:0;min-height:44px;font-weight:400}
  .swatches input[type=color]{width:44px;height:36px;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:#fff}
  #toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
  #toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card m">Loading…</div></div>
<div id="toast" role="status"></div>
<script>
(function () {
  'use strict';
  var MB = window.EGBCMailBlocks, esc = MB.esc;
  var db = function () { return EGBCAuth.db; };
  var wrap = document.getElementById('wrap');
  var ME = {}, SET = { template: 'classic', colours: {}, church: {} }, CHURCH = {};
  var ISSUE = null, ISSUE_ID = '', DIRTY = false;


  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.className = 'on'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.className = ''; }, 2600); }
  function icons() { if (window.lucide && lucide.createIcons) try { lucide.createIcons(); } catch (e) {} }
  function may() { return EGBCComms.mayOffice(); }
  function usesEnews() { return !!(EGBCAuth.uses && EGBCAuth.uses('enews')); }
  function stamp() { var u = EGBCAuth.user() || {}; return { updatedAt: new Date().toISOString(), updatedBy: u.uid || '' }; }
  var hubBase = EGBCComms.hubBase;
  function londonIso(d) {
    var f = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' });
    var o = {}; f.formatToParts(d).forEach(function (x) { o[x.type] = x.value; });
    return o.year + '-' + o.month + '-' + o.day;
  }

  /* ---- the list of issues --------------------------------------------- */
  function showList() {
    ISSUE = null; ISSUE_ID = '';
    history.replaceState(null, '', location.pathname);
    wrap.innerHTML = '<h1>E-news</h1><p class="sub">The weekly e-news. Start one and the hub fills in What’s On, Sunday and the notices for you.</p>' +
      '<div class="row" style="margin:0 0 12px"><button class="btn" id="new"><i data-lucide="plus" style="width:16px;height:16px"></i>New e-news</button>' +
      '<button class="btn sec" id="newmail"><i data-lucide="mail-plus" style="width:16px;height:16px"></i>New email</button>' +
      '<button class="btn sec" id="tpls"><i data-lucide="layout-template" style="width:16px;height:16px"></i>Templates</button>' +
      '<button class="btn sec" id="newcmm"><i data-lucide="video" style="width:16px;height:16px"></i>Church members\u2019 meeting</button>' +
      '<button class="btn sec" id="look"><i data-lucide="palette" style="width:16px;height:16px"></i>Look and footer</button>' +
      '<button class="btn sec" id="subsb"><i data-lucide="users" style="width:16px;height:16px"></i>Subscribers</button>' +
      '<button class="btn sec" id="welc"><i data-lucide="hand-heart" style="width:16px;height:16px"></i>Welcome emails</button></div>' +
      '<div class="card"><h2>Recent</h2><div class="list" id="issues"><p class="m">Loading…</p></div></div>';
    icons();
    document.getElementById('new').onclick = newIssue;
    document.getElementById('newcmm').onclick = newCmm;
    document.getElementById('newmail').onclick = function () { pickTemplate(); };
    document.getElementById('tpls').onclick = function () { manageTemplates(); };
    document.getElementById('look').onclick = lookSheet;
    document.getElementById('subsb').onclick = showSubscribers;
    document.getElementById('welc').onclick = welcomeSheet;
    /* The latest 30, then "Show more" (C-52: no hidden caps). */
    var IQ = db().collection('enewsIssues').orderBy('createdAt', 'desc');
    IQ.limit(30).get().then(function (s) {
      var el = document.getElementById('issues');
      /* THIS WEEK'S DRAFT MAKES ITSELF (HANDOVER-MAIN rule 13; C-18). The
         first time the office opens the e-news in a week, if nothing has
         been started since Monday, the week's draft is made from What's On,
         the rota and the notices, and opened. Nobody has to remember. */
      var mon = weekOf(new Date());
      /* The welcome emails' words (auto_...) are kept apart: Welcome emails. */
      var docs = s.docs.filter(function (d) { return !/^auto_/.test(d.id); });
      var thisWeek = docs.some(function (d) { return d.data().week !== 'notice' && String(d.data().createdAt || '').slice(0, 10) >= mon; });
      if (!thisWeek && !showList.autoTried) { showList.autoTried = true; newIssue({ auto: true }); return; }
      if (!docs.length) { el.innerHTML = '<p class="m" style="margin:0">None yet. “New e-news” starts the first.</p>'; return; }
      el.innerHTML = '';
      EGBCComms.showMore(el, { query: IQ, size: 30, first: s, what: 'e-news and emails',
        filter: function (d) { return !/^auto_/.test(d.id); },
        wire: function (box) {
          Array.prototype.forEach.call(box.querySelectorAll('a[data-id]'), function (a) {
            a.onclick = function (e) { e.preventDefault(); openIssue(a.getAttribute('data-id')); };
          });
        },
        row: function (d) {
        var x = d.data(), st = x.status || 'draft';
        var word = (x.kind === 'oneoff' ? 'Email \u00b7 ' : '') + (st === 'sent' ? 'Sent' : st === 'scheduled' ? 'Scheduled' : st === 'sending' ? 'Sending' : 'Draft');
        return '<a href="?issue=' + encodeURIComponent(d.id) + '" data-id="' + esc(d.id) + '"><span><b>' + esc(x.subject || 'Untitled') + '</b><br><span class="m">' +
          esc((x.blocks || []).length + ' blocks' + (x.sendAt ? ' · ' + x.sendAt.replace('T', ' ') : '')) + '</span></span><span class="st ' + st + '">' + word + '</span></a>';
      } });
    }).catch(function (e) { document.getElementById('issues').innerHTML = '<p class="m">Could not load: ' + esc(e.message || e) + '</p>'; });
  }

  /* ---- the welcome emails (plan G: sent by themselves) ------------------
     Two emails the server sends by itself (functions/welcome-mail.js), in
     the church's own words: kept as two fixed drafts (enewsIssues/auto_...),
     written in the editor, hidden from the list. Each is switched on here
     (enewsSettings/welcomes) and only once its words are complete: the
     editor keeps its finished copy only while nothing is left to fill in. */
  var AUTO = {
    subscriber: { id: 'auto_subscriber', starter: 'welcome-sub', title: 'New subscriber welcome',
      when: 'Sent by itself when someone confirms their e-news sign-up by email.' },
    newcomer: { id: 'auto_newcomer', starter: 'newcomer', title: 'Newcomer welcome',
      when: 'Sent by itself when someone says hello on \u201cI\u2019m new here\u201d and gives an email address: to that address only, never to anyone under 18. Their message is never in it and it goes to nobody else; the welcomers and the care team hear of a hello just as they do now. It is a welcome, never a referral.' }
  };
  function ensureAuto(k) {
    var A = AUTO[k], ref = db().collection('enewsIssues').doc(A.id);
    return ref.get().then(function (x) {
      if (x.exists) return;
      var t = EGBCStarters.get(A.starter) || { blocks: [] }, u = EGBCAuth.user() || {};
      return ref.set(Object.assign({ subject: String(t.subject || A.title).replace('[Church]', shortName() || '[Church]').slice(0, 200), preheader: String(t.preheader || '').slice(0, 200),
        template: SET.template === 'green' ? 'green' : 'classic', blocks: JSON.parse(JSON.stringify(t.blocks || [])), status: 'draft', sendAt: '', week: 'notice',
        kind: 'oneoff', audience: 'picked', team: '', picked: [], templateId: A.starter, htmlMembers: '', htmlEveryone: '', createdAt: new Date().toISOString(), createdBy: u.uid || '' }, stamp()));
    });
  }
  function welcomeSheet() {
    var s = sheet('Welcome emails', '<p class="m" style="margin:0">Two emails the hub sends by itself, in the church\u2019s own words. Sending opens at go-live.</p><div id="wl"><p class="m">Loading\u2026</p></div>');
    var one = function (id) { return db().collection('enewsIssues').doc(id).get().then(function (x) { return x.exists ? x.data() : null; }, function () { return null; }); };
    var draw = function () {
      Promise.all([db().collection('enewsSettings').doc('welcomes').get().then(function (x) { return x.exists ? x.data() : {}; }, function () { return {}; }), one(AUTO.subscriber.id), one(AUTO.newcomer.id)]).then(function (r) {
        var W = r[0], D = { subscriber: r[1], newcomer: r[2] };
        s.querySelector('#wl').innerHTML = ['subscriber', 'newcomer'].map(function (k) {
          var A = AUTO[k], d = D[k], ready = !!(d && d.htmlEveryone), on = W[k] === true;
          var state = !d ? 'Not written yet.' : ready ? (on ? 'On: it sends by itself.' : 'Ready. Off until you tick it.') : (on ? 'On, but NOT sending: there is still something to fill in.' : 'Still something to fill in: open the words and look at Check.');
          return '<div data-k="' + k + '" style="border-top:1px solid var(--line);padding:12px 0 0;margin:12px 0 0"><b style="color:var(--ink)">' + esc(A.title) + '</b><p class="m" style="margin:4px 0 8px">' + esc(A.when) + '</p>' +
            '<p style="margin:0 0 8px" data-state>' + esc(state) + '</p><div class="row"><button class="btn sec" data-edit>' + (d ? 'Edit the words' : 'Write it') + '</button>' +
            '<label style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" data-on style="width:20px;height:20px;accent-color:var(--brand)"' + (on ? ' checked' : '') + (ready || on ? '' : ' disabled') + '> Send it by itself</label></div></div>';
        }).join('');
        Array.prototype.forEach.call(s.querySelectorAll('[data-k]'), function (row) {
          var k = row.getAttribute('data-k');
          row.querySelector('[data-edit]').onclick = function () { ensureAuto(k).then(function () { location.href = 'enews-edit.html?issue=' + AUTO[k].id; }, function (e) { toast('Not started: ' + (e.message || e)); }); };
          row.querySelector('[data-on]').onchange = function () {
            var next = { subscriber: W.subscriber === true, newcomer: W.newcomer === true }; next[k] = this.checked;
            db().collection('enewsSettings').doc('welcomes').set(Object.assign(next, stamp())).then(function () { toast(next[k] ? AUTO[k].title + ': on.' : AUTO[k].title + ': off.'); draw(); }, function (e) { toast('Not saved: ' + (e.message || e)); draw(); });
          };
        });
      });
    };
    draw();
  }

  /* What's On, read the way What's On reads it (egbc-comms.js). */
  var eventsBetween = EGBCComms.eventsBetween;

  /* ---- a new issue, drafted from What's On, the rota and the notices ---- */
  /* The Monday of this week, in London, as YYYY-MM-DD: an issue made on or
     after it is this week's. */
  function weekOf(d) {
    var t = new Date(londonIso(d) + 'T12:00:00Z');
    t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7));
    return t.toISOString().slice(0, 10);
  }
  /* The church's short name for the top line ("EGBC"), else its name. */
  function shortName() { return String((SET.church && SET.church.shortName) || CHURCH.name || '').trim(); }
  /* The church's buildings, id -> name (a service says where when there is more than one). */
  function sitesById() {
    return db().collection('sites').get().then(function (s) { var o = {}; s.docs.forEach(function (x) { if (x.data().active !== false) o[x.id] = x.data().name || ''; }); return o; }, function () { return {}; });
  }
  function newIssue(opts) {
    opts = opts || {};
    var b = document.getElementById('new'); if (b) { b.disabled = true; b.textContent = 'Drafting…'; }
    var now = new Date(), from = now.getTime() - 86400000, to = now.getTime() + 15 * 86400000;
    var today = londonIso(now);
    /* The coming Sunday (today, if it is Sunday). */
    var d = new Date(today + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + ((7 - d.getUTCDay()) % 7));
    var sunIso = d.toISOString().slice(0, 10);
    Promise.all([
      eventsBetween(from, to),
      /* Every service that Sunday, in every building (C-51): main's
         EGBCPlanStore.dayServices decides which and in what order. */
      db().collection('events').where('date', '==', sunIso).get()
        .then(function (s) { return EGBCPlanStore.dayServices(s.docs.map(function (x) { return Object.assign({ id: x.id }, x.data()); }), sunIso); }, function () { return []; }),
      /* The notices showing now: main's EGBCNotices decides, from all of them. */
      EGBCComms.allDocs(db().collection('news').orderBy('createdAt', 'desc'), 500)
        .then(function (docs) { return docs.map(function (x) { return Object.assign({ id: x.id }, x.data()); }); }, function () { return []; }),
      sitesById()
    ]).then(function (r) {
      var blocks = MB.draft({ now: now, events: r[0], services: r[1], sundayIso: sunIso, sites: r[3],
        sundayLabel: 'Sunday ' + d.getUTCDate() + ' ' + d.toLocaleString('en-GB', { month: 'long', timeZone: 'UTC' }), notices: r[2], base: hubBase() });
      var p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', day: 'numeric', month: 'long' }).format(now);
      ISSUE = { subject: (shortName() + ' e-news ' + p).trim(), preheader: 'What\u2019s happening this week at ' + shortName(), template: SET.template || 'classic', blocks: blocks, status: 'draft', week: weekOf(now) };
      ISSUE_ID = ''; DIRTY = true;
      return save(true);
    }).then(function () { location.href = 'enews-edit.html?issue=' + encodeURIComponent(ISSUE_ID) + (opts.auto ? '&drafted=1' : ''); })
      .catch(function (e) { if (b) { b.disabled = false; b.textContent = 'New e-news'; } toast('Could not draft it: ' + (e.message || e)); });
  }

  function openIssue(id) {
    wrap.innerHTML = '<div class="card m">Loading…</div>';
    db().collection('enewsIssues').doc(id).get().then(function (s) {
      if (!s.exists) { toast('That e-news is not there any more.'); showList(); return; }
      ISSUE = s.data(); ISSUE_ID = id; DIRTY = false;
      /* THE EDITOR IS enews-edit.html (Martin, 21 Oct 2026: the old editor
         replaced). An issue opens there; this page keeps its Send page -
         the editor's "Schedule it" comes here - and a sent issue's. */
      var sendPage = new URLSearchParams(location.search).get('view') === 'send' || !editable();
      if (!sendPage) { location.replace('enews-edit.html?issue=' + encodeURIComponent(id)); return; }

  function editable() { return !ISSUE.status || ISSUE.status === 'draft' || ISSUE.status === 'scheduled'; }

  function save(quiet) {
    if (!ISSUE || !editable()) return Promise.resolve();
    var data = Object.assign({
      subject: String(ISSUE.subject || '').slice(0, 200), preheader: String(ISSUE.preheader || '').slice(0, 200),
      template: ISSUE.template === 'green' ? 'green' : 'classic', blocks: ISSUE.blocks || [],
      status: ISSUE.status === 'scheduled' ? 'scheduled' : 'draft', sendAt: ISSUE.sendAt || '',
      week: String(ISSUE.week || '').slice(0, 10)
    }, stamp());
    /* A one-off email: what it is, who it goes to and where it came from. */
    if (ISSUE.kind === 'oneoff') {
      var aud = ['subscribers', 'members', 'team', 'picked'].indexOf(ISSUE.audience) >= 0 ? ISSUE.audience : 'subscribers';
      Object.assign(data, { kind: 'oneoff', audience: aud, team: String(ISSUE.team || '').slice(0, 60),
        picked: (ISSUE.picked || []).slice(0, 300).map(String), templateId: String(ISSUE.templateId || '').slice(0, 60) });
    }
    /* A scheduled issue carries its two finished copies, made again on every
       save, so what is sent is always what is on the screen. A draft
       carries none. */
    data.htmlMembers = data.status === 'scheduled' ? finalCopy('members') : '';
    data.htmlEveryone = data.status === 'scheduled' ? finalCopy('everyone') : '';
    var ref = ISSUE_ID ? db().collection('enewsIssues').doc(ISSUE_ID) : db().collection('enewsIssues').doc();
    if (!ISSUE_ID) { data.createdAt = new Date().toISOString(); data.createdBy = data.updatedBy; }
    return ref.set(data, { merge: true }).then(function () {
      ISSUE_ID = ref.id; DIRTY = false;
      history.replaceState(null, '', '?issue=' + encodeURIComponent(ref.id));
      if (!quiet) toast('Saved.');
    });
  }
  var saveSoon = (function () { var h; return function () { DIRTY = true; clearTimeout(h); h = setTimeout(function () { save(true).catch(function (e) { toast('Not saved: ' + (e.message || e)); }); }, 900); }; })();

      document.getElementById('wp-make').onclick = function () {

        (DIRTY ? save(true) : Promise.resolve()).then(function () {

        }).then(function (r) {

  /* ---- the subscribers (C-10): the office sees them; every change goes

  function showSubscribers() {
    wrap.innerHTML = '<div class="row" style="margin:0 0 10px"><button class="btn sec" id="back"><i data-lucide="chevron-left" style="width:16px;height:16px"></i>E-news</button></div>' +

      if (s.empty) { el.innerHTML = '<p class="m" style="margin:0">Nobody yet. People join on the sign-up page (enews-signup.html); the old mailing list comes in when the church goes live.</p>'; return; }
      var n = s.docs.filter(function (d) { return d.data().status === 'subscribed'; }).length;
      var row = function (d) {
        var x = d.data(), k = x.consent || {};
        return '<div class="srow" style="display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 0;border-top:1px solid var(--line)"><span style="min-width:0;flex:1"><b style="word-break:break-all;color:var(--ink)">' + esc(x.email) + '</b><br><span class="m">' +
          esc([x.firstName, k.how ? 'agreed: ' + k.how + (k.confirmedAt ? ', ' + String(k.confirmedAt).slice(0, 10) : '') : ''].filter(Boolean).join(' · ')) + '</span></span>' +
          '<span class="st' + (x.status === 'subscribed' ? ' sent' : '') + '">' + esc(W[x.status] || x.status) + '</span></div>';

  function addSubscriber() {

  /* ---- add subscribers from the address book (Martin, 20 Oct) -------------
     Search and tick, or a whole team or group at once. Each person still
     needs a recorded yes, asked in the same step - never added silently.
     Under-18s are not offered; anyone who unsubscribed is shown as such
     and can't be added here (only they can sign up again). */
  var HOW_WORDS = [['person', 'They told the office'], ['paper', 'On a paper form'], ['email', 'They asked by email'], ['phone', 'They asked by phone'], ['signedUp', 'They signed up themselves']];
  function addFromAddressBook() {
    var s = sheet('Add from the address book',
      '<input type="search" id="ab-q" placeholder="Search names" aria-label="Search names" style="width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px">' +
      '<label for="ab-team">Or a whole team or group</label><select id="ab-team"><option value="">Choose a team…</option></select>' +
      '<div id="ab-list" style="max-height:44vh;overflow:auto;margin:10px 0 0"><p class="m">Loading…</p></div>' +
      '<label for="ab-how">How did they say yes? (all of the ticked people)</label><select id="ab-how"><option value="">Choose…</option>' +
      HOW_WORDS.map(function (h) { return '<option value="' + h[0] + '">' + esc(h[1]) + '</option>'; }).join('') + '</select>' +
      '<p class="m">Only tick people who have said yes. When, how and who added them is kept with each one.</p>',
      function (s) {
        var how = val(s, 'ab-how');
        var people = [].filter.call(s.querySelectorAll('[data-ab]'), function (c) { return c.checked; }).map(function (c) { return PEOPLE[+c.getAttribute('data-ab')]; });
        if (!people.length) { toast('Tick at least one person.'); return false; }
        if (!how) { toast('Choose how they said yes. Nobody is added without it.'); return false; }
        EGBCAuth.call('enewsSubscriberSave', { people: people.map(function (p) { return { email: p.email, firstName: p.first, memberId: p.id }; }), how: how, from: 'addressBook' })
          .then(function (r) { r = (r && r.data !== undefined) ? r.data : r; toast(r.added + ' added' + (r.skipped && r.skipped.length ? ', ' + r.skipped.length + ' not (they show why)' : '') + '.'); showSubscribers(); },
            function (e) { toast(e.message || String(e)); });
      });
    var PEOPLE = [], SUB = {};
    Promise.all([db().collection('addressBook').get(), db().collection('enewsSubscribers').get()]).then(function (r) {
      r[1].docs.forEach(function (d) { SUB[String(d.data().email || '').toLowerCase()] = d.data().status; });
      PEOPLE = r[0].docs.map(function (d) { var x = d.data(); return { id: d.id, name: x.name || '', first: String(x.name || '').split(/\s+/)[0], email: String(x.email || '').trim(), teams: x.markers || [], minor: x.isMinor === true || x.under18 === true, archived: x.archived === true }; })
        .filter(function (p) { return p.email && !p.archived && !p.minor; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      var teams = {}; PEOPLE.forEach(function (p) { p.teams.forEach(function (t) { teams[t] = 1; }); });
      s.querySelector('#ab-team').innerHTML = '<option value="">Choose a team…</option>' + Object.keys(teams).sort().map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('');
      drawList();
    });
    function drawList() {
      var q = val(s, 'ab-q').toLowerCase();
      s.querySelector('#ab-list').innerHTML = PEOPLE.map(function (p, k) {
        if (q && p.name.toLowerCase().indexOf(q) < 0) return '';

        var tplNew = val(s, 'l-tpl'), cols = {}, look = MB.TEMPLATES[tplNew] || MB.TEMPLATES.classic;
        Array.prototype.forEach.call(s.querySelectorAll('[data-c]'), function (i) { var k = i.getAttribute('data-c'); if (i.value.toLowerCase() !== String(look[k]).toLowerCase()) cols[k] = i.value.toLowerCase(); });
        if (s.resetColours) cols = {};
        var next = { template: tplNew, colours: cols, bible: SET.bible || null, church: { shortName: val(s, 'l-short').slice(0, 40), address: val(s, 'l-addr').slice(0, 200), charityNo: val(s, 'l-charity').slice(0, 30), phone: val(s, 'l-phone').slice(0, 40), hours: val(s, 'l-hours').slice(0, 200),
          diaryButton: s.querySelector('#l-diary').checked,
          social: Object.keys(MB.SOCIAL).map(function (k) { return { kind: k, url: val(s, 'l-s-' + k).slice(0, 300) }; }).filter(function (x) { return x.url; }) } };
        var badSocial = next.church.social.filter(function (x) { return x.kind === 'email' ? !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(x.url) : !MB.safeUrl(x.url); });
        if (badSocial.length) { toast(MB.SOCIAL[badSocial[0].kind] + ': that doesn\u2019t look like a ' + (badSocial[0].kind === 'email' ? 'email address' : 'web address starting https://')); return false; }
        db().collection('enewsSettings').doc('main').set(Object.assign({}, next, stamp())).then(function () {
          SET = next; churchFromSettings(); toast('Saved.');
          if (ISSUE) draw();
        }).catch(function (e) { toast('Not saved: ' + (e.message || e)); });
      });
    s.querySelector('#l-tpl').onchange = function () {
      var th = MB.theme({ template: this.value });
      Array.prototype.forEach.call(s.querySelectorAll('[data-c]'), function (i) { i.value = th[i.getAttribute('data-c')]; });
    };
    s.querySelector('#l-reset').onclick = function () {
      s.resetColours = true; var th = MB.theme({ template: val(s, 'l-tpl') });
      Array.prototype.forEach.call(s.querySelectorAll('[data-c]'), function (i) { i.value = th[i.getAttribute('data-c')]; });
    };
  }
  function churchFromSettings() {
    var c = SET.church || {};
    CHURCH = { name: (window.EGBCChurch && EGBCChurch.name()) || '', email: (window.EGBCChurch && EGBCChurch.email()) || '',
      address: c.address || '', charityNo: c.charityNo || '', phone: c.phone || '', hours: c.hours || '',
      social: Array.isArray(c.social) ? c.social : [], diaryUrl: c.diaryButton === false ? '' : hubBase() + '/whatson.html' };
  }

  /* ---- start ----------------------------------------------------------- */
  EGBCAuth.require().then(EGBCComms.ready).then(function () {
    if (!may()) { wrap.innerHTML = '<div class="card"><h1>E-news</h1><p>This page is for the church office and master admins.</p></div>'; return; }
    if (!usesEnews()) { wrap.innerHTML = '<div class="card"><h1>E-news</h1><p>The e-news is switched off for this church. A master admin can turn it on in Church settings, under “What does your church use?”.</p></div>'; return; }
    return Promise.all([
      window.EGBCChurch ? EGBCChurch.load() : null,
      db().collection('enewsSettings').doc('main').get().then(function (s) { if (s.exists) SET = Object.assign({ template: 'classic', colours: {}, church: {} }, s.data()); }, function () {})
    ]).then(function () {
      churchFromSettings();
      var id = new URLSearchParams(location.search).get('issue');
      /* The welcome emails' words come back to Welcome emails, not a Send tab. */
      if (new URLSearchParams(location.search).get('welcomes') || /^auto_/.test(id || '')) { showList(); welcomeSheet(); }
      else if (id) openIssue(id); else showList();
    });
  }).catch(function (e) { wrap.innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; });
})();
</script>
</body>
</html>
