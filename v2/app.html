/* ---- a team space -------------------------------------------------- */

/* A TEAM'S ROTA: MY NEXT DATES, AND THE TEAM'S COMING SUNDAYS.
   Martin, 11 Oct: it showed no dates at all, only "say which Sundays you
   can do" - which is the form, not the rota. The mock-up's Rota tab
   answers "when am I on, and who else is on when".

   It reuses the rota Home already loads rather than reading `events` a
   second time: one load per page, and the two screens cannot disagree
   about what is coming. */
var TEAMROTA = { loaded: false, ready: false, dates: [] };

function loadTeamRota() {
  if (TEAMROTA.loaded) return;
  TEAMROTA.loaded = true;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  db.collection('events').get().then(function (snap) {
    var out = [];
    snap.forEach(function (d) {
      var e = d.data() || {};
      if (e.archived === true || !e.date) return;
      var when = new Date(e.date + 'T00:00:00');
      if (isNaN(when) || when < today) return;
      var a = e.assignments || {}, who = [];
      Object.keys(a).forEach(function (role) {
        if (a[role] && a[role].name) who.push({ role: role, name: a[role].name, id: a[role].id || '' });
      });
      out.push({ when: when, date: e.date, title: e.type || 'Service',
                 start: e.startTime || '', arrive: e.arriveTime || e.arrives || '',
                 teams: Array.isArray(e.teams) ? e.teams : [], who: who });
    });
    out.sort(function (x, y) { return x.when - y.when; });
    TEAMROTA.dates = out;
  }).catch(function () {}).then(function () {
    TEAMROTA.ready = true;
    var s = A.state();
    if (s.tab === 'rota') A.refresh(s.space, 'rota');
  });
}

function teamRota(label, spaceKey) {
  loadTeamRota();
  var me = A.who();
  var sp = A.SPACES[spaceKey] || A.SPACES.me;
  var teams = sp.teams || [];
  var mine = TEAMROTA.dates.filter(function (d) {
    return d.teams.some(function (t) { return teams.indexOf(t) !== -1; });
  });

  var out = head('Your rota', label);

  /* MY next dates on this team. */
  var minePersonal = mine.filter(function (d) {
    return d.who.some(function (w) { return w.id && w.id === me.memberId; });
  }).slice(0, 3);

  if (minePersonal.length) {
    out += sec('You are on', minePersonal.map(function (d) {
      var roles = d.who.filter(function (w) { return w.id === me.memberId; })
                       .map(function (w) { return w.role; });
      var time = d.arrive ? 'arrive ' + d.arrive : d.start;
      return next(String(d.when.getDate()), homeMonth(d.when), roles.join(' and '),
        d.title + (time ? ' · ' + time : ''), '', sp.colour, sp.tint);
    }).join(''));
  } else if (TEAMROTA.ready) {
    out += sec('You are on', '<div class="card" style="padding:14px">'
      + '<p style="margin:0;font-size:14px">Nothing on the rota for you yet. '
      + 'Say which Sundays you can do and the planner will put you on.</p></div>');
  }

  /* The team's coming Sundays, whoever is on them. */
  if (mine.length) {
    out += sec('Coming up', card(mine.slice(0, 6).map(function (d) {
      var names = d.who.map(function (w) { return w.name.split(/\s+/)[0]; });
      var seen = {}, firsts = [];
      names.forEach(function (n) { if (!seen[n]) { seen[n] = 1; firsts.push(n); } });
      return row('calendar-check',
        d.when.getDate() + ' ' + homeMonth(d.when) + ' · ' + d.title,
        firsts.length ? firsts.join(', ') : 'Nobody on it yet',
        null, null, sp.colour, sp.tint);
    }).join('')), ['Whole rota', 'open:view-only-rota.html']);
  } else {
    out += sec('Coming up', '<div class="card" style="padding:14px"><p style="margin:0;font-size:14px">'
      + (TEAMROTA.ready ? 'Nothing on the rota for this team yet.' : 'Finding the rota…')
      + '</p></div>');
  }

  out += card(row('calendar-check-2', 'My availability', 'Say which Sundays you can do',
    null, 'open:index.html', sp.colour, sp.tint));
  return out;
}

function teamTeam(space, extra) {
  return head(A.SPACES[space].label) + card(extra);
}

/* ---- THE PIN BOARD, READABLE IN THE APP (§7d B) ---------------------
   "the team's board, readable, with 'Add an idea'. The full board page
   opens in app mode for moving and archiving notes."

   stickynotes.html is a cork board you drag notes around on - 3,200px
   wide, which is right on a desk and not a thing to do with a thumb.
   What a phone wants is to READ the ideas and add one, so that is what
   this is: the notes as a list, newest first, and one button.

   It reads the same worshipBoardState document the board page writes,
   and "Add an idea" opens the board page in app mode rather than
   writing a note itself - adding one means placing it on the cork, and
   two pieces of code deciding where notes go is how boards end up with
   notes on top of each other. */
var BOARD = {};
/* row() draws a chevron when nothing is passed for `right`, which
   reads as "this goes somewhere". A line that is just information -
   who is on, an item in the order - gets this instead. */
var NOCHEV = '<span></span>';
var CLOSE = '<div class="actions"><button class="btn" data-act="close">Close</button></div>';

function loadBoard(docId, spaceKey) {
  if (BOARD[docId]) return;
  BOARD[docId] = { ready: false, notes: [] };
  db.collection('worshipBoardState').doc(docId).get().then(function (d) {
    var data = d.exists ? (d.data() || {}) : {};
    BOARD[docId].notes = (data.notes || []).filter(function (n) { return !n.archived; })
      .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
  }, function () {}).then(function () {
    BOARD[docId].ready = true;
    paintBoard(spaceKey);
  });
}

/* THE BOARDS, one per space that has one. A SHEET rather than a fifth
   tab: §2 caps a space at four tabs and says to use a sheet instead,
   and every one of these spaces is already full. The Team tab's "Pin
   boards" row opens it. */
var BOARDS = {
  worship: ['state', 'worship'], kids: ['kids-church', 'kids'],
  core: ['core-team', 'core-team'], youth: ['youth', 'youth'],
  lazers: ['lazers', 'lazers'], renu: ['renu', 'renu']
};

function paintBoard(spaceKey) {
  var cfg = BOARDS[spaceKey];
  if (!cfg) return;
  A.sheet('board-' + spaceKey, pinBoard(spaceKey, cfg[0], cfg[1]));
  if (A.state().sheet === 'board-' + spaceKey) A.draw();
}

/* THE SAME SMALL POST-ITS AND THE SAME FULL-SCREEN NOTE AS THE WEBSITE
   (APP-DESIGN-BRIEF §7f: "the board sheet uses the same small-post-it
   grid and full-screen note, so the app and the phone website match").

   Both draw through egbc-board-phone.js. They match because it is the
   same code, not because two screens were written to look alike - which
   is a thing that stays true only until somebody changes one of them. */
var BOARD_PHONE = {};     /* spaceKey -> the mounted board */

function boardPhone(spaceKey, docId) {
  if (BOARD_PHONE[spaceKey]) return BOARD_PHONE[spaceKey];
  var me = A.who() || {};
  BOARD_PHONE[spaceKey] = EGBCBoardPhone.mount({
    /* LOOKED UP EACH TIME, not held: the shell rebuilds the sheet's
       markup on every draw, so a node captured now is gone by the next
       tap. */
    grid: function () { return document.getElementById('pbGrid-' + spaceKey); },
    empty: function () { return document.getElementById('pbEmpty-' + spaceKey); },
    sheet: function () { return document.getElementById('appNoteSheet'); },
    sheetInner: function () { return document.getElementById('appNoteSheetInner'); },
    db: db,
    boardId: docId,
    notes: function () { return (BOARD[docId] || {}).notes || []; },
    /* Who may post and comment is the team, and who may archive or
       remove is a leader of it - the same answer the rules give. */
    canPost: function () { return boardIsMine(spaceKey); },
    isLeader: function () { return boardLeaderHere(spaceKey); },
    me: function () {
      var w = A.who() || {};
      return w.uid ? { uid: w.uid, name: w.name || 'Someone' } : null;
    },
    toast: function (m) { A.toast(m); },
    /* Reactions, archiving and removing all write the BOARD document,
       which is one document holding every note - so they go through the
       page that owns it rather than being half-implemented here. The app
       is read-and-comment; the rest opens the board. */
    onReact: null,
    /* Edit opens the board page, in app mode, through the shell's own
       open: action - openPage() is not exported, and a second way of
       leaving the app is a second thing to keep right. The row is built
       and clicked rather than reaching into the shell. */
    onEdit: function () {
      var b = document.createElement('button');
      b.setAttribute('data-act', 'open:stickynotes.html?board='
        + ((BOARDS[spaceKey] || [])[1] || '') + '&add=0');
      b.style.display = 'none';
      document.body.appendChild(b);
      b.click();
      b.remove();
    },
    onArchive: null,
    onRemove: null,
    afterChange: function () { A.draw(); },
  });
  return BOARD_PHONE[spaceKey];
}

/* On this team, and a leader of it - read from the shell's own idea of
   who somebody is, so the app and the Menu cannot disagree. */
function boardTeamsFor(spaceKey) {
  var sp = A.SPACES[spaceKey] || {};
  return sp.teams || [];
}
function boardIsMine(spaceKey) {
  var me = A.who() || {};
  if (me.isMaster) return true;
  return boardTeamsFor(spaceKey).some(function (t) { return EGBCAuth.inTeam(t); });
}
function boardLeaderHere(spaceKey) {
  var me = A.who() || {};
  if (me.isMaster) return true;
  return boardTeamsFor(spaceKey).some(function (t) { return EGBCAuth.isAdminOf(t); });
}

function pinBoard(spaceKey, docId, boardParam) {
  loadBoard(docId, spaceKey);
  var sp = A.SPACES[spaceKey] || A.SPACES.me;
  var b = BOARD[docId] || { ready: false, notes: [] };

  var out = '<h3>Pin board</h3><p>Ideas from the team.</p>';
  /* "Add an idea" opens the add form - the board page's own, in app
     mode, so there is one add form and it is the one that knows where a
     new note goes on the corkboard (noteSpot()). */
  out += card(row('plus', 'Add an idea', 'Put a note on the board', null,
                  'open:stickynotes.html?board=' + boardParam + '&add=1', sp.colour, sp.tint));

  if (!b.ready) {
    return out + card('<div style="padding:14px"><p style="margin:0;font-size:14px">'
      + 'Finding the board…</p></div>') + CLOSE;
  }

  /* The grid is filled in after the shell has drawn it - see the
     observer below. Empty markup here, notes there. */
  out += '<div class="pb-grid" id="pbGrid-' + A.esc(spaceKey) + '"></div>'
    + '<p class="example" id="pbEmpty-' + A.esc(spaceKey) + '" hidden>'
    + 'Nothing on the board yet. Yours could be the first.</p>';

  out += card(row('layout-grid', 'The whole board', 'Move and archive notes', null,
                  'open:stickynotes.html?board=' + boardParam, sp.colour, sp.tint));
  return out + CLOSE;
}

/* FILL THE GRID AFTER EVERY DRAW. The shell rebuilds everything inside
   #egbc-app each time it renders and stamps data-drawn when it has, so
   that stamp is the honest moment to put the post-its back. Without it
   the board would draw once and be empty after the next tap anywhere. */
(function () {
  var app = document.getElementById('egbc-app');
  if (!app || !window.MutationObserver) return;
  new MutationObserver(function () {
    /* WHICH BOARD IS ON SCREEN COMES FROM THE SHELL, not from a variable
       set while drawing. pinBoard() runs for EVERY board at start-up -
       Object.keys(BOARDS).forEach(paintBoard) registers them all - so a
       variable set there holds whichever was registered last, and the
       grid for the board somebody actually opened stayed empty. */
    var open = String((A.state() || {}).sheet || '');
    if (open.indexOf('board-') !== 0) return;
    var key = open.slice(6);
    var cfg = BOARDS[key];
    if (!cfg) return;
    if (!document.getElementById('pbGrid-' + key)) return;
    boardPhone(key, cfg[0]).render();
  }).observe(app, { attributes: true, attributeFilter: ['data-drawn'] });
})();

/* ---- THIS SUNDAY (APP-DESIGN-BRIEF §7d B) ---------------------------
   "the order of service, read-only, with songs and the YouTube buttons."

   What a musician opens on a Sunday morning, standing up: what we are
   singing, in what key, with the note the leader left, and a way to hear
   it. Read-only on purpose - the planner is Core Team's, and it is a tab
   away for the people who have it.

   It reads the SAME service document the planner writes (`services`,
   keyed by date), so there is one order of service in the church and
   not an app's idea of one. The team comes from the event, as the
   planner's own table does. */
var SUNDAY = { loaded: '', ready: false, date: '', plan: null, ev: null, songs: {} };

function loadThisSunday(spaceKey) {
  /* Keyed by space: Kids Church's next service is not always Worship's,
     and loading once for whichever tab was opened first would show one
     team the other's morning. */
  if (SUNDAY.loaded === spaceKey) return;
  SUNDAY = { loaded: spaceKey, ready: false, date: '', plan: null, ev: null, songs: {} };
  var teams = (A.SPACES[spaceKey] || {}).teams || [];
  var today = new Date(); today.setHours(0, 0, 0, 0);
  db.collection('events').get().then(function (snap) {
    /* The next service still to come - today counts, because this is
       most used on the morning itself - FOR THIS SPACE'S TEAMS, and
       the earliest one if there are two that day. Without the team
       filter a Kids Church person was shown the worship service, and
       without the tie-break the one you got depended on the order
       Firestore handed them back. */
    var best = null;
    snap.forEach(function (d) {
      var e = d.data() || {};
      if (e.archived === true || !e.date) return;
      if (!/Sunday Morning Worship|Service/i.test(e.type || '')) return;
      if (teams.length && !(e.teams || []).some(function (t) { return teams.indexOf(t) !== -1; })) return;
      var when = new Date(e.date + 'T00:00:00');
      if (isNaN(when) || when < today) return;
      /* ON A SUNDAY, and the day decides, not the type. The screen was
         showing "This Sunday - Thursday 15 October": the rota carries
         services typed "Sunday Morning Worship" that sit on other days
         (a Thursday practice of one, in the test data), and a screen
         with this name showing a Thursday is wrong whatever the type
         field says.
         A midweek Carol or Midnight service therefore does not appear
         here. That is deliberate: it is on the Rota tab, which is
         about every date, and this screen answers one question. */
      if (when.getDay() !== 0) return;
      var key = e.date + ' ' + (e.startTime || '99:99');
      if (!best || key < best.key) best = { when: when, key: key, id: d.id, ev: e };
    });
    if (!best) return null;
    SUNDAY.date = best.ev.date;
    SUNDAY.ev = best.ev;
    return db.collection('services').where('date', '==', best.ev.date).get()
      .then(function (s) { if (!s.empty) SUNDAY.plan = s.docs[0].data(); });
  }).then(function () {
    /* Only the songs that are actually on the plan, one read each - the
       library is big and a phone on a church wifi does not need it. */
    var titles = ((SUNDAY.plan && SUNDAY.plan.order) || [])
      .filter(function (i) { return i.type === 'song' && i.title; })
      .map(function (i) { return i.title; });
    return Promise.all(titles.map(function (t) {
      var id = t.toLowerCase().replace(/\s+/g, '-');
      return db.collection('songs').doc(id).get().then(function (d) {
        if (d.exists) SUNDAY.songs[t] = d.data();
      }, function () {});
    }));
  }).catch(function () {}).then(function () {
    SUNDAY.ready = true;
    var s = A.state();
    if (s.tab === 'sunday') A.refresh(s.space, 'sunday');
  });
}

function thisSunday(spaceKey) {
  loadThisSunday(spaceKey);
  var sp = A.SPACES[spaceKey] || A.SPACES.me;
  var me = A.who();

  if (!SUNDAY.ready) {
    return head('This Sunday') + card('<div style="padding:14px"><p style="margin:0;font-size:14px">'
      + 'Finding Sunday’s plan…</p></div>');
  }
  if (!SUNDAY.ev) {
    return head('This Sunday') + card('<div style="padding:14px"><p style="margin:0;font-size:14px">'
      + 'Nothing on the rota yet. When the next service is planned it appears here.</p></div>');
  }

  var when = new Date(SUNDAY.date + 'T00:00:00');
  var sub = when.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  var out = head('This Sunday', sub + (SUNDAY.ev.startTime ? ' · ' + SUNDAY.ev.startTime : ''));

  /* WHO IS ON, and the person reading this first. */
  var a = SUNDAY.ev.assignments || {};
  var mineRoles = Object.keys(a).filter(function (r) {
    return a[r] && a[r].id && a[r].id === me.memberId;
  });
  if (mineRoles.length) {
    out += sec('You are on', card(row('user-check', mineRoles.join(' and '),
      SUNDAY.ev.arriveTime ? 'Arrive ' + SUNDAY.ev.arriveTime : (SUNDAY.ev.startTime || ''),
      NOCHEV, null, sp.colour, sp.tint)));
  }

  if (!SUNDAY.plan) {
    out += card('<div style="padding:14px"><p style="margin:0;font-size:14px">'
      + 'The order of service is not written yet. It appears here as soon as it is.</p></div>');
  } else {
    if (SUNDAY.plan.serviceNotes) {
      out += sec('Notes', card('<div style="padding:14px"><p style="margin:0;font-size:14px">'
        + A.esc(SUNDAY.plan.serviceNotes) + '</p></div>'));
    }
    var n = 0;
    var items = (SUNDAY.plan.order || []).map(function (item) {
      if (item.type !== 'song') {
        return row('circle-dot', item.title || 'Item', '', NOCHEV, null, sp.colour, sp.tint);
      }
      n++;
      var song = SUNDAY.songs[item.title] || {};
      var keys = (Array.isArray(item.keys) ? item.keys : [item.key]).filter(Boolean);
      var bits = [];
      if (keys.length) bits.push('Key ' + keys.join(', '));
      if (item.notes) bits.push(item.notes);
      /* THE YOUTUBE BUTTON, named in §7b and §7d as not to be lost - it
         is how somebody learns a song they do not know before Sunday.
         A real link, because it leaves the app for YouTube. */
      var right = '';
      if (song.youtube) {
        right = '<a class="btn" href="' + A.esc(song.youtube) + '" target="_blank" rel="noopener"'
          + ' onclick="event.stopPropagation()">' + ic('play', 15) + ' Listen</a>';
      }
      return row('music', n + '. ' + (item.title || 'Song'), bits.join(' · '),
                 right || NOCHEV, null, sp.colour, sp.tint);
    }).join('');
    out += sec('Order of service', card(items || '<div style="padding:14px">'
      + '<p style="margin:0;font-size:14px">Nothing in the order yet.</p></div>'));
  }

  /* THE TEAM, as the planner's own table has it. */
  var team = Object.keys(a).filter(function (r) { return a[r] && a[r].name; }).sort();
  if (SUNDAY.ev.serviceLeader) team.unshift('Service Leader');
  if (team.length) {
    out += sec('Who is on', card(team.map(function (r) {
      var who = r === 'Service Leader' ? SUNDAY.ev.serviceLeader : (a[r] || {}).name;
      return row('user', r, who || '', NOCHEV, null, sp.colour, sp.tint);
    }).join('')));
  }

  out += card(row('headphones', 'Play through the songs', 'Listen before you come', null,
                  'open:EGBC-PlayThrough.html', sp.colour, sp.tint));
  return out;
}

document.addEventListener('egbc-ready', function () {
  /* The events window's screens go on BEFORE the first draw, so nobody sees
     the shell's interim rows flash and be replaced (F-141). Guarded,
     because the shell has to draw whether or not that file loaded. */
  try {
    if (window.EGBCAppEvents && EGBCAppEvents.mountAll) EGBCAppEvents.mountAll(EGBCApp);
  } catch (e) { console.warn('app: the events screens did not mount', e); }
  EGBCApp.start();
});
</script>
