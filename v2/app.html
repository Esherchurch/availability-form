<!DOCTYPE html>
<!-- data-egbc-no-strips: NO WEBSITE STRIPS IN THE APP (§7e). egbc-auth.js
     fixes a "View the site as" bar to the bottom of the page for a master
     admin, and in the app it landed on top of the tab bar - Martin saw it
     there. The same thing is one row on Me instead. Set on <html> rather
     than <body> so it is readable before any script runs. -->
<html lang="en" data-egbc-no-strips>
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover, because the tab bar has to be able to pad itself past
     the phone's own navigation. Martin tapped Groups in the mock-up and closed
     the app instead (APP-DESIGN-BRIEF §7). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EGBC Hub</title>

<!-- INSTALLABLE (§7c). Without a manifest this opened in the browser and
     could not be added to a home screen - Martin: "thats not the app.
     thats the website." It also meant no iPhone notifications (§23), which
     only reach an installed app.

     A NEW manifest with a NEW id. manifest-hub.json is untouched: people
     already have "EGBC Hub" installed pointing at hub.html, and changing
     its id, start_url or scope would break their install. How the installed
     hub comes to lead here instead is §7c part 2, behind a switch that is
     off until switch-over - not built here. -->
<link rel="manifest" href="./manifest-app.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3d6263">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EGBC Hub">

<script src="egbc-nosend.js?v=202610072100"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- Storage, for the events window's photos and the backup sermon audio
     (F-141). egbc-auth.js points it at the emulator on localhost, but only
     if it is loaded BEFORE that line runs - hence here. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="egbc-auth.js?v=202610091200"></script>
<!-- No team on the door: everyone in the address book has this app. Somebody
     signed in who is not in the book is turned away by the guard with the
     "we do not recognise that address" card, which is right. -->
<script src="egbc-guard.js?v=202610091200"></script>
<script src="egbc-ui.js?v=202610091200"></script>
<!-- App mode (§7d A): the app itself sets the flag and hands over where
     to come back to, so a page it opens wears the app's chrome. -->
<script src="egbc-appmode.js?v=202610112000"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== TAKEN FROM design/app-mockup.html (§7e) =====================
     Martin: "it is not the design we agreed." These are the mock-up's own
     tokens and rules, copied rather than approximated - the same hex
     values, the same radii, the same spacing. Where the real app needs
     something the mock-up has no equivalent of, it is marked.

     THE SPACE COLOURS ARE THE MOCK-UP'S, and they are not all the ones
     egbc-auth.js uses for the hub's team dots: Youth is #5a4a7a here and
     #5f7a4a there, and the Worship space takes the AV blue. The app is
     drawn to the design Martin approved; the hub keeps its own. */
  :root{
    --brand:#3d6263; --brand-tint:#eef5f4;
    --bg:#f3f6f5;    --surface:#ffffff;
    --ink:#111827;   --body:#374151;   --muted:#6b7280;
    --line:#e3e8e6;
    --worship:#3d6263; --worship-tint:#e8f1f0;
    --av:#4a5f7a;      --av-tint:#e9eef5;
    --kids:#7a5f4a;    --kids-tint:#f4ede7;
    --youth:#5a4a7a;   --youth-tint:#efebf6;
    --welcome:#8a4a5e; --welcome-tint:#f6ebef;
    --coffee:#6b5a3a;  --coffee-tint:#f2ede4;
    --maint:#4f5a66;   --maint-tint:#eceff2;
    --good:#1f7a4d;    --good-tint:#e6f4ec;
    --warn:#9a5b00;    --warn-tint:#fdf3e2;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --sp:var(--brand);
    /* THE NAMES THE SHARED SERVICE PLANNER USES (§7b). egbc-core-planner.js
       came out of CoreTeamApp, whose palette calls these --teal, --border
       and --white. They are pointed at this app's own tokens rather than
       given values of their own, so the planner follows the app - including
       into dark mode, which redefines what they point AT and needs no
       second list here. */
    --teal:var(--brand); --teal-light:var(--brand-tint);
    --border:var(--line); --white:var(--surface);
  }
  /* The mock-up follows the phone's own light or dark setting, and so does
     the app. Kept whole rather than dropped: a church app that glares at
     somebody in bed at night is a thing people complain about once. */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --brand:#7fb3b1; --brand-tint:#1f3333; --bg:#0f1514; --surface:#182120;
    --ink:#eef3f2; --body:#cdd8d6; --muted:#93a5a2; --line:#2a3634;
    --worship:#7fb3b1; --worship-tint:#1f3333; --av:#9db3d1; --av-tint:#1e2733;
    --kids:#d1b39b; --kids-tint:#2e241d; --youth:#b9a8db; --youth-tint:#261f33;
    --welcome:#e0a3b6; --welcome-tint:#331d24; --coffee:#d6c39a; --coffee-tint:#2b2416;
    --maint:#b3bfcc; --maint-tint:#20262d;
    --good:#6fcf9d; --good-tint:#16301f; --warn:#f0b762; --warn-tint:#33260f;
    color-scheme:dark; } }
  :root[data-theme="dark"]{
    --brand:#7fb3b1; --brand-tint:#1f3333; --bg:#0f1514; --surface:#182120;
    --ink:#eef3f2; --body:#cdd8d6; --muted:#93a5a2; --line:#2a3634;
    --worship:#7fb3b1; --worship-tint:#1f3333; --av:#9db3d1; --av-tint:#1e2733;
    --kids:#d1b39b; --kids-tint:#2e241d; --youth:#b9a8db; --youth-tint:#261f33;
    --welcome:#e0a3b6; --welcome-tint:#331d24; --coffee:#d6c39a; --coffee-tint:#2b2416;
    --maint:#b3bfcc; --maint-tint:#20262d;
    --good:#6fcf9d; --good-tint:#16301f; --warn:#f0b762; --warn-tint:#33260f;
    color-scheme:dark; }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--body);
       font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  i[data-lucide]{display:inline-flex}
  svg.lucide{stroke-width:1.75}

  /* FULL WIDTH, NO GREY MARGINS (§7e). This had max-width:520px with auto
     margins, so on a wide phone the app sat in a column with the page
     ground showing down both sides - part of Martin's "it does not fit the
     screen". The mock-up's phone fills its screen; so does this. */
  #egbc-app{display:flex;flex-direction:column;height:100%;background:var(--bg)}

  /* ---- the chrome, from the mock-up ------------------------------- */
  .top{background:var(--surface);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
       border-bottom:1px solid var(--line);display:grid;gap:10px}
  .top-row{display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;
        display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:.02em;flex:none}
  .top-title{font-weight:600;color:var(--ink);font-size:16px;flex:1;min-width:0}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
            background:var(--surface);display:grid;place-items:center;position:relative;flex:none;
            color:var(--body)}
  .badge{position:absolute;top:-4px;right:-4px;background:#c0392b;color:#fff;font-size:10px;
         font-weight:600;min-width:17px;height:17px;border-radius:9px;display:grid;
         place-items:center;padding:0 4px}

  /* NOT IN THE MOCK-UP, and said so rather than implied: "I'm worried
     about someone" is NEXT-BRIEF §24, which came after the design. It is
     drawn in the mock-up's idiom - the same border, radius and surface as
     .icon-btn - but keeps its word, because an unlabelled heart is a
     guess, and 44px rather than the mock-up's 36px, because a missed tap
     on a safeguarding route is not like a missed tap on a bell. */
  .worry{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 10px;
         border:1px solid var(--line);border-radius:10px;background:var(--surface);
         color:var(--brand);font-size:13px;font-weight:500;flex:none;white-space:nowrap}
  .worry:active{opacity:.65}

  /* The pills. THE SELECTED ONE IS FILLED with its space's colour, which is
     what makes the row read as "where am I" at a glance. Mine were white
     with an inset outline and all looked the same. */
  .spaces{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .spaces::-webkit-scrollbar{display:none}
  .space{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);
         background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;
         font-weight:500;color:var(--body);white-space:nowrap}
  .space .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .space[aria-pressed="true"]{background:var(--sp,var(--brand));border-color:var(--sp,var(--brand));color:#fff}
  .space[aria-pressed="true"] .dot{background:#fff !important}

  .content{flex:1;overflow-y:auto;padding:16px;display:grid;gap:14px;align-content:start}
  .hello{font-size:22px;font-weight:700;color:var(--ink);margin:2px 0 0}
  .sub{color:var(--muted);font-size:13px;margin:0}

  .sec{display:grid;gap:8px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between}
  .sec-h h3{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
  .sec-h button{border:0;background:none;color:var(--brand);font-size:13px;font-weight:500;padding:0}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px}

  /* The "next thing" card: a COLOURED LEFT EDGE and a TINTED DATE TILE.
     Mine had neither, which is most of why Home looked like a list of
     links rather than the mock-up. */
  .next{padding:14px;display:grid;gap:12px;border-left:4px solid var(--c,var(--brand))}
  .next-top{display:flex;gap:12px;align-items:center}
  .date{width:50px;flex:none;text-align:center;border-radius:10px;
        background:var(--ct,var(--brand-tint));color:var(--c,var(--brand));padding:6px 0}
  .date b{display:block;font-size:20px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
  .date span{font-size:11px;font-weight:600}
  .next h4{margin:0;font-size:16px;font-weight:600;color:var(--ink)}
  .next p{margin:0;font-size:13px;color:var(--muted)}

  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;
       font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--body)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  /* The calendar sheet's Apple, Google and Outlook buttons are real links,
     because a webcal:// address has to be handed to the phone - so .btn has
     to work on an <a> too, without the browser's underline. */
  a.btn{text-decoration:none}

  /* The service planner's container. It brings its own styles; this only
     gives them the full width of the tab, since the planner's own cards
     carry their 12px margins. */
  .sp-host{margin:0 -16px}
  /* The rota brings its own toolbar and scrolling list. */
  .cr-host{margin:0 -16px;display:flex;flex-direction:column;min-height:60vh}

  .list{display:grid}
  .card.list{display:grid}
  .row{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;background:none;
       text-align:left;width:100%}
  .row + .row{border-top:1px solid var(--line)}
  .row .ic{width:36px;height:36px;border-radius:10px;background:var(--ct,var(--brand-tint));
           color:var(--c,var(--brand));display:grid;place-items:center;flex:none}
  .row .tx{flex:1;min-width:0}
  .row b{display:block;font-weight:600;color:var(--ink);font-size:14px;overflow-wrap:anywhere}
  .row small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
  .chev{color:var(--muted);flex:none}

  .pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;
        background:var(--good-tint);color:var(--good);white-space:nowrap}
  .pill.warn{background:var(--warn-tint);color:var(--warn)}
  .pill.n{background:var(--brand-tint);color:var(--brand)}

  .notice{padding:12px 14px;display:grid;gap:4px}
  .notice + .notice{border-top:1px solid var(--line)}
  .notice b{color:var(--ink);font-weight:600}
  .notice p{margin:0;font-size:13px}
  /* 12px, not the mock-up's 11.5px: DESIGN.md's floor, and the style check
     measures it. The only number in here deliberately not the mock-up's. */
  .example{font-size:12px;color:var(--muted);text-align:center;margin:0}

  .empty{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);
         font-size:13px;padding:26px 8px;margin:0}
  .empty i{color:var(--faint)}

  /* THE TAB BAR, and the numbers are APP-DESIGN-BRIEF §7's.
       - a 22px icon, a 2px gap and an 11.5px label inside 10px of padding
         comes to about 58px a tab, against the 48px asked for
       - below it, 26px plus whatever the phone says its own navigation
         needs: nothing on Android 3-button, about 24px on gesture
         navigation, about 34px on an iPhone with a home indicator */
  .tabs{display:grid;grid-template-columns:repeat(var(--n,4),1fr);background:var(--surface);
        border-top:1px solid var(--line);padding:6px 4px calc(26px + env(safe-area-inset-bottom,0px))}
  .tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:10px 0;
       font:500 11.5px Inter,sans-serif;color:var(--muted);cursor:pointer}
  .tab[aria-current="page"]{color:var(--sp)}
  .tab[aria-current="page"] svg{stroke-width:2.25}

  .sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:60}
  .sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;
         padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;
         max-height:85%;overflow-y:auto}
  .sheet h3{margin:0;font-size:17px;font-weight:600;color:var(--ink)}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 2px}

  /* Clear of the tab bar as well as the phone's own navigation. */
  .toast{position:fixed;left:16px;right:16px;
         bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;
         padding:10px 14px;border-radius:8px;font-size:13px;z-index:70;text-align:center}
</style>
</head>
<body>
<div id="egbc-app"></div>

<!-- THE EVENTS WINDOW'S SCREENS (F-141), in the order it asked for: its
     shared libraries first, then its screens after the shell, because each
     screen registers itself against EGBCApp. A screen mounted here replaces
     the shell's interim "open the existing page" row for the same space and
     tab, and adds the ones the shell had none for. -->
<script src="egbc-church.js?v=202610101200"></script>
<script src="egbc-email.js?v=202610101200"></script>
<script src="egbc-ics.js?v=202610101200"></script>
<script src="egbc-events.js?v=202610101800"></script>
<script src="egbc-events-kids.js?v=202610101200"></script>
<script src="egbc-events-checkin.js?v=202610101200"></script>
<script src="egbc-events-bookings.js?v=202610101200"></script>
<script src="egbc-events-groups.js?v=202610101200"></script>
<script src="egbc-events-home.js?v=202610101200"></script>
<script src="egbc-app.js?v=202610101200"></script>
<script src="egbc-app-events.js?v=202610101200"></script>
<script src="egbc-app-kids.js?v=202610101200"></script>
<script src="egbc-app-listen.js?v=202610101200"></script>
<script src="egbc-app-whatson.js?v=202610101800"></script>
<script src="egbc-app-maint.js?v=202610101200"></script>
<script src="egbc-app-office.js?v=202610101200"></script>
<!-- Core Team ▸ Plan: CoreTeamApp's service planner, shared rather than
     copied (APP-DESIGN-BRIEF §7b). Sortable first, because the planner
     looks for it when it mounts to make the order draggable - without it
     the planner still works, with no drag handle. -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="egbc-core-planner.js?v=202610111600"></script>
<script src="egbc-core-meetings.js?v=202610111800"></script>
<script src="egbc-core-rota.js?v=202610111900"></script>
<script>
/* ---- the screens that open a page which already does the job -------
   APP-DESIGN-BRIEF §5, and A1 counted 11 of the mock-up's 24 this way.
   None of these is a new screen: each is a short list of real links, so
   the app is useful from this stage rather than after the last one.

   Home, Me with My details, the family rule, Running things and Give are
   later stages. A tab with no screen behind it is not drawn at all. */

const A = EGBCApp, row = A.row, sec = A.sec, card = A.card, head = A.head, ic = A.ic;
const next = A.next;
/* Home reads the rota and the notices itself. The same named app every
   page uses, so the emulator hook in egbc-auth.js applies here too. */
const db = firebase.firestore(EGBCAuth.app);

/* ---- Me and my family ---------------------------------------------- */

/* ---- Home, built from the mock-up (§7e) -----------------------------
   Martin: "the app is still wrong... it is not the design we agreed."
   Home was four links and a "next stages" placeholder. The mock-up's Home
   answers "what do I need to know this week?" in five sections, and this
   is those five with real data behind them.

   IT DRAWS WHAT IT HAS AND SAYS NOTHING ABOUT WHAT IT HAS NOT. A section
   with no data is left out rather than shown empty: an app that says "You
   are serving" above nothing reads as broken. The greeting and the date
   are always there, so the screen is never blank.

   THE DATA IS LOADED ONCE AND CACHED, then the screen asks to be redrawn.
   A screen function has to return HTML immediately - it cannot wait - so
   the first draw shows what is already known and the rest arrives.
   refresh() is a no-op if the person has moved on (F-131). */

var HOME = { loaded: false, ready: false, serving: [], events: [], groups: [], family: [], news: [] };

function homeMonth(d) {
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}
function homeGreeting() {
  var h = new Date().getHours();
  return h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening';
}
function homeToday() {
  var d = new Date();
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]
    + ' ' + d.getDate() + ' ' + ['January','February','March','April','May','June','July',
      'August','September','October','November','December'][d.getMonth()];
}

/* The space a team's name belongs to, so a rota card is the colour of the
   team it is for - which is what makes the mock-up's Home readable at a
   glance rather than a column of identical cards. */
function spaceForTeam(team) {
  var S = A.SPACES, k;
  for (k in S) if (S[k].teams && S[k].teams.indexOf(team) !== -1) return S[k];
  return S.me;
}
function spaceKeyForTeam(team) {
  var S = A.SPACES, k;
  for (k in S) if (S[k].teams && S[k].teams.indexOf(team) !== -1) return k;
  return '';
}

/* What this person is serving on next, from the rota. `events` carries
   assignments as role -> { id, name }, which is how the planner writes it. */
function loadServing(memberId) {
  if (!memberId) return Promise.resolve([]);
  var today = new Date(); today.setHours(0, 0, 0, 0);
  return db.collection('events').get().then(function (snap) {
    var out = [];
    snap.forEach(function (d) {
      var e = d.data() || {};
      if (e.archived === true || !e.date) return;
      var when = new Date(e.date + 'T00:00:00');
      if (isNaN(when) || when < today) return;
      var roles = [];
      var a = e.assignments || {};
      Object.keys(a).forEach(function (role) {
        if (a[role] && a[role].id === memberId) roles.push(role);
      });
      if (!roles.length) return;
      /* ARRIVAL TIME FIRST, THE SERVICE TIME OTHERWISE (Martin, 11 Oct).
         The mock-up says "arrive 08:00", which is what a person on the
         rota actually needs - being there for the service is too late.

         NOTHING IN THE ROTA STORES ONE TODAY. An events document carries
         date, startTime, endTime, type, teams, assignments, serviceLeader
         and speaker, and no arrival time at all; the mock-up's "arrive
         08:00" was example words. So this reads one if it is ever written
         - arriveTime, or `arrives` as the planner's own comment spells it
         - and falls back to the service time until the planner can set
         it. Said in the report rather than a field invented quietly. */
      out.push({ when: when, date: e.date, roles: roles,
                 title: e.type || 'Service',
                 arrive: e.arriveTime || e.arrives || '',
                 start: e.startTime || '',
                 teams: Array.isArray(e.teams) ? e.teams : [] });
    });
    out.sort(function (x, y) { return x.when - y.when; });
    return out.slice(0, 3);
  }).catch(function () { return []; });
}

/* Notices: the hub's own news, with the hub's own rules about which ones
   are still showing. isNewsExpired() and forMe() live in hub-app.js and
   are NOT copied here - the app reads the same two fields the hub writes,
   so a notice that has expired on the computer cannot still be on the
   phone (confirmed in the code, §17). */
function todayIso() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
    + '-' + String(d.getDate()).padStart(2, '0');
}
function loadNews(me) {
  return db.collection('news').get().then(function (snap) {
    var out = [];
    snap.forEach(function (d) {
      var n = d.data() || {};
      if (n.until && n.until < todayIso()) return;           /* "show until" */
      if (Array.isArray(n.teams) && n.teams.length
          && !n.teams.some(function (t) { return me.teams.indexOf(t) !== -1; })) return;
      out.push({ title: n.title || '', body: String(n.body || '').replace(/<[^>]*>/g, '').trim(),
                 at: n.createdAt || n.at || '' });
    });
    out.sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
    return out.slice(0, 3);
  }).catch(function () { return []; });
}

function loadHome(me) {
  if (HOME.loaded) return;
  HOME.loaded = true;
  var H = window.EGBCEventsHome;
  var jobs = [
    loadServing(me.memberId).then(function (r) { HOME.serving = r; }),
    loadNews(me).then(function (r) { HOME.news = r; }),
    H && H.myEvents ? H.myEvents().then(function (r) { HOME.events = r || []; },
      function () {}) : Promise.resolve(),
    H && H.myGroupsNext ? H.myGroupsNext().then(function (r) { HOME.groups = r || []; },
      function () {}) : Promise.resolve(),
    /* F-145: "This Sunday, for parents". The events window's, and it
       answers an empty list for anybody who is not one. */
    H && H.myFamilyThisSunday ? H.myFamilyThisSunday().then(function (r) { HOME.family = r || []; },
      function () {}) : Promise.resolve()
  ];
  /* `ready` tells an empty Home the difference between still looking and
     there being nothing. Without it, a new person reads "nothing for you
     this week" for a second before their week appears. */
  Promise.all(jobs).then(function () { HOME.ready = true; A.refresh('me', 'home'); });
}

  /* MY AVAILABILITY STAYS ON HOME (Martin, 11 Oct). I read "remove Quick

/* WHO THIS PERSON IS, in their own words (Martin, 11 Oct). It said
   "Attender" to a master admin on two teams, which is both wrong and
   faintly insulting. Somebody on a team is a team member and the teams
   are named; "Attender" is only for somebody on none.

   The labels are the spaces' own, so "Worship & AV" rather than the two
   markers behind it, and the list does not repeat itself. */
function whoIAm(me) {
  if (!me.teams.length) return me.churchMember ? 'Church member' : 'Attender';
  var seen = {}, names = [];
  me.teams.forEach(function (t) {
    var S = A.SPACES, k, label = t;
    for (k in S) if (S[k].teams && S[k].teams.indexOf(t) !== -1) { label = S[k].label; break; }
    if (!seen[label]) { seen[label] = 1; names.push(label); }
  });
  var who = names.length > 2
    ? names.slice(0, 2).join(', ') + ' and ' + (names.length - 2) + ' more'
    : names.join(' and ');
  return who + (me.isMaster ? ' · master admin' : '');
}

/* ---- Add to my calendar, ON ME (Martin, 11 Oct) ---------------------
   This row opened hub.html, which §7d says the app never does, and the
   calendar UI only existed inside hub-app.js - so it is built here.

   THE SAME THREE BUTTONS THE HUB HAS, because copy-and-paste is too hard
   for most people (Martin, 11 Oct). webcal:// is what makes Apple and
   Outlook offer to SUBSCRIBE rather than download the file once; Google
   wants the https address wrapped in its own cid link. Copy stays as the
   last resort.

   AND A FEED THAT DOES NOT EXIST YET CAN BE MADE from here. It used to
   say "not set up yet" with no way to set it up, which is a dead end
   with a label on it. Tapping one calls myCalendarLink for that feed,
   exactly as the hub's "Add to my calendar" button does, and the buttons
   appear.

   THE IDS ARE THE FUNCTION'S OWN: me, household, full:all. My first
   version invented "all", which is not a feed and would have failed
   quietly - the sheet would have offered a button that made nothing. */
var FEED_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:5101/egbc-worship-planner/europe-west2/rotaFeed'
  : 'https://europe-west2-egbc-worship-planner.cloudfunctions.net/rotaFeed';

var CAL = { state: 'idle', feeds: {}, making: '', error: '' };
var CAL_KINDS = [
  ['me', 'user', 'Just me', 'The dates you are on'],
  ['household', 'house', 'My household', 'Everyone at your address, with who is doing what'],
  ['full:all', 'users', 'The whole rota', 'Every service, with everybody you may see']
];

function loadCalendar() {
  if (CAL.state !== 'idle') return;
  CAL.state = 'loading';
  EGBCAuth.call('myCalendarLinks', {}).then(function (r) {
    CAL.feeds = (r && r.feeds) || {}; CAL.state = 'ready';
  }, function () { CAL.state = 'failed'; }).then(redrawCalendar);
}

function makeCalendarFeed(id) {
  if (CAL.making) return;
  CAL.making = id; CAL.error = '';
  redrawCalendar();
  EGBCAuth.call('myCalendarLink', { feed: id, reset: false }).then(function (r) {
    if (r && r.key) CAL.feeds[id] = r.key;
    else CAL.error = 'No link came back. Try again in a moment.';
  }, function (err) {
    CAL.error = calProblem(err);
  }).then(function () { CAL.making = ''; redrawCalendar(); });
}

/* THE HUB'S OWN WORDS for each refusal (hub-app.js calendarProblem). The
   function refuses three different things and only one of them is "try
   again": somebody not linked to the address book can try all day. */
function calProblem(e) {
  var code = String((e && e.code) || '').replace(/^functions\//, '');
  if (code === 'unauthenticated') return 'Sign in again and then try this.';
  if (code === 'permission-denied') return 'Only someone on a team has a rota to put in a calendar.';
  if (code === 'failed-precondition' || code === 'invalid-argument') return (e && e.message)
    || 'Your account is not linked to the address book yet, so there is no rota to show.';
  return 'Could not get your link just now. Try again in a moment.';
}

function redrawCalendar() {
  A.sheet('calendar', calendarSheet());
  /* Registering the sheet only stores it. If it is open in front of
     somebody - which it is, the moment they tap "Set this one up" - the
     page has to be drawn again or they watch "Making your link…" for
     ever. */
  if (A.state().sheet === 'calendar') A.draw(); else A.refresh('me', 'me');
}

function calFeedButtons(key) {
  var url = FEED_BASE + '?k=' + encodeURIComponent(key);
  var webcal = url.replace(/^https?:\/\//, 'webcal://');
  var google = 'https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(webcal);
  /* Real links, not data-act: a webcal:// address has to be followed by
     the phone, which is the whole point of it. */
  return '<div class="actions" style="margin:8px 0 2px">'
    + '<a class="btn" href="' + A.esc(webcal) + '">' + ic('smartphone', 15) + ' Apple / iPhone</a>'
    + '<a class="btn" href="' + A.esc(google) + '" target="_blank" rel="noopener">'
      + ic('calendar', 15) + ' Google</a>'
    + '<a class="btn" href="' + A.esc(webcal) + '">' + ic('mail', 15) + ' Outlook</a>'
    + '</div>';
}

function calendarSheet() {
  var body;
  if (CAL.state === 'loading' || CAL.state === 'idle') {
    body = '<p>Getting your links…</p>';
  } else if (CAL.state === 'failed') {
    body = '<p>Could not get your calendar links just now. Try again in a moment, '
         + 'or set them up on the full website.</p>';
  } else {
    body = CAL_KINDS.map(function (k) {
      var id = k[0], key = CAL.feeds[id];
      var head = '<div style="font-weight:600;color:var(--ink);font-size:14px">' + A.esc(k[2]) + '</div>'
        + '<div style="font-size:12.5px;color:var(--muted);margin:2px 0 0">' + A.esc(k[3]) + '</div>';
      var inner = key
        ? calFeedButtons(key)
          + '<div class="actions"><button class="btn" data-act="copycal:' + A.esc(idKey(id)) + '">'
            + ic('copy', 15) + ' Copy link</button></div>'
        : (CAL.making === id
            ? '<p class="example" style="text-align:left;margin:8px 0 0">Making your link…</p>'
            : '<div class="actions" style="margin-top:8px">'
              + '<button class="btn primary" data-act="makecal:' + A.esc(idKey(id)) + '">'
              + ic('plus', 15) + ' Set this one up</button></div>');
      return '<div class="card" style="padding:14px;margin-bottom:10px">' + head + inner + '</div>';
    }).join('')
    + (CAL.error ? '<p class="example" style="color:#b0392c">' + A.esc(CAL.error) + '</p>' : '')
    + '<p class="example">Apple and Outlook subscribe to it, so new dates appear by '
    + 'themselves. Keep the link to yourself: anybody with it can see those dates.</p>';
  }
  return '<h3>Add to my calendar</h3>'
    + '<p>Your dates, in the calendar you already use.</p>'
    + body
    + '<div class="actions"><button class="btn" data-act="close">Close</button></div>';
}

/* data-act allows letters only, and "full:all" has a colon in it. The
   sheet uses a short safe name and this turns it back. */
function idKey(id) { return id.replace(/[^a-z]/g, ''); }
function idFromKey(k) {
  for (var i = 0; i < CAL_KINDS.length; i++) if (idKey(CAL_KINDS[i][0]) === k) return CAL_KINDS[i][0];
  return '';
}

/* ---- View as, ON ME, master admin only (§7e) ------------------------
   Where the website's strip across every screen used to be. It writes
   the same sessionStorage key the website's own bar uses, so the two
   cannot disagree about who is being looked at. */
A.sheet('viewas',
  '<h3>View as somebody else</h3>'
  + '<p>See what a member of another team sees. It changes nothing for them, '
  + 'and it lasts until you turn it off.</p>'
  + '<div class="card list">'
  + Object.keys(A.SPACES).filter(function (k) { return (A.SPACES[k].teams || []).length; })
      .map(function (k) {
        var s = A.SPACES[k];
        return row('eye', s.label, 'As a member of ' + s.label, null,
                   'viewas:' + k, s.colour, s.tint);
      }).join('')
  + '</div>'
  + '<div class="actions">'
  + '<button class="btn primary" data-act="viewas:off">Stop viewing as somebody else</button>'
  + '<button class="btn" data-act="close">Close</button></div>');

/* The two actions those sheets need. Handled here rather than in the
   shell, because they are this screen's business - the shell knows
   about navigation, not about calendars. */
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-act]');
  if (!b) return;
  var a = b.dataset.act || '';

  /* Set one up. The feed ids have a colon in them (full:all) and data-act
     allows letters only, so the button carries the short name. */
  if (a.indexOf('makecal:') === 0) {
    var make = idFromKey(a.slice(8));
    if (make) makeCalendarFeed(make);
    return;
  }

  if (a.indexOf('copycal:') === 0) {
    var key = CAL.feeds[idFromKey(a.slice(8))];
    if (!key) return;
    var url = FEED_BASE + '?k=' + encodeURIComponent(key);
    (navigator.clipboard && navigator.clipboard.writeText
      ? navigator.clipboard.writeText(url) : Promise.reject())
      .then(function () { A.toast('Link copied. Paste it into your calendar.'); },
            function () { A.toast('Could not copy it. Open the full website instead.'); });
    return;
  }

  /* The Rota tab's "+". The shell's actOk list allows a bare word, so
     this needs no new shape in it. */
  if (a === 'newevent') {
    if (window.EGBCCoreRota) EGBCCoreRota.newEvent();
    return;
  }

  if (a.indexOf('viewas:') === 0) {
    var which = a.slice(7);
    try {
      if (which === 'off') sessionStorage.removeItem('egbc_view_as');
      else sessionStorage.setItem('egbc_view_as',
        JSON.stringify({ team: (A.SPACES[which] || {}).teams[0], role: 'member' }));
    } catch (err) {}
    /* A reload, because who you are is decided while the page loads -
       the profile, the teams, the spaces and the Menu all read it once. */
    location.reload();
  }
});

/* A TEAM'S ROTA: MY NEXT DATES, AND THE TEAM'S COMING SUNDAYS.
   Martin, 11 Oct: it showed no dates at all, only "say which Sundays you
   can do" - which is the form, not the rota. The mock-up's Rota tab
   answers "when am I on, and who else is on when".

   It reuses the rota Home already loads rather than reading `events` a
   second time: one load per page, and the two screens cannot disagree
   about what is coming. */
var TEAMROTA = { loaded: false, ready: false, dates: [] };

function loadTeamRota() {
  if (TEAMROTA.loaded) return;
  TEAMROTA.loaded = true;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  db.collection('events').get().then(function (snap) {
    var out = [];
    snap.forEach(function (d) {
      var e = d.data() || {};
      if (e.archived === true || !e.date) return;
      var when = new Date(e.date + 'T00:00:00');
      if (isNaN(when) || when < today) return;
      var a = e.assignments || {}, who = [];
      Object.keys(a).forEach(function (role) {
        if (a[role] && a[role].name) who.push({ role: role, name: a[role].name, id: a[role].id || '' });
      });
      out.push({ when: when, date: e.date, title: e.type || 'Service',
                 start: e.startTime || '', arrive: e.arriveTime || e.arrives || '',
                 teams: Array.isArray(e.teams) ? e.teams : [], who: who });
    });
    out.sort(function (x, y) { return x.when - y.when; });
    TEAMROTA.dates = out;
  }).catch(function () {}).then(function () {
    TEAMROTA.ready = true;
    var s = A.state();
    if (s.tab === 'rota') A.refresh(s.space, 'rota');
  });
}

function teamRota(label, spaceKey) {
  loadTeamRota();
  var me = A.who();
  var sp = A.SPACES[spaceKey] || A.SPACES.me;
  var teams = sp.teams || [];
  var mine = TEAMROTA.dates.filter(function (d) {
    return d.teams.some(function (t) { return teams.indexOf(t) !== -1; });
  });

  var out = head('Your rota', label);

  /* MY next dates on this team. */
  var minePersonal = mine.filter(function (d) {
    return d.who.some(function (w) { return w.id && w.id === me.memberId; });
  }).slice(0, 3);

  if (minePersonal.length) {
    out += sec('You are on', minePersonal.map(function (d) {
      var roles = d.who.filter(function (w) { return w.id === me.memberId; })
                       .map(function (w) { return w.role; });
      var time = d.arrive ? 'arrive ' + d.arrive : d.start;
      return next(String(d.when.getDate()), homeMonth(d.when), roles.join(' and '),
        d.title + (time ? ' · ' + time : ''), '', sp.colour, sp.tint);
    }).join(''));
  } else if (TEAMROTA.ready) {
    out += sec('You are on', '<div class="card" style="padding:14px">'
      + '<p style="margin:0;font-size:14px">Nothing on the rota for you yet. '
      + 'Say which Sundays you can do and the planner will put you on.</p></div>');
  }

  /* The team's coming Sundays, whoever is on them. */
  if (mine.length) {
    out += sec('Coming up', card(mine.slice(0, 6).map(function (d) {
      var names = d.who.map(function (w) { return w.name.split(/\s+/)[0]; });
      var seen = {}, firsts = [];
      names.forEach(function (n) { if (!seen[n]) { seen[n] = 1; firsts.push(n); } });
      return row('calendar-check',
        d.when.getDate() + ' ' + homeMonth(d.when) + ' · ' + d.title,
        firsts.length ? firsts.join(', ') : 'Nobody on it yet',
        null, null, sp.colour, sp.tint);
    }).join('')), ['Whole rota', 'open:view-only-rota.html']);
  } else {
    out += sec('Coming up', '<div class="card" style="padding:14px"><p style="margin:0;font-size:14px">'
      + (TEAMROTA.ready ? 'Nothing on the rota for this team yet.' : 'Finding the rota…')
      + '</p></div>');
  }

  out += card(row('calendar-check-2', 'My availability', 'Say which Sundays you can do',
    null, 'open:index.html', sp.colour, sp.tint));
  return out;
}

function teamTeam(space, extra) {
  return head(A.SPACES[space].label) + card(extra);
}

    /* MISSING UNTIL NOW, and it was a leftover from the board being
       leaders-only: every other team space offers its board and Kids
       Church did not, so the people the board is FOR had no way to it
       from the app (Martin, 10 Oct 2026). */
    row('sticky-note', 'Pin boards', 'Suggestions and ideas', null,
        'open:stickynotes.html?board=kids') +
    row('clipboard-list', "Children's register", 'Who came, by group and term', null, 'open:kids-admin.html') +
    row('scan-line', 'Sunday check-in', 'The desk on a Sunday morning', null, 'open:kids-checkin.html') +
    row('folder-open', 'Lesson plans and resources', "This term's material", null, 'open:resources.html'));
});

/* ---- Core Team (APP-DESIGN-BRIEF §7b) ---------------------------------
   Martin, 10 Oct 2026: "why isnt there a core team area in the phone app?
   They will be doing the sunday service plans from the phone app. Look at
   the current core team phone app!"

   PLAN IS CORETEAMAPP'S OWN PLANNER, not a new one and not the desktop
   page. §7b says to move or share that code and lose nothing it does, so
   it was lifted out of CoreTeamApp.html into egbc-core-planner.js and
   BOTH pages now run it. tests/check-core-planner.mjs asks the same
   questions of both.

   Rota and Meetings are §7b's other two tabs and are NOT registered yet,
   so they are not offered as tabs at all. A tab that is there and does
   nothing is worse than a tab that is not there - and the shell's
   tabsFor() only offers a tab a screen is registered for, which is what
   makes that safe to say. */

A.screen('core', 'plan', function () {
  /* The shell rebuilds a tab's HTML on every draw, so the planner cannot
     be returned as a string - it would be thrown away along with whatever
     somebody had typed into it. It is mounted into a container the shell
     leaves alone, after the draw. */
  setTimeout(mountCorePlanner, 0);
  return head('This Sunday', 'The order of service')
    + '<div id="core-plan-host" class="sp-host"></div>';
});

function mountCorePlanner() {
  var host = document.getElementById('core-plan-host');
  if (!host || !window.EGBCCorePlanner) return;
  EGBCCorePlanner.mount({
    into: host,
    db: EGBCAuth.db,
    /* The planner's own toast and loader were CoreTeamApp's. In here they
       are the shell's, so "Service saved" looks like everything else the
       app says. */
    toast: function (m) { A.toast(m); },
    loader: function () {}
  });
}

/* ROTA (§7b): "the rota planner as CoreTeamApp has it on the phone
   (assign the team, + for a new service)." CoreTeamApp's own, shared.

   THE "+" IS THE SCREEN'S, NOT THE TOOLBAR'S. In the Core Team app it is
   the header button beside the title; putting one in the shared toolbar
   would have added a button to their app that was never there, so the
   app draws its own row and calls the same function. */
A.screen('core', 'rota', function () {
  setTimeout(mountCoreRota, 0);
  return head('Rota', 'Who is on, and who is free')
    + card(row('plus', 'New service or meeting', 'Pick a date and a type', null, 'newevent',
               A.SPACES.core.colour, A.SPACES.core.tint))
    + '<div id="core-rota-host" class="cr-host"></div>';
});

function mountCoreRota() {
  var host = document.getElementById('core-rota-host');
  if (!host || !window.EGBCCoreRota) return;
  EGBCCoreRota.mount({
    into: host, db: EGBCAuth.db,
    toast: function (m) { A.toast(m); },
    loader: function () {}
  });
}

/* MEETINGS (§7b): join a call, and what is coming up with a room on it.
   CoreTeamApp's own list, shared the same way the planner is. It has a
   live rota listener to feed it; the app has none, so the module reads
   `events` once for itself - which is the only difference between the
   two. */
A.screen('core', 'meetings', function () {
  setTimeout(mountCoreMeetings, 0);
  return head('Meetings', 'Join a call, and what is coming up')
    + '<div id="core-meet-host"></div>';
});

function mountCoreMeetings() {
  var host = document.getElementById('core-meet-host');
  if (!host || !window.EGBCCoreMeetings) return;
  EGBCCoreMeetings.mount({ into: host, toast: function (m) { A.toast(m); } });
}

A.screen('core', 'team', function () {
  return teamTeam('core',
    row('scroll-text', 'Our charter', 'What Core Team is for, and how it works', null,
        'open:Coreteamcharter.html') +
    row('sticky-note', 'Pin boards', 'Suggestions and ideas', null,
        'open:stickynotes.html?board=core-team') +
    /* THE PHONE EMAIL COMPILER, which is CoreTeamApp's. EmailBuilder2 is
       the desktop one and scrolls 321px sideways at 375px (APP-PARITY
       part 3), so the app does not open it. Pointing at the installed
       Core Team app is the same answer Martin already took for
       Performance Notes (G-1 option a): an app that is already on the
       phone and already does the job. It becomes a tab here when the
       compiler is shared the way the planner now is. */
    row('mail', 'Email the church', 'Write and send it, in the Core Team app', null,
        'open:CoreTeamApp.html') +
    row('video', 'Team meeting room', 'Join a video call', null, 'open:meeting.html') +
    row('folder-open', 'Team resources', 'Documents and links', null, 'open:resources.html'));
});

/* ---- Maintenance ------------------------------------------------------ */

A.screen('maint', 'jobs', function () {
  return head('Maintenance', 'Jobs reported by the church')
    + card(row('wrench', 'Jobs, and reporting one', 'What needs fixing, and marking it done', null, 'open:maintenance.html'));
});

A.screen('maint', 'team', function () {
  return teamTeam('maint',
    row('folder-open', 'Team resources', 'Documents and links', null, 'open:resources.html'));
});

/* ---- Running things --------------------------------------------------- */

A.screen('office', 'people', function () {
  return head('People')
    + card(
        row('search', 'Address book', 'Find someone, add a person or a family', null, 'open:addressbook.html') +
        row('badge-check', 'Church members', 'Who has formally joined', null, 'open:addressbook.html'));
});

A.screen('office', 'send', function () {
  /* NEITHER OF THESE OPENS FROM THE PHONE YET, and saying so is better
     than dropping somebody onto a page that fights them (Martin, 11 Oct).

     An email: EmailBuilder2.html is the worst page in the app's list at
     375px - +321px of sideways scroll, a 696px dialog, the toolbar cut
     off (APP-PARITY part 2). CoreTeamApp already has a phone email
     compiler; this row becomes that one when Core Team > Team is built
     (§7b), and until then it does not pretend.

     A notice: the notice editor lives inside hub.html, and §7d says the
     app never opens the website's home. It needs a phone screen of its
     own, which is a later stage. */
  return head('Send something')
    + card(
        row('mail', 'An email', 'Easier on a computer for now', null, 'toast:The email compiler needs a big screen. It comes to the app with the Core Team space.') +
        row('megaphone', 'A notice', 'Easier on a computer for now', null, 'toast:Writing a notice needs a big screen for now. Open the full website from Me.'))
    + A.empty('monitor', 'Both of these are easier on a computer today. '
        + 'They get phone screens of their own in a later stage.');
});

A.screen('office', 'bookings', function () {
  return head('Room bookings')
    + card(row('door-open', 'Requests and the diary', 'What is waiting, and what is booked', null, 'open:bookings-admin.html'));
});

/* Nothing starts until the guard says who this is. */
document.addEventListener('egbc-ready', function () {
  /* The events window's screens go on BEFORE the first draw, so nobody sees
     the shell's interim rows flash and be replaced (F-141). Guarded,
     because the shell has to draw whether or not that file loaded. */
  try {
    if (window.EGBCAppEvents && EGBCAppEvents.mountAll) EGBCAppEvents.mountAll(EGBCApp);
  } catch (e) { console.warn('app: the events screens did not mount', e); }
  EGBCApp.start();
});
</script>
