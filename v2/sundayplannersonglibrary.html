<!DOCTYPE html>
<html>
<head>
<script src="egbc-shell.js?v=202609041459" data-title="Song Library - quick view"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202609041459"></script>
<script src="egbc-guard.js?v=202609041459" data-team="Worship Team"></script>
    <title>Song Library - Quick View</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root{
            --canvas:#eef4f3; --surface:#fff; --surface-2:#f6faf9; --ink:#14201f; --body:#3a4d4c; --muted:#6b8281; --faint:#93a8a6; --hairline:#dde7e6; --hairline-strong:#c9d8d6; --brand:#3d6263; --brand-dark:#2e4c4d; --brand-tint:#e7f0ef; --brand-ring:rgba(61,98,99,.28); --success:#3b7d23; --success-tint:#e7f1e0; --danger:#b0392c; --danger-tint:#f7e7e4; --gold:#b07d2e; --gold-tint:#f6efe1;
            --shadow-sm:0 1px 2px rgba(20,32,31,.05); --shadow:0 1px 2px rgba(20,32,31,.04),0 6px 20px rgba(20,32,31,.07); --shadow-lg:0 2px 4px rgba(20,32,31,.05),0 18px 48px rgba(20,32,31,.12);
            --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            color: var(--body);
            background-color: var(--canvas);
            font-size: 16px;
        }

        #left {
            width: 300px;
            padding: 22px;
            overflow-y: auto;
            background-color: var(--surface);
            margin: 15px;
            border-radius: var(--r-lg);
            border: 1px solid var(--hairline);
            box-shadow: var(--shadow);
        }

        #right {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--surface);
            margin: 15px 15px 15px 0;
            border-radius: var(--r-lg);
            border: 1px solid var(--hairline);
            box-shadow: var(--shadow);
        }

        .song {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--hairline);
            border-radius: var(--r-md);
            transition: background 0.2s;
        }

        .song:hover { background: var(--surface-2); }

        .song-title-text {
            font-weight: 600;
            font-size: 14px;
            color: var(--ink);
        }

        .song-stats {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .stat-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: var(--r-pill);
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .stat-total { background: var(--brand-tint); color: var(--brand); }
        .stat-recent { background: var(--gold-tint); color: var(--gold); }
        .stat-recent.warning { background: var(--danger-tint); color: var(--danger); }
        .stat-last { background: var(--surface-2); color: var(--muted); }
        .stat-never { background: var(--surface-2); color: var(--muted); }

        h2 { color: var(--ink); margin-top: 0; font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }

        label {
            display: block;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--muted);
            padding-left: 2px;
            margin-top: 15px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        input {
            width: 100%;
            padding: 11px 16px;
            margin-bottom: 5px;
            border: 1px solid var(--hairline-strong);
            border-radius: var(--r-md);
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            color: var(--ink);
            background: var(--surface);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-ring);
        }

        .link-container {
            margin-top: 5px;
            margin-bottom: 20px;
            padding-left: 6px;
        }

        .external-link {
            display: inline-block;
            color: var(--brand);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .external-link:hover { text-decoration: underline; }

        button {
            background-color: var(--brand);
            color: #fff;
            padding: 11px 20px;
            border: none;
            border-radius: var(--r-md);
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            transition: background 0.15s;
            margin-top: 20px;
        }

        button:hover { background-color: var(--brand-dark); }
        button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--brand-ring); }
        button:active { transform: translateY(1px); }

        .delete-btn {
            background-color: var(--danger);
            margin-left: 10px;
        }

        .delete-btn:hover { background-color: #8f2d23; }

        .status-msg {
            font-size: 11px;
            color: var(--muted);
            height: 15px;
            font-weight: 700;
            padding-left: 6px;
        }

        .usage-panel {
            background: var(--surface-2);
            border: 1px solid var(--hairline);
            border-radius: var(--r-md);
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .usage-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .usage-stat-number {
            font-size: 24px;
            font-weight: 800;
            color: var(--brand);
            line-height: 1;
        }

        .usage-stat-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
        }

        .usage-divider { width: 1px; height: 40px; background: var(--hairline-strong); }

        .usage-last { font-size: 13px; font-weight: 700; color: var(--brand); }
        .usage-last-label { font-size: 11px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
        .usage-warning { font-size: 11px; font-weight: 700; color: var(--danger); background: var(--danger-tint); padding: 4px 12px; border-radius: var(--r-pill); }

        /* Mobile: stack the song list above the editor (full width) */
        @media (max-width: 800px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            #left {
                width: auto;
                max-height: 45vh;
                margin: 15px 15px 8px 15px;
            }
            #right {
                margin: 0 15px 15px 15px;
            }
        }
    </style>
</head>

<body>

<div id="left">
    <label>Search Titles</label>
    <input id="search" placeholder="Search songs..." oninput="searchSongs()">
    <label>Search Lyrics</label>
    <input id="lyricsSearch" placeholder="Find by lyrics..." onkeydown="handleLyricsSearch(event)">
    <div id="list"></div>
</div>

<div id="right">
    <h2 id="display-title">Select a Song</h2>
    <div id="editor" style="display:none;">

        <div class="usage-panel" id="usage-panel">
            <span style="font-size:11px; color:var(--muted); font-weight:700;">Loading usage stats...</span>
        </div>

        <label>Song Title</label>
        <input id="edit-title">

        <label>Artist</label>
        <input id="artist" placeholder="Scanning for artist...">
        <div id="artist-status" class="status-msg"></div>

        <label>YouTube Link</label>
        <input id="youtube" onchange="smartScanArtist()" placeholder="Paste YouTube link here">
        <div class="link-container" id="yt-link-box"></div>

        <label>CCLI Number</label>
        <input id="ccli" placeholder="Enter CCLI Number">
        <div class="link-container" id="ccli-link-box"></div>

        <div style="display: flex; align-items: center;">
            <button onclick="save()">Save Changes</button>
            <button class="delete-btn" onclick="deleteSong()">Delete</button>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentDoc = null;
let servicesCache = null;

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){return /^(https?:|mailto:)/i.test(String(u||'').trim())?String(u).trim():'';}

async function getServicesCache() {
    if (servicesCache) return servicesCache;
    const snap = await db.collection("services").get();
    servicesCache = snap.docs.map(d => d.data());
    return servicesCache;
}

// Get usage stats by scanning services.order[] for matching song titles
async function getSongUsageStats(songTitle) {
    const services = await getServicesCache();
    const title = songTitle.trim().toLowerCase();

    // Collect all service dates where this song appears
    const matchingDates = [];
    services.forEach(service => {
        if (!service.date || !Array.isArray(service.order)) return;
        const hasSong = service.order.some(item =>
            item.type === "song" && (item.title || "").trim().toLowerCase() === title
        );
        if (hasSong) matchingDates.push(service.date);
    });

    // Deduplicate dates
    const uniqueDates = [...new Set(matchingDates)];
    const totalCount = uniqueDates.length;

    // Last 3 months
    const threeMonthsAgo = new Date();
    threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
    const threeMonthStr = threeMonthsAgo.toISOString().split("T")[0];
    const recentCount = uniqueDates.filter(d => d >= threeMonthStr).length;

    // Last used date
    const sortedDates = [...uniqueDates].sort();
    const lastUsed = sortedDates.length > 0 ? sortedDates[sortedDates.length - 1] : null;

    return { totalCount, recentCount, lastUsed };
}

function formatDate(dateStr) {
    if (!dateStr) return null;
    const [y, m, d] = dateStr.split("-");
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function normalizeTitle(title) { return title.toLowerCase().trim(); }

async function loadSongs() {
    const snapshot = await db.collection("songs").orderBy("normalized").get();
    getServicesCache(); // pre-load in background
    renderList(snapshot.docs);
}

async function renderList(docs) {
    const list = document.getElementById("list");
    list.innerHTML = docs.map(doc => `
        <div class="song" onclick="openSong('${doc.id.replace(/'/g, "\\'")}')">
            <div class="song-title-text">${escapeHtml(doc.data().title)}</div>
            <div class="song-stats" id="stats-${doc.id}">
                <span class="stat-badge stat-never">Loading...</span>
            </div>
        </div>
    `).join("");

    for (const doc of docs) {
        const stats = await getSongUsageStats(doc.data().title);
        const statsEl = document.getElementById(`stats-${doc.id}`);
        if (!statsEl) continue;

        if (stats.totalCount === 0) {
            statsEl.innerHTML = `<span class="stat-badge stat-never">Never used</span>`;
        } else {
            let html = `<span class="stat-badge stat-total">✦ ${stats.totalCount} total</span>`;
            if (stats.recentCount > 0) {
                const cls = stats.recentCount >= 3 ? "stat-recent warning" : "stat-recent";
                html += `<span class="stat-badge ${cls}">↺ ${stats.recentCount} recent</span>`;
            }
            if (stats.lastUsed) {
                html += `<span class="stat-badge stat-last">Last: ${formatDate(stats.lastUsed)}</span>`;
            }
            statsEl.innerHTML = html;
        }
    }
}

async function searchSongs() {
    const input = document.getElementById("search").value;
    if (!input) { loadSongs(); return; }
    const norm = normalizeTitle(input);
    const snapshot = await db.collection("songs")
        .orderBy("normalized").startAt(norm).endAt(norm + "\uf8ff").get();
    renderList(snapshot.docs);
}

async function openSong(id) {
    const doc = await db.collection("songs").doc(id).get();
    const data = doc.data();
    currentDoc = id;

    document.getElementById("editor").style.display = "block";
    document.getElementById("display-title").innerText = data.title;
    document.getElementById("edit-title").value = data.title;
    document.getElementById("artist").value = data.artist || "";

    const ytVal = data.youtube || "";
    document.getElementById("youtube").value = ytVal;
    updateYoutubeLink(ytVal);

    const ccliVal = data.ccli || "";
    document.getElementById("ccli").value = ccliVal;
    updateCCLILink(ccliVal);

    document.getElementById("artist-status").innerText = "";
    renderUsagePanel(data.title);

    if (!data.artist && ytVal) {
        smartScanArtist();
    }
}

async function renderUsagePanel(songTitle) {
    const panel = document.getElementById("usage-panel");
    panel.innerHTML = `<span style="font-size:11px; color:#5b8e8f; font-weight:700;">Loading usage stats...</span>`;

    const stats = await getSongUsageStats(songTitle);

    if (stats.totalCount === 0) {
        panel.innerHTML = `
            <div class="usage-stat">
                <span class="usage-stat-number">0</span>
                <span class="usage-stat-label">Times Used</span>
            </div>
            <div class="usage-divider"></div>
            <span style="font-size:12px; color:#aaa; font-weight:700;">This song hasn't been used yet</span>
        `;
        return;
    }

    const recentWarning = stats.recentCount >= 2
        ? `<span class="usage-warning">⚠ Used ${stats.recentCount}x in last 3 months</span>`
        : "";

    panel.innerHTML = `
        <div class="usage-stat">
            <span class="usage-stat-number">${stats.totalCount}</span>
            <span class="usage-stat-label">All Time</span>
        </div>
        <div class="usage-divider"></div>
        <div class="usage-stat">
            <span class="usage-stat-number" style="color: ${stats.recentCount >= 3 ? '#b22222' : stats.recentCount >= 1 ? '#e65100' : '#3d6263'}">${stats.recentCount}</span>
            <span class="usage-stat-label">Last 3 Months</span>
        </div>
        <div class="usage-divider"></div>
        <div class="usage-stat">
            <span class="usage-last">${stats.lastUsed ? formatDate(stats.lastUsed) : "—"}</span>
            <span class="usage-last-label">Last Used</span>
        </div>
        ${recentWarning ? `<div class="usage-divider"></div>${recentWarning}` : ""}
    `;
}

function updateYoutubeLink(url) {
    const box = document.getElementById("yt-link-box");
    const safe = safeUrl(url);
    if (safe) {
        box.innerHTML = `<a href="${escapeHtml(safe)}" target="_blank" class="external-link">▶ Watch on YouTube</a>`;
    } else {
        box.innerHTML = "";
    }
}

function updateCCLILink(val) {
    const box = document.getElementById("ccli-link-box");
    if (val && val.trim() !== "") {
        const cleanCCLI = val.replace(/\D/g, '');
        box.innerHTML = `<a href="https://songselect.ccli.com/Songs/${cleanCCLI}" target="_blank" class="external-link">📄 View on CCLI SongSelect</a>`;
    } else {
        box.innerHTML = "";
    }
}

document.getElementById("youtube").addEventListener("input", (e) => updateYoutubeLink(e.target.value));
document.getElementById("ccli").addEventListener("input", (e) => updateCCLILink(e.target.value));

async function smartScanArtist() {
    const youtubeUrl = document.getElementById("youtube").value;
    const songTitleFromDB = document.getElementById("edit-title").value;
    const status = document.getElementById("artist-status");

    if (!youtubeUrl) return;
    status.innerText = "Scanning YouTube...";

    try {
        const response = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(youtubeUrl)}`);
        const data = await response.json();

        if (data.title) {
            let videoTitle = data.title;
            let artist = "";
            const separators = [" - ", " | ", " // ", " — "];
            let parts = [videoTitle];

            for (let sep of separators) {
                if (videoTitle.includes(sep)) {
                    parts = videoTitle.split(sep);
                    break;
                }
            }

            if (parts.length > 1) {
                const part1 = parts[0].trim();
                const part2 = parts[1].trim();
                if (part1.toLowerCase().includes(songTitleFromDB.toLowerCase())) {
                    artist = part2;
                } else {
                    artist = part1;
                }
            } else {
                const regex = new RegExp(songTitleFromDB.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "gi");
                artist = videoTitle.replace(regex, "");
            }

            artist = artist.replace(/^\s*by\s+/i, "").replace(/\s+by\s*$/i, "").trim();
            artist = artist.replace(/\(.*\)|\[.*\]/g, "")
                           .replace(/lyrics|official video|live|video|audio|hd|4k/gi, "")
                           .replace(/^[:\-\s\u2013\u2014]+|[:\-\s\u2013\u2014]+$/g, "")
                           .trim();

            if (!artist || artist.length < 2) {
                artist = data.author_name.replace("- Topic", "").trim();
            }

            document.getElementById("artist").value = artist;
            status.innerText = "Artist scanned!";
            setTimeout(() => { status.innerText = ""; }, 3000);
        }
    } catch (e) {
        status.innerText = "";
    }
}

async function save() {
    if (!currentDoc) return;
    const newTitle = document.getElementById("edit-title").value;
    try {
        await db.collection("songs").doc(currentDoc).update({
            title: newTitle,
            normalized: normalizeTitle(newTitle),
            artist: document.getElementById("artist").value,
            youtube: document.getElementById("youtube").value,
            ccli: document.getElementById("ccli").value
        });
        document.getElementById("display-title").innerText = newTitle;
        alert("Saved.");
        loadSongs();
    } catch (err) {
        console.error(err);
        alert("Error saving. Please try again.");
    }
}

async function deleteSong() {
    if (!currentDoc || !confirm("Delete this song?")) return;
    await db.collection("songs").doc(currentDoc).delete();
    document.getElementById("editor").style.display = "none";
    currentDoc = null;
    loadSongs();
}

async function handleLyricsSearch(e) {
    if (e.key !== "Enter") return;
    const text = document.getElementById("lyricsSearch").value;
    if (!text) { loadSongs(); return; }

    try {
        const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(text)}&entity=song&limit=5`);
        const result = await response.json();
        if (!result.results || result.results.length === 0) { alert("No matches."); return; }

        const allSongsSnapshot = await db.collection("songs").get();
        const allSongs = allSongsSnapshot.docs;
        const matchingDocs = [];
        const seenIds = new Set();

        for (let item of result.results) {
            const onlineTitle = normalizeTitle(item.trackName);
            allSongs.forEach(doc => {
                const dbTitle = normalizeTitle(doc.data().title);
                const isPhraseMatch = dbTitle.includes(onlineTitle) || onlineTitle.includes(dbTitle);
                if (isPhraseMatch && !seenIds.has(doc.id)) {
                    matchingDocs.push(doc);
                    seenIds.add(doc.id);
                }
            });
        }
        renderList(matchingDocs);
    } catch (err) { console.error(err); }
}

loadSongs();
</script>
</body>
</html>
