<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your place</title>

<script src="egbc-nosend.js?v=202610212000"></script>
<script src="egbc-shell.js?v=202610261800" data-title="Your place"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610261800"></script>
<script src="egbc-church.js?v=202610192330"></script>
<script src="egbc-ics.js?v=202610091200"></script>
<script src="egbc-email.js?v=202610212000"></script>
<script src="egbc-events.js?v=202610262000"></script>
<script src="egbc-launch.js?v=202610141700"></script>
<script src="egbc-events-usual.js?v=202610151900"></script>
<script src="egbc-events-qr.js?v=202610072300"></script>
<script src="egbc-events-checkin.js?v=202610152300"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#3d6263;--brand-dark:#2a4a4b;--tint:#eef5f4;--ink:#111827;--body:#374151;
    --muted:#6b7280;--line:#e5e7eb;--line-2:#d1d5db;--canvas:#f6f7f7;
    --ok:#15803d;--ok-bg:#ecfdf3;--danger:#b0392c;--danger-bg:#fdf1ef;
    --card:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--body);
       font:400 14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 64px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:20px;margin-bottom:14px}
  h1{font-size:22px;font-weight:700;color:var(--ink);margin:0 0 6px}
  h2{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .meta{color:var(--muted);font-size:14px;margin:0 0 4px;display:flex;gap:8px;align-items:flex-start}
  .meta i{flex:none;margin-top:2px;color:var(--brand)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .row:first-of-type{border-top:none}
  .row .k{color:var(--muted)}
  .row .v{color:var(--ink);font-weight:500;text-align:right}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
       border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent;
       background:var(--brand);color:#fff;text-decoration:none}
  .btn:hover{background:var(--brand-dark)}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
  .btn.sec:hover{background:#f3f4f6}
  .btn.danger{background:#fff;color:var(--danger);border-color:#e8c3bd}
  .btn.danger:hover{background:var(--danger-bg)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .banner{border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:14px}
  .banner.warn{background:var(--danger-bg);color:var(--danger)}
  .banner.ok{background:var(--ok-bg);color:var(--ok)}
  .banner.info{background:var(--tint);color:var(--body);border:1px solid #cfe0de}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card">Loading…</div></div>

<script>
(function () {
  'use strict';
  var E = window.EGBCEvents, esc = E.esc;
  var KEY = new URLSearchParams(location.search).get('key') || '';
  var SU = null, EV = null, WHERE = '';
  /* Pay on the day (F-183): what is owed, and whether it has been paid. */
  var TT = [], PAY = null;
  /* F-181: the church takes card payments, and this ticket may be paid by card. */
  var CARDNOW = false, ONLINE = [], PAIDBACK = /[?&]paid=(card|bank)\b/.test(location.search);
  /* The whole series (F-184): the other dates booked with this one. */
  var GROUP = null, GDATES = [];

  function draw() {
    var cancelled = SU.status === 'cancelled';
    var waiting = SU.status === 'waiting';
    var past = EV && (EV.endUtc || EV.startUtc) && (EV.endUtc || EV.startUtc) < Date.now();
    /* Self-cancel is a setting on the event. Where it is off, the page
       says who to ask rather than offering a button that will not work. */
    var mayCancel = !cancelled && !past && EV && EV.allowSelfCancel !== false;

    document.getElementById('wrap').innerHTML =
      '<div class="card">' +
        (cancelled ? '<div class="banner warn">This place has been cancelled.</div>' : '') +
        (waiting && !cancelled ? '<div class="banner info">You are on the waiting list. We will email you if a place comes free.</div>' : '') +
        (EV && EV.status === 'cancelled' ? '<div class="banner warn">The event itself has been cancelled.</div>' : '') +
        '<h1>' + esc(EV ? EV.title : 'Your place') + '</h1>' +
        (EV ? '<p class="meta"><i data-lucide="calendar-days" style="width:16px;height:16px"></i>' + esc(E.fmtWhen(EV)) + '</p>' : '') +
        (WHERE ? '<p class="meta"><i data-lucide="map-pin" style="width:16px;height:16px"></i>' + esc(WHERE) + '</p>' : '') +
        '<div style="margin-top:16px">' +
          '<div class="row"><span class="k">Booked by</span><span class="v">' + esc(SU.name) + '</span></div>' +
          '<div class="row"><span class="k">Email</span><span class="v">' + esc(SU.email) + '</span></div>' +
          '<div class="row"><span class="k">Places</span><span class="v">' + (SU.places || 1) + '</span></div>' +
          ((SU.attendees || []).length
            ? '<div class="row"><span class="k">Who is coming</span><span class="v">' +
              SU.attendees.map(function (a) { return esc(a.name); }).join('<br>') + '</span></div>' : '') +
          (function () {
            var due = E.toPay(SU, TT);
            /* F-181: paid online by card, waiting for it, or refunded. */
            if (PAY && (PAY.status === 'refunded' || PAY.status === 'part-refunded')) return '<div class="row" id="refunded"><span class="k">' + (PAY.status === 'refunded' ? 'Refunded' : 'Part refunded') + '</span><span class="v">' + E.money(PAY.refunded || PAY.amount) + '</span></div>';
            if (PAY && PAY.paid) return '<div class="row" id="paid"><span class="k">Paid</span><span class="v">' + E.money(PAY.amount) + (PAY.method === 'card-online' ? ' by card' : PAY.method === 'bank-online' ? ' by bank' : '') + '</span></div>';
            if (SU.status === 'confirmed' && (CARDNOW || (PAY && (PAY.method === 'card-online' || PAY.method === 'bank-online')))) {
              var held = PAY && PAY.holdUntil && PAY.holdUntil > Date.now() ? ' Your place is held until ' + E.fmtTime(new Date(PAY.holdUntil)) + '.' : '';
              return '<div class="row" id="due"><span class="k">To pay</span><span class="v">' + E.money(due) + (PAIDBACK ? '<br><span class="m" id="confirming">Thank you. Confirming your payment…</span>' : held) +
                (ONLINE.indexOf('card') >= 0 ? '<br><button class="btn" id="payNow" style="margin-top:6px">Pay ' + E.money(due) + ' by card</button>' : '') +
                (ONLINE.indexOf('bank') >= 0 ? '<br><button class="btn" id="payNowBank" style="margin-top:6px">Pay ' + E.money(due) + ' by bank</button>' : '') +
                '<span class="m" id="payMsg" role="status"></span></span></div>';
            }
            return due ? '<div class="row" id="due"><span class="k">To pay on the day</span><span class="v">' + E.money(due) + '</span></div>' : '';
          })() +
          (SU.notes ? '<div class="row"><span class="k">Your note</span><span class="v">' + esc(SU.notes) + '</span></div>' : '') +
        '</div>' +
        '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">' +
          (EV ? '<button class="btn sec" id="ics"><i data-lucide="calendar-plus" style="width:15px;height:15px"></i>Add to calendar</button>' : '') +
          (mayCancel ? '<button class="btn danger" id="cancel"><i data-lucide="x" style="width:15px;height:15px"></i>Cancel my place</button>' : '') +
          '<a class="btn ghost" href="whatson.html">What\'s on</a>' +
        '</div>' +
        (!mayCancel && !cancelled && !past && EV && EV.allowSelfCancel === false
          ? '<p style="font-size:13px;color:var(--muted);margin:14px 0 0">To change this booking, reply to your confirmation email.</p>' : '') +
      '</div>' +
      seriesCard(past) +
      codesCard(cancelled || waiting || past);

    if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
    var ics = document.getElementById('ics');
    if (ics) ics.onclick = function () { EGBCICS.download(EV.title || 'event', E.icsFor(EV, WHERE)); };
    var c = document.getElementById('cancel');
    if (c) c.onclick = doCancel;
    var ca = document.getElementById('cancelAll');
    if (ca) ca.onclick = cancelAll;
    drawUsualCard();
    /* "My messages" (R6, F-206): signed in, what the church has emailed me. */
    if (E.signedIn() && !document.getElementById('msgsLink')) document.getElementById('wrap').insertAdjacentHTML('beforeend',
      '<p style="margin:14px 0 0"><a id="msgsLink" href="my-messages.html" style="color:var(--brand,#3d6263);font-weight:600">My messages: what the church has emailed me</a></p>');
    [['payNow', 'card'], ['payNowBank', 'bank']].forEach(function (x) {
      var pn = document.getElementById(x[0]);
      if (pn) pn.onclick = function () {
        pn.disabled = true;
        E.callPublic('ticketPay', { key: KEY, method: x[1] }).then(function (res) { location.href = res.url; },
          function (e) { pn.disabled = false; document.getElementById('payMsg').textContent = ' ' + E.payProblem(e); });
      };
    });
    /* Back from Stripe: the payment is confirmed by Stripe's message to the
       hub, a moment later; watch for it rather than claim it early. */
    if (PAIDBACK && !(PAY && PAY.paid) && !draw.watching) {
      draw.watching = true;
      var stop = EGBCAuth.db.collection('signupPayments').doc(KEY).onSnapshot(function (s) {
        if (s.exists && s.data().paid) { PAY = s.data(); stop(); draw(); }
      }, function () {});
    }
    /* NO WEBHOOK NEEDED (F-209): the hub asks Stripe or GoCardless itself -
       has it been paid, refunded, or has the time run out? Once a visit;
       straight back from paying, a few times until it says paid. */
    if (!draw.asked && PAY && (PAY.method === 'card-online' || PAY.method === 'bank-online') && ['awaiting', 'paid', 'part-refunded'].indexOf(PAY.status) >= 0) {
      draw.asked = true;
      var tries = PAIDBACK && !PAY.paid ? 6 : 1;
      (function ask() {
        E.callPublic('paymentCheck', { key: KEY }).then(function (r) {
          if (r && r.status && r.status !== PAY.status) {
            return EGBCAuth.db.collection('signupPayments').doc(KEY).get().then(function (s) { if (s.exists) { PAY = s.data(); draw(); } });
          }
          if (--tries > 0 && !(PAY && PAY.paid)) setTimeout(ask, 3000);
        }, function () {});
      })();
    }
  }

  function seriesCard() {
    if (!GROUP) return '';
    var live = GDATES.filter(function (d) { return d.su && d.su.status !== 'cancelled' && (!d.ev || (d.ev.endUtc || d.ev.startUtc || 0) >= Date.now()); });
    var may = EV && EV.allowSelfCancel !== false && live.length > 0;
    return '<div class="card" id="series"><h2>The whole series</h2>' +
      '<p style="margin:0 0 10px;color:var(--muted);font-size:14px">You signed up to ' + GDATES.length + ' dates at once. Each has its own place and its own check-in code.</p>' +
      GDATES.map(function (d) {
        var st = !d.su ? '' : d.su.status === 'cancelled' ? ' - cancelled' : d.su.status === 'waiting' ? ' - waiting list' : '';
        return '<div class="row" data-date="' + esc(d.key) + '"><span class="v">' + (d.key === KEY ? '<strong>' : '<a href="my-signup.html?key=' + esc(d.key) + '" style="color:var(--brand)">') +
          esc(d.ev ? E.fmtWhen(d.ev) : 'A date') + (d.key === KEY ? ' (this page)</strong>' : '</a>') + esc(st) + '</span></div>';
      }).join('') +
      (may ? '<div style="margin-top:12px"><button class="btn danger" id="cancelAll">Cancel all ' + live.length + ' remaining dates</button></div>' : '') + '</div>';
  }
  function cancelAll() {
    if (!confirm('Cancel your place on every remaining date?')) return;
    var btn = document.getElementById('cancelAll'); btn.disabled = true;
    var todo = GDATES.filter(function (d) { return d.su && d.su.status !== 'cancelled' && (!d.ev || (d.ev.endUtc || d.ev.startUtc || 0) >= Date.now()); });
    todo.reduce(function (p, d) { return p.then(function () { return E.cancel(d.key); }); }, Promise.resolve())
      .then(loadSeries).then(function () { return EGBCAuth.db.collection('signups').doc(KEY).get(); })
      .then(function (s) { SU = s.data(); draw(); document.getElementById('wrap').insertAdjacentHTML('afterbegin', '<div class="card"><div class="banner ok" id="allGone">Your places on every remaining date have been given back.</div></div>'); })
      .catch(function (e) { btn.disabled = false; alert('Not all of them could be cancelled: ' + (e.message || e)); });
  }
  function loadSeries() {
    if (!GROUP) return Promise.resolve();
    return Promise.all(GROUP.keys.map(function (k, i) {
      return Promise.all([
        EGBCAuth.db.collection('signups').doc(k).get().then(function (s) { return s.exists ? s.data() : null; }, function () { return null; }),
        EGBCAuth.db.collection('calEvents').doc(GROUP.calEventIds[i]).get().then(function (s) { return s.exists ? s.data() : null; }, function () { return null; })
      ]).then(function (r) { return { key: k, su: r[0], ev: r[1] }; });
    })).then(function (list) { GDATES = list.sort(function (a, b) { return ((a.ev && a.ev.startUtc) || 0) - ((b.ev && b.ev.startUtc) || 0); }); });
  }

  /* One check-in code per person, the same ones the confirmation email
     carried. Shown only while there is something to check in to. */
  function codesCard(hide) {
    if (hide || !window.EGBCEventsQR || !window.EGBCCheckin || !SU.calEventId) return '';
    var people = (SU.attendees && SU.attendees.length) ? SU.attendees : [{ name: SU.name }];
    return '<div class="card"><h2>Checking in</h2>' +
      '<p style="margin:0 0 12px;color:var(--muted);font-size:14px">Show ' + (people.length > 1 ? 'these codes' : 'this code') +
      ' at the door' + (people.length > 1 ? ', one for each person' : '') + '. A screenshot works too.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:14px">' + people.map(function (a, i) {
        var code = EGBCCheckin.codeFor(SU.calEventId, KEY, i);
        return '<div style="text-align:center;width:170px" data-code="' + esc(code) + '">' + EGBCEventsQR.svg(code, 170) +
          '<div style="font-size:14px;font-weight:500;color:var(--ink);margin-top:4px">' + esc(a.name) + '</div></div>';
      }).join('') + '</div></div>';
  }

  function doCancel() {
    var btn = document.getElementById('cancel');
    btn.disabled = true;
    E.cancel(KEY).then(function () {
      return EGBCAuth.db.collection('signups').doc(KEY).get();
    }).then(function (s) {
      SU = s.data();
      draw();
      var w = document.getElementById('wrap');
      w.insertAdjacentHTML('afterbegin',
        '<div class="card"><div class="banner ok">Your place has been given back. ' +
        'If you change your mind you can sign up again while there is room.</div>' +
        '<a class="btn" href="signup.html?event=' + esc(SU.calEventId) + '">Back to the event</a></div>');
    }).catch(function (e) {
      btn.disabled = false;
      document.getElementById('wrap').insertAdjacentHTML('afterbegin',
        '<div class="card"><div class="banner warn">That could not be cancelled: ' + esc(e.message || e) + '</div></div>');
    });
  }

  if (!KEY) {
    document.getElementById('wrap').innerHTML =
      '<div class="card">This link is missing its key. Use the link in your confirmation email.</div>';
    return;
  }

  /* "My usual people" (usualPeople; Martin, 15 Oct): the names "Same as
     last time" and the suggestions come from, signed in only. Taking one
     off keeps it out of both; nothing else changes. */
  function drawUsualCard() {
    if (!E.signedIn() || !window.EGBCUsual || !EGBCUsual.on()) return;
    EGBCUsual.manage().then(function (m) {
      if (!m.names.length && !m.hidden.length) return;
      var old = document.getElementById('usualCard'); if (old) old.remove();
      document.getElementById('wrap').insertAdjacentHTML('beforeend', '<div class="card" id="usualCard"><h2 style="margin:0 0 6px;font-size:16px">My usual people</h2>' +
        '<p class="m" style="margin:0 0 10px">The names offered when you sign up again ("Same as last time"), from your own sign-ups. Take off anyone you no longer sign up.</p>' +
        /* F-203: nothing saved on the server for this until switch-over. */
        (m.canSave ? '' : '<p class="m" id="usualLater" style="margin:0 0 10px">You can take names off from ' + E.esc(m.opensOn || 'when the new church hub opens') + '.</p>') +
        m.names.map(function (n) { return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;border-top:1px solid #e5e7eb" data-usual-row><span>' + E.esc(n) + '</span>' + (m.canSave ? '<button class="btn ghost" data-usual-hide="' + E.esc(n) + '">Remove</button>' : '') + '</div>'; }).join('') +
        (m.hidden.length ? '<p class="m" style="margin:10px 0 4px">Taken off:</p>' + m.hidden.map(function (n) { return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px" data-usual-hidden><span class="m">' + E.esc(n) + '</span><button class="btn ghost" data-usual-show="' + E.esc(n) + '">Put back</button></div>'; }).join('') : '') +
        '</div>');
      document.querySelectorAll('[data-usual-hide]').forEach(function (b) { b.onclick = function () { b.disabled = true; EGBCUsual.hide(b.getAttribute('data-usual-hide')).then(drawUsualCard, function () { b.disabled = false; }); }; });
      document.querySelectorAll('[data-usual-show]').forEach(function (b) { b.onclick = function () { b.disabled = true; EGBCUsual.unhide(b.getAttribute('data-usual-show')).then(drawUsualCard, function () { b.disabled = false; }); }; });
    }).catch(function () {});
  }

  EGBCAuth.optional().then(function () {
    return EGBCAuth.db.collection('signups').doc(KEY).get();
  }).then(function (s) {
    if (!s.exists) throw new Error('not found');
    SU = s.data();
    return Promise.all([E.load(SU.calEventId).catch(function () { return null; }), E.lookups(),
      EGBCAuth.db.collection('signupPayments').doc(KEY).get().catch(function () { return null; }),
      EGBCAuth.db.collection('seriesSignups').doc(KEY).get().catch(function () { return null; })]);
  }).then(function (r) {
    if (r[0]) { EV = r[0].ev; WHERE = E.locationText(EV, r[1]); TT = r[0].ticketTypes || []; }
    PAY = r[2] && r[2].exists ? r[2].data() : null;
    var t = TT.filter(function (x) { return x.id === SU.ticketTypeId; })[0] || TT[0];
    return EGBCAuth.db.collection('paymentSettings').doc('public').get().then(function (s) {
      var pub = s.exists ? s.data() : {};
      ONLINE = ['card', 'bank'].filter(function (m) { return pub[m] && E.payBy(t).indexOf(m) >= 0; });
      CARDNOW = ONLINE.length > 0 && E.payBy(t).indexOf('day') < 0;
    }, function () {}).then(function () { return r; });
  }).then(function (r) {
    GROUP = r[3] && r[3].exists ? r[3].data() : null;
    return loadSeries();
  }).then(function () {
    draw();
  }).catch(function () {
    document.getElementById('wrap').innerHTML =
      '<div class="card">That booking could not be found. The link may have been mistyped, or the booking removed.<br><br>' +
      '<a class="btn sec" href="whatson.html">See what\'s on</a></div>';
  });
})();
</script>
</body>
</html>
