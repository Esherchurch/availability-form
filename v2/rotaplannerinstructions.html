<style>
  :root{
    --canvas:#eef4f3;--surface:#fff;--surface-2:#f6faf9;--ink:#14201f;--body:#3a4d4c;--muted:#6b8281;--faint:#93a8a6;
    --hairline:#dde7e6;--hairline-strong:#c9d8d6;--brand:#3d6263;--brand-dark:#2e4c4d;--brand-tint:#e7f0ef;--brand-ring:rgba(61,98,99,.28);
    --success:#3b7d23;--success-tint:#e7f1e0;--danger:#b0392c;--danger-tint:#f7e7e4;--gold:#b07d2e;--gold-tint:#f6efe1;
    --shadow-sm:0 1px 2px rgba(20,32,31,.05);--shadow:0 1px 2px rgba(20,32,31,.04),0 6px 20px rgba(20,32,31,.07);--shadow-lg:0 2px 4px rgba(20,32,31,.05),0 18px 48px rgba(20,32,31,.12);
    --r-sm:8px;--r-md:12px;--r-lg:18px;--r-pill:999px;
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:0; background:var(--brand); font-family:'Segoe UI', Arial, sans-serif; color:var(--body); }

  .site-header { height:90px; background:var(--surface); padding:0 40px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--hairline); box-shadow:var(--shadow-sm); }

  .tut-outer { background:var(--brand); padding:28px 20px 48px; min-height:calc(100vh - 90px); }
  .tut-inner { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:32px; max-width:760px; margin:0 auto; box-shadow:var(--shadow-lg); }

  .chapter-nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:22px; }
  .chapter-pill { font-size:13px; font-weight:700; padding:6px 14px; border-radius:var(--r-pill); cursor:pointer; border:1px solid var(--hairline-strong); color:var(--muted); background:var(--surface-2); transition:all .15s; font-family:inherit; }
  .chapter-pill:hover { border-color:var(--brand); color:var(--brand); }
  .chapter-pill.active { background:var(--brand); color:#fff; border-color:var(--brand); }

  .tut-heading { margin:0 0 6px; font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--ink); text-transform:none; }
  .tut-subheading { margin:0 0 22px; font-size:13px; font-weight:500; color:var(--muted); }

  .progress-bar-bg { height:6px; background:var(--hairline); border-radius:var(--r-pill); margin-bottom:1.5rem; overflow:hidden; }
  .progress-bar-fill { height:6px; background:var(--brand); border-radius:var(--r-pill); transition:width .35s ease; }

  .step-badge { display:inline-block; font-size:12px; font-weight:700; color:var(--brand); background:var(--brand-tint); border-radius:var(--r-pill); padding:5px 12px; margin-bottom:12px; }
  .step-title { font-size:20px; font-weight:800; letter-spacing:-.015em; color:var(--ink); margin:0 0 10px; }
  .step-desc { font-size:16px; font-weight:400; line-height:1.7; color:var(--body); margin:0 0 1.25rem; }

  .sim-area { border:1px solid var(--hairline); border-radius:var(--r-md); overflow:hidden; margin-bottom:1.25rem; background:var(--surface); box-shadow:var(--shadow-sm); }
  .sim-topbar { background:var(--surface-2); border-bottom:1px solid var(--hairline); padding:11px 16px; font-size:13px; font-weight:700; color:var(--brand); }
  .sim-body { padding:16px; }

  .highlight { outline:2.5px solid var(--brand); outline-offset:1px; border-radius:var(--r-sm); animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{ outline-color:var(--brand); } 50%{ outline-color:var(--brand-ring); } }

  .tip-box { background:var(--brand-tint); border:1px solid var(--hairline-strong); border-radius:var(--r-md); padding:12px 15px; font-size:13px; font-weight:500; color:var(--brand-dark); margin-bottom:1.25rem; line-height:1.6; }
  .tip-box::before { content: "\1F4A1 "; }
  .admin-box { background:#f3ecfa; border:1px solid #d9c7ec; border-radius:var(--r-md); padding:12px 15px; font-size:13px; font-weight:500; color:#5a2e80; margin-bottom:1.25rem; line-height:1.6; }
  .admin-box::before { content: "\1F527 "; }

  .nav-row { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .nav-btn { background:var(--surface); border:1px solid var(--hairline-strong); border-radius:var(--r-md); padding:11px 20px; font-size:14px; font-weight:700; cursor:pointer; color:var(--brand); font-family:inherit; transition:all .15s; }
  .nav-btn:hover { background:var(--surface-2); border-color:var(--brand); }
  .nav-btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .nav-btn.primary:hover { background:var(--brand-dark); border-color:var(--brand-dark); }
  .step-counter { font-size:13px; font-weight:500; color:var(--muted); text-align:center; }

  .sim-btn { display:inline-block; padding:8px 14px; border-radius:var(--r-md); font-size:12px; font-weight:700; letter-spacing:0; cursor:default; }
  .sim-btn-teal { background:var(--brand); color:#fff; }
  .sim-btn-light { background:var(--brand-tint); color:var(--brand); border:1px solid var(--hairline-strong); }
  .sim-btn-dark { background:var(--ink); color:#fff; }
  .sim-pill { display:inline-block; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-pill); padding:4px 12px; font-size:11px; font-weight:700; color:var(--brand); margin:2px; }
  .sim-input { display:inline-block; background:var(--surface); border:1px solid var(--hairline-strong); border-radius:var(--r-md); padding:6px 12px; font-size:12px; font-weight:700; color:var(--brand); }
  .role-card { display:inline-block; border:2px dashed var(--hairline-strong); border-radius:var(--r-md); padding:10px 14px; min-width:120px; margin:4px; vertical-align:top; }
  .role-card.assigned { border-style:solid; border-color:var(--brand); }
  .role-card.av { border-style:solid; border-color:var(--gold); }
  .role-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:4px; }
  .role-name { font-size:12px; font-weight:700; color:var(--brand); }
  .role-name.unassigned { color:var(--faint); font-style:italic; }
  .bucket { border-radius:var(--r-md); padding:10px 14px; margin-bottom:8px; }
  .bucket-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
  .avail-chip { display:inline-block; padding:4px 10px; border-radius:var(--r-pill); font-size:11px; font-weight:700; margin:2px; cursor:grab; }
  .event-row { border:1px solid var(--hairline); border-radius:var(--r-md); padding:12px 16px; margin-bottom:8px; background:var(--surface); }
  .send-card { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-md); padding:16px; margin-bottom:10px; box-shadow:var(--shadow-sm); }
  .send-log { background:var(--ink); color:#a8d5b5; border-radius:var(--r-md); padding:12px 14px; font-family:'Courier New', monospace; font-size:11px; line-height:1.7; }
  .log-ok { color:#7ee8a2; }
  .log-inf { color:#8ecae6; }

  .finish-box { text-align:center; padding:2rem 0; }
  .finish-box h2 { font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--ink); margin:0 0 10px; }
  .finish-box p { color:var(--body); font-size:16px; line-height:1.7; margin:0 0 1.25rem; }
</style>

let current = 0;

function buildChapterNav() {
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = '';
  chapters.forEach((ch, i) => {
    const pill = document.createElement('button');
    pill.className = 'chapter-pill' + (i === steps[current].chapter ? ' active' : '');
    pill.textContent = ch.label;
    pill.onclick = () => jumpToChapter(i);
    nav.appendChild(pill);
  });
}

function jumpToChapter(chIdx) {
  const idx = steps.findIndex(s => s.chapter === chIdx);
  if (idx !== -1) { current = idx; render(); }
}

function render() {
  const s = steps[current];
  const pct = Math.round(((current + 1) / steps.length) * 100);
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('step-ctr').textContent = `Step ${current + 1} of ${steps.length}`;
  document.getElementById('btn-prev').style.visibility = current === 0 ? 'hidden' : 'visible';
  document.getElementById('btn-next').style.display = '';
  document.getElementById('btn-prev').style.display = '';
  document.getElementById('btn-next').textContent = current === steps.length - 1 ? 'Finish \u2713' : 'Next \u2192';
  buildChapterNav();
  document.getElementById('step-content').innerHTML = `
    <span class="step-badge">${s.badge}</span>
    <p class="step-title">${s.title}</p>
    <p class="step-desc">${s.desc}</p>
    ${s.render()}
    <div class="tip-box">${s.tip}</div>
  `;
}

function changeStep(dir) {
  if (current + dir < 0) return;
  if (current + dir >= steps.length) {
    document.getElementById('step-content').innerHTML = `
      <div class="finish-box">
        <h2>All done! &#x1F389;</h2>
        <p>You now know how to use the Master Rota Planner from start to finish.</p>
        <button class="nav-btn primary" onclick="current=0;render()">Start again from the beginning</button>
      </div>
      <div class="tip-box" style="margin-top:1.5rem">If you need the EGBC Rota Sender shortcut installed on your desktop, contact admin.</div>
    `;
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('btn-prev').style.display = 'none';
    document.getElementById('step-ctr').textContent = 'Complete \u2713';
    document.getElementById('prog').style.width = '100%';
    buildChapterNav();
    return;
  }
  current += dir;
  render();
}

render();
</script>
