<!DOCTYPE html>
<html lang="en">
<head>
<script src="egbc-board-phone.js?v=202610121900"></script>
<script src="egbc-appmode.js?v=202610141200"></script>
<script src="egbc-shell.js?v=202610141800" data-title="Ideas pin board"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="egbc-auth.js?v=202610141800"></script>
<script src="egbc-guard.js?v=202610121600"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestions Board</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    /* shared design system tokens */
    --canvas:#eef4f3; --surface:#fff; --surface-2:#f6faf9; --ink:#14201f; --body:#3a4d4c; --muted:#6b8281; --faint:#93a8a6;
    --hairline:#dde7e6; --hairline-strong:#c9d8d6; --brand:#3d6263; --brand-dark:#2e4c4d; --brand-tint:#e7f0ef; --brand-ring:rgba(61,98,99,.28);
    --success:#3b7d23; --success-tint:#e7f1e0; --danger:#b0392c; --danger-tint:#f7e7e4; --gold:#b07d2e; --gold-tint:#f6efe1;
    --shadow-sm:0 1px 2px rgba(20,32,31,.05); --shadow:0 1px 2px rgba(20,32,31,.04),0 6px 20px rgba(20,32,31,.07); --shadow-lg:0 2px 4px rgba(20,32,31,.05),0 18px 48px rgba(20,32,31,.12);
    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;

    /* aliases used throughout this page, mapped onto the system */
    --teal:        var(--brand);
    --teal-dark:   var(--brand-dark);
    --teal-light:  var(--brand-tint);
    --border:      var(--hairline-strong);
    --bg:          var(--canvas);
    --pin-red:     #b0392c;
    --font:        'Inter', sans-serif;
    --font-hand:   'Caveat', cursive;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-family: var(--font); background: var(--bg); min-height: 100vh; overflow: hidden; }

  header {
    position: fixed; top: var(--sn-top-0, 0px); left: 0; right: 0; z-index: 200;
    /* min-height, not height: at 375px the title and the buttons are
       taller than 64px, and a fixed height made them spill out of the
       top of the bar (Martin, 11 Oct 2026: "Switch board is at top
       -39px, off screen"). The bars below stack off the measured
       height, so growing here pushes them down instead. */
    min-height: 64px;
    background: var(--surface);
    border-bottom: 1px solid var(--hairline);
    box-shadow: var(--shadow);
    /* flex-wrap and flex-start, not a single centred line. With
       align-items:center a line taller than the bar is centred on it and
       spills out of BOTH ends - which is how "Switch board" ended up
       above the top of the screen. Wrapping puts the buttons on their
       own line at 375px and the bar grows to hold them; the bars below
       stack off its measured height, so they follow it down. */
    display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 8px;
    padding: 8px 16px;
  }
  @media (min-width: 700px) { header { flex-wrap: nowrap; padding: 0 28px; } }
  .header-left { display:flex; align-items:center; gap:12px; }
  .logo-icon   { font-size:1.7rem; }
  .header-title { font-family:var(--font); font-size:1.3rem; font-weight:600; color:var(--teal); letter-spacing:-.01em; line-height:1; }
  .header-subtitle { font-size:0.75rem; font-weight:600; color:var(--teal); opacity:.5;   margin-top:3px; }
  .header-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  /* sync indicator */
  /* The words, the icon and the dropdown as one control, so "Switch board"
     is the thing you press rather than a label beside something else. */
  .board-switch {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--teal-light); border: 1px solid var(--brand-ring);
    border-radius: var(--r-sm); padding: 0 12px; min-height: 36px;
    color: var(--teal); cursor: pointer;
    font-family: var(--font); font-size: 13px; font-weight: 500;
  }
  .board-switch:hover { border-color: var(--teal); }
  .board-switch > span { white-space: nowrap; }
  .board-picker {
    font-family: var(--font); font-size: 13px; font-weight: 500; color: var(--teal);
    background: transparent; border: none; border-left: 1px solid var(--brand-ring);
    padding: 7px 0 7px 10px; margin-left: 2px; cursor: pointer;
  }
  .board-picker:focus { outline: none; }
  .board-switch:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px var(--brand-ring); }

  #syncDot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #d1dfdf; flex-shrink: 0;
    transition: background 0.3s;
  }
  #syncDot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
  #syncDot.synced  { background: #9bc34a; }
  #syncDot.error   { background: #ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .btn {
    padding: 11px 20px; border: 1px solid transparent; border-radius: var(--r-md); cursor: pointer;
    font-family: var(--font); font-weight:600; font-size: .8125rem;
    letter-spacing: 0; transition: all .18s;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover  { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--brand-ring); }
  .btn-primary  { background: var(--brand); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { background: var(--brand-dark); box-shadow: var(--shadow); }
  .btn-secondary { background: var(--brand-tint); color: var(--brand); border-color: var(--brand-tint); }
  .btn-secondary:hover { background: #dbe8e7; }
  .btn-admin  { background: var(--danger); color: #fff; }
  .btn-admin:hover { background: #973025; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #973025; }
  .btn-sm     { padding: 8px 14px; font-size: .78rem; border-radius: var(--r-sm); }
  .admin-badge { background: var(--danger); color: #fff; font-size: 0.75rem; font-weight:600;   padding: 3px 9px; border-radius: var(--r-pill); }

  .pages-bar {
    position: fixed; top: var(--sn-top-1, 64px); left: 0; right: 0; z-index: 190;
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 0 24px; display: flex; gap: 4px; align-items: flex-end;
    overflow-x: auto; scrollbar-width: thin; height: 42px;
  }
  .page-tab {
    padding: 7px 18px 6px; font-family: var(--font); font-size: 0.75rem; font-weight:600;
      cursor: pointer;
    border-radius: 8px 8px 0 0; border: 1px solid transparent; border-bottom: none;
    color: var(--teal); opacity: .5; transition: all .2s; white-space: nowrap;
    background: transparent; position: relative;
  }
  .page-tab:hover  { opacity: .8; background: var(--teal-light); }
  .page-tab.active { background: var(--bg); border-color: var(--border); color: var(--teal); opacity: 1; font-weight:600; }
  .page-tab .tab-delete { position: absolute; top: 4px; right: 5px; font-size: 0.75rem; opacity: 0; color: var(--pin-red); transition: opacity .2s; cursor: pointer; }
  .page-tab:hover .tab-delete { opacity: 1; }
  .add-page-btn { padding: 5px 10px; background: none; border: none; color: var(--teal); opacity: .5; cursor: pointer; font-size: 1.1rem; border-radius: 6px; transition: all .2s; align-self: center; margin-bottom: 2px; }
  .add-page-btn:hover { opacity: 1; transform: scale(1.2); }

  .filter-bar {
    position: fixed; top: var(--sn-top-2, 106px); left: 0; right: 0; z-index: 180;
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 7px 24px; display: flex; gap: 6px; align-items: center;
    overflow-x: auto; scrollbar-width: none; height: 46px;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    padding: 5px 14px; border-radius:8px; border: 1.5px solid var(--border);
    background: #fff; font-family: var(--font); font-size: 0.75rem; font-weight:600;
      cursor: pointer; color: var(--teal);
    transition: all .15s; white-space: nowrap; flex-shrink: 0;
    display: flex; align-items: center; gap: 4px;
  }
  .filter-chip:hover  { background: var(--teal-light); border-color: var(--teal); }
  .filter-chip.active { background: var(--teal); color: #fff; border-color: var(--teal); }

  .board-outer { position: fixed; top: var(--sn-top-3, 152px); left: 0; right: 0;
                 bottom: var(--sn-bottom, 0px); overflow: auto; }
  .board-canvas {
    position: relative; width: 3200px; height: 2400px;
    background:
      repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.04) 6px,rgba(0,0,0,.04) 12px),
      linear-gradient(160deg,#c89050 0%,#b87d3a 25%,#c89050 50%,#a06a28 75%,#c89050 100%);
  }
  .board-canvas::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(circle at 20% 30%,rgba(255,255,255,.04) 1px,transparent 1px),
      radial-gradient(circle at 60% 70%,rgba(0,0,0,.06) 1px,transparent 1px),
      radial-gradient(circle at 80% 20%,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:8px 8px,12px 12px,6px 6px;
  }

  .note {
    position: absolute; width: 272px; border-radius: 2px 12px 12px 2px;
    padding: 32px 14px 13px;
    box-shadow: 4px 6px 18px rgba(0,0,0,.3),1px 2px 4px rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.2);
    transition: box-shadow .2s, transform .15s; user-select: none; word-break: break-word;
  }
  .note.is-dragging {
    box-shadow: 14px 22px 55px rgba(0,0,0,.58),inset 0 0 0 1px rgba(255,255,255,.3) !important;
    transition: none !important; z-index: 900 !important; cursor: grabbing !important;
    transform: rotate(2deg) scale(1.04) !important;
  }
  .note::before { content:''; position:absolute; top:0; left:0; width:0; height:0; border-style:solid; border-width:18px 18px 0 0; border-color:rgba(0,0,0,.15) transparent transparent transparent; }

  .note-song    { background: linear-gradient(160deg,#fef9c3,#fef08a); }
  .note-event   { background: linear-gradient(160deg,#fce7f3,#fda4af); }
  .note-av      { background: linear-gradient(160deg,#eff6ff,#93c5fd); }
  .note-general { background: linear-gradient(160deg,#f0fdf4,#86efac); }
  .note-prayer  { background: linear-gradient(160deg,#f5f3ff,#d8b4fe); }
  .note-other   { background: linear-gradient(160deg,#fff7ed,#fdba74); }

  .note-topbar { position:absolute; top:0; left:0; right:0; padding:5px 10px 5px 20px; display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,.1); border-radius:0 10px 0 0; cursor:grab; }
  .note-topbar:active { cursor: grabbing; }
  .note-category { font-family:var(--font); font-size:0.75rem; font-weight:600;   color:rgba(0,0,0,.5); display:flex; align-items:center; gap:3px; }
  .note-actions { display:flex; gap:3px; opacity:0; transition:opacity .2s; }
  .note:hover .note-actions { opacity: 1; }
  .note-action-btn { background:rgba(0,0,0,.12); border:none; border-radius:4px; padding:2px 5px; font-size:0.75rem; cursor:pointer; color:rgba(0,0,0,.6); transition:all .15s; }
  .note-action-btn:hover { background:rgba(0,0,0,.25); color:#000; }
  .note-action-btn.delete:hover { background:#dc2626; color:#fff; }

  .note-pin { position:absolute; top:-13px; left:50%; transform:translateX(-50%); width:20px; height:20px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#e74c3c,#8b0000); box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 1px 2px rgba(255,255,255,.3); z-index:5; cursor:grab; }
  .note-pin::after { content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); width:3px; height:10px; background:linear-gradient(#aaa,#666); border-radius:0 0 2px 2px; }

  .note-title { font-family:var(--font-hand); font-size:1.18rem; font-weight:600; color:#1a0a00; margin-bottom:6px; line-height:1.3; }
  .note-body  { font-family:var(--font-hand); font-size:.93rem; color:#2d1a00; line-height:1.5; margin-bottom:8px; white-space:pre-wrap; }
  .note-image { width:100%; border-radius:6px; margin:6px 0; box-shadow:0 2px 6px rgba(0,0,0,.2); max-height:145px; object-fit:cover; }
  .note-link  { display:inline-flex; align-items:center; gap:4px; font-size:0.75rem; color:var(--teal); text-decoration:none; background:rgba(255,255,255,.5); padding:3px 8px; border-radius:12px; margin:3px 2px; transition:background .15s; word-break:break-all; font-family:var(--font); font-weight:600; }
  .note-link:hover { background:rgba(255,255,255,.8); }
  .yt-player { width:100%; aspect-ratio:16/9; border-radius:8px; border:none; margin:6px 0; box-shadow:0 3px 10px rgba(0,0,0,.25); }
  .note-reactions { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .reaction-btn { background:rgba(255,255,255,.45); border:1.5px solid rgba(0,0,0,.1); border-radius:8px; padding:3px 9px; cursor:pointer; font-size:.76rem; display:flex; align-items:center; gap:3px; transition:all .15s; font-family:var(--font); font-weight:600; color:rgba(0,0,0,.6); }
  .reaction-btn:hover  { background:rgba(255,255,255,.75); transform:scale(1.1); }
  .reaction-btn.active { background:rgba(255,255,255,.88); border-color:rgba(0,0,0,.25); color:#000; }
  .note-meta { margin-top:7px; font-size:0.75rem; color:rgba(0,0,0,.58); display:flex; justify-content:space-between; align-items:center; font-family:var(--font); font-weight:600; }
  .archived-badge { font-size:0.75rem; font-weight:600; background:rgba(0,0,0,.15); color:rgba(0,0,0,.5); padding:2px 6px; border-radius:8px;   }

  .drag-hint { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--teal); color:#fff; padding:8px 22px; border-radius:8px; font-family:var(--font); font-size:0.75rem; font-weight:600;   pointer-events:none; opacity:1; transition:opacity .6s; z-index:300; box-shadow:0 4px 14px rgba(61,98,99,.3); }
  .drag-hint.fade { opacity: 0; }

  .empty-board { position:absolute; top:200px; left:50%; transform:translateX(-50%); text-align:center; color:rgba(0,0,0,.3); }
  .empty-board .empty-icon { font-size:3.5rem; margin-bottom:12px; }
  .empty-board p { font-family:var(--font); font-size:1rem; font-weight:600;   color:rgba(0,0,0,.25); }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(4px); z-index:400; align-items:center; justify-content:center; }
  .modal-overlay.open { display: flex; }
  .modal { background:var(--surface); border-radius:var(--r-lg); padding:28px 30px; max-width:520px; width:90%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); position:relative; animation:modalIn .25s ease; font-family:var(--font); }
  @keyframes modalIn { from{opacity:0;transform:scale(.93) translateY(16px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .modal-title { font-size:1.2rem; font-weight:600; color:var(--teal); margin-bottom:18px; letter-spacing:-.01em; }
  .modal-close { position:absolute; top:14px; right:14px; background:var(--bg); border:1px solid var(--border); border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:.85rem; color:var(--teal); font-weight:600; transition:all .15s; display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { background:var(--teal); color:#fff; }
  .form-group { margin-bottom: 14px; }
  .form-label { display:block; font-size:0.75rem; font-weight:600; color:var(--teal); opacity:.6; margin-bottom:5px;   }
  .form-input, .form-textarea, .form-select { width:100%; padding:11px 14px; background:var(--surface); border:1px solid var(--hairline-strong); border-radius:var(--r-md); font-family:var(--font); font-size:.9rem; font-weight:500; color:var(--ink); transition:border-color .18s, box-shadow .18s; outline:none; }
  .form-input::placeholder, .form-textarea::placeholder { color:var(--faint); font-weight:500; }
  .form-input:focus, .form-textarea:focus, .form-select:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-ring); }
  .form-textarea { resize:vertical; min-height:78px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .report-content { background:var(--bg); border:1px solid var(--border); border-radius:.75rem; padding:14px; font-size:.78rem; line-height:1.65; max-height:340px; overflow-y:auto; white-space:pre-wrap; font-family:monospace; color:var(--teal); }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }

  .toast { position:fixed; bottom:26px; right:26px; background:var(--brand); color:#fff; padding:11px 22px; border-radius:var(--r-pill); font-family:var(--font); font-weight:600; font-size:.8rem;  z-index:600; box-shadow:var(--shadow-lg); animation:toastIn .3s ease, toastOut .3s ease 2.7s forwards; }
  @keyframes toastIn  { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toastOut { from{opacity:1} to{opacity:0} }

  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  @media (max-width:600px) {
    /* NO HARDCODED `top` HERE ANY MORE. These used to say top:54px and
       top:90px, which fought snStack() - the script that MEASURES each
       fixed bar and writes --sn-top-N from what it finds. At 375px the
       header wraps and is taller than 54px, so the three bars sat on top
       of one another and the first row of post-its was behind them.
       A measured number and a guessed one cannot both be right; the
       measurement wins, and these now only set the sizes it measures.

       Heights are auto for the same reason: a 36px bar holding a 44px
       button does not hold it, it lets it hang out over the next one. */
    header { padding:0 14px; height:auto; min-height:54px; }
    .header-title { font-size:1.05rem; }
    .pages-bar { height:auto; min-height:36px; padding:4px 14px; }
    .filter-bar { height:auto; min-height:42px; padding:6px 14px; }
    .form-row { grid-template-columns:1fr; }
    .note { width:230px; }
  }

  /* Touch devices can't hover — always show the per-note action buttons */
  @media (hover: none) {
    .note-actions { opacity: 1; }
    .page-tab .tab-delete { opacity: 1; }
  }
/* ---- waiting for a leader ------------------------------------------
   DESIGN.md shapes: a white card with a 1px line border and radius 14,
   36px buttons at radius 8, 13px/500 labels, sentence case, Lucide icons.
   Nothing here is pill-shaped and nothing is above weight 600. */
#queue { max-width: 1100px; margin: 14px auto 0; padding: 0 16px; }
#queue .q-h { font-size: 15px; font-weight: 600; color: #111827; margin: 0 0 8px; }
#queue .q-empty { font-size: 13px; color: #6b7280; margin: 0; }
#queue .q-row { display: flex; align-items: center; gap: 12px; background: #fff;
  border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.05);
  padding: 12px 14px; margin-bottom: 8px; }
#queue .q-tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
#queue .q-tx b { font-size: 14px; font-weight: 600; color: #111827; }
#queue .q-tx span { font-size: 14px; color: #374151; overflow-wrap: anywhere; }
#queue .q-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px;
  padding: 0 14px; border-radius: 8px; font: 500 13px Inter, sans-serif; cursor: pointer;
  border: 1px solid transparent; }
#queue .q-btn.ok { background: #3d6263; color: #fff; }
#queue .q-btn.ok:hover { background: #2a4a4b; }
#queue .q-btn.no { background: #fff; color: #111827; border-color: #d1d5db; }
#queue .q-btn.no:hover { background: #f3f4f6; }
@media (max-width: 640px) {
  /* A finger, not a mouse: 48px, and the buttons go under the text rather
     than squeezing it (APP-DESIGN-BRIEF §7). */
  #queue .q-row { flex-wrap: wrap; }
  #queue .q-btn { height: 48px; flex: 1; justify-content: center; }
}
  /* ---- THE PHONE LAYOUT (APP-DESIGN-BRIEF 7f) ---------------------
     Under 700px the corkboard is put away and the same notes are drawn
     as a grid of small post-its, two per row. 700px rather than a phone
     width on purpose: a narrow window on a laptop is the same problem as
     a phone, and the brief says "at widths under about 700px".

     DESIGN.md applies here like everywhere: nothing under 12px, no
     weight above 600, no capitals, and no pill-shaped controls - so the
     radii below stay well under 20px. The handwritten font is kept for
     the titles because that is what makes a post-it a post-it. */
  @media (max-width: 700px) {
    body { overflow: auto; }
    .board-outer, .drag-hint { display: none !important; }
    #phoneBoard { display: block; }
  }
  @media (min-width: 701px) {
    /* Belt and braces: the container is also hidden by the `hidden`
       attribute, which JS removes only on a phone. */
    #phoneBoard { display: none !important; }
  }
  /* A PARENT'S READ-ONLY BOARD (6c) is the small post-its at any width:
     the corkboard is all dragging and editing, none of it theirs. */
  body.ro-board { overflow: auto; }
  body.ro-board .board-outer, body.ro-board .drag-hint { display: none !important; }
  body.ro-board #phoneBoard { display: block !important; }

  /* BELOW THE PAGE'S OWN FIXED BARS. The header, the page tabs and the
     filter row are all position:fixed, and snStack() measures them into
     --sn-top-3 for exactly this reason - the corkboard uses the same
     number. Without it the first row of post-its sits underneath them
     and "Add an idea" is off the top of the screen entirely.

     My assertions did not catch that and could not have: they measured
     widths, and a note hidden behind a bar is the right width. The
     375px screenshot caught it, which is what the screenshots are for. */
  #phoneBoard { padding: calc(var(--sn-top-3, 152px) + 12px) 12px 90px; }
  /* NOTHING IN HERE MAY BE WIDER THAN THE PHONE. A pasted link in a
     title has no spaces in it and cannot wrap, which is exactly what
     pushed the hub's notices off a 375px screen. */
  #phoneBoard, #phoneBoard * { min-width: 0; max-width: 100%; box-sizing: border-box; }

  .pb-add {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 48px; margin: 0 0 12px;
    background: var(--teal); color: #fff; border: none; border-radius: 12px;
    font-family: var(--font); font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .pb-add:active { background: var(--brand-dark, #2a4a4b); }
  /* The post-it and note-sheet rules now live in egbc-board-phone.js,
     which draws them - §7f wants this screen identical in the app and
     on the phone website, and shipping the drawing in one file and the
     styling in two would have them drift a rule at a time. What stays
     here is how THIS page decides to show it. */
  .pb-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }

</style>
</head>

<script>
// ── FIREBASE ──────────────────────────────────────────────────────────────
/* One page, several boards. Signing in is handled by the guard, which has
   already run by the time this executes, so the shared connection is used
   rather than opening a second one. */
let db;
if (typeof EGBCAuth !== 'undefined' && EGBCAuth.db) {
  db = EGBCAuth.db;
} else {
  if (!firebase.apps.length)/* The shared sign-in, not an app of our own. A second app has nobody
   signed in, so its reads and writes go out anonymous - and on localhost
   it would miss the emulator hook and reach the live database. */
  db = EGBCAuth.db;
}

/* ── THE BOARDS ───────────────────────────────────────────────

   Kids Church and the youth get their own board rather than a corner of
   the worship one: separate notes, separate pages, separate archive. The
   worship board keeps the document it has always used, so nothing that is
   already pinned up moves.

   Which board you land on is decided by who you are, not by the link, so
   the one tile on the hub takes each person to their own. Anyone who is on
   more than one - and any master admin - gets the picker in the header. */

const BOARDS = [
  { id:'worship', doc:'state',       title:'Worship Board',      sub:'Suggestions &amp; Ideas',
    teams:['Worship Team', 'AV Team', 'Choir'] },
  /* EVERYONE ON KIDS CHURCH (Martin, 10 Oct 2026: "anyone logged in as
     kids church should have it"). It was briefly leaders-only; that was
     never his instruction. */
  { id:'kids',    doc:'kids-church', title:'Kids Church Board',  sub:'Suggestions &amp; Ideas',
    teams:['Kids Church'] },
  /* CORE TEAM'S OWN (Martin, 10 Oct 2026). Everyone on Core Team, nobody
     else - not every admin, and not Worship, who have their own. */
  { id:'core',    doc:'core-team',   title:'Core Team Board',    sub:'Suggestions &amp; Ideas',
    teams:['Core Team'] },
  /* MODERATED TOO, from 10 Oct 2026. The youth board let a young person
     with a live code READ it and suggest nothing, which Martin called
     "cutting off exactly the people we want ideas from". Now it works like
     ReNu and Lazers: they suggest, an adult on Youth Worship puts it up. */
  { id:'youth',   doc:'youth',       title:'Youth Board',        sub:'Suggestions &amp; Ideas',
    teams:['Youth Worship'], moderated:true },
  /* MODERATED. A young person with a live code reads these and posts a
     suggestion; it waits in boardSuggestions until a leader puts it up. The
     board document itself is written by the group's adults only, which is
     what makes "waits for a leader" true rather than hoped for. */
  { id:'renu',    doc:'renu',        title:'ReNu Board',         sub:'Suggestions &amp; Ideas',
    teams:['ReNu'], moderated:true },
  { id:'lazers',  doc:'lazers',      title:'Lazers Board',       sub:'Suggestions &amp; Ideas',
    teams:['Lazers'], moderated:true },
];

let board = BOARDS[0];
let BOARD_DOC = null;
let LOCAL_KEY = 'worshipBoard2';

/* STILL TO COME: a parent's family's youth groups.
   Martin, 10 Oct 2026: "Offer only boards for the person's own teams and
   their family's youth groups." The first half is below and always has
   been. The second needs to know who is in somebody's family, which
   APP-A1.md established cannot be worked out on the phone - householdIds
   needs the whole address book, which is closed to Attenders. It arrives
   with myFamily() and hooks in here, as one more clause (A-066). It is NOT
   half-built, because a family rule computed two ways is a privacy hole
   waiting for the two to disagree. */
function canSee(b) {
  if (typeof EGBCAuth === 'undefined' || !EGBCAuth.profile || !EGBCAuth.profile()) {
    return b.id === 'worship';
  }
  if (EGBCAuth.isMaster()) return true;
  /* hasRole is "on the team OR administers it". A leaders-only board wants
     the second half only. */
  return b.leadersOnly
    ? b.teams.some(t => EGBCAuth.isAdminOf(t))
    : b.teams.some(t => EGBCAuth.hasRole(t));
}

/* A PARENT'S VIEW OF THEIR CHILDREN'S YOUTH BOARDS (6c). familyGroups is
   written onto their record by the server, from the household; the rules
   let them READ these boards and nothing else, so the page offers them
   read-only - the phone grid, whatever the width, with nothing to add,
   react to, comment on or move. */
function familyBoard(b) {
  if (typeof EGBCAuth === 'undefined' || !EGBCAuth.profile || !EGBCAuth.profile()) return false;
  if (['youth', 'renu', 'lazers'].indexOf(b.doc) === -1) return false;
  const fam = EGBCAuth.profile().familyGroups || [];
  return b.teams.some(t => fam.indexOf(t) !== -1);
}

/* Can this person put a suggestion up, or throw one away? The group's adults
   and a master admin - the same people the rules let write the board. */
function canModerate(b) {
  if (typeof EGBCAuth === 'undefined' || !EGBCAuth.profile || !EGBCAuth.profile()) return false;
  if (EGBCAuth.isMaster()) return true;
  return b.teams.some(t => EGBCAuth.hasRole(t));
}

/* The worship board keeps its old local cache key so an offline copy made
   before today still loads; the new boards get their own, because one
   shared key would spill Kids Church notes onto the worship board the next
   time Firebase was unreachable. */
function localKey(b) { return b.id === 'worship' ? 'worshipBoard2' : 'egbcBoard_' + b.id; }

/* ---- WAITING FOR A LEADER ------------------------------------------
   One document per suggestion, which is the point: a board is one document
   holding every note, so a young person writing it would be rewriting
   everybody's. Approving copies the text onto the board and deletes the
   suggestion, so there is no half-approved state to reason about and nothing
   appears to anybody else until a leader has read it.

   No surname and no contact details reach here: the rules allow a firstName
   with no space in it and no email or telephone field at all. The free text
   is free text, which is exactly why a person reads it before anybody else
   does. */

async function loadSuggestions() {
  const box = document.getElementById('queue');
  if (!box) return;
  if (!board.moderated || !canModerate(board)) { box.style.display = 'none'; return; }
  box.style.display = '';
  let rows = [];
  try {
    const snap = await db.collection('boardSuggestions')
      .where('boardId', '==', board.doc).get();
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b2) => String(a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0)
                     .localeCompare(String(b2.createdAt && b2.createdAt.toMillis ? b2.createdAt.toMillis() : 0)));
  } catch (e) {
    box.innerHTML = '<p class="q-empty">Could not read what is waiting.</p>';
    return;
  }
  if (!rows.length) {
    box.innerHTML = '<p class="q-empty">Nothing is waiting to go up.</p>';
    return;
  }
  const esc = t => { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; };
  box.innerHTML = '<h3 class="q-h">Waiting for you (' + rows.length + ')</h3>'
    + rows.map(r =>
        '<div class="q-row"><div class="q-tx"><b>' + esc(r.firstName || 'Someone') + '</b>'
        + '<span>' + esc(r.text || '') + '</span></div>'
        + '<button class="q-btn ok" data-up="' + esc(r.id) + '">'
        + '<i data-lucide="check" style="width:14px;height:14px"></i>Put it up</button>'
        + '<button class="q-btn no" data-bin="' + esc(r.id) + '">'
        + '<i data-lucide="trash-2" style="width:14px;height:14px"></i>Remove</button></div>').join('');
  if (window.lucide) lucide.createIcons();
}

/* Approve: the note goes on the board in the leader's hands, under the
   child's FIRST NAME, and the suggestion goes. If the board write fails the
   suggestion is left where it is rather than lost. */
async function approveSuggestion(id) {
  let r;
  try {
    const snap = await db.collection('boardSuggestions').doc(id).get();
    if (!snap.exists) { toast('That one has gone already'); return loadSuggestions(); }
    r = snap.data();
  } catch (e) { toast('Could not read it'); return; }

  /* noteSpot(), like every other way of adding a note. This had its own
     copy of the arithmetic and a DIFFERENT one: it counted every note on
     the board rather than the ones on this page that are not archived,
     and it left out the jitter and the tilt. So a note a leader put up
     from a young person's suggestion sat square and could land on top of
     another page's note, while one typed in by hand never did. Nobody
     would have guessed why from looking at the board. */
  state.notes.push(Object.assign({
    id: 'n' + Date.now(), pageId: state.currentPage,
    author: r.firstName || 'Someone', cat: 'idea',
    title: '', body: r.text || '', ytUrl: '', link: '', linkLabel: '', imgUrl: '',
    reactions: {}, myReactions: {}, createdAt: Date.now(), archived: false,
  }, noteSpot()));
  try {
    await BOARD_DOC.set({ pages: state.pages, notes: state.notes });
  } catch (e) {
    state.notes.pop();
    toast('Could not put it up - nothing has been lost');
    return;
  }
  try { await db.collection('boardSuggestions').doc(id).delete(); } catch (e) {}
  renderNotes();
  toast('Up it goes');
  loadSuggestions();
}

async function removeSuggestion(id) {
  if (!confirm('Remove this suggestion?\n\nIt will not go on the board and nobody else will see it.')) return;
  try { await db.collection('boardSuggestions').doc(id).delete(); toast('Removed'); }
  catch (e) { toast('Could not remove it'); }
  loadSuggestions();
}

document.addEventListener('click', e => {
  const up = e.target.closest('[data-up]');
  if (up) return approveSuggestion(up.dataset.up);
  const bin = e.target.closest('[data-bin]');
  if (bin) return removeSuggestion(bin.dataset.bin);
});

function chooseBoard() {
  const mine = BOARDS.filter(b => canSee(b) || familyBoard(b));
  mine.forEach(b => { b.readOnly = !canSee(b); });
  const asked = new URLSearchParams(location.search).get('board');
  const wanted = mine.find(b => b.id === asked);
  if (asked && !wanted) toast('That board is another team\'s');
  /* NO BOARD IS NO BOARD. Falling back to the first one showed someone with
     no board of their own the Worship board (Martin, 10 Oct 2026). Say so
     plainly and draw nothing else. */
  if (!mine.length) return noBoard();
  board = wanted || mine[0];

  BOARD_DOC = db.collection('worshipBoardState').doc(board.doc);
  LOCAL_KEY = localKey(board);

  document.getElementById('boardTitle').textContent = board.title;
  document.body.classList.toggle('ro-board', !!board.readOnly);
  /* Read only: no Add Note in the header either. */
  document.querySelectorAll('header .header-actions button[onclick="openNoteModal()"]')
    .forEach(el => { el.style.display = board.readOnly ? 'none' : ''; });
  /* Each time the board changes, so a leader of two groups does not see the
     other one's queue. */
  loadSuggestions();
  document.getElementById('boardSub').innerHTML     = board.sub;
  document.title = board.title;

  const pick = document.getElementById('boardPicker');
  const sw = document.getElementById('boardSwitch');
  if (mine.length > 1) {
    pick.innerHTML = mine.map(b =>

       switch to is worse than none. */

// ── SYNC STATUS ───────────────────────────────────────────────────────────
function setSyncStatus(s) {
  const dot = document.getElementById('syncDot');
  dot.className = s; // 'syncing' | 'synced' | 'error'
  dot.title = s === 'syncing' ? 'Saving...' : s === 'synced' ? 'All changes saved' : 'Offline — changes saved locally';
}

// ── LOAD STATE ────────────────────────────────────────────────────────────
async function loadState() {
  setSyncStatus('syncing');
  try {
    const snap = await BOARD_DOC.get();
    if (snap.exists) {
      const data = snap.data();
      state = { ...state, ...data };
      // Preserve UI-only fields
      state.currentPage   = state.pages?.[0]?.id || 'main';
      state.currentFilter = 'all';
      state.showArchive   = false;
      state.editingNoteId = null;
    } else {
      // First time — migrate from localStorage if anything there
      const local = localStorage.getItem(LOCAL_KEY);
      if (local) {
        const parsed = JSON.parse(local);
        state = { ...state, ...parsed };
        // Save the migrated data up to Firebase immediately
        await BOARD_DOC.set({ pages: state.pages, notes: state.notes });
        toast('Board migrated to cloud sync');
      }
    }
    setSyncStatus('synced');
  } catch(e) {
    console.warn('Firebase load failed, using localStorage:', e.message);
    setSyncStatus('error');
    try {
      const local = localStorage.getItem(LOCAL_KEY);
      if (local) state = { ...state, ...JSON.parse(local) };
    } catch(e2) {}
  }
}

// ── SAVE STATE ────────────────────────────────────────────────────────────
// Debounced — waits 800ms after last change before saving, to avoid hammering Firebase on drag
function saveState() {
  // Always save locally immediately as backup
  localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
  // Debounce Firebase save
  clearTimeout(saveTimer);
  setSyncStatus('syncing');
  saveTimer = setTimeout(async () => {
    try {
      await BOARD_DOC.set({ pages: state.pages, notes: state.notes });
      setSyncStatus('synced');
    } catch(e) {
      console.warn('Firebase save failed:', e.message);
      setSyncStatus('error');
    }
  }, 800);
}

// ── DRAG ──────────────────────────────────────────────────────────────────
let drag = null;

function startDrag(el, noteId, e) {
  if (e.target.closest('button,a,iframe,select,input,textarea')) return;
  e.preventDefault(); e.stopPropagation();
  const note = state.notes.find(n => n.id === noteId);
  if (!note) return;
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  const z = maxZ() + 1;
  note.zIndex = z; el.style.zIndex = z;
  drag = { noteId, el, ox:cx, oy:cy, nx:note.x||0, ny:note.y||0 };
  el.classList.add('is-dragging');
}

document.addEventListener('mousemove', e => { if (!drag) return; move(e.clientX, e.clientY); });
document.addEventListener('touchmove', e => { if (!drag) return; e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }, { passive:false });

function move(cx, cy) {
  const canvas = document.getElementById('boardCanvas');
  let nx = drag.nx + cx - drag.ox;
  let ny = drag.ny + cy - drag.oy;
  nx = Math.max(0, Math.min(nx, canvas.offsetWidth  - drag.el.offsetWidth));
  ny = Math.max(0, Math.min(ny, canvas.offsetHeight - drag.el.offsetHeight));
  drag.el.style.left = nx + 'px';
  drag.el.style.top  = ny + 'px';
}

function endDrag() {
  if (!drag) return;
  drag.el.classList.remove('is-dragging');
  const note = state.notes.find(n => n.id === drag.noteId);
  if (note) { note.x = parseInt(drag.el.style.left)||0; note.y = parseInt(drag.el.style.top)||0; saveState(); }
  drag = null;
}
document.addEventListener('mouseup',  endDrag);
document.addEventListener('touchend', endDrag);

function maxZ() { return state.notes.reduce((m,n) => Math.max(m, n.zIndex||10), 10); }

      tab.appendChild(d);
    }

    bar.insertBefore(tab, addBtn);
  });
}

// ── RENDER NOTES ──────────────────────────────────────────────────────────
function renderNotes() {
  /* ON A PHONE, THE GRID INSTEAD OF THE CORKBOARD (7f). One entry point
     for both, so everything that already calls renderNotes() - adding,
     editing, archiving, filtering, switching page or board - keeps the
     phone in step without knowing it exists.

     It returns before touching the canvas on purpose: the canvas is
     3200x2400 and absolutely places every note, and laying that out
     behind a hidden container is work nobody sees. The note-with-no-
     place repair below therefore does NOT run on a phone, which is
     exactly right - the brief says x and y are never written there. */
  const pb = document.getElementById('phoneBoard');
  if (pb) pb.hidden = !isPhone();
  if (isPhone()) { renderPhoneBoard(); return; }

  const canvas = document.getElementById('boardCanvas');
  canvas.querySelectorAll('.note').forEach(e => e.remove());

  let notes = state.notes.filter(n => n.pageId === state.currentPage);
  notes = state.showArchive ? notes.filter(n => n.archived) : notes.filter(n => !n.archived);
  if (state.currentFilter !== 'all') notes = notes.filter(n => n.cat === state.currentFilter);
  notes.sort((a,b) => (a.zIndex||0) - (b.zIndex||0));

  document.getElementById('emptyState').style.display = notes.length ? 'none' : '';

  let i = 0;
  notes.forEach(note => {
    /* A NOTE WITH NO PLACE YET gets one from the same formula as a new
       one - noteSpotAt(), underneath noteSpot(). A note added on a phone
       never writes x and y (7f), so this is the path that gives it a
       sensible spot the first time somebody opens the corkboard on a
       computer. Off the render index, because there may be several of
       them and noteSpot() would put them all on one square. */
    if (note.x == null) {
      const spot = noteSpotAt(i);
      note.x = spot.x;
      note.y = spot.y;
      if (note.rot == null) note.rot = spot.rot;
    }
    canvas.appendChild(buildNoteEl(note, i));
    i++;
  });
}

/* ===================================================================
   THE PHONE: THE SHARED BOARD, WIRED TO THIS PAGE (7f)
   ===================================================================

   The drawing lives in egbc-board-phone.js, because §7f asks for this
   same screen in the phone app’s board sheet "so the app and the
   phone website match" - and two copies of a screen match only on the
   day they are written. What stays here is what only this page knows:
   where the notes are, who may do what to them, and how a change is
   saved.

   x, y and zIndex are neither read nor written below, which is what
   the brief asks ("The x/y corkboard positions are ignored for display
   and never written on a phone"). A note added on a phone still gets a
   corkboard spot, from noteSpot(), through renderNotes()’s repair
   path, so it has somewhere sensible to be when a computer opens the
   board next. */

const PHONE_MQ = window.matchMedia('(max-width: 700px)');
function isPhone() { return PHONE_MQ.matches || !!(board && board.readOnly); }

/* REDRAW WHEN THE WIDTH CROSSES 700px. A phone turned on its side does
   this, and so does a check that sets the viewport after the page has
   loaded - which is how every 375px measurement in this project is
   taken. Without it the first render wins and a check resizing to 375px
   measures the corkboard. The sheet is shut first: a full-screen note
   makes no sense on a computer. */
(function () {
  const onChange = () => {
    if (BOARD_PHONE) BOARD_PHONE.close(true);
    if (state && state.notes) renderNotes();
  };
  if (PHONE_MQ.addEventListener) PHONE_MQ.addEventListener('change', onChange);
  else if (PHONE_MQ.addListener) PHONE_MQ.addListener(onChange);
})();

/* The notes this phone screen shows, newest first, after the category
   filter. ONE list, because the grid and the swipe between full-screen
   notes have to agree about what "next" means. */
function phoneNotes() {
  let out = state.notes.filter(n => n.pageId === state.currentPage);
  out = state.showArchive ? out.filter(n => n.archived) : out.filter(n => !n.archived);
  if (state.currentFilter !== 'all') out = out.filter(n => n.cat === state.currentFilter);
  /* NEWEST FIRST (the brief). createdAt may be missing on a note from
     before it was stored, so those sort last rather than first. */
  return out.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
}

let BOARD_PHONE = null;

function boardPhone() {
  if (BOARD_PHONE) return BOARD_PHONE;
  BOARD_PHONE = EGBCBoardPhone.mount({
    grid: document.getElementById('pbGrid'),
    empty: document.getElementById('pbEmpty'),
    addBtn: document.getElementById('pbAdd'),
    sheet: document.getElementById('noteSheet'),
    sheetInner: document.getElementById('noteSheetInner'),
    db: db,
    boardId: board.doc,
    notes: phoneNotes,
    /* The same people who may WRITE this board, which is what the
       rules allow. A young person reads comments and writes none at
       launch; their way in stays "Suggest an idea" through a leader. */
    canPost: () => canModerate(board),
    readOnly: () => !!board.readOnly,
    isLeader: () => mayAdmin(),
    me: () => {
      const u = (typeof EGBCAuth !== 'undefined' && EGBCAuth.user && EGBCAuth.user()) || null;
      const p = (typeof EGBCAuth !== 'undefined' && EGBCAuth.profile && EGBCAuth.profile()) || null;
      return u ? { uid: u.uid, name: (p && p.name) || u.email || 'Someone' } : null;
    },
    toast: toast,
    onReact: (id, key) => react(id, key),
    onEdit: (id) => openNoteModal(id),
    onArchive: (id, on) => { if (on) archiveNote(id); else unarchiveNote(id); },
    onRemove: (id) => {
      state.notes = state.notes.filter(n => n.id !== id);
      saveState(); renderNotes(); toast('Note removed');
    },
    afterChange: () => renderNotes(),
  });
  return BOARD_PHONE;
}

/* The corkboard needs these two by name: the comment count beside a
   note, and opening one from the computer. */
function commentCount(id) { return (boardPhone().counts() || {})[id] || 0; }
function openNoteSheet(id) { boardPhone().open(id); }
function closeNoteSheet(fromHistory) { boardPhone().close(fromHistory); }
function loadCommentCounts() { return boardPhone().loadCounts(); }
function renderPhoneBoard() { boardPhone().render(); }

function buildNoteEl(note, idx) {
  const meta = CAT_META[note.cat] || CAT_META.other;
  const el = document.createElement('div');
  el.className = `note ${meta.cls}`;
  el.id = 'note_' + note.id;
  el.style.left   = (note.x||0) + 'px';
  el.style.top    = (note.y||0) + 'px';
  el.style.zIndex = note.zIndex || 10;
  if (!note.rot && note.rot !== 0) note.rot = (idx*17%7) - 3.5;
  el.style.transform = `rotate(${note.rot}deg)`;

  el.addEventListener('mouseenter', () => { if (!drag) el.style.transform = 'rotate(0deg) scale(1.02) translateY(-3px)'; });
  el.addEventListener('mouseleave', () => { if (!drag) el.style.transform = `rotate(${note.rot}deg)`; });
  el.addEventListener('mousedown',  () => { const z=maxZ()+1; note.zIndex=z; el.style.zIndex=z; }, true);

  const actionsHtml = isAdmin ? `
    <div class="note-actions">
      <button class="note-action-btn" onclick="editNote('${note.id}')"><i data-lucide="pencil" style="width:15px;height:15px;vertical-align:-2px"></i></button>
      ${note.archived
        ? `<button class="note-action-btn" onclick="unarchiveNote('${note.id}')"><i data-lucide="upload" style="width:15px;height:15px;vertical-align:-2px"></i></button>`
        : `<button class="note-action-btn" onclick="archiveNote('${note.id}')"><i data-lucide="archive" style="width:15px;height:15px;vertical-align:-2px"></i></button>`}
      <button class="note-action-btn delete" onclick="confirmDeleteNote('${note.id}')"><i data-lucide="trash-2" style="width:15px;height:15px;vertical-align:-2px"></i></button>
    </div>` : '';

  let ytHtml='', imgHtml='', linkHtml='';
  if (note.ytUrl) {
    const id = extractYtId(note.ytUrl);
    if (id) ytHtml = `<iframe class="yt-player" src="https://www.youtube.com/embed/${id}?rel=0" allowfullscreen loading="lazy"></iframe>`;
  }
  if (note.imgUrl) imgHtml  = `<img class="note-image" src="${esc(note.imgUrl)}" alt="" onerror="this.style.display='none'">`;
  if (note.link) { const _lnk=String(note.link).trim(); if(/^https?:\/\//i.test(_lnk)) linkHtml = `<a class="note-link" href="${esc(_lnk)}" target="_blank" rel="noopener"><i data-lucide="link" style="width:15px;height:15px;vertical-align:-2px"></i> ${esc(note.linkLabel||note.link)}</a>`; }

  const mr = note.myReactions || {};
  const reactHtml = REACTIONS.map(r => {
    const c = (note.reactions||{})[r.key] || 0;
    return `<button class="reaction-btn${mr[r.key]?' active':''}" onclick="react('${note.id}','${r.key}')" title="${r.label}">${reactionIcon(r.icon)}<span id="rc_${note.id}_${r.key}">${c||''}</span></button>`;
  }).join('');

  const date = new Date(note.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

  el.innerHTML = `
    <div class="note-pin"></div>
    <div class="note-topbar">
      <span class="note-category">${reactionIcon(meta.icon)} ${meta.label}</span>
      ${actionsHtml}
    </div>
    ${note.title ? `<div class="note-title">${esc(note.title)}</div>` : ''}
    ${note.body  ? `<div class="note-body">${esc(note.body)}</div>`   : ''}
    ${ytHtml}${imgHtml}${linkHtml}
    <div class="note-reactions">${reactHtml}<button class="reaction-btn" onclick="openNoteSheet('${note.id}')" title="Comments on this note"><i data-lucide="message-square" style="width:14px;height:14px;vertical-align:-2px"></i><span>${commentCount(note.id) || ''}</span></button></div>
    <div class="note-meta">
      <span>${esc(note.author||'Anonymous')}</span>
      <span>${date}</span>
      ${note.archived ? '<span class="archived-badge">Archived</span>' : ''}
    </div>`;

  const topbar = el.querySelector('.note-topbar');
  const pin    = el.querySelector('.note-pin');
  [topbar, pin].forEach(h => {
    h.addEventListener('mousedown',  e => startDrag(el, note.id, e));
    h.addEventListener('touchstart', e => startDrag(el, note.id, e), { passive:false });
  });

  return el;
}

/* WHERE A NEW NOTE GOES ON THE CORKBOARD — ONE PIECE OF CODE.
   ============================================================

   APP-DESIGN-BRIEF 7f: "The new note gets a free spot on the corkboard
   using stickynotes' own placement code (one piece of code decides where
   notes go)." This was those six lines inline in saveNote(), which is
   fine while there is one way to add a note. There are two now - this
   page and the phone - and a second copy of this arithmetic would drift,
   so a note added on a phone would land somewhere a note added on a
   computer never would, for no reason anybody could explain.

   The phone IGNORES x and y for its own layout and never writes them,
   but a note added there still has to have a sensible place when
   somebody opens the corkboard on a computer. So the phone calls this.

   The numbers are unchanged: five across, 310 apart, 340 down, with a
   small deterministic jitter and tilt off the index so a board does not
   look like a spreadsheet. Deterministic rather than random, which is
   why two people adding notes do not land on top of each other.

   TWO CALLERS, TWO QUESTIONS, ONE FORMULA. Placing one NEW note asks
   "how many are already there"; renderNotes() asks the same arithmetic
   of a note that has no x and y at all - a note from before positions
   were stored, or one added on a phone, which never writes them. That
   one has to lay out several at once off the render index, so it cannot
   call noteSpot(); it calls noteSpotAt() underneath it. If it called
   noteSpot() every placeless note would land on the same square. */
function noteSpotAt(i) {
  return {
    x: 60 + (i % 5) * 310 + (i * 37 % 40) - 20,
    y: 60 + Math.floor(i / 5) * 340 + (i * 53 % 40) - 20,
    rot: (i * 17 % 7) - 3.5,
  };
}

function noteSpot() {
  const i = state.notes.filter(n => n.pageId === state.currentPage && !n.archived).length;
  return Object.assign(noteSpotAt(i), { zIndex: maxZ() + 1 });
}

function saveNote() {
  const f = id => document.getElementById(id).value.trim();
  const author=f('noteAuthor'), cat=document.getElementById('noteCat').value,
        title=f('noteTitle'), body=f('noteBody'), ytUrl=f('noteYtUrl'),
        link=f('noteLink'), linkLabel=f('noteLinkLabel'), imgUrl=f('noteImgUrl');
  if (!title && !body) { toast('Please add a title or some details'); return; }

  if (state.editingNoteId) {
    const n = state.notes.find(n=>n.id===state.editingNoteId);
    if (n) Object.assign(n, {author,cat,title,body,ytUrl,link,linkLabel,imgUrl});
  } else {
    state.notes.push(Object.assign({
      id:'n'+Date.now(), pageId:state.currentPage,
      author,cat,title,body,ytUrl,link,linkLabel,imgUrl,
      reactions:{}, myReactions:{}, createdAt:Date.now(), archived:false,
    }, noteSpot()));
  }
  saveState(); closeNoteModal(); renderNotes();
  toast(state.editingNoteId ? 'Note updated' : 'Note pinned');
  state.editingNoteId = null;
}

function editNote(id) { openNoteModal(id); }
function archiveNote(id)   { const n=state.notes.find(n=>n.id===id); if(n){n.archived=true;  saveState();renderNotes();toast('Note archived');} }
function unarchiveNote(id) { const n=state.notes.find(n=>n.id===id); if(n){n.archived=false; saveState();renderNotes();toast('Note restored');} }
function confirmDeleteNote(id) {
  showConfirm('Delete Note','Permanently delete this note?',()=>{
    state.notes=state.notes.filter(n=>n.id!==id); saveState(); renderNotes(); toast('Note deleted');
  });
}

function react(noteId, key) {
  const n = state.notes.find(n=>n.id===noteId); if(!n) return;
  if (!n.reactions)   n.reactions   = {};
  if (!n.myReactions) n.myReactions = {};
  const had = n.myReactions[key];
  n.reactions[key]   = Math.max(0,(n.reactions[key]||0)+(had?-1:1));
  n.myReactions[key] = !had;
  saveState();
  document.querySelector(`#note_${noteId} .reaction-btn[onclick*="'${key}'"]`)?.classList.toggle('active',!!n.myReactions[key]);
  const cnt = document.getElementById(`rc_${noteId}_${key}`);
  if (cnt) cnt.textContent = n.reactions[key]||'';
}

// ── FILTER / ARCHIVE ──────────────────────────────────────────────────────
function setFilter(cat, el) {
  state.currentFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active'); renderNotes();
}

// ── ADMIN ─────────────────────────────────────────────────────────────────
/* Admin.

   This used to be a PIN typed into a box, and the PIN was in the page
   source. Now it is whoever administers that board's team - so Karen
   manages the Kids Church board because she is set as its admin in the
   address book, and nobody manages a board that is not theirs. */

function mayAdmin() {
  if (typeof EGBCAuth === 'undefined' || !EGBCAuth.profile || !EGBCAuth.profile()) return false;
  if (EGBCAuth.isMaster()) return true;
  return board.teams.some(t => EGBCAuth.isAdminOf(t));
}

function paintAdmin() {
  const btn = document.getElementById('adminBtn');
  btn.style.display = mayAdmin() ? '' : 'none';
  btn.innerHTML = (isAdmin ? "<i data-lucide=\"unlock\" style=\"width:15px;height:15px;vertical-align:-2px\"></i> Editing" : "<i data-lucide=\"lock\" style=\"width:15px;height:15px;vertical-align:-2px\"></i> Manage pages");
  if (window.EGBCUI && EGBCUI.icons) EGBCUI.icons();
  document.getElementById('adminBadge').style.display = isAdmin ? 'inline' : 'none';
}

function toggleAdmin() {
  if (!mayAdmin()) { toast('Only this board\'s admins can change its pages'); return; }
  isAdmin = !isAdmin;
  paintAdmin(); renderPages(); renderNotes();
}

/* The old PIN box is still in the markup; this keeps its button harmless. */
function doAdminLogin() { closeModal('adminModal'); }

// ── REPORT ────────────────────────────────────────────────────────────────
function openReportModal() {
  const sel = document.getElementById('reportPageSel');
  sel.innerHTML = '<option value="all">All Pages</option>';
  state.pages.forEach(p => {
    const o = document.createElement('option'); o.value=p.id; o.textContent=p.title; sel.appendChild(o);
  });
  openModal('reportModal');
}

function generateReport() {
  const pf = document.getElementById('reportPageSel').value;
  const cf = document.getElementById('reportCatSel').value;
  let notes = state.notes.filter(n => !n.archived);
  if (pf!=='all') notes = notes.filter(n=>n.pageId===pf);
  if (cf!=='all') notes = notes.filter(n=>n.cat===cf);
  notes.sort((a,b)=>b.createdAt-a.createdAt);

  const ptitle = pf==='all' ? 'All Pages' : (state.pages.find(p=>p.id===pf)||{}).title||'';
  const clabel = cf==='all' ? 'All Categories' : (CAT_META[cf]||{}).label||cf;
  const date   = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  let r = `WORSHIP SUGGESTIONS REPORT\n${'='.repeat(50)}\nGenerated: ${date}\nPage: ${ptitle} | Category: ${clabel}\nTotal: ${notes.length}\n${'='.repeat(50)}\n\n`;
  if (!notes.length) {
    r += 'No suggestions found for the selected filters.\n';
  } else {
    const g = {};
    notes.forEach(n => { (g[n.cat]=g[n.cat]||[]).push(n); });
    Object.entries(g).forEach(([cat,ns]) => {
      const m = CAT_META[cat]||{label:cat,emoji:'📎'};
      r += `${m.emoji} ${m.label.toUpperCase()} (${ns.length})\n${'-'.repeat(40)}\n`;
      ns.forEach(n => {
        const d = new Date(n.createdAt).toLocaleDateString('en-GB');
        r += `• ${n.title||'(No title)'}${n.author?' — '+n.author:''} [${d}]\n`;
        if (n.body)  r += `  ${n.body.replace(/\n/g,'\n  ')}\n`;
        if (n.ytUrl) r += `  YouTube: ${n.ytUrl}\n`;
        if (n.link)  r += `  Link: ${n.linkLabel||n.link} — ${n.link}\n`;
        const rxs = REACTIONS.filter(rx=>(n.reactions||{})[rx.key]>0).map(rx=>`${rx.emoji}×${n.reactions[rx.key]}`);
        if (rxs.length) r += `  Reactions: ${rxs.join('  ')}\n`;
        r += '\n';
      });
    });
  }
  r += `${'='.repeat(50)}\nEnd of report — Worship Suggestions Board\n`;
  document.getElementById('reportContent').textContent = r;
}

function copyReport() {
  navigator.clipboard.writeText(document.getElementById('reportContent').textContent)
    .then(() => toast('Copied to clipboard!'))
    .catch(() => toast('Select the text above and copy manually'));
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function extractYtId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function toast(msg) {
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3100);
}
function showConfirm(title, msg, onOk) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent   = msg;
  document.getElementById('confirmOkBtn').onclick = () => { closeModal('confirmModal'); onOk(); };
  openModal('confirmModal');
}
document.querySelectorAll('.modal-overlay').forEach(o =>
  o.addEventListener('click', e => { if (e.target===o) o.classList.remove('open'); })
);

// ── INIT ──────────────────────────────────────────────────────────────────
/* The guard signs the person in before the page is shown, but it resolves
   on its own clock, so wait for it rather than reading a profile that is
   not there yet. The timeout is so a Firebase outage leaves a usable board
   instead of a permanent spinner. */
function whenSignedIn() {
  return new Promise(resolve => {
    if (typeof EGBCAuth === 'undefined') return resolve(null);
    if (EGBCAuth.profile && EGBCAuth.profile()) return resolve(EGBCAuth.profile());
    document.addEventListener('egbc-ready', e => resolve(e.detail), { once: true });
    setTimeout(() => resolve(null), 8000);
  });
}

(async () => {
  await whenSignedIn();
  if (chooseBoard() === false) return;
  state = blankState();
  await loadState();
  paintAdmin();
  renderPages();
  renderNotes();
  /* The comment counts, one query for the board, redrawing when they
     arrive. Deliberately NOT awaited: a board that draws only once the
     comments are counted is a board that waits for something nobody has
     asked to see yet. */
  loadCommentCounts();
  /* ?add=1 opens straight on the Add Note box. The hub's pin board card uses
     it for "Add an idea": somebody who has had the thought should not have to
     find the button first. Opened after the board has loaded, so the note
     lands on the right board. */
  if (new URLSearchParams(location.search).get('add')) openNoteModal();
  setTimeout(() => {
    const h = document.getElementById('dragHint');
    setTimeout(() => h.classList.add('fade'), 3500);
  }, 800);
})();

/* ---- the bars stack off each other, not off numbers ---------------
   Four bars are fixed to the top of the screen. Their tops used to be
   0, 64, 106 and 152, typed in - which is right only while every bar
   is exactly the height somebody assumed. At 375px the header is not,
   so its contents spilled upwards off the screen.

   --am-top is the app header’s height when this page was opened from
   the phone app (egbc-appmode.js), and 0 otherwise, so one sum covers
   both. data-am-own tells app mode to leave these four alone: they
   have already counted it, and being shifted again would double it. */
function snStack() {
  var root = document.documentElement;
  var am = parseFloat(getComputedStyle(root).getPropertyValue("--am-top")) || 0;
  var amB = parseFloat(getComputedStyle(root).getPropertyValue("--am-bottom")) || 0;
  var bars = [document.querySelector("header"),
              document.querySelector(".pages-bar"),
              document.querySelector(".filter-bar")];
  var y = am;
  for (var i = 0; i < bars.length; i++) {
    if (!bars[i]) continue;
    bars[i].setAttribute("data-am-own", "1");
    root.style.setProperty("--sn-top-" + i, y + "px");
    var cs = getComputedStyle(bars[i]);
    if (cs.display !== "none") y += bars[i].offsetHeight;
  }
  root.style.setProperty("--sn-top-3", y + "px");
  root.style.setProperty("--sn-bottom", amB + "px");
  var outer = document.querySelector(".board-outer");
  if (outer) outer.setAttribute("data-am-own", "1");
}
snStack();
window.addEventListener("resize", snStack);
/* The bars fill in as the board loads - the page tabs, the filters and
   "Switch board" all appear once we know which board this is. */
setTimeout(snStack, 400);
setTimeout(snStack, 1500);
try {
  var snPending = null;
  new MutationObserver(function () {
    clearTimeout(snPending); snPending = setTimeout(snStack, 120);
  }).observe(document.body, { childList: true, subtree: true });
} catch (e) {}
