<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worship & AV Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --pale-teal: #f0f6f6;
            --border-teal: #d1dfdf;
            --accent-teal: #3d6263;
            --white: #ffffff;
            --brand-green: #9bc34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--pale-teal); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        #sidebar { width: 70px; background: var(--white); border-right: 1px solid var(--border-teal); display: flex; flex-direction: column; transition: width 0.3s ease; z-index: 1000; }
        #sidebar:hover { width: 280px; }
        #nav-list { flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 20px; }

        .nav-item-wrapper { display: flex; flex-direction: column; min-width: 280px; position: relative; }
        
        .nav-row { display: flex; align-items: center; height: 45px; color: #7a8c8c; cursor: pointer; border-left: 4px solid transparent; transition: 0.2s; }
        .nav-row:hover { background: var(--pale-teal); color: var(--accent-teal); border-left-color: var(--brand-green); }
        
        .nav-icon { min-width: 70px; display: flex; justify-content: center; align-items: center; }
        .nav-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; }
        .nav-text { font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; opacity: 0; transition: opacity 0.2s; white-space: nowrap; flex-grow: 1; }
        #sidebar:hover .nav-text { opacity: 1; }

        /* CHEVRON INDICATOR */
        .chevron { width: 40px; display: flex; justify-content: center; opacity: 0; transition: transform 0.3s, opacity 0.2s; }
        #sidebar:hover .chevron { opacity: 0.5; }
        .has-children.open > .nav-row .chevron { transform: rotate(180deg); }

        /* COLLAPSIBLE CONTAINER */
        .child-container { height: 0; overflow: hidden; transition: height 0.3s ease-out; background: rgba(0,0,0,0.02); }
        .has-children.open > .child-container { height: auto; }

        /* NESTING STYLES */
        .indent-1 .nav-text { font-weight: 600; text-transform: none; font-size: 11px; }
        .indent-2 .nav-text { font-weight: 400; text-transform: none; font-size: 11px; font-style: italic; }

        .edit-trigger { display: none; padding: 0 10px; color: var(--border-teal); cursor: pointer; }
        #sidebar:hover .admin-active .edit-trigger { display: block; }

        /* ADMIN MODAL & UI - Consistent with previous */
        #admin-controls { display: none; padding: 15px; border-top: 1px solid var(--border-teal); }
        .admin-btn { width: 100%; padding: 10px; background: var(--accent-teal); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        #admin-modal { display: none; position: fixed; inset: 0; background: rgba(61, 98, 99, 0.4); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 450px; max-height: 90vh; overflow-y: auto; }
        .modal-content label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--accent-teal); margin: 10px 0 5px; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; border: 2px solid var(--border-teal); border-radius: 8px; outline: none; }

        /* HEADER & VIEWPORT */
        #main-container { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; }
        header { height: 110px; background: var(--white); padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-teal); }
        #dept-logo { height: 85px; width: auto; max-width: 300px; transition: opacity 0.3s ease; }
        #app-viewport { flex-grow: 1; padding: 25px; display: flex; position: relative; }
        #app-frame { width: 100%; height: 100%; border: 1px solid var(--border-teal); border-radius: 16px; background: var(--white); }
        #landing-content { position: absolute; inset: 25px; background: var(--white); border-radius: 16px; padding: 50px; z-index: 5; border: 1px solid var(--border-teal); }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div id="nav-list"></div>
        <div id="admin-controls">
            <button class="admin-btn" onclick="openModal()">+ Add Page / Sub</button>
            <button class="admin-btn" style="background:#f44336;" onclick="resetMenu()">Reset System</button>
        </div>
    </nav>

    <div id="main-container">
        <header>
            <img id="dept-logo" src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media&token=ea8cd929-6f35-4a23-9ffa-e78ac46fa300">
            <div style="text-align: right">
                <div id="secret-trigger" onclick="handleSecret()" style="font-size: 10px; color: #a0b0b0; text-transform: uppercase; cursor: pointer;">Secure Portal</div>
                <div style="font-size: 12px; color: var(--accent-teal); font-weight: 700;">Worship & AV Hub</div>
            </div>
        </header>
        <main id="app-viewport">
            <div id="landing-content">
                <h2 style="font-weight: 300; font-size: 32px; color: var(--accent-teal); margin-bottom: 10px;">Dashboard</h2>
                <p style="color: #7a8c8c;">Select a tool to begin.</p>
            </div>
            <iframe id="app-frame" style="display:none;" src=""></iframe>
        </main>
    </div>

    <div id="admin-modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: var(--accent-teal);">Page Settings</h3>
            <input type="hidden" id="editId">
            <label>Name</label><input type="text" id="nodeName">
            <label>Link (URL)</label><input type="text" id="nodeUrl">
            <label>Custom Logo (Optional)</label><input type="text" id="nodeLogo">
            <label>Parent Item</label><select id="nodeParent"><option value="none">Top Level</option></select>
            <label>Icon</label><select id="nodeIcon">
                <option value="home">Home</option><option value="calendar">Calendar</option><option value="music">Music</option>
                <option value="worship">Worship</option><option value="av">AV</option><option value="youth">Youth</option>
                <option value="trouble">Tools</option><option value="training">Book</option><option value="social">Social</option>
                <option value="core">Shield</option><option value="leader">Mic</option><option value="heart">Heart</option>
            </select>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button id="deleteBtn" class="admin-btn" style="background:#f44336; display:none;" onclick="deletePage()">Delete</button>
                <button class="admin-btn" style="background:#ccc" onclick="closeModal()">Cancel</button>
                <button class="admin-btn" onclick="savePage()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'EGBC_FINAL_PORTAL_STORAGE';
        const DEFAULT_LOGO = "https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media&token=ea8cd929-6f35-4a23-9ffa-e78ac46fa300";
        
        const ICONS = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1"/></svg>`,
            calendar: `<svg viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7H5v12z"/></svg>`,
            music: `<svg viewBox="0 0 24 24"><path d="M9 19V6l12-3v13M9 19c0 1.1-.9 2-2 2s-2-.9-2-2m14-3c0 1.1-.9 2-2 2s-2-.9-2-2"/></svg>`,
            worship: `<svg viewBox="0 0 24 24"><path d="M12 2v20M7 7h10"/></svg>`,
            av: `<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>`,
            youth: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2m15-12a4 4 0 11-8 0 4 4 0 018 0zm6 12v-2a4 4 0 00-3-3.87m-4-12a4 4 0 010 7.75"/></svg>`,
            trouble: `<svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>`,
            training: `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V3H6.5A2.5 2.5 0 004 5.5v14z"/></svg>`,
            social: `<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>`,
            core: `<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
            leader: `<svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>`,
            heart: `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`
        };

        let menuItems = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
            { id: 1, name: 'Dashboard', url: 'landing', icon: 'home', parent: 'none' },
            { id: 2, name: 'Worship Planner', url: 'https://esherchurch.github.io/availability-form/Planner.html', icon: 'calendar', parent: 'none' },
            { id: 3, name: 'Music Hub', url: 'https://esherchurch.github.io/availability-form/music-uploader.html', icon: 'music', parent: 'none' }
        ];

        function renderMenu() {
            const list = document.getElementById('nav-list');
            const parentSelect = document.getElementById('nodeParent');
            list.innerHTML = '';
            parentSelect.innerHTML = '<option value="none">Top Level</option>';

            const buildTree = (parentId, level = 0) => {
                const children = menuItems.filter(i => i.parent == parentId);
                children.forEach(item => {
                    const hasSubs = menuItems.some(i => i.parent == item.id);
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = `nav-item-wrapper indent-${level} ${hasSubs ? 'has-children' : ''}`;
                    wrapper.dataset.id = item.id;

                    wrapper.innerHTML = `
                        <div class="nav-row" onclick="handleItemClick(event, '${item.id}', '${item.url}', '${item.logo || DEFAULT_LOGO}')">
                            <div class="nav-icon">${ICONS[item.icon] || ICONS.home}</div>
                            <span class="nav-text">${item.name}</span>
                            ${hasSubs ? '<div class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>' : ''}
                            <div class="edit-trigger" onclick="event.stopPropagation(); openEdit(${item.id})">✎</div>
                        </div>
                        <div class="child-container" id="child-of-${item.id}"></div>
                    `;
                    
                    const targetContainer = parentId === 'none' ? list : document.getElementById(`child-of-${parentId}`);
                    targetContainer.appendChild(wrapper);

                    if (level < 2) parentSelect.innerHTML += `<option value="${item.id}">${'-'.repeat(level)} ${item.name}</option>`;
                    buildTree(item.id, level + 1);
                });
            };

            buildTree('none');
            
            if(document.getElementById('admin-controls').style.display === 'block') {
                list.classList.add('admin-active');
            }
        }

        function handleItemClick(event, id, url, logo) {
            const wrapper = event.currentTarget.parentElement;
            if (wrapper.classList.contains('has-children')) {
                wrapper.classList.toggle('open');
            }
            if (url && url !== '#') {
                navigate(url, logo);
            }
        }

        function navigate(url, logoUrl) {
            const logoImg = document.getElementById('dept-logo');
            logoImg.style.opacity = '0';
            setTimeout(() => {
                logoImg.src = logoUrl || DEFAULT_LOGO;
                logoImg.style.opacity = '1';
            }, 200);

            if (url === 'landing') {
                document.getElementById('app-frame').style.display = 'none';
                document.getElementById('landing-content').style.display = 'block';
            } else {
                document.getElementById('landing-content').style.display = 'none';
                document.getElementById('app-frame').style.display = 'block';
                document.getElementById('app-frame').src = url;
            }
        }

        // ADMIN LOGIC
        let clickCount = 0;
        function handleSecret() {
            clickCount++;
            if (clickCount >= 3) {
                document.getElementById('admin-controls').style.display = 'block';
                document.getElementById('secret-trigger').style.color = '#9bc34a';
                renderMenu();
            }
        }

        function openModal() { document.getElementById('admin-modal').style.display = 'flex'; }
        function closeModal() { 
            document.getElementById('admin-modal').style.display = 'none';
            document.getElementById('editId').value = '';
            document.getElementById('deleteBtn').style.display = 'none';
        }

        function openEdit(id) {
            const item = menuItems.find(i => i.id == id);
            document.getElementById('editId').value = id;
            document.getElementById('nodeName').value = item.name;
            document.getElementById('nodeUrl').value = item.url;
            document.getElementById('nodeLogo').value = item.logo || '';
            document.getElementById('nodeParent').value = item.parent;
            document.getElementById('nodeIcon').value = item.icon;
            document.getElementById('deleteBtn').style.display = 'block';
            openModal();
        }

        function savePage() {
            const id = document.getElementById('editId').value;
            const data = {
                id: id ? parseInt(id) : Date.now(),
                name: document.getElementById('nodeName').value,
                url: document.getElementById('nodeUrl').value,
                logo: document.getElementById('nodeLogo').value,
                parent: document.getElementById('nodeParent').value,
                icon: document.getElementById('nodeIcon').value
            };
            if (id) menuItems[menuItems.findIndex(i => i.id == id)] = data;
            else menuItems.push(data);
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(menuItems));
            renderMenu();
            closeModal();
        }

        function deletePage() {
            const id = document.getElementById('editId').value;
            menuItems = menuItems.filter(i => i.id != id && i.parent != id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(menuItems));
            renderMenu();
            closeModal();
        }

        function resetMenu() {
            if(confirm("Factory Reset?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        renderMenu();
    </script>
</body>
</html>
