<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Performance Notes</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: 'Montserrat', sans-serif; }

/* SCREEN */
.screen {
    position: fixed;
    inset: 0;
    background: #0f172a;
    color: white;
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-sizing: border-box;
}

/* BUTTONS */
.btn {
    background:#2c6999;
    color:white;
    padding:14px 18px;
    border-radius:14px;
    font-weight:700;
}

.nav-btn {
    background:#2c6999;
    padding:14px 20px;
    border-radius:14px;
    font-size:18px;
    font-weight:800;
}

/* MOBILE ONLY SCALE */
@media (max-width:768px){
 .btn {
   padding:10px 12px;
   font-size:14px;
 }
 .nav-btn {
   padding:10px 14px;
   font-size:14px;
 }
 .screen {
   padding: 12px 8px;
   gap: 10px;
 }
}

/* TEXTAREA (EDIT MODE FIX ONLY) */
textarea {
    width: 100%;
    font-size: 26pt;
    font-weight: 700;
    background: #020617;
    color: white;
    padding: 24px;
    border-radius: 16px;
    overflow-y: auto;
    resize: none;
    box-sizing: border-box;
    line-height: 1.4;
    margin-top: 10px;
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.1);
}

/* MOBILE TEXT */
@media (max-width:768px){
 textarea {
   font-size:18pt;
   padding:16px;
 }
}

/* PERFORMANCE MODE SCALE FIX */
.performance textarea {
    font-size: clamp(14pt, 5vw, 24pt);
    height: 100% !important;
    max-height: none;
    flex-grow: 1;
}

/* SMALL BOX */
.smallbox {
    font-size: 14px;
    opacity: 0.9;
    padding: 0 4px;
}

/* MENU */
#menu {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 260px;
    background: #2c6999;
    color: white;
    transform: translateX(-100%);
    transition: 0.3s;
    z-index: 1000;
    overflow-y: auto;
}
#menu.open { transform: translateX(0); }

#menu div {
    padding:16px;
    border-bottom:1px solid rgba(255,255,255,0.2);
    font-weight:700;
    cursor:pointer;
}
#menu div:hover {
    background: rgba(255,255,255,0.2);
}

/* OVERLAY */
#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    z-index: 900;
}
#overlay.show { display:block; }

/* PDF */
#pdfViewer {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    z-index: 9999;
}

.closeBtn {
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    color:black;
    padding:12px 16px;
    border-radius:10px;
    font-weight:bold;
    z-index:10000;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
 apiKey:"AIzaSy...",
 authDomain:"egbc-worship-planner.firebaseapp.com",
 projectId:"egbc-worship-planner"
});
const db = getFirestore(app);

let eventsForDay = [];
let selectedEvent = null;
let currentService = null;
let songs = [];
let index = 0;
let currentRole = "";
let currentDate = "";
let currentLeader = "";
let selectedKeys = [];
let performance = false;
let currentDocId = null;

const dateInput = () => document.getElementById('dateInput');
const serviceSelect = () => document.getElementById('serviceSelect');
const roleSelect = () => document.getElementById('roleSelect');
const appDiv = () => document.getElementById('app');

window.autoGrow = (el)=>{
 if(performance) return;
 el.style.height = "auto";
 el.style.height = el.scrollHeight + "px";
};

/* LOAD EVENTS */
window.loadRota = async () => {
 const date = dateInput().value;
 const snap = await getDocs(collection(db,"events"));

 eventsForDay = [];
 snap.forEach(d=>{
  const ev=d.data();
  if(ev.date===date && ev.archived!==true){
   eventsForDay.push(ev);
  }
 });

 serviceSelect().innerHTML='<option value="">Select Service</option>';
 eventsForDay.forEach((ev,i)=>{
  serviceSelect().innerHTML+=`<option value="${i}">${ev.type}</option>`;
 });
};

window.selectService = () => {
 const i = serviceSelect().value;
 if(i==="") return;

 selectedEvent = eventsForDay[i];
 currentLeader = selectedEvent.assignments?.["Worship Leader"]?.name || "";

 roleSelect().innerHTML='<option value="">Instrument</option>';
 Object.keys(selectedEvent.assignments || {}).forEach(r=>{
  roleSelect().innerHTML+=`<option>${r}</option>`;
 });
};

window.loadService = async () => {

 currentDate = dateInput().value;
 currentRole = roleSelect().value;

 const snap = await getDocs(query(collection(db,"services"), where("date","==",currentDate)));
 currentService = snap.docs[0].data();

 songs = currentService.order.filter(x=>x.type==="song");

 buildMenu();
 showSong(0);

 document.getElementById("startScreen").style.display="none";
};

function buildMenu(){
 const menu = document.getElementById("menu");
 menu.innerHTML="";
 songs.forEach((s,i)=>{
  const div=document.createElement("div");
  div.innerText=s.title;
  div.onclick=()=>{
    showSong(i);
    toggleMenu();
  };
  menu.appendChild(div);
 });
}

window.toggleMenu = ()=>{
 document.getElementById("menu").classList.toggle("open");
 document.getElementById("overlay").classList.toggle("show");
};

window.closeMenu = ()=>{
 document.getElementById("menu").classList.remove("open");
 document.getElementById("overlay").classList.remove("show");
};

window.togglePerformance = ()=>{
 performance = !performance;
 showSong(index);
};

async function showSong(i){

 index = i;
 const s = songs[i];

 selectedKeys = [...(s.keys || [])];

 const songDoc = await getDoc(doc(db,"songs",s.title.toLowerCase().replace(/\s+/g,"-")));
 const data = songDoc.exists()?songDoc.data():{};
 const allFiles = data.files || [];

 const files = allFiles.filter(f=>selectedKeys.includes(f.key));

 let yourNotes = s.notes || "";
 currentDocId = null;

 const todaySnap = await getDocs(query(collection(db,"schedules"),
  where("date","==",currentDate),
  where("role","==",currentRole)));

 todaySnap.forEach(d=>{
  const n=d.data();
  if(n.songTitle===s.title){
   yourNotes = n.notes;
   currentDocId = d.id;
  }
 });

 const allSnap = await getDocs(collection(db,"schedules"));
 let last = null;

 allSnap.forEach(d=>{
  const n=d.data();
  if(n.worshipLeader===currentLeader &&
     n.role===currentRole &&
     n.songTitle===s.title &&
     n.date!==currentDate){
   if(!last || new Date(n.date)>new Date(last.date)){
    last=n;
   }
  }
 });

 const roleNotes = currentService?.roleNotes?.[currentRole] || "";

 appDiv().innerHTML=`
 <div class="screen ${performance?'performance':''}">

  <div style="display:flex;justify-content:space-between;align-items:center;">
   <button class="btn" onclick="toggleMenu()">☰</button>
   <div style="font-weight:800; font-size:1.1rem; text-align:center; flex:1;">${s.title}</div>
   <div style="display:flex; gap:5px;">
    <button class="nav-btn" onclick="prev()">⬅</button>
    <button class="nav-btn" onclick="next()">➡</button>
   </div>
  </div>

  <button class="btn" onclick="togglePerformance()">
   ${performance ? "Edit Mode" : "Performance Mode"}
  </button>

  <div style="display:flex; gap:10px; flex-wrap:wrap;">
   ${[...new Set(allFiles.map(f=>f.key).filter(Boolean))].map(k=>`
    <label style="font-size: 14px;">
     <input type="checkbox" ${selectedKeys.includes(k)?"checked":""}
     onchange="toggleKey('${k}',this.checked)"> ${k}
    </label>`).join("")}
  </div>

  <div style="display:flex; gap:8px; flex-wrap:wrap;">
   ${files.map(f=>`
    <button class="btn" onclick="openPDF('${f.url}')">
     ${f.type} (${f.key})
    </button>
   `).join("")}
  </div>

  <textarea id="notes" oninput="autoGrow(this)">${yourNotes}</textarea>

  ${!performance ? `
    <div class="smallbox"><b>Instrument Notes:</b><br>${roleNotes}</div>
    <div class="smallbox"><b>Last Time:</b><br>${last?last.notes:""}</div>
    <button class="btn" onclick="save('${s.title}')">Save</button>
  ` : ""}

 </div>`;

 setTimeout(()=>{
  const ta = document.getElementById("notes");
  if(ta) autoGrow(ta);
 },50);
}

/* KEYS */
window.toggleKey=(k,on)=>{
 if(on){
  if(!selectedKeys.includes(k)) selectedKeys.push(k);
 } else {
  selectedKeys = selectedKeys.filter(x=>x!==k);
 }
 showSong(index);
};

/* NAV */
window.next = ()=>{ if(index<songs.length-1) showSong(index+1); };
window.prev = ()=>{ if(index>0) showSong(index-1); };

/* PDF */
window.openPDF = (url)=>{
 if(url.includes("drive")){
  const m=url.match(/\/d\/(.*?)\//);
  if(m) url=`https://drive.google.com/file/d/${m[1]}/preview`;
 }

 const v=document.getElementById("pdfViewer");
 v.innerHTML=`
    <button class="closeBtn" onclick="closePDF()">Close</button>
    <iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>
 `;
 v.style.display="block";

 if(v.requestFullscreen){
   v.requestFullscreen();
 }
};

window.closePDF = ()=>{
 const v=document.getElementById("pdfViewer");
 v.style.display="none";

 if(document.fullscreenElement){
   document.exitFullscreen();
 }
};

/* SAVE */
window.save = async(song)=>{
 const txt = document.getElementById("notes").value;

 if(currentDocId){
  await updateDoc(doc(db,"schedules",currentDocId), { notes: txt });
 } else {
  const newDoc = await addDoc(collection(db,"schedules"),{
   date: currentDate,
   role: currentRole,
   worshipLeader: currentLeader,
   songTitle: song,
   notes: txt
  });
  currentDocId = newDoc.id;
 }

 alert("Saved");
};
</script>
</head>

<body>

<div id="startScreen" class="max-w-xl mx-auto p-6 space-y-4">
<h1 class="text-2xl font-extrabold text-[#2c6999]">Performance Notes</h1>

<input type="date" id="dateInput" onchange="loadRota()" class="w-full p-3 rounded-xl">

<select id="serviceSelect" onchange="selectService()" class="w-full p-3 rounded-xl">
<option>Select Service</option>
</select>

<select id="roleSelect" class="w-full p-3 rounded-xl">
<option>Instrument</option>
</select>

<button onclick="loadService()" class="w-full bg-[#2c6999] text-white p-3 rounded-xl font-bold">
Load Service
</button>
</div>

<div id="menu"></div>
<div id="overlay" onclick="closeMenu()"></div>
<div id="pdfViewer"></div>
<div id="app"></div>

</body>
</html>
