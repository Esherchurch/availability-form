<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Performance Mode</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
textarea {
    font-size: 16pt !important;
    font-weight: 700 !important;
    overflow: hidden;
    resize: none;
}

.minimized {
    height: 34px;
    overflow: hidden;
}

#pdfViewer {
    position: fixed;
    inset: 0;
    background: white;
    z-index: 9999;
    display: none;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentLeader = "";
let currentService = null;
let currentDate = "";

const makeKey = (song, key) =>
    `${(song || "").trim().toLowerCase()}|${(key || "").trim().toLowerCase()}`;

window.loadPerformance = async () => {

    const date = document.getElementById('date').value;
    if (!date) return;

    currentDate = date;

    const container = document.getElementById('content');
    container.innerHTML = "Loading...";

    const eventSnap = await getDocs(collection(db, "events"));

    let rota = null;

    eventSnap.forEach(doc => {
        const ev = doc.data();
        if (ev.date === date && ev.archived !== true) rota = ev;
    });

    if (!rota) {
        container.innerHTML = "No rota found for this date";
        return;
    }

    currentLeader = rota.assignments?.["Worship Leader"]?.name || "";

    const serviceSnap = await getDocs(collection(db, "services"));

    currentService = null;

    serviceSnap.forEach(doc => {
        const s = doc.data();
        if (s.date === date) currentService = s;
    });

    if (!currentService) {
        container.innerHTML = "No saved service order yet";
        return;
    }

    const roleSelect = document.getElementById('role');
    roleSelect.innerHTML = `<option value="">Instrument</option>`;

    Object.keys(rota.assignments || {}).forEach(role => {
        roleSelect.innerHTML += `<option value="${role}">${role}</option>`;
    });

    container.innerHTML = "";
};

function getLatestNote(allNotes, song, role, key) {

    let latest = null;
    let latestDate = null;

    allNotes.forEach(n => {
        if (
            n.worshipLeader === currentLeader &&
            n.role === role &&
            makeKey(n.songTitle, n.key) === makeKey(song, key) &&
            n.date !== currentDate
        ) {
            const d = new Date(n.date);
            if (!latestDate || d > latestDate) {
                latestDate = d;
                latest = n;
            }
        }
    });

    return latest;
}

window.loadSongsForRole = async () => {

    const role = document.getElementById('role').value;
    if (!role || !currentService) return;

    const container = document.getElementById('content');
    container.innerHTML = "Loading...";

    const q = query(
        collection(db, "schedules"),
        where("date", "==", currentDate),
        where("role", "==", role)
    );

    const snap = await getDocs(q);

    const todayNotes = {};
    snap.forEach(docSnap => {
        const d = docSnap.data();
        todayNotes[makeKey(d.songTitle, d.key)] = {
            notes: d.notes,
            docId: docSnap.id
        };
    });

    const allSnap = await getDocs(collection(db, "schedules"));
    const allNotes = [];
    allSnap.forEach(doc => allNotes.push(doc.data()));

    container.innerHTML = "";

    for (const item of currentService.order) {

        if (item.type === "item") {
            const div = document.createElement('div');
            div.className = "text-center text-[#2c6999] font-extrabold text-lg py-2";
            div.innerText = item.title;
            container.appendChild(div);
            continue;
        }

        const key = item.key || "";
        const today = todayNotes[makeKey(item.title, key)];
        const last = getLatestNote(allNotes, item.title, role, key);

        const docId = item.title.toLowerCase().replace(/\s+/g, "-");
        const songSnap = await getDoc(doc(db, "songs", docId));

        let youtube = "";
        let ccli = "";
        let files = [];

        if (songSnap.exists()) {
            const data = songSnap.data();
            youtube = data.youtube || "";
            ccli = data.ccli || "";
            files = data.files || [];
        }

        const songSelectLink = ccli
            ? `https://songselect.ccli.com/Songs/${ccli}`
            : `https://songselect.ccli.com/search/results?search=${encodeURIComponent(item.title)}`;

        const div = document.createElement('div');
        div.className = "bg-white p-4 rounded-2xl shadow mb-4";

        div.innerHTML = `
            <div class="flex justify-between items-center font-extrabold text-lg text-[#2c6999] cursor-pointer">
                <span onclick="this.closest('.bg-white').querySelector('.body').classList.toggle('hidden')">
                    ${item.title} (${key})
                </span>
                <button onclick="toggleMin(this)">_</button>
            </div>

            <div class="body mt-3 hidden">

                <div class="flex gap-3 flex-wrap text-sm mb-2">
                    ${youtube ? `<a href="${youtube}" target="_blank" class="text-blue-600">🎬 YouTube</a>` : `<span class="text-gray-400">No YouTube</span>`}
                    <a href="${songSelectLink}" target="_blank" class="text-purple-600">🔎 SongSelect</a>
                    ${ccli ? `<span class="text-gray-500">CCLI: ${ccli}</span>` : `<span class="text-gray-400">No CCLI</span>`}
                </div>

                <div>
                    ${files.map(f => `
                        <button onclick="openPDF('${f.url}')"
                        class="inline-block text-xs bg-[#2c6999] text-white px-2 py-1 rounded mr-1 mt-1">
                        ${f.type || 'PDF'}
                        </button>
                    `).join("")}
                </div>

                <textarea 
                    oninput="autoGrow(this)"
                    class="w-full p-3 rounded-xl bg-[#f8fafc] mt-2"
                    data-song="${item.title}"
                    data-key="${key}"
                    data-docid="${today ? today.docId : ""}"
                >${today ? today.notes : (last ? last.notes : "")}</textarea>

                <div class="flex gap-2 mt-2">
                    <button onclick="saveNote('${item.title}','${key}')" 
                        class="bg-[#2c6999] text-white px-4 py-2 rounded-lg text-sm">
                        Save
                    </button>

                    <button onclick="importLast('${item.title}','${key}')" 
                        class="bg-gray-200 px-4 py-2 rounded-lg text-sm">
                        Import Last Notes
                    </button>
                </div>

            </div>
        `;

        container.appendChild(div);

        setTimeout(() => {
            const ta = div.querySelector("textarea");
            if (ta) autoGrow(ta);
        }, 0);
    }
};

window.autoGrow = (el) => {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
};

window.toggleMin = (btn) => {
    btn.closest('.bg-white').classList.toggle('minimized');
};

window.openPDF = (url) => {

    if (url.includes("drive.google.com")) {
        const match = url.match(/\/d\/(.*?)\//);
        if (match) {
            url = `https://drive.google.com/file/d/${match[1]}/preview`;
        }
    }

    const viewer = document.getElementById("pdfViewer");
    viewer.innerHTML = `
        <button onclick="closePDF()" style="position:absolute;top:10px;right:10px;background:black;color:white;padding:12px;">
        Close
        </button>
        <iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>
    `;
    viewer.style.display = "block";
};

window.closePDF = () => {
    const viewer = document.getElementById("pdfViewer");
    viewer.style.display = "none";
    viewer.innerHTML = "";
};
</script>
</head>

<body class="p-6 bg-[#f4f7fa] font-montserrat">

<div id="pdfViewer"></div>

<div class="max-w-xl mx-auto space-y-6">

<h1 class="text-2xl font-extrabold text-[#2c6999]">Performance Mode</h1>

<input type="date" id="date" class="p-3 rounded-xl w-full" onchange="loadPerformance()">

<select id="role" class="p-3 rounded-xl w-full" onchange="loadSongsForRole()">
<option value="">Instrument</option>
</select>

<div id="content"></div>

</div>

</body>
</html>
