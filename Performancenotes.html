<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Mode</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family:sans-serif; background:#f4f7fa; }

.screen {
    position:fixed;
    inset:0;
    background:#0f172a;
    color:white;
    padding:20px;
}

textarea {
    width:100%;
    font-size:18pt;
    font-weight:bold;
    background:#020617;
    color:white;
    padding:12px;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
 apiKey:"AIzaSy...",
 authDomain:"egbc-worship-planner.firebaseapp.com",
 projectId:"egbc-worship-planner"
});

const db=getFirestore(app);

let eventsForDay=[];
let songs=[];

window.loadRota = async () => {
 const date=document.getElementById('date').value;
 const snap=await getDocs(collection(db,"events"));

 eventsForDay=[];
 snap.forEach(d=>{
  const ev=d.data();
  if(ev.date===date && ev.archived!==true){
   eventsForDay.push(ev);
  }
 });

 const sel=document.getElementById('service');
 sel.innerHTML='<option>Select Service</option>';
 eventsForDay.forEach((ev,i)=>{
  sel.innerHTML+=`<option value="${i}">${ev.type}</option>`;
 });
};

window.loadService = async () => {

 const date=document.getElementById('date').value;

 const serv=await getDocs(collection(db,"services"));

 songs=[];

 serv.forEach(d=>{
  const s=d.data();

  if(s.date===date){

   console.log("SERVICE FOUND:", s);

   songs = (s.order || []).filter(x => x.type === "song");
  }
 });

 // 🔴 DEBUG OUTPUT
 if(songs.length===0){
  document.getElementById("app").innerHTML=`
  <div class="p-6">
    <h2 class="text-xl font-bold text-red-600">No songs found</h2>
    <p>Possible reasons:</p>
    <ul style="margin-top:10px;">
      <li>- Service not saved</li>
      <li>- Songs not marked as type "song"</li>
      <li>- Date mismatch</li>
    </ul>
  </div>`;
  return;
 }

 // ✅ FORCE SHOW FIRST SONG
 const s=songs[0];

 document.getElementById("startScreen").style.display="none";

 document.getElementById("app").innerHTML=`
 <div class="screen">
   <h1>${s.title}</h1>
   <textarea>${s.notes || ""}</textarea>
 </div>`;
};
</script>
</head>

<body>

<div id="startScreen" class="p-6 space-y-4">
<h1 class="text-xl font-bold">Performance Mode</h1>

<input type="date" id="date" onchange="loadRota()" class="w-full p-3">

<select id="service" class="w-full p-3"></select>

<button onclick="loadService()" class="w-full bg-blue-600 text-white p-3">
Load Service
</button>
</div>

<div id="app"></div>

</body>
</html>
