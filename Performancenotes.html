<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Performance Mode</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
textarea {
    font-size: 14pt;
    font-weight: bold;
    overflow: hidden;
}
.minimal {
    height: 26px !important;
    overflow: hidden;
    padding: 4px !important;
}
#pdfViewer {
    position: fixed;
    inset: 0;
    background: white;
    z-index: 9999;
    display: none;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentLeader = "";
let currentService = null;
let currentDate = "";

// 🔑 SINGLE SOURCE OF TRUTH KEY
const makeKey = (song, key) =>
    `${(song || "").trim().toLowerCase()}|${(key || "").trim().toLowerCase()}`;

window.loadPerformance = async () => {

    const date = document.getElementById('date').value;
    if (!date) return;

    currentDate = date;

    const container = document.getElementById('content');
    container.innerHTML = "Loading...";

    const eventSnap = await getDocs(collection(db, "events"));

    let rota = null;

    eventSnap.forEach(doc => {
        const ev = doc.data();
        if (ev.date === date && ev.archived !== true) rota = ev;
    });

    if (!rota) {
        container.innerHTML = "No rota found";
        return;
    }

    currentLeader = rota.assignments?.["Worship Leader"]?.name || "";

    const serviceSnap = await getDocs(collection(db, "services"));

    serviceSnap.forEach(doc => {
        const s = doc.data();
        if (s.date === date) currentService = s;
    });

    if (!currentService) {
        container.innerHTML = "No service order";
        return;
    }

    const roleSelect = document.getElementById('role');
    roleSelect.innerHTML = `<option value="">Instrument</option>`;

    Object.keys(rota.assignments || {}).forEach(role => {
        roleSelect.innerHTML += `<option value="${role}">${role}</option>`;
    });

    container.innerHTML = "";
};

window.loadSongsForRole = async () => {

    const role = document.getElementById('role').value;
    if (!role || !currentService) return;

    const container = document.getElementById('content');
    container.innerHTML = "Loading...";

    // 🔥 ONLY GET TODAY'S NOTES
    const q = query(
        collection(db, "schedules"),
        where("date", "==", currentDate),
        where("role", "==", role)
    );

    const snap = await getDocs(q);

    const todayNotes = {};

    snap.forEach(docSnap => {
        const d = docSnap.data();
        const k = makeKey(d.songTitle, d.key);

        todayNotes[k] = {
            notes: d.notes,
            docId: docSnap.id
        };
    });

    container.innerHTML = "";

    for (const item of currentService.order) {

        if (item.type === "item") {
            const div = document.createElement('div');
            div.className = "text-center font-extrabold py-2";
            div.innerText = item.title;
            container.appendChild(div);
            continue;
        }

        const key = item.key || "";
        const k = makeKey(item.title, key);
        const today = todayNotes[k];

        const docId = item.title.toLowerCase().replace(/\s+/g, "-");
        const songSnap = await getDoc(doc(db, "songs", docId));

        let files = [];

        if (songSnap.exists()) {
            const data = songSnap.data();
            files = (data.files || []).filter(f =>
                makeKey("", f.key) === makeKey("", key)
            );
        }

        const div = document.createElement('div');
        div.className = "bg-white p-4 rounded-xl shadow mb-3";

        div.innerHTML = `
            <div class="flex justify-between font-bold cursor-pointer">
                <span onclick="this.closest('.bg-white').querySelector('.body').classList.toggle('hidden')">
                    ${item.title} (${key})
                </span>
                <button onclick="mini(this)">_</button>
            </div>

            <div class="body hidden mt-2">

                ${files.map(f => `
                    <button onclick="openPDF('${f.url}')"
                    class="bg-blue-600 text-white px-2 py-1 text-xs mr-1">
                    PDF
                    </button>
                `).join("")}

                <textarea
                    oninput="grow(this)"
                    class="w-full p-2 mt-2 bg-gray-100"
                    data-song="${item.title}"
                    data-key="${key}"
                    data-docid="${today ? today.docId : ""}"
                >${today ? today.notes : ""}</textarea>

                <button onclick="saveNote('${item.title}','${key}')"
                class="bg-green-600 text-white px-3 py-1 mt-2">
                Save
                </button>

            </div>
        `;

        container.appendChild(div);
    }
};

window.grow = (el) => {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
};

window.mini = (btn) => {
    const card = btn.closest('.bg-white');
    card.classList.toggle("minimal");
};

window.openPDF = (url) => {
    const viewer = document.getElementById("pdfViewer");
    viewer.innerHTML = `
        <button onclick="closePDF()" style="position:absolute;top:10px;right:10px;background:black;color:white;padding:10px;">Close</button>
        <iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>
    `;
    viewer.style.display = "block";
};

window.closePDF = () => {
    const viewer = document.getElementById("pdfViewer");
    viewer.style.display = "none";
    viewer.innerHTML = "";
};

window.saveNote = async (song, key) => {

    const role = document.getElementById('role').value;

    const textarea = document.querySelector(`[data-song="${song}"][data-key="${key}"]`);
    const note = textarea.value;
    const docId = textarea.dataset.docid;

    if (!note) return;

    if (docId) {
        await updateDoc(doc(db, "schedules", docId), { notes: note });
    } else {
        const newDoc = await addDoc(collection(db, "schedules"), {
            date: currentDate,
            worshipLeader: currentLeader,
            role,
            songTitle: song,
            key,
            notes: note
        });

        textarea.dataset.docid = newDoc.id;
    }

    alert("Saved");
};
</script>
</head>

<body class="p-6 bg-gray-100">

<div id="pdfViewer"></div>

<input type="date" id="date" onchange="loadPerformance()" class="w-full p-2 mb-2">
<select id="role" onchange="loadSongsForRole()" class="w-full p-2 mb-4"></select>

<div id="content"></div>

</body>
</html>
