<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Performance Mode</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: 'Montserrat', sans-serif; }

.screen {
    position: fixed;
    inset: 0;
    background: #0f172a;
    color: white;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

textarea {
    width: 100%;
    font-size: 18pt;
    font-weight: bold;
    background: #020617;
    color: white;
    padding: 14px;
    border-radius: 12px;
}

.performance textarea {
    font-size: 26pt;
    height: 70vh;
}

.smallbox {
    font-size: 12px;
    opacity: 0.7;
}

#menu {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 260px;
    background: #1e293b;
    transform: translateX(-100%);
    transition: 0.3s;
    z-index: 1000;
    overflow-y: auto;
}
#menu.open { transform: translateX(0); }

#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    z-index: 900;
}
#overlay.show { display: block; }

#pdfViewer {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    z-index: 2000;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
 apiKey:"AIzaSy...",
 authDomain:"egbc-worship-planner.firebaseapp.com",
 projectId:"egbc-worship-planner"
});
const db = getFirestore(app);

let currentService=null, songs=[], index=0;
let currentRole="", currentDate="", currentLeader="";
let selectedKeys=[], performance=false, currentDocId=null;

/* ---------- MENU ---------- */
window.toggleMenu = ()=>{
 document.getElementById("menu").classList.toggle("open");
 document.getElementById("overlay").classList.toggle("show");
};

window.closeMenu = ()=>{
 document.getElementById("menu").classList.remove("open");
 document.getElementById("overlay").classList.remove("show");
};

/* ---------- LOAD ---------- */
window.loadService = async ()=>{

 currentDate = document.getElementById("dateInput").value;
 currentRole = document.getElementById("roleSelect").value;

 const snap = await getDocs(query(collection(db,"services"), where("date","==",currentDate)));
 currentService = snap.docs[0].data();

 songs = currentService.order.filter(x=>x.type==="song");

 buildMenu();
 showSong(0);

 document.getElementById("startScreen").style.display="none";
};

/* ---------- MENU BUILD ---------- */
function buildMenu(){
 const menu=document.getElementById("menu");
 menu.innerHTML="";
 songs.forEach((s,i)=>{
  menu.innerHTML+=`<div data-i="${i}" class="menuItem" style="padding:14px;border-bottom:1px solid #334155">${s.title}</div>`;
 });

 // FIX: proper event binding
 document.querySelectorAll(".menuItem").forEach(el=>{
  el.onclick = ()=>{
    showSong(parseInt(el.dataset.i));
    closeMenu();
  };
 });
}

/* ---------- SONG ---------- */
window.showSong = async function(i){

 index=i;
 const s=songs[i];

 // ONLY reset keys first time
 if(!selectedKeys.length){
  selectedKeys=[...(s.keys||[])];
 }

 const songDoc=await getDoc(doc(db,"songs",s.title.toLowerCase().replace(/\s+/g,"-")));
 const data=songDoc.exists()?songDoc.data():{};
 const allFiles=data.files||[];

 const files=allFiles.filter(f=>selectedKeys.includes(f.key));

 let yourNotes=s.notes||"";
 currentDocId=null;

 // TODAY NOTES
 const todaySnap=await getDocs(query(collection(db,"schedules"),
  where("date","==",currentDate),
  where("role","==",currentRole)));

 todaySnap.forEach(d=>{
  const n=d.data();
  if(n.songTitle===s.title){
   yourNotes=n.notes;
   currentDocId=d.id;
  }
 });

 // LAST NOTES FIXED
 const allSnap=await getDocs(collection(db,"schedules"));
 let last=null;

 allSnap.forEach(d=>{
  const n=d.data();

  if(
   n.worshipLeader===currentLeader &&
   n.role===currentRole &&
   n.songTitle===s.title &&
   n.date !== currentDate
  ){
   if(!last || new Date(n.date) > new Date(last.date)){
    last=n;
   }
  }
 });

 const roleNotes = currentService.roleNotes?.[currentRole] || "";

 document.getElementById("app").innerHTML=`
 <div class="screen ${performance?'performance':''}">

  <div class="flex justify-between">
   <button onclick="toggleMenu()">☰</button>
   <div>${s.title}</div>
   <div>
    <button onclick="prev()">⬅</button>
    <button onclick="next()">➡</button>
   </div>
  </div>

  <button onclick="togglePerformance()">Toggle Mode</button>

  <div>
   ${selectedKeys.map(k=>`
    <label>
     <input type="checkbox" checked onchange="toggleKey('${k}',this.checked)"> ${k}
    </label>`).join("")}
  </div>

  <div>
   ${files.map(f=>`
    <button onclick="openPDF('${f.url}')">${f.type} (${f.key})</button>
   `).join("")}
  </div>

  <textarea id="notes">${yourNotes}</textarea>

  <div class="smallbox"><b>Instrument Notes:</b><br>${roleNotes}</div>
  <div class="smallbox"><b>Last Time:</b><br>${last?last.notes:""}</div>

  <button onclick="save('${s.title}')">Save</button>

 </div>`;
};

/* ---------- KEY FIX ---------- */
window.toggleKey=(k,on)=>{
 if(on){
  if(!selectedKeys.includes(k)) selectedKeys.push(k);
 } else {
  selectedKeys = selectedKeys.filter(x=>x!==k);
 }
 showSong(index);
};

/* ---------- NAV ---------- */
window.next=()=>{ if(index<songs.length-1) showSong(index+1); };
window.prev=()=>{ if(index>0) showSong(index-1); };

/* ---------- PDF ---------- */
window.openPDF=(url)=>{
 if(url.includes("drive")){
  const m=url.match(/\/d\/(.*?)\//);
  if(m) url=`https://drive.google.com/file/d/${m[1]}/preview`;
 }

 const v=document.getElementById("pdfViewer");
 v.innerHTML=`<button onclick="closePDF()">Close</button><iframe src="${url}" style="width:100%;height:100%"></iframe>`;
 v.style.display="block";
};

window.closePDF=()=>document.getElementById("pdfViewer").style.display="none";

/* ---------- SAVE ---------- */
window.save=async(song)=>{
 const txt=document.getElementById("notes").value;

 if(currentDocId){
  await updateDoc(doc(db,"schedules",currentDocId),{notes:txt});
 } else {
  await addDoc(collection(db,"schedules"),{
   date:currentDate,
   role:currentRole,
   worshipLeader:currentLeader,
   songTitle:song,
   notes:txt
  });
 }

 alert("Saved");
};
</script>
</head>

<body>

<div id="startScreen" class="p-6">
<input type="date" id="dateInput">
<select id="roleSelect"></select>
<button onclick="loadService()">Load</button>
</div>

<div id="menu"></div>
<div id="overlay" onclick="closeMenu()"></div>
<div id="pdfViewer"></div>
<div id="app"></div>

</body>
</html>
