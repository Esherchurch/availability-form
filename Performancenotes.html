    background: #020617;
    color: white;

    box-sizing: border-box;

/* Dictation active - pulse the textarea border */

    color: white;
    border-color: #ef4444;

    inset: 0;

    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }

    100% { transform: scale(2); opacity: 0; }

    left: 50%;

    color: white;

    border-radius: 20px;

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
 apiKey:"AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
 authDomain:"egbc-worship-planner.firebaseapp.com",
 projectId:"egbc-worship-planner"
});
const db = getFirestore(app);

let eventsForDay = [];
let selectedEvent = null;
let currentService = null;
let songs = [];
let index = 0;
let currentRole = "";
let currentDate = "";
let currentLeader = "";
let selectedKeys = [];
let performance = false;
let currentDocId = null;
let wakeLock = null;
let originalData = { notes: "", inst: "", last: "" };

// ── DICTATION STATE ──────────────────────────────────────────────────────────
let recognition = null;
let isDictating = false;
let dictationBuffer = "";       // accumulates confirmed words this session
let noiseWarningTimer = null;

// Words that speech engines hallucinate when hearing music/noise
// — common phantom words from drums, reverb, crowd, singing harmonics
const NOISE_BLACKLIST = new Set([
    "the","a","an","and","or","but","so","um","uh","hmm","hm","mm","like",
    "you know","i mean","actually","basically","literally","right","okay","ok",
    "yeah","yes","no","well","anyway","so yeah","huh","ah","oh","eh",
    "thank you","thanks","bye","goodbye","welcome","hello","hi",
    // Common music-triggered phantoms
    "music","song","singing","play","playing","band","worship",
    "lord","god","jesus","hallelujah","amen","praise",
    // Single stray letters/numbers that are almost always noise
]);

// Minimum word count for a result to be treated as intentional speech
const MIN_WORDS = 2;
// Minimum confidence score (0–1). Below this we discard the result.
// 0.6 is aggressive but appropriate for a noisy music environment.
const MIN_CONFIDENCE = 0.55;
// If a result is ONLY blacklisted words, discard it
function isLikelyNoise(text) {
    const words = text.toLowerCase().trim().split(/\s+/);
    if (words.length < MIN_WORDS) return true;
    const nonBlacklisted = words.filter(w => !NOISE_BLACKLIST.has(w));
    // If >80% of words are blacklisted, treat as noise
    if (nonBlacklisted.length / words.length < 0.2) return true;
    return false;
}

function showNoiseWarning(text) {
    const toast = document.getElementById('noise-toast');
    if (!toast) return;
    toast.innerText = `🔇 Filtered (noise): "${text.slice(0,40)}${text.length>40?'…':''}"`;
    toast.style.display = 'block';
    clearTimeout(noiseWarningTimer);
    noiseWarningTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
}

function updateDictatePreview(text) {
    const el = document.getElementById('dictate-preview');
    if (!el) return;
    if (text) {
        el.innerText = `🎤 ${text}`;
        el.style.display = 'block';
    } else {
        el.style.display = 'none';
    }
}

window.toggleDictation = () => {
    if (isDictating) {
        stopDictation();
    } else {
        startDictation();
    }
};

function startDictation() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Speech recognition isn't supported in this browser. Try Chrome or Safari.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;       // keep listening until explicitly stopped
    recognition.interimResults = true;   // show in-progress text as preview
    recognition.lang = 'en-GB';          // British English for EGBC
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        isDictating = true;
        const btn = document.getElementById('dictate-btn');
        const ta = document.getElementById('notes');
        if (btn) { btn.classList.add('listening'); btn.innerText = '⏹ Stop'; }
        if (ta) ta.classList.add('dictating');
        dictationBuffer = "";
    };

    recognition.onresult = (event) => {
        let interimText = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            const transcript = result[0].transcript.trim();
            const confidence = result[0].confidence;

            if (result.isFinal) {
                // ── NOISE FILTERING ──────────────────────────────────────────
                // 1. Confidence filter — discard if too uncertain
                //    (confidence is 0 in some browsers even for good results,
                //     so we only reject if it's explicitly low, not if it's 0)
                if (confidence > 0 && confidence < MIN_CONFIDENCE) {
                    showNoiseWarning(transcript);
                    continue;
                }
                // 2. Content filter — discard if it looks like ambient noise
                if (isLikelyNoise(transcript)) {
                    showNoiseWarning(transcript);
                    continue;
                }
                // ── ACCEPTED — append to notes ───────────────────────────────
                dictationBuffer += (dictationBuffer ? " " : "") + transcript;
                const ta = document.getElementById('notes');
                if (ta) {
                    const sep = ta.value && !ta.value.endsWith('\n') ? " " : "";
                    ta.value += sep + transcript;
                    window.autoGrow(ta);
                }
                updateDictatePreview("");
            } else {
                // Interim: show as live preview only, don't commit yet
                interimText = transcript;
            }
        }

        if (interimText) updateDictatePreview(interimText);
    };

    recognition.onerror = (event) => {
        // "no-speech" and "audio-capture" are expected in noisy environments
        if (event.error === 'no-speech') return; // just keep listening
        if (event.error === 'aborted') return;   // we stopped it ourselves
        // For other errors, show briefly but don't crash
        console.warn('Speech recognition error:', event.error);
        if (event.error === 'not-allowed') {
            alert("Microphone permission denied. Please allow microphone access and try again.");
            stopDictation();
        }
    };

    recognition.onend = () => {
        // Auto-restart if we're still supposed to be dictating
        // (browser stops after silence/noise — we want continuous)
        if (isDictating) {
            try { recognition.start(); } catch(e) { /* already started */ }
        } else {
            updateDictatePreview("");
            const btn = document.getElementById('dictate-btn');
            const ta = document.getElementById('notes');
            if (btn) { btn.classList.remove('listening'); btn.innerText = '🎤 Dictate'; }
            if (ta) ta.classList.remove('dictating');
        }
    };

    try {
        recognition.start();
    } catch(e) {
        console.error('Could not start recognition:', e);
    }
}

function stopDictation() {
    isDictating = false;
    if (recognition) {
        try { recognition.stop(); } catch(e) {}
        recognition = null;
    }
    updateDictatePreview("");
    const btn = document.getElementById('dictate-btn');
    const ta = document.getElementById('notes');
    if (btn) { btn.classList.remove('listening'); btn.innerText = '🎤 Dictate'; }
    if (ta) ta.classList.remove('dictating');
    const toast = document.getElementById('noise-toast');
    if (toast) toast.style.display = 'none';
}
// ── END DICTATION ────────────────────────────────────────────────────────────

const dateInput = () => document.getElementById('dateInput');
const serviceSelect = () => document.getElementById('serviceSelect');
const roleSelect = () => document.getElementById('roleSelect');
const appDiv = () => document.getElementById('app');

const requestWakeLock = async () => {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    console.error(`${err.name}, ${err.message}`);
  }
};

document.addEventListener('visibilitychange', async () => {
  if (wakeLock !== null && document.visibilityState === 'visible') {
    await requestWakeLock();
  }
});

window.goFull = () => {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) docEl.requestFullscreen();
    else if (docEl.mozRequestFullScreen) docEl.mozRequestFullScreen();
    else if (docEl.webkitRequestFullScreen) docEl.webkitRequestFullScreen();
    else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
    requestWakeLock();
    document.getElementById("fsToggle").innerText = "[ Stay Awake Active ]";
};

window.autoGrow = (el)=>{
 if(!el) return;
 el.style.height = "auto";
 el.style.height = el.scrollHeight + "px";
};

window.translateAll = async (targetLang) => {
    const mainEl = document.getElementById('notes');
    const instEl = document.getElementById('instNotesText');
    const lastEl = document.getElementById('lastNotesText');

    if(targetLang === 'revert') {
        if(mainEl) mainEl.value = originalData.notes;
        if(instEl) instEl.innerText = originalData.inst;
        if(lastEl) lastEl.innerText = originalData.last;
        autoGrow(mainEl);
        return;
    }

    const translateChunk = async (text) => {
        if(!text || text.trim() === "") return "";
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            let result = "";
            data[0].forEach(item => { if (item[0]) result += item[0]; });
            return result;
        } catch (e) { return text; }
    };

    if(mainEl) mainEl.value = await translateChunk(mainEl.value);
    if(instEl) instEl.innerText = await translateChunk(instEl.innerText);
    if(lastEl) lastEl.innerText = await translateChunk(lastEl.innerText);
    autoGrow(mainEl);
};

window.loadRota = async () => {
 const date = dateInput().value;
 const snap = await getDocs(collection(db,"events"));
 eventsForDay = [];
 // Show all events for the date — archived flag only affects availability view
 snap.forEach(d=>{
  const ev=d.data();
  if(ev.date===date){ eventsForDay.push(ev); }
 });
 serviceSelect().innerHTML='<option value="">Select Service</option>';
 eventsForDay.forEach((ev,i)=>{
  serviceSelect().innerHTML+=`<option value="${i}">${ev.type}</option>`;
 });
};

window.selectService = () => {
 const i = serviceSelect().value;
 if(i==="") return;
 selectedEvent = eventsForDay[i];
 currentLeader = selectedEvent.assignments?.["Worship Leader"]?.name || "";
 roleSelect().innerHTML='<option value="">Instrument</option>';
 Object.keys(selectedEvent.assignments || {}).forEach(r=>{
  roleSelect().innerHTML+=`<option>${r}</option>`;
 });
};

window.cacheAllPDFs = async () => {
    for (const song of songs) {
        const songDoc = await getDoc(doc(db,"songs",song.title.toLowerCase().replace(/\s+/g,"-")));
        if (songDoc.exists()) {
            const data = songDoc.data();
            const songKeys = song.keys || [];
            const filesToCache = (data.files || []).filter(f => songKeys.includes(f.key));
            filesToCache.forEach(f => {
                const img = new Image();
                img.src = f.url; 
            });
        }
    }
};

window.loadService = async () => {
 currentDate = dateInput().value;
 currentRole = roleSelect().value;
 const snap = await getDocs(query(collection(db,"services"), where("date","==",currentDate)));
 currentService = snap.docs[0].data();
 songs = currentService.order.filter(x=>x.type==="song");
 buildMenu();
 showSong(0);
 window.cacheAllPDFs(); 
 document.getElementById("startScreen").style.display="none";
 document.getElementById("fsToggle").style.display="block";
};

function buildMenu(){
 const menu = document.getElementById("menu");
 menu.innerHTML="";
 songs.forEach((s,i)=>{
  const div=document.createElement("div");
  div.innerText=s.title;
  div.onclick=()=>{ showSong(i); toggleMenu(); };
  menu.appendChild(div);
 });
}

window.toggleMenu = ()=>{
 document.getElementById("menu").classList.toggle("open");
 document.getElementById("overlay").classList.toggle("show");
};

window.closeMenu = ()=>{
 document.getElementById("menu").classList.remove("open");
 document.getElementById("overlay").classList.remove("show");
};

window.togglePerformance = ()=>{
 // Stop dictation when switching modes
 if (isDictating) stopDictation();
 performance = !performance;
 showSong(index);
};

window.forceExternalYT = (url) => {
    let videoId = '';
    if (url.includes('v=')) {
        videoId = url.split('v=')[1].split('&')[0];
    } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1];
    }
    if (videoId) {
        const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
        const v = document.getElementById("pdfViewer");
        v.innerHTML = ""; 
        v.style.display = "block";
        const closeBtn = document.createElement("button");
        closeBtn.className = "closeBtn";
        closeBtn.innerText = "Close Video";
        closeBtn.onclick = closePDF;
        const iframe = document.createElement("iframe");
        iframe.style.cssText = "width:100%;height:100%;border:none;background:black;";
        iframe.src = embedUrl;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture";
        iframe.allowFullscreen = true;
        v.appendChild(closeBtn);
        v.appendChild(iframe);
    }
};

async function showSong(i){
 // Stop any active dictation when navigating songs
 if (isDictating) stopDictation();

 index = i;
 const s = songs[i];
 selectedKeys = [...(s.keys || [])];

 const songDoc = await getDoc(doc(db,"songs",s.title.toLowerCase().replace(/\s+/g,"-")));
 const data = songDoc.exists()?songDoc.data():{};
 const allFiles = data.files || [];
 const youtubeUrl = data.youtube || "";

 const isKeyboardRole = ["Keyboard", "Keys", "2nd Keys"].includes(currentRole);
 let playthroughMatches = [];
 if (isKeyboardRole && selectedKeys.length > 0) {
   try {
     const ptSnap = await getDocs(collection(db, "kb_playthrough"));
     const seen = new Set();
     ptSnap.forEach(ptDoc => {
       const pt = ptDoc.data();
       if (!pt.published) return;
       const ptSong = (pt.songTitle || pt.title || '').toLowerCase().trim();
       const titleNorm = s.title.toLowerCase().trim();
       const songMatch = ptSong === titleNorm || ptSong.includes(titleNorm) || titleNorm.includes(ptSong);
       if (!songMatch) return;
       selectedKeys.forEach(k => {
         if ((pt.ourKey || '').toLowerCase() === k.toLowerCase()) {
           const uid = ptDoc.id + k;
           if (!seen.has(uid)) { seen.add(uid); playthroughMatches.push({ ...pt }); }
         }
       });
     });
   } catch(e) { console.log('PT lookup:', e.message); }
 }

 const files = allFiles.filter(f=>selectedKeys.includes(f.key));

 let yourNotes = s.notes || "";
 currentDocId = null;

 const todaySnap = await getDocs(query(collection(db,"schedules"),
  where("date","==",currentDate),
  where("role","==",currentRole)));

 todaySnap.forEach(d=>{
  const n=d.data();
  if(n.songTitle===s.title){ yourNotes = n.notes; currentDocId = d.id; }
 });

 const allSnap = await getDocs(collection(db,"schedules"));
 let last = null;
 allSnap.forEach(d=>{
  const n=d.data();
  if(n.worshipLeader===currentLeader &&
     n.role===currentRole &&
     n.songTitle===s.title &&
     n.date!==currentDate){
   if(!last || new Date(n.date)>new Date(last.date)) last=n;
  }
 });

 const roleNotes = currentService?.roleNotes?.[currentRole] || "";
 originalData = { notes: yourNotes, inst: roleNotes, last: last?last.notes:"" };

 appDiv().innerHTML=`
 <div class="screen ${performance?'performance':''}">

  <div style="display:flex;justify-content:space-between;align-items:center;">
   <button class="btn hide-perf" onclick="toggleMenu()">☰</button>
   <div style="font-weight:800; font-size:1.1rem; text-align:center; flex:1;">${s.title}</div>
   <div style="display:flex; gap:8px; align-items:center;">
    ${youtubeUrl ? `<button class="nav-btn hide-perf" onclick="forceExternalYT('${youtubeUrl}')" style="background:#ff0000; padding: 10px 15px;">YT</button>` : ''}

    ${playthroughMatches.map(pt => {
      const ptUrl = `https://esherchurch.github.io/availability-form/EGBC-PlayThrough.html?song=${encodeURIComponent(pt.songTitle || pt.title)}&key=${encodeURIComponent(pt.ourKey)}`;
      const label = pt.instrument ? `▶ ${pt.ourKey} (${pt.instrument})` : `▶ ${pt.ourKey}`;
      return `<button class="nav-btn hide-perf" onclick="openPDF('${ptUrl}')" style="background:#7c3aed; padding: 10px 15px; font-size:12px;">${label}</button>`;
    }).join('')}
    
    <div class="translate-box hide-perf">
        <button class="nav-btn" style="background:#475569; padding: 10px 15px; font-size:14px;">A/ES</button>
        <div class="translate-content">
            <div onclick="translateAll('es')">English → Spanish</div>
            <div onclick="translateAll('en')">Spanish → English</div>
            <div onclick="translateAll('revert')" style="background:#334155">Original Text</div>
        </div>
    </div>

    <button class="nav-btn" onclick="prev()">⬅</button>
    <button class="nav-btn" onclick="next()">➡</button>
   </div>
  </div>

  <div class="perf-row">
    <button class="btn ${performance ? 'btn-sm' : ''}" onclick="togglePerformance()">
     ${performance ? "Edit" : "Performance Mode"}
    </button>

    ${performance ? files.map(f=>`
      <button class="btn btn-sm" onclick="openPDF('${f.url}')">
       ${f.type} (${f.key})
      </button>
    `).join("") : ""}
  </div>

  <div class="hide-perf">
   ${[...new Set(allFiles.map(f=>f.key).filter(Boolean))].map(k=>`
    <label>
     <input type="checkbox" ${selectedKeys.includes(k)?"checked":""}
     onchange="toggleKey('${k}',this.checked)"> ${k}
    </label>`).join("")}
  </div>

  <div class="hide-perf">
   ${files.map(f=>`
    <button class="btn" onclick="openPDF('${f.url}')">
     ${f.type} (${f.key})
    </button>
   `).join("")}
  </div>

  <textarea id="notes" oninput="autoGrow(this)">${yourNotes}</textarea>

  ${!performance ? `
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <button id="dictate-btn" class="btn btn-dictate" onclick="toggleDictation()" style="font-size:14px; padding:10px 16px; flex-shrink:0;">🎤 Dictate</button>
      <span style="font-size:11px; color:#475569; font-weight:700;">Tap to dictate notes — filtered for noisy environments</span>
    </div>
    <div class="smallbox"><b>Instrument Notes:</b><br><span id="instNotesText">${roleNotes}</span></div>
    <div class="smallbox"><b>Last Time:</b><br><span id="lastNotesText">${last?last.notes:""}</span></div>
    <button class="btn" onclick="save('${s.title}')">Save</button>
  ` : ""}

 </div>`;

 setTimeout(()=>{
  const ta = document.getElementById("notes");
  if(ta) autoGrow(ta);
 },50);
}

window.toggleKey=(k,on)=>{
 if(on){ if(!selectedKeys.includes(k)) selectedKeys.push(k); }
 else { selectedKeys = selectedKeys.filter(x=>x!==k); }
 const songIndex = songs.findIndex(s => s.title === songs[index].title);
 if (songIndex !== -1) songs[songIndex].keys = selectedKeys;
 showSong(index);
};

window.next = ()=>{ if(index<songs.length-1) showSong(index+1); };
window.prev = ()=>{ if(index>0) showSong(index-1); };

window.openPDF = (url)=>{
 let finalUrl = url;
 const timestamp = new Date().getTime();
 if(url.includes("drive.google.com") || url.includes("firebasestorage.googleapis.com")){
  finalUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true&cb=${timestamp}`;
 }
 const v=document.getElementById("pdfViewer");
 v.innerHTML = ""; 
 v.style.display="block";
 const loader = document.createElement("div");
 loader.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:black;font-weight:bold;";
 loader.innerText = "Loading PDF...";
 const closeBtn = document.createElement("button");
 closeBtn.className = "closeBtn";
 closeBtn.innerText = "Close";
 closeBtn.onclick = closePDF;
 const iframe = document.createElement("iframe");
 iframe.style.cssText = "width:100%;height:100%;border:none;background:white;display:none;";
 iframe.src = finalUrl;
 iframe.onload = () => { loader.style.display = "none"; iframe.style.display = "block"; };
 v.appendChild(closeBtn);
 v.appendChild(loader);
 v.appendChild(iframe);
};

window.closePDF = ()=>{
 const v=document.getElementById("pdfViewer");
 v.style.display="none";
 v.innerHTML=""; 
};

window.save = async(song)=>{
 // Stop dictation before saving
 if (isDictating) stopDictation();
 const txt = document.getElementById("notes").value;
 if(currentDocId){
  await updateDoc(doc(db,"schedules",currentDocId), { notes: txt });
 } else {
  const newDoc = await addDoc(collection(db,"schedules"),{
   date: currentDate,
   role: currentRole,
   worshipLeader: currentLeader,
   songTitle: song,
   notes: txt
  });
  currentDocId = newDoc.id;
 }
 alert("Saved");
};
</script>
</head>

<body>

<!-- Dictation UI overlays (always in DOM, shown/hidden by JS) -->
<div id="dictate-preview"></div>
<div id="noise-toast"></div>

<div id="startScreen" class="max-w-xl mx-auto p-6 space-y-4">
<h1 class="text-2xl font-extrabold text-[#2c6999]">Performance Notes</h1>

<div class="relative">
    <div id="dateLabel" style="position:absolute; left:12px; top:12px; color:#64748b; pointer-events:none;">Date</div>
    <input type="date" id="dateInput" onfocus="document.getElementById('dateLabel').style.display='none'" onblur="if(!this.value)document.getElementById('dateLabel').style.display='block'" onchange="loadRota()" class="w-full p-3 rounded-xl">
</div>

<select id="serviceSelect" onchange="selectService()" class="w-full p-3 rounded-xl">
<option>Select Service</option>
</select>

<select id="roleSelect" class="w-full p-3 rounded-xl">
<option>Instrument</option>
</select>

<button onclick="loadService()" class="w-full bg-[#2c6999] text-white p-3 rounded-xl font-bold">
Load Service
</button>
</div>

<button id="fsToggle" style="display:none;" onclick="goFull()">[ Fullscreen ]</button>

<div id="menu"></div>
<div id="overlay" onclick="closeMenu()"></div>
<div id="pdfViewer"></div>
<div id="app"></div>

</body>
</html>
