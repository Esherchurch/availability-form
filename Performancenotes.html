<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EGBC Performance Mode</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: 'Montserrat', sans-serif; }

/* MAIN SCREEN */
.screen {
    position: fixed;
    inset: 0;
    background: #0f172a;
    color: white;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* NOTES */
textarea {
    width: 100%;
    font-size: 18pt;
    font-weight: bold;
    background: #020617;
    color: white;
    padding: 14px;
    border-radius: 12px;
    resize: none;
}

.performance textarea {
    font-size: 26pt;
    height: 70vh;
}

/* SMALL TEXT */
.smallbox {
    font-size: 12px;
    opacity: 0.7;
}

/* MENU */
#menu {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 260px;
    background: #1e293b;
    transform: translateX(-100%);
    transition: 0.3s;
    z-index: 1000;
}
#menu.open { transform: translateX(0); }

/* OVERLAY (for menu click outside) */
#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    z-index: 900;
}
#overlay.show { display: block; }

/* PDF VIEWER */
#pdfViewer {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    z-index: 2000;
}

#pdfViewer iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.closeBtn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: white;
    color: black;
    padding: 12px 16px;
    border-radius: 10px;
    font-weight: bold;
    z-index: 2100;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
 apiKey:"AIzaSy...",
 authDomain:"egbc-worship-planner.firebaseapp.com",
 projectId:"egbc-worship-planner"
});
const db = getFirestore(app);

let eventsForDay=[], selectedEvent=null, currentService=null;
let songs=[], index=0;
let currentRole="", currentDate="", currentLeader="";
let selectedKeys=[], performance=false, currentDocId=null;

/* ---------- MENU ---------- */
window.toggleMenu = ()=>{
 document.getElementById("menu").classList.toggle("open");
 document.getElementById("overlay").classList.toggle("show");
};

window.closeMenu = ()=>{
 document.getElementById("menu").classList.remove("open");
 document.getElementById("overlay").classList.remove("show");
};

/* ---------- LOAD ---------- */
window.loadRota = async ()=>{
 const date = dateInput.value;
 const snap = await getDocs(collection(db,"events"));
 eventsForDay=[];

 snap.forEach(d=>{
  const ev=d.data();
  if(ev.date===date && ev.archived!==true) eventsForDay.push(ev);
 });

 serviceSelect.innerHTML='<option>Select Service</option>';
 eventsForDay.forEach((ev,i)=>{
  serviceSelect.innerHTML+=`<option value="${i}">${ev.type}</option>`;
 });
};

window.selectService = ()=>{
 const i=serviceSelect.value;
 if(i==="") return;

 selectedEvent = eventsForDay[i];
 currentLeader = selectedEvent.assignments?.["Worship Leader"]?.name || "";

 roleSelect.innerHTML='<option>Instrument</option>';
 Object.keys(selectedEvent.assignments||{}).forEach(r=>{
  roleSelect.innerHTML+=`<option>${r}</option>`;
 });
};

window.loadService = async ()=>{
 currentDate=dateInput.value;
 currentRole=roleSelect.value;

 const snap=await getDocs(query(collection(db,"services"), where("date","==",currentDate)));
 currentService=snap.docs[0].data();

 songs=currentService.order.filter(x=>x.type==="song");

 buildMenu();
 showSong(0);
 startScreen.style.display="none";
};

/* ---------- MENU BUILD ---------- */
function buildMenu(){
 menu.innerHTML="";
 songs.forEach((s,i)=>{
  menu.innerHTML+=`<div onclick="showSong(${i});closeMenu()" style="padding:14px;border-bottom:1px solid #334155">${s.title}</div>`;
 });
}

/* ---------- SONG ---------- */
async function showSong(i){

 index=i;
 const s=songs[i];
 selectedKeys=[...(s.keys||[])];

 const songDoc=await getDoc(doc(db,"songs",s.title.toLowerCase().replace(/\s+/g,"-")));
 const data=songDoc.exists()?songDoc.data():{};
 const allFiles=data.files||[];

 const filteredFiles=allFiles.filter(f=>selectedKeys.includes(f.key));

 let yourNotes=s.notes||"";
 currentDocId=null;

 const snap=await getDocs(query(collection(db,"schedules"),
  where("date","==",currentDate),
  where("role","==",currentRole)));

 snap.forEach(d=>{
  const n=d.data();
  if(n.songTitle===s.title){
   yourNotes=n.notes;
   currentDocId=d.id;
  }
 });

 const roleNotes=currentService.roleNotes?.[currentRole]||"";

 app.innerHTML=`
 <div class="screen ${performance?'performance':''}">

  <div class="flex justify-between items-center">
   <button onclick="toggleMenu()">☰</button>
   <div class="font-bold">${s.title}</div>
   <div>
    <button onclick="prev()">⬅</button>
    <button onclick="next()">➡</button>
   </div>
  </div>

  <button onclick="togglePerformance()">Toggle Mode</button>

  <div>
   ${selectedKeys.map(k=>`
    <label>
     <input type="checkbox" checked onchange="toggleKey('${k}',this.checked)"> ${k}
    </label>`).join("")}
  </div>

  <div>
   ${filteredFiles.map(f=>`
    <button onclick="openPDF('${f.url}')"
    style="padding:12px;margin:6px;background:#22c55e;border-radius:10px;">
    ${f.type} (${f.key})
    </button>`).join("")}
  </div>

  <textarea id="notes">${yourNotes}</textarea>

  ${!performance?`
    <div class="smallbox"><b>Instrument Notes:</b><br>${roleNotes}</div>
  `:""}

  <button onclick="save('${s.title}')">Save</button>

 </div>`;
}

/* ---------- KEYS ---------- */
window.toggleKey=(k,on)=>{
 if(on){ selectedKeys.push(k); }
 else{ selectedKeys=selectedKeys.filter(x=>x!==k); }
 showSong(index);
};

/* ---------- NAV ---------- */
window.next=()=>{ if(index<songs.length-1) showSong(index+1); };
window.prev=()=>{ if(index>0) showSong(index-1); };

/* ---------- PDF ---------- */
window.openPDF=(url)=>{
 if(url.includes("drive")){
  const m=url.match(/\/d\/(.*?)\//);
  if(m) url=`https://drive.google.com/file/d/${m[1]}/preview`;
 }

 pdfViewer.innerHTML=`
  <button class="closeBtn" onclick="closePDF()">Close</button>
  <iframe src="${url}"></iframe>
 `;
 pdfViewer.style.display="block";
};

window.closePDF=()=>{
 pdfViewer.style.display="none";
 pdfViewer.innerHTML="";
};

/* ---------- SAVE ---------- */
window.save=async(song)=>{
 const txt=document.getElementById("notes").value;

 if(currentDocId){
  await updateDoc(doc(db,"schedules",currentDocId),{notes:txt});
 } else {
  const d=await addDoc(collection(db,"schedules"),{
   date:currentDate,
   role:currentRole,
   worshipLeader:currentLeader,
   songTitle:song,
   notes:txt
  });
  currentDocId=d.id;
 }

 alert("Saved");
};
</script>
</head>

<body>

<div id="startScreen" class="p-6 space-y-4 max-w-xl mx-auto">
<h1 class="text-2xl font-extrabold text-[#2c6999]">Performance Mode</h1>

<input type="date" id="dateInput" onchange="loadRota()" class="w-full p-3 rounded-xl">
<select id="serviceSelect" onchange="selectService()" class="w-full p-3 rounded-xl"></select>
<select id="roleSelect" class="w-full p-3 rounded-xl"></select>

<button onclick="loadService()" class="w-full bg-[#2c6999] text-white p-3 rounded-xl">
Load Service
</button>
</div>

<div id="menu"></div>
<div id="overlay" onclick="closeMenu()"></div>
<div id="pdfViewer"></div>
<div id="app"></div>

</body>
</html>
