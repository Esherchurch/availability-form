<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Performance Mode</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: 'Montserrat', sans-serif; }

.screen {
    position: fixed;
    inset: 0;
    background: #0f172a;
    color: white;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* BIGGER + BETTER TEXTAREA */
textarea {
    width: 100%;
    font-size: 24pt;
    font-weight: 700;
    background: #020617;
    color: white;
    padding: 18px;
    border-radius: 16px;
    line-height: 1.5;
    overflow: hidden;
    resize: none;
    min-height: 120px;
}

.performance textarea {
    font-size: 30pt;
}

/* BUTTONS */
.btn {
    background:#2c6999;
    color:white;
    padding:14px 18px;
    border-radius:14px;
    font-weight:700;
}

.nav-btn {
    background:#2c6999;
    padding:14px 20px;
    border-radius:14px;
    font-size:18px;
    font-weight:800;
}

/* MENU */
#menu {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 260px;
    background: #2c6999;
    color: white;
    transform: translateX(-100%);
    transition: 0.3s;
    z-index: 1000;
    overflow-y: auto;
}
#menu.open { transform: translateX(0); }

#menu div {
    padding:16px;
    border-bottom:1px solid rgba(255,255,255,0.2);
    font-weight:700;
    cursor:pointer;
}
#menu div:hover {
    background: rgba(255,255,255,0.2);
}

/* PDF FULLSCREEN IMPROVED */
#pdfViewer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    display: none;
    z-index: 9999;
}

.closeBtn {
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    color:black;
    padding:14px 18px;
    border-radius:10px;
    font-weight:bold;
    z-index:10000;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
 apiKey:"AIzaSy...",
 authDomain:"egbc-worship-planner.firebaseapp.com",
 projectId:"egbc-worship-planner"
});
const db = getFirestore(app);

let eventsForDay = [];
let selectedEvent = null;
let currentService = null;
let songs = [];
let index = 0;
let currentRole = "";
let currentDate = "";
let currentLeader = "";
let selectedKeys = [];
let performance = false;
let currentDocId = null;

const dateInput = () => document.getElementById('dateInput');
const serviceSelect = () => document.getElementById('serviceSelect');
const roleSelect = () => document.getElementById('roleSelect');
const appDiv = () => document.getElementById('app');

/* AUTO GROW TEXTAREA */
window.autoGrow = (el)=>{
 el.style.height = "auto";
 el.style.height = el.scrollHeight + "px";
};

/* LOAD EVENTS */
window.loadRota = async () => {
 const date = dateInput().value;
 const snap = await getDocs(collection(db,"events"));

 eventsForDay = [];
 snap.forEach(d=>{
  const ev=d.data();
  if(ev.date===date && ev.archived!==true){
   eventsForDay.push(ev);
  }
 });

 serviceSelect().innerHTML='<option value="">Select Service</option>';
 eventsForDay.forEach((ev,i)=>{
  serviceSelect().innerHTML+=`<option value="${i}">${ev.type}</option>`;
 });
};

/* SELECT SERVICE */
window.selectService = () => {
 const i = serviceSelect().value;
 if(i==="") return;

 selectedEvent = eventsForDay[i];
 currentLeader = selectedEvent.assignments?.["Worship Leader"]?.name || "";

 roleSelect().innerHTML='<option value="">Instrument</option>';
 Object.keys(selectedEvent.assignments || {}).forEach(r=>{
  roleSelect().innerHTML+=`<option>${r}</option>`;
 });
};

/* LOAD SERVICE */
window.loadService = async () => {
 currentDate = dateInput().value;
 currentRole = roleSelect().value;

 const snap = await getDocs(query(collection(db,"services"), where("date","==",currentDate)));
 currentService = snap.docs[0].data();

 songs = currentService.order.filter(x=>x.type==="song");

 buildMenu();
 showSong(0);

 document.getElementById("startScreen").style.display="none";
};

/* MENU */
function buildMenu(){
 const menu = document.getElementById("menu");
 menu.innerHTML="";
 songs.forEach((s,i)=>{
  const div=document.createElement("div");
  div.innerText=s.title;
  div.onclick=()=>{
    showSong(i);
    toggleMenu();
  };
  menu.appendChild(div);
 });
}

window.toggleMenu = ()=>{
 document.getElementById("menu").classList.toggle("open");
};

/* SHOW SONG */
async function showSong(i){

 index = i;
 const s = songs[i];
 selectedKeys = [...(s.keys || [])];

 const songDoc = await getDoc(doc(db,"songs",s.title.toLowerCase().replace(/\s+/g,"-")));
 const data = songDoc.exists()?songDoc.data():{};
 const allFiles = data.files || [];

 const files = allFiles.filter(f=>selectedKeys.includes(f.key));

 let yourNotes = s.notes || "";

 appDiv().innerHTML=`
 <div class="screen">

  <div style="display:flex;justify-content:space-between;">
   <button class="btn" onclick="toggleMenu()">☰</button>
   <div>${s.title}</div>
   <div>
    <button class="nav-btn" onclick="prev()">⬅</button>
    <button class="nav-btn" onclick="next()">➡</button>
   </div>
  </div>

  <div>
   ${files.map(f=>`
    <button class="btn" onclick="openPDF('${f.url}')">${f.type}</button>
   `).join("")}
  </div>

  <textarea id="notes" oninput="autoGrow(this)">${yourNotes}</textarea>

 </div>`;

 setTimeout(()=>{
   autoGrow(document.getElementById("notes"));
 },50);
}

/* PDF FULLSCREEN */
window.openPDF = (url)=>{
 if(url.includes("drive")){
  const m=url.match(/\/d\/(.*?)\//);
  if(m) url=`https://drive.google.com/file/d/${m[1]}/preview`;
 }

 const v=document.getElementById("pdfViewer");

 v.innerHTML=`
   <button class="closeBtn" onclick="closePDF()">Close</button>
   <iframe src="${url}" style="width:100vw;height:100vh;border:none;"></iframe>
 `;

 v.style.display="block";

 // attempt true fullscreen
 if (v.requestFullscreen) {
   v.requestFullscreen();
 }
};

window.closePDF = ()=>{
 const v=document.getElementById("pdfViewer");
 v.style.display="none";
 v.innerHTML="";
 if (document.fullscreenElement) {
   document.exitFullscreen();
 }
};
</script>
</head>

<body>

<div id="startScreen" class="max-w-xl mx-auto p-6 space-y-4">
<input type="date" id="dateInput" onchange="loadRota()" class="w-full p-3 rounded-xl">
<select id="serviceSelect" onchange="selectService()" class="w-full p-3 rounded-xl"></select>
<select id="roleSelect" class="w-full p-3 rounded-xl"></select>
<button onclick="loadService()" class="w-full bg-[#2c6999] text-white p-3 rounded-xl">Load</button>
</div>

<div id="menu"></div>
<div id="pdfViewer"></div>
<div id="app"></div>

</body>
</html>
