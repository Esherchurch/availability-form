<!DOCTYPE html>
<html>
<head>
<title>Music Upload</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body { font-family: Arial; padding: 40px; }

.dropzone {
    border: 3px dashed #ccc;
    padding: 40px;
    text-align: center;
    border-radius: 20px;
    cursor: pointer;
}

.dropzone.dragover {
    background: #e8f4ff;
}

#suggestions {
    border: 1px solid #ddd;
    max-width: 300px;
}

#suggestions div {
    padding: 5px;
    cursor: pointer;
}

#suggestions div:hover {
    background: #f0f0f0;
}
</style>
</head>

<body>

<h2>Upload Song</h2>

<input id="title" placeholder="Song Title" oninput="suggestSongs()"><br>
<div id="suggestions"></div><br>

<select id="key">
<option value="">Key</option>
<option>C</option><option>C#</option><option>D</option>
<option>Eb</option><option>E</option><option>F</option>
<option>F#</option><option>G</option><option>Ab</option>
<option>A</option><option>Bb</option><option>B</option>
</select><br><br>

<select id="fileType">
<option value="">Select File Type</option>
<option value="Lead Sheet">Lead Sheet</option>
<option value="Chord Sheet">Chord Sheet</option>
<option value="Lyrics">Lyrics</option>
<option value="Bass Tabs">Bass Tabs</option>
</select><br><br>

<input id="youtube" placeholder="YouTube link"><br><br>
<input id="ccli" placeholder="CCLI"><br><br>

<div class="dropzone" id="dropzone">
    Drag & Drop OR Click to Select Files
</div>

<input type="file" id="fileInput" multiple style="display:none">

<ul id="fileList"></ul>

<button onclick="upload()">Upload</button>

<script>

const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner",
    storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);

const storage = firebase.storage();
const db = firebase.firestore();

let files = [];

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

dropzone.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", (e) => {
    files.push(...e.target.files);
    renderFiles();
});

dropzone.addEventListener("dragover", e => {
    e.preventDefault();
});

dropzone.addEventListener("drop", e => {
    e.preventDefault();
    files.push(...e.dataTransfer.files);
    renderFiles();
});

function renderFiles() {
    document.getElementById("fileList").innerHTML =
        files.map(f => `<li>${f.name}</li>`).join("");
}

function normalizeTitle(title) {
    return title.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim();
}

async function suggestSongs() {
    const input = document.getElementById("title").value;
    const norm = normalizeTitle(input);

    if (norm.length < 2) return;

    const snapshot = await db.collection("songs").get();

    const matches = snapshot.docs
        .map(doc => doc.data())
        .filter(song => song.normalized && song.normalized.includes(norm));

    const box = document.getElementById("suggestions");

    box.innerHTML = matches.map(s => `
        <div onclick="selectSuggestion('${s.title}')">
            ${s.title}
        </div>
    `).join("");
}

// =======================
// 🔥 AUTO FILL LOGIC
// =======================

async function selectSuggestion(title) {
    document.getElementById("title").value = title;
    document.getElementById("suggestions").innerHTML = "";

    const docId = title.toLowerCase().replace(/\s+/g, "-");
    const docRef = db.collection("songs").doc(docId);

    const snap = await docRef.get();

    if (snap.exists) {
        const data = snap.data();

        document.getElementById("youtube").value = data.youtube || "";
        document.getElementById("ccli").value = data.ccli || "";
    }

    // ✅ If missing → auto fetch
    autoFillMissing(title);
}

// =======================
// 🎬 YOUTUBE AUTO FETCH
// =======================

async function getYouTube(title) {
    try {
        const query = encodeURIComponent(title + " worship");
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/results?search_query=${query}`);
        return `https://www.youtube.com/results?search_query=${query}`;
    } catch {
        return "";
    }
}

// =======================
// 🎵 SMART CCLI MAP
// =======================

const CCLI_MAP = {
    "waymaker": "7115744",
    "10000 reasons": "6016351",
    "goodness of god": "7117726",
    "living hope": "7106807",
    "oceans": "6428767"
};

function getCCLI(title) {
    const norm = normalizeTitle(title);

    for (const key in CCLI_MAP) {
        if (norm.includes(key)) return CCLI_MAP[key];
    }

    return "";
}

// =======================
// 🚀 AUTO FILL IF EMPTY
// =======================

async function autoFillMissing(title) {

    const ytInput = document.getElementById("youtube");
    const ccliInput = document.getElementById("ccli");

    if (!ytInput.value) {
        ytInput.value = await getYouTube(title);
    }

    if (!ccliInput.value) {
        ccliInput.value = getCCLI(title);
    }
}

// =======================
// UPLOAD
// =======================

async function upload() {

    const title = document.getElementById("title").value.trim();
    const fileType = document.getElementById("fileType").value;
    const key = document.getElementById("key").value;
    const youtube = document.getElementById("youtube").value;
    const ccli = document.getElementById("ccli").value;

    if (!title || files.length === 0 || !fileType || !key) {
        alert("Add title, files, file type, and key");
        return;
    }

    const docId = title.toLowerCase().replace(/\s+/g, "-");
    const docRef = db.collection("songs").doc(docId);

    let existing = await docRef.get();
    let existingData = existing.exists ? existing.data() : {};

    let uploadedFiles = existingData.files || [];

    for (const file of files) {
        const ref = storage.ref(`songs/${docId}/${file.name}`);
        await ref.put(file);

        const url = await ref.getDownloadURL();

        uploadedFiles.push({
            name: file.name,
            url: url,
            type: fileType,
            key: key
        });
    }

    await docRef.set({
        title,
        normalized: normalizeTitle(title),
        youtube: youtube,
        ccli: ccli,
        files: uploadedFiles
    });

    alert("Upload complete!");

    files = [];
    renderFiles();
}

</script>

</body>
</html>
