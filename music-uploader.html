<!DOCTYPE html>
<html>
<head>
<title>Music Upload</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body { font-family: Arial; padding: 40px; }

.dropzone {
    border: 3px dashed #ccc;
    padding: 40px;
    text-align: center;
    border-radius: 20px;
    cursor: pointer;
}

#progressBox {
    margin-top:20px;
    padding:15px;
    border:1px solid #ccc;
}
</style>
</head>

<body>

<h2>Smart Upload</h2>

<div class="dropzone" id="dropzone">
    Click or Drag Files Here
</div>

<input type="file" id="fileInput" multiple style="display:none">

<div id="progressBox"></div>

<script>

const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner",
    storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const storage = firebase.storage();
const db = firebase.firestore();

let files = [];
let songsCache = [];

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const progressBox = document.getElementById("progressBox");

dropzone.onclick = () => fileInput.click();
fileInput.onchange = (e) => startProcess(e.target.files);

dropzone.addEventListener("dragover", e => e.preventDefault());
dropzone.addEventListener("drop", e => {
    e.preventDefault();
    startProcess(e.dataTransfer.files);
});

// LOAD SONGS
async function loadSongs() {
    const snap = await db.collection("songs").get();
    songsCache = snap.docs.map(d => ({id:d.id, ...d.data()}));
}

// PDF TEXT
async function extractPDFText(file) {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buffer}).promise;

    let text = "";
    const page = await pdf.getPage(1);
    const content = await page.getTextContent();
    text = content.items.map(i => i.str).join(" ");

    return text;
}

// NORMALIZE
function normalize(t) {
    return t.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim();
}

// FIND MATCHES
function findMatches(title) {
    const norm = normalize(title);
    return songsCache.filter(s => normalize(s.title).includes(norm)).slice(0,3);
}

// MAIN PROCESS
async function startProcess(fileList) {

    await loadSongs();
    files = Array.from(fileList);

    for (let i = 0; i < files.length; i++) {

        const file = files[i];
        progressBox.innerHTML = `Processing ${i+1} / ${files.length}<br>${file.name}`;

        let text = "";
        try {
            text = await extractPDFText(file);
        } catch {}

        const detectedTitle = text.split("\n")[0] || file.name.replace(".pdf","");
        const matches = findMatches(detectedTitle);

        let suggestionText = `
        <b>${file.name}</b><br>
        Detected: ${detectedTitle}<br><br>
        Matches:<br>
        ${matches.map((m,i)=>`${i+1}. ${m.title}`).join("<br>")}
        <br><br>
        Enter match number or 0 for new:
        `;

        let choice = prompt(suggestionText);

        let chosen = null;

        if (choice > 0 && matches[choice-1]) {
            chosen = matches[choice-1];
        }

        let title = chosen ? chosen.title : detectedTitle;

        // UPLOAD
        const id = normalize(title).replace(/\s+/g,"-");
        const ref = db.collection("songs").doc(id);

        const sRef = storage.ref(`songs/${id}/${file.name}`);
        await sRef.put(file);
        const url = await sRef.getDownloadURL();

        await ref.set({
            title,
            normalized: normalize(title),
            files: firebase.firestore.FieldValue.arrayUnion({
                name:file.name,
                url:url
            })
        }, {merge:true});

    }

    progressBox.innerHTML = "✅ All files processed!";
}

</script>

</body>
</html>
