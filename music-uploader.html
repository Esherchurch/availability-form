<!DOCTYPE html>
<html>
<head>
<title>Smart Music Upload</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body { font-family: Arial; padding: 40px; }
.dropzone {
    border: 3px dashed #ccc;
    padding: 40px;
    text-align: center;
    border-radius: 20px;
    cursor: pointer;
}
#progress { margin-top:20px; padding:10px; border:1px solid #ccc; }
</style>
</head>

<body>

<h2>Smart Upload</h2>

<div class="dropzone" id="dropzone">
    Click or Drag Files Here
</div>

<input type="file" id="fileInput" multiple style="display:none">

<button onclick="pauseProcess()">⏸ Pause</button>
<button onclick="resumeProcess()">▶ Resume</button>

<div id="progress"></div>

<script>

const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner",
    storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const storage = firebase.storage();
const db = firebase.firestore();

let files = [];
let songsCache = [];
let currentIndex = 0;
let paused = false;

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const progress = document.getElementById("progress");

dropzone.onclick = () => fileInput.click();

fileInput.onchange = (e) => {
    files = Array.from(e.target.files);
    currentIndex = 0;
    saveProgress();
    start();
};

dropzone.addEventListener("dragover", e => e.preventDefault());
dropzone.addEventListener("drop", e => {
    e.preventDefault();
    files = Array.from(e.dataTransfer.files);
    currentIndex = 0;
    saveProgress();
    start();
});

// LOAD SONGS
async function loadSongs() {
    const snap = await db.collection("songs").get();
    songsCache = snap.docs.map(d => ({id:d.id, ...d.data()}));
}

// NORMALIZE
function normalize(t) {
    return t.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim();
}

// FIND MATCHES
function findMatches(title) {
    const norm = normalize(title);
    return songsCache.filter(s => normalize(s.title).includes(norm)).slice(0,3);
}

// PDF TEXT
async function extractPDFText(file) {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
    const page = await pdf.getPage(1);
    const content = await page.getTextContent();
    return content.items.map(i => i.str).join(" ");
}

// KEY DETECTION
function detectKey(text) {
    let match = text.match(/Key\s*[:\-–—]\s*([A-G][#b]?m?)/i);
    if (match) return match[1];

    const chords = text.match(/\b[A-G](#|b)?m?\b/g);
    if (chords && chords.length > 5) {
        const count = {};
        chords.forEach(c => count[c]=(count[c]||0)+1);
        return Object.entries(count).sort((a,b)=>b[1]-a[1])[0][0];
    }

    return "";
}

// MANUAL SEARCH
async function manualSearch() {
    const query = prompt("Search song:");
    if (!query) return null;

    const norm = normalize(query);

    const results = songsCache
        .filter(s => normalize(s.title).includes(norm))
        .slice(0,10);

    let msg = "Select:\n";
    results.forEach((r,i)=> msg += `${i+1}. ${r.title}\n`);

    const choice = prompt(msg);
    return results[choice-1] || null;
}

// SAVE / LOAD
function saveProgress() {
    localStorage.setItem("uploadProgress", JSON.stringify({ currentIndex }));
}

function loadProgress() {
    const saved = JSON.parse(localStorage.getItem("uploadProgress"));
    if (saved) currentIndex = saved.currentIndex || 0;
}

// PAUSE / RESUME
function pauseProcess() {
    paused = true;
    saveProgress();
    alert("Paused");
}

function resumeProcess() {
    paused = false;
    loadProgress();
    start();
}

// MAIN LOOP
async function start() {

    await loadSongs();

    for (; currentIndex < files.length; currentIndex++) {

        if (paused) return;

        const file = files[currentIndex];
        progress.innerHTML = `File ${currentIndex+1} / ${files.length}<br>${file.name}`;

        let text = "";
        try { text = await extractPDFText(file); } catch {}

        const detectedTitle = text.split("\n")[0] || file.name.replace(".pdf","");
        const matches = findMatches(detectedTitle);
        let detectedKey = detectKey(text);

        // KEY CONFIRM
        let userKey = prompt(`Detected Key: ${detectedKey || "Unknown"}\nEnter key or press OK:`);
        if (userKey !== null && userKey.trim() !== "") {
            detectedKey = userKey.trim();
        }

        // MATCH SELECTION
        let msg = `${file.name}\nDetected: ${detectedTitle}\n\n`;

        if (matches.length > 0) {
            matches.forEach((m,i)=> msg += `${i+1}. ${m.title}\n`);
        } else {
            msg += "No matches found\n";
        }

        msg += "\n1 = use match\n2 = search manually\n0 = new\nCancel = pause";

        let choice = prompt(msg);
        if (choice === null) return pauseProcess();

        let chosen = null;

        if (choice === "2") {
            chosen = await manualSearch();
        } else if (choice > 0 && matches[choice-1]) {
            chosen = matches[choice-1];
        }

        let title = chosen ? chosen.title : detectedTitle;
        const id = normalize(title).replace(/\s+/g,"-");

        const docRef = db.collection("songs").doc(id);
        const snap = await docRef.get();
        let existingFiles = snap.exists ? (snap.data().files || []) : [];

        // 🔥 DUPLICATE KEY CHECK
        const duplicate = existingFiles.find(f => f.key === detectedKey);

        if (duplicate) {
            let dupChoice = prompt(
                `⚠ File already exists in key ${detectedKey}\n\n1 = Replace\n2 = Keep both\n3 = Skip`
            );

            if (dupChoice === "3") continue;

            if (dupChoice === "1") {
                existingFiles = existingFiles.filter(f => f.key !== detectedKey);
            }
        }

        const ref = storage.ref(`songs/${id}/${file.name}`);
        await ref.put(file);
        const url = await ref.getDownloadURL();

        existingFiles.push({
            name:file.name,
            url,
            key: detectedKey
        });

        await docRef.set({
            title,
            normalized: normalize(title),
            files: existingFiles
        });

        saveProgress();
    }

    progress.innerHTML = "✅ Done!";
}

</script>

</body>
</html>
