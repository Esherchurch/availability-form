<!DOCTYPE html>
<html>
<head>
<title>Music Upload</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body { font-family: Arial; padding: 40px; }

.dropzone {
border: 3px dashed #ccc;
padding: 40px;
text-align: center;
border-radius: 20px;
cursor: pointer;
}

.dropzone.dragover {
background: #e8f4ff;
}

#suggestions {
border: 1px solid #ddd;
max-width: 300px;
}

.suggestion-item {
padding: 5px;
cursor: pointer;
}

.suggestion-item:hover {
background: #f0f0f0;
}

table {
margin-top: 20px;
border-collapse: collapse;
width: 100%;
}

td, th {
border: 1px solid #ddd;
padding: 8px;
}
</style>
</head>

<body>

<h2>Upload Song</h2>

<label>
<input type="checkbox" id="smartMode">
Smart Assist Mode
</label><br><br>

<input id="title" placeholder="Song Title" oninput="suggestSongs()"><br>
<div id="suggestions"></div><br>

<input id="youtube" placeholder="YouTube link"><br><br>
<input id="ccli" placeholder="CCLI"><br><br>

<div class="dropzone" id="dropzone">
Drag & Drop OR Click to Select Files
</div>

<input type="file" id="fileInput" multiple style="display:none">

<table id="fileTable">
<thead>
<tr>
<th>File</th>
<th>Type</th>
<th>Key</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button onclick="upload()">Upload</button>

<script>

const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "egbc-worship-planner.firebaseapp.com",
projectId: "egbc-worship-planner",
storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);

const storage = firebase.storage();
const db = firebase.firestore();

let files = [];

const ALL_KEYS = [
"C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B",
"Cm","C#m","Dbm","Dm","D#m","Ebm","Em","Fm","F#m","Gbm","Gm","G#m","Abm","Am","A#m","Bbm","Bm"
];

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

dropzone.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", (e) => {
addFiles(e.target.files);
});

dropzone.addEventListener("dragover", e => e.preventDefault());

dropzone.addEventListener("drop", e => {
e.preventDefault();
addFiles(e.dataTransfer.files);
});

// =======================
// PDF READ
// =======================
async function extractPDFText(file) {
const buffer = await file.arrayBuffer();
const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
const page = await pdf.getPage(1);
const content = await page.getTextContent();
return content.items.map(i => i.str).join(" ");
}

// =======================
// ADD FILES
// =======================
async function addFiles(newFiles) {

for (const file of newFiles) {

let detectedKey = detectKey(file.name);
let detectedTitle = file.name.replace(".pdf","");

if (document.getElementById("smartMode").checked && file.type === "application/pdf") {
try {
const text = await extractPDFText(file);

// KEY detection
let match = text.match(/Key\s*[:\-–—]\s*([A-G][#b]?m?)/i);
if (match) detectedKey = match[1];

// TITLE detection (very simple)
let firstLine = text.split("\n")[0];
if (firstLine.length > 3 && firstLine.length < 60) {
detectedTitle = firstLine;
}

} catch(e) {}
}

// auto fill title ONLY if empty
if (!document.getElementById("title").value && detectedTitle) {
document.getElementById("title").value = detectedTitle;
suggestSongs();
}

files.push({
file: file,
type: "",
key: detectedKey || ""
});
}

renderFiles();
}

// =======================
// KEY FROM FILENAME
// =======================
function detectKey(name) {
const lower = name.toLowerCase();

for (const key of ALL_KEYS) {
if (lower.includes(` ${key.toLowerCase()}`) || lower.includes(`(${key.toLowerCase()})`)) {
return key;
}
}

return "";
}

// =======================
// RENDER
// =======================
function renderFiles() {
const tbody = document.querySelector("#fileTable tbody");

tbody.innerHTML = files.map((f, i) => `
<tr>
<td>${f.file.name}</td>

<td>
<select onchange="updateType(${i}, this.value)">
<option value="">Type</option>
<option ${f.type==="Lead Sheet"?"selected":""}>Lead Sheet</option>
<option ${f.type==="Chord Sheet"?"selected":""}>Chord Sheet</option>
<option ${f.type==="Lyrics"?"selected":""}>Lyrics</option>
<option ${f.type==="Bass Tabs"?"selected":""}>Bass Tabs</option>
</select>
</td>

<td>
<select onchange="updateKey(${i}, this.value)">
<option value="">Key</option>
${ALL_KEYS.map(k => `<option ${f.key===k?"selected":""}>${k}</option>`).join('')}
</select>
</td>
</tr>
`).join("");
}

function updateType(i, val) { files[i].type = val; }
function updateKey(i, val) { files[i].key = val; }

// =======================
// NORMALIZE
// =======================
function normalizeTitle(title) {
return title.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
}

// =======================
// SUGGEST
// =======================
async function suggestSongs() {
const input = document.getElementById("title").value;
const norm = normalizeTitle(input);

if (norm.length < 2) {
document.getElementById("suggestions").innerHTML = "";
return;
}

const snapshot = await db.collection("songs").get();

const matches = snapshot.docs
.map(doc => ({ id: doc.id, ...doc.data() }))
.filter(song => {
const songNorm = song.normalized || normalizeTitle(song.title);
return songNorm.includes(norm);
});

const box = document.getElementById("suggestions");
box.innerHTML = "";

matches.forEach(s => {
const div = document.createElement("div");
div.className = "suggestion-item";
div.textContent = s.title;
div.addEventListener("click", () => selectSuggestion(s.id));
box.appendChild(div);
});
}

// =======================
// SELECT SONG
// =======================
async function selectSuggestion(id) {
const docRef = db.collection("songs").doc(id);
const snap = await docRef.get();

if (snap.exists) {
const data = snap.data();
document.getElementById("title").value = data.title;
document.getElementById("suggestions").innerHTML = "";
document.getElementById("youtube").value = data.youtube || "";
document.getElementById("ccli").value = data.ccli || "";
}
}

// =======================
// UPLOAD (UNCHANGED CORE)
// =======================
async function upload() {

const title = document.getElementById("title").value.trim();
const youtube = document.getElementById("youtube").value;
const ccli = document.getElementById("ccli").value;

if (!title || files.length === 0) {
alert("Add title and files");
return;
}

for (const f of files) {
if (!f.type || !f.key) {
alert("Each file needs a type and key");
return;
}
}

const docId = normalizeTitle(title).replace(/\s+/g, "-");
const docRef = db.collection("songs").doc(docId);

let existing = await docRef.get();
let existingData = existing.exists ? existing.data() : {};

let uploadedFiles = existingData.files || [];

for (const f of files) {
const ref = storage.ref(`songs/${docId}/${f.file.name}`);
await ref.put(f.file);

const url = await ref.getDownloadURL();

uploadedFiles.push({
name: f.file.name,
url: url,
type: f.type,
key: f.key
});
}

await docRef.set({
title,
normalized: normalizeTitle(title),
youtube,
ccli,
files: uploadedFiles
}, { merge: true });

alert("Upload complete!");

files = [];
renderFiles();
}

</script>

</body>
</html>
