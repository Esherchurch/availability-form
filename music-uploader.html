<!DOCTYPE html>
<html>
<head>
<title>Smart Batch Upload</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body { font-family: Arial; padding: 30px; }

.dropzone {
border: 3px dashed #ccc;
padding: 40px;
text-align: center;
border-radius: 20px;
cursor: pointer;
margin-bottom: 20px;
}

table { border-collapse: collapse; width: 100%; }
td, th { border: 1px solid #ddd; padding: 6px; font-size: 12px; }

.status-new { background:#d4edda; }
.status-exists { background:#f8d7da; }
.status-review { background:#fff3cd; }

input, select { width: 100%; }
</style>
</head>

<body>

<h2>Smart Batch Upload</h2>

<div class="dropzone" id="dropzone">Drop Files Here</div>
<input type="file" id="fileInput" multiple style="display:none">

<button onclick="processAll()">Process All</button>

<table id="table">
<thead>
<tr>
<th>File</th>
<th>Song</th>
<th>Key</th>
<th>Type</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "egbc-worship-planner.firebaseapp.com",
projectId: "egbc-worship-planner",
storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let rows = [];
let songs = [];

const ALL_KEYS = ["C","C#","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const TYPES = ["Lead Sheet","Chord Sheet","Lyrics","Bass Tabs"];

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

dropzone.onclick = () => fileInput.click();

fileInput.onchange = async e => {
await loadSongs();
await addFiles(e.target.files);
};

dropzone.ondrop = async e => {
e.preventDefault();
await loadSongs();
await addFiles(e.dataTransfer.files);
};

dropzone.ondragover = e => e.preventDefault();

// ================= LOAD SONGS =================
async function loadSongs(){
const snap = await db.collection("songs").get();
songs = snap.docs.map(d => ({id:d.id,...d.data()}));
}

// ================= PDF READ =================
async function readPDF(file){
try{
const buffer = await file.arrayBuffer();
const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
const page = await pdf.getPage(1);
const content = await page.getTextContent();
return content.items.map(i=>i.str).join(" ");
}catch{
return "";
}
}

// ================= KEY DETECTION =================
function detectKey(text){

let match = text.match(/Key\s*[:\-–—]\s*([A-G][#b]?m?)/i);
if(match) return match[1];

// fallback chord count
let chords = text.match(/\b[A-G](#|b)?m?\b/g);
if(chords){
let count = {};
chords.forEach(c=>count[c]=(count[c]||0)+1);
return Object.entries(count).sort((a,b)=>b[1]-a[1])[0][0];
}

return "";
}

// ================= TYPE DETECTION =================
function detectType(text){

let chordMatches = text.match(/\b[A-G](#|b)?m?\b/g);

if(chordMatches && chordMatches.length > 20){
return "Chord Sheet";
}

if(text.includes("Verse") || text.includes("Chorus")){
return "Lead Sheet";
}

return "";
}

// ================= MATCH =================
function suggest(title){
return songs.filter(s=>s.title.toLowerCase().includes(title.toLowerCase())).slice(0,5);
}

// ================= ADD FILES =================
async function addFiles(files){

for(const file of files){

let text = await readPDF(file);

let key = detectKey(text);
let type = detectType(text);

rows.push({
file,
title: file.name.replace(".pdf",""),
match:null,
key,
type,
status:"REVIEW",
skip:false
});
}

render();
}

// ================= STATUS =================
function updateStatus(r){

if(r.skip){
r.status="SKIPPED";
return;
}

if(!r.match || !r.key || !r.type){
r.status="REVIEW";
return;
}

const dup = (r.match.files||[]).find(f=>f.key===r.key && f.type===r.type);

r.status = dup ? "EXISTS" : "NEW";
}

// ================= RENDER =================
function render(){

const tbody = document.querySelector("#table tbody");

tbody.innerHTML = rows.map((r,i)=>{

updateStatus(r);

return `
<tr class="status-${r.status.toLowerCase()}">

<td>${r.file.name}</td>

<td>
<input value="${r.title}" oninput="rows[${i}].title=this.value; render();">
<div>
${suggest(r.title).map(s=>`
<div onclick="
rows[${i}].match=songs.find(x=>x.id==='${s.id}');
rows[${i}].title='${s.title}';
render();
">${s.title}</div>
`).join("")}
</div>
</td>

<td>
<select onchange="rows[${i}].key=this.value; render();">
<option value="">Key</option>
${ALL_KEYS.map(k=>`<option ${r.key===k?'selected':''}>${k}</option>`).join("")}
</select>
</td>

<td>
<select onchange="rows[${i}].type=this.value; render();">
<option value="">Type</option>
${TYPES.map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join("")}
</select>
</td>

<td>${r.status}</td>

<td>
${r.status==="EXISTS" ? `<button onclick="rows[${i}].skip=true; render()">Skip</button>` : ""}
</td>

</tr>
`;
}).join("");
}

// ================= PROCESS =================
async function processAll(){

for(const r of rows){

if(r.skip || r.status==="EXISTS") continue;

if(r.status==="REVIEW"){
alert("Fix: "+r.file.name);
return;
}

const id = r.match ? r.match.id : r.title.toLowerCase().replace(/\s+/g,"-");

const ref = storage.ref(`songs/${id}/${r.file.name}`);
await ref.put(r.file);
const url = await ref.getDownloadURL();

const docRef = db.collection("songs").doc(id);
const snap = await docRef.get();
const data = snap.exists ? snap.data() : {};

let files = data.files || [];

files.push({
name:r.file.name,
url,
type:r.type,
key:r.key
});

await docRef.set({
title:r.title,
normalized:r.title.toLowerCase(),
youtube:data.youtube || "",
ccli:data.ccli || "",
files
},{merge:true});
}

alert("Done");
}

</script>

</body>
</html>
