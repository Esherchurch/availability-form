<!DOCTYPE html>
<html>
<head>
<title>Batch Music Upload</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body { font-family: Arial; padding: 30px; }

.dropzone {
border: 3px dashed #ccc;
padding: 40px;
text-align: center;
border-radius: 20px;
cursor: pointer;
margin-bottom: 20px;
}

table {
border-collapse: collapse;
width: 100%;
margin-top: 20px;
}

td, th {
border: 1px solid #ddd;
padding: 6px;
font-size: 12px;
}

.status-new { background:#d4edda; }
.status-exists { background:#f8d7da; }
.status-review { background:#fff3cd; }

input, select {
width: 100%;
font-size: 12px;
}
</style>
</head>

<body>

<h2>Batch Upload (Multi Song)</h2>

<div class="dropzone" id="dropzone">
Drag & Drop Files
</div>

<input type="file" id="fileInput" multiple style="display:none">

<button onclick="scanFiles()">Scan Files</button>
<button onclick="processAll()">Process All</button>

<table id="batchTable">
<thead>
<tr>
<th>File</th>
<th>Song</th>
<th>Key</th>
<th>Type</th>
<th>YouTube</th>
<th>CCLI</th>
<th>Status</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "egbc-worship-planner.firebaseapp.com",
projectId: "egbc-worship-planner",
storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);

const storage = firebase.storage();
const db = firebase.firestore();

let rawFiles = [];
let rows = [];
let songsCache = [];

const TYPES = ["Lead Sheet","Chord Sheet","Lyrics","Bass Tabs"];

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

dropzone.onclick = ()=> fileInput.click();

fileInput.onchange = e => rawFiles = Array.from(e.target.files);

dropzone.addEventListener("dragover", e => e.preventDefault());

dropzone.addEventListener("drop", e=>{
e.preventDefault();
rawFiles = Array.from(e.dataTransfer.files);
});

// ================= LOAD SONGS =================
async function loadSongs(){
const snap = await db.collection("songs").get();
songsCache = snap.docs.map(d=>({id:d.id,...d.data()}));
}

// ================= NORMALIZE =================
function normalize(t){
return t.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim();
}

// ================= MATCH =================
function similarity(a,b){
let longer = a.length > b.length ? a : b;
let shorter = a.length > b.length ? b : a;
let same = 0;

for(let i=0;i<shorter.length;i++){
if(longer.includes(shorter[i])) same++;
}

return same / longer.length;
}

function findBestMatch(title){
const norm = normalize(title);

let matches = songsCache.map(s=>{
return {
song:s,
score: similarity(norm, normalize(s.title))
};
});

matches.sort((a,b)=>b.score-a.score);

return matches[0].score > 0.5 ? matches[0].song : null;
}

// ================= KEY =================
function detectKey(text,name){
let m = text.match(/Key\s*[:\-–—]\s*([A-G][#b]?m?)/i);
if(m) return m[1];
return "";
}

// ================= PDF =================
async function readPDF(file){
try{
const buf = await file.arrayBuffer();
const pdf = await pdfjsLib.getDocument({data:buf}).promise;
const page = await pdf.getPage(1);
const txt = await page.getTextContent();
return txt.items.map(i=>i.str).join(" ");
}catch{
return "";
}
}

// ================= STATUS =================
function updateStatus(row){

if(!row.match){
row.status = "REVIEW";
return;
}

if(!row.key || !row.type){
row.status = "REVIEW";
return;
}

const existing = (row.match.files || []);

const dup = existing.find(f =>
f.key === row.key && f.type === row.type
);

row.status = dup ? "EXISTS" : "NEW";
}

// ================= SCAN =================
async function scanFiles(){

await loadSongs();
rows = [];

for(const file of rawFiles){

let text = await readPDF(file);

let title = file.name.replace(".pdf","");

if(text){
let l = text.split("\n")[0];
if(l.length<60) title = l;
}

let match = findBestMatch(title);
let key = detectKey(text,file.name);

let row = {
file,
title,
key,
type:"",
match,
youtube: match?.youtube || "",
ccli: match?.ccli || "",
status:"REVIEW"
};

updateStatus(row);
rows.push(row);
}

renderTable();
}

// ================= RENDER =================
function renderTable(){

const tbody = document.querySelector("#batchTable tbody");

tbody.innerHTML = rows.map((r,i)=>`

<tr class="status-${r.status.toLowerCase()}">

<td>${r.file.name}</td>

<td>
<input value="${r.title}" onchange="
rows[${i}].title=this.value;
rows[${i}].match=findBestMatch(this.value);
rows[${i}].youtube=rows[${i}].match?.youtube || '';
rows[${i}].ccli=rows[${i}].match?.ccli || '';
updateStatus(rows[${i}]);
renderTable();
">
</td>

<td>
<input value="${r.key}" onchange="
rows[${i}].key=this.value;
updateStatus(rows[${i}]);
renderTable();
">
</td>

<td>
<select onchange="
rows[${i}].type=this.value;
updateStatus(rows[${i}]);
renderTable();
">
<option value="">Type</option>
${TYPES.map(t=>`<option ${r.type===t?"selected":""}>${t}</option>`).join("")}
</select>
</td>

<td>
<input value="${r.youtube}" onchange="rows[${i}].youtube=this.value">
</td>

<td>
<input value="${r.ccli}" onchange="rows[${i}].ccli=this.value">
</td>

<td>${r.status}</td>

</tr>

`).join("");
}

// ================= PROCESS =================
async function processAll(){

for(const r of rows){

if(r.status==="EXISTS") continue;

if(r.status==="REVIEW"){
alert("Fix row before upload: " + r.file.name);
return;
}

let id = normalize(r.title).replace(/\s+/g,"-");

let docRef = db.collection("songs").doc(id);
let snap = await docRef.get();

let data = snap.exists ? snap.data() : {};
let files = data.files || [];

const ref = storage.ref(`songs/${id}/${r.file.name}`);
await ref.put(r.file);
const url = await ref.getDownloadURL();

files.push({
name:r.file.name,
url,
type:r.type,
key:r.key
});

await docRef.set({
title:r.title,
normalized: normalize(r.title),
youtube: r.youtube || data.youtube || "",
ccli: r.ccli || data.ccli || "",
files
},{merge:true});

}

alert("Upload complete!");
}

</script>

</body>
</html>
