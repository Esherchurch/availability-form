<!DOCTYPE html>
<html>
<head>
<title>Music Upload</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- PDF READER -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body { font-family: Arial; padding: 40px; }

.dropzone {
    border: 3px dashed #ccc;
    padding: 40px;
    text-align: center;
    border-radius: 20px;
    cursor: pointer;
}

.dropzone.dragover {
    background: #e8f4ff;
}

#suggestions {
    border: 1px solid #ddd;
    max-width: 300px;
}

.suggestion-item {
    padding: 5px;
    cursor: pointer;
}

.suggestion-item:hover {
    background: #f0f0f0;
}

table {
    margin-top: 20px;
    border-collapse: collapse;
    width: 100%;
}

td, th {
    border: 1px solid #ddd;
    padding: 8px;
}
</style>
</head>

<body>

<h2>Upload Song</h2>

<input id="title" placeholder="Song Title" oninput="suggestSongs()"><br>
<div id="suggestions"></div><br>

<input id="youtube" placeholder="YouTube link"><br><br>
<input id="ccli" placeholder="CCLI"><br><br>

<div class="dropzone" id="dropzone">
    Drag & Drop OR Click to Select Files
</div>

<input type="file" id="fileInput" multiple style="display:none">

<table id="fileTable">
<thead>
<tr>
<th>File</th>
<th>Type</th>
<th>Key</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button onclick="upload()">Upload</button>

<script>

const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner",
    storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);

const storage = firebase.storage();
const db = firebase.firestore();

let files = [];

const ALL_KEYS = [
    "C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B",
    "Cm","C#m","Dbm","Dm","D#m","Ebm","Em","Fm","F#m","Gbm","Gm","G#m","Abm","Am","A#m","Bbm","Bm"
];

// PDF TEXT
async function extractPDFText(file) {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buffer}).promise;

    let text = "";

    for (let i = 1; i <= Math.min(2, pdf.numPages); i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(i => i.str).join(" ") + "\n";
    }

    return text;
}

// TITLE + KEY
function extractTitle(text, filename) {
    const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 3);
    if (lines.length > 0 && lines[0].length < 60) return lines[0];
    return filename.replace(".pdf","");
}

function extractKey(text) {
    const match = text.match(/Key[:\s]+([A-G][#b]?m?)/i);
    return match ? match[1] : "";
}

// ADD FILES
async function addFiles(newFiles) {

    for (const file of newFiles) {

        let title = "";
        let key = "";

        if (file.type === "application/pdf") {
            try {
                const text = await extractPDFText(file);
                title = extractTitle(text, file.name);
                key = extractKey(text);
            } catch(e) {
                console.log("PDF fail", e);
            }
        }

        if (!key) key = detectKey(file.name);

        if (title && !document.getElementById("title").value) {
            document.getElementById("title").value = title;
            suggestSongs();
        }

        files.push({ file, type:"", key });
    }

    renderFiles();
}

// KEY FROM NAME
function detectKey(name) {
    const lower = name.toLowerCase();
    for (const k of ALL_KEYS) {
        if (lower.includes(" "+k.toLowerCase()) || lower.includes("("+k.toLowerCase()+")")) return k;
    }
    return "";
}

// RENDER
function renderFiles() {
    const tbody = document.querySelector("#fileTable tbody");

    tbody.innerHTML = files.map((f,i)=>`
        <tr>
            <td>${f.file.name}</td>
            <td>
                <select onchange="files[${i}].type=this.value">
                    <option value="">Type</option>
                    <option ${f.type==="Lead Sheet"?"selected":""}>Lead Sheet</option>
                    <option ${f.type==="Chord Sheet"?"selected":""}>Chord Sheet</option>
                    <option ${f.type==="Lyrics"?"selected":""}>Lyrics</option>
                    <option ${f.type==="Bass Tabs"?"selected":""}>Bass Tabs</option>
                </select>
            </td>
            <td>
                <select onchange="files[${i}].key=this.value">
                    <option value="">Key</option>
                    ${ALL_KEYS.map(k=>`<option ${f.key===k?"selected":""}>${k}</option>`).join("")}
                </select>
            </td>
        </tr>
    `).join("");
}

// NORMALIZE
function normalizeTitle(t) {
    return t.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
}

// SUGGEST
async function suggestSongs() {
    const val = document.getElementById("title").value;
    const norm = normalizeTitle(val);

    if (norm.length < 2) return document.getElementById("suggestions").innerHTML="";

    const snap = await db.collection("songs").get();

    const matches = snap.docs.map(d=>({id:d.id,...d.data()}))
        .filter(s => (s.normalized||normalizeTitle(s.title)).includes(norm));

    const box = document.getElementById("suggestions");
    box.innerHTML="";

    matches.forEach(s=>{
        const div = document.createElement("div");
        div.className="suggestion-item";
        div.textContent = s.title + " ("+(s.key||"?")+")";
        div.onclick = ()=>selectSuggestion(s.id);
        box.appendChild(div);
    });
}

// SELECT
async function selectSuggestion(id) {
    const doc = await db.collection("songs").doc(id).get();
    const d = doc.data();

    document.getElementById("title").value = d.title;
    document.getElementById("youtube").value = d.youtube||"";
    document.getElementById("ccli").value = d.ccli||"";
    document.getElementById("suggestions").innerHTML="";
}

// UPLOAD
async function upload() {

    const title = document.getElementById("title").value.trim();
    if (!title || files.length===0) return alert("Add title and files");

    for (const f of files) {
        if (!f.type || !f.key) return alert("Each file needs type + key");
    }

    const id = normalizeTitle(title).replace(/\s+/g,"-");
    const ref = db.collection("songs").doc(id);

    const snap = await ref.get();
    let data = snap.exists ? snap.data() : {};
    let uploaded = data.files || [];

    for (const f of files) {
        const sRef = storage.ref(`songs/${id}/${f.file.name}`);
        await sRef.put(f.file);
        const url = await sRef.getDownloadURL();

        uploaded.push({
            name:f.file.name,
            url,
            type:f.type,
            key:f.key
        });
    }

    await ref.set({
        title,
        normalized: normalizeTitle(title),
        youtube: document.getElementById("youtube").value,
        ccli: document.getElementById("ccli").value,
        files: uploaded
    });

    alert("Upload complete");

    files=[];
    renderFiles();
}

</script>

</body>
</html>
