<!DOCTYPE html>
<html>
<head>
<title>Music Upload</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body { font-family: Arial; padding: 40px; }

.dropzone {
border: 3px dashed #ccc;
padding: 40px;
text-align: center;
border-radius: 20px;
cursor: pointer;
}

table {
margin-top: 20px;
border-collapse: collapse;
width: 100%;
}

td, th {
border: 1px solid #ddd;
padding: 6px;
font-size: 12px;
}

.status-new { background:#d4edda; }
.status-exists { background:#f8d7da; }
.status-review { background:#fff3cd; }

</style>
</head>

<body>

<h2>Upload Song (Original)</h2>

<input id="title" placeholder="Song Title"><br><br>
<input id="youtube" placeholder="YouTube link"><br><br>
<input id="ccli" placeholder="CCLI"><br><br>

<div class="dropzone" id="dropzone">
Drag & Drop Files
</div>

<input type="file" id="fileInput" multiple style="display:none">

<h2>Batch Processing</h2>

<button onclick="scanFiles()">Scan Files</button>
<button onclick="processAll()">Process All</button>

<table id="batchTable">
<thead>
<tr>
<th>File</th>
<th>Title</th>
<th>Key</th>
<th>Type</th>
<th>Status</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "egbc-worship-planner.firebaseapp.com",
projectId: "egbc-worship-planner",
storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const storage = firebase.storage();
const db = firebase.firestore();

let rawFiles = [];
let rows = [];
let songsCache = [];

const TYPES = ["Lead Sheet","Chord Sheet","Lyrics","Bass Tabs"];

document.getElementById("dropzone").onclick = () => fileInput.click();

fileInput.onchange = (e)=> rawFiles = Array.from(e.target.files);

dropzone.addEventListener("drop", e=>{
e.preventDefault();
rawFiles = Array.from(e.dataTransfer.files);
});

// ================= LOAD SONGS =================
async function loadSongs() {
const snap = await db.collection("songs").get();
songsCache = snap.docs.map(d=>({id:d.id,...d.data()}));
}

// ================= NORMALIZE =================
function normalize(t){
return t.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim();
}

// ================= MATCH =================
function findMatch(title){
const norm = normalize(title);
return songsCache.find(s=>normalize(s.title).includes(norm));
}

// ================= KEY =================
function detectKey(text,name){
let m = text.match(/Key\s*[:\-–—]\s*([A-G][#b]?m?)/i);
if(m) return m[1];

for(const k of ["A","B","C","D","E","F","G"]){
if(name.includes(" "+k)) return k;
}
return "";
}

// ================= PDF =================
async function readPDF(file){
try{
const buf = await file.arrayBuffer();
const pdf = await pdfjsLib.getDocument({data:buf}).promise;
const page = await pdf.getPage(1);
const txt = await page.getTextContent();
return txt.items.map(i=>i.str).join(" ");
}catch{
return "";
}
}

// ================= SCAN =================
async function scanFiles(){

await loadSongs();
rows = [];

for(const file of rawFiles){

let text = await readPDF(file);

let title = file.name.replace(".pdf","");
if(text){
let line = text.split("\n")[0];
if(line.length<60) title=line;
}

let match = findMatch(title);

let key = detectKey(text,file.name);

let status = "NEW";

if(match){
let exists = (match.files||[]).find(f=>f.key===key);
if(exists) status="EXISTS";
}

if(!match) status="REVIEW";

rows.push({
file,
title,
key,
type:"",
match,
status
});
}

renderTable();
}

// ================= RENDER =================
function renderTable(){

const tbody = document.querySelector("#batchTable tbody");

tbody.innerHTML = rows.map((r,i)=>`

<tr class="status-${r.status.toLowerCase()}">

<td>${r.file.name}</td>

<td>
<input value="${r.title}" onchange="rows[${i}].title=this.value">
</td>

<td>
<input value="${r.key}" onchange="rows[${i}].key=this.value">
</td>

<td>
<select onchange="rows[${i}].type=this.value">
<option value="">Type</option>
${TYPES.map(t=>`<option ${r.type===t?"selected":""}>${t}</option>`).join("")}
</select>
</td>

<td>${r.status}</td>

</tr>

`).join("");
}

// ================= PROCESS =================
async function processAll(){

for(const r of rows){

if(r.status==="EXISTS") continue;

if(!r.type || !r.key){
alert("Missing type/key on "+r.file.name);
return;
}

let title = r.title;
let id = normalize(title).replace(/\s+/g,"-");

let docRef = db.collection("songs").doc(id);
let snap = await docRef.get();

let data = snap.exists ? snap.data() : {};

let files = data.files || [];

const ref = storage.ref(`songs/${id}/${r.file.name}`);
await ref.put(r.file);
const url = await ref.getDownloadURL();

files.push({
name:r.file.name,
url,
type:r.type,
key:r.key
});

await docRef.set({
title,
normalized: normalize(title),
youtube: data.youtube || "",
ccli: data.ccli || "",
files
},{merge:true});

}

alert("Done!");
}

</script>

</body>
</html>
