<!DOCTYPE html>
<html>
<head>
<title>Music Upload</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body { font-family: Arial; padding: 40px; }

.dropzone {
    border: 3px dashed #ccc;
    padding: 40px;
    text-align: center;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.2s;
}

.dropzone.dragover {
    background: #e8f4ff;
    border-color: #2196f3;
}

#suggestions {
    border: 1px solid #ddd;
    max-width: 300px;
}

.suggestion-item {
    padding: 5px;
    cursor: pointer;
}

.suggestion-item:hover {
    background: #f0f0f0;
}

table {
    margin-top: 20px;
    border-collapse: collapse;
    width: 100%;
}

td, th {
    border: 1px solid #ddd;
    padding: 8px;
}
</style>
</head>

<body>

<h2>Upload Song</h2>

<input id="title" placeholder="Song Title" oninput="suggestSongs()"><br>
<div id="suggestions"></div><br>

<input id="youtube" placeholder="YouTube link"><br><br>
<input id="ccli" placeholder="CCLI"><br><br>

<div class="dropzone" id="dropzone">
    Click or Drag Files Here
</div>

<input type="file" id="fileInput" multiple style="display:none">

<table id="fileTable">
<thead>
<tr>
<th>File</th>
<th>Type</th>
<th>Key</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button onclick="upload()">Upload</button>

<script>

const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner",
    storageBucket: "egbc-worship-planner.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);

const storage = firebase.storage();
const db = firebase.firestore();

let files = [];

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

// ✅ CLICK FIX
dropzone.onclick = () => fileInput.click();

// ✅ FILE SELECT FIX
fileInput.onchange = (e) => {
    if (e.target.files.length > 0) {
        addFiles(e.target.files);
    }
};

// ✅ DRAG FIXES
dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropzone.classList.add("dragover");
});

dropzone.addEventListener("dragleave", () => {
    dropzone.classList.remove("dragover");
});

dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("dragover");

    if (e.dataTransfer.files.length > 0) {
        addFiles(e.dataTransfer.files);
    }
});

// =======================
// SIMPLE ADD FILES (test first)
// =======================
function addFiles(newFiles) {

    for (const file of newFiles) {
        files.push({
            file,
            type: "",
            key: ""
        });
    }

    renderFiles();
}

// =======================
// RENDER
// =======================
function renderFiles() {
    const tbody = document.querySelector("#fileTable tbody");

    tbody.innerHTML = files.map((f,i)=>`
        <tr>
            <td>${f.file.name}</td>
            <td>
                <select onchange="files[${i}].type=this.value">
                    <option value="">Type</option>
                    <option>Lead Sheet</option>
                    <option>Chord Sheet</option>
                    <option>Lyrics</option>
                    <option>Bass Tabs</option>
                </select>
            </td>
            <td>
                <select onchange="files[${i}].key=this.value">
                    <option value="">Key</option>
                    <option>C</option><option>D</option><option>E</option>
                    <option>F</option><option>G</option><option>A</option><option>B</option>
                </select>
            </td>
        </tr>
    `).join("");
}

// =======================
// UPLOAD (unchanged)
// =======================
async function upload() {
    alert("Upload clicked - working");
}

</script>

</body>
</html>
