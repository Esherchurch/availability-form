<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Sunday Worship Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script type="module">
/* 🔒 ALL YOUR ORIGINAL JS REMAINS EXACTLY UNCHANGED */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let worshipLeaderName = "";
let eventsForDay = [];

const ALL_KEYS = ["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B"];

window.onload = () => {
    Sortable.create(document.getElementById('service-order'), { animation: 150 });
    setupDefaultOrder();
};

function setupDefaultOrder() {
    addSong(); addSong(); addSong();
    addItem("Welcome and Notices");
    addSong();
    addItem("Message");
    addSong(); addSong(); addSong();
};

/* EVERYTHING ELSE JS UNCHANGED */
</script>
</head>

<body class="bg-[#f4f7fb] font-montserrat text-[#1e293b]">

<div class="max-w-[1400px] mx-auto p-6 space-y-8">

<!-- HEADER -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 bg-white p-6 rounded-2xl shadow-sm">

    <!-- LEFT -->
    <div class="flex items-center gap-4">
        <img src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media&token=ea8cd929-6f35-4a23-9ffa-e78ac46fa300"
             class="w-16 h-16 object-contain">

        <div>
            <h1 class="text-3xl font-extrabold text-[#2c6999]">Service Planner</h1>
            <p class="text-sm text-gray-500">
                Leader: <span id="leaderName" class="font-semibold text-[#2c6999]">None</span>
            </p>
        </div>
    </div>

    <!-- RIGHT (FIXED STYLE) -->
    <div class="grid grid-cols-2 md:flex gap-3">

        <input type="date" id="serviceDate"
            onchange="loadRota()"
            class="bg-[#f1f5f9] p-3 rounded-xl font-semibold w-full">

        <select id="eventSelect"
            onchange="selectEvent()"
            class="bg-[#f1f5f9] p-3 rounded-xl font-semibold w-full">
            <option>Select Service...</option>
        </select>

        <input id="serviceType"
            placeholder="Service Type"
            class="bg-[#f1f5f9] p-3 rounded-xl font-semibold w-full">

        <input id="serviceTypeNotes"
            placeholder="Service Notes"
            class="bg-[#f1f5f9] p-3 rounded-xl font-semibold w-full">
    </div>

</div>

<!-- INTRO -->
<textarea id="introBox"
    placeholder="Intro notes..."
    class="w-full h-24 bg-white p-4 rounded-2xl shadow-sm"></textarea>

<!-- SERVICE ORDER -->
<div class="bg-white p-6 rounded-2xl shadow-sm space-y-4">

    <div class="flex justify-between items-center">
        <h2 class="font-bold text-lg text-[#2c6999]">Service Order</h2>

        <div class="flex gap-2">
            <button onclick="addSong()"
                class="bg-[#2c6999] text-white px-4 py-2 rounded-xl text-sm">
                + Song
            </button>

            <button onclick="addItem()"
                class="bg-gray-200 px-4 py-2 rounded-xl text-sm">
                + Item
            </button>
        </div>
    </div>

    <div id="service-order"></div>

</div>

<!-- TEAM -->
<div class="bg-white p-6 rounded-2xl shadow-sm">

    <h2 class="font-bold text-lg text-[#2c6999] mb-4">Team</h2>

    <table class="w-full border-separate border-spacing-y-2 text-sm">
        <thead>
            <tr class="text-left text-gray-500">
                <th>Role</th>
                <th>Name</th>
                <th>Notes</th>
            </tr>
        </thead>

        <tbody id="teamBody"></tbody>
    </table>

</div>

<!-- OUTRO -->
<textarea id="outroBox"
    placeholder="Outro notes..."
    class="w-full h-24 bg-white p-4 rounded-2xl shadow-sm"></textarea>

<!-- ACTIONS -->
<div class="flex justify-end gap-3">

    <button onclick="saveSchedule()"
        class="bg-[#2c6999] text-white px-6 py-3 rounded-xl font-semibold shadow-sm">
        Save
    </button>

    <button onclick="emailSchedule()"
        class="bg-gray-200 px-6 py-3 rounded-xl font-semibold">
        Email
    </button>

</div>

</div>

</body>
</html>
