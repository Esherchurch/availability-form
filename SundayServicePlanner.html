<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Sunday Worship Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>
    body { font-family: 'Montserrat', sans-serif; background-color: #f0f4f8; }
    
    .styled-input {
        background-color: #ffffff;
        border: 2px solid #e2e8f0;
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        font-weight: 600;
        color: #2c6999;
        transition: all 0.2s;
    }
    .styled-input:focus {
        outline: none;
        border-color: #2c6999;
        box-shadow: 0 0 0 3px rgba(44, 105, 153, 0.1);
    }

    .btn-primary {
        background-color: #2c6999;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.2s;
    }
    .btn-primary:hover { background-color: #1e4a6d; transform: translateY(-1px); }
    
    .btn-secondary {
        background-color: #ffffff;
        color: #2c6999;
        border: 2px solid #2c6999;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 700;
        transition: all 0.2s;
    }
    .btn-secondary:hover { background-color: #f0f7ff; }

    .drag-handle {
        cursor: grab;
        color: #cbd5e1;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
    }

    .rota-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 0.5rem;
    }
    .rota-table th {
        text-align: left;
        padding: 1rem;
        color: #64748b;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .rota-table tr { background-color: white; }
    .rota-table td {
        padding: 1rem;
        border-top: 1px solid #f1f5f9;
        border-bottom: 1px solid #f1f5f9;
    }
    .rota-table tr td:first-child { border-left: 1px solid #f1f5f9; border-radius: 1rem 0 0 1rem; font-weight: 700; color: #2c6999; }
    .rota-table tr td:last-child { border-right: 1px solid #f1f5f9; border-radius: 0 1rem 1rem 0; }

    textarea { resize: none; }

    .collapse-btn {
        transition: transform 0.2s;
        font-size: 1.2rem;
    }
    .is-collapsed .collapse-btn {
        transform: rotate(-90deg);
    }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let worshipLeaderName = "";
let eventsForDay = [];
let addressBook = [];

const ALL_KEYS = ["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B"];

window.onload = async () => {
    Sortable.create(document.getElementById('service-order'), { 
        animation: 150,
        handle: '.drag-handle',
        onEnd: function() {
            updateSongNumbers();
        }
    });
    setupDefaultOrder();
    
    try {
        const emailSnap = await getDocs(collection(db, "addressBook"));
        emailSnap.forEach(doc => {
            const data = doc.data();
            if (data.email) addressBook.push(data);
        });
    } catch (e) { console.error("Address book load failed", e); }
};

function setupDefaultOrder() {
    addSong(); addSong(); addSong();
    addItem("Welcome and Notices");
    addSong();
    addItem("Message");
    addSong(); addSong(); addSong();
}

window.updateSongNumbers = () => {
    const songs = document.querySelectorAll('.song-block');
    songs.forEach((song, index) => {
        const label = song.querySelector('.song-number');
        if (label) {
            label.innerText = "Song " + (index + 1);
        }
    });
}

window.toggleSong = (btn) => {
    const block = btn.closest('.song-block');
    const content = block.querySelector('.song-content');
    block.classList.toggle('is-collapsed');
    content.classList.toggle('hidden');
    btn.innerText = content.classList.contains('hidden') ? "▶" : "▼";
};

window.addSong = () => {
    const container = document.getElementById('service-order');
    const id = Math.random().toString(36).substr(2, 9);
    const isFirst = container.querySelectorAll('.song-block').length === 0;
    const collapseClass = isFirst ? "" : "is-collapsed";
    const contentClass = isFirst ? "" : "hidden";
    const arrow = isFirst ? "▼" : "▶";

    const div = document.createElement('div');
    div.className = `service-block song-block bg-white p-6 mb-4 rounded-[1.5rem] shadow-sm border border-white hover:border-blue-100 transition-colors ${collapseClass}`;
    div.innerHTML = `
        <div class="flex gap-4 items-center mb-2">
            <div class="drag-handle">⠿</div>
            <button onclick="toggleSong(this)" class="collapse-btn text-[#2c6999] font-bold w-6">${arrow}</button>
            <span class="song-number text-[10px] font-extrabold uppercase tracking-widest text-gray-400 min-w-[50px]">Song</span>
            <div class="relative flex-grow">
                <input oninput="searchSong(this,'${id}')" class="song-title styled-input w-full" placeholder="Song title">
                <div id="suggest-${id}" class="absolute bg-white shadow-xl rounded-xl w-full hidden z-50 mt-1 border border-gray-100 overflow-hidden"></div>
            </div>
            <select onchange="keyChanged('${id}')" class="song-key styled-input w-32">
                <option value="">Key</option>
                ${ALL_KEYS.map(k => `<option>${k}</option>`).join('')}
            </select>
            <button onclick="this.parentElement.parentElement.remove(); updateSongNumbers();" class="text-gray-300 hover:text-red-500 text-2xl font-bold">&times;</button>
        </div>
        <div class="song-content ml-14 space-y-4 ${contentClass}">
            <textarea class="song-note styled-input w-full h-20" placeholder="Notes for the band..."></textarea>
            <div id="keyinfo-${id}"></div>
            <div id="files-${id}"></div>
        </div>
    `;
    container.appendChild(div);
    updateSongNumbers();
    return id;
};

async function showKeyInfo(id, title) {
    if (!title || title.trim() === "") return;
    const container = document.getElementById(`keyinfo-${id}`);
    const docId = title.toLowerCase().replace(/\s+/g, "-").trim();
    const snap = await getDoc(doc(db, "songs", docId));
    if (!snap.exists()) return;
    const files = snap.data().files || [];
    const chordKeys = files.filter(f => f.type === "Chord Sheet" && f.key).map(f => f.key);
    const uniqueKeys = [...new Set(chordKeys)];
    let available = uniqueKeys.sort().join(", ") || "None";
    const missing = ALL_KEYS.filter(k => !uniqueKeys.includes(k)).join(", ");
    container.innerHTML = `
        <div class="text-[10px] mt-2 bg-gray-50 p-3 rounded-lg flex flex-col gap-1">
            <div><span class="text-green-600 font-bold uppercase tracking-wider">Available:</span> <span class="text-gray-700">${available}</span></div>
            <div><span class="text-red-400 font-bold uppercase tracking-wider">Missing:</span> <span class="text-gray-500">${missing}</span></div>
        </div>
    `;
}

async function getPreferredKey(title, leader) {
    const snap = await getDocs(collection(db, "services"));
    let lastKey = "";
    snap.forEach(doc => {
        const data = doc.data();
        if (data.worshipLeader !== leader) return;
        (data.order || []).forEach(item => {
            if (item.type === "song" && item.title === title) {
                lastKey = item.key;
            }
        });
    });
    return lastKey;
}

window.searchSong = async (input, id) => {
    const val = input.value.toLowerCase().trim();
    const box = document.getElementById(`suggest-${id}`);
    if (val.length < 2) {
        box.classList.add('hidden');
        return;
    }
    const snap = await getDocs(collection(db, "songs"));
    const words = val.split(" ");
    const matches = snap.docs
        .map(d => d.data())
        .filter(song => {
            const title = (song.title || "").toLowerCase();
            return words.every(w => title.includes(w));
        })
        .slice(0, 10);

    if (matches.length === 0) {
        box.classList.add('hidden');
        return;
    }
    box.innerHTML = matches.map(s => `
        <div onclick="selectSong('${s.title.replace(/'/g, "\\'")}','${id}')" class="p-3 hover:bg-blue-50 cursor-pointer text-sm font-semibold text-gray-700 border-b border-gray-50 last:border-0">
            ${s.title}
        </div>
    `).join('');
    box.classList.remove('hidden');
};

window.selectSong = async (title, id) => {
    const block = document.getElementById(`suggest-${id}`).closest('.song-block');
    block.querySelector('.song-title').value = title;
    document.getElementById(`suggest-${id}`).classList.add('hidden');
    await showKeyInfo(id, title);
    if (worshipLeaderName && worshipLeaderName !== "None") {
        const preferred = await getPreferredKey(title, worshipLeaderName);
        if (preferred) {
            block.querySelector('.song-key').value = preferred;
            keyChanged(id);
        }
    }
};

window.keyChanged = async (id) => {
    const block = document.getElementById(`files-${id}`).closest('.song-block');
    const title = block.querySelector('.song-title').value;
    const key = block.querySelector('.song-key').value;
    const container = document.getElementById(`files-${id}`);
    if (!title || !key) { container.innerHTML = ""; return; }
    const docId = title.toLowerCase().replace(/\s+/g, "-").trim();
    const snap = await getDoc(doc(db, "songs", docId));
    if (!snap.exists()) return;
    const data = snap.data();
    const allFiles = data.files || [];
    const files = allFiles.filter(f => f.key && f.key.trim().toLowerCase() === key.trim().toLowerCase());
    const grouped = {};
    files.forEach(f => {
        if (!grouped[f.type]) grouped[f.type] = [];
        grouped[f.type].push(f);
    });

    let html = `<div class="mt-4 p-4 bg-blue-50 rounded-xl">`;
    Object.keys(grouped).forEach(type => {
        html += `<div class="text-[10px] text-[#2c6999] font-extrabold uppercase mb-1">${type}</div><div class="flex flex-wrap gap-2 mb-2">`;
        grouped[type].forEach(file => {
            html += `<a href="${file.url}" target="_blank" class="text-[11px] bg-[#2c6999] text-white px-3 py-1.5 rounded-lg font-bold">Open File</a>`;
        });
        html += `</div>`;
    });
    html += `</div>`;
    container.innerHTML = html;
};

window.addItem = (val="") => {
    const div = document.createElement('div');
    div.className = "service-block item-block bg-[#e2e8f0] p-4 mb-4 rounded-2xl flex gap-4 items-center";
    div.innerHTML = `
        <div class="drag-handle">⠿</div>
        <div class="w-6"></div> 
        <input value="${val}" class="item-title flex-grow bg-transparent font-bold text-[#2c6999] focus:outline-none text-lg" placeholder="Service Item Name...">
        <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
    `;
    document.getElementById('service-order').appendChild(div);
};

window.loadRota = async () => {
    const date = document.getElementById('serviceDate').value;
    const snap = await getDocs(collection(db, "events"));
    eventsForDay = [];
    snap.forEach(d => {
        const ev = d.data();
        if (ev.date === date && ev.archived !== true) eventsForDay.push(ev);
    });
    const select = document.getElementById('eventSelect');
    select.innerHTML = '<option value="">Select Service...</option>';
    eventsForDay.forEach((ev, i) => {
        select.innerHTML += `<option value="${i}">${ev.type}</option>`;
    });
};

window.selectEvent = async () => {
    const index = document.getElementById('eventSelect').value;
    if (index === "") return;
    const data = eventsForDay[index];
    document.getElementById('serviceType').value = data.type || "";
    worshipLeaderName = data.assignments?.["Worship Leader"]?.name || "None";
    document.getElementById('leaderName').innerText = worshipLeaderName;
    const teamBody = document.getElementById('teamBody');
    teamBody.innerHTML = '';
    
    const priorityTop = ["Worship Leader", "Keyboard", "Guitar"];
    const priorityBottom = ["Sound", "Words", "Camera"];
    const assignmentsArray = Object.entries(data.assignments || {});
    assignmentsArray.sort((a, b) => {
        const getRank = (r) => {
            if (priorityTop.includes(r)) return 0;
            if (priorityBottom.includes(r)) return 2;
            return 1;
        };
        return getRank(a[0]) - getRank(b[0]);
    });

    assignmentsArray.forEach(([role, person]) => {
        teamBody.innerHTML += `<tr><td class="w-1/4">${role}</td><td class="w-1/4">${person.name}</td><td><textarea class="instr-note styled-input w-full h-12" placeholder="Instructions..."></textarea></td></tr>`;
    });
};

window.saveSchedule = async () => {
    const date = document.getElementById('serviceDate').value;
    const order = [];
    document.querySelectorAll('.service-block').forEach(b => {
        if (b.classList.contains('song-block')) {
            order.push({ type: "song", title: b.querySelector('.song-title').value, key: b.querySelector('.song-key').value, notes: b.querySelector('.song-note').value });
        } else {
            order.push({ type: "item", title: b.querySelector('.item-title').value });
        }
    });
    await addDoc(collection(db, "services"), { date, worshipLeader: worshipLeaderName, order });
    alert("✅ Service saved");
};

window.emailSchedule = async () => {
    const date = document.getElementById('serviceDate').value || "TBC";
    
    // 1. GENERATE RICH HTML CONTENT
    let htmlEmail = `
        <div style="font-family: Arial, sans-serif; color: #333; max-width: 600px; border: 1px solid #f0f0f0; padding: 25px; background-color: #ffffff;">
            <img src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media&token=ea8cd929-6f35-4a23-9ffa-e78ac46fa300" style="height: 50px; margin-bottom: 20px;">
            <h1 style="color: #2c6999; margin: 0; font-size: 26px; font-weight: 800;">Sunday Worship Plan</h1>
            <p style="text-transform: uppercase; font-weight: bold; color: #999; letter-spacing: 1px; font-size: 11px; margin-bottom: 30px;">${date} | Worship Leader: ${worshipLeaderName}</p>
            
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
                <thead>
                    <tr><th colspan="2" style="text-align: left; border-bottom: 2px solid #2c6999; padding-bottom: 8px; color: #2c6999; text-transform: uppercase; font-size: 14px;">Service Team</th></tr>
                </thead>
                <tbody>
    `;

    let rosterNames = [];
    document.querySelectorAll('#teamBody tr').forEach(row => {
        const role = row.children[0]?.innerText || "";
        const name = row.children[1]?.innerText || "";
        if(name && name !== "None") rosterNames.push(name.trim());
        htmlEmail += `<tr><td style="padding: 10px 0; border-bottom: 1px solid #eee; font-weight: bold; color: #2c6999; width: 40%; font-size: 14px;">${role}</td><td style="padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px;">${name}</td></tr>`;
    });

    htmlEmail += `</tbody></table><h2 style="text-align: left; border-bottom: 2px solid #2c6999; padding-bottom: 8px; color: #2c6999; text-transform: uppercase; font-size: 14px; margin-bottom: 15px;">Order of Service</h2>`;

    const blocks = document.querySelectorAll('.service-block');
    let songIdx = 1;
    for (const b of blocks) {
        if (b.classList.contains('song-block')) {
            const title = b.querySelector('.song-title').value;
            const key = b.querySelector('.song-key').value;
            const notes = b.querySelector('.song-note').value;
            if (!title) continue;

            htmlEmail += `
                <div style="padding: 15px 0; border-bottom: 1px solid #f9f9f9;">
                    <div style="font-weight: 800; font-size: 15px; color: #333;">${songIdx}. ${title} <span style="color: #2c6999; font-weight: 400;">[Key: ${key || '?'}]</span></div>
                    ${notes ? `<div style="font-style: italic; font-size: 12px; color: #777; margin-top: 4px;">Note: ${notes}</div>` : ''}
            `;

            const docId = title.toLowerCase().replace(/\s+/g, "-").trim();
            const snap = await getDoc(doc(db, "songs", docId));
            if (snap.exists()) {
                const data = snap.data();
                htmlEmail += `<div style="margin-top: 10px; font-size: 12px;">`;
                if (data.youtube) htmlEmail += `<a href="${data.youtube}" style="color: #d9534f; text-decoration: none; font-weight: bold; margin-right: 15px;">YouTube Link</a>`;
                if (data.ccli) htmlEmail += `<a href="https://songselect.ccli.com/Songs/${data.ccli}" style="color: #5bc0de; text-decoration: none; font-weight: bold;">SongSelect</a>`;
                
                if (data.files && key) {
                    const files = data.files.filter(f => f.key && f.key.trim().toLowerCase() === key.trim().toLowerCase());
                    files.forEach(f => {
                        htmlEmail += `<div style="margin-top: 6px; color: #666;">Download ${f.type}: <a href="${f.url}" style="color: #2c6999; text-decoration: underline; font-weight: bold;">Click here</a></div>`;
                    });
                }
                htmlEmail += `</div>`;
            }
            htmlEmail += `</div>`;
            songIdx++;
        } else {
            const item = b.querySelector('.item-title').value;
            if (item) htmlEmail += `<div style="padding: 12px; font-weight: bold; background: #f4f7f9; border-left: 4px solid #2c6999; margin: 15px 0; font-size: 13px; color: #2c6999;">${item.toUpperCase()}</div>`;
        }
    }

    htmlEmail += `<p style="margin-top: 40px; font-size: 10px; color: #bbb; text-align: center;">Generated via EGBC Worship Planner</p></div>`;

    // 2. CLIPBOARD MAGIC (RICH TEXT)
    const type = "text/html";
    const blob = new Blob([htmlEmail], { type });
    const dataTransfer = [new ClipboardItem({ [type]: blob })];

    try {
        await navigator.clipboard.write(dataTransfer);
        
        // 3. LAUNCH OUTLOOK WITH FILLED RECIPIENTS
        let recipients = [];
        addressBook.forEach(p => {
            if ((rosterNames.includes(p.name?.trim()) || (p.markers && p.markers.includes("Core Team"))) && p.email) {
                recipients.push(p.email);
            }
        });
        const to = [...new Set(recipients)].join(",");
        
        alert("Plan copied to clipboard!\n\nI'm launching Outlook now. Just click the email body and press Ctrl+V to paste your contemporary layout.");
        window.location.href = `mailto:${to}?subject=${encodeURIComponent("Sunday Worship Plan: " + date)}`;
    } catch (e) {
        alert("Error: Clipboard access denied. Please try again.");
    }
};
</script>

<script>
    function launchEmail() { if (window.emailSchedule) window.emailSchedule(); }
</script>

</head>
<body class="p-4 md:p-12">
<div class="max-w-[1200px] mx-auto space-y-10">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
        <div class="flex items-center gap-6">
            <img src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media&token=ea8cd929-6f35-4a23-9ffa-e78ac46fa300" alt="Logo" class="h-16 w-auto">
            <div>
                <h1 class="text-3xl font-extrabold text-[#2c6999] tracking-tight">Worship Planner</h1>
                <p class="text-sm font-bold text-gray-400 uppercase tracking-widest mt-1">Leader: <span id="leaderName" class="text-[#2c6999]">None</span></p>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-3 w-full md:w-auto">
            <input type="date" id="serviceDate" onchange="loadRota()" class="styled-input text-sm">
            <select id="eventSelect" onchange="selectEvent()" class="styled-input text-sm"><option value="">Select Service...</option></select>
            <input id="serviceType" class="styled-input text-sm" placeholder="Service Type">
        </div>
    </div>
    <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
        <h2 class="text-xl font-extrabold text-[#2c6999] mb-6">Service Team & Roles</h2>
        <div class="overflow-x-auto"><table class="rota-table"><thead><tr><th>Role</th><th>Assigned Member</th><th>Notes</th></tr></thead><tbody id="teamBody"></tbody></table></div>
    </div>
    <div class="space-y-6">
        <div class="flex justify-between items-center px-4">
            <h2 class="text-xl font-extrabold text-[#2c6999]">Order of Service</h2>
            <div class="flex gap-2">
                <button onclick="addSong()" class="btn-secondary text-sm !py-2">+ Add Song</button>
                <button onclick="addItem()" class="btn-secondary text-sm !py-2">+ Add Item</button>
            </div>
        </div>
        <div id="service-order" class="space-y-2"></div>
    </div>
    <div class="flex justify-center gap-6 pt-6 pb-12">
        <button onclick="saveSchedule()" class="btn-primary w-48 shadow-lg shadow-blue-200">Save Schedule</button>
        <button onclick="launchEmail()" class="btn-secondary w-48">Email Team</button>
    </div>
</div>
</body>
</html>
