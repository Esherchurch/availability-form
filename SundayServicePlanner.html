<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Sunday Worship Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>
body { font-family: 'Montserrat', sans-serif; background-color: #f0f4f8; }
.styled-input { background-color: #ffffff; border: 2px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem 1rem; font-weight: 600; color: #2c6999; transition: all 0.2s; }
.styled-input:focus { outline: none; border-color: #2c6999; box-shadow: 0 0 0 3px rgba(44, 105, 153, 0.1); }
.btn-primary { background-color: #2c6999; color: white; padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.btn-secondary { background-color: #ffffff; color: #2c6999; border: 2px solid #2c6999; padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-weight: 700; }
.drag-handle { cursor: grab; color: #cbd5e1; font-size: 1.5rem; display: flex; align-items: center; }
.rota-table { width: 100%; border-collapse: separate; border-spacing: 0 0.5rem; }
.rota-table th { text-align: left; padding: 1rem; color: #64748b; font-size: 0.875rem; text-transform: uppercase; }
.rota-table tr { background-color: white; }
.rota-table td { padding: 1rem; }
textarea { resize: none; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
    apiKey: "AIzaSy...",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
});
const db = getFirestore(app);

let worshipLeaderName = "";
let eventsForDay = [];
let addressBook = [];

window.onload = async () => {
    Sortable.create(document.getElementById('service-order'), { animation:150, handle:'.drag-handle' });

    const snap = await getDocs(collection(db,"addressBook"));
    snap.forEach(d => addressBook.push(d.data()));
};

window.loadRota = async () => {
    const date = document.getElementById('serviceDate').value;
    const snap = await getDocs(collection(db,"events"));

    eventsForDay=[];
    snap.forEach(d=>{
        const ev=d.data();
        if(ev.date===date && ev.archived!==true) eventsForDay.push(ev);
    });

    const select=document.getElementById('eventSelect');
    select.innerHTML='<option value="">Select Service...</option>';
    eventsForDay.forEach((ev,i)=>{
        select.innerHTML+=`<option value="${i}">${ev.type}</option>`;
    });
};

window.selectEvent = async () => {
    const index=document.getElementById('eventSelect').value;
    if(index==="") return;

    const data=eventsForDay[index];

    document.getElementById('serviceType').value=data.type||"";
    document.getElementById('serviceTypeNotes').value=data.description||"";
    document.getElementById('serviceTime').value=data.time||""; // ✅ FIX

    worshipLeaderName=data.assignments?.["Worship Leader"]?.name||"None";
    document.getElementById('leaderName').innerText=worshipLeaderName;

    const teamBody=document.getElementById('teamBody');
    teamBody.innerHTML='';

    const rawAssignments = Object.entries(data.assignments || {});
    const assignmentsArray = [];
    let otherCount = 1;

    rawAssignments.forEach(([role, person]) => {
        if (role === "Other") {
            assignmentsArray.push([`Other ${otherCount++}`, person]);
        } else {
            assignmentsArray.push([role, person]);
        }
    });

    ["Singer 1","Singer 2","Singer 3"].forEach(role=>{
        if(!assignmentsArray.find(r=>r[0]===role)){
            assignmentsArray.push([role,{name:""}]);
        }
    });

    assignmentsArray.forEach(([role,person])=>{
        teamBody.innerHTML+=`
        <tr>
            <td>${role}</td>
            <td>${(person.name||"").replace(/'/g,"&#39;")}</td>
            <td><textarea class="instr-note styled-input w-full h-12"></textarea></td>
        </tr>`;
    });

    if(window.initRoleDragDrop){
        window.initRoleDragDrop();
    }
};

window.saveSchedule = async () => {
    const date=document.getElementById('serviceDate').value;
    const time=document.getElementById('serviceTime').value; // ✅ FIX

    await addDoc(collection(db,"services"),{
        date,
        time, // ✅ FIX
        worshipLeader:worshipLeaderName,
        serviceType:document.getElementById('serviceType').value
    });

    alert("Saved");
};
</script>
</head>

<body class="p-4 md:p-12">

<div class="max-w-[1200px] mx-auto space-y-10">

<div class="grid grid-cols-2 gap-3">
    <input type="date" id="serviceDate" onchange="loadRota()" class="styled-input">
    <input type="time" id="serviceTime" class="styled-input"> <!-- ✅ FIX -->
    <select id="eventSelect" onchange="selectEvent()" class="styled-input"></select>
    <input id="serviceType" class="styled-input">
</div>

<div class="bg-white p-8 rounded">
    <table class="rota-table">
        <tbody id="teamBody"></tbody>
    </table>
</div>

<button onclick="saveSchedule()" class="btn-primary">Save</button>

</div>

</body>
</html>
