<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Sunday Worship Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let worshipLeaderName = "";
let eventsForDay = [];

const ALL_KEYS = ["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B"];

window.onload = () => {
    Sortable.create(document.getElementById('service-order'), { animation: 150 });
    setupDefaultOrder();
};

function setupDefaultOrder() {
    addSong(); addSong(); addSong();
    addItem("Welcome and Notices");
    addSong();
    addItem("Message");
    addSong(); addSong(); addSong();
}

// =======================
// SONG BLOCK
// =======================
window.addSong = () => {
    const container = document.getElementById('service-order');
    const id = Math.random().toString(36).substr(2, 9);

    const div = document.createElement('div');

    div.className = "service-block song-block bg-white p-6 mb-4 rounded-[2rem] border border-gray-100 shadow-sm flex gap-4";

    div.innerHTML = `
        <div class="drag-handle">⠿</div>
        <div class="flex-grow grid grid-cols-1 md:grid-cols-3 gap-4">

            <div class="relative">
                <input oninput="searchSong(this,'${id}')" class="song-title bg-[#f8fafc] p-3 rounded-xl font-bold w-full" placeholder="Song title">
                <div id="suggest-${id}" class="absolute bg-white shadow rounded w-full hidden z-50"></div>
            </div>

            <select onchange="keyChanged('${id}')" class="song-key bg-[#f8fafc] p-3 rounded-xl font-bold">
                <option value="">Key</option>
                ${ALL_KEYS.map(k => `<option>${k}</option>`).join('')}
            </select>

            <textarea class="song-note md:col-span-3 bg-[#f8fafc] p-3 rounded-xl"></textarea>

            <div class="md:col-span-3" id="files-${id}"></div>

        </div>
        <button onclick="this.parentElement.remove()">×</button>
    `;

    container.appendChild(div);
    return id;
};

// =======================
// NEW: KEY INFO
// =======================
async function showKeyInfo(id, title) {
    const container = document.getElementById(`files-${id}`);

    const docId = title.toLowerCase().replace(/\s+/g, "-");
    const snap = await getDoc(doc(db, "songs", docId));

    if (!snap.exists()) return;

    const files = snap.data().files || [];

    const chordKeys = files
        .filter(f => f.type === "Chord Sheet" && f.key)
        .map(f => f.key);

    const uniqueKeys = [...new Set(chordKeys)];

    let available = uniqueKeys.sort().join(", ") || "None";
    const missing = ALL_KEYS.filter(k => !uniqueKeys.includes(k)).join(", ");

    container.innerHTML = `
        <div class="text-xs mt-2">
            <span class="text-green-600 font-bold">Available:</span> ${available}<br>
            <span class="text-red-400">Missing:</span> ${missing}
        </div>
    `;
}

// =======================
// NEW: PREFERRED KEY
// =======================
async function getPreferredKey(title, leader) {

    const snap = await getDocs(collection(db, "services"));

    let lastKey = "";

    snap.forEach(doc => {
        const data = doc.data();

        if (data.worshipLeader !== leader) return;

        (data.order || []).forEach(item => {
            if (item.type === "song" && item.title === title) {
                lastKey = item.key;
            }
        });
    });

    return lastKey;
}

// =======================
// SONG SEARCH
// =======================
window.searchSong = async (input, id) => {
    const val = input.value.toLowerCase();
    const box = document.getElementById(`suggest-${id}`);

    if (val.length < 2) {
        box.classList.add('hidden');
        return;
    }

    const snap = await getDocs(collection(db, "songs"));

    const matches = snap.docs
        .map(d => d.data())
        .filter(song => song.title.toLowerCase().includes(val))
        .slice(0, 10);

    box.innerHTML = matches.map(s => `
        <div onclick="selectSong('${s.title}','${id}')" class="p-2 hover:bg-gray-100 cursor-pointer text-xs">
            ${s.title}
        </div>
    `).join('');

    box.classList.remove('hidden');
};

// =======================
// SELECT SONG (UPDATED)
// =======================
window.selectSong = async (title, id) => {
    const block = document.getElementById(`suggest-${id}`).closest('.song-block');
    block.querySelector('.song-title').value = title;
    document.getElementById(`suggest-${id}`).classList.add('hidden');

    document.getElementById(`files-${id}`).innerHTML = "";

    await showKeyInfo(id, title);

    if (worshipLeaderName && worshipLeaderName !== "None") {
        const preferred = await getPreferredKey(title, worshipLeaderName);

        if (preferred) {
            block.querySelector('.song-key').value = preferred;
            keyChanged(id);
        }
    }
};

// =======================
// FILE LOGIC (UPDATED)
// =======================
window.keyChanged = async (id) => {

    const block = document.getElementById(`files-${id}`).closest('.song-block');

    const title = block.querySelector('.song-title').value;
    const key = block.querySelector('.song-key').value;

    const container = document.getElementById(`files-${id}`);

    if (!title || !key) {
        container.innerHTML = "";
        return;
    }

    const docId = title.toLowerCase().replace(/\s+/g, "-");
    const snap = await getDoc(doc(db, "songs", docId));

    if (!snap.exists()) {
        container.innerHTML = "";
        return;
    }

    const data = snap.data();

    const youtube = data.youtube || "";
    const ccli = data.ccli || "";

    const songSelectLink = ccli
        ? `https://songselect.ccli.com/Songs/${ccli}`
        : `https://songselect.ccli.com/search/results?search=${encodeURIComponent(title)}`;

    const allFiles = data.files || [];

    const selectedKey = key.trim().toLowerCase();

    const files = allFiles.filter(f => {
        if (!f.key) return false;
        return f.key.trim().toLowerCase() === selectedKey;
    });

    const grouped = {};

    files.forEach(f => {
        if (!grouped[f.type]) grouped[f.type] = [];
        grouped[f.type].push(f);
    });

    let html = "";

    html += `
        <div class="text-xs mb-2 flex gap-3 flex-wrap">
            ${youtube ? `<a href="${youtube}" target="_blank" class="text-blue-600">🎬 YouTube</a>` : `<span class="text-gray-400">No YouTube</span>`}
            <a href="${songSelectLink}" target="_blank" class="text-purple-600">🔎 SongSelect</a>
            ${ccli ? `<span class="text-gray-500">CCLI: ${ccli}</span>` : `<span class="text-gray-400">No CCLI</span>`}
        </div>
    `;

    if (files.length === 0) {
        html += `<div class="text-xs text-red-400">No files for this key</div>`;
        container.innerHTML = html;
        return;
    }

    Object.keys(grouped).forEach(type => {
        html += `<div class="mt-2 text-xs font-bold">${type}</div>`;
        grouped[type].forEach(file => {
            html += `<a href="${file.url}" target="_blank"
                class="inline-block text-xs bg-[#2c6999] text-white px-2 py-1 rounded mr-1 mt-1">
                Open
            </a>`;
        });
    });

    container.innerHTML = html;
};

// =======================
// EVERYTHING ELSE UNCHANGED
// =======================
window.addItem = (val="") => {
    const div = document.createElement('div');
    div.className = "service-block item-block bg-[#f0f4f7] p-6 mb-4 rounded-[2rem] flex gap-4";
    div.innerHTML = `
        <div class="drag-handle">⠿</div>
        <input value="${val}" class="item-title flex-grow bg-transparent font-bold text-[#2c6999]">
        <button onclick="this.parentElement.remove()">×</button>
    `;
    document.getElementById('service-order').appendChild(div);
};

window.loadRota = async () => {
    const date = document.getElementById('serviceDate').value;

    const snap = await getDocs(collection(db, "events"));

    eventsForDay = [];

    snap.forEach(d => {
        const ev = d.data();
        if (ev.date === date && ev.archived !== true) {
            eventsForDay.push(ev);
        }
    });

    const select = document.getElementById('eventSelect');
    select.innerHTML = '<option value="">Select Service...</option>';

    eventsForDay.forEach((ev, i) => {
        select.innerHTML += `<option value="${i}">${ev.type}</option>`;
    });
};

window.selectEvent = async () => {
    const index = document.getElementById('eventSelect').value;
    if (index === "") return;

    const data = eventsForDay[index];

    document.getElementById('serviceType').value = data.type || "";
    document.getElementById('serviceTypeNotes').value = data.description || "";

    worshipLeaderName = data.assignments?.["Worship Leader"]?.name || "None";
    document.getElementById('leaderName').innerText = worshipLeaderName;

    const teamBody = document.getElementById('teamBody');
    teamBody.innerHTML = '';

    Object.entries(data.assignments || {}).forEach(([role, person]) => {
        teamBody.innerHTML += `
            <tr>
                <td>${role}</td>
                <td>${person.name}</td>
                <td><textarea class="instr-note w-full bg-[#f8fafc] p-3 rounded-xl"></textarea></td>
            </tr>`;
    });

    const q = query(collection(db, "services"), where("date", "==", data.date));
    const snap = await getDocs(q);

    if (!snap.empty) {
        const saved = snap.docs[0].data();

        const container = document.getElementById('service-order');
        container.innerHTML = "";

        saved.order.forEach(item => {
            if (item.type === "song") {
                const id = addSong();
                const last = container.lastChild;
                last.querySelector('.song-title').value = item.title;
                last.querySelector('.song-key').value = item.key;
                last.querySelector('.song-note').value = item.notes;

                showKeyInfo(id, item.title);
                keyChanged(id);
            } else {
                addItem(item.title);
            }
        });
    }
};

window.saveSchedule = async () => {
    const date = document.getElementById('serviceDate').value;

    const blocks = document.querySelectorAll('.service-block');
    const order = [];

    blocks.forEach(b => {
        if (b.classList.contains('song-block')) {
            order.push({
                type: "song",
                title: b.querySelector('.song-title').value,
                key: b.querySelector('.song-key').value,
                notes: b.querySelector('.song-note').value
            });
        } else {
            order.push({
                type: "item",
                title: b.querySelector('.item-title').value
            });
        }
    });

    await addDoc(collection(db, "services"), {
        date,
        worshipLeader: worshipLeaderName,
        serviceType: document.getElementById('serviceType').value,
        serviceNotes: document.getElementById('serviceTypeNotes').value,
        order
    });

    alert("✅ Service saved");
};

window.emailSchedule = () => {
    alert("Email function coming next");
};
</script>
</head>

<body class="p-8 bg-[#f7f9fb] font-montserrat">

<div class="max-w-[1400px] mx-auto space-y-8">

<div class="flex justify-between border-b pb-6">
<div>
<h1 class="text-4xl font-extrabold text-[#2c6999]">Service Planner</h1>
<p>Leader: <span id="leaderName">None</span></p>
</div>

<div class="flex gap-4">
<input type="date" id="serviceDate" onchange="loadRota()">

<select id="eventSelect" onchange="selectEvent()">
<option>Select Service...</option>
</select>

<input id="serviceType">
<input id="serviceTypeNotes">
</div>
</div>

<textarea id="introBox" class="w-full h-20 bg-white p-4 rounded"></textarea>

<div>
<button onclick="addSong()">+ Song</button>
<button onclick="addItem()">+ Item</button>
<div id="service-order"></div>
</div>

<table class="w-full">
<thead>
<tr><th>Role</th><th>Name</th><th>Notes</th></tr>
</thead>
<tbody id="teamBody"></tbody>
</table>

<textarea id="outroBox" class="w-full h-20 bg-white p-4 rounded"></textarea>

<div class="flex gap-4">
<button onclick="saveSchedule()">Save</button>
<button onclick="emailSchedule()">Email</button>
</div>

</div>
</body>
</html>
