<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Sunday Worship Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let worshipLeaderName = "";
let eventsForDay = [];

const ALL_KEYS = ["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B"];

window.onload = () => {
    Sortable.create(document.getElementById('service-order'), { animation: 150 });
};

// 🔥 SAVE FUNCTION (FIXED + SAFE)
window.saveSchedule = async () => {

    try {

        const date = document.getElementById('serviceDate').value;

        if (!date) {
            alert("⚠️ Please select a date before saving");
            return;
        }

        const blocks = document.querySelectorAll('.service-block');
        const order = [];

        blocks.forEach(b => {
            if (b.classList.contains('song-block')) {
                order.push({
                    type: "song",
                    title: b.querySelector('.song-title').value || "",
                    key: b.querySelector('.song-key').value || "",
                    notes: b.querySelector('.song-note').value || ""
                });
            } else {
                order.push({
                    type: "item",
                    title: b.querySelector('.item-title').value || ""
                });
            }
        });

        await addDoc(collection(db, "services"), {
            date,
            worshipLeader: worshipLeaderName || "",
            serviceType: document.getElementById('serviceType').value || "",
            serviceNotes: document.getElementById('serviceTypeNotes').value || "",
            order,
            created: new Date().toISOString()
        });

        alert("✅ Service saved");

    } catch (err) {
        console.error(err);
        alert("❌ Save failed — check console");
    }
};

// 🔥 EMAIL (SEPARATE — SAFE)
window.emailSchedule = () => {
    alert("Email function coming next — save is separate 👍");
};
</script>
</head>

<body class="p-8 bg-[#f7f9fb] font-montserrat">

<div class="max-w-[1400px] mx-auto space-y-8">

<div class="flex justify-between border-b pb-6">
<div>
<h1 class="text-4xl font-extrabold text-[#2c6999]">Service Planner</h1>
<p>Leader: <span id="leaderName">None</span></p>
</div>

<div class="flex gap-4">
<input type="date" id="serviceDate">
<input id="serviceType" placeholder="Service Type">
<input id="serviceTypeNotes" placeholder="Description">
</div>
</div>

<div>
<button onclick="saveSchedule()" class="bg-green-600 text-white px-4 py-2 rounded">Save</button>
<button onclick="emailSchedule()" class="bg-blue-600 text-white px-4 py-2 rounded">Email</button>
</div>

</div>
</body>
</html>
