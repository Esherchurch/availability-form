<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Sunday Worship Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ALL_KEYS = ["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B"];

window.addSong = () => {
    const container = document.getElementById('service-order');
    const id = Math.random().toString(36).substr(2, 9);

    const div = document.createElement('div');

    div.className = "service-block song-block bg-white p-6 mb-4 rounded-[2rem] flex gap-4";

    div.innerHTML = `
        <div class="drag-handle">⠿</div>

        <div class="flex-grow grid grid-cols-1 md:grid-cols-3 gap-4">

            <div class="relative">
                <input oninput="searchSong(this,'${id}')" 
                class="song-title p-3 rounded-xl w-full"
                placeholder="Song title">
                <div id="suggest-${id}" class="absolute bg-white shadow rounded w-full hidden"></div>
            </div>

            <select onchange="onKeyChange('${id}')" class="song-key p-3 rounded-xl">
                <option value="">Key</option>
                ${ALL_KEYS.map(k => `<option>${k}</option>`).join('')}
            </select>

            <textarea class="song-note md:col-span-3 p-3 rounded-xl"></textarea>

            <div class="md:col-span-3" id="files-${id}"></div>

        </div>
    `;

    container.appendChild(div);
};

window.selectSong = (title, id) => {
    const block = document.getElementById(`suggest-${id}`).closest('.song-block');
    block.querySelector('.song-title').value = title;
    document.getElementById(`suggest-${id}`).classList.add('hidden');

    // DO NOT load files yet
};

window.onKeyChange = async (id) => {

    const block = document.getElementById(`files-${id}`).closest('.song-block');

    const title = block.querySelector('.song-title').value;
    const key = block.querySelector('.song-key').value;

    if (!title || !key) return;

    const container = document.getElementById(`files-${id}`);

    const docId = title.toLowerCase().replace(/\s+/g, "-");
    const snap = await getDoc(doc(db, "songs", docId));

    if (!snap.exists()) {
        container.innerHTML = "";
        return;
    }

    const files = snap.data().files || [];

    // 🔥 FILTER BY KEY
    const filtered = files.filter(f => f.key === key);

    if (!filtered.length) {
        container.innerHTML = `<div class="text-xs text-red-400">No files for this key</div>`;
        return;
    }

    const grouped = {};

    filtered.forEach(f => {
        if (!grouped[f.type]) grouped[f.type] = [];
        grouped[f.type].push(f);
    });

    let html = "";

    Object.keys(grouped).forEach(type => {
        html += `<div class="mt-2 text-xs font-bold">${type}</div>`;

        grouped[type].forEach(file => {
            html += `
                <a href="${file.url}" target="_blank"
                class="inline-block text-xs bg-[#2c6999] text-white px-2 py-1 rounded mr-1 mt-1">
                Open
                </a>`;
        });
    });

    container.innerHTML = html;
};
</script>
</head>

<body class="p-8 bg-[#f7f9fb]">

<div id="service-order"></div>

<button onclick="addSong()">+ Song</button>

</body>
</html>
