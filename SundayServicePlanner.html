<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Sunday Worship Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let worshipLeaderName = "";
let eventsForDay = [];

const ALL_KEYS = ["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B"];

window.onload = () => {
    Sortable.create(document.getElementById('service-order'), { animation: 150 });
    setupDefaultOrder();
};

function setupDefaultOrder() {
    addSong(); addSong(); addSong();
    addItem("Welcome and Notices");
    addSong();
    addItem("Message");
    addSong(); addSong(); addSong();
}

// =======================
// SONG BLOCK
// =======================
window.addSong = () => {
    const container = document.getElementById('service-order');
    const id = Math.random().toString(36).substr(2, 9);

    const div = document.createElement('div');

    div.className = "service-block song-block bg-white p-6 mb-4 rounded-[2rem] border border-gray-100 shadow-sm flex gap-4";

    div.innerHTML = `
        <div class="drag-handle">⠿</div>
        <div class="flex-grow grid grid-cols-1 md:grid-cols-3 gap-4">

            <div class="relative">
                <input oninput="searchSong(this,'${id}')" class="song-title bg-[#f8fafc] p-3 rounded-xl font-bold w-full" placeholder="Song title">
                <div id="suggest-${id}" class="absolute bg-white shadow rounded w-full hidden z-50"></div>
            </div>

            <select onchange="keyChanged('${id}')" class="song-key bg-[#f8fafc] p-3 rounded-xl font-bold">
                <option value="">Key</option>
                ${ALL_KEYS.map(k => `<option>${k}</option>`).join('')}
            </select>

            <textarea class="song-note md:col-span-3 bg-[#f8fafc] p-3 rounded-xl"></textarea>

            <div class="md:col-span-3" id="files-${id}"></div>

        </div>
        <button onclick="this.parentElement.remove()">×</button>
    `;

    container.appendChild(div);
    return id;
};

// =======================
// NEW: KEY INFO
// =======================
async function showKeyInfo(id, title) {
    const container = document.getElementById(`files-${id}`);

    const docId = title.toLowerCase().replace(/\s+/g, "-");
    const snap = await getDoc(doc(db, "songs", docId));

    if (!snap.exists()) return;

    const files = snap.data().files || [];

    const chordKeys = files
        .filter(f => f.type === "Chord Sheet" && f.key)
        .map(f => f.key);

    const uniqueKeys = [...new Set(chordKeys)];

    let available = uniqueKeys.sort().join(", ") || "None";
    const missing = ALL_KEYS.filter(k => !uniqueKeys.includes(k)).join(", ");

    container.innerHTML = `
        <div class="text-xs mt-2">
            <span class="text-green-600 font-bold">Available:</span> ${available}<br>
            <span class="text-red-400">Missing:</span> ${missing}
        </div>
    `;
}

// =======================
// NEW: PREFERRED KEY
// =======================
async function getPreferredKey(title, leader) {

    const snap = await getDocs(collection(db, "services"));

    let lastKey = "";

    snap.forEach(doc => {
        const data = doc.data();

        if (data.worshipLeader !== leader) return;

        (data.order || []).forEach(item => {
            if (item.type === "song" && item.title === title) {
                lastKey = item.key;
            }
        });
    });

    return lastKey;
}

// =======================
// SONG SEARCH
// =======================
window.searchSong = async (input, id) => {
    const val = input.value.toLowerCase();
    const box = document.getElementById(`suggest-${id}`);

    if (val.length < 2) {
        box.classList.add('hidden');
        return;
    }

    const snap = await getDocs(collection(db, "songs"));

    const matches = snap.docs
        .map(d => d.data())
        .filter(song => song.title.toLowerCase().includes(val))
        .slice(0, 10);

    box.innerHTML = matches.map(s => `
        <div onclick="selectSong('${s.title}','${id}')" class="p-2 hover:bg-gray-100 cursor-pointer text-xs">
            ${s.title}
        </div>
    `).join('');

    box.classList.remove('hidden');
};

// =======================
// SELECT SONG (UPDATED)
// =======================
window.selectSong = async (title, id) => {
    const block = document.getElementById(`suggest-${id}`).closest('.song-block');
    block.querySelector('.song-title').value = title;
    document.getElementById(`suggest-${id}`).classList.add('hidden');

    document.getElementById(`files-${id}`).innerHTML = "";

    await showKeyInfo(id, title);

    if (worshipLeaderName && worshipLeaderName !== "None") {
        const preferred = await getPreferredKey(title, worshipLeaderName);

        if (preferred) {
            block.querySelector('.song-key').value = preferred;
            keyChanged(id);
        }
    }
};

// =======================
// FILE LOGIC (UPDATED)
// =======================
window.keyChanged = async (id) => {

    const block = document.getElementById(`files-${id}`).closest('.song-block');

    const title = block.querySelector('.song-title').value;
    const key = block.querySelector('.song-key').value;

    const container = document.getElementById(`files-${id}`);

    if (!title || !key) {
        container.innerHTML = "";
        return;
    }

    const docId = title.toLowerCase().replace(/\s+/g, "-");
    const snap = await getDoc(doc(db, "songs", docId));

    if (!snap.exists()) {
        container.innerHTML = "";
        return;
    }

    const data = snap.data();

    const youtube = data.youtube || "";
    const ccli = data.ccli || "";

    const songSelectLink = ccli
        ? `https://songselect.ccli.com/Songs/${ccli}`
        : `https://songselect.ccli.com/search/results?search=${encodeURIComponent(title)}`;

    const allFiles = data.files || [];

    const selectedKey = key.trim().toLowerCase();

    const files = allFiles.filter(f => {
        if (!f.key) return false;
        return f.key.trim().toLowerCase() === selectedKey;
    });

    const grouped = {};

    files.forEach(f => {
        if (!grouped[f.type]) grouped[f.type] = [];
        grouped[f.type].push(f);
    });

    let html = "";

    // ✅ ADDED LINKS
    html += `
        <div class="text-xs mb-2 flex gap-3 flex-wrap">
            ${youtube ? `<a href="${youtube}" target="_blank" class="text-blue-600">🎬 YouTube</a>` : `<span class="text-gray-400">No YouTube</span>`}
            <a href="${songSelectLink}" target="_blank" class="text-purple-600">🔎 SongSelect</a>
            ${ccli ? `<span class="text-gray-500">CCLI: ${ccli}</span>` : `<span class="text-gray-400">No CCLI</span>`}
        </div>
    `;

    if (files.length === 0) {
        html += `<div class="text-xs text-red-400">No files for this key</div>`;
        container.innerHTML = html;
        return;
    }

    Object.keys(grouped).forEach(type => {
        html += `<div class="mt-2 text-xs font-bold">${type}</div>`;
        grouped[type].forEach(file => {
            html += `<a href="${file.url}" target="_blank"
                class="inline-block text-xs bg-[#2c6999] text-white px-2 py-1 rounded mr-1 mt-1">
                Open
            </a>`;
        });
    });

    container.innerHTML = html;
};
