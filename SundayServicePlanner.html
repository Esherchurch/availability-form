<script type="module">

import { getFirestore, collection, getDocs, addDoc, query, where, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let worshipLeaderName = "";
let eventsForDay = [];
let addressBook = [];

const ALL_KEYS = ["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B"];

window.onload = async () => {
    Sortable.create(document.getElementById('service-order'), { 
        animation: 150,
        handle: '.drag-handle',
        onEnd: function() {
            updateSongNumbers();
        }
    });
    setupDefaultOrder();

    try {
        const emailSnap = await getDocs(collection(db, "addressBook"));
        emailSnap.forEach(doc => {
            const data = doc.data();
            if (data.email) addressBook.push(data);
        });
    } catch (e) { console.error("Address book load failed", e); }
};

function setupDefaultOrder() {
    addSong();
    addSong();
    addSong();
    addItem("Welcome and Notices");
    addSong();
    addItem("Message");
    addSong(); addSong(); addSong();
}

window.updateSongNumbers = () => {
    const songs = document.querySelectorAll('.song-block');
    songs.forEach((song, index) => {
        const label = song.querySelector('.song-number');
        if (label) {
            label.innerText = "Song " + (index + 1);
        }
    });
}

window.toggleSong = (btn) => {
    const block = btn.closest('.song-block');
    const content = block.querySelector('.song-content');
    block.classList.toggle('is-collapsed');
    content.classList.toggle('hidden');
    btn.innerText = content.classList.contains('hidden') ? "▶" : "▼";
};

window.addSong = () => {
    const container = document.getElementById('service-order');
    const id = Math.random().toString(36).substr(2, 9);
    
    const isFirst = container.querySelectorAll('.song-block').length === 0;
    const collapseClass = isFirst ? "" : "is-collapsed";
    const contentClass = isFirst ? "" : "hidden";
    const arrow = isFirst ? "▼" : "▶";

    const div = document.createElement('div');
    div.className = `service-block song-block bg-white p-6 mb-4 rounded-[1.5rem] shadow-sm border border-white hover:border-blue-100 transition-colors ${collapseClass}`;

    div.innerHTML = `
        <div class="flex gap-4 items-center mb-2">
            <div class="drag-handle">⠿</div>
            <button onclick="toggleSong(this)" class="collapse-btn text-[#2c6999] font-bold w-6">${arrow}</button>
            <span class="song-number text-[10px] font-extrabold uppercase tracking-widest text-gray-400 min-w-[50px]">Song</span>
            <div class="relative flex-grow">
                <input oninput="searchSong(this,'${id}')" class="song-title styled-input w-full" placeholder="Song title">
                <div id="suggest-${id}" class="absolute bg-white shadow-xl rounded-xl w-full hidden z-50 mt-1 border border-gray-100 overflow-hidden"></div>
            </div>
            <div id="serving-container-${id}" class="serving-display px-3 py-2 rounded-lg font-bold text-[#2c6999]"></div>
            <select onchange="keyChanged('${id}')" class="song-key styled-input w-32">
                <option value="">Key</option>
                ${ALL_KEYS.map(k => `<option>${k}</option>`).join('')}
            </select>
            <button onclick="this.parentElement.parentElement.remove(); updateSongNumbers();" class="text-gray-300 hover:text-red-500 text-2xl font-bold">&times;</button>
        </div>

        <div class="song-content ml-14 space-y-4 ${contentClass}">
            <textarea class="song-note styled-input w-full h-20" placeholder="Notes for the band..."></textarea>
            <div id="keyinfo-${id}"></div>
            <div id="files-${id}"></div>
        </div>
    `;
    container.appendChild(div);
    updateSongNumbers();
    return id;
};

async function showKeyInfo(id, title) {
    if (!title || title.trim() === "") return;
    const container = document.getElementById(`keyinfo-${id}`);
    const docId = title.toLowerCase().replace(/\s+/g, "-");
    const snap = await getDoc(doc(db, "songs", docId));
    if (!snap.exists()) return;
    const data = snap.data();
    const files = data.files || [];
    const chordKeys = files.filter(f => f.type === "Chord Sheet" && f.key).map(f => f.key);
    const uniqueKeys = [...new Set(chordKeys)];
    let available = uniqueKeys.sort().join(", ") || "None";
    const missing = ALL_KEYS.filter(k => !uniqueKeys.includes(k)).join(", ");
    container.innerHTML = `
        <div class="text-[10px] mt-2 bg-gray-50 p-3 rounded-lg flex flex-col gap-1">
            <div><span class="text-green-600 font-bold uppercase tracking-wider">Available:</span> <span class="text-gray-700">${available}</span></div>
            <div><span class="text-red-400 font-bold uppercase tracking-wider">Missing:</span> <span class="text-gray-500">${missing}</span></div>
        </div>
    `;

    const servingHistory = data.servingHistory || [];
    const sundayHistory = servingHistory.filter(s => s.day && s.day.toLowerCase() === 'sunday');
    
    if (sundayHistory.length > 0) {
        const counts = sundayHistory.map(s => s.count || 0);
        const maxSunday = Math.max(...counts);
        const display = document.getElementById(`serving-container-${id}`);
        const latestSunday = sundayHistory[0].count; 
        display.innerText = latestSunday;
        if (latestSunday === maxSunday) {
            display.classList.add('highlight-yellow');
        } else {
            display.classList.remove('highlight-yellow');
        }
    }
}

async function getPreferredKey(title, leader) {
    const snap = await getDocs(collection(db, "services"));
    let lastKey = "";
    snap.forEach(doc => {
        const data = doc.data();
        if (data.worshipLeader !== leader) return;
        (data.order || []).forEach(item => {
            if (item.type === "song" && item.title === title) {
                lastKey = item.key;
            }
        });
    });
    return lastKey;
}

window.searchSong = async (input, id) => {
    const val = input.value.toLowerCase().trim();
    const box = document.getElementById(`suggest-${id}`);
    if (val.length < 2) {
        box.classList.add('hidden');
        return;
    }
    const snap = await getDocs(collection(db, "songs"));
    const words = val.split(" ");
    const matches = snap.docs
        .map(d => d.data())
        .filter(song => {
            const title = (song.title || "").toLowerCase();
            const normalized = (song.normalized || "").toLowerCase();
            const lyrics = (song.lyrics || "").toLowerCase();
            return words.every(w =>
                title.includes(w) ||
                normalized.includes(w) ||
                lyrics.includes(w)
            );
        })
        .slice(0, 10);

    if (matches.length === 0) {
        const encoded = encodeURIComponent(input.value);
        box.innerHTML = `
            <div class="p-3 text-xs text-red-500 font-bold bg-red-50">Not in library</div>
            <div class="p-3 text-[11px] flex gap-3 flex-wrap bg-white">
                <a href="https://songselect.ccli.com/search/results?search=${encoded}" target="_blank" class="text-purple-600 hover:underline">🔎 SongSelect</a>
                <a href="https://www.youtube.com/results?search_query=${encoded}" target="_blank" class="text-blue-600 hover:underline">▶ YouTube</a>
                <a href="https://esherchurch.github.io/availability-form/music-uploader.html?title=${encoded}" target="_blank" class="text-green-600 hover:underline">➕ Upload Song</a>
            </div>
        `;
        box.classList.remove('hidden');
        return;
    }
    box.innerHTML = matches.map(s => `
        <div onclick="selectSong('${s.title.replace(/'/g, "\\'")}','${id}')" class="p-3 hover:bg-blue-50 cursor-pointer text-sm font-semibold text-gray-700 border-b border-gray-50 last:border-0">
            ${s.title}
        </div>
    `).join('');
    box.classList.remove('hidden');
};

window.selectSong = async (title, id) => {
    const block = document.getElementById(`suggest-${id}`).closest('.song-block');
    block.querySelector('.song-title').value = title;
    document.getElementById(`suggest-${id}`).classList.add('hidden');
    
    document.getElementById(`keyinfo-${id}`).innerHTML = "";
    document.getElementById(`files-${id}`).innerHTML = "";
    
    await showKeyInfo(id, title);
    if (worshipLeaderName && worshipLeaderName !== "None") {
        const preferred = await getPreferredKey(title, worshipLeaderName);
        if (preferred) {
            block.querySelector('.song-key').value = preferred;
            keyChanged(id);
        }
    }
};

window.keyChanged = async (id) => {
    const block = document.getElementById(`files-${id}`).closest('.song-block');
    const title = block.querySelector('.song-title').value;
    const key = block.querySelector('.song-key').value;
    const container = document.getElementById(`files-${id}`);
    if (!title || !key) {
        container.innerHTML = "";
        return;
    }
    const docId = title.toLowerCase().replace(/\s+/g, "-");
    const snap = await getDoc(doc(db, "songs", docId));
    if (!snap.exists()) {
        container.innerHTML = "";
        return;
    }
    const data = snap.data();
    const youtube = data.youtube || "";
    const ccli = data.ccli || "";
    const songSelectLink = ccli
        ? `https://songselect.ccli.com/Songs/${ccli}`
        : `https://songselect.ccli.com/search/results?search=${encodeURIComponent(title)}`;
    const allFiles = data.files || [];
    const selectedKey = key.trim().toLowerCase();
    const files = allFiles.filter(f => {
        if (!f.key) return false;
        return f.key.trim().toLowerCase() === selectedKey;
    });
    const grouped = {};
    files.forEach(f => {
        if (!grouped[f.type]) grouped[f.type] = [];
        grouped[f.type].push(f);
    });

    let html = `<div class="mt-4 p-4 bg-blue-50 rounded-xl border border-blue-100">`;
    html += `
        <div class="text-[11px] mb-3 flex gap-4 flex-wrap font-bold">
            ${youtube ? `<a href="${youtube}" target="_blank" class="text-red-600 hover:underline">🎬 YouTube Video</a>` : `<span class="text-gray-400">No YouTube</span>`}
            <a href="${songSelectLink}" target="_blank" class="text-purple-600 hover:underline">🔎 SongSelect</a>
            ${ccli ? `<span class="text-gray-500 ml-auto">CCLI: ${ccli}</span>` : `<span class="text-gray-400 ml-auto">No CCLI</span>`}
        </div>
    `;
    if (files.length === 0) {
        html += `<div class="text-xs text-amber-600 font-bold italic">No sheet music files found for key of ${key}</div>`;
    } else {
        Object.keys(grouped).forEach(type => {
            html += `<div class="mt-2 text-[10px] text-[#2c6999] font-extrabold uppercase tracking-widest">${type}</div><div class="flex flex-wrap gap-2 mt-1">`;
            grouped[type].forEach(file => {
                html += `<a href="${file.url}" target="_blank" class="inline-block text-[11px] bg-[#2c6999] text-white px-3 py-1.5 rounded-lg font-bold shadow-sm hover:bg-[#1e4a6d]">Open File</a>`;
            });
            html += `</div>`;
        });
    }
    html += `</div>`;
    container.innerHTML = html;
};

window.addItem = (val="") => {
    const div = document.createElement('div');
    div.className = "service-block item-block bg-[#e2e8f0] p-4 mb-4 rounded-2xl flex gap-4 items-center border border-transparent hover:border-blue-200 transition-colors";
    div.innerHTML = `
        <div class="drag-handle">⠿</div>
        <div class="w-6"></div> 
        <input value="${val}" class="item-title flex-grow bg-transparent font-bold text-[#2c6999] focus:outline-none text-lg" placeholder="Service Item Name...">
        <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>

window.loadRota = async () => {
    const date = document.getElementById('serviceDate').value;
    const snap = await getDocs(collection(db, "events"));
    eventsForDay = [];
    snap.forEach(d => {
        const ev = d.data();
        if (ev.date === date && ev.archived !== true) {
            eventsForDay.push(ev);
        }
    });
    const select = document.getElementById('eventSelect');
    select.innerHTML = '<option value="">Select Service...</option>';
    eventsForDay.forEach((ev, i) => {
        select.innerHTML += `<option value="${i}">${ev.type}</option>`;
    });
};

window.selectEvent = async () => {
    const index = document.getElementById('eventSelect').value;
    if (index === "") return;
    const data = eventsForDay[index];
    document.getElementById('serviceType').value = data.type || "";
    document.getElementById('serviceTypeNotes').value = data.description || "";
    worshipLeaderName = data.assignments?.["Worship Leader"]?.name || "None";
    document.getElementById('leaderName').innerText = worshipLeaderName;
    const teamBody = document.getElementById('teamBody');
    teamBody.innerHTML = '';
    
    const priorityTop = ["Worship Leader", "Keyboard", "Guitar"];
    const priorityBottom = ["Sound", "Words", "Camera"];
    const assignmentsArray = Object.entries(data.assignments || {});
    
    assignmentsArray.sort((a, b) => {
        const roleA = a[0];
        const roleB = b[0];
        const getRank = (role) => {
            if (priorityTop.includes(role)) return { group: 0, index: priorityTop.indexOf(role) };
            if (priorityBottom.includes(role)) return { group: 2, index: priorityBottom.indexOf(role) };
            return { group: 1, index: 0 };
        };
        const rankA = getRank(roleA);
        const rankB = getRank(roleB);
        if (rankA.group !== rankB.group) return rankA.group - rankB.group;
        if (rankA.group === 1) return roleA.localeCompare(roleB);
        return rankA.index - rankB.index;
    });

    assignmentsArray.forEach(([role, person]) => {
        teamBody.innerHTML += `
            <tr>
                <td class="w-1/4">${role}</td>
                <td class="w-1/4">${person.name}</td>
                <td><textarea class="instr-note styled-input w-full h-12" placeholder="Specific instructions..."></textarea></td>
            </tr>`;
    });
    
    const q = query(collection(db, "services"), where("date", "==", data.date));
    const snap = await getDocs(q);
    if (!snap.empty) {
        const saved = snap.docs[0].data();
        
        document.getElementById('introBox').value = saved.introText || "";
        document.getElementById('outroBox').value = saved.outroText || "";
        document.getElementById('serviceTypeNotes').value = saved.serviceNotes || "";

        const container = document.getElementById('service-order');
        container.innerHTML = "";
        
        if (saved.roleNotes) {
            const rows = document.querySelectorAll('#teamBody tr');
            rows.forEach(row => {
                const role = row.children[0].innerText;
                if (saved.roleNotes[role]) {
                    row.querySelector('.instr-note').value = saved.roleNotes[role];
                }
            });
        }

        saved.order.forEach(item => {
            if (item.type === "song") {
                const id = addSong();
                const last = container.lastChild;
                last.querySelector('.song-title').value = item.title;
                last.querySelector('.song-key').value = item.key;
                last.querySelector('.song-note').value = item.notes;
                showKeyInfo(id, item.title);
                keyChanged(id);
                
                const content = last.querySelector('.song-content');
                content.classList.remove('hidden');
                last.classList.remove('is-collapsed');
                last.querySelector('.collapse-btn').innerText = "▼";
            } else {
                addItem(item.title);
            }
        });
        updateSongNumbers();
    }
};

window.saveSchedule = async () => {
    const date = document.getElementById('serviceDate').value;
    const introText = document.getElementById('introBox').value;
    const outroText = document.getElementById('outroBox').value;
    const serviceNotes = document.getElementById('serviceTypeNotes').value;
    
    const roleNotes = {};
    document.querySelectorAll('#teamBody tr').forEach(row => {
        const role = row.children[0].innerText;
        const note = row.querySelector('.instr-note').value;
        if (note) roleNotes[role] = note;
    });

    const blocks = document.querySelectorAll('.service-block');
    const order = [];
    blocks.forEach(b => {
        if (b.classList.contains('song-block')) {
            order.push({
                type: "song",
                title: b.querySelector('.song-title').value,
                key: b.querySelector('.song-key').value,
                notes: b.querySelector('.song-note').value
            });
        } else {
            order.push({
                type: "item",
                title: b.querySelector('.item-title').value
            });
        }
    });

    const q = query(collection(db, "services"), where("date", "==", date));
    const snap = await getDocs(q);
    
    const serviceData = {
        date,
        worshipLeader: worshipLeaderName,
        serviceType: document.getElementById('serviceType').value,
        serviceNotes,
        introText,
        outroText,
        roleNotes,
        order
    };

    if (!snap.empty) {
        await updateDoc(doc(db, "services", snap.docs[0].id), serviceData);
    } else {
        await addDoc(collection(db, "services"), serviceData);
    }
    
    alert("✅ Service saved successfully.");
};

                const sSelect = data.ccli ? `https://songselect.ccli.com/Songs/${data.ccli}` : `https://songselect.ccli.com/search/results?search=${encodeURIComponent(title)}`;
                if (linksHtml) linksHtml += `<span style="color: #cbd5e1; font-size: 11px;">&nbsp;|&nbsp;</span>`;
                linksHtml += `<a href="${sSelect}" style="color: #7c3aed; text-decoration: none; font-weight: 700; font-size: 11px; padding: 0 5px;">SongSelect</a>`;
                
                if (data.files && key) {
                    const files = data.files.filter(f => f.key && f.key.trim().toLowerCase() === key.trim().toLowerCase());
                    files.forEach(f => {
                        fileLinks += `<div style="margin-top: 6px;"><a href="${f.url}" style="color: #2c6999; text-decoration: underline; font-size: 11px; font-weight: 600;">Download ${f.type}</a></div>`;
                    });
                }
            }

            htmlEmail += `
                <tr>
                    <td style="padding: 15px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top;">
                        <p style="font-weight: 800; font-size: 14px; color: #1e293b; margin: 0; mso-line-height-rule: exactly; line-height: 16px;">${songIdx}. ${title}</p>
                        ${notes ? `<p style="font-style: italic; font-size: 11px; color: #64748b; margin: 4px 0 0 0; mso-line-height-rule: exactly; line-height: 13px;">${notes}</p>` : ''}
                    </td>
                    <td style="padding: 15px 10px; border-bottom: 1px solid #f1f5f9; text-align: center; vertical-align: top; font-weight: 700; color: #2c6999; font-size: 14px;">${key || '-'}</td>
                    <td style="padding: 15px 10px; border-bottom: 1px solid #f1f5f9; text-align: center; vertical-align: top;">
                        <div style="margin-bottom: 5px;">${linksHtml}</div>
                        ${fileLinks}
                    </td>
                </tr>
            `;
            songIdx++;
        } else {
            const item = b.querySelector('.item-title').value;
            if (item) {
                htmlEmail += `
                    <tr>
                        <td colspan="3" style="padding: 12px 10px; background-color: #f8fafc; border-left: 4px solid #2c6999; font-weight: 800; font-size: 12px; color: #2c6999; text-transform: uppercase; letter-spacing: 0.5px;">
                            ${item}
                        </td>
                    </tr>
                `;
            }
        }
    }
    
    htmlEmail += `</tbody></table>`;

    // Restore Spacer Table Rows for Vertical Gap
    htmlEmail += `
        <table border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr><td height="20" style="font-size:1px; line-height:1px;">&nbsp;</td></tr>
        </table>
    `;

    // Team section
    htmlEmail += `
        <p style="font-size: 10.0pt; font-weight: 700; color: #2c6999; margin: 0; mso-line-height-rule: exactly; line-height: 12.0pt;">Our team for this Sunday is:</p>
        
        <p style="margin:0; font-size:10pt;">&nbsp;</p>

        <table style="width: 100%; border-collapse: collapse; margin: 0;">
            <tbody>
    `;

    let rosterNames = [];
    document.querySelectorAll('#teamBody tr').forEach(row => {
        const role = row.children[0]?.innerText || "";
        const name = row.children[1]?.innerText || "";
        const note = row.querySelector('.instr-note').value;
        if(name && name !== "None") rosterNames.push(name.trim());

        let roleColor = "#2c6999";
        if (role === "Sound") roleColor = "#3B7D23";

        htmlEmail += `
            <tr>
                <td width="35%" style="width:35%; padding: 9.0pt 0; border-bottom: 1px solid #f0f4f8; font-weight: normal; color: ${roleColor}; font-size: 10.0pt; vertical-align: top; mso-line-height-rule: exactly; line-height: 12.0pt;">${role}</td>
                <td style="padding: 9.0pt 0; border-bottom: 1px solid #f0f4f8; font-size: 10.0pt; color: #000; vertical-align: top; mso-line-height-rule: exactly; line-height: 12.0pt;">
                    ${name}
                    ${note ? `<br><span style="font-size: 9.0pt; color: #666; font-style: italic;">Note: ${note}</span>` : ''}
                </td>
            </tr>`;
    });
    htmlEmail += `</tbody></table>`;

    // Final Spacer before Outro
    htmlEmail += `
        <table border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr><td height="30" style="font-size:1px; line-height:1px;">&nbsp;</td></tr>
        </table>
    `;

    // Outro Remarks at the bottom
    if (outroText) {
        htmlEmail += `
            <div style="font-size: 14px; color: #444; margin: 0; mso-line-height-rule: exactly; line-height: 16px;">${outroText.replace(/\n/g, '<br>')}</div>
        `;
    }

    htmlEmail += `<p style="margin-top: 40px; font-size: 10px; color: #94a3b8; text-align: center;">Generated via EGBC Worship Planner</p></div>`;

    const type = "text/html";
    const blob = new Blob([htmlEmail], { type });
    const dataTransfer = [new ClipboardItem({ [type]: blob })];

    try {
        await navigator.clipboard.write(dataTransfer);
        let recipients = [];
        addressBook.forEach(p => {
            const isCore = p.markers && p.markers.includes("Core Team");
            if ((rosterNames.includes(p.name?.trim()) || isCore) && p.email) {
                recipients.push(p.email);
            }
        });
        const to = [...new Set(recipients)].join(",");
        alert("Plan copied to clipboard!");
        window.location.href = `mailto:${to}?subject=${encodeURIComponent("Sunday Worship Plan: " + date)}`;
    } catch (e) { alert("Error: Clipboard access denied."); }
};
</script>
</head>

<body class="p-4 md:p-12">

<div class="max-w-[1200px] mx-auto space-y-10">

    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
        <div class="flex items-center gap-6">
            <img src="https://firebasestorage.googleapis.com/v0/b/egbc-worship-planner.firebasestorage.app/o/1774936285076.png?alt=media&token=ea8cd929-6f35-4a23-9ffa-e78ac46fa300" alt="Logo" class="h-16 w-auto">
            <div>
                <h1 class="text-3xl font-extrabold text-[#2c6999] tracking-tight">Worship Planner</h1>
                <p class="text-sm font-bold text-gray-400 uppercase tracking-widest mt-1">Leader: <span id="leaderName" class="text-[#2c6999]">None</span></p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 w-full md:w-auto">
            <input type="date" id="serviceDate" onchange="loadRota()" class="styled-input text-sm">
            <select id="eventSelect" onchange="selectEvent()" class="styled-input text-sm">
                <option value="">Select Service...</option>
            </select>
            <input id="serviceType" class="styled-input text-sm" placeholder="Service Type">
            <input id="serviceTypeNotes" class="styled-input text-sm" placeholder="General Notes">
        </div>
    </div>

    <div class="space-y-2">
        <label class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-gray-400 ml-4">Opening Remarks / Call to Worship</label>
        <textarea id="introBox" class="w-full h-24 styled-input !bg-white" placeholder="Write any opening instructions or liturgy here..."></textarea>
    </div>

    <div class="space-y-6">
        <div class="flex justify-between items-center px-4">
            <h2 class="text-xl font-extrabold text-[#2c6999]">Order of Service</h2>
            <div class="flex gap-2">
                <button onclick="addSong()" class="btn-secondary text-sm !py-2">+ Add Song</button>
                <button onclick="addItem()" class="btn-secondary text-sm !py-2">+ Add Item</button>
            </div>
        </div>
        
        <div id="service-order" class="space-y-2"></div>
    </div>

    <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
        <h2 class="text-xl font-extrabold text-[#2c6999] mb-6">Service Team & Roles</h2>
        <div class="overflow-x-auto">
            <table class="rota-table">
                <thead>
                    <tr>
                        <th>Role</th>
                        <th>Assigned Member</th>
                        <th>Role Specific Notes</th>
                    </tr>
                </thead>
                <tbody id="teamBody"></tbody>
            </table>
        </div>
    </div>

    <div class="space-y-2">
        <label class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-gray-400 ml-4">Closing Remarks / Blessing</label>
        <textarea id="outroBox" class="w-full h-24 styled-input !bg-white" placeholder="Closing prayers, blessings or final notices..."></textarea>
    </div>

    <div class="flex justify-center gap-6 pt-6 pb-12">
        <button onclick="saveSchedule()" class="btn-primary w-48 shadow-lg shadow-blue-200">Save Schedule</button>
        <button onclick="emailSchedule()" class="btn-secondary w-48">Email Team</button>
    </div>

</div>
</body>
</html>
