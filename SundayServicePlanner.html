<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EGBC Sunday Worship Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>
body { font-family: 'Montserrat', sans-serif; background-color: #f0f4f8; }
.styled-input { background:#fff;border:2px solid #e2e8f0;border-radius:.75rem;padding:.75rem 1rem;font-weight:600;color:#2c6999;}
.styled-input:focus {outline:none;border-color:#2c6999;box-shadow:0 0 0 3px rgba(44,105,153,.1);}
.btn-primary {background:#2c6999;color:#fff;padding:.75rem 1.5rem;border-radius:.75rem;font-weight:700;}
.btn-secondary {background:#fff;color:#2c6999;border:2px solid #2c6999;padding:.75rem 1.5rem;border-radius:.75rem;font-weight:700;}
.drag-handle {cursor:grab;color:#cbd5e1;font-size:1.5rem;}
.rota-table {width:100%;border-spacing:0 .5rem;}
.rota-table td {padding:1rem;background:#fff;}
textarea {resize:none;}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
    apiKey: "AIzaSyCl2enA5LPKrHcxYP1K64c1ZNK744RO9R4",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
});
const db = getFirestore(app);

let worshipLeaderName = "";
let eventsForDay = [];

window.onload = () => {
    Sortable.create(document.getElementById('service-order'), {
        animation:150,
        handle:'.drag-handle'
    });
};

window.loadRota = async () => {
    const date = document.getElementById('serviceDate').value;
    const snap = await getDocs(collection(db,"events"));
    eventsForDay=[];
    snap.forEach(d=>{
        const ev=d.data();
        if(ev.date===date && ev.archived!==true) eventsForDay.push(ev);
    });

    const select=document.getElementById('eventSelect');
    select.innerHTML='<option value="">Select Service...</option>';
    eventsForDay.forEach((ev,i)=>{
        select.innerHTML+=`<option value="${i}">${ev.type}</option>`;
    });
};

window.selectEvent = async () => {
    const index=document.getElementById('eventSelect').value;
    if(index==="") return;

    const data=eventsForDay[index];

    document.getElementById('serviceType').value=data.type||"";
    document.getElementById('serviceTypeNotes').value=data.description||"";
    document.getElementById('serviceTime').value=data.time||""; // ✅ FIX 1

    worshipLeaderName=data.assignments?.["Worship Leader"]?.name||"None";
    document.getElementById('leaderName').innerText=worshipLeaderName;

    const teamBody=document.getElementById('teamBody');
    teamBody.innerHTML='';

    // ✅ FIX 3 (multiple Others)
    const rawAssignments=Object.entries(data.assignments||{});
    const assignmentsArray=[];
    let otherCount=1;

    rawAssignments.forEach(([role,person])=>{
        if(role==="Other"){
            assignmentsArray.push([`Other ${otherCount++}`,person]);
        } else {
            assignmentsArray.push([role,person]);
        }
    });

    // ✅ FIX 4 (force singers)
    ["Singer 1","Singer 2","Singer 3"].forEach(role=>{
        if(!assignmentsArray.find(r=>r[0]===role)){
            assignmentsArray.push([role,{name:""}]);
        }
    });

    assignmentsArray.forEach(([role,person])=>{
        teamBody.innerHTML+=`
        <tr>
            <td>${role}</td>
            <td>${(person.name||"").replace(/'/g,"&#39;")}</td> <!-- ✅ FIX 2 -->
            <td><textarea class="instr-note styled-input w-full h-12"></textarea></td>
        </tr>`;
    });

    // ✅ PRESERVE EXISTING DRAG SYSTEM
    if(window.initRoleDragDrop){
        window.initRoleDragDrop();
    }
};

window.saveSchedule = async () => {
    const date=document.getElementById('serviceDate').value;
    const time=document.getElementById('serviceTime').value; // ✅ FIX 1

    await addDoc(collection(db,"services"),{
        date,
        time, // ✅ FIX 1
        worshipLeader:worshipLeaderName,
        serviceType:document.getElementById('serviceType').value
    });

    alert("Saved");
};
</script>
</head>

<body class="p-6">

<div class="max-w-4xl mx-auto space-y-6">

<div class="bg-white p-6 rounded-xl shadow">
    <div class="grid grid-cols-2 gap-2">
        <input type="date" id="serviceDate" onchange="loadRota()" class="styled-input">
        <input type="time" id="serviceTime" class="styled-input"> <!-- ✅ FIX 1 -->
        <select id="eventSelect" onchange="selectEvent()" class="styled-input"></select>
        <input id="serviceType" class="styled-input" placeholder="Service Type">
        <input id="serviceTypeNotes" class="styled-input" placeholder="Notes">
    </div>
</div>

<div id="service-order"></div>

<div class="bg-white p-6 rounded-xl shadow">
    <h2 class="font-bold mb-4">Team</h2>
    <table class="rota-table w-full">
        <tbody id="teamBody"></tbody>
    </table>
</div>

<div class="text-center">
    <button onclick="saveSchedule()" class="btn-primary">Save</button>
</div>

</div>

</body>
</html>
