<!DOCTYPE html>
<html>
<head>
<title>Song Planner</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body { font-family: Arial; padding: 40px; }

#suggestions {
    border: 1px solid #ddd;
    max-width: 300px;
}

#suggestions div {
    padding: 5px;
    cursor: pointer;
}

#suggestions div:hover {
    background: #f0f0f0;
}

.file-button {
    display: inline-block;
    margin: 5px;
    padding: 6px 12px;
    background: #2c6999;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    font-size: 12px;
}
</style>
</head>

<body>

<h2>Song Planner</h2>

<input id="songInput" placeholder="Type song name..." oninput="suggestSongs()">
<div id="suggestions"></div>

<br><br>

<div id="filesContainer"></div>

<script>

const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "egbc-worship-planner.firebaseapp.com",
    projectId: "egbc-worship-planner"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

// NORMALISE
function normalizeTitle(title) {
    return title.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim();
}

// SUGGEST SONGS
async function suggestSongs() {

    const input = document.getElementById("songInput").value;
    const norm = normalizeTitle(input);

    if (norm.length < 2) return;

    const snapshot = await db.collection("songs").get();

    const matches = snapshot.docs
        .map(doc => doc.data())
        .filter(song => song.normalized && song.normalized.includes(norm));

    const box = document.getElementById("suggestions");

    box.innerHTML = matches.map(s => `
        <div onclick="selectSong('${s.title}')">
            ${s.title}
        </div>
    `).join("");
}

// SELECT SONG
function selectSong(title) {
    document.getElementById("songInput").value = title;
    document.getElementById("suggestions").innerHTML = "";

    loadFiles(title);
}

// LOAD FILES
async function loadFiles(title) {

    const container = document.getElementById("filesContainer");
    container.innerHTML = "Loading...";

    const id = title.toLowerCase().replace(/\s+/g, "-");

    const doc = await db.collection("songs").doc(id).get();

    if (!doc.exists) {
        container.innerHTML = "No files found";
        return;
    }

    const files = doc.data().files || [];

    if (files.length === 0) {
        container.innerHTML = "No files uploaded";
        return;
    }

    // GROUP FILES BY TYPE
    const grouped = {};

    files.forEach(file => {
        if (!grouped[file.type]) grouped[file.type] = [];
        grouped[file.type].push(file);
    });

    let html = "";

    Object.keys(grouped).forEach(type => {

        html += `<div><strong>${type}</strong><br>`;

        grouped[type].forEach(file => {
            html += `
                <a class="file-button" href="${file.url}" target="_blank">
                    Open
                </a>
            `;
        });

        html += `</div><br>`;
    });

    container.innerHTML = html;
}

</script>

</body>
</html>
